<!DOCTYPE html>

<!-- FreeSans и Eloquia в открытом доступе нет: вместо FreeSans — Arimo (гротеск с метрикой Helvetica), вместо Eloquia — Jost (переменный геометрический 200–800),
     вес заголовков по-прежнему задаёт font-variation-settings. У обоих есть кириллица. ?lang=ru — русская версия. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Jost:wght@200..800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
:root{
  --W:1464;--H:949;--photoW:836;--paneW:628;--cardW:613;--cardH:922;
  --badge-fs:13.60px;--badge-fw:400;--badge-ls:-0.163px;--badge-gap:10px;--badge-dy:0px;--badge-ws:0px;
  --badge-left:34px;--badge-top:684px;
  --hl-lh:1;--hl-wght:578;
  --hl1-fs:69.14px;--hl1-ls:-1.936px;--hl1-ws:0px;--hl1-left:33.00px;--hl1-top:750.02px;
  --hl2-fs:68.95px;--hl2-ls:-1.931px;--hl2-left:32.00px;--hl2-top:831.01px;
  --h1-top:65.00px;--h1-fs:42.55px;--h1-ls:-2.553px;--h1-ws:1.300px;--h1-wght:584;
  --sub-top:120.00px;--sub-fs:20.41px;--sub-ls:-0.245px;--sub-ws:-2.000px;--sub-fw:400;--sub-fwb:700;
  --fieldpad:19px;
  --eph-fs:15.68px;--eph-ls:-0.188px;--eph-left:17.0px;--eph-fw:400;--eph-ws:0px;
  --pph-fs:17.29px;--pph-ls:-0.698px;--pph-left:18px;--pph-fw:400;
  --login-fs:16.38px;--login-fw:400;--login-ls:0.200px;--login-gap:10px;--login-dy:0.00px;--login-padl:-12.00px;
  --arrow-w:13.2px;
  --div-top:477px;--or-fs:11.5px;--or-fw:700;--or-ls:0.8px;--or-dy:2.00px;--or-dx:0.00px;
  --or-line-l:205px;--or-line-r:204px;
  --g-gap:17px;--g-icon:18.5px;
  --gt-fs:18.10px;--gt-fw:400;--gt-ls:-0.217px;--gt-ws:-1.000px;--gt-dy:1.00px;
  --bt-top:611.00px;--bt-fs:16.37px;--bt-fw:400;--bt-ls:-0.196px;--bt-ws:-2.060px;--bt-fwb:700;--bt-uo:3px;
  --card-shadow:1px 10px 14px rgba(10,14,20,0.14), 0 1px 3px rgba(10,14,20,0.05);
  --cs:1;
  --ink:#000;          --h1-color:#2c3343;   --sub-grey:#797979;
  --badge-bg:#2f2a27;  --ph:#606060;         --or:#5a5a5b;
  --gtext:#232424;     --bottom:#0a0a0a;
  --btn1:#283139;      --btn2:#293340;
  --inputFill:#fafafa; --inputBorder:#acacae; --pwFill:#f9f9f9;
  --gBorder:#c8c8ca;   --divider:#b1b1b2;     --page:#fefefe;
  --mobile-hero-h:clamp(244px,34svh,304px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;background:var(--page);margin:0}
body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;overflow:hidden;color:var(--ink);
  font-family:'Arimo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
button,input{font:inherit;color:inherit}
.stage{position:fixed;inset:0;overflow:hidden}

/* фото */
.photo{position:absolute;left:0;top:0;height:100%;width:57.1038%;overflow:hidden;background:#e7e7e8}
.photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 50%;display:block;-webkit-user-drag:none}
.photo-img--wide{display:none}
.scrim{display:none;position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 100%)}
.hero{position:absolute;left:0;bottom:0;width:836px;height:949px;transform-origin:left bottom;pointer-events:none}
.hero>*{pointer-events:auto}
.badge{position:absolute;left:var(--badge-left);top:var(--badge-top);display:inline-flex;align-items:center;gap:var(--badge-gap);height:37px;padding:0 16px 0 19px;border-radius:999px;
  background:var(--badge-bg);-webkit-backdrop-filter:blur(7px) saturate(120%);backdrop-filter:blur(7px) saturate(120%);
  box-shadow:0 1px 2px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14);color:#fff;white-space:nowrap;
  font-size:var(--badge-fs);font-weight:var(--badge-fw);letter-spacing:var(--badge-ls);word-spacing:var(--badge-ws)}
.badge svg{position:relative;top:-1px;width:17px;height:16.27px;flex:none}
.badge span{position:relative;top:var(--badge-dy)}
.hl{position:absolute;font-family:'Jost',sans-serif;font-weight:400;font-variation-settings:'wght' var(--hl-wght);line-height:var(--hl-lh);color:var(--ink);white-space:nowrap}
#hl1{left:var(--hl1-left);top:var(--hl1-top);font-size:var(--hl1-fs);letter-spacing:var(--hl1-ls);word-spacing:var(--hl1-ws)}
#hl2{left:var(--hl2-left);top:var(--hl2-top);font-size:var(--hl2-fs);letter-spacing:var(--hl2-ls)}

/* логотип g.a.d. */
.gad{position:absolute;right:34px;top:30px;z-index:3;display:block;color:#0a0a0a}
.gad svg{display:block;height:26px;width:auto;overflow:visible}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}

/* карточка */
.pane{position:absolute;left:57.1038%;right:0;top:0;bottom:0}
.card{position:absolute;left:1px;top:14px;width:613px;height:922px;border-radius:26px;overflow:hidden;background:rgba(254,254,254,.90);
  -webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(0,0,0,.036);box-shadow:var(--card-shadow)}
.card-in{position:absolute;left:0;top:0;width:613px;height:922px;transform-origin:left top}
.card-in>*{position:absolute;margin:0}
.col{left:62px;width:488px}
.center{text-align:center}
#h1{top:var(--h1-top);font-family:'Jost',sans-serif;font-weight:400;font-variation-settings:'wght' var(--h1-wght);font-size:var(--h1-fs);letter-spacing:var(--h1-ls);word-spacing:var(--h1-ws);line-height:1;color:var(--h1-color)}
#sub{top:var(--sub-top);font-size:var(--sub-fs);letter-spacing:var(--sub-ls);word-spacing:var(--sub-ws);font-weight:var(--sub-fw);line-height:1.2;color:var(--sub-grey)}
#sub b{font-weight:var(--sub-fwb);color:var(--h1-color)}
.field{left:62px;width:489px;display:flex;align-items:center;border-radius:12px}
.field input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:#111;padding:0 var(--fieldpad) 0 0;border-radius:inherit}
.field input::placeholder{color:var(--ph);opacity:1}
#email{top:203px;height:61px;background:var(--inputFill);border:1.5px solid var(--inputBorder)}
#email input{padding-left:var(--eph-left);font-size:var(--eph-fs);letter-spacing:var(--eph-ls);font-weight:var(--eph-fw);word-spacing:var(--eph-ws)}
#pw{top:273.5px;height:59px;background:var(--pwFill);border:0}
#pw input{padding-left:var(--pph-left);font-size:var(--pph-fs);letter-spacing:var(--pph-ls);font-weight:var(--pph-fw)}
#loginBtn{left:62px;top:366px;width:489px;height:65.5px;border:0;border-radius:999px;background:linear-gradient(180deg,var(--btn1) 0%,var(--btn2) 100%);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:var(--login-gap);padding-left:var(--login-padl);padding-right:4px;cursor:pointer;
  box-shadow:0 8px 20px rgba(18,26,34,.16), 0 2px 5px rgba(18,26,34,.10);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, filter .18s ease}
#loginBtn:hover{filter:brightness(1.12)}
#loginBtn:active{transform:translateY(1px)}
#loginBtn span{font-size:var(--login-fs);font-weight:var(--login-fw);letter-spacing:var(--login-ls);transform:translateY(var(--login-dy))}
#loginBtn svg{width:var(--arrow-w);height:var(--arrow-w);flex:none;overflow:visible}
.divider{left:63px;top:var(--div-top);width:487px;display:flex;align-items:center;justify-content:center}
.divider i{display:block;height:1.5px;background:var(--divider)}
.divider i:first-child{flex:0 0 var(--or-line-l)}
.divider i:last-child{flex:0 0 var(--or-line-r)}
.divider b{flex:1 1 auto;text-align:center;line-height:1;font-size:var(--or-fs);font-weight:var(--or-fw);letter-spacing:var(--or-ls);color:var(--or);transform:translate(var(--or-dx),var(--or-dy))}
#gBtn{left:62px;top:535px;width:489px;height:59.5px;border:1.5px solid var(--gBorder);border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(0,0,0,.03);
  display:flex;align-items:center;justify-content:center;gap:var(--g-gap);cursor:pointer;
  transition:background .18s ease, box-shadow .18s ease, transform .18s cubic-bezier(.2,.7,.3,1)}
#gBtn:hover{background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07)}
#gBtn:active{transform:translateY(1px)}
#gBtn svg{width:var(--g-icon);height:var(--g-icon);flex:none}
#gBtn span{font-size:var(--gt-fs);font-weight:var(--gt-fw);letter-spacing:var(--gt-ls);word-spacing:var(--gt-ws);color:var(--gtext);transform:translateY(var(--gt-dy))}
#bottom{left:62px;width:489px;top:var(--bt-top);text-align:center;font-size:var(--bt-fs);font-weight:var(--bt-fw);letter-spacing:var(--bt-ls);word-spacing:var(--bt-ws);color:var(--bottom)}
#bottom a{color:#000;font-weight:var(--bt-fwb);text-decoration:underline;text-underline-offset:var(--bt-uo);text-decoration-thickness:2px}
:focus-visible{outline:2px solid #2b6cb0;outline-offset:2px}

/* планшет стоя: фото — полоса сверху, карточка под ней, внутренности текут по переменным --tp-* */
.tabport .photo{width:100%;height:var(--band-h)}
.tabport .photo-img--tall{display:none}
.tabport .photo-img--wide{display:block;object-position:50% 50%}
.tabport .hero{left:var(--tp-side);right:var(--tp-side);bottom:var(--tp-hero-b);width:auto;height:auto;transform:none;display:flex;flex-direction:column;align-items:flex-start;gap:var(--tp-hero-gap)}
.tabport .badge{position:relative;left:auto;top:auto;height:calc(37px*var(--badge-k));padding:0 calc(16px*var(--badge-k)) 0 calc(19px*var(--badge-k));font-size:calc(13.6px*var(--badge-k));gap:calc(10px*var(--badge-k))}
.tabport .badge svg{width:calc(17px*var(--badge-k));height:calc(16.27px*var(--badge-k))}
.tabport .hl-wrap{position:relative;font-family:'Jost',sans-serif;font-size:var(--tp-hero-fs);line-height:1.1246}
.tabport #hl1,.tabport #hl2{position:static;white-space:normal;font-size:var(--tp-hero-fs);letter-spacing:-.028em;line-height:1.1246}
.tabport .card-in{inset:0;width:auto;height:auto;transform:none}
.tabport .col,.tabport .field,.tabport #loginBtn,.tabport .divider,.tabport #gBtn,.tabport #bottom{left:var(--tp-pad);right:var(--tp-pad);width:auto}
.tabport #h1{top:var(--tp-h1-top);font-size:var(--tp-h1-fs);letter-spacing:-.06em;word-spacing:.03em}
.tabport #sub{top:var(--tp-sub-top);font-size:var(--tp-sub-fs);letter-spacing:-.012em;word-spacing:-.1em}
.tabport #email{top:var(--tp-em-top);height:var(--tp-em-h);border-radius:var(--tp-em-r)}
.tabport #pw{top:var(--tp-pw-top);height:var(--tp-pw-h);border-radius:var(--tp-em-r)}
.tabport #email input,.tabport #pw input{font-size:max(16px,var(--tp-eph-fs));padding-left:var(--tp-eph-pad)}
.tabport #loginBtn{top:var(--tp-btn-top);height:var(--tp-btn-h);gap:var(--tp-btn-gap)}
.tabport #loginBtn span{font-size:var(--tp-btn-fs)}
.tabport #loginBtn svg{width:var(--tp-arrow);height:var(--tp-arrow)}
.tabport .divider{top:var(--tp-div-top)}
.tabport .divider i:first-child,.tabport .divider i:last-child{flex:1 1 auto;height:var(--tp-div-h)}
.tabport .divider b{flex:none;padding:0 var(--tp-or-pad);font-size:var(--tp-or-fs)}
.tabport #gBtn{top:var(--tp-g-top);height:var(--tp-g-h);gap:var(--tp-g-gap)}
.tabport #gBtn svg{width:var(--tp-g-icon);height:var(--tp-g-icon)}
.tabport #gBtn span{font-size:var(--tp-gt-fs)}
.tabport #bottom{top:var(--tp-bt-top);font-size:var(--tp-bt-fs)}

/* телефон: обычная прокрутка, ничего не масштабируется */
body.stacked{height:auto;min-height:100%;overflow-y:auto;background:#fff}
.stacked .stage{position:relative;inset:auto;display:flex;flex-direction:column;min-height:100svh;overflow:visible}
.stacked .photo{position:relative;width:100%;height:var(--mobile-hero-h);flex:none}
.stacked .photo-img--tall{display:none}
.stacked .photo-img--wide{display:block;object-position:64% 48%;transform:scale(1.015)}
.stacked .scrim{display:block;background:linear-gradient(180deg,rgba(7,10,13,.02) 18%,rgba(7,10,13,.12) 48%,rgba(7,10,13,.78) 100%)}
.stacked .gad{right:clamp(20px,6vw,30px);top:max(20px,env(safe-area-inset-top))}
.stacked .gad svg{height:22px}
.stacked .hero{left:clamp(20px,6vw,32px);right:clamp(20px,6vw,32px);bottom:48px;width:auto;height:auto;transform:none;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.stacked .badge{position:relative;left:auto;top:auto;height:31px;padding:0 12px;gap:8px;font-size:11px;background:rgba(24,27,30,.82);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.stacked .badge svg{width:13px;height:12.5px}
.stacked #hl1,.stacked #hl2{position:static;display:block;white-space:normal;color:#fff;font-size:clamp(30px,8.8vw,38px);letter-spacing:-.035em;line-height:.96;text-shadow:0 2px 18px rgba(0,0,0,.32)}
.stacked .pane{position:relative;left:auto;right:auto;top:auto;bottom:auto;flex:1 0 auto;display:flex;flex-direction:column}
.stacked .card{position:relative;left:auto;top:auto;width:auto;height:auto;flex:1 0 auto;display:flex;flex-direction:column;margin:-28px 0 0;border-radius:28px 28px 0 0;background:#fff;border:0;
  -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 -10px 28px rgba(20,28,36,.10);min-height:calc(100svh - var(--mobile-hero-h) + 28px)}
.stacked .card-in{position:relative;flex:1 0 auto;width:100%;height:auto;max-width:500px;margin:0 auto;transform:none;display:flex;flex-direction:column;justify-content:center;
  padding:36px clamp(24px,7vw,38px) max(30px,env(safe-area-inset-bottom))}
.stacked .card-in>*{position:static;width:100%}
.stacked #h1{font-size:clamp(31px,8.8vw,38px);letter-spacing:-.05em;margin-bottom:10px}
.stacked #sub{font-size:15px;letter-spacing:-.01em;word-spacing:0;margin-bottom:26px}
.stacked #email,.stacked #pw{height:56px;flex:none}
.stacked #email input,.stacked #pw input{font-size:16px;letter-spacing:0}
.stacked #email{margin-bottom:12px}
.stacked #pw{margin-bottom:22px}
.stacked #loginBtn{height:58px;flex:none;padding-left:0}
.stacked .divider{margin:22px 0}
.stacked .divider i:first-child,.stacked .divider i:last-child{flex:1 1 auto}
.stacked .divider b{flex:none;padding:0 14px}
.stacked #gBtn{height:56px;flex:none}
.stacked #gBtn span{font-size:16px}
.stacked #bottom{margin-top:24px;font-size:14px;word-spacing:0}
@media (max-width:370px){
  :root{--mobile-hero-h:232px}
  .stacked .card-in{padding:30px 20px max(24px,env(safe-area-inset-bottom))}
  .stacked #hl1,.stacked #hl2{font-size:30px}
}
@media (max-height:520px) and (orientation:landscape){
  :root{--mobile-hero-h:208px}
  .stacked .card-in{justify-content:flex-start}
}

/* первый кадр входа */
.entry-pending .card,.entry-pending .badge,.entry-pending #hl1,.entry-pending #hl2,.entry-pending #h1,.entry-pending #sub,.entry-pending #email,
.entry-pending #pw,.entry-pending #loginBtn,.entry-pending .divider,.entry-pending #gBtn,.entry-pending #bottom{opacity:0;will-change:transform,opacity,clip-path}
.entry-pending .card{transform:translateY(12px) scale(.988)}
.entry-pending .badge{transform:translateY(8px)}
.entry-pending #hl1,.entry-pending #hl2{transform:translateY(16px);clip-path:inset(100% 0 0 0)}
.entry-pending #h1,.entry-pending #sub{transform:translateY(10px)}
.entry-pending #email,.entry-pending #pw,.entry-pending #loginBtn,.entry-pending .divider,.entry-pending #gBtn,.entry-pending #bottom{transform:translateY(8px)}
@media (max-width:699px){
  .entry-pending .card{transform:translateY(14px)}
  .entry-pending #hl1,.entry-pending #hl2{transform:translateY(12px)}
}
@media (prefers-reduced-motion:reduce){
  .entry-pending .card,.entry-pending .badge,.entry-pending #hl1,.entry-pending #hl2,.entry-pending #h1,.entry-pending #sub,.entry-pending #email,
  .entry-pending #pw,.entry-pending #loginBtn,.entry-pending .divider,.entry-pending #gBtn,.entry-pending #bottom{opacity:1;transform:none;clip-path:none;will-change:auto}
  *{transition:none!important;animation:none!important}
  .gad .ring{stroke-dashoffset:0}.gad .orb{opacity:1}
}
</style>
</head>
<body>

(function(){

/* раскладка: три режима */
(function(){
  var REF_W=1464, REF_H=949, PHOTO_W=836, PANE_W=628, CARD_W=613, CARD_H=922;
  var CONTENT_H=697;
  var IMG_W=1177, IMG_H=1336, IMG_REF_SCALE=836/1177;
  var PANE_RATIO=PANE_W/REF_W;
  var HERO_W=681, HERO_H=219;
  var REF_CARD_ASPECT=692/855;
  var RAMP_HI=1280, RAMP_LO=1000, PHOTO_MIN=0.42;
  var RAMP_LO2=820, PHOTO_MIN2=0.36;
  var TP={"pad":0.1076,"h1Top":0.08656,"h1Fs":0.06839,"subTop":0.17368,"subFs":0.0309,"emTop":0.25435,"emH":0.10257,"emR":0.0202,"ephFs":0.02702,"ephPad":0.0332,"pwTop":0.36851,"pwH":0.10839,"btnTop":0.50435,"btnH":0.10981,"btnFs":0.0275,"arrow":0.026,"btnGap":0.02,"divTop":0.68222,"orFs":0.02245,"orPad":0.051,"divH":0.0026,"gTop":0.76445,"gH":0.09966,"gIcon":0.032,"gtFs":0.03205,"gGap":0.026,"btTop":0.89668,"btFs":0.02876,"heroFs":0.1058,"badgeH":0.0742,"heroLh":1.1246,"heroBot":0.06493,"heroGap":-0.30423,"heroSide":0.0525};
  var VERT={h1Top:1,subTop:1,emTop:1,emH:1,pwTop:1,pwH:1,btnTop:1,btnH:1,divTop:1,gTop:1,gH:1,btTop:1}, WIDE={pad:1,orPad:1},
      BAND={heroFs:1,badgeH:1,heroLh:1,heroBot:1,heroGap:1,heroSide:1};
  var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
  var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');
  var body=document.body, photo=document.querySelector('.photo'), pane=document.querySelector('.pane'), card=document.getElementById('card'),
      cardIn=document.getElementById('cardIn'), hero=document.getElementById('hero'), wrap=document.querySelector('.hl-wrap');
  var mode='';
  function clearInline(){ [photo,pane,card,cardIn,hero,wrap].forEach(function(el){ el.style.cssText=''; }); }
  function setMode(m){
    if (m===mode) return;
    mode=m; clearInline();
    body.classList.toggle('tabport', m==='tabport');
    body.classList.toggle('stacked', m==='phone');
  }
  function photoRatio(vw){
    var base=1-PANE_RATIO;
    if (vw>=RAMP_HI) return base;
    if (vw>=RAMP_LO) return PHOTO_MIN+(base-PHOTO_MIN)*(vw-RAMP_LO)/(RAMP_HI-RAMP_LO);
    if (vw>=RAMP_LO2) return PHOTO_MIN2+(PHOTO_MIN-PHOTO_MIN2)*(vw-RAMP_LO2)/(RAMP_LO-RAMP_LO2);
    return PHOTO_MIN2;
  }
  function placeCard(paneW, vh){
    var cs=Math.min(paneW/PANE_W, vh/CONTENT_H);
    var gapL=1*cs, mT=14*cs, mB=13*cs, mR=14*cs;
    var cw=Math.max(CARD_W*cs, paneW-gapL-mR), ch=vh-mT-mB, st=card.style;
    st.left=gapL+'px'; st.top=mT+'px'; st.width=cw+'px'; st.height=ch+'px';
    st.borderRadius=(26*cs)+'px'; st.borderWidth=Math.max(1,cs)+'px';
    cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
  }
  function seatHero(photoW, vh){
    var bandH=vh;
    var imgScale=Math.max(photoW/IMG_W, bandH/IMG_H);
    var s=Math.min(imgScale/IMG_REF_SCALE, photoW*0.92/HERO_W);
    hero.style.bottom='0'; hero.style.transform='scale('+s+')';
  }
  function headlineMeasure(){
    var h=document.getElementById('hl1'), cs=getComputedStyle(h), s=document.createElement('span');
    ['fontFamily','fontSize','fontWeight','letterSpacing','wordSpacing','fontVariationSettings'].forEach(function(k){ s.style[k]=cs[k]; });
    s.style.position='absolute'; s.style.visibility='hidden'; s.style.whiteSpace='nowrap'; s.style.left='-9999px';
    s.textContent=h.textContent+' '+document.getElementById('hl2').textContent;
    body.appendChild(s); var w=s.getBoundingClientRect().width; s.remove(); return w;
  }
  function kebab(k){ return '--tp-'+k.replace(/[A-Z]/g, function(c){ return '-'+c.toLowerCase(); }); }
  function tabport(vw, vh){
    var band=Math.round(vh*0.425), side=Math.round(vw*0.0525), foot=Math.round(vh*0.0297);
    photo.style.setProperty('--band-h', band+'px');
    photo.style.setProperty('--tp-side', side+'px');
    photo.style.setProperty('--tp-hero-b', Math.round(band*TP.heroBot)+'px');
    photo.style.setProperty('--tp-hero-fs', (band*TP.heroFs).toFixed(2)+'px');
    // ponytail: отрицательный heroGap из ТЗ как gap не работает (gap < 0 недопустим) — отступ между плашкой и заголовком берём 3% полосы
    photo.style.setProperty('--tp-hero-gap', Math.round(band*0.03)+'px');
    photo.style.setProperty('--badge-k', (band*TP.badgeH/37).toFixed(4));
    var gapT=Math.round(side*0.5), cw=vw-2*side, ch=vh-band-gapT-foot;
    pane.style.left='0'; pane.style.top=band+'px';
    card.style.left=side+'px'; card.style.top=gapT+'px'; card.style.width=cw+'px'; card.style.height=ch+'px';
    var S=Math.min(ch, cw*REF_CARD_ASPECT);
    Object.keys(TP).forEach(function(k){
      if (BAND[k]) return;
      card.style.setProperty(kebab(k), (TP[k]*(VERT[k]?ch:(WIDE[k]?cw:S))).toFixed(2)+'px');
    });
    wrap.style.width=Math.round(headlineMeasure()*0.61)+'px';
  }
  function layout(){
    var vw=window.innerWidth, vh=window.innerHeight;
    if (mqLandscape.matches){
      setMode('land');
      var photoW=vw*photoRatio(vw), paneW=vw-photoW;
      photo.style.width=photoW+'px'; pane.style.left=photoW+'px';
      placeCard(paneW, vh); seatHero(photoW, vh);
    } else if (mqPortrait.matches){
      setMode('tabport'); tabport(vw, vh);
    } else {
      setMode('phone');
    }
  }
  window.addEventListener('resize', layout, {passive:true});
  window.addEventListener('orientationchange', layout);
  mqLandscape.addEventListener('change', layout);
  mqPortrait.addEventListener('change', layout);
  if (document.fonts) document.fonts.ready.then(layout);
  layout();
})();

/* вход: один раз */
(function(){
  var root=document.documentElement;
  function releaseEntrance(){ root.classList.remove('entry-pending'); clearTimeout(window.__entryFallback); }
  if (window.matchMedia('(prefers-reduced-motion:reduce)').matches || !Element.prototype.animate){ releaseEntrance(); return; }
  var ease='cubic-bezier(.16,1,.3,1)', softEase='cubic-bezier(.22,1,.36,1)';
  function run(){
    var compact=window.matchMedia('(max-width:699px)').matches, hlY=compact?'translateY(12px)':'translateY(16px)';
    var steps=[
      ['.card',40,820,ease,{opacity:0,transform:compact?'translateY(14px)':'translateY(12px) scale(.988)'}],
      ['.badge',120,480,softEase,{opacity:0,transform:'translateY(8px)'}],
      ['#hl1',240,760,ease,{opacity:0,transform:hlY,clipPath:'inset(100% 0 0 0)'}],
      ['#hl2',330,760,ease,{opacity:0,transform:hlY,clipPath:'inset(100% 0 0 0)'}],
      ['#h1',470,620,ease,{opacity:0,transform:'translateY(10px)'}],
      ['#sub',570,560,ease,{opacity:0,transform:'translateY(10px)'}],
      ['#email',720,520,softEase,{opacity:0,transform:'translateY(8px)'}],
      ['#pw',790,520,softEase,{opacity:0,transform:'translateY(8px)'}],
      ['#loginBtn',930,560,ease,{opacity:0,transform:'translateY(8px)'}],
      ['.divider',1060,440,softEase,{opacity:0,transform:'translateY(6px)'}],
      ['#gBtn',1150,540,ease,{opacity:0,transform:'translateY(8px)'}],
      ['#bottom',1260,500,softEase,{opacity:0,transform:'translateY(6px)'}]
    ];
    var animations=[];
    steps.forEach(function(s){
      var el=document.querySelector(s[0]); if (!el) return;
      var to={opacity:1,transform:'none'}; if (s[4].clipPath) to.clipPath='inset(0 0 0 0)';
      animations.push(el.animate([s[4],to],{delay:s[1],duration:s[2],easing:s[3],fill:'both'}));
    });
    root.classList.remove('entry-pending');
    Promise.allSettled(animations.map(function(a){ return a.finished; })).then(function(){
      animations.forEach(function(a){ a.cancel(); }); animations.length=0; releaseEntrance();
    });
  }
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(function(r){ setTimeout(r,650); })]).then(function(){
    requestAnimationFrame(function(){ requestAnimationFrame(run); });
  });
})();
</script>
