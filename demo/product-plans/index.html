        .c2-card::before{left:12px}
        .c2-card::after{right:12px}

        .c2-switch{width:34px;height:20px;background:#e5e5e5;border-radius:10px;position:relative;transition:background .25s;flex-shrink:0}
        .c2-switch::after{content:'';position:absolute;width:16px;height:16px;background:#fff;left:2px;top:2px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .25s cubic-bezier(.16,1,.3,1)}
        .c2-framer.on .c2-switch{background:#2a2a2a}

        .c2-bottom-card{background:#E8E7E5;border-radius:16px;padding:32px 32px 4px 32px;display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:220px;width:100%;box-sizing:border-box;animation:c2-fadeUp 1s .35s cubic-bezier(.16,1,.3,1) both}

        .c2-landscape{position:absolute;bottom:0;right:0;width:360px;z-index:1;pointer-events:none}
        @keyframes c2-fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @media (max-width:768px){
            .c2-section{padding:64px 16px 96px}
            .c2-title{font-size:2.1rem;margin-bottom:28px}
            .c2-grid{grid-template-columns:1fr}
            .c2-tree{width:96px;right:12px;opacity:.85}

        function BenefitsSection() {
            const [activeTab, setActiveTab] = useState('connections');
            const [countValue, setCountValue] = useState(0);
            const countStarted = useRef(false);

            const handleStartCount = () => {
                if (countStarted.current) return;
                countStarted.current = true;
                const start = performance.now(), duration = 2000, to = 86;
                const easeOut = t => 1 - Math.pow(1 - t, 3);
                const tick = now => {
                    const p = Math.min(1, (now - start) / duration);
                    setCountValue(Math.round(to * easeOut(p)));
                    if (p < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            };

                                        return (
                                            <div key={tab.id} onClick={() => setActiveTab(tab.id)}
                                                className={`rounded-[24px] overflow-hidden transition-all duration-300 ${active ? 'bg-white shadow-[0_4px_24px_rgba(0,0,0,0.03)]' : 'hover:bg-black/5 cursor-pointer'}`}>
                                                <div className="flex items-center justify-between p-7 md:p-8 cursor-pointer">
                                                    <span className="text-[22px] font-medium">{tab.title}</span>
                                                    <AnimatePresence mode="wait" initial={false}>
                                                        {active ? (
                                                            <motion.svg key="minus" initial={{ rotate: -90, opacity: 0 }} animate={{ rotate: 0, opacity: 1 }} exit={{ rotate: 90, opacity: 0 }} transition={{ duration: 0.2 }}
                                                                width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                                                                <line x1="5" y1="12" x2="19" y2="12" />
                                                            </motion.svg>
                                                        ) : (
                                                            <motion.svg key="plus" initial={{ rotate: -90, opacity: 0 }} animate={{ rotate: 0, opacity: 1 }} exit={{ rotate: 90, opacity: 0 }} transition={{ duration: 0.2 }}
                                                                width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                                                                <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
                                                            </motion.svg>
                                                        )}
                                                    </AnimatePresence>
                                                </div>
                                                <AnimatePresence initial={false}>
                                                    {active && (
                                                        <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} transition={{ duration: 0.3 }}>
                                                            <p className="px-7 md:px-8 pb-7 md:pb-8 text-gray-500 text-[15px] leading-relaxed">{tab.content}</p>
                                                        </motion.div>
                                                    )}
                                                </AnimatePresence>
                                            </div>
                                        );
                                    })}
                                </motion.div>
                            </div>

                            <motion.div initial={{ opacity: 0, x: 20 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true, amount: 0.3 }} transition={{ duration: 0.6 }}
                                className="lg:col-span-7 h-full">
                                <div className="bg-white rounded-[2.5rem] p-6 md:p-8 xl:p-12 shadow-[0_8px_30px_rgba(0,0,0,0.04)] flex flex-col xl:flex-row gap-8 h-full min-h-[560px]">
                                    <div className="flex-1 flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center gap-2 mb-4">
                                                <i data-lucide="target" className="w-5 h-5 text-[#ea580c]"></i>
                                                <span className="font-bold text-[15px] tracking-wide">EST — 1997</span>
                                            </div>
                                            <p className="max-w-[280px] text-gray-500 text-[18px] leading-[1.6]">Smart features designed to move with you — fast, flexible, and built for everyday action.</p>
                                        </div>
                                        <div>
                                            <h3 className="text-[clamp(1.7rem,5vw,46px)] leading-[1.1] font-medium tracking-tight mb-8">Visionary<br />Precision Play</h3>
                                            <button className="w-full xl:w-auto rounded-full bg-black text-white px-7 py-4 flex items-center justify-between gap-8 text-[15px] font-medium hover:bg-gray-800 transition-colors">
                                                Join Now! <i data-lucide="arrow-right" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="w-full xl:w-[320px] 2xl:w-[410px] h-[360px] md:h-[450px] xl:h-auto rounded-[2.5rem] relative overflow-hidden flex-shrink-0">
                                        <video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover z-0" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260426_105815_d66e9c4c-a1f8-4011-9ee5-f0cace24e642.mp4"></video>

                                        <motion.div initial={{ scale: 0, opacity: 0 }} whileInView={{ scale: 1, opacity: 1 }} viewport={{ once: true }} transition={{ duration: 0.4, delay: 0.2 }}
                                            className="absolute z-10 top-6 right-6 lg:top-8 lg:right-8 bg-white text-[#111] px-5 py-2.5 rounded-full shadow-md flex items-center gap-2.5 text-[15px] font-medium">
                                            <i data-lucide="gift" className="w-5 h-5 text-gray-700"></i> February Sale
                                        </motion.div>

                                        <motion.div onViewportEnter={handleStartCount} initial={{ x: -20, opacity: 0 }} whileInView={{ x: 0, opacity: 1 }} viewport={{ once: true }} transition={{ duration: 0.4, delay: 0.3 }}
                                            className="absolute z-10 bottom-6 left-6 lg:bottom-8 lg:left-8 bg-white text-[#111] rounded-[28px] overflow-hidden w-[190px] shadow-lg">
                                            <div className="pt-6 px-6 pb-4">
                                                <p className="text-gray-600 text-[15px] font-medium mb-1.5">Tennis Outdoor</p>
                                                <p className="text-[42px] font-medium tracking-tight leading-none">{countValue}%</p>
                                            </div>
                                            <div className="bg-[#3585A5] text-white px-6 py-4 flex items-center gap-2.5">
                                                <i data-lucide="zap" className="w-5 h-5" style={{ fill: 'white' }}></i>
                                                <span className="font-medium text-[16px]">Boost</span>
                                            </div>
                                        </motion.div>
                                    </div>
                                </div>
                            </motion.div>
                        </div>
                    </div>
                </section>
            );
        }

        function PackagesSection() {
            const BASE = { single: 1500, multi: 2500 };
            const FRAMER_ADDON = 800;
            const [pages, setPages] = useState('single');
            const [framer, setFramer] = useState(false);
            const [flip, setFlip] = useState(false);
            const prevTotal = useRef(null);
            const singleRef = useRef(null), multiRef = useRef(null);

            const total = BASE[pages] + (framer ? FRAMER_ADDON : 0);
            const priceText = '$' + total.toLocaleString('en-US');
            const noteText = framer ? 'One-time + Framer' : 'One-time';

            useEffect(() => {
                if (prevTotal.current === null) { prevTotal.current = total; return; }
                if (prevTotal.current === total) return;
                prevTotal.current = total;
                setFlip(true);
                const t = setTimeout(() => setFlip(false), 160);
                return () => clearTimeout(t);
            }, [total]);

            const selectPages = v => { if (v !== pages) setPages(v); };
            const onTabKey = (e, v) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectPages(v); }
                else if (e.key === 'ArrowLeft') { selectPages('single'); singleRef.current && singleRef.current.focus(); }
                else if (e.key === 'ArrowRight') { selectPages('multi'); multiRef.current && multiRef.current.focus(); }
            };
            const onFramerKey = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFramer(f => !f); } };
            const contact = label => () => console.log('[c2] contact requested:', label);

            return (
                <section id="packages" className="c2-section">
                    <div className="c2-container">
                        <p className="c2-eyebrow">PRICING</p>
                        <h2 className="c2-title">What package fits <em>you?</em></h2>

                        <div className="c2-grid-wrapper">
                            <div className="c2-grid">
                                <div className="c2-card">
                                    <div className="c2-dot-bl"></div><div className="c2-dot-br"></div>
                                    <h3 className="c2-card-title">Product Design</h3>
                                    <div className="c2-price">$75 <span>Hourly</span></div>
                                    <ul className="c2-list bordered">
                                        <li>Experienced Designer</li>
                                        <li>Fast Delivery</li>
                                        <li>Conversion Focused</li>
                                        <li>Tailored Design Strategy</li>
                                    </ul>
                                    <p className="c2-desc">Perfect if you're looking to build a dashboard, app, etc... and get it "done-right" the first time.</p>
                                    <button className="c2-btn" data-package="Product Design" onClick={contact('Product Design')}>Contact Us</button>
                                    <img className="c2-tree" src="https://pub-f170a2592d2c4a1485466404c36807be.r2.dev/viktor/gold%20tree.webp" alt="" loading="lazy" />
                                </div>

                                <div className="c2-card" data-card="web">
                                    <div className="c2-dot-bl"></div><div className="c2-dot-br"></div>
                                    <h3 className="c2-card-title">Web Design</h3>
                                    <div className="c2-price">
                                        <span className={'c2-price-amount' + (flip ? ' c2-flip' : '')} data-price>{priceText}</span>
                                        <span data-price-note>{noteText}</span>
                                    </div>
                                    <div className="c2-toggle" role="tablist" aria-label="Page count">
                                        <span ref={singleRef} role="tab" tabIndex={0} data-pages="single" aria-selected={pages === 'single'} className={pages === 'single' ? 'active' : ''} onClick={() => selectPages('single')} onKeyDown={e => onTabKey(e, 'single')}>Single-page</span>
                                        <span ref={multiRef} role="tab" tabIndex={0} data-pages="multi" aria-selected={pages === 'multi'} className={pages === 'multi' ? 'active' : ''} onClick={() => selectPages('multi')} onKeyDown={e => onTabKey(e, 'multi')}>Multi-page</span>
                                    </div>
                                    <div className={'c2-framer' + (framer ? ' on' : '')} role="switch" tabIndex={0} aria-checked={framer} aria-label="Add Framer development" onClick={() => setFramer(f => !f)} onKeyDown={onFramerKey}>
                                        <span>Framer Development</span>
                                        <span className="c2-switch"></span>
                                    </div>
                                    <ul className="c2-list bordered bordered-top">
                                        <li>Experienced Designer</li>
                                        <li>Fast Delivery</li>
                                        <li>Conversion Focused</li>
                                        <li>50/50 Secure Payments</li>
                                    </ul>
                                    <br /><br />
                                    <button className="c2-btn" data-package="Web Design" onClick={contact('Web Design ' + pages + (framer ? ' + Framer' : ''))}>Contact Us</button>
                                    <img className="c2-tree" src="https://pub-f170a2592d2c4a1485466404c36807be.r2.dev/viktor/purple%20tree.webp" alt="" loading="lazy" />
                                </div>
                            </div>
                        </div>

                        <div className="c2-bottom-card">
                            <h3 className="c2-card-title" style={{ fontWeight: 500 }}>Unique Request</h3>
                            <p className="c2-bottom-desc">Are you looking for something custom?<br />Don't hesitate to contact us, and we'll help brainstorming your product to success.</p>
                            <button className="c2-btn" data-package="Custom" onClick={contact('Custom')}>Contact Us</button>
                            <img className="c2-landscape" src="https://pub-f170a2592d2c4a1485466404c36807be.r2.dev/viktor/landscape.webp" alt="" loading="lazy" />
                        </div>
                    </div>
                </section>
            );
        }

        function Footer() {
            return (
                <footer className="bg-[#0b0b0c] text-white pt-20 pb-10 px-6">
                    <div className="max-w-[1600px] mx-auto">
                        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-10 mb-16">
                            <div>
                                <h2 style={{ fontFamily: "'Playfair Display', serif" }} className="text-[clamp(1.8rem,4vw,3rem)] font-normal mb-3">Ready to move?</h2>
                                <p className="text-white/50 max-w-sm leading-relaxed">Join for the gear and the community — bring us your team when it's time for a new look.</p>
                            </div>
                            <a href="#packages" className="shrink-0 rounded-full bg-white text-black px-7 py-4 text-[15px] font-medium hover:bg-white/90 transition-colors w-fit">Get in Touch</a>
                        </div>
                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6 pt-10 border-t border-white/10">
                            <a href="#top" style={{ color: '#fff' }}><GadLogo height="28px" /></a>
                            <nav className="flex items-center gap-6 text-sm text-white/60">
                                <a href="#benefits" className="hover:text-white transition-colors">Benefits</a>
                                <a href="#packages" className="hover:text-white transition-colors">Packages</a>
                            </nav>
                            <p className="text-white/40 text-xs">© 2026 g.a.d. All rights reserved.</p>
                        </div>
                    </div>
                </footer>
            );
        }

        function App() {
            useEffect(() => { lucide.createIcons(); });
            return (
                <div className="min-h-screen bg-white">
                    <Nav />
                    <Hero />
                    <BenefitsSection />
                    <PackagesSection />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
