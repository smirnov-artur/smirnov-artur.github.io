<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Redefine Space with Intelligent Design</title>
    <meta name="description" content="An AI interior-design hero: a looping video behind a frosted-glass navbar and a headline mixing regular sans with an italic serif accent.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        :root{
            font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.5;font-weight:400;color-scheme:dark;
            color:rgba(255,255,255,.87);background-color:#0a0a0a;font-synthesis:none;text-rendering:optimizeLegibility;
            -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
            --glass-bg:rgba(255,255,255,.05);--glass-border:rgba(255,255,255,.1);--glass-blur:blur(12px);
            --primary-white:#ffffff;--secondary-white:rgba(255,255,255,.7);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{margin:0;display:flex;place-items:center;min-width:320px;min-height:100vh;background-color:#0a0a0a;overflow:hidden}
        #root{width:100%}
        .glass{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12)}
        .pill{border-radius:16px}
        button{cursor:pointer;border:none;font-family:inherit;transition:all .3s ease;background:none}
        a{text-decoration:none;color:inherit}

        .hero-section{position:relative;width:100vw;height:100vh;padding:20px 20px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:1;overflow:hidden;background:#0a0a0a}
        .hero-bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;pointer-events:none}
        @media (max-width:768px){.hero-section{padding:30px 20px}}

        .navbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
        .logo-placeholder{display:flex;align-items:center;gap:12px;color:#fff}
        .nav-main{display:flex;align-items:center;padding:6px 6px 6px 32px;gap:28px;background:rgba(20,18,16,.42);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:16px}
        .nav-links{display:flex;gap:25px}
        .nav-link{font-size:13px;font-weight:500;color:var(--secondary-white);transition:color .3s ease}
        .nav-link:hover{color:var(--primary-white)}
        .login-btn{background:var(--primary-white);color:#000;padding:10px 26px;font-size:14px;font-weight:600;border-radius:12px}
        .login-btn:hover{background:rgba(255,255,255,.9);transform:translateY(-1px)}
        @media (max-width:900px){.nav-links{display:none}.nav-main{padding:6px;gap:0}}

        .hero-content{text-align:center;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:28px}
        .hero-title{font-size:clamp(36px,4.4vw,72px);line-height:.95;letter-spacing:-0.022em;color:var(--primary-white);margin-bottom:0;font-weight:400}
        .sans-bold{font-weight:400;font-size:1em}
        .sans-light{font-weight:400;font-size:1em}
        .serif-italic{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:1.14em;letter-spacing:-0.01em}
        .cta-btn{background:var(--primary-white);color:#000;padding:15px 25px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:12px;margin-top:0}
        .cta-btn:hover{transform:scale(1.05);box-shadow:0 15px 40px rgba(255,255,255,.15)}
        @media (max-width:768px){.hero-title{letter-spacing:-1px}}

        .footer-elements{width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px 36px}
        .footer-left{max-width:400px}
        .description{font-size:15px;line-height:1.18;color:#fff;font-weight:400;opacity:.8;text-align:left;text-shadow:0 1px 14px rgba(0,0,0,.35);text-wrap:pretty}
        .footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
        .action-row{display:flex;gap:12px}
        .tag-btn{background:transparent;color:var(--primary-white);padding:10px 22px;font-size:13px;font-weight:500;border:.75px solid white;border-radius:16px}
        .tag-btn:hover{background:var(--glass-bg);border-color:var(--primary-white)}
        .icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0}
        .icon-btn:hover{background:var(--glass-bg);transform:rotate(45deg)}
        @media (max-width:900px){.footer-elements{flex-direction:column;align-items:center;gap:40px;text-align:center}.footer-right{align-items:center}.description{text-align:center}}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">

                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
            </svg>
        );

        const Navbar = () => (
            <nav className="navbar">
                <a href="#" className="logo-placeholder" aria-label="g.a.d.">
                    <GadLogo className="gad-logo" />
                </a>
                <div className="nav-main glass pill">
                    <div className="nav-links">
                        <a href="#product" className="nav-link">Product</a>
                        <a href="#platform" className="nav-link">Platform</a>
                        <a href="#customers" className="nav-link">Customers</a>
                        <a href="#company" className="nav-link">Company</a>
                    </div>
                    <button className="login-btn pill">Login</button>
                </div>
            </nav>
        );

        const HeroContent = () => (
            <div className="hero-content">
                <h1 className="hero-title">
                    <span className="sans-bold">Meet g.a.d.</span>
                    <br/>
                    <span className="serif-italic">Redefine space</span>
                    <span className="sans-light"> with</span>
                    <br/>
                    <span className="sans-light">intelligent design</span>
                </h1>
                <div className="cta-container">
                    <button className="cta-btn pill">Start free decoration</button>
                </div>
            </div>
        );

        const FooterElements = () => (
            <div className="footer-elements">
                <div className="footer-left">
                    <p className="description">
                        It helps you imagine, plan, and refine spaces<br/>
                        through natural conversations.<br/>
                        From choosing colors and layouts to suggesting<br/>
                        furniture and décor, it adapts to your taste.
                    </p>
                </div>
                <div className="footer-right">
                    <button className="tag-btn glass pill">Solutions for complex spaces</button>
                    <div className="action-row">
                        <button className="icon-btn glass pill" aria-label="Explore">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 17L17 7M17 7H7M17 7V17" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>
                        </button>
                        <button className="tag-btn glass pill">Conversational & Action</button>
                    </div>
                </div>
            </div>
        );

        const App = () => (
            <main className="hero-section">
                <video
                    className="hero-bg-video"
                    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260503_162107_3cd240af-dff4-4396-b8b7-22e25c9adb1c.mp4"

                    loop
                    muted
                    playsInline

                <HeroContent />
                <FooterElements />

        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
