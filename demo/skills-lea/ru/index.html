        function buildMonthGrid(year, month) {
            const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();
            const cells = [];
            for (let i = 0; i < 42; i++) {
                const d = i - firstDow + 1;
                if (d < 1) cells.push({ day: daysInPrev + d, type: 'prev' });

                                    </div>
                                    <button type="button" aria-label={'Открыть: ' + c.title} onClick={(e) => e.preventDefault()} className="absolute top-3 right-3 w-10 h-10 rounded-full bg-white flex items-center justify-center">
                                        <ArrowRightIcon className="w-4 h-4 text-black -rotate-45" strokeWidth={2.5} />
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 bg-white rounded-full px-2 py-2 flex items-center gap-1">
                        <button type="button" aria-label="Главная" onClick={(e) => e.preventDefault()} className="w-12 h-12 rounded-full flex items-center justify-center text-zinc-400 hover:text-zinc-600">
                            <HomeIcon className="w-5 h-5" />
                        </button>
                        <button type="button" aria-label="Настройки" onClick={(e) => e.preventDefault()} className="w-14 h-14 rounded-full bg-black text-white flex items-center justify-center">
                            <SettingsIcon className="w-5 h-5" />
                        </button>
                    </div>
                </div>
            );
        };

        const Screen3 = () => {
            const [year, setYear] = useState(2024);
            const [month, setMonth] = useState(7);
            const [selectedDay, setSelectedDay] = useState(16);
            const cells = buildMonthGrid(year, month);

            const goMonth = (delta) => {
                let m = month + delta, y = year;
                if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
                setMonth(m); setYear(y);
            };

            return (
                <div className="absolute inset-0">
                    <img src={BG_EXPLORE} alt="" className="absolute inset-0 w-full h-full object-cover" />
                    <div className="absolute inset-0 overflow-y-auto no-scrollbar">
                        <div className="flex items-center justify-between px-5 pt-14 pb-4">
                            <button type="button" aria-label="Назад" onClick={(e) => e.preventDefault()} className="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center">
                                <ArrowLeftIcon className="w-5 h-5 text-white" />
                            </button>
                            <button type="button" aria-label="Поделиться" onClick={(e) => e.preventDefault()} className="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center">
                                <Share2Icon className="w-5 h-5 text-white" />
                            </button>
                        </div>

                        <h2 className="text-white text-[42px] leading-[1.15] font-light px-6 pt-4 pb-6">
                            <span className="font-medium">Расписание</span><br />
                            <span className="font-medium">занятий</span>
                        </h2>

                        <div className="px-6">
                            <div className="flex items-center justify-between mb-4">
                                <div className="text-white text-xl font-semibold">{MONTHS[month]} {year}</div>
                                <div className="flex items-center gap-1">
                                    <button type="button" aria-label="Предыдущий месяц" onClick={() => goMonth(-1)} className="w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/10">
                                        <ChevronLeftIcon className="w-4 h-4" />
                                    </button>
                                    <button type="button" aria-label="Следующий месяц" onClick={() => goMonth(1)} className="w-8 h-8 rounded-full flex items-center justify-center text-white hover:bg-white/10">
                                        <ChevronRightIcon className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-7 mb-2">
                                {DAY_LABELS.map((d, i) => (
                                    <div key={i} className="text-zinc-500 text-[10px] font-medium text-center">{d}</div>
                                ))}
                            </div>

                            <div className="grid grid-cols-7 gap-y-2">
                                {cells.map((cell, i) => {
                                    const selected = cell.type === 'current' && cell.day === selectedDay;
                                    const highlighted = (cell.type === 'current' && cell.day === 12) || (cell.type === 'next' && cell.day === 3);
                                    return (
                                        <div key={i} className="flex items-center justify-center">
                                            <button
                                                type="button"
                                                disabled={cell.type !== 'current'}
                                                onClick={() => cell.type === 'current' && setSelectedDay(cell.day)}
                                                className={
                                                    'w-8 h-8 rounded-full text-sm transition-transform ' +
                                                    (cell.type === 'current' ? 'text-white hover:bg-white/10' : 'text-zinc-600') +
                                                    (selected ? ' font-bold scale-110' : '')
                                                }
                                                style={{
                                                    ...(selected ? { backgroundColor: '#B8C1FF', color: '#1F111D' } : {}),
                                                    ...(highlighted && !selected ? { border: '2px dotted rgba(161,161,170,0.6)', borderRadius: '50%' } : {}),
                                                }}
                                            >
                                                {cell.day}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="relative mx-4 mb-6 mt-4 rounded-[28px] overflow-hidden">
                            <video autoPlay muted loop playsInline className="absolute inset-0 w-full h-full object-cover" src={BOTTOM_CARD_VIDEO} />
                            <div className="relative p-5 pr-16">
                                <span className="inline-block backdrop-blur-sm text-white text-[11px] font-medium px-3 py-1 rounded-full mb-2" style={{ background: '#6276CA' }}>
                                    17:00–18:00
                                </span>
                                <div className="text-[#1F111D] text-lg font-bold leading-tight">
                                    Компоненты<br />и варианты
                                </div>
                                <div className="text-[#1F111D]/70 text-xs mt-1">Adrian Smith</div>
                            </div>
                            <button type="button" aria-label="Открыть урок" onClick={(e) => e.preventDefault()} className="absolute top-4 right-4 w-12 h-12 rounded-full bg-white flex items-center justify-center">
                                <ArrowRightIcon className="w-5 h-5 text-black -rotate-45" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => (
            <div className="font-sans relative w-full min-h-screen flex items-center justify-center bg-[#0a0a0f] py-10 gap-6 md:gap-10 flex-col md:flex-row px-4">
                <PhoneFrame><Screen1 /></PhoneFrame>
                <PhoneFrame><Screen2 /></PhoneFrame>
                <PhoneFrame><Screen3 /></PhoneFrame>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
