<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>g.a.d. — protect your data</title>
<!-- Один файл вместо React + Tailwind. ?lang=ru — русская версия (у Readex Pro нет кириллицы, по-русски набрано Geologica).
     Вместо чисел про клиентов («+65k стартапов», «+1.5b гб», «+300k загрузок») — что продукт умеет: под логотипом g.a.d. чужие цифры читались бы как наши. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { font-family: 'Readex Pro', system-ui, -apple-system, sans-serif; background: #000; color: #fff; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
html:lang(ru) body { font-family: 'Geologica', system-ui, -apple-system, sans-serif; }
a { color: inherit; text-decoration: none; }
.hero-title { letter-spacing: -0.04em; line-height: 0.95; }

.sec { position: relative; height: 100vh; width: 100%; overflow: hidden; background: #000; }
.bgv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* навигация */
.bar { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 24px 24px 0; }
.bar nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.lp { display: flex; align-items: center; gap: 8px; background: rgba(23,23,23,.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 9999px; padding: 12px 24px 12px 16px; color: #fff; }
.gad svg { display: block; height: 20px; width: auto; overflow: visible; }
.gad svg text { font-family: 'Unbounded', sans-serif; }
.gad .ring { animation: gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards; }
.gad .orb { opacity: 0; transform-box: view-box; transform-origin: 322px 30px; animation: gad-pop .3s ease 1.35s forwards, gad-orbit 7s linear 1.35s infinite; }
@keyframes gad-draw { to { stroke-dashoffset: 0; } }
@keyframes gad-pop { to { opacity: 1; } }
@keyframes gad-orbit { to { transform: rotate(360deg); } }
.cp { display: none; align-items: center; gap: 4px; background: rgba(23,23,23,.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 9999px; padding: 8px 12px; }
.cp a { color: #d4d4d4; font-size: 14px; line-height: 20px; padding: 8px 20px; border-radius: 9999px; transition: color .15s; }
.cp a:hover { color: #fff; }
.go { background: #fff; color: #000; font-size: 14px; line-height: 20px; font-weight: 400; border-radius: 9999px; padding: 12px 24px; transition: background-color .15s; white-space: nowrap; }
.go:hover { background: #e5e5e5; }

/* передний план */
.fg { position: relative; height: 100%; width: 100%; }
.w { position: absolute; margin: 0; color: #fff; font-weight: 500; font-size: 14vw; }
.w1 { left: 16px; top: 18%; }
.w2 { right: 16px; top: 38%; }
.w3 { left: 18%; top: 58%; }
.desc { position: absolute; left: 24px; top: 46%; max-width: 240px; font-size: 15px; line-height: 1.375; color: rgba(255,255,255,.9); }

.num { font-size: 36px; line-height: 40px; font-weight: 500; letter-spacing: -0.025em; }
.sub { font-size: 12px; line-height: 16px; color: rgba(255,255,255,.7); margin-top: 4px; }
.row { display: flex; align-items: center; gap: 12px; }
.dv { display: none; height: 1px; width: 96px; background: rgba(255,255,255,.4); }
.tr { position: absolute; right: 24px; top: 14%; }
.tr .row { justify-content: flex-end; }
.tr .sub, .brs .sub { text-align: right; }
.tr .dv { transform: rotate(20deg); }
.shade { pointer-events: none; position: absolute; bottom: 0; left: 0; right: 0; height: 192px; background: linear-gradient(to bottom, transparent, #000); }
.bls { position: absolute; left: 24px; bottom: 80px; }
.bls .dv, .brs .dv { transform: rotate(-20deg); }
.brs { position: absolute; right: 24px; bottom: 64px; }
.brs .row { justify-content: flex-end; }

@media (min-width: 768px) {
  .bar { padding: 24px 40px 0; }
  .cp { display: flex; }
  .w { font-size: 13vw; }
  .w1 { left: 40px; }
  .w2 { right: 40px; }
  .w3 { left: 28%; }
  .desc { left: 40px; }
  .num { font-size: 48px; line-height: 1; }
  .sub { font-size: 14px; line-height: 20px; }
  .dv { display: block; }
  .tr { right: 96px; }
  .bls { left: 80px; bottom: 96px; }
  .brs { right: 80px; bottom: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  .gad .ring { animation: none; stroke-dashoffset: 0; }
  .gad .orb { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<div id="root">
<section class="sec">
  <video class="bgv" autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_063509_7d167302-4fd4-480b-8260-18ab572333d4.mp4"></video>

  <div class="bar">
    <nav>
      <a class="lp gad" href="#" aria-label="g.a.d.">
        <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
          <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
          <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
          <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
        </svg>
      </a>
      <div class="cp">
        <a href="#" data-t="n1">platform</a>
        <a href="#" data-t="n2">solutions</a>
        <a href="#" data-t="n3">company</a>
        <a href="https://t.me/smirnovarturr" target="_blank" rel="noopener" data-t="n4">support</a>
      </div>
      <a class="go" href="https://t.me/smirnovarturr" target="_blank" rel="noopener" data-t="go">get started</a>
    </nav>
  </div>

  <div class="fg">
    <h1 class="hero-title w w1" data-t="w1">protect</h1>
    <h1 class="hero-title w w2" data-t="w2">your</h1>
    <h1 class="hero-title w w3" data-t="w3">data</h1>

    <p class="desc" data-t="desc">we are guarding your data with utmost care, empowering you with privacy everywhere</p>

    <div class="tr">
      <div class="row"><span class="dv"></span><span class="num">24/7</span></div>
      <p class="sub" data-t="s1">threat monitoring</p>
    </div>

    <div class="shade"></div>

    <div class="bls">
      <div class="row"><span class="num">aes-256</span><span class="dv"></span></div>
      <p class="sub" data-t="s2">encryption at rest</p>
    </div>

    <div class="brs">
      <div class="row"><span class="dv"></span><span class="num">e2e</span></div>
      <p class="sub" data-t="s3">encrypted sync</p>
    </div>
  </div>
</section>
</div>
<script>
(function () {
  if (false) return;
  var TR = {
    n1: 'платформа', n2: 'решения', n3: 'компания', n4: 'поддержка', go: 'начать',
    w1: 'защити', w2: 'свои', w3: 'данные',
    desc: 'бережём ваши данные с предельной заботой и даём приватность везде, где вы есть',
    s1: 'слежение за угрозами', s2: 'шифрование при хранении', s3: 'сквозная синхронизация'
  };
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — защити свои данные';
  document.querySelectorAll('[data-t]').forEach(function (el) { var t = TR[el.dataset.t]; if (t) el.textContent = t; });
})();
</script>
</body>
</html>
