<!DOCTYPE html>

        tailwind.config = {

    <style>
        /* no overflow-x:hidden here: it breaks position:sticky (section 3) in Chromium.
           Nothing on this page overflows horizontally (verified at 390px and 1440px). */
        html, body { margin: 0; background: #19261D; }
        body {
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;

    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}
</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;
        const { motion, useScroll, useTransform } = Motion;

        // ---- Reveal: IntersectionObserver fade/slide-up wrapper ----
        const Reveal = ({ children, delay = 0, className = '', as = 'div' }) => {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
                }, { threshold: 0.15 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            const Tag = as;
            return (
                <Tag
                    ref={ref}
                    className={`transition-all duration-700 ease-out will-change-transform ${visible ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </Tag>
            );
        };

        // ---- Persistent dice icon, fixed bottom-right ----
        const DiceIcon = () => {
            const dots = [
                { gridColumn: 1, gridRow: 1 },
                { gridColumn: 3, gridRow: 1 },
                { gridColumn: 2, gridRow: 2 },
                { gridColumn: 1, gridRow: 3 },
                { gridColumn: 3, gridRow: 3 },
            ];
            return (
                <div
                    className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 w-10 h-10 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-md grid grid-cols-3 grid-rows-3 p-1.5 sm:p-2 md:p-2.5 bg-[#E2DBC8]"
                    aria-hidden="true"
                >
                    {dots.map((pos, i) => (
                        <span
                            key={i}
                            className="rounded-full justify-self-center self-center bg-[#1C261E]"
                            style={{ ...pos, width: '7px', height: '7px' }}
                        />
                    ))}
                </div>
            );
        };

        // ---- Navbar: fixed top-right, logo + brand ----
        const Navbar = () => (
            <Reveal className="fixed right-4 top-4 sm:right-8 sm:top-7 md:right-12 z-50">
                <a href="#" className="flex items-center hover:opacity-80 transition-opacity" style={{ color: '#E2DBC8' }}>
                    <svg className="gad-logo" style={{ height: '24px' }} viewBox="0 0 355 110" role="img" aria-label="g.a.d."><path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z" /><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" /><circle className="orb" cx="322" cy="8" r="5" fill="currentColor" /></svg>
                </a>
            </Reveal>
        );

        // ---- Section 1: fixed fullscreen hero with scroll-fade + 170vh spacer ----
        const useHeroOpacity = () => {
            const [opacity, setOpacity] = useState(1);
            useEffect(() => {
                const onScroll = () => setOpacity(Math.max(0, 1 - window.scrollY / (window.innerHeight * 0.6)));
                window.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
                return () => window.removeEventListener('scroll', onScroll);
            }, []);
            return opacity;
        };

        const Hero = () => {
            const opacity = useHeroOpacity();
            return (
                <Fragment>
                    <div className="fixed inset-0 z-0" style={{ opacity, pointerEvents: opacity <= 0.001 ? 'none' : 'auto' }}>
                        <div className="h-full w-full flex flex-col px-3 py-3 sm:px-4 sm:py-4 md:px-6 md:py-6 bg-[#464340]">
                            <div className="flex-1 relative rounded-2xl">
                                <div className="absolute inset-0 rounded-2xl overflow-hidden">
                                    <video
                                        className="h-full w-full object-cover"
                                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260703_154802_dcffa901-509b-4aa3-8e34-36bbf6edcfcb.mp4"
                                        autoPlay muted loop playsInline
                                    />
                                </div>

                                <div className="relative z-10 h-full flex flex-col justify-between p-6 sm:p-8 md:p-12 lg:p-16">
                                    <Reveal delay={200}>
                                        <h1 className="text-[2.5rem] sm:text-6xl md:text-7xl lg:text-8xl font-normal leading-[1.05] tracking-tighter text-[#E2DBC8]/80">
                                            Циркулярные системы<br />для чистой<br />планеты
                                        </h1>
                                    </Reveal>

                                    <div className="flex flex-col items-center text-center gap-3">
                                        <Reveal delay={400}>
                                            <p className="text-sm sm:text-base text-[#E2DBC8]/80 max-w-xs">
                                                Мобильная переработка отходов<br />нового поколения
                                            </p>
                                        </Reveal>
                                        <Reveal delay={500}>
                                            <a href="#about" className="text-xs uppercase tracking-[0.2em] text-[#E2DBC8]/50 hover:text-[#E2DBC8] transition-colors">
                                                Начать
                                            </a>
                                        </Reveal>
                                    </div>
                                </div>

                                <div className="absolute bottom-0 left-0 z-20">
                                    <div className="absolute bottom-full left-0 w-5 h-5" style={{ background: 'radial-gradient(circle at 100% 0%, transparent 20px, #464340 20px)' }} />
                                    <div className="absolute left-full bottom-0 w-5 h-5" style={{ background: 'radial-gradient(circle at 100% 0%, transparent 20px, #464340 20px)' }} />
                                    <div className="flex items-center gap-4 bg-[#464340] px-5 py-3 rounded-tr-[20px]">
                                        <a href="#" aria-label="LinkedIn" className="text-[#E2DBC8]/60 hover:text-[#E2DBC8] transition-colors">
                                            <i data-lucide="linkedin" className="w-[18px] h-[18px]"></i>
                                        </a>
                                        <a href="#" aria-label="Телефон" className="text-[#E2DBC8]/60 hover:text-[#E2DBC8] transition-colors">
                                            <i data-lucide="phone" className="w-[18px] h-[18px]"></i>
                                        </a>
                                        <a href="#" aria-label="Почта" className="text-[#E2DBC8]/60 hover:text-[#E2DBC8] transition-colors">
                                            <i data-lucide="mail" className="w-[18px] h-[18px]"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div style={{ height: '170vh' }} />
                </Fragment>
            );
        };

        // ---- Section 2: scroll-driven per-character opacity reveal ----
        const ABOUT_TEXT = "Экологическое равновесие планеты меняется с беспрецедентной скоростью. Проблемы восстановления ресурсов и кризисы загрязнения давно перешагнули критическую черту, а поиск по-настоящему зелёных решений ещё никогда не значил так много.";

        const RevealChar = ({ ch, i, total, scrollYProgress }) => {
            const start = i / total;
            const end = start + 0.005;
            const charOpacity = useTransform(scrollYProgress, [start, end], [0.3, 1]);
            return (
                <span className="relative inline-block">
                    <span className="invisible">{ch}</span>
                    <motion.span className="absolute inset-0" style={{ opacity: charOpacity }}>{ch}</motion.span>
                </span>
            );
        };

        const AboutSection = () => {
            const containerRef = useRef(null);
            const { scrollYProgress } = useScroll({ target: containerRef, offset: ['start 0.8', 'end 0.2'] });
            const total = ABOUT_TEXT.length;
            const words = ABOUT_TEXT.split(' ');
            let idx = 0;
            return (
                <section id="about" ref={containerRef} className="min-h-screen flex items-end bg-[#1C261E]">
                    <div className="px-5 pb-10 sm:px-8 sm:pb-14 md:px-12 md:pb-16">
                        <p className="font-normal leading-snug lg:leading-[1.15] tracking-tight text-2xl sm:text-3xl md:text-5xl lg:text-6xl text-[#E2DBC8]">
                            {words.map((word, wi) => {
                                const startIdx = idx;
                                idx += word.length + 1;
                                return (
                                    <Fragment key={wi}>
                                        <span className="inline-block whitespace-nowrap">
                                            {[...word].map((ch, ci) => (
                                                <RevealChar key={ci} ch={ch} i={startIdx + ci} total={total} scrollYProgress={scrollYProgress} />
                                            ))}
                                        </span>
                                        {wi < words.length - 1 ? ' ' : ''}
                                    </Fragment>
                                );
                            })}
                        </p>
                    </div>
                </section>
            );
        };

        // ---- Section 3: sticky scroll-scrubbed video (canvas) + pinned stat overlays ----
        const seg = (p, a, b, c, d) => {
            if (p <= a || p >= d) return 0;
            if (p < b) return (p - a) / (b - a);
            if (p <= c) return 1;
            return 1 - (p - c) / (d - c);
        };

        const ScrollVideoSection = () => {
            const containerRef = useRef(null);
            const canvasRef = useRef(null);
            const videoRef = useRef(null);
            const stat1H = useRef(null), stat1P = useRef(null);
            const stat2H = useRef(null), stat2P = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current, video = videoRef.current, container = containerRef.current;
                const ctx = canvas.getContext('2d');
                let smoothed = 0, raf = null, pendingSeek = false;

                const resize = () => {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = canvas.clientWidth * dpr;
                    canvas.height = canvas.clientHeight * dpr;
                };
                resize();
                window.addEventListener('resize', resize);

                const draw = () => {
                    const vw = video.videoWidth, vh = video.videoHeight;
                    if (!vw || !vh) return;
                    const cw = canvas.width, ch = canvas.height;
                    const scale = Math.max(cw / vw, ch / vh);
                    const dw = vw * scale, dh = vh * scale;
                    ctx.drawImage(video, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
                };

                const requestSeek = (t) => {
                    if (pendingSeek || !video.duration) return;
                    if (Math.abs(video.currentTime - t) < 0.01) return;
                    pendingSeek = true;
                    try { video.currentTime = t; } catch (e) { pendingSeek = false; }
                };
                const onSeeked = () => { pendingSeek = false; draw(); };
                video.addEventListener('seeked', onSeeked);
                video.addEventListener('loadeddata', draw);

                const applyStat = (headingEl, paraEl, opacity) => {
                    const revealed = opacity > 0.02;
                    [headingEl, paraEl].forEach((el) => {
                        if (!el) return;
                        el.style.opacity = opacity;
                        el.style.transform = revealed ? 'translateY(0)' : 'translateY(2rem)';
                    });
                };

                const tick = () => {
                    const rect = container.getBoundingClientRect();
                    const total = rect.height - window.innerHeight;
                    const target = total > 0 ? Math.min(1, Math.max(0, -rect.top / total)) : 0;
                    smoothed += (target - smoothed) * 0.1;

                    if (video.duration) requestSeek(smoothed * video.duration);

                    applyStat(stat1H.current, stat1P.current, seg(target, 0, 0.2, 0.45, 0.55));
                    applyStat(stat2H.current, stat2P.current, seg(target, 0.5, 0.6, 0.85, 1.0));

                    raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);

                return () => {
                    cancelAnimationFrame(raf);
                    window.removeEventListener('resize', resize);
                    video.removeEventListener('seeked', onSeeked);
                    video.removeEventListener('loadeddata', draw);
                };
            }, []);

            return (
                <div ref={containerRef} className="relative isolate h-[400vh]">
                    <div className="sticky top-0 h-screen w-full -z-10 bg-[#0a0a0a]">
                        <canvas ref={canvasRef} className="absolute inset-0 h-full w-full block" />
                        <video
                            ref={videoRef}
                            className="absolute w-px h-px opacity-0 pointer-events-none"
                            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260703_102446_48ac5215-4f23-49f4-a433-ec9798029150.mp4"
                            muted playsInline preload="auto"
                        />
                        <div className="absolute inset-0 bg-black/20" />
                        <div className="absolute inset-x-0 top-0 h-40 sm:h-56 md:h-72" style={{ background: 'linear-gradient(to bottom, #1C261E, transparent)' }} />
                    </div>

                    <div className="sticky top-0 h-screen pointer-events-none z-10">
                        <div className="absolute inset-0 flex flex-col justify-end p-6 sm:p-8 md:p-12 lg:p-16">
                            <h2 ref={stat1H} className="font-normal tracking-tighter text-4xl sm:text-5xl md:text-7xl lg:text-8xl text-[#E2DBC8] transition-transform duration-700 ease-out will-change-transform" style={{ transform: 'translateY(2rem)' }}>
                                2,01 миллиарда
                            </h2>
                            <p ref={stat1P} className="mt-4 text-sm sm:text-base text-[#E2DBC8]/70 max-w-lg leading-relaxed transition-transform duration-700 ease-out will-change-transform" style={{ transform: 'translateY(2rem)' }}>
                                Тонны бытовых и коммерческих отходов образуются каждый год. Если выстроить перевозящие их машины в один ряд, они обогнули бы земной шар{' '}
                                <span className="inline-flex items-center rounded bg-[#4caf50] px-2 py-0.5 text-xs sm:text-sm font-semibold text-[#E2DBC8]">24 раза</span>
                            </p>
                        </div>

                        <div className="absolute inset-0 flex flex-col justify-end p-6 sm:p-8 md:p-12 lg:p-16">
                            <h2 ref={stat2H} className="font-normal tracking-tighter text-4xl sm:text-5xl md:text-7xl lg:text-8xl text-[#E2DBC8] transition-transform duration-700 ease-out will-change-transform" style={{ transform: 'translateY(2rem)' }}>
                                Меньше пятой части
                            </h2>
                            <p ref={stat2P} className="mt-4 text-sm sm:text-base text-[#E2DBC8]/70 transition-transform duration-700 ease-out will-change-transform" style={{ transform: 'translateY(2rem)', transitionDelay: '100ms' }}>
                                всех отходов перерабатывается каждый год
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            useEffect(() => { lucide.createIcons(); }, []);
            return (
                <Fragment>
                    <DiceIcon />
                    <Navbar />
                    <Hero />
                    <AboutSection />
                    <ScrollVideoSection />
                </Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
