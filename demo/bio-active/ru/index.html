function SplashScreen({ onComplete }) {
  const [pct, setPct] = useState(0);
  const [curtain, setCurtain] = useState(false);
  useEffect(() => {
    const totalSteps = 2400 / 20;
    let i = 0;
    const id = setInterval(() => {
      i++;
      setPct(Math.min(100, Math.round((i / totalSteps) * 100)));
      if (i >= totalSteps) {
        clearInterval(id);
        setTimeout(() => setCurtain(true), 300);
      }
    }, 20);
    return () => clearInterval(id);
  }, []);
  useEffect(() => {
    if (!curtain) return;
    const t = setTimeout(onComplete, 1200);
    return () => clearTimeout(t);
  }, [curtain]);
  return (
    <div className="fixed inset-0 z-[9999]">
      <div className="absolute inset-y-0 left-0 w-1/2 bg-[#010101]" style={{ transform: curtain ? 'translateX(-100%)' : 'translateX(0)', transition: 'transform 1200ms cubic-bezier(0.76,0,0.24,1)' }} />
      <div className="absolute inset-y-0 right-0 w-1/2 bg-[#010101]" style={{ transform: curtain ? 'translateX(100%)' : 'translateX(0)', transition: 'transform 1200ms cubic-bezier(0.76,0,0.24,1)' }} />
      <div className="absolute bottom-12 left-0 right-0 px-12" style={{ opacity: curtain ? 0 : 1, transition: 'opacity 300ms' }}>
        <div className="flex justify-between items-center mb-3">
          <span className="text-white/40 uppercase tracking-[0.2em] text-xs">Загрузка</span>
          <span className="text-white text-sm tabular-nums font-medium">{pct}%</span>
        </div>
        <div className="h-[1px] bg-white/10 w-full">
          <div className="h-full bg-white" style={{ width: pct + '%' }} />
        </div>
      </div>
    </div>
  );
}

function Navbar({ isActive }) {
  const [open, setOpen] = useState(false);
  useEffect(() => { lucide.createIcons(); });
  const links = ['Наука', 'Процедуры', 'Результаты', 'Отзывы', 'Контакты'];
  return (
    <React.Fragment>
      <div className={`fixed top-4 sm:top-6 inset-x-0 z-50 px-4 flex justify-center transition-all duration-700 delay-300 ${isActive ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-1'}`}>
        <nav className="w-full sm:w-auto flex items-center justify-between gap-1 bg-white/10 backdrop-blur-md border border-white/15 rounded-full px-2 py-2">
          <a href="#" className="flex items-center pl-3 pr-2" style={{ color: '#fff' }}>
            <GadLogo height="22px" />
          </a>
          <div className="hidden md:flex items-center gap-1">
            {links.map(l => (
              <a key={l} href="#" className="text-white/80 text-sm hover:text-white hover:bg-white/10 px-4 py-1.5 rounded-full transition-colors">{l}</a>
            ))}
          </div>
          <div className="flex items-center gap-2">
            <button className="hidden sm:flex items-center gap-1.5 bg-[#5794E2] hover:bg-[#4a84d0] text-white text-sm px-5 py-2 rounded-full transition-colors">
              Записаться<i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
            </button>
            <button onClick={() => setOpen(o => !o)} className="md:hidden w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white" aria-label="Меню">
              {open ? <i data-lucide="x" className="w-4 h-4"></i> : <i data-lucide="menu" className="w-4 h-4"></i>}
            </button>
          </div>
        </nav>
      </div>
      <div className={`fixed inset-0 z-40 bg-black/90 backdrop-blur-lg flex flex-col items-center justify-center gap-6 transition-opacity duration-300 ${open ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>

          <a key={l} href="#" onClick={() => setOpen(false)} className="text-2xl font-light text-white">{l}</a>
        ))}
        <button onClick={() => setOpen(false)} className="bg-[#5794E2] hover:bg-[#4a84d0] text-white text-sm px-5 py-2 rounded-full mt-2">Записаться</button>
      </div>
    </React.Fragment>
  );
}

function HeroSection({ isActive }) {
  const [progress, setProgress] = useState(0);
  const progressRef = useRef(0);
  const activeVideoRef = useRef(1);
  const activeFlagRef = useRef(isActive);
  const v1 = useRef(null);
  const v2 = useRef(null);

  useEffect(() => { activeFlagRef.current = isActive; }, [isActive]);

  useEffect(() => {
    const onWheel = (e) => {
      e.preventDefault();
      if (!activeFlagRef.current) return;
      const next = Math.min(1, Math.max(0, progressRef.current + e.deltaY / 800));
      progressRef.current = next;
      setProgress(next);
      const shouldBe = next >= 0.5 ? 2 : 1;
      if (shouldBe !== activeVideoRef.current) {
        activeVideoRef.current = shouldBe;
        const playing = shouldBe === 1 ? v1.current : v2.current;
        const pausing = shouldBe === 1 ? v2.current : v1.current;
        if (pausing) pausing.pause();
        if (playing) { playing.currentTime = 0; playing.play().catch(() => {}); }
      }
    };
    window.addEventListener('wheel', onWheel, { passive: false });
    return () => window.removeEventListener('wheel', onWheel);
  }, []);

  const state1Opacity = Math.max(0, 1 - progress * 2.5);
  const state1TranslateY = progress * 30;
  const state2Opacity = Math.max(0, (progress - 0.4) * 2.5);
  const state2TranslateY = Math.max(0, (1 - progress) * 30);

  return (
    <div className="fixed inset-0 w-full h-full overflow-hidden bg-black">
      <video ref={v1} src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260619_222559_363e35af-d0bc-4650-b3cb-58bf833daa51.mp4" className="absolute inset-0 w-full h-full object-cover" style={{ opacity: 1 - progress }} muted playsInline preload="auto" autoPlay />
      <video ref={v2} src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260619_232048_98292efb-9b9c-4089-a587-72f33437c8f8.mp4" className="absolute inset-0 w-full h-full object-cover" style={{ opacity: progress }} muted playsInline preload="auto" />

      <div className="absolute bottom-12 left-6 right-6 sm:bottom-8 sm:left-8 sm:right-auto md:bottom-16 md:left-12 max-w-2xl" style={{ opacity: state1Opacity, transform: `translateY(${state1TranslateY}px)`, pointerEvents: state1Opacity <= 0 ? 'none' : 'auto' }}>
        <h1 className="text-3xl sm:text-4xl md:text-6xl lg:text-7xl font-light leading-[1.05] tracking-tight mb-4 md:mb-6">Будущее<br />регенерации кожи</h1>
        <p className="text-xs sm:text-sm md:text-base text-white/70 max-w-md mb-6 md:mb-8">Наука вместо догадок. g.a.d. объединяет клеточные исследования и биоактивные формулы, чтобы раскрыть истинное сияние вашей кожи.</p>
        <button className="bg-[#5794E2] hover:bg-[#4a84d0] text-white rounded-full text-xs sm:text-sm px-6 sm:px-8 py-3 sm:py-3.5 transition-colors">Узнать больше</button>
      </div>

      <div className="hidden sm:flex absolute bottom-8 right-8 md:bottom-16 md:right-12 bg-white rounded-2xl p-4 md:p-5 items-center gap-4 md:gap-5 shadow-2xl max-w-[380px] md:max-w-[460px]" style={{ opacity: state1Opacity, transform: `translateY(${state1TranslateY}px)`, pointerEvents: state1Opacity <= 0 ? 'none' : 'auto' }}>
        <img src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260619_220258_2f77857f-c799-4cce-9818-442542b98f2a.png&w=1280&q=85" alt="g.a.d. BioActive" className="w-20 h-20 md:w-24 md:h-24 rounded-xl object-cover flex-shrink-0" />
        <div>
          <p className="text-sm font-medium text-[#010101] leading-tight">g.a.d.<br />BioActive</p>
          <p className="text-[#666] text-xs mt-1">CellBoost™ 3.0</p>
        </div>
        <button className="w-9 h-9 rounded-full bg-[#3b82f6] flex items-center justify-center text-white ml-auto flex-shrink-0">
          <i data-lucide="arrow-right" className="w-4 h-4"></i>
        </button>
      </div>

      <div className="absolute bottom-12 sm:bottom-12 md:bottom-20 left-0 right-0 px-6 text-center" style={{ opacity: state2Opacity, transform: `translateY(${state2TranslateY}px)`, pointerEvents: state2Opacity <= 0 ? 'none' : 'auto' }}>
        <h2 className="text-2xl sm:text-3xl md:text-5xl lg:text-6xl font-light leading-[1.1] tracking-tight mb-4 md:mb-5">Клинически передовая<br />наука о коже</h2>
        <p className="text-xs sm:text-sm md:text-base text-white/70 max-w-lg mx-auto">Наш патентованный пептидный комплекс проникает на клеточном уровне, стимулирует естественный коллаген и восстанавливает молодую упругость кожи.</p>
        <div className="flex sm:hidden mt-6 gap-6 justify-center items-center">
          <div className="text-center"><div className="text-xl font-light">8M+</div><div className="text-[10px] text-white/50">Кожа обновлена</div></div>
          <div className="w-[1px] h-8 bg-[#5794E2]/40"></div>
          <div className="text-center"><div className="text-xl font-light">96.4%</div><div className="text-[10px] text-white/50">Видимый результат</div></div>
          <div className="w-[1px] h-8 bg-[#5794E2]/40"></div>
          <div className="text-center"><div className="text-xl font-light">37</div><div className="text-[10px] text-white/50">Патенты получены</div></div>
        </div>
      </div>

      <div className="hidden sm:flex absolute right-8 md:right-12 top-1/2 flex-col gap-8" style={{ opacity: state2Opacity, transform: `translateY(calc(-50% + ${state2TranslateY}px))`, pointerEvents: state2Opacity <= 0 ? 'none' : 'auto' }}>
        <div>
          <div className="text-3xl md:text-4xl font-light">8M+</div>
          <div className="text-xs md:text-sm text-white/50">Кожа обновлена</div>
          <div className="w-12 h-[1px] bg-[#5794E2]/60 mt-4"></div>
        </div>
        <div>
          <div className="text-3xl md:text-4xl font-light">96.4%</div>
          <div className="text-xs md:text-sm text-white/50">Видимый результат</div>
          <div className="w-12 h-[1px] bg-[#5794E2]/60 mt-4"></div>
        </div>
        <div>
          <div className="text-3xl md:text-4xl font-light">37</div>
          <div className="text-xs md:text-sm text-white/50">Патенты получены</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [splashComplete, setSplashComplete] = useState(false);
  return (
    <div className="fixed inset-0 w-full h-full bg-black overflow-hidden">
      {!splashComplete && <SplashScreen onComplete={() => setSplashComplete(true)} />}
      <Navbar isActive={splashComplete} />
      <HeroSection isActive={splashComplete} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
