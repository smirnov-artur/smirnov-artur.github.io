<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lithos — Layers Hold Tales of Time</title>
    <meta name="description" content="Lithos is an interactive geology course: trace stones, fossils, and deep time with a cursor-driven crust reveal.">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        playfair: ['Playfair Display', 'serif'],
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }

        @keyframes heroReveal { 0%{opacity:0;transform:translateY(28px);filter:blur(12px)} 100%{opacity:1;transform:translateY(0);filter:blur(0)} }
        @keyframes heroFadeUp { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }
        @keyframes heroZoom { 0%{transform:scale(1.12)} 100%{transform:scale(1)} }
        .hero-anim { opacity:0; animation-fill-mode:forwards; animation-timing-function:cubic-bezier(0.16,1,0.3,1); }
        .hero-reveal { animation-name:heroReveal; animation-duration:1.1s; }
        .hero-fade { animation-name:heroFadeUp; animation-duration:1s; }
        .hero-zoom { animation:heroZoom 1.8s cubic-bezier(0.16,1,0.3,1) forwards; }
        @media (prefers-reduced-motion: reduce){ .hero-anim,.hero-zoom{ animation:none; opacity:1; } }
    </style>
</head>
<body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        const Menu = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" />
            </svg>
        );
        const X = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
            </svg>
        );

        const SPOTLIGHT_R = 260;
        const BG_IMAGE_1 = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_195923_b0ba8ace-1d1d-4f2c-9a28-1ab84b330680.png&w=1280&q=85";
        const BG_IMAGE_2 = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_201152_bba90a12-bf12-459f-91f0-51f237dbaf3b.png&w=1280&q=85";

        function RevealLayer({ image, cursorX, cursorY }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const resize = () => {
                    const c = canvasRef.current;
                    if (!c) return;
                    c.width = window.innerWidth;
                    c.height = window.innerHeight;
                };
                resize();
                window.addEventListener('resize', resize);
                return () => window.removeEventListener('resize', resize);
            }, []);

            let maskUrl = null;
            const canvas = canvasRef.current;
            if (canvas && canvas.width && canvas.height) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const gradient = ctx.createRadialGradient(cursorX, cursorY, 0, cursorX, cursorY, SPOTLIGHT_R);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.4, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.6, 'rgba(255,255,255,0.75)');
                gradient.addColorStop(0.75, 'rgba(255,255,255,0.4)');
                gradient.addColorStop(0.88, 'rgba(255,255,255,0.12)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cursorX, cursorY, SPOTLIGHT_R, 0, Math.PI * 2);
                ctx.fill();
                maskUrl = canvas.toDataURL();
            }

            return (
                <React.Fragment>
                    <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none" style={{ display: 'none' }} />
                    <div
                        className="absolute inset-0 bg-center bg-cover bg-no-repeat z-30 pointer-events-none"
                        style={{
                            backgroundImage: `url("${image}")`,
                            WebkitMaskImage: maskUrl ? `url(${maskUrl})` : 'none',
                            maskImage: maskUrl ? `url(${maskUrl})` : 'none',
                            WebkitMaskSize: '100% 100%',
                            maskSize: '100% 100%',
                        }}
                    />
                </React.Fragment>
            );
        }

        function App() {
            const mouse = useRef({ x: -999, y: -999 });
            const smooth = useRef({ x: -999, y: -999 });
            const rafRef = useRef(null);
            const [cursorPos, setCursorPos] = useState({ x: -999, y: -999 });
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => {
                const onMove = (e) => { mouse.current.x = e.clientX; mouse.current.y = e.clientY; };
                window.addEventListener('mousemove', onMove);

                const tick = () => {
                    smooth.current.x += (mouse.current.x - smooth.current.x) * 0.1;
                    smooth.current.y += (mouse.current.y - smooth.current.y) * 0.1;
                    setCursorPos({ x: smooth.current.x, y: smooth.current.y });
                    rafRef.current = requestAnimationFrame(tick);
                };
                rafRef.current = requestAnimationFrame(tick);

                return () => {
                    window.removeEventListener('mousemove', onMove);
                    cancelAnimationFrame(rafRef.current);
                };
            }, []);

            const navLinks = ['Field Guides', 'Geology', 'Plans', 'Live Tour'];

            return (
                <div className="min-h-screen bg-white tracking-[-0.02em]" style={{ fontFamily: "'Inter', sans-serif" }}>
                    <nav className="fixed top-0 left-0 right-0 z-[100] flex items-center justify-between p-4 sm:p-5">
                        <div className="flex items-center gap-2">
                            <svg width="26" height="26" viewBox="0 0 256 256" fill="#ffffff">
                                <path d="M 256 256 L 128 256 L 0 128 L 128 128 Z M 256 128 L 128 128 L 0 0 L 128 0 Z" />
                            </svg>
                            <span className="text-white text-2xl font-playfair italic">Lithos</span>
                        </div>

                        <div className="hidden md:flex absolute left-1/2 -translate-x-1/2 bg-white/20 backdrop-blur-md border border-white/30 rounded-full px-2 py-2 items-center gap-1">
                            <button type="button" className="text-white px-4 py-1.5 rounded-full text-sm font-medium">Course</button>
                            {navLinks.map((l) => (
                                <button key={l} type="button" className="text-white/80 hover:bg-white/20 hover:text-white transition-colors px-4 py-1.5 rounded-full text-sm font-medium">{l}</button>
                            ))}
                        </div>

                        <div className="flex items-center gap-3">
                            <button type="button" className="hidden md:block bg-white text-gray-900 text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-100">Sign Up</button>
                            <button type="button" aria-label="Menu" onClick={() => setMenuOpen((v) => !v)} className="md:hidden text-white">
                                {menuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                            </button>
                        </div>

                        {menuOpen && (
                            <div className="md:hidden absolute top-full left-4 right-4 mt-2 bg-white/20 backdrop-blur-md border border-white/30 rounded-2xl p-3 flex flex-col gap-1">
                                <button type="button" className="text-white text-left px-4 py-2 rounded-full text-sm font-medium bg-white/10">Course</button>
                                {navLinks.map((l) => (
                                    <button key={l} type="button" className="text-white/80 text-left hover:bg-white/20 hover:text-white transition-colors px-4 py-2 rounded-full text-sm font-medium">{l}</button>
                                ))}
                                <button type="button" className="mt-1 bg-white text-gray-900 text-sm font-semibold px-4 py-2 rounded-full text-left">Sign Up</button>
                            </div>
                        )}
                    </nav>

                    <section className="relative w-full overflow-hidden h-screen bg-black" style={{ height: '100dvh' }}>
                        <div className="absolute inset-0 bg-center bg-cover bg-no-repeat z-10 hero-zoom" style={{ backgroundImage: `url("${BG_IMAGE_1}")` }} />

                        <RevealLayer image={BG_IMAGE_2} cursorX={cursorPos.x} cursorY={cursorPos.y} />

                        <div className="absolute top-[14%] left-0 right-0 flex flex-col items-center text-center px-5 pointer-events-none z-50">
                            <h1 className="text-white leading-[0.95]">
                                <span className="hero-anim hero-reveal block font-playfair italic font-normal text-5xl sm:text-7xl md:text-8xl" style={{ letterSpacing: '-0.05em', animationDelay: '0.25s' }}>Layers hold</span>
                                <span className="hero-anim hero-reveal block font-normal text-5xl sm:text-7xl md:text-8xl -mt-1" style={{ letterSpacing: '-0.08em', animationDelay: '0.42s' }}>tales of time</span>
                            </h1>
                        </div>

                        <div className="hero-anim hero-fade hidden sm:block absolute bottom-14 left-10 md:left-14 max-w-[260px] z-50" style={{ animationDelay: '0.7s' }}>
                            <p className="text-sm text-white/80 leading-relaxed">Every layer of sediment records a chapter of our planet, from ancient seabeds to drifting ash, layered across millions of years beneath us.</p>
                        </div>

                        <div className="hero-anim hero-fade absolute bottom-10 sm:bottom-24 left-5 right-5 sm:left-auto sm:right-10 md:right-14 max-w-full sm:max-w-[260px] flex flex-col items-start gap-4 sm:gap-5 z-50" style={{ animationDelay: '0.85s' }}>
                            <p className="text-xs sm:text-sm text-white/80 leading-relaxed">Our interactive maps let you peel back the crust to trace how stones, fossils, and deep time combine to shape the ground beneath your feet.</p>
                            <button type="button" className="bg-[#e8702a] hover:bg-[#d2611f] text-white text-sm font-medium px-7 py-3 rounded-full transition-all hover:scale-[1.03] active:scale-95 hover:shadow-lg hover:shadow-[#e8702a]/30">Start Digging</button>
                        </div>
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
