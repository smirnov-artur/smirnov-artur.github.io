<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { motion, AnimatePresence } = Motion;

const VIDEO_SRC = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260601_110537_3a579fa0-7bbc-4d94-9d25-0e816c7840f5.mp4";
const NAV_LINKS = ["Лаборатория", "Студия", "Вакансии", "Магазин"];
const SERVICE_OPTIONS = ["Бренд", "Диджитал", "Кампания", "Другое"];

function useTypewriter(text, speed = 38, startDelay = 600) {
  const [displayed, setDisplayed] = useState("");
  const [done, setDone] = useState(false);
  useEffect(() => {
    let i = 0;
    let interval;
    setDisplayed("");
    setDone(false);
    const startTimeout = setTimeout(() => {
      interval = setInterval(() => {
        i += 1;
        setDisplayed(text.slice(0, i));
        if (i >= text.length) {
          clearInterval(interval);
          setDone(true);
        }
      }, speed);
    }, startDelay);
    return () => { clearTimeout(startTimeout); clearInterval(interval); };
  }, [text, speed, startDelay]);
  return { displayed, done };
}

function CheckIcon(props) {
  return (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <path d="M20 6 9 17l-5-5" />
    </svg>
  );
}

function ArrowIcon(props) {
  return (
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      <path d="M5 12h14" />
      <path d="m12 5 7 7-7 7" />
    </svg>
  );
}

function BackgroundVideo() {
  const videoRef = useRef(null);

  // Desktop mouse scrubbing hook
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    let prevX = null;
    let targetTime = 0;
    const onMouseMove = (e) => {
      if (window.innerWidth < 1024) return;
      if (prevX === null) { prevX = e.clientX; return; }
      const delta = e.clientX - prevX;
      prevX = e.clientX;
      const duration = video.duration;
      if (!duration) return;
      targetTime += (delta / window.innerWidth) * 0.8 * duration;
      targetTime = Math.max(0, Math.min(duration, targetTime));
      video.currentTime = targetTime;
    };
    const onSeeked = () => {};
    window.addEventListener("mousemove", onMouseMove);
    video.addEventListener("seeked", onSeeked);
    return () => {
      window.removeEventListener("mousemove", onMouseMove);
      video.removeEventListener("seeked", onSeeked);
    };
  }, []);

  // Mobile autoplay hook
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    const applyMobilePlayback = () => {
      if (window.innerWidth < 1024) {
        video.autoplay = true;
        video.play().catch(() => {});
      }
    };
    applyMobilePlayback();
    window.addEventListener("resize", applyMobilePlayback);
    return () => window.removeEventListener("resize", applyMobilePlayback);
  }, []);

  return (
    <div className="order-last lg:order-none relative lg:absolute lg:inset-0 lg:z-0 overflow-hidden pointer-events-none w-full aspect-square md:aspect-video lg:aspect-auto lg:h-full bg-neutral-50 lg:bg-transparent">
      <video ref={videoRef} src={VIDEO_SRC} muted playsInline preload="auto" className="w-full h-full object-cover object-right lg:object-right-bottom" />
    </div>
  );
}

176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
        </div>
        <nav className="hidden md:flex flex-row text-[23px] text-black">
          {NAV_LINKS.map((link, i) => (
            <React.Fragment key={link}>
              <a href="#" className="hover:opacity-60 transition-opacity">{link}</a>
              {i < NAV_LINKS.length - 1 && <span className="opacity-40">,&nbsp;</span>}
            </React.Fragment>
          ))}
        </nav>
        <a href="#" className="hidden md:block text-[23px] text-black underline underline-offset-2 hover:opacity-60 transition-opacity">Написать нам</a>
        <button className="md:hidden flex flex-col justify-center items-center gap-[5px] w-6 h-6" onClick={() => setIsMobileMenuOpen((v) => !v)} aria-label="Меню">
          <span className={`w-6 h-[2px] bg-black transition-all duration-300 ${isMobileMenuOpen ? "rotate-45 translate-y-[7px]" : ""}`}></span>
          <span className={`w-6 h-[2px] bg-black transition-all duration-300 ${isMobileMenuOpen ? "opacity-0" : ""}`}></span>
          <span className={`w-6 h-[2px] bg-black transition-all duration-300 ${isMobileMenuOpen ? "-rotate-45 -translate-y-[7px]" : ""}`}></span>
        </button>
      </header>
      <div className={`md:hidden fixed inset-0 z-[9] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center gap-8 transition-opacity duration-300 ${isMobileMenuOpen ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"}`}>
        {NAV_LINKS.map((link) => (
          <a key={link} href="#" className="text-3xl text-black" onClick={() => setIsMobileMenuOpen(false)}>{link}</a>
        ))}
        <a href="#" className="text-3xl text-black underline underline-offset-2" onClick={() => setIsMobileMenuOpen(false)}>Написать нам</a>
      </div>
    </React.Fragment>
  );
}

function Headline() {
  const { displayed, done } = useTypewriter("будем рады\nуслышать вас!", 38, 600);
  return (
    <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6 }}>
      <h1 className="text-5xl md:text-6xl lg:text-[76px] font-normal tracking-tight text-black leading-[1.08] mb-8 select-none w-full whitespace-pre-wrap">
        {displayed}
        {!done && <span className="inline-block w-[2px] h-[1.1em] bg-black align-middle ml-[2px] animate-blink" />}
      </h1>
    </motion.div>
  );
}

function Description() {
  return (
    <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6, delay: 0.1 }}>
      <p className="text-lg md:text-xl text-[#5A635A] leading-relaxed font-normal mb-14 max-w-2xl">
        Если есть вопросы или пожелания, <br /> напишите нам — и мы ответим как можно скорее.
      </p>
    </motion.div>
  );
}

function ServicePills() {
  const [services, setServices] = useState([]);
  const toggle = (opt) => {
    setServices((prev) => (prev.includes(opt) ? prev.filter((x) => x !== opt) : [...prev, opt]));
  };
  return (
    <div>
      <h2 className="text-2xl font-medium tracking-tight mb-2">Какая услуга вам нужна?</h2>
      <p className="opacity-85 text-[#738273] mb-8">Можно выбрать несколько вариантов</p>
      <div className="flex flex-wrap gap-3">
        {SERVICE_OPTIONS.map((opt) => {
          const active = services.includes(opt);
          return (
            <motion.button
              key={opt}
              onClick={() => toggle(opt)}
              whileTap={{ scale: 0.96 }}
              className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-base transition-colors ${active ? "bg-[#1C2E1E] text-white shadow-md shadow-emerald-950/5 transform" : "bg-white text-[#1C2E1E] border border-[#F1F3F1] hover:bg-[#F1F3F1]/55"}`}
            >
              {opt}
              <AnimatePresence>
                {active && (
                  <motion.span
                    initial={{ scale: 0, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    exit={{ scale: 0, opacity: 0 }}
                    transition={{ type: "spring", stiffness: 300, damping: 20 }}
                    className="inline-flex"
                  >
                    <CheckIcon />
                  </motion.span>
                )}
              </AnimatePresence>
            </motion.button>
          );
        })}
      </div>
      <AnimatePresence mode="wait">
        {services.length === 0 ? (
          <motion.p key="empty" initial={{ opacity: 0 }} animate={{ opacity: 0.5 }} exit={{ opacity: 0 }} className="italic text-xs mt-6">
            Отметьте нужные варианты выше.
          </motion.p>
        ) : (
          <motion.div key="active" initial={{ height: 0, opacity: 0 }} animate={{ height: "auto", opacity: 1 }} exit={{ height: 0, opacity: 0 }} transition={{ type: "spring", stiffness: 300, damping: 30 }} className="overflow-hidden mt-6">
            <div className="bg-[#FAFBF9] border border-[#F1F3F1] rounded-2xl px-5 py-4 flex items-center justify-between gap-4">
              <span className="text-sm text-[#1C2E1E]">Готовы обсудить: {services.join(", ")}</span>
              <button className="flex items-center gap-1 text-[#4D6D47] uppercase text-xs font-medium shrink-0 hover:opacity-70 transition-opacity">
                Поехали <ArrowIcon />
              </button>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

function App() {
  return (
    <div className="relative bg-white text-neutral-900 font-sans selection:bg-[#EAECE9] selection:text-[#1C2E1E] antialiased overflow-x-hidden flex flex-col lg:block lg:min-h-screen">
      <BackgroundVideo />
      <Navbar />
      <div className="relative z-10 flex flex-col order-first lg:order-none w-full bg-white lg:bg-transparent pb-8 lg:pb-0 lg:min-h-screen">
        <main id="spade-hero" className="w-full max-w-7xl mx-auto px-6 py-12 flex-1 flex flex-col justify-center">
          <Headline />
          <Description />
          <ServicePills />
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
