    <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
  </svg>
);

const App = () => {
  const [active, setActive] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => { lucide.createIcons(); }, []);

  useEffect(() => {
    const id = setInterval(() => setActive(a => (a + 1) % SLIDES.length), 5000);
    return () => clearInterval(id);
  }, [active]);

  useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
  }, [menuOpen]);

  return (
    <section className="relative h-screen w-full overflow-hidden bg-black font-geist">
      <video
        className="absolute inset-0 w-full h-full object-cover"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_135039_b04d00db-6ee2-4e2a-a7f5-b2dfd3d24fd2.mp4"

        <nav className="flex items-center justify-between pt-6 sm:pt-8">

              <div className="relative w-20 h-20 md:w-24 md:h-24 lg:w-28 lg:h-28">
                <div className="absolute inset-0 rounded-full bg-white/10 backdrop-blur-md"></div>

                    <path id="badgeCircle" d="M 100,100 m -70,0 a 70,70 0 1,1 140,0 a 70,70 0 1,1 -140,0" />
                  </defs>
                  <text fontSize="10" fontWeight="300" letterSpacing="3" className="fill-white/80">
                    <textPath href="#badgeCircle">DESIGN • MODULES • DEVELOP • DEPLOY • ITERATE •</textPath>
                  </text>
                </svg>
              </div>
            </div>

            <div>
              <div className="max-w-2xl relative">
                {SLIDES.map((s, i) => (
                  <div
                    key={i}
                    className={i === active
                      ? "opacity-100 translate-y-0 relative transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)]"
                      : "opacity-0 translate-y-4 absolute inset-0 pointer-events-none transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)]"}
                  >
                    <h1 className="text-white text-xl sm:text-2xl md:text-3xl lg:text-[2.1rem] font-light leading-[1.45] tracking-tight">

              <p>Dynamic Interface Engine</p>

          <div className="flex items-center justify-between">

            <button

              aria-label="Close menu"
              className="w-10 h-10 rounded-full border border-white/30 flex items-center justify-center text-white"

            <span className="text-white/40 text-xs font-light">+1 (424) 800-7700</span>
          </div>
        </div>
      </div>
    </section>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
