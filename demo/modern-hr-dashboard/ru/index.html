        function FocusRing(){
            const size = 180, cx = 90, cy = 90, r = 68;
            const C = 2 * Math.PI * r;
            const progress = 0.70;
            const ticks = [];
            for (let i = 0; i < 60; i++) {
                const frac = i / 60;
                if (frac < progress) continue;
                const angle = frac * 360 - 90;
                const rad = angle * Math.PI / 180;
                const x1 = cx + (r - 4) * Math.cos(rad), y1 = cy + (r - 4) * Math.sin(rad);
                const x2 = cx + (r + 4) * Math.cos(rad), y2 = cy + (r + 4) * Math.sin(rad);
                ticks.push(<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#898989" strokeOpacity="0.9" strokeWidth="1.2" strokeLinecap="round" />);
            }
            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="mx-auto">
                    {ticks}
                    <circle cx={cx} cy={cy} r={r} fill="none" stroke="#FFD85F" strokeWidth="10" strokeLinecap="round"
                        strokeDasharray={`${C * progress} ${C}`} transform={`rotate(-90 ${cx} ${cy})`} />
                    <text x={cx} y={cy - 2} textAnchor="middle" fontSize="22" fill="#303030">02:35</text>
                    <text x={cx} y={cy + 16} textAnchor="middle" fontSize="10" fill="#898989">Глубокий фокус</text>
                </svg>
            );
        }

                                </div>
                                <div className="flex-1 min-w-0">
                                    <div className={"text-sm truncate " + (t.done ? 'line-through text-white/30' : 'text-white')}>{t.title}</div>
                                    <div className="text-xs text-white/30">{t.time}</div>
                                </div>
                                {t.done ? (
                                    <div className="w-5 h-5 rounded-full bg-[#FFD85F] flex items-center justify-center shrink-0"><i data-lucide="check" style={{ width: 10, height: 10 }} className="text-[#303030]"></i></div>
                                ) : (
                                    <div className="w-5 h-5 rounded-full border border-white/20 shrink-0"></div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const ACCORDION = [
            { title: 'Пенсионные накопления' },
            { title: 'Техника' },
            { title: 'Детализация выплат' },
            { title: 'Льготы и бонусы' },
        ];

        function AccordionCard(){
            const [openIdx, setOpenIdx] = useState(1);
            return (
                <div className="bg-white/60 backdrop-blur-3xl rounded-3xl overflow-hidden lg:h-full">
                    {ACCORDION.map((item, i) => {
                        const isOpen = openIdx === i;
                        return (
                            <div key={item.title} className={'accordion-item ' + (i > 0 ? 'border-t border-[#898989]/15' : '')}>
                                <button className="w-full flex items-center justify-between px-5 py-4 hover:bg-[#898989]/8 transition-colors" onClick={() => setOpenIdx(isOpen ? -1 : i)}>
                                    <span className="text-sm text-[#303030]">{item.title}</span>
                                    <i data-lucide="chevron-down" style={{ width: 15, height: 15, display: isOpen ? 'none' : 'block' }} className="text-[#898989]"></i>
                                    <i data-lucide="chevron-up" style={{ width: 15, height: 15, display: isOpen ? 'block' : 'none' }} className="text-[#898989]"></i>
                                </button>
                                {i === 1 && (
                                    <div style={{ display: isOpen ? 'flex' : 'none' }} className="px-5 pb-4 items-center gap-3 border-t border-[#898989]/15 pt-4">
                                        <img src="https://images.pexels.com/photos/18105/pexels-photo.jpg?auto=compress&cs=tinysrgb&w=120" className="w-12 h-10 rounded-lg object-cover" alt="" />
                                        <div className="flex-1">
                                            <div className="text-sm text-[#303030]">Ridgeline 14</div>
                                            <div className="text-xs text-[#898989]">Edition X1</div>
                                        </div>
                                        <button className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#898989]/10 transition-colors" aria-label="Ещё">
                                            <i data-lucide="more-vertical" style={{ width: 15, height: 15 }} className="text-[#898989]"></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        function AvatarGroup({ urls }){
            return (
                <div className="flex">
                    {urls.map((u, i) => (
                        <img key={u} src={u} className="w-6 h-6 rounded-full object-cover border-2 border-white" style={i > 0 ? { marginLeft: -6 } : {}} alt="" />
                    ))}
                </div>
            );
        }

        function CalendarCard(){
            const times = ['08:00', '09:00', '10:00', '11:00'];
            const days = [['Пн', 22], ['Вт', 23], ['Ср', 24], ['Чт', 25], ['Пт', 26], ['Сб', 27]];
            return (
                <div className="bg-white/60 backdrop-blur-3xl rounded-3xl p-5 lg:h-full flex flex-col" style={{ boxShadow: '0 2px 20px rgba(0,0,0,0.06)' }}>
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-sm text-[#898989]">Июль</span>
                        <span className="text-base text-[#303030]">Август 2024</span>
                        <span className="border border-[#898989]/25 rounded-full px-4 py-1 text-sm text-[#303030]">Сентябрь</span>
                    </div>
                    <div className="flex ml-14 sm:ml-16 mb-2 gap-0">
                        {days.map(([d, n]) => (
                            <div key={n} className={"flex-1 text-xs " + (n === 24 ? 'text-[#303030]' : 'text-[#898989]')}>{d} {n}</div>
                        ))}
                    </div>
                    <div className="h-40 lg:flex-1 flex">
                        <div className="w-14 sm:w-16 flex flex-col justify-between text-xs text-[#898989] py-1 shrink-0">
                            {times.map(t => <div key={t}>{t}</div>)}
                        </div>
                        <div className="flex-1 relative">
                            <div className="absolute inset-0 flex">
                                {[0, 1, 2, 3, 4, 5].map(i => <div key={i} className="flex-1 border-l border-dashed border-[#898989]/20"></div>)}
                            </div>
                            <div className="absolute bg-[#303030] rounded-2xl p-2.5 flex flex-col justify-between" style={{ left: '16.66%', right: '33%', top: 4, height: 58 }}>
                                <div>
                                    <div className="text-white text-xs font-medium truncate">Общее собрание</div>
                                    <div className="text-white/50 text-[10px] hidden sm:block truncate">Итоги по командам за месяц</div>
                                </div>
                                <AvatarGroup urls={[
                                    'https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg?auto=compress&cs=tinysrgb&w=60',
                                    'https://images.pexels.com/photos/1681010/pexels-photo-1681010.jpeg?auto=compress&cs=tinysrgb&w=60',
                                    'https://images.pexels.com/photos/10025071/pexels-photo-10025071.jpeg?auto=compress&cs=tinysrgb&w=60',
                                ]} />
                            </div>
                            <div className="absolute bg-white border border-[#898989]/25 rounded-2xl p-2.5 flex flex-col justify-between" style={{ left: '55%', right: '0%', top: 84, height: 56 }}>
                                <div>
                                    <div className="text-[#303030] text-xs font-medium truncate">Вводная встреча</div>
                                    <div className="text-[#898989] text-[10px] hidden sm:block truncate">Ориентация для новых сотрудников</div>
                                </div>
                                <AvatarGroup urls={[
                                    'https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg?auto=compress&cs=tinysrgb&w=60',
                                    'https://images.pexels.com/photos/1681010/pexels-photo-1681010.jpeg?auto=compress&cs=tinysrgb&w=60',
                                ]} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function DesktopGrid(){
            return (
                <div className="grid gap-1 h-full" style={{ gridTemplateColumns: 'repeat(4, 1fr)', gridTemplateRows: '1fr 1fr' }}>
                    <div className="h-full min-h-0" style={{ gridColumn: '1', gridRow: '1' }}><ProfilePhotoCard /></div>
                    <div className="h-full min-h-0" style={{ gridColumn: '2', gridRow: '1' }}><ProgressCard /></div>
                    <div className="h-full min-h-0" style={{ gridColumn: '3', gridRow: '1' }}><TimeTrackerCard /></div>
                    <div className="h-full min-h-0" style={{ gridColumn: '4', gridRow: '1 / span 2' }}><OnboardingColumn /></div>
                    <div className="h-full min-h-0" style={{ gridColumn: '1', gridRow: '2' }}><AccordionCard /></div>
                    <div className="h-full min-h-0" style={{ gridColumn: '2 / span 2', gridRow: '2' }}><CalendarCard /></div>
                </div>
            );
        }

        function MobileTabletGrid(){
            return (
                <React.Fragment>
                    <div className="flex md:hidden flex-col gap-3">
                        <ProfilePhotoCard /><ProgressCard /><TimeTrackerCard /><OnboardingColumn /><AccordionCard /><CalendarCard />
                    </div>
                    <div className="hidden md:grid lg:hidden gap-3" style={{ gridTemplateColumns: '1fr 1fr', alignItems: 'stretch' }}>
                        <ProfilePhotoCard /><ProgressCard /><TimeTrackerCard /><AccordionCard />
                        <div className="col-span-2"><CalendarCard /></div>
                        <div className="col-span-2"><OnboardingColumn /></div>
                    </div>
                </React.Fragment>
            );
        }

        function App(){
            useEffect(() => { lucide.createIcons(); });
            return (
                <React.Fragment>
                    <Background />
                    <div className="hidden lg:flex relative z-10 max-w-[1400px] mx-auto h-screen px-6 py-6 flex-col overflow-hidden">
                        <Navbar />
                        <WelcomeRow />
                        <div className="flex-1 min-h-0">
                            <DesktopGrid />
                        </div>
                    </div>
                    <div className="lg:hidden relative z-10 max-w-[1400px] mx-auto min-h-screen px-4 sm:px-6 py-6 flex flex-col gap-0 overflow-y-auto">
                        <Navbar />
                        <WelcomeRow />
                        <MobileTabletGrid />
                        <div className="h-6"></div>
                    </div>
                </React.Fragment>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
