<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор кухни на заказ</title>
<style>
:root{--acc:#1f6feb}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:16px/1.4 system-ui,sans-serif;padding:16px}
main{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#666;font-size:14px;margin:0 0 16px}
label{display:block;font-size:14px;margin:16px 0 6px;font-weight:600}
input,select{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:10px;background:#fff}
input:focus,select:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.result{margin-top:24px;padding:16px;background:#f2f6ff;border-radius:10px}
.total{font-size:40px;font-weight:700;color:var(--acc);margin:0}
.sub2{font-size:14px;color:#333;margin-top:4px}
.lines{font-size:14px;color:#333;margin-top:8px}
.lines div{display:flex;justify-content:space-between;padding:2px 0}
a.cta{display:block;text-align:center;margin-top:16px;padding:14px;background:var(--acc);color:#fff;
text-decoration:none;border-radius:10px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Калькулятор кухни на заказ</h1>
<p class="sub">Цены примерные, точную назовёт замерщик</p>

<label for="len">Длина гарнитура по стене, п. м</label>
<input id="len" type="number" inputmode="decimal" min="1" max="12" step="0.1" value="3.2">

<label for="shape">Форма</label>
<select id="shape">
<option value="0">Прямая</option>
<option value="0.15">Угловая — +15 %</option>
<option value="0.25">П-образная — +25 %</option>
</select>

<label for="cls">Класс</label>
<select id="cls">
<option value="28000">Эконом — 28 000 ₽/п. м</option>
<option value="42000">Стандарт — 42 000 ₽/п. м</option>
<option value="70000">Премиум — 70 000 ₽/п. м</option>
</select>

<label for="facade">Фасады</label>
<select id="facade">
<option value="0">Плёнка ПВХ — в цене</option>
<option value="0.20">Эмаль — +20 %</option>
<option value="0.35">Шпон — +35 %</option>
</select>

<label for="top">Столешница</label>
<select id="top">
<option value="0">ЛДСП — в цене</option>
<option value="9000">Искусственный камень — +9 000 ₽/п. м</option>
<option value="16000">Кварц — +16 000 ₽/п. м</option>
</select>

<label for="fitting">Фурнитура</label>
<select id="fitting">
<option value="0">Стандарт — в цене</option>
<option value="0.12">Blum — +12 %</option>
</select>

<div class="result">
<p class="total" id="total" aria-live="polite">0 ₽</p>
<p class="sub2" id="rassrochka"></p>
<div class="lines" id="lines"></div>
</div>

<a class="cta" id="cta" href="https://t.me/smirnovarturr?text=" target="_blank" rel="noopener">Получить точный расчёт</a>
</main>
<script>
const $=id=>document.getElementById(id);
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'}
function calc(){
 const len=+$('len').value||0;
 const shapeK=+$('shape').value;
 const clsPrice=+$('cls').value;
 const facadeK=+$('facade').value;
 const topPrice=+$('top').value;
 const fitK=+$('fitting').value;
 let base=len*clsPrice;
 base=base*(1+shapeK);
 base=base*(1+facadeK);
 base=base*(1+fitK);
 const topCost=len*topPrice;
 let subtotal=base+topCost;
 const montage=subtotal*0.08;
 const total=subtotal+montage;
 const monthly=total/12;
 $('total').textContent=fmt(total);
 $('rassrochka').textContent='В месяц при рассрочке на 12 без переплаты: '+fmt(monthly);
 $('lines').innerHTML=`
  <div><span>Гарнитур с надбавками</span><span>${fmt(base)}</span></div>
  <div><span>Столешница</span><span>${fmt(topCost)}</span></div>
  <div><span>Монтаж 8 %</span><span>${fmt(montage)}</span></div>`;
 const text=`Кухня на заказ ${len} п.м. Расчёт: ${fmt(total)}, в месяц ${fmt(monthly)} (рассрочка 12 мес)`;
 $('cta').href='https://t.me/smirnovarturr?text='+encodeURIComponent(text);
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));
calc();
</script>
<!--
Таблица цен (правьте цифры без программиста):
Класс: эконом 28 000 ₽/п.м, стандарт 42 000, премиум 70 000
Форма: прямая 0%, угловая +15%, П-образная +25%
Фасады: плёнка ПВХ 0%, эмаль +20%, шпон +35%
Столешница: ЛДСП в цене, камень +9 000 ₽/п.м, кварц +16 000 ₽/п.м
Фурнитура: стандарт 0%, Blum +12%
Монтаж: 8% от суммы
-->
</body>
</html>
