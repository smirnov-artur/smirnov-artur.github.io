<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — Planet Jumping</title>
<!-- Видео и картинки грузятся по ссылкам с CloudFront. Шрифтов SF Pro и Aalto нет:
     если их нет на машине, вместо них Inter и Big Shoulders Display; у Big Shoulders нет кириллицы — русские буквы берёт Oswald.
     ?lang=ru — русская версия для русского портфолио, без параметра — английская.
     Логотип Ubernatural из промпта заменён на наш g.a.d. (кольцо и слово, Unbounded, лайм #D6FF3F — как video/brend/LOGO-g.a.d.png). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500&family=Inter:wght@100;400;700&family=Oswald:wght@400&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'SF Pro';font-weight:400;src:local('SF Pro Display'),local('SF Pro Text'),local('SFProDisplay-Regular')}
@font-face{font-family:'SF Pro';font-weight:700;src:local('SF Pro Display Bold'),local('SFProDisplay-Bold')}
@font-face{font-family:'SF Pro Thin';font-weight:100;src:local('SF Pro Display Thin'),local('SFProDisplay-Thin')}
@font-face{font-family:'Aalto';font-weight:400;src:local('Aalto'),local('Aalto Regular')}
:root{font-family:'SF Pro',Inter,Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* header */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer;font:inherit}

/* sidebar */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* portal */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
  border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

/* content */
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.planet-content h1{font-family:Aalto,'Big Shoulders Display',Oswald,'Arial Narrow',sans-serif;font-size:clamp(128px,21.8vw,314px);
  font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
.planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}

/* misc */
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* preloader */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;overflow:visible;opacity:0;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),
             height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1),opacity .3s ease}
.floating-logo.font-ok{opacity:1}   /* слово g.a.d. без своего шрифта не показываем: ждём Unbounded, не дольше 1,5 с */
/* логотип живой: кольцо прорисовывается вместе с процентами, буквы выходят по одной, на 100 % вспышка, в углу по кольцу ходит точка */
.logo-body,.logo-orbit{transform-box:view-box;transform-origin:50px 50px}
.logo-ring{transition:stroke-dashoffset .12s linear}
.logo-word tspan{opacity:0}
.floating-logo.font-ok .logo-word tspan{animation:logo-letter .7s cubic-bezier(.22,1,.36,1) both}
.logo-word tspan:nth-child(1){animation-delay:.15s}.logo-word tspan:nth-child(2){animation-delay:.27s}
.logo-word tspan:nth-child(3){animation-delay:.39s}.logo-word tspan:nth-child(4){animation-delay:.51s}
.logo-word tspan:nth-child(5){animation-delay:.63s}.logo-word tspan:nth-child(6){animation-delay:.75s}
@keyframes logo-letter{0%{opacity:0;fill:#fff}60%{opacity:1;fill:#fff}100%{opacity:1;fill:#D6FF3F}}
.floating-logo.is-done{animation:logo-glow 1.4s ease both}
.floating-logo.is-done .logo-body{animation:logo-pulse .75s cubic-bezier(.22,1,.36,1) both}
@keyframes logo-glow{0%{filter:drop-shadow(0 0 0 rgba(214,255,63,0))}30%{filter:drop-shadow(0 0 16px rgba(214,255,63,.9))}100%{filter:drop-shadow(0 0 5px rgba(214,255,63,.35))}}
@keyframes logo-pulse{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
.logo-orbit{opacity:0;transition:opacity .6s ease}
.floating-logo.is-settled .logo-orbit{opacity:1;animation:logo-spin 7s linear infinite}
@keyframes logo-spin{to{transform:rotate(360deg)}}
/* 37 px из промпта — под значок; наше кольцо со словом там не читается, в углу держим 46 px — вровень с меню */
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(16px,2.9vh,26px);width:46px;height:46px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Inter,Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Inter,Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* cursor */
html,body,button,a,.portal{cursor:none!important}
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font:16px/1.2 'SF Pro',Inter,Arial,sans-serif;
  white-space:nowrap;opacity:0;transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}

/* entrance / switch */
body:not(.intro-ready) .header,.planet-list,.planet-content h1,.planet-content .fact{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}
@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* responsive */
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal-heading strong{font-size:16px}
  .menu{height:38px}
  .portal{border-radius:70px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}</style>
</head>
<body>
<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background" class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
    <video id="venus-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>

<script>
(() => {
const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
const TO_EARTH = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
const TO_VENUS = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
const MERCURY = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';

const $ = id => document.getElementById(id);
const exp = document.querySelector('.experience');
const list = document.querySelector('.planet-list');
const portal = $('portal'), portalVideo = $('portal-video'), portalImage = $('portal-image');
const transitionVideo = $('transition-video');
const pc = $('portal-canvas'), ctx = pc.getContext('2d');
const sc = $('scene-canvas'), sctx = sc.getContext('2d');

const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
const states = {
  mars: { name: 'Mars', next: 'Earth', number: '[03]', portal: TO_EARTH, background: 'mars-background',
    facts: [['Distance:', 'About 228 million km (1.5 astronomical units).'],
            ['Year:', 'One Martian year is equal to 687 Earth days.'],
            ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
            ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']] },
  earth: { name: 'Earth', next: 'Venus', number: '[02]', portal: TO_VENUS, background: 'earth-background',
    facts: [['Distance:', '149.6 million km from the Sun.'],
            ['Year:', '365.25 Earth days.'],
            ['Temperature:', 'Average surface temperature around 15 °C.'],
            ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']] },
  venus: { name: 'Venus', next: 'Mercury', number: '[06]', image: MERCURY, background: 'venus-background',
    facts: [['Distance:', '108.2 million km from the Sun.'],
            ['Year:', '225 Earth days.'],
            ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
            ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']] }
};

// русская версия: ?lang=ru. Ключи — английские имена, по ним же ищем активную планету
const RU = false;
const planetsRu = ['Меркурий', 'Венера', 'Земля', 'Марс', 'Юпитер', 'Сатурн', 'Уран', 'Нептун'];
const ru = {
  mars: { name: 'Марс', next: 'Земля',
    facts: [['Расстояние:', 'Около 228 млн км (1,5 астрономической единицы).'],
            ['Год:', 'Марсианский год длится 687 земных суток.'],
            ['Температура:', 'Около −60 °C, зимой на полюсах до −125 °C.'],
            ['Атмосфера:', 'Очень разреженная: 95 % углекислого газа и частые пылевые бури.']] },
  earth: { name: 'Земля', next: 'Венера',
    facts: [['Расстояние:', '149,6 млн км от Солнца.'],
            ['Год:', '365,25 земных суток.'],
            ['Температура:', 'В среднем около 15 °C у поверхности.'],
            ['Атмосфера:', 'В основном азот и кислород: есть жизнь и жидкая вода.']] },
  venus: { name: 'Венера', next: 'Меркурий',
    facts: [['Расстояние:', '108,2 млн км от Солнца.'],
            ['Год:', '225 земных суток.'],
            ['Температура:', 'Около 465 °C — самая горячая планета Солнечной системы.'],
            ['Атмосфера:', 'Очень плотная, в основном углекислый газ, облака серной кислоты.']] }
};
if (RU) {
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — Прыжки по планетам';
  const navs = document.querySelectorAll('.nav a');
  ['О проекте', 'Исследовать', 'Планеты'].forEach((t, i) => navs[i].textContent = t);
  document.querySelector('.menu').textContent = 'Меню';
  document.querySelector('.portal-heading > span').textContent = 'Далее:';
  document.querySelector('.loading').textContent = 'Выходим на орбиту…';
  document.querySelector('.cursor-label').textContent = 'Вперёд';  $('preloader').setAttribute('aria-label', 'Загрузка Марса');
}

let current = 'mars', rendered = false, busy = false;
let expansion = 0, maskScale = 0, canvasOpacity = 1, transitionActive = false, frozen = false;
let rotX = 0, rotY = 0, targetX = 0, targetY = 0, lastT = performance.now();

const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const frame = () => new Promise(r => requestAnimationFrame(r));
function animateValue(set, duration) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / duration);
      set(easeInOutCubic(p));
      p < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}
function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function render() {
  const s = states[current], L = RU ? ru[current] : s;
  exp.dataset.planet = current;
  $('planet-title').textContent = L.name.toUpperCase();
  $('next-name').textContent = L.next;
  $('next-number').textContent = s.number;
  portal.setAttribute('aria-label', RU ? `Лететь: ${L.next}` : `Travel to ${s.next}`);
  $('facts').innerHTML = L.facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  list.innerHTML = planets.map((p, i) => `<span class="planet-item${p === s.name ? ' active' : ''}">${RU ? planetsRu[i] : p}</span>`).join('');
  if (rendered) retrigger(list, 'is-switching');
  rendered = true;
  document.querySelectorAll('.background').forEach(v => v.classList.toggle('is-visible', v.id === s.background));
  if (s.image) {
    portalImage.style.display = ''; portalVideo.style.display = 'none';
  } else {
    portalImage.style.display = 'none'; portalVideo.style.display = '';
    if (portalVideo.getAttribute('src') !== s.portal) { portalVideo.src = s.portal; portalVideo.load(); }
  }
}

// --- canvases
function resizeCanvas() {
  const d = Math.min(devicePixelRatio || 1, 2);
  for (const c of frozen ? [pc] : [pc, sc]) {
    c.width = innerWidth * d; c.height = innerHeight * d;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    c.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  }
}
function drawCover(c, m) {
  const mw = m.videoWidth || m.naturalWidth || m.width, mh = m.videoHeight || m.naturalHeight || m.height;
  if (!mw || !mh) return;
  const s = Math.max(innerWidth / mw, innerHeight / mh), w = mw * s, h = mh * s;
  try { c.drawImage(m, (innerWidth - w) / 2, (innerHeight - h) / 2, w, h); } catch (e) {}
}
function drawShade(c) {
  const g = c.createLinearGradient(0, innerHeight * .52, 0, innerHeight);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.88)');
  c.fillStyle = g; c.fillRect(0, innerHeight * .52, innerWidth, innerHeight * .48);
}
function roundedRectPoints(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const arcs = [[w / 2 - r, -h / 2 + r, -Math.PI / 2, 0], [w / 2 - r, h / 2 - r, 0, Math.PI / 2],
                [-w / 2 + r, h / 2 - r, Math.PI / 2, Math.PI], [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5]];
  const pts = [];
  for (const [x, y, a0, a1] of arcs)
    for (let i = 0; i <= 10; i++) { const a = a0 + (a1 - a0) * i / 10; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); }
  return pts;
}
function project(pts, rx, ry, cx, cy) {
  const ax = rx * Math.PI / 180, ay = ry * Math.PI / 180;
  return pts.map(([x, y]) => {
    const xx = x * Math.cos(ay), yy = y * Math.cos(ax), z = x * Math.sin(ay) - y * Math.sin(ax), p = 850 / (850 + z);
    return [cx + xx * p, cy + yy * p];
  });
}

addEventListener('pointermove', e => {
  if (busy) return;
  targetY = (e.clientX / innerWidth - .5) * 37.4;
  targetX = (e.clientY / innerHeight - .5) * -33;
});
document.documentElement.addEventListener('pointerleave', () => { targetX = 0; targetY = 0; });

function draw(now) {
  const dt = Math.min(40, now - lastT); lastT = now;
  rotX += (targetX - rotX) * Math.min(1, dt * .009);
  rotY += (targetY - rotY) * Math.min(1, dt * .009);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  if (frozen) { ctx.drawImage(sc, 0, 0, innerWidth, innerHeight); drawShade(ctx); }
  const rect = portal.getBoundingClientRect(), e = expansion;
  const rcx = rect.left + rect.width / 2, rcy = rect.top + rect.height / 2;
  const cx = rcx + (innerWidth / 2 - rcx) * e, cy = rcy + (innerHeight / 2 - rcy) * e;
  const baseW = rect.width + (innerWidth - rect.width) * e, baseH = rect.height + (innerHeight - rect.height) * e;
  const scale = e ? 1 : maskScale, w = baseW * scale, h = baseH * scale;
  const r = 90 * (1 - e) * scale, rx = rotX * (1 - e), ry = rotY * (1 - e);
  if (w > 1 && h > 1) {
    const pts = project(roundedRectPoints(w, h, r), rx, ry, cx, cy);
    ctx.save();
    ctx.globalAlpha = canvasOpacity;
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#030303'; ctx.fillRect(0, 0, innerWidth, innerHeight);
    const s = states[current];
    drawCover(ctx, transitionActive ? transitionVideo : (s.image ? portalImage : portalVideo));
    if (transitionActive) drawShade(ctx);
    ctx.restore();
  }
  requestAnimationFrame(draw);
}

// --- reveal helpers
function revealMask() { retrigger(exp, 'mask-revealing'); maskScale = 0; return animateValue(v => maskScale = v, 1050); }
function revealPlanetContent() { retrigger(exp, 'content-revealing'); }
function mediaReady(m, ms = 4000) {
  return new Promise(res => {
    if (m.tagName === 'IMG' ? m.complete && m.naturalWidth : m.readyState >= 3) return res();
    const ev = m.tagName === 'IMG' ? 'load' : 'canplay';
    const done = () => { clearTimeout(t); m.removeEventListener(ev, done); m.removeEventListener('error', done); res(); };
    const t = setTimeout(done, ms);
    m.addEventListener(ev, done); m.addEventListener('error', done);
  });
}
function playPortal() {
  if (states[current].image) return;
  portalVideo.loop = true;
  portalVideo.play().catch(() => {});
}
async function startExperience() {
  const s = states[current];
  await mediaReady(s.image ? portalImage : portalVideo);
  playPortal();
  await revealMask();
  document.body.classList.add('intro-ready');
  setTimeout(revealPlanetContent, 850);
}

// --- preloader
function runPreloader() {
  const v = $('preloader-video'), val = $('preloader-value'), count = $('preloader-count'), logo = $('floating-logo');
  const ring = $('logo-ring'), C = 2 * Math.PI * 46;   // кольцо логотипа — второй счётчик загрузки
  let done = false, raf = 0;
  const tick = () => {
    if (v.duration) { const p = v.currentTime / v.duration; val.textContent = Math.round(p * 100); ring.style.strokeDashoffset = C * (1 - p); }
    raf = requestAnimationFrame(tick);
  };
  const finish = () => {
    if (done) return; done = true;
    cancelAnimationFrame(raf);
    val.textContent = '100';
    ring.style.strokeDashoffset = 0;
    count.classList.add('is-leaving');
    logo.classList.add('is-done', 'is-docked');
    $('preloader').classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(() => count.remove(), 750);
    setTimeout(() => logo.classList.add('is-settled'), 2000);
  };
  const go = () => {
    v.playbackRate = Math.max(.25, v.duration / 3);
    v.play().then(() => { raf = requestAnimationFrame(tick); }).catch(finish);
  };
  v.addEventListener('ended', finish);
  if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, { once: true });
}

// --- travel
async function travel() {
  if (busy || current === 'venus') return;
  busy = true; targetX = 0; targetY = 0;
  const next = current === 'mars' ? 'earth' : 'venus';
  try {
    transitionVideo.src = states[current].portal; transitionVideo.load();
    exp.classList.add('is-loading');
    await new Promise(res => {
      const done = () => { clearTimeout(t); transitionVideo.removeEventListener('canplaythrough', done); transitionVideo.removeEventListener('error', done); res(); };
      const t = setTimeout(done, 1600);
      transitionVideo.addEventListener('canplaythrough', done); transitionVideo.addEventListener('error', done);
    });
    exp.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
    exp.classList.add('is-transitioning');
    transitionVideo.currentTime = 0; transitionVideo.playbackRate = 1.3;
    canvasOpacity = 1; transitionActive = true;
    await transitionVideo.play();
    await animateValue(v => expansion = v, 1100);
    if (!transitionVideo.ended) await new Promise(res => transitionVideo.addEventListener('ended', res, { once: true }));
    // последний кадр перехода держим фоном
    const d = Math.min(devicePixelRatio || 1, 2);
    sc.width = innerWidth * d; sc.height = innerHeight * d; sctx.setTransform(d, 0, 0, d, 0, 0);
    sctx.clearRect(0, 0, innerWidth, innerHeight); drawCover(sctx, transitionVideo);
    frozen = true;
    current = next;
    exp.classList.add('is-committing');
    render();
    await frame(); await frame();
    transitionActive = false; expansion = 0; maskScale = 0; canvasOpacity = 1;
    exp.classList.remove('is-transitioning', 'is-committing');
    playPortal();
    const maskReveal = revealMask();
    setTimeout(revealPlanetContent, 100);
    await maskReveal;
    setTimeout(() => { transitionVideo.removeAttribute('src'); transitionVideo.load(); busy = false; }, 450);
  } catch (err) {
    transitionActive = false; expansion = 0; maskScale = 1; canvasOpacity = 1;
    exp.classList.remove('is-loading', 'is-transitioning', 'is-committing');
    busy = false;
  }
}
portal.addEventListener('click', travel);

// --- cursor
const cursor = document.querySelector('.custom-cursor');
let px = innerWidth / 2, py = innerHeight / 2, ox = px, oy = py;
addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; cursor.classList.add('is-visible'); });
document.addEventListener('mouseleave', () => cursor.classList.remove('is-visible'));
portal.addEventListener('pointerenter', () => cursor.classList.add('is-enter'));
portal.addEventListener('pointerleave', () => cursor.classList.remove('is-enter'));
function cursorLoop() {
  ox += (px - ox) * .2; oy += (py - oy) * .2;
  cursor.style.transform = `translate3d(${ox}px,${oy}px,0)`;
  requestAnimationFrame(cursorLoop);
}

// --- boot
Promise.race([document.fonts.load('600 23px Unbounded'), new Promise(r => setTimeout(r, 1500))])
  .finally(() => $('floating-logo').classList.add('font-ok'));
document.querySelectorAll('.background').forEach(v => { v.pause(); v.currentTime = 0; });
resizeCanvas();
addEventListener('resize', resizeCanvas);
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
runPreloader();
})();
</script>
</body>
</html>
