const EASE = [0.25, 0.46, 0.45, 0.94];

function FadeUp({ children, className = '', delay = 0, duration = 0.6, y = 24 }) {
  return (
    <motion.div
      className={className}
      initial={{ opacity: 0, y }}
      animate={{ opacity: 1, y: 0 }}
      transition={{ duration, delay, ease: EASE }}
    >
      {children}
    </motion.div>
  );
}

function TypingEffect({ text, className = '', charDelay = 0.045 }) {
  const words = text.split(' ');
  let globalIndex = 0;
  return (
    <span className={className}>
      {words.map((word, wi) => (
        <span key={wi} className="inline-block">
          {word.split('').map((ch, ci) => {
            const i = globalIndex++;
            return (
              <motion.span
                key={ci}
                className="inline-block"
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                transition={{ duration: 0.15, delay: i * charDelay }}
              >
                {ch}
              </motion.span>
            );
          })}
          {wi < words.length - 1 ? ' ' : ''}
        </span>
      ))}
    </span>
  );
}
