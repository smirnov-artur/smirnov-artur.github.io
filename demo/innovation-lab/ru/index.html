<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Создаём будущее</title>
    <meta name="description" content="Иммерсивный первый экран g.a.d. для технологической студии: зацикленное видео-сновидение, восьмиугольные стеклянные кнопки и волновое появление каждого элемента.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; margin: 0; }
        .btn-cut { clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0% calc(100% - 12px), 0% 12px); }
        .btn-cut-border { position: relative; background: #fff; clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0% calc(100% - 12px), 0% 12px); }
        .btn-cut-border::before { content: ''; position: absolute; inset: 1px; background: #000; z-index: 0; clip-path: polygon(11px 0%, calc(100% - 11px) 0%, 100% 11px, 100% calc(100% - 11px), calc(100% - 11px) 100%, 11px 100%, 0% calc(100% - 11px), 0% 11px); }
        .btn-cut-border > * { position: relative; z-index: 1; }
        .btn-cut-sm { clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0% calc(100% - 8px), 0% 8px); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .anim-stagger { opacity: 0; animation: fadeUp .8s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-fade { opacity: 0; animation: fadeIn 1s cubic-bezier(.16,1,.3,1) forwards; }
        .gad-mark{display:inline-block;overflow:visible}.gad-mark .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-mark .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const GadMark = ({ className = '' }) => (
            <svg className={"gad-mark " + className} viewBox="293 1 58 58" role="img" aria-label="g.a.d.">
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="white" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
                <circle className="orb" cx="322" cy="8" r="5" fill="white" />
            </svg>
        );
        const ArrowRight = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
        );
        const XIcon = () => (<svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.2h3.7l-8 9.2L24 22.8h-7.4l-5.8-7.6-6.6 7.6H.5l8.6-9.9L0 1.2h7.6l5.3 7 6-7Zm-1.3 19.4h2L6.5 3.3h-2.1L17.6 20.6Z"/></svg>
        );
        const LinkedInIcon = () => (<svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 20.4h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.3V9h3.5v1.6h.1c.5-.9 1.7-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.1ZM5.3 7.4A2.1 2.1 0 1 1 5.3 3.2a2.1 2.1 0 0 1 0 4.2ZM7.1 20.4H3.5V9h3.6v11.4Z"/></svg>
        );
        const FacebookIcon = () => (<svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.2-1.5 1.6-1.5h1.6V3.7C15.9 3.6 14.9 3.5 13.8 3.5c-2.3 0-3.9 1.4-3.9 4v2.4H7.2V13h2.7v8h3.6Z"/></svg>
        );

        const App = () => (
            <div className="h-screen w-full bg-black p-3 md:p-4 font-inter">
                <div className="w-full h-full rounded-2xl flex flex-col overflow-hidden relative bg-black">
                    <video className="absolute inset-0 w-full h-full object-cover anim-fade" style={{ animationDelay: '0.2s' }} autoPlay loop muted playsInline
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260717_120352_eb988725-1351-43b3-8095-16e4a1005e3d.mp4" />

                    <nav className="relative z-10 flex items-center justify-between px-6 md:px-10 pt-6 md:pt-8">
                        <div className="anim-stagger flex flex-col items-start" style={{ animationDelay: '0.1s' }}>
                            <GadMark className="w-14 h-14 md:w-16 md:h-16" />
                            <span className="text-white text-[10px] md:text-xs tracking-[0.4em] mt-1 font-light">G . A . D .</span>
                        </div>
                        <div className="anim-stagger flex items-center gap-3" style={{ animationDelay: '0.2s' }}>
                            <button id="nav-neural" className="hidden md:block px-5 py-2.5 text-white text-sm hover:bg-white/10 btn-cut-border"><span>Нейросинергия</span></button>
                            <button id="nav-cyber" className="hidden md:block px-5 py-2.5 bg-white text-black text-sm hover:bg-white/90 btn-cut">Киберсинтез</button>
                        </div>
                    </nav>

                    <div className="relative z-10 flex-1 flex flex-col justify-between px-6 md:px-10 pb-8 md:pb-10">
                        <div className="flex-1 flex items-center relative">
                            <div className="anim-stagger hidden lg:flex flex-col gap-6 absolute left-0" style={{ top: '18%', animationDelay: '0.4s' }}>
                                <p className="text-white/80 text-base leading-relaxed max-w-[220px]" style={{ textWrap: 'balance' }}>Отправляйтесь с нами навстречу горизонту</p>
                                <div className="flex flex-col gap-2 mt-4">
                                    <div className="flex items-center gap-1">
                                        <span className="w-4 h-4 rounded-full border border-white/40" />
                                        <span className="w-4 h-4 rounded-full border border-white/40" />
                                    </div>
                                    <div className="flex items-center gap-2 mt-2">
                                        <span className="text-white/70 text-xs">Постоянное погружение</span>
                                        <span className="text-white/50 text-xs">01</span>
                                    </div>
                                </div>
                            </div>
                            <div className="anim-stagger w-full text-center" style={{ animationDelay: '0.5s' }}>
                                <h1 className="text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-normal leading-[1.1] tracking-[-0.04em]" style={{ textShadow: '0 2px 12px rgba(0,0,0,0.25)' }}>
                                    <span className="block">Куём будущее</span><span className="block">Виртуальный горизонт</span><span className="block">g.a.d.</span>
                                </h1>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center mt-8">
                            <div className="anim-stagger flex items-center justify-center md:justify-end" style={{ animationDelay: '0.7s' }}>
                                <p className="text-white text-sm leading-relaxed max-w-[260px] text-center md:text-left md:ml-auto">Мы выходим за рамки привычного, меняя цифровое пространство технологиями нового уровня.</p>
                            </div>
                            <div className="anim-stagger flex flex-col items-center gap-8 md:gap-24" style={{ animationDelay: '0.85s' }}>
                                <span className="text-white text-2xl md:text-3xl font-medium">Сетевая динамика</span>
                                <button id="discover-now" className="w-full max-w-[280px] py-3.5 bg-white flex items-center justify-center gap-2 text-black hover:bg-white/90 transition-colors group btn-cut">
                                    <span className="text-sm font-medium">Узнать больше</span>
                                    <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                                </button>
                            </div>
                            <div className="anim-stagger flex items-center justify-center md:justify-end gap-3" style={{ animationDelay: '1s' }}>
                                <button id="social-x" className="w-10 h-10 bg-white flex items-center justify-center text-black hover:bg-white/90 transition-colors btn-cut-sm"><XIcon /></button>
                                <button id="social-in" className="w-10 h-10 bg-white flex items-center justify-center text-black hover:bg-white/90 transition-colors btn-cut-sm"><LinkedInIcon /></button>
                                <button id="social-fb" className="w-10 h-10 bg-white flex items-center justify-center text-black hover:bg-white/90 transition-colors btn-cut-sm"><FacebookIcon /></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
