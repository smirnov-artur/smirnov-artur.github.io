<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>g.a.d. — Coffee Rewards Profile</title>
<meta name="description" content="A dark, glassmorphic iOS-style loyalty profile inside a phone mockup: a looping video hero fades into a scrollable stack of stat cards and a favorite-drink card, all glass buttons and staggered entrance animations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #180a06;
  --card: rgba(255, 255, 255, 0.06);
  --text: #ede4d8;
  --muted: rgba(235, 220, 205, 0.55);
  --radius-card: 24px;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  background: #070402;
  background-image:
    radial-gradient(ellipse 65% 55% at 15% 52%, rgba(168, 78, 10, 0.22), transparent),
    radial-gradient(ellipse 52% 48% at 83% 26%, rgba(122, 52, 8, 0.17), transparent),
    radial-gradient(ellipse 44% 52% at 56% 92%, rgba(98, 36, 5, 0.14), transparent),
    radial-gradient(ellipse 30% 30% at 72% 75%, rgba(60, 20, 5, 0.10), transparent);
  font-family: 'Inter', -apple-system, 'SF Pro Display', Inter, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  overflow-x: hidden;
}

.phone {
  width: 390px;
  height: 844px;
  zoom: 0.78;
  background: #000;
  border-radius: 44px;
  overflow: hidden;
  box-shadow: 0 40px 90px rgba(0,0,0,.65), 0 12px 32px rgba(0,0,0,.45);
  position: relative;
}
.screen {
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }

/* ---- glass buttons ---- */
.glass {
  border: none;
  background: rgba(255,255,255,0.03);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.18), inset 1px 0 0 rgba(255,255,255,.06), inset -1px 0 0 rgba(255,255,255,.06);
  backdrop-filter: blur(2px) saturate(1.3);
  -webkit-backdrop-filter: blur(2px) saturate(1.3);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .15s ease;
}
.glass:active { transform: scale(0.94); }
.glass.circle { width: 58px; height: 44px; border-radius: 22px; }
.glass.pill { height: 54px; border-radius: 27px; gap: 8px; }

/* ---- hero ---- */
.hero { position: relative; width: 100%; height: 430px; overflow: hidden; }
.hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 52%, var(--bg) 100%); }
.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}
/* g.a.d. in the app bar, centred between the round buttons (no transform: the buttons' dropIn owns transforms) */
.app-logo { position: absolute; inset: 0; margin: auto; width: fit-content; height: fit-content; color: #fff; font-size: 22px; line-height: 1; }
.hero-topbar { position: absolute; top: 18px; left: 18px; right: 18px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }

/* ---- identity ---- */
.identity { position: relative; z-index: 2; margin-top: -112px; text-align: center; padding: 0 16px; }
.identity h1 { font-size: 28px; font-weight: 500; }
.identity .subtitle { margin-top: 4px; font-size: 15px; color: var(--muted); }
.laurel { position: absolute; top: 14px; width: auto; height: 73px; opacity: 0.6; }
.laurel-left { right: calc(50% + 66px); }
.laurel-right { left: calc(50% + 66px); transform: scaleX(-1); }

/* ---- achievements ---- */
.achievements { position: relative; z-index: 2; margin: 30px auto 0; width: 225px; font-size: 18px; font-weight: 500; }

/* ---- stats grid ---- */
.stats { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 26px 16px 0; }
.stat-card { background: var(--card); border-radius: var(--radius-card); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; }
.stat-card img { width: 84px; height: 84px; object-fit: contain; }
.stat-card .num { font-size: 25px; font-weight: 500; }
.stat-card .label { font-size: 13px; color: rgba(236, 220, 205, 0.68); text-align: center; }

/* ---- favorite card ---- */
.favorite-card { position: relative; z-index: 2; margin: 12px 16px 0; background: var(--card); border-radius: var(--radius-card); height: 110px; display: flex; align-items: center; gap: 16px; padding: 0 16px; }
.favorite-card img { width: 108px; height: 108px; object-fit: contain; flex-shrink: 0; }
.fav-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.fav-text .fav-label { font-size: 13px; font-weight: 500; }
.fav-text .fav-name { font-size: 19px; font-weight: 500; }
.fav-text .fav-sub { font-size: 13px; color: #BAAA9A8C; }

/* ---- teaser ---- */
.next-card { position: relative; z-index: 2; margin: 12px 16px 40px; height: 34px; background: var(--card); border-radius: var(--radius-card) var(--radius-card) 0 0; }

/* ---- entry animations ---- */
@keyframes heroReveal { from { opacity: 0; transform: scale(1.01); } to { opacity: 1; transform: scale(1); } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

.hero { animation: heroReveal 1.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
.hero-topbar .glass:nth-child(1) { animation: dropIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .35s; }
.hero-topbar .glass:nth-child(2) { animation: dropIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .42s; }
.laurel { animation: fadeIn 0.8s ease-out both; animation-delay: .5s; }
.identity h1 { animation: fadeRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .5s; }
.identity .subtitle { animation: fadeRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .58s; }
.achievements { animation: fadeRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .66s; }
.stat-card:nth-child(1) { animation: fadeRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .74s; }
.stat-card:nth-child(2) { animation: fadeRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .80s; }
.stat-card:nth-child(3) { animation: fadeRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .86s; }
.favorite-card { animation: fadeRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: .94s; }
.next-card { animation: fadeIn 0.7s ease-out both; animation-delay: 1.02s; }

@media (prefers-reduced-motion: reduce) {
  .hero, .hero-topbar .glass, .laurel, .identity h1, .identity .subtitle, .achievements, .stat-card, .favorite-card, .next-card {
    animation: none !important; opacity: 1 !important; transform: none !important;
  }
}

/* ---- responsive ---- */
/* on a real phone the app is the screen itself, not a shrunken mockup */
@media (max-width: 440px) {
  body { display: block; }
  .phone { zoom: 1; width: 100%; height: 100svh; border-radius: 0; box-shadow: none; }
}
</style>
</head>
