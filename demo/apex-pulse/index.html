<html lang="en">

<title>g.a.d. — Where Sky Meets Machine Logic</title>
<meta name="description" content="A CloudFront video is pre-extracted into frames and scrubbed on a canvas by scroll position, while two stat-dense sections reveal their headlines and numbers as they enter view.">

  } } } };

<style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0a0a0a; color: #fff; overflow-x: hidden; }
::selection { background: rgba(255,255,255,.2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Mark({ size = 32, color = '#fff' }) {
  return (
    <svg className="gad-logo" viewBox="293 1 58 58" role="img" aria-label="g.a.d." style={{ width: size, height: size, color }}>
      <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
      <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
    </svg>
  );
}

function Reveal({ children, delay = 0, className = '', as = 'div' }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} className={`transition-all duration-700 ease-out will-change-transform ${shown ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </Tag>
  );
}

const VIDEO_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_230900_ef8565a6-16eb-4fe9-98e4-4b972d3f436d.mp4';

// ScrollVideo: extracts up to 120 frames from the video (fetched as a blob so canvas reads never taint on
// a cross-origin CDN), then scrubs them on a canvas by scroll position. The plain <video> stays visible
// and is itself scroll-seeked from the very first frame, so extraction can finish in the background with
// zero blank frames -- canvas just takes over once frames are ready.
function ScrollVideo() {
  const [framesReady, setFramesReady] = useState(false);
  const framesRef = useRef([]);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    let objectUrl;
    (async () => {
      try {
        const res = await fetch(VIDEO_URL);
        const blob = await res.blob();
        if (cancelled) return;
        objectUrl = URL.createObjectURL(blob);
        const v = document.createElement('video');
        v.muted = true; v.playsInline = true; v.src = objectUrl;
        await new Promise((resolve, reject) => { v.onloadedmetadata = resolve; v.onerror = reject; });
        if (cancelled) return;
        const dur = v.duration;
        const count = Math.min(120, Math.max(30, Math.round(dur * 24)));
        const maxW = 1280;
        const scale = Math.min(1, maxW / v.videoWidth);
        const cw = Math.max(1, Math.round(v.videoWidth * scale)), ch = Math.max(1, Math.round(v.videoHeight * scale));
        const bitmaps = [];
        for (let i = 0; i < count; i++) {
          if (cancelled) break;
          const t = count > 1 ? (i / (count - 1)) * dur : 0;
          await new Promise(resolve => { v.onseeked = resolve; v.currentTime = t; });
          if (cancelled) break;
          bitmaps.push(await createImageBitmap(v, { resizeWidth: cw, resizeHeight: ch }));
        }
        if (!cancelled) { framesRef.current = bitmaps; setFramesReady(true); }
        else bitmaps.forEach(b => b.close());
      } catch {
        // extraction failed -- the <video> fallback keeps playing via scroll-seek forever
      }
    })();
    return () => {
      cancelled = true;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      framesRef.current.forEach(b => b.close());
    };
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, video = videoRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf, smoothed = 0, seeking = false;
    const resize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(canvas.clientWidth * dpr);
      canvas.height = Math.round(canvas.clientHeight * dpr);
    };
    resize();
    window.addEventListener('resize', resize);
    if (video) video.onseeked = () => { seeking = false; };
    const tick = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const target = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      smoothed += (target - smoothed) * 0.1;
      const frames = framesRef.current;
      if (frames.length > 1) {
        const idx = Math.min(frames.length - 1, Math.round(smoothed * (frames.length - 1)));
        const bmp = frames[idx];
        const cw = canvas.width, ch = canvas.height, s = Math.max(cw / bmp.width, ch / bmp.height);
        const dw = bmp.width * s, dh = bmp.height * s;
        ctx.drawImage(bmp, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      } else if (video && video.duration && !seeking) {
        const t = smoothed * video.duration;
        if (Math.abs(video.currentTime - t) > 0.02) { seeking = true; video.currentTime = t; }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [framesReady]);

  return (
    <div className="fixed inset-0 -z-10 bg-[#0a0a0a]">
      {!framesReady && <video ref={videoRef} src={VIDEO_URL} muted playsInline preload="auto" className="absolute inset-0 w-full h-full object-cover" />}
      <canvas ref={canvasRef} className={`absolute inset-0 w-full h-full ${!framesReady ? 'invisible' : ''}`} />
      <div className="absolute inset-0 bg-black/20" />
    </div>
  );
}

function Navbar() {
  return (
    <nav className="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-5 py-4 sm:px-8 sm:py-5 md:px-12">
      <Reveal delay={0}><Mark /></Reveal>
      <Reveal delay={150}>
        <button type="button" className="rounded-full bg-white text-black uppercase tracking-wider text-xs sm:text-sm px-5 py-2.5 hover:bg-white/90 hover:scale-105 transition-all duration-200">Join The Fleet</button>
      </Reveal>
    </nav>
  );
}

function Stat({ value, label, border = false }) {
  return (
    <div className={border ? 'border border-white/30 rounded-lg px-3 py-2' : ''}>
      <div className="text-2xl sm:text-3xl md:text-4xl font-bold tabular-nums">{value}</div>
      <div className="text-[10px] sm:text-xs uppercase tracking-wider text-white/50 mt-1">{label}</div>
    </div>
  );
}

function SectionOne() {
  return (
    <section className="relative h-screen flex flex-col justify-end px-5 pb-10 sm:px-8 sm:pb-14 md:px-12 md:pb-16">
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 items-end">
        <h1 className="font-medium leading-[1.05] tracking-tight drop-shadow-lg" style={{ fontSize: 'clamp(2.5rem, 8vw, 6rem)' }}>
          <Reveal as="span" delay={100} className="block">Relentless.</Reveal>
          <Reveal as="span" delay={250} className="block">Sovereign.</Reveal>
          <Reveal as="span" delay={400} className="block">Unyielding.</Reveal>
        </h1>
        <Reveal delay={550} className="flex flex-wrap gap-6 sm:justify-end">
          <Stat value="360°" label="Sensor Array" />
          <Stat value="12°" label="Thermal Scan" />
          <Stat value="98%" label="Precision" />
        </Reveal>
      </div>
    </section>
  );
}

function SectionTwo() {
  return (
    <section className="relative min-h-screen flex flex-col justify-between px-5 pt-24 pb-10 sm:px-8 sm:pt-28 sm:pb-14 md:px-12 md:pt-32 md:pb-16">
      <div className="self-end max-w-sm text-right">
        <Reveal delay={100}>
          <h2 className="text-3xl sm:text-4xl md:text-5xl font-semibold leading-[1.1]" style={{ textWrap: 'balance' }}>Precision built into every line.</h2>
        </Reveal>
        <Reveal delay={250} className="grid grid-cols-[auto_1fr] gap-4 mt-8 text-left">
          <div>
            <div className="text-2xl sm:text-3xl font-bold tabular-nums">99.7%</div>
            <div className="text-[10px] sm:text-xs uppercase tracking-wider text-white/50 mt-1">Fleet Ready</div>
          </div>
          <p className="text-xs sm:text-sm text-white/70 self-center">Proven in 14,000+ sorties with unmatched operational readiness and zero downtime.</p>
        </Reveal>
      </div>

      <div className="mt-auto pt-16 sm:pt-20 grid grid-cols-1 sm:grid-cols-2 gap-8">
        <Reveal delay={400} className="flex gap-8">
          <Stat value="240 km" label="Reach" />
          <Stat value="85 kg" label="Capacity" />
          <Stat value="42 km/h" label="Glide Speed" />
        </Reveal>
        <Reveal delay={550} className="sm:ml-auto">
          <div className="grid grid-cols-2 sm:flex gap-4 sm:gap-6">
            <Stat value="160 km" label="Reach" border />
            <Stat value="5.8 hrs" label="Endurance" />
            <Stat value="52 km/h" label="Max Pace" />
            <Stat value="18 kg" label="Carry" />
          </div>
          <div className="flex gap-3 mt-6">
            <button type="button" className="rounded-full border border-white/60 px-5 py-2.5 text-xs sm:text-sm uppercase tracking-wider hover:border-white hover:bg-white/10 transition-colors duration-200">Schedule a Call</button>
            <button type="button" className="rounded-full bg-white text-black px-5 py-2.5 text-xs sm:text-sm uppercase tracking-wider hover:bg-white/90 hover:scale-105 transition-all duration-200">Full Details</button>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

function App() {
  return (
    <React.Fragment>
      <ScrollVideo />
      <Navbar />
      <main>
        <SectionOne />
        <div className="h-[80vh]" aria-hidden="true" />
        <SectionTwo />
      </main>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
