<body>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const PORTAL_BG = 'https://upload.wikimedia.org/wikipedia/commons/3/34/Airplane_window_capture.jpg';
const WORLD_BG = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_231253_53c0854c-d13c-42c1-9fc0-17e87cd34091.png&w=1280&q=85';

const QUOTES = [
  "It is amazing to see and feel the worlds I am stepping into each day.",
  "I have been feeling much more alive inside these living worlds, even on the long days.",
  "My wonder has been growing so fast that it is hard to believe the difference. g.a.d. gave me exactly the vision I needed.",
  "The first two scenes felt alive. I tried everything we dreamed up and it worked.",
  "The wonder of it all really moved me, it even brought a tear to my eyes every time.",
  "I finally feel immersed, like the worlds were built just for me.",
  "Stepping into it was effortless and the worlds have been unlike anything I dreamt.",
];

function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

function useIsMobile() {
  const [m, setM] = useState(() => window.innerWidth < 768);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 767px)');
    const on = () => setM(mq.matches);
    on();
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, []);
  return m;
}

      <path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z" />
      <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
      <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
    </svg>
  );
}

function Nav({ isMobile }) {
  return (
    <nav style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: isMobile ? '18px 20px' : '26px 40px' }}>
      <span style={{ display: 'inline-flex', alignItems: 'center', color: '#fff', height: isMobile ? 28 : 34 }}>
        <GadLogo style={{ height: '100%' }} />
      </span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="pill-btn" style={{ background: '#fff', color: '#161616', fontWeight: 600, fontSize: 14, borderRadius: 999, padding: isMobile ? '9px 16px' : '11px 22px', transition: 'background 0.25s' }}>
          Watch Demo
        </button>
        <button className="pill-btn" aria-label="Menu" style={{ width: isMobile ? 38 : 42, height: isMobile ? 38 : 42, borderRadius: '50%', background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.25s' }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M2 6H16" stroke="#161616" strokeWidth="1.6" strokeLinecap="round" />
            <path d="M2 12H16" stroke="#161616" strokeWidth="1.6" strokeLinecap="round" />
          </svg>
        </button>
      </div>
    </nav>
  );
}

function Hero({ isMobile, opacity, uiVisible }) {
  return (
    <div style={{ position: 'absolute', inset: 0, opacity, pointerEvents: opacity < 0.05 ? 'none' : 'auto' }}>
      <div
        className="absolute inset-x-0 bottom-0 flex flex-col md:flex-row md:items-end md:justify-between gap-12 md:gap-20"
        style={{
          padding: isMobile ? '0 22px 40px' : '0 44px 52px',
          opacity: uiVisible ? 1 : 0,
          transform: uiVisible ? 'translateY(0)' : 'translateY(24px)',
          transition: 'opacity 1s ease, transform 1s ease',
          transitionDelay: '0.3s',
        }}
      >
        <div style={{ maxWidth: 560 }}>
          <h1 style={{ margin: 0, fontWeight: 500, color: '#fff', lineHeight: 1.04, letterSpacing: '-0.02em', fontSize: isMobile ? 'clamp(30px,9vw,44px)' : 'clamp(40px,4vw,58px)' }}>
            <span style={{ fontFamily: "'Mr Dafoe Regular', cursive", color: '#9a9a9a', fontSize: '1.15em', marginRight: '0.12em' }}>Discover</span>
            Living<br />Digital Worlds<br />Vivid, Alive, Endless
          </h1>
          <p style={{ marginTop: 18, maxWidth: 340, fontWeight: 400, fontSize: isMobile ? 13 : 14, lineHeight: 1.6, color: 'rgba(255,255,255,0.5)' }}>
            Experience immersive worlds with stories that blur the line between imagination, AI and living reality made for you.
          </p>
        </div>
        {!isMobile && (
          <div style={{ display: 'flex', gap: 14 }}>
            <span style={{ fontFamily: "'Mr Dafoe Regular', cursive", color: '#fff', fontSize: 64, lineHeight: 0.8 }}>g.</span>
            <p style={{ margin: 0, fontWeight: 400, fontSize: 11, color: 'rgba(255,255,255,0.5)', maxWidth: 150 }}>
              A studio is a trusted partner in your journey through wonderland.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

function ArcCardCarousel({ isMobile, active, setActive }) {
  const total = QUOTES.length;
  const half = Math.floor(total / 2);
  const cardW = isMobile ? 230 : 300, cardH = isMobile ? 320 : 420;
  const stepX = isMobile ? 170 : 295, dropY = isMobile ? 34 : 52, tilt = isMobile ? 7 : 8;
  const containerH = isMobile ? 460 : 560, centerBump = isMobile ? 22 : 30;

  function wrap(pos) {
    while (pos > half) pos -= total;
    while (pos < -half) pos += total;
    return pos;
  }
  const advance = (dir) => setActive((a) => (a + dir + total) % total);

  return (
    <div style={{ position: 'relative', width: '100%', height: containerH, marginTop: isMobile ? 32 : 48 }}>
      {QUOTES.map((q, i) => {
        const pos = wrap(i - active);
        const abs = Math.abs(pos);
        const isCenter = pos === 0;
        const opacity = isCenter ? 1 : Math.max(0, 0.6 - (abs - 1) * 0.2);
        const translateY = abs * dropY + (isCenter ? centerBump : 0);
        return (
          <div
            key={i}
            style={{
              position: 'absolute', left: '50%', top: '50%', width: cardW, height: cardH,
              transform: `translate(-50%,-50%) translateX(${pos * stepX}px) translateY(${translateY}px) rotate(${pos * tilt}deg)`,
              opacity, zIndex: 100 - abs, pointerEvents: isCenter ? 'auto' : 'none',
              transition: 'transform 0.55s cubic-bezier(0.22,1,0.36,1), opacity 0.55s ease',
              borderRadius: isMobile ? 22 : 28,
              display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 28px', textAlign: 'center',
              ...(isCenter
                ? { background: 'rgb(247,251,255)', border: '1px solid rgba(255,255,255,0.6)', boxShadow: '0 8px 24px rgba(0,0,0,0.08), 0 0 50px rgba(255,255,255,0.55), 0 0 90px rgba(255,255,255,0.35)' }
                : { background: 'linear-gradient(135deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.24) 100%)', WebkitBackdropFilter: 'blur(18px) saturate(140%)', backdropFilter: 'blur(18px) saturate(140%)', border: '1px solid rgba(255,255,255,0.28)', boxShadow: 'inset 0 1px 1px rgba(255,255,255,0.45)' }),
            }}
          >
            <p style={{ margin: 0, fontWeight: 500, fontSize: isMobile ? 15 : 17, lineHeight: 1.5, letterSpacing: '-0.01em', color: isCenter ? '#2c2420' : 'rgba(255,255,255,0.85)' }}>
              &ldquo;{q}&rdquo;
            </p>
          </div>
        );
      })}
      <div style={{ position: 'absolute', left: '50%', bottom: -40, transform: 'translateX(-50%)', display: 'flex', gap: 10 }}>
        <button aria-label="Previous" onClick={() => advance(-1)} style={{ width: isMobile ? 42 : 46, height: isMobile ? 42 : 46, borderRadius: '50%', background: 'rgba(255,255,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style={{ filter: 'drop-shadow(rgba(255,255,255,0.7) 0px 0px 6px) drop-shadow(rgba(255,255,255,0.4) 0px 0px 14px)' }}>
            <polyline points="15 18 9 12 15 6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
          </svg>
        </button>
        <button aria-label="Next" onClick={() => advance(1)} style={{ width: isMobile ? 42 : 46, height: isMobile ? 42 : 46, borderRadius: '50%', background: 'rgba(255,255,255,0.9)', boxShadow: '0 6px 18px rgba(0,0,0,0.18)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <polyline points="9 18 15 12 9 6" stroke="#2c2420" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
          </svg>
        </button>
      </div>
    </div>
  );
}

function FooterCol({ title, links }) {
  return (
    <div>
      <p style={{ margin: '0 0 18px', fontWeight: 500, fontSize: 13, color: 'rgba(255,255,255,0.55)' }}>{title}</p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {links.map((l, i) => (
          <a key={i} className="foot-link" href="#" onClick={(e) => e.preventDefault()} style={{ color: '#fff', fontWeight: 500, fontSize: 14, textDecoration: 'none', transition: 'opacity 0.2s' }}>
            {l}
          </a>
        ))}
      </div>
    </div>
  );
}

function Footer({ isMobile }) {
  return (
    <footer style={{ position: 'relative', width: '100%', maxWidth: 1280, margin: '0 auto', padding: isMobile ? '120px 22px 40px' : '160px 44px 52px', display: 'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : '1.4fr 1fr 1fr 1fr', gap: isMobile ? '32px 20px' : 40, textAlign: 'left' }}>
      <div style={{ gridColumn: isMobile ? '1 / -1' : 'auto' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', color: '#fff', height: 26, marginBottom: 12 }}>
          <GadLogo style={{ height: '100%' }} />
        </span>
        <p style={{ margin: 0, fontSize: 12, color: 'rgba(255,255,255,0.55)' }}>© 2026 g.a.d.</p>
      </div>
      <FooterCol title="Explore" links={['How it works', 'Features']} />
      <FooterCol title="Contact" links={['X (Twitter)', 'hello@gad.studio']} />
      <FooterCol title="Legal" links={['Privacy Policy', 'Terms of Service']} />
    </footer>
  );
}

function App() {
  const isMobile = useIsMobile();
  const introRef = useRef(null);
  const worldRef = useRef(null);
  const portalRef = useRef(null);
  const progressRef = useRef(0);
  const rawMouse = useRef({ x: 0, y: 0 });
  const smoothMouse = useRef({ x: 0, y: 0 });
  const [progress, setProgress] = useState(0);
  const [uiVisible, setUiVisible] = useState(false);
  const [active, setActive] = useState(() => Math.floor(QUOTES.length / 2));

  useEffect(() => {
    const t = setTimeout(() => setUiVisible(true), 600);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    function calc() {
      const introH = introRef.current ? introRef.current.offsetHeight : 0;
      const range = introH - window.innerHeight;
      const p = range > 0 ? clamp(window.scrollY / range, 0, 1) : 0;
      progressRef.current = p;
      setProgress(p);
    }
    calc();
    window.addEventListener('scroll', calc, { passive: true });
    window.addEventListener('resize', calc);
    return () => { window.removeEventListener('scroll', calc); window.removeEventListener('resize', calc); };
  }, []);

  useEffect(() => {
    function onMove(e) {
      rawMouse.current = { x: (e.clientX / window.innerWidth - 0.5) * 2, y: (e.clientY / window.innerHeight - 0.5) * 2 };
    }
    window.addEventListener('mousemove', onMove);
    let raf;
    function tick() {
      const m = smoothMouse.current, r = rawMouse.current;
      m.x = lerp(m.x, r.x, 0.07);
      m.y = lerp(m.y, r.y, 0.07);
      const rx = -m.x, ry = -m.y;
      const ep = easeInOut(progressRef.current);
      if (worldRef.current) {
        const s = lerp(1, 1.18, ep);
        worldRef.current.style.transform = `scale(${s}) translate(${rx * 6}px, ${ry * 6}px)`;
      }
      if (portalRef.current) {
        const s = lerp(1, 7.5, ep);
        portalRef.current.style.transform = `scale(${s}) translate(${rx * 7}px, ${ry * 7}px)`;
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => { window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
  }, []);

  const portalOpacity = progress < 0.66 ? 1 : clamp(1 - (progress - 0.66) / 0.22, 0, 1);
  const scene1Opacity = clamp(1 - progress / 0.22, 0, 1);

  return (
    <>
      <div style={{ position: 'fixed', inset: 0, overflow: 'hidden', zIndex: 0 }}>
        <div ref={worldRef} style={{ width: '100%', height: '100%', transformOrigin: '50% 50%', willChange: 'transform' }}>
          <img src={WORLD_BG} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
        </div>
      </div>

      <Nav isMobile={isMobile} />

      <div ref={introRef} style={{ position: 'relative', zIndex: 5, height: '160vh' }}>
        <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden' }}>
          <div ref={portalRef} style={{ position: 'absolute', inset: 0, transformOrigin: '52% 38%', willChange: 'transform', opacity: portalOpacity }}>
            <img src={PORTAL_BG} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          </div>
          <Hero isMobile={isMobile} opacity={scene1Opacity} uiVisible={uiVisible} />
        </div>
      </div>

      <div style={{ position: 'relative', zIndex: 10, overflow: 'hidden' }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center', padding: isMobile ? '12vh 20px 60px' : '14vh 20px 60px' }}>
          <h2 style={{ margin: 0, fontWeight: 500, fontSize: 'clamp(34px,4vw,52px)', color: '#fff', letterSpacing: '-0.02em', lineHeight: 1.1, textShadow: '0 2px 20px rgba(0,0,0,0.35)' }}>
            Real wonders.<br />Real worlds.
          </h2>
          <p style={{ marginTop: 16, fontWeight: 500, fontSize: 17, maxWidth: 420, color: '#fff', textShadow: '0 2px 16px rgba(0,0,0,0.3)' }}>
            See how g.a.d. helps others, and find out what it can do for you.
          </p>
          <ArcCardCarousel isMobile={isMobile} active={active} setActive={setActive} />
        </div>
        <Footer isMobile={isMobile} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
