<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubX | Закрытый клуб техинвесторов</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Instrument Serif', 'serif'],
                    },
                    colors: {
                        background: 'hsl(201 100% 13%)',
                    },
                    keyframes: {
                        'fade-rise': {
                            'from': { opacity: '0', transform: 'translateY(24px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        'fade-rise': 'fade-rise 0.8s ease-out both',
                        'fade-rise-delay': 'fade-rise 0.8s ease-out 0.2s both',
                        'fade-rise-delay-2': 'fade-rise 0.8s ease-out 0.4s both',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-pill {
                @apply bg-white/20 backdrop-blur-sm border border-gray-900/10 rounded-full;
            }
            .glass-card {
                @apply bg-white/10 backdrop-blur-sm border border-gray-900/10 rounded-3xl;
            }
        }
    </style>
