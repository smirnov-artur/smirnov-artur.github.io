 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/><circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>';

const GadLogo = ({ height, color }) => (
  <span style={{ display: 'inline-block', color, fontSize: height, lineHeight: 0 }}
        dangerouslySetInnerHTML={{ __html: GAD_LOGO_SVG }} />
);

const MenuIcon = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></svg>
);
const XIcon = () => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
);

const NAV_ITEMS = ['Устройство', 'Истории', 'Наука', 'Тарифы', 'Контакты'];

const CTAButton = ({ className }) => (
  <button className={className}>
    <span className="w-2 h-2 rounded-full bg-green-400"></span>
    Забронировать
  </button>
);

const App = () => {
  const [menuOpen, setMenuOpen] = useState(false);
  const videoRef = useRef(null);
  const state = useRef({ targetTime: 0, isSeeking: false, prevX: null, duration: 0 });

  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const s = state.current;

    const onLoaded = () => { s.duration = v.duration || 0; };
    const onSeeked = () => {
      s.isSeeking = false;
      if (s.duration && Math.abs(s.targetTime - v.currentTime) > 0.01) {
        s.isSeeking = true;
        v.currentTime = s.targetTime;
      }
    };
    v.addEventListener('loadedmetadata', onLoaded);
    v.addEventListener('seeked', onSeeked);
    if (v.readyState >= 1) onLoaded();

    const onMove = e => {
      const x = e.clientX / window.innerWidth;
      if (s.prevX == null) { s.prevX = x; return; }
      const dx = x - s.prevX;
      s.prevX = x;
      if (!s.duration) return;
      s.targetTime = Math.min(s.duration, Math.max(0, s.targetTime + dx * SENSITIVITY * s.duration));
      if (!s.isSeeking) {
        s.isSeeking = true;
        v.currentTime = s.targetTime;
      }
    };
    window.addEventListener('mousemove', onMove);

    return () => {
      v.removeEventListener('loadedmetadata', onLoaded);
      v.removeEventListener('seeked', onSeeked);
      window.removeEventListener('mousemove', onMove);
    };
  }, []);

  return (
    <section className="relative h-screen w-full overflow-hidden bg-background">
      <video ref={videoRef} src={VIDEO_SRC} className="absolute inset-0 h-full w-full object-cover" muted playsInline preload="auto" />

      <nav className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5 sm:px-8 py-4 sm:py-5">
        <GadLogo height={24} color="#111111" />

        <div className="hidden md:flex absolute left-1/2 -translate-x-1/2 bg-gray-900 rounded-full px-2 py-1.5">
          {NAV_ITEMS.map((l, i) => (
            <a key={l} href="#" className={i === 0 ? 'bg-white text-gray-900 text-sm font-medium px-4 py-1.5 rounded-full' : 'text-gray-300 text-sm font-medium px-4 py-1.5 rounded-full hover:text-white transition-colors'}>{l}</a>
          ))}
        </div>

        <CTAButton className="hidden md:flex items-center gap-2 bg-gray-900 text-white text-sm font-medium px-5 py-2 rounded-full hover:bg-gray-700 transition-colors" />

        <button className="md:hidden text-gray-900" onClick={() => setMenuOpen(o => !o)} aria-label="меню">
          {menuOpen ? <XIcon /> : <MenuIcon />}
        </button>
      </nav>

      {menuOpen && (
        <div className="fixed top-0 left-0 right-0 z-40 bg-white pt-16 pb-6 px-5 shadow-lg flex flex-col gap-1 md:hidden">
          {NAV_ITEMS.map(l => (
            <button key={l} className="text-gray-800 text-base font-medium py-3 border-b border-gray-100 text-left hover:text-gray-500 transition-colors">{l}</button>
          ))}
          <CTAButton className="flex items-center justify-center gap-2 bg-gray-900 text-white text-sm font-medium px-5 py-2 rounded-full hover:bg-gray-700 transition-colors mt-4 mx-auto" />
        </div>
      )}

      <div className="relative z-10 flex flex-col h-full">
        <div className="flex-1 flex items-end pb-16 sm:pb-20 lg:pb-24 px-6 lg:px-12">
          <div className="relative lg:ml-12 max-w-[1000px]">
            <h1 className="font-grotesk text-[34px] sm:text-[56px] md:text-[68px] lg:text-[80px] uppercase text-cream leading-[1.05] sm:leading-[1] md:leading-[1] lg:leading-[1]">
              За пределами земли<br />и {'( '}её{' )'} привычных<br />границ
            </h1>
            <span className="absolute -right-4 sm:right-0 md:right-4 bottom-0 sm:bottom-1 md:bottom-2 font-condiment text-[24px] sm:text-[32px] md:text-[40px] lg:text-[48px] text-neon -rotate-1 opacity-90" style={{ mixBlendMode: 'exclusion' }}>
              NFT-коллекция
            </span>
          </div>
        </div>
      </div>
    </section>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
