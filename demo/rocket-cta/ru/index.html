            useEffect(() => {
                const onResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);
            return isMobile;
        };

        const SEED_MESSAGES = [
            { role: 'assistant', text: "Добро пожаловать на курс Vibe Design! Я помогу вам создавать впечатляющие сайты с помощью AI. С чего хотите начать?" },

            { role: 'assistant', text: "Отличный выбор! На этом курсе вы научитесь создавать полноэкранные зацикленные видео, стеклянные nav-панели, формы подписки и кнопки-манифесты — и всё это с помощью AI. Начнём!" },
        ];

        const ChatPanel = ({ initialScroll = 'top', animateMessagesIn = false }) => {
            const [messages, setMessages] = useState(SEED_MESSAGES);
            const [draft, setDraft] = useState('');
            const scrollRef = useRef(null);

            useEffect(() => {
                if (initialScroll === 'bottom' && scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, []);

            const send = () => {
                const text = draft.trim();
                if (!text) return;
                setMessages((m) => [...m, { role: 'user', text }, { role: 'assistant', text: CANNED_REPLY }]);
                setDraft('');
            };

            const onKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    send();
                }
            };

            return (
                <div className="flex h-full flex-col rounded-2xl border border-white/10 overflow-hidden" style={{ background: 'rgba(8,8,10,0.6)', backdropFilter: 'blur(24px)', WebkitBackdropFilter: 'blur(24px)' }}>

                        aria-hidden="true"
