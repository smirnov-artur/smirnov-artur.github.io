const SplitChars = ({ text, refSetter, className }) => {
    let idx = -1;
    return text.split('').map((ch) => {
        if (ch !== ' ') idx++;
        return ch === ' '
            ? <span key={'sp' + Math.random()} className="split-char">&nbsp;</span>
            : <span key={idx} ref={el => refSetter(idx, el)} className={cn('split-char', className)}>{ch}</span>;

};

const Hero = () => {
    const wrapRef = useRef(null);
    const s2 = useRef(null);
    const s3 = useRef(null);
    const h1Refs = useRef({});
    const subRefs = useRef({});

    useEffect(() => {
        const ease = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const onScroll = () => {
            const wrap = wrapRef.current;
            if (!wrap) return;
            const top = wrap.getBoundingClientRect().top;
            const scrolled = Math.max(0, -top);
            const SLIDE = 1.5 * window.innerHeight;
            const p1 = Math.min(1, scrolled / SLIDE);
            const p2 = Math.min(1, Math.max(0, (scrolled - SLIDE) / SLIDE));
            if (s2.current) s2.current.style.clipPath = `ellipse(${5 + ease(p1) * 150}% ${8 + ease(p1) * 150}% at 50% 50%)`;
            if (s3.current) s3.current.style.clipPath = `ellipse(${5 + ease(p2) * 150}% ${8 + ease(p2) * 150}% at 50% 50%)`;
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        const h1Els = Object.keys(h1Refs.current).sort((a, b) => a - b).map(k => h1Refs.current[k]);
        const subEls = Object.keys(subRefs.current).sort((a, b) => a - b).map(k => subRefs.current[k]);
        const tl = gsap.timeline({ delay: 0.2 });
        tl.fromTo(h1Els, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, stagger: 0.03, ease: 'power3.out' });
        tl.fromTo(subEls, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, stagger: 0.03, ease: 'power3.out' });

        return () => window.removeEventListener('scroll', onScroll);
    }, []);

    return (
        <div ref={wrapRef} style={{ height: 'calc(100vh + 300vh)' }}>
            <div className="sticky top-0 w-full h-screen overflow-visible">
                <video className="absolute inset-0 w-full h-full object-cover" autoPlay loop muted playsInline src={VIDEOS[0]} />
                <video ref={s2} className="absolute inset-0 w-full h-full object-cover" style={{ clipPath: 'ellipse(5% 8% at 50% 50%)' }} autoPlay loop muted playsInline src={VIDEOS[1]} />
                <video ref={s3} className="absolute inset-0 w-full h-full object-cover" style={{ clipPath: 'ellipse(5% 8% at 50% 50%)' }} autoPlay loop muted playsInline src={VIDEOS[2]} />

                <div className="absolute inset-x-0 top-0 text-center" style={{ paddingTop: 'calc(80px + 60px)' }}>
                    <span className="font-luxurious inline-block text-[12vw] md:text-[3vw]">
                        <SplitChars text="for Professionals" refSetter={(i, el) => subRefs.current[i] = el} />
                    </span>
                </div>

                <h1 className="absolute inset-x-0 font-accent whitespace-nowrap text-center md:text-left md:px-4"
                    style={{ bottom: '48px' }}>
                    <span className="hidden md:inline absolute left-0 text-[9.7vw] leading-[1] tracking-[-0.04em] whitespace-nowrap" style={{ bottom: '-26px' }}>
                        <SplitChars text="THE SMART BAKERY SOLUTION" refSetter={(i, el) => h1Refs.current['d' + i] = el} />
                    </span>
                    <span className="md:hidden block text-[40px] leading-[1.1] whitespace-normal px-4">
                        THE SMART BAKERY SOLUTION
                    </span>
                </h1>
            </div>
        </div>
    );
};
