<!DOCTYPE html>
<html lang="en">
<head>

    <title>g.a.d. — Professional Learning Platform</title>
    <meta name="description" content="g.a.d. — an accordion of mentor cards flexes open on hover while a two-tone button sweeps color on its own.">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        :root {
            --bg-soft: #f4f4f2;
            --card-bg: #ffffff;
            --text-main: #1a1e2d;
            --text-muted: #666666;
            --accent: #fdb181;
            --accent-hover: #fa9d63;
            --dark: #1a1e2d;
            --radius-lg: 40px;
            --radius-md: 20px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #fdfdfd 0%, #f4f4f2 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .c6-hero {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 60px 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .c6-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 100;
        }
        .c6-logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            z-index: 101;
            display: flex;
            align-items: center;
        }

        .c6-menu { display: flex; gap: 40px; }
        .c6-menu a {
            text-decoration: none;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: var(--transition);
        }
        .c6-menu a:hover { color: var(--text-main); }

        .c6-hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
            z-index: 101;
        }
        .c6-hamburger span {
            display: block;
            width: 28px;
            height: 2.5px;
            background: var(--text-main);
            border-radius: 2px;
            transition: var(--transition);
        }

        .c6-mobile-nav {
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            height: 100vh;
            background: white;
            z-index: 99;
            display: flex;
            flex-direction: column;
            padding: 120px 40px;
            gap: 30px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            transition: right 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .c6-mobile-nav.open { right: 0; }
        .c6-mobile-nav a {
            font-size: 1.5rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
        }

        .c6-actions { display: flex; align-items: center; gap: 25px; }
        .c6-login {
            font-size: 0.95rem;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }
        .c6-trial {
            background: var(--dark);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .c6-trial:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        .c6-main {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 60px;
        }

        .c6-left { padding-top: 20px; }
        .c6-title {
            font-size: 5.5rem;
            line-height: 1.05;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 40px;
            letter-spacing: -2px;
        }

        .c6-search-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            z-index: 5;
        }
        .c6-search {
            display: flex;
            align-items: stretch;
            gap: 0;
            background: white;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
            border: 1px solid #eee;
            padding: 0;
        }
        .c6-search input {
            flex: 1;
            border: none;
            padding: 18px 25px;
            outline: none;
            font-size: 1.1rem;
            font-family: inherit;
            color: var(--text-main);
            background: transparent;
            border-radius: 0;
            min-width: 0;
        }
        .c6-search input::placeholder { color: #bbb; }
        .c6-search button {
            background: linear-gradient(to bottom, #8BBF77 50%, var(--accent) 50%);
            background-size: 100% 200%;
            background-position: 0 100%;
            border: none;
            padding: 16px 45px;
            border-radius: 0;
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            font-size: 1.1rem;
            overflow: hidden;
            position: relative;
        }
        .c6-search button:hover {
            background-position: 0 0%;
            color: white;
            transform: scale(1.02);
        }

        .c6-right {
            display: flex;
            gap: 15px;
            height: 550px;
        }
        .c6-card {
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            flex: 1;
            min-width: 0;
            transition: flex 0.7s cubic-bezier(0.23, 1, 0.32, 1), transform 0.4s ease;
            cursor: pointer;
        }

        .c6-card:first-child { flex: 2.5; }

        .c6-card:hover { flex: 2.5; transform: translateY(-5px); }

        .c6-right:hover .c6-card:not(:hover) { flex: 0.8; }

        .c6-card img {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            width: auto;
            max-width: none;
            display: block;
        }

        .c6-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%);
        }

        .c6-card-content {
            position: absolute;
            bottom: 30px;
            left: 30px;
            right: 30px;
            color: white;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            transition: all 0.4s ease;
        }

        .c6-card-title { font-size: 2.2rem; font-weight: 600; line-height: 1.1; white-space: nowrap; }
        .c6-card-topics { text-align: right; }
        .c6-card-topics .num { font-size: 2rem; font-weight: 700; display: block; line-height: 1; }
        .c6-card-topics .label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }

        .c6-card-side-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding-bottom: 30px;
            z-index: 3;
            opacity: 1;
            transition: opacity 0.4s ease;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.3) 30%, transparent 50%);
        }
        .c6-card:hover .c6-card-side-content { opacity: 0; pointer-events: none; }

        .c6-card:not(:hover) .c6-card-content { opacity: 0; transform: translateY(10px); }
        .c6-card:first-child .c6-card-content { opacity: 1; transform: translateY(0); }
        .c6-card:first-child .c6-card-side-content { opacity: 0; }

        .c6-right:hover .c6-card:first-child:not(:hover) .c6-card-content { opacity: 0; transform: translateY(10px); }
        .c6-right:hover .c6-card:first-child:not(:hover) .c6-card-side-content { opacity: 1; }

        .c6-vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 1.8rem;
            font-weight: 600;
            white-space: nowrap;
            color: white;
            text-transform: capitalize;
            padding: 20px 10px;
            position: relative;
            background: linear-gradient(to top, transparent 50%, #1C1D2D 50%);
            border-radius: 0;
        }

        .c6-bottom-info {
            text-align: center;
            margin-top: auto;
            padding: 40px 0;
        }
        .c6-bottom-info h3 {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -1px;
            margin: 0;
        }

        @media (max-width: 1200px) {
            .c6-hero { padding: 40px 60px; }
            .c6-title { font-size: 4.5rem; }
            .c6-main { grid-template-columns: 1fr; gap: 40px; }
            .c6-right { height: 450px; }
        }

        @media (max-width: 768px) {
            .c6-hero {
                padding: 30px 20px;
                overflow-x: hidden;
            }
            .c6-menu, .c6-actions { display: none; }

            .c6-hamburger { display: flex; }
            .c6-hamburger.active span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
            .c6-hamburger.active span:nth-child(2) { opacity: 0; }
            .c6-hamburger.active span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }

            .c6-title { font-size: 3.5rem; letter-spacing: -1px; margin-bottom: 30px; }

            .c6-right {
                height: 400px;
                width: calc(100% + 40px);
                overflow-x: auto;
                overflow-y: hidden;
                padding: 10px 0 20px 0;
                gap: 15px;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                margin: 0 -20px;
                padding-left: 20px;
                padding-right: 20px;
                display: flex;
            }
            .c6-right::-webkit-scrollbar { display: none; }

            .c6-card {
                flex: 0 0 300px;
                scroll-snap-align: center;
                height: 100%;
                transform: none !important;
            }
            .c6-card:first-child { flex: 0 0 300px; }
            .c6-right:hover .c6-card:not(:hover) { flex: 0 0 300px; }

            .c6-card-content {
                opacity: 1 !important;
                transform: translateY(0) !important;
            }
            .c6-card-side-content {
                opacity: 0 !important;
                display: none;
            }

            .c6-card:hover { flex: 0 0 300px !important; }
            .c6-right:hover .c6-card { flex: 0 0 300px !important; }
            .c6-card-title { font-size: 1.8rem; }
            .c6-card-topics .num { font-size: 1.5rem; }

            .c6-bottom-info h3 { font-size: 1.8rem; line-height: 1.2; }

            .c6-search button {
                padding: 16px 25px;
                font-size: 1rem;
            }
            .c6-search input {
                padding: 18px 15px;
                font-size: 1rem;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

                        </div>

                        <div className="c6-menu">
                            <a href="#">Chase dreams</a>
                            <a href="#">Collection</a>
                            <a href="#">Trades</a>
                            <a href="#">Students</a>
                        </div>

                        <div className="c6-actions">
                            <a href="#" className="c6-login">Enter</a>
                            <a href="#" className="c6-trial">Try It Now</a>
                        </div>

                        <button
                            className={`c6-hamburger ${menuOpen ? 'active' : ''}`}
                            onClick={() => setMenuOpen((v) => !v)}
                            aria-label="Toggle menu"
                        >
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>

                        <div className={`c6-mobile-nav ${menuOpen ? 'open' : ''}`}>
                            <a href="#" onClick={closeMenu}>Chase dreams</a>
                            <a href="#" onClick={closeMenu}>Collection</a>
                            <a href="#" onClick={closeMenu}>Trades</a>
                            <a href="#" onClick={closeMenu}>Students</a>

                                href="#"
                                onClick={closeMenu}
                                style={{ marginTop: 20, color: 'var(--accent)' }}

                                href="#"
                                onClick={closeMenu}

                    </nav>

                    <main className="c6-main">
                        <div className="c6-left">

                                Study.<br />Train.<br />Rise.
                            </h1>

                                    <button>Up</button>

                        </div>

                        <div className="c6-right">

                    </main>

                    <footer className="c6-bottom-info">
                        <h3>Boundless passes to 100+ mentorships.</h3>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
