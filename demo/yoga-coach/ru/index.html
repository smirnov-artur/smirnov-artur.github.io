<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Йога с Джессикой</title>
    <meta name="description" content="Лендинг йоги без прокрутки: нажмите «Начать» — параллакс-видео доиграет до конца, а затем снизу выедет пастельный экран коллекции с тремя видеокарточками, которые оживают при наведении.">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { anton: ['Anton', 'sans-serif'] } } } };</script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZosUtiZTaR.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZosUJiZTaR.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
<style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
</head>
<body class="bg-black">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = Motion;

        const POSTER = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_053103_a6c6fd5c-8f43-4942-a487-e81c8f3cd0c1.png&w=1920&q=85';
        const MAIN_HLS = 'https://stream.mux.com/YyFgoUXUTVMiVMMLeQoq49tP00joMyEzoRmnEnk02H5rA.m3u8';
        const CARD1 = 'https://stream.mux.com/S9BmS8DLYYowz7jr1BkN2PbAQm4bjEwijllpwmEB4xA.m3u8';
        const CARD2 = 'https://stream.mux.com/83kMTSKA4Xy01RTddNwDdt7OjCocQTCdKHY7AsD02Dlgc.m3u8';
        const CARD3 = 'https://stream.mux.com/c4KUkE6NHGljcc4M8458iMEdHAbUvsG5MTpqefzBYvo.m3u8';
        const EASE = [0.16, 1, 0.3, 1];

        function useHls(src, deps){
            const ref = useRef(null);
            useEffect(() => {
                const v = ref.current; if (!v) return;
                let hls;
                if (window.Hls && Hls.isSupported()) {
                    hls = new Hls({ enableWorker: false });
                    hls.loadSource(src);
                    hls.attachMedia(v);
                    if (deps && deps.onParsed) hls.on(Hls.Events.MANIFEST_PARSED, deps.onParsed);
                } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
                    v.src = src;
                    if (deps && deps.onParsed) v.addEventListener('loadedmetadata', deps.onParsed, { once: true });
                }
                return () => { if (hls) hls.destroy(); };
                // eslint-disable-next-line
            }, [src]);
            return ref;
        }

        function YogaCard({ src, initialRotation, hoverOffset, z, className }){
            const videoRef = useHls(src);
            return (
                <motion.div
                    className={`relative rounded-3xl overflow-hidden aspect-[9/16] w-72 sm:w-[21rem] md:w-[24rem] bg-white border-[6px] sm:border-[8px] border-white shadow-[0_15px_40px_rgba(0,0,0,0.22)] cursor-pointer origin-bottom select-none ${z} ${className}`}
                    initial={{ rotate: initialRotation, x: 0, y: 0, scale: 1 }}
                    whileHover={{ ...hoverOffset, transition: { type: 'spring', stiffness: 200, damping: 20 } }}
                    onMouseEnter={() => videoRef.current && videoRef.current.play().catch(() => {})}
                    onMouseLeave={() => { const v = videoRef.current; if (v) { v.pause(); v.currentTime = 0; } }}
                >
                    <video ref={videoRef} className="w-full h-full object-cover rounded-2xl pointer-events-none" muted loop playsInline preload="auto"></video>
                    <div className="absolute inset-0 rounded-2xl ring-1 ring-black/10 pointer-events-none"></div>
                </motion.div>
            );
        }

        function GadLogo({ height = 16 }) {
          return (
            <svg className="gad-logo" height={height} viewBox="0 0 355 110" role="img" aria-label="g.a.d." style={{ color: 'currentColor' }}><path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
          );
        }

        function App(){
            const [isPlaying, setIsPlaying] = useState(false);
            const [showSecond, setShowSecond] = useState(false);
            const [isLoaded, setIsLoaded] = useState(false);
            const [parallax, setParallax] = useState({ x: 0, y: 0 });
            const videoRef = useHls(MAIN_HLS, { onParsed: () => setIsLoaded(true) });

            function onMove(e){
                const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
                setParallax({ x: x * 20, y: y * 20 });
            }
            function start(){ videoRef.current.play().catch(() => {}); setIsPlaying(true); }
            function onEnded(){ setIsPlaying(false); setShowSecond(true); }
            function back(){ const v = videoRef.current; v.pause(); v.currentTime = 0; setShowSecond(false); setIsPlaying(false); }

            return (
                <div className="w-screen h-screen bg-black overflow-hidden select-none relative" onMouseMove={onMove}>
                    <video ref={videoRef} poster={POSTER} muted playsInline preload="auto" onEnded={onEnded}
                        className={"w-full h-full object-cover transition-opacity duration-1000 ease-in-out origin-center " + (isLoaded ? 'opacity-100' : 'opacity-0')}
                        style={{ transform: `scale(1.08) translate(${parallax.x}px, ${parallax.y}px)` }}></video>
                    <div className="absolute inset-0 bg-black/10 pointer-events-none"></div>

                    <div className="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-6 sm:p-12 md:p-16">
                        <div className="flex flex-col items-start gap-5 sm:gap-7">
                            <a href="#" aria-label="g.a.d." className="pointer-events-auto text-white/80 hover:text-white transition-colors text-[20px] sm:text-[22px] leading-none"><GadLogo /></a>
                            <motion.div className="max-w-xs sm:max-w-sm md:max-w-md pointer-events-auto overflow-hidden"
                                animate={isPlaying ? { y: 250, opacity: 0 } : { y: 0, opacity: 1 }}
                                transition={{ duration: 1, ease: EASE }}>
                                <p className="font-anton text-white text-xl sm:text-2xl md:text-3xl lg:text-[2.2rem] leading-[0.95] tracking-wide uppercase" style={{ textWrap: 'balance' }}>
                                    Найдите свой фокус, запишитесь на персональные занятия йогой и живите осознанно
                                </p>
                            </motion.div>
                        </div>

                        <div className="w-full flex flex-col items-start md:flex-row md:items-end justify-between gap-4">
                            <motion.div className="pointer-events-auto overflow-hidden"
                                animate={isPlaying ? { y: '150%', opacity: 0 } : { y: 0, opacity: 1 }}
                                transition={{ duration: 1.1, ease: EASE }}>
                                <h1 className="font-anton text-white text-5xl sm:text-6xl md:text-5xl lg:text-[5rem] xl:text-[6.5rem] 2xl:text-[7.5rem] leading-none tracking-tight uppercase"><span className="block">Привет, я</span><span className="block">Джессика</span></h1>
                            </motion.div>
                            <motion.div className="text-left md:text-right pointer-events-auto overflow-hidden"
                                animate={isPlaying ? { y: '150%', opacity: 0 } : { y: 0, opacity: 1 }}
                                transition={{ duration: 1.1, ease: EASE }}>
                                <h2 className="font-anton text-white text-5xl sm:text-6xl md:text-5xl lg:text-[5rem] xl:text-[6.5rem] 2xl:text-[7.5rem] leading-none tracking-tight uppercase"><span className="block">Тренер</span><span className="block">по йоге</span></h2>
                            </motion.div>
                        </div>
                    </div>

                    <div className="absolute left-1/2 bottom-[29%] md:bottom-2 -translate-x-1/2 z-20 pointer-events-auto">
                        <AnimatePresence>
                            {!isPlaying && (
                                <motion.button key="start" onClick={start}
                                    exit={{ scale: 0, opacity: 0 }} transition={{ duration: 0.8, ease: [0.34, 1.56, 0.64, 1] }}
                                    className="w-28 h-28 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-full bg-black/90 hover:bg-black text-white font-anton text-xs sm:text-sm tracking-widest flex flex-col items-center justify-center gap-1 cursor-pointer transition-all duration-300 border border-white/20 hover:border-white/40 shadow-[0_0_50px_rgba(0,0,0,0.8)] backdrop-blur-sm relative overflow-hidden group">
                                    <span className="absolute inset-0 opacity-60 group-hover:opacity-100 transition-opacity duration-300" style={{ background: 'radial-gradient(circle, rgba(255,255,255,0.1), transparent)' }}></span>
                                    <span className="relative z-10 font-bold tracking-wider">Начать</span>
                                </motion.button>
                            )}
                        </AnimatePresence>
                    </div>

                    <motion.div className="absolute inset-0 w-full h-full z-30 flex flex-col items-center justify-start p-6 pt-24 sm:p-12 md:p-16"
                        initial={{ y: '100%' }} animate={{ y: showSecond ? 0 : '100%' }} transition={{ type: 'spring', damping: 32, stiffness: 220 }}
                        style={{ background: 'linear-gradient(to bottom, #d5effd, #aedcf9, #8cd0f7)' }}>
                        <button onClick={back} className="absolute top-[56px] left-1/2 -translate-x-1/2 z-40 flex items-center font-anton text-black hover:text-black/70 text-lg sm:text-xl border border-black/20 hover:border-black/40 px-8 py-3 rounded-full bg-white/40 backdrop-blur-md transition-all duration-300 hover:scale-105 active:scale-95 cursor-pointer">В начало</button>

                        <div className="w-full flex-1 flex flex-col items-center justify-center relative select-none mt-20 sm:mt-16">
                            <div className="font-anton select-none pointer-events-none uppercase text-[13.5vw] sm:text-[16.9vw] leading-none text-center w-full absolute z-10 whitespace-nowrap"
                                style={{ backgroundImage: 'linear-gradient(to bottom, white, rgba(255,255,255,.7), rgba(255,255,255,0))', WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent', transform: 'translateY(1rem)', filter: 'drop-shadow(0 2px 15px rgba(255,255,255,.1))' }}>
                                Коллекция #451
                            </div>
                            <div className="flex items-center justify-center relative z-20 w-full max-w-5xl mt-6">
                                <YogaCard src={CARD1} initialRotation={-8} hoverOffset={{ x: -60, y: -25, rotate: -12, scale: 1.04 }} z="z-20 hover:z-40" className="-mr-14 sm:-mr-22 md:-mr-28 lg:-mr-32" />
                                <YogaCard src={CARD2} initialRotation={0} hoverOffset={{ x: 0, y: -15, rotate: 0, scale: 1.08 }} z="z-30 hover:z-40" className="scale-105" />
                                <YogaCard src={CARD3} initialRotation={8} hoverOffset={{ x: 60, y: -25, rotate: 12, scale: 1.04 }} z="z-20 hover:z-40" className="-ml-14 sm:-ml-22 md:-ml-28 lg:-ml-32" />
                            </div>
                        </div>
                    </motion.div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
