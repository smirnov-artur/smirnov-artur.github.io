        function useInView(threshold = 0.15) {
            const ref = useRef(null);
            const [inView, setInView] = useState(false);
            useEffect(() => {
                const el = ref.current; if (!el) return;
                const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); obs.unobserve(el); } }, { threshold });
                obs.observe(el);
                return () => obs.disconnect();
            }, [threshold]);
            return [ref, inView];

        ];

        function HeroRight() {
            const [slide, setSlide] = useState(0);
            const [paused, setPaused] = useState(false);
            useEffect(() => {
                if (paused) return;
                const t = setInterval(() => setSlide(s => (s + 1) % SLIDESHOW_VIDEOS.length), 5000);
                return () => clearInterval(t);
            }, [paused]);
            return (
                <div className="relative w-full lg:w-1/2 min-h-[40vh] lg:min-h-0 bg-black overflow-hidden">
                    {SLIDESHOW_VIDEOS.map((src, i) => (
                        <video key={src} autoPlay loop muted playsInline
                            className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ${i === slide ? 'opacity-100' : 'opacity-0'}`}
                            src={src} />
                    ))}
                    <div className="absolute bottom-6 right-6 z-20 flex items-center gap-3">
                        <div className="flex gap-2">

        function BestSellers() {
            const [ref, inView] = useInView(0.1);
            const [tab, setTab] = useState('best sellers');
            const [progress, setProgress] = useState(0);
            const scrollRef = useRef(null);

            const onWheel = (e) => {
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    e.preventDefault();
                    scrollRef.current.scrollLeft += e.deltaY;
                }
            };
            const onScroll = () => {
                const el = scrollRef.current; if (!el) return;
                const max = el.scrollWidth - el.clientWidth;
                setProgress(max > 0 ? el.scrollLeft / max : 0);
            };

            return (
                <section className="bg-[#F9F4F0] text-black py-12 sm:py-16 px-4 sm:px-6 lg:px-10">

                        </div>

                        <div className="mt-8 sm:mt-10 mx-auto max-w-[280px] h-[2px] bg-gray-300 rounded-full relative overflow-hidden">
                            <div className="absolute top-0 left-0 h-full bg-[#1a1a1a] rounded-full" style={{ width: '30%', transform: `translateX(${progress * (100 / 0.3)}%)` }}></div>
                        </div>
                    </div>
                </section>
            );
        }

        const CATEGORIES = [
            { name: 'face', video: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260518_203023_87a26602-2898-4acc-a396-c7a2b5ad84fd.mp4' },
            { name: 'beauty tools', video: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260518_203415_b86e3f19-2aec-46cd-9a86-b64c40118e38.mp4' },
            { name: 'body', video: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260518_203051_85fee398-ea01-4aa0-972b-137a74213be5.mp4' },
        ];

        function Categories() {
            const [ref, inView] = useInView(0.1);
            return (
                <section ref={ref} className={`fade-in-up-lg ${inView ? 'visible' : ''} bg-black text-white grid grid-cols-1 md:grid-cols-3`}>
                    {CATEGORIES.map(c => (
                        <div key={c.name} className="cat-card relative min-h-[400px] sm:min-h-[500px] md:min-h-[750px] p-6 sm:p-8 md:p-12 flex flex-col justify-between overflow-hidden">
                            <video autoPlay loop muted playsInline className="cat-media absolute inset-0 w-full h-full object-cover" src={c.video} />
                            <div className="cat-overlay absolute inset-0 bg-black/10"></div>
                            <div></div>
                            <div className="relative z-10 flex items-center justify-between">
                                <span className="cat-label font-medium" style={{ writingMode: 'vertical-lr', transform: 'rotate(180deg)' }}>
                                    <span className="text-5xl sm:text-6xl md:text-7xl lg:text-8xl">{c.name}</span>
                                </span>
                                <button className="btn-primary px-8 py-3 bg-white text-black rounded-full text-sm whitespace-nowrap">shop {c.name}</button>
                            </div>
                        </div>
                    ))}
                </section>
            );
        }

        function App() {
            const [menuOpen, setMenuOpen] = useState(false);
            useEffect(() => { lucide.createIcons(); }, [menuOpen]);
            return (
                <div className="w-full">
                    <Hero menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
                    <BestSellers />
                    <Categories />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
