<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Новая эра дизайна начинается сейчас</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
</head>
<body class="antialiased overflow-x-hidden" style="font-family:'Rubik',sans-serif; background: #21346e">
    <div id="root"></div>
    <script type="text/babel">
        const App = () => (
            <div className="relative min-h-screen overflow-hidden" style={{ background: '#21346e' }}>
                <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260206_044704_dd33cb15-c23f-4cfc-aa09-a0465d4dcb54.mp4" className="absolute inset-0 w-full h-full object-cover z-0" autoPlay loop muted playsInline />
                <div className="relative z-10 pt-32 md:pt-48 px-6 md:px-16 lg:px-24">
                    <h1 className="text-white font-bold uppercase" style={{ fontSize: 'clamp(60px, 8vw, 100px)', lineHeight: 0.98, letterSpacing: '-3px' }}>
                        <span className="block">НОВАЯ ЭРА</span>
                        <span className="block">ДИЗАЙНА</span>
                        <span className="block">НАЧИНАЕТСЯ</span>
                    </h1>
                    <div className="mt-10">
                        <button className="relative w-[184px] h-[65px] hover:scale-105 active:scale-95 transition-transform">
                            <svg className="absolute inset-0 w-full h-full" viewBox="0 0 184 65" fill="white" preserveAspectRatio="none">
                                <rect width="184" height="65" rx="12" fill="white"/>
                            </svg>
                            <span className="relative z-10 font-bold uppercase text-[20px]" style={{ color: '#161a20' }}>НАЧАТЬ</span>
                        </button>
                    </div>
                </div>
            </div>
        );
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
