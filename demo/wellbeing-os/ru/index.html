<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowpath — наведи мосты, забудь рутину</title>
    <meta name="description" content="Flowpath объединяет ваш wellness-стек в одном рабочем пространстве — команда тратит меньше времени на разрозненные сервисы и больше на реальный результат.">

    <link href="https://db.onlinewebfonts.com/c/08e020de1811ec4489f82d1247a42c09?family=Helvetica+Now+Text" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        * { font-family: 'Helvetica Now Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        html, body { overflow-x: hidden; margin: 0; }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes dropdown-in {
            from { opacity: 0; transform: translateY(-4px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-dropdown { animation: dropdown-in 0.2s ease-out; }
        .duration-400 { transition-duration: 400ms; }
    </style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'Helvetica Now Text';font-style:normal;font-weight:normal;font-display:swap;src:url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7SUc.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Helvetica Now Text';font-style:normal;font-weight:normal;font-display:swap;src:url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa0ZL7SUc.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
</head>
<body class="bg-black antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const VIDEO_URL = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260703_053131_1ec3dd1c-d627-44fb-ab20-6e1fce41b0d5.mp4";

        const Logo = () => (
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 3L15.5 9.5L9 16L2.5 9.5L9 3Z" fill="white" opacity="0.9" />
                <path d="M19 12L25.5 18.5L19 25L12.5 18.5L19 12Z" fill="white" opacity="0.5" />
            </svg>
        );

        const ChevronDown = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m6 9 6 6 6-6" />
            </svg>
        );
        const MenuIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="4" y1="6" x2="20" y2="6" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="18" x2="20" y2="18" />
            </svg>
        );
        const XIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18" /><path d="M6 6l12 12" />
            </svg>
        );

        const NAV_ITEMS = [
            { label: "Продукт", items: ["Интеграции", "Процессы", "Аналитика"] },
            { label: "Решения", items: ["Руководства", "Кейсы", "Справочник API"] },
            { label: "О нас", items: ["Наша история", "Вакансии", "Связаться"] },
            { label: "Тарифы", items: null },
        ];

        const NavItem = ({ label, items }) => {
            const [open, setOpen] = useState(false);
            return (
                <div className="relative" onMouseEnter={() => items && setOpen(true)} onMouseLeave={() => setOpen(false)}>
                    <button type="button" className="flex items-center gap-1 text-white/90 hover:text-white text-sm font-medium">
                        {label}
                        {items && <ChevronDown className={`w-3.5 h-3.5 transition-transform duration-200 ${open ? 'rotate-180' : ''}`} />}
                    </button>
                    {items && (
                        <div className={`!absolute top-full left-0 mt-1 liquid-glass rounded-xl py-3 px-2 min-w-[160px] shadow-xl ${open ? 'block animate-dropdown' : 'hidden'}`}>
                            {items.map((sub) => (
                                <a key={sub} href="#" className="block px-3 py-2 text-white/80 hover:text-white text-sm rounded-lg hover:bg-white/5 whitespace-nowrap">{sub}</a>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const MobileMenu = ({ open, onClose }) => (
            <div className={`md:hidden absolute top-full left-0 right-0 px-5 sm:px-6 mt-2 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] ${open ? 'opacity-100 translate-y-0 pointer-events-auto' : 'opacity-0 -translate-y-3 pointer-events-none'}`}>
                <div className="bg-[#2C221C]/95 backdrop-blur-xl rounded-2xl p-6">
                    {NAV_ITEMS.map((item) => (
                        <div key={item.label} className="py-3 border-b border-white/10 last:border-0">
                            <div className="text-white text-base font-medium">{item.label}</div>
                            {item.items && (
                                <div className="mt-2 ml-3 flex flex-col gap-2">
                                    {item.items.map((sub) => (
                                        <a key={sub} href="#" onClick={onClose} className="text-white/70 hover:text-white text-sm">{sub}</a>
                                    ))}
                                </div>
                            )}
                        </div>
                    ))}
                    <div className="mt-4 pt-4 border-t border-white/10 flex items-center justify-between">
                        <a href="#" onClick={onClose} className="text-white/90 text-sm font-medium">Войти</a>
                        <button type="button" className="liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium">Попробовать бесплатно</button>
                    </div>
                </div>
            </div>
        );

        const Nav = () => {
            const [mobileOpen, setMobileOpen] = useState(false);
            return (
                <nav className="relative z-20 w-full px-5 sm:px-6 md:px-12 lg:px-16 py-4 sm:py-5">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <Logo />
                            <span className="text-white text-lg sm:text-xl font-medium tracking-tight">flowpath</span>
                        </div>

                        <div className="hidden md:flex items-center gap-8">
                            {NAV_ITEMS.map((item) => <NavItem key={item.label} {...item} />)}
                        </div>

                        <div className="hidden md:flex items-center gap-4">
                            <a href="#" className="text-white/90 hover:text-white text-sm font-medium">Войти</a>
                            <button type="button" className="liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium">Попробовать бесплатно</button>
                        </div>

                        <button type="button" aria-label="Переключить меню" onClick={() => setMobileOpen((v) => !v)} className="md:hidden relative w-8 h-8 flex items-center justify-center text-white">
                            <MenuIcon className={`absolute w-6 h-6 transition-all duration-300 ${mobileOpen ? 'opacity-0 scale-75 rotate-90' : 'opacity-100 scale-100 rotate-0'}`} />
                            <XIcon className={`absolute w-6 h-6 transition-all duration-300 ${mobileOpen ? 'opacity-100 scale-100 rotate-0' : 'opacity-0 scale-75 -rotate-90'}`} />
                        </button>
                    </div>

                    <MobileMenu open={mobileOpen} onClose={() => setMobileOpen(false)} />
                </nav>
            );
        };

        const Hero = () => (
            <div className="relative z-10 flex-1 flex items-start justify-center pt-16 sm:pt-20 md:pt-24 px-5">
                <div className="text-center max-w-3xl">
                    <h1 className="text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl leading-[1.05] tracking-[-0.02em]">
                        Наведи<br />
                        мосты. <span className="text-white/60">Забудь</span><br />
                        <span className="text-white/60">рутину.</span>
                    </h1>
                    <p className="text-white/80 text-sm sm:text-base md:text-lg leading-relaxed max-w-md mx-auto mt-6 sm:mt-8">
                        Flowpath собирает все ваши wellness-сервисы в одном месте: команда меньше латает дыры и больше движется вперёд.
                    </p>
                    <div className="flex flex-wrap items-center justify-center gap-3 sm:gap-4 mt-6 sm:mt-8">
                        <button type="button" className="px-5 sm:px-6 py-2.5 sm:py-3 bg-white text-gray-900 text-sm font-semibold rounded-full hover:bg-white/90">Начать путь</button>
                        <button type="button" className="px-5 sm:px-6 py-2.5 sm:py-3 liquid-glass rounded-full text-white text-sm font-semibold hover:bg-white/10">Посмотреть в деле</button>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            return (
                <section className="h-screen w-full overflow-hidden relative flex flex-col bg-black">
                    <video autoPlay muted loop playsInline className="absolute inset-0 w-full h-full object-cover" src={VIDEO_URL} />
                    <div className="absolute inset-0 bg-black/10" />
                    <Nav />
                    <Hero />
                </section>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
