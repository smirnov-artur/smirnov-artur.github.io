              if (diff > 1) diff -= PRODUCTS.length;
              if (diff < -1) diff += PRODUCTS.length;
              const abs = Math.abs(diff);
              const width = abs === 0 ? CENTER_WIDTH : ITEM_WIDTH;
              const height = abs === 0 ? 260 : 200;
              const opacity = abs === 0 ? 1 : (abs === 1 ? 0.7 : 0.3);
              const zIndex = abs === 0 ? 10 : 0;
              let translateX = 0;
              if (abs > 0) {
                translateX = (CENTER_WIDTH / 2 + GAP + ITEM_WIDTH / 2) + (abs - 1) * (ITEM_WIDTH + GAP);
                translateX *= Math.sign(diff);
              }
              return (
                <div key={p.id}
                  onClick={diff !== 0 ? () => goTo(diff > 0 ? 1 : -1) : undefined}
                  className={`absolute top-1/2 left-1/2 ${diff !== 0 ? 'cursor-pointer' : ''}`}

                    transform: `translate(-50%,-50%) translateX(${translateX}px)`,
