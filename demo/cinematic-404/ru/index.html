<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — 404</title>
<!-- Один файл вместо React + Vite + Tailwind. ?lang=ru — русская версия (в Geist Mono с static.figma.com кириллица есть).
     Знак и надпись бренда в шапке — наш логотип g.a.d. -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Geist Mono:SemiBold";font-weight:600;font-style:normal;font-display:swap;src:url("https://static.figma.com/font/GeistMono_wght__1") format("woff2")}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow-x:hidden}
.page{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#000;color:#fff}
.page video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}

.logo{position:absolute;z-index:2;top:80px;left:50%;transform:translateX(-50%);height:40px;color:#fff}
.logo svg{display:block;height:40px;width:auto;overflow:visible}
.logo svg text{font-family:'Unbounded',sans-serif}
.logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}

.content{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);width:483px;display:flex;flex-direction:column;align-items:center;gap:44px;text-align:center}
h1{font-family:"Geist Mono:SemiBold",monospace;font-size:295.751px;font-weight:600;line-height:1.1;letter-spacing:-24.6459px;
  background:linear-gradient(247.33deg,#fff 2.53%,rgba(255,255,255,.4) 93.61%);-webkit-background-clip:text;background-clip:text;color:transparent}
hr{width:425px;height:0;border:0;border-top:1px solid #fff}
p{font-family:"Geist Mono:SemiBold",monospace;font-size:24px;font-weight:600;line-height:1.1;letter-spacing:-2px;color:#fff}

@media (max-width:640px){
  .logo{top:32px;transform:translateX(-50%) scale(.75);transform-origin:50% 0}
  .content{width:min(calc(100% - 40px),360px);gap:28px}
  h1{font-size:clamp(140px,52vw,200px);letter-spacing:-.09em}
  hr{width:100%}
  p{font-size:clamp(16px,4.5vw,20px);letter-spacing:-1.3px}
}
@media (prefers-reduced-motion:reduce){.logo .ring{animation:none;stroke-dashoffset:0}.logo .orb{animation:none;opacity:1}}
</style>
</head>
<body>
<main class="page">
  <video autoplay loop muted playsinline aria-hidden="true" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260801_001207_ec20d138-aa45-4b2b-ab8c-bdc71607f240.mp4"></video>
  <div class="logo" aria-label="g.a.d.">
    <svg viewBox="0 0 355 110" aria-hidden="true">
      <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
      <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
    </svg>
  </div>
  <div class="content">
    <h1>404</h1>
    <hr>
    <p id="msg">The path may be broken, but the journey isn’t. Let’s get you back.</p>
  </div>
</main>
<script>
if (true) {
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — страница не найдена';
  document.getElementById('msg').textContent = 'Дорога оборвалась, но путь не окончен. Давайте вернём вас обратно.';
}
</script>
</body>
</html>
