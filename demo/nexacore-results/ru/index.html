<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. | Единая сквозная система</title>
    <meta name="description" content="g.a.d. показывает, как единая система определяет, интегрирует, сертифицирует и запускает программу от начала до конца.">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #f7f6fb; }
        @font-face {
            font-family: 'Mazzard H';
            font-weight: 400;
            font-style: normal;
            src: url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff2') format('woff2'),
                 url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff') format('woff'),
                 url('https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Mazzard H';
            font-weight: 500;
            font-style: normal;
            src: url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff2') format('woff2'),
                 url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff') format('woff'),
                 url('https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.ttf') format('truetype');
        }
        html, body, * { font-family: 'Mazzard H', sans-serif; }
    </style>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}
    </style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'Mazzard H';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk7PFN_P-bnBeA.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Mazzard H';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk7PFN_G-bnBeA.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Mazzard H';font-style:normal;font-weight:500;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk7PFN_P-bnBeA.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Mazzard H';font-style:normal;font-weight:500;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk7PFN_G-bnBeA.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const LINE_GRADIENT =
            'linear-gradient(rgb(28, 78, 255), rgb(254, 136, 27) 0%, rgb(172, 36, 255) 25%, rgb(247, 159, 255) 50%, rgb(255, 214, 0) 66%, rgb(254, 136, 27) 84%, rgba(254, 136, 27, 0) 102%)';

        const PILLARS = [
            { label: 'Определяет', items: ['условия', 'объём', 'спецификации', 'сроки'], leftVw: 2.8, bottomVw: 7 },
            { label: 'Интегрирует', items: ['строительство', 'механика', 'электрика', 'автоматика'], leftVw: 22.4, bottomVw: 9.08 },
            { label: 'Сертифицирует', items: ['резервирование', 'тестирование', 'соответствие', 'согласования'], leftVw: 41.2, bottomVw: 11.16 },
            { label: 'Запускает', items: ['переход', 'регламенты', 'передача', 'SLA'], leftVw: 61.1, bottomVw: 13.24 },
        ];

        const GadMark = ({ size }) => (
            <svg className="gad-logo" style={{ width: size, height: size }} viewBox="293 1 58 58" role="img" aria-label="g.a.d.">
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
            </svg>
        );

        const PrecisionSection = () => (
            <section style={{
                backgroundImage: 'url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260418_125638_553b96dc-a1fd-4b2b-81a9-ed7daa80006e.png&w=1280&q=85")',
                backgroundSize: 'cover',
                backgroundPosition: 'center',
                backgroundRepeat: 'no-repeat',
                width: '100%',
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                textAlign: 'center',
                padding: 'clamp(48px, 8vw, 120px) clamp(16px, 4vw, 60px) clamp(48px, 5.56vw, 80px)',
                gap: 'clamp(32px, 4vw, 56px)',
            }}>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 36 }}>
                    <div style={{
                        backgroundColor: 'rgb(249, 249, 249)',
                        display: 'flex',
                        alignItems: 'center',
                        gap: 8,
                        fontSize: 'clamp(14px, 1.1vw, 18px)',
                        fontWeight: 500,
                        borderRadius: 36,
                        padding: 'clamp(8px, 0.9vw, 14px) clamp(12px, 1.25vw, 20px)',
                        color: 'rgb(26, 11, 84)',
                        whiteSpace: 'nowrap',
                    }}>
                        <svg width="19" height="18" style={{ flexShrink: 0 }} viewBox="0 0 17 16" fill="none">
                            <g clipPath="url(#prec-clip)">
                                <circle cx="8.5" cy="8" r="7" stroke="#c86fff" fill="none" />
                                <path d="M9.5 11.5V10.5H7.5V11.5H9.5ZM7.5 14.5C7.5 15.0523 7.94772 15.5 8.5 15.5C9.05228 15.5 9.5 15.0523 9.5 14.5H7.5ZM8.5 11.5H7.5V14.5H8.5H9.5V11.5H8.5Z" fill="rgb(200, 111, 255)" />
                                <path d="M12 7H11V9H12V7ZM15 9C15.5523 9 16 8.55228 16 8C16 7.44772 15.5523 7 15 7V9ZM12 8V9H15V8V7L12 7V8Z" fill="rgb(200, 111, 255)" />
                                <path d="M5 9H6V7H5V9ZM2 7C1.44772 7 1 7.44772 1 8C1 8.55228 1.44772 9 2 9V7ZM5 8V7H2V8V9H5V8Z" fill="rgb(200, 111, 255)" />
                                <path d="M7.5 4.5V5.5H9.5V4.5H7.5ZM9.5 1.5C9.5 0.947715 9.05228 0.5 8.5 0.5C7.94772 0.5 7.5 0.947715 7.5 1.5H9.5ZM8.5 4.5H9.5V1.5H8.5H7.5V4.5H8.5Z" fill="rgb(200, 111, 255)" />
                            </g>
                            <defs>
                                <clipPath id="prec-clip">
                                    <rect width="16" height="16" fill="white" transform="translate(0.5)" />
                                </clipPath>
                            </defs>
                        </svg>
                        Поставка по этапам
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', maxWidth: 'clamp(700px, 60vw, 900px)', gap: 22 }}>
                        <h2 style={{ fontSize: 'clamp(28px, 4vw, 56px)', fontWeight: 500, color: 'rgb(26, 11, 84)', lineHeight: 1.15, margin: 0 }}>
                            <span className="sm:whitespace-nowrap" style={{ display: 'block' }}>Единая сквозная система.</span>
                            <span style={{
                                backgroundImage: 'linear-gradient(90deg, rgb(43, 167, 255), rgb(202, 69, 255) 50%, rgb(254, 136, 27))',
                                WebkitBackgroundClip: 'text',
                                backgroundClip: 'text',
                                WebkitTextFillColor: 'transparent',
                                color: 'transparent',
                                paddingBottom: '0.3vw',
                                display: 'block',
                            }}>Ценность накапливается.</span>
                        </h2>
                        <p style={{ fontSize: 'clamp(15px, 1.2vw, 20px)', color: 'rgb(169, 151, 206)', margin: 0 }}>
                            Команда g.a.d. фиксирует, согласовывает, проверяет и запускает всё, что нужно, чтобы проекты шли точно по графику.
                        </p>
                    </div>
                </div>

                <div style={{ width: '100%', maxWidth: '82.292vw', margin: '0 auto' }}>
                    <div className="hidden sm:block" style={{ position: 'relative', width: '82.292vw', height: '31.94vw', color: 'rgb(26, 11, 84)' }}>
                        {PILLARS.map((p) => (
                            <div key={p.label} style={{ position: 'absolute', bottom: `${p.bottomVw}vw`, left: `${p.leftVw}vw`, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-start' }}>
                                <div style={{
                                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                                    backgroundImage: 'linear-gradient(135deg, rgb(255, 255, 255), rgba(255, 255, 255, 0.6))',
                                    fontSize: 18, fontWeight: 500, borderRadius: 20,
                                    paddingTop: '0.972vw', paddingBottom: '0.972vw', paddingLeft: '1.736vw', paddingRight: '1.736vw',
                                    whiteSpace: 'nowrap', gap: 8,
                                }}>
                                    <GadMark size="1.111vw" />
                                    {p.label}
                                </div>
                                <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end' }}>
                                    <div style={{ position: 'absolute', top: '0.56vw', left: '1.94vw', display: 'flex', flexDirection: 'column', gap: 4, fontSize: 16, alignItems: 'flex-start', justifyContent: 'space-between' }}>
                                        {p.items.map((it) => (
                                            <div key={it} style={{ paddingTop: '0.69vw', paddingBottom: '0.69vw', paddingLeft: '1.04vw', paddingRight: '1.04vw', display: 'flex', alignItems: 'flex-start' }}>{it}</div>
                                        ))}
                                    </div>
                                    <div style={{ backgroundImage: LINE_GRADIENT, width: 1, height: '14.24vw' }} />
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="flex flex-col sm:hidden w-full" style={{ color: 'rgb(26, 11, 84)', gap: 0 }}>
                        {PILLARS.map((p, index) => {
                            const isRight = index % 2 !== 0;
                            return (
                                <div key={p.label} style={{ display: 'flex', flexDirection: 'column', alignItems: isRight ? 'flex-end' : 'flex-start', width: '100%', paddingBottom: 8 }}>
                                    <div style={{
                                        display: 'inline-flex', alignItems: 'center',
                                        backgroundImage: 'linear-gradient(135deg, rgb(255, 255, 255), rgba(255, 255, 255, 0.6))',
                                        fontSize: 15, fontWeight: 500, borderRadius: 20, padding: '10px 18px',
                                        whiteSpace: 'nowrap', gap: 7,
                                    }}>
                                        <GadMark size={16} />
                                        {p.label}
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: isRight ? 'row-reverse' : 'row', alignItems: 'stretch', width: '100%' }}>
                                        <div style={{ width: 1, flexShrink: 0, backgroundImage: LINE_GRADIENT, marginLeft: isRight ? 0 : 22, marginRight: isRight ? 22 : 0, minHeight: 120 }} />
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: 0, paddingLeft: isRight ? 0 : 20, paddingRight: isRight ? 20 : 0, paddingTop: 8, paddingBottom: 8, alignItems: isRight ? 'flex-end' : 'flex-start' }}>
                                            {p.items.map((it) => (
                                                <div key={it} style={{ fontSize: 14, color: 'rgb(100, 80, 160)', padding: '8px 0' }}>{it}</div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </section>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrecisionSection />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
