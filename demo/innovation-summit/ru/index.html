<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unfold by MEWS | Витрина приложения для гостиничного форума</title>
    <meta name="description" content="Витрина мобильного приложения Unfold от MEWS на три экрана: видео-заставка, список спикеров и раздел вопросов с плавным появлением при загрузке.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <style>
        :root{ --ps:1; }
        @media (max-width:440px){ :root{ --ps:.82; } }
        html,body{ background:#433B73; }
        .phone-frame{ position:relative; width:calc(393px*var(--ps)); height:calc(873px*var(--ps)); border-radius:44px; overflow:hidden; background:#000; flex-shrink:0; }
        .phone-frame.bordered{ border:1px solid rgba(148,145,182,.28); }
        .phone-inner{ position:absolute; top:0; left:0; width:393px; height:873px; transform:scale(var(--ps)); transform-origin:top left; }

        .phones-row{ display:flex; gap:40px; justify-content:center; align-items:flex-start; }
        @media (max-width:900px){ .phones-row{ flex-direction:column; align-items:center; } }

        @keyframes riseIn{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:translateY(0); } }
        @keyframes blurIn{ from{ opacity:0; transform:translateY(26px) scale(.94); filter:blur(14px); letter-spacing:.06em; } to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); letter-spacing:-0.02em; } }
        @keyframes clipUp{ from{ clip-path:inset(100% 0 0 0); opacity:0; } to{ clip-path:inset(0 0 0 0); opacity:1; } }
        @keyframes lineGrow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
        @keyframes sheen{ from{ transform:translateX(-130%) skewX(-12deg); } to{ transform:translateX(230%) skewX(-12deg); } }

        .anim-rise{ opacity:0; animation:riseIn .8s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-blur{ opacity:0; animation:blurIn 1.1s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-clip{ animation:clipUp .9s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-line{ transform:scaleX(0); transform-origin:left; animation:lineGrow .8s cubic-bezier(.16,1,.3,1) forwards; }
        .sheen-wrap{ position:relative; overflow:hidden; }
        .sheen-wrap .sheen{ position:absolute; top:0; left:0; width:40%; height:100%; background:linear-gradient(75deg, transparent, rgba(255,255,255,.65), transparent); transform:translateX(-130%) skewX(-12deg); animation:sheen 1s cubic-bezier(.16,1,.3,1) 1.5s 1 forwards; }

        @media (prefers-reduced-motion: reduce){
            .anim-rise, .anim-blur, .anim-clip, .anim-line, .sheen-wrap .sheen{ animation:none !important; opacity:1 !important; transform:none !important; clip-path:none !important; }
        }
    </style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'General Sans';font-style:normal;font-weight:500;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggqxSuXd.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'General Sans';font-style:normal;font-weight:500;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'General Sans';font-style:normal;font-weight:600;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggqxSuXd.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'General Sans';font-style:normal;font-weight:600;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/montserrat/v31/JTUSjIg1_i6t8kCHKm459WRhyzbi.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/montserrat/v31/JTUSjIg1_i6t8kCHKm459W1hyzbi.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;src:url(https://fonts.gstatic.com/s/montserrat/v31/JTUSjIg1_i6t8kCHKm459WRhyzbi.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;src:url(https://fonts.gstatic.com/s/montserrat/v31/JTUSjIg1_i6t8kCHKm459W1hyzbi.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url(https://fonts.gstatic.com/s/montserrat/v31/JTUSjIg1_i6t8kCHKm459WRhyzbi.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url(https://fonts.gstatic.com/s/montserrat/v31/JTUSjIg1_i6t8kCHKm459W1hyzbi.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
</head>
<body class="antialiased" style="background:#433B73; font-family:'Inter','Archivo',sans-serif;">
    <div id="root"></div>
    <script type="text/babel">
        const { useEffect } = React;

        const speakerChips = ['Все', 'Хедлайнеры', 'Отельеры', 'Технологии', 'Консультанты'];
        const faqChips = ['Все', 'Где остановиться?', 'Офлайн-формат', 'Билеты', 'Площадка', 'Мастер-классы', 'Нетворкинг и вечеринка', 'Другое'];

        function Chip({ label, active, delay }) {
            return (
                <span className="anim-rise inline-flex items-center text-[13.5px] px-4 py-[9px] rounded-full leading-none"
                    style={{
                        animationDelay: delay + 's',
                        fontFamily: "'Inter',sans-serif",
                        fontWeight: active ? 500 : 400,
                        background: active ? '#9393f3' : 'transparent',
                        color: active ? '#181523' : 'rgba(255,255,255,.55)',
                        border: active ? 'none' : '1px solid rgba(255,255,255,.22)'
                    }}>{label}</span>
            );
        }

        function HamburgerTwoLines() {
            return (
                <span className="flex flex-col items-center justify-center gap-[5px]">
                    <span className="block w-[16px] h-[1.5px] bg-white"></span>
                    <span className="block w-[16px] h-[1.5px] bg-white"></span>
                </span>
            );
        }

        function TopBarDark({ delay }) {
            return (
                <div className="anim-rise flex items-center justify-between px-7 pt-8" style={{ animationDelay: delay + 's' }}>
                    <span className="text-white text-[24px] font-semibold" style={{ fontFamily: "'General Sans','Satoshi',sans-serif" }}>Unfold</span>
                    <button className="w-10 h-10 rounded-full border border-white/25 flex items-center justify-center text-white" aria-label="Меню">
                        <i data-lucide="menu" style={{ width: 16, height: 16 }}></i>
                    </button>
                </div>
            );
        }

        function Divider({ delay, style }) {
            return <div className="anim-line h-px" style={{ animationDelay: delay + 's', background: 'rgba(255,255,255,.14)', ...style }}></div>;
        }

        function SpeakerCard({ img, name, role, delay }) {
            return (
                <div className="anim-rise" style={{ animationDelay: delay + 's' }}>
                    <div className="w-full rounded-[20px] overflow-hidden" style={{ aspectRatio: '150/172', background: '#1a1a1e' }}>
                        <img src={img} alt={name} className="w-full h-full object-cover" loading="lazy" />
                    </div>
                    <div className="mt-[10px] text-white text-[15px]" style={{ fontFamily: "'Inter',sans-serif" }}>{name}</div>
                    <div className="text-[12px] truncate" style={{ fontFamily: "'Inter',sans-serif", color: 'rgba(255,255,255,.5)' }}>{role}</div>
                </div>
            );
        }

        function FaqItem({ q }) {
            return (
                <div className="flex items-center justify-between" style={{ background: '#131519', border: '1.5px solid rgba(255,255,255,.14)', borderRadius: '22px', padding: '22px' }}>
                    <span className="text-white text-[17px] pr-3" style={{ fontFamily: "'Inter',sans-serif" }}>{q}</span>
                    <span className="w-9 h-9 rounded-full border border-white/40 flex items-center justify-center shrink-0">
                        <i data-lucide="plus" style={{ width: 15, height: 15 }} className="text-white"></i>
                    </span>
                </div>
            );
        }

        function FaqGroup({ label, questions, delay }) {
            return (
                <div className="anim-rise" style={{ animationDelay: delay + 's' }}>
                    <span className="inline-block text-[10px] px-3 py-[6px] rounded-t-[10px]" style={{ background: '#1a1c22', color: 'rgba(214,211,242,.9)', fontFamily: "'Inter',sans-serif" }}>{label}</span>
                    <div className="flex flex-col gap-[10px]">
                        {questions.map((q, i) => <FaqItem key={i} q={q} />)}
                    </div>
                </div>
            );
        }

        function PhoneHome() {
            return (
                <div className="phone-frame">
                    <div className="phone-inner">
                        <video className="absolute inset-0 w-full h-full object-cover"
                            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260704_080218_722465a5-cef1-4c6b-976a-948823474a8b.mp4"
                            autoPlay loop muted playsInline />
                        <div className="absolute inset-0" style={{ background: 'rgba(0,0,0,.12)' }}></div>
                        <div className="absolute inset-x-0 bottom-0" style={{ height: '34%', background: 'linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.92))' }}></div>
                        <div className="absolute inset-x-0 top-0" style={{ height: '16%', background: 'linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0))' }}></div>

                        <div className="anim-rise absolute inset-x-0 top-0 flex items-center justify-between px-7 pt-8" style={{ animationDelay: '.45s' }}>
                            <span className="text-white text-[16px] font-bold uppercase" style={{ fontFamily: "'Michroma',sans-serif", letterSpacing: '.22em' }}>MEWS</span>
                            <button className="w-[46px] h-[46px] rounded-full flex items-center justify-center" style={{ border: '1px solid #78739f' }} aria-label="Меню">
                                <HamburgerTwoLines />
                            </button>
                        </div>

                        <div className="absolute inset-0 flex flex-col items-center justify-center px-6">
                            <h1 className="anim-blur text-white text-[88px] leading-[.95] font-semibold text-center" style={{ animationDelay: '.55s', fontFamily: "'General Sans','Satoshi',sans-serif" }}>Unfold</h1>
                            <div className="anim-rise flex items-center gap-[10px] mt-[48px]" style={{ animationDelay: '.8s' }}>
                                <span className="text-white text-[14px] font-medium" style={{ fontFamily: "'Poppins',sans-serif" }}>Выпуск 05</span>
                                <span className="w-[46px] h-[15px] rounded-full bg-white"></span>
                                <span className="text-white text-[14px] font-medium" style={{ fontFamily: "'Poppins',sans-serif" }}>Амстердам</span>
                                <span className="w-[7px] h-[7px] rounded-full bg-white"></span>
                                <span className="text-white text-[14px] font-medium" style={{ fontFamily: "'Poppins',sans-serif" }}>29.05.2024</span>
                            </div>
                        </div>

                        <div className="absolute inset-x-0 flex justify-center" style={{ bottom: '44px' }}>
                            <button className="anim-rise sheen-wrap bg-white text-black rounded-full flex items-center gap-2" style={{ animationDelay: '.95s', padding: '19px 34px', borderRadius: '40px', boxShadow: '0 10px 30px rgba(0,0,0,.3)', fontFamily: "'Inter',sans-serif", fontWeight: 700, fontSize: '18px' }}>
                                <span className="sheen"></span>
                                Купить билет
                                <i data-lucide="arrow-right" style={{ width: 18, height: 18 }}></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function PhoneSpeakers() {
            return (
                <div className="phone-frame bordered">
                    <div className="phone-inner" style={{ background: '#08080a' }}>
                        <TopBarDark delay={.6} />
                        <div className="px-7 mt-8">
                            <h2 className="anim-clip text-white text-[48px] leading-[1.08] font-normal" style={{ animationDelay: '.7s', fontFamily: "'Poppins',sans-serif" }}>Спикеры<br />этого года</h2>
                            <p className="anim-rise mt-4 text-[14px] leading-[1.6]" style={{ animationDelay: '.85s', color: 'rgba(255,255,255,.55)', fontFamily: "'Inter',sans-serif" }}>
                                Лучшие лица индустрии гостеприимства выступят на Unfold. Познакомьтесь с теми, кто вдохновит участников в этом году.
                            </p>
                            <Divider delay={1} style={{ marginTop: '24px' }} />
                            <div className="flex flex-wrap gap-2 mt-5">
                                {speakerChips.map((c, i) => <Chip key={c} label={c} active={i === 0} delay={1.1 + i * .07} />)}
                            </div>
                            <div className="grid grid-cols-2 gap-[14px] mt-4">
                                <SpeakerCard delay={1.2}
                                    img="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_082140_91d42552-7cae-4b03-9a4d-f36a29ae93dc.png&w=1280&q=85"
                                    name="Dimitris Manikis" role="Президент и управляющий директор по EMEA" />
                                <SpeakerCard delay={1.27}
                                    img="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_082107_663b204f-717a-49cf-9e97-7632b85a1cfd.png&w=1280&q=85"
                                    name="Fiona McDonnell" role="Вице-президент по глобальным партнёрствам" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function PhoneFaqs() {
            return (
                <div className="phone-frame bordered">
                    <div className="phone-inner" style={{ background: '#0c0e12' }}>
                        <TopBarDark delay={.8} />
                        <div className="px-7" style={{ transform: 'scale(.93)', transformOrigin: 'top center' }}>
                            <h2 className="anim-clip text-white text-[52px] font-normal" style={{ marginTop: '74px', animationDelay: '.85s', fontFamily: "'Poppins',sans-serif" }}>Вопросы</h2>
                            <Divider delay={.95} style={{ marginTop: '72px', marginBottom: '40px' }} />
                            <div className="flex flex-wrap gap-2">
                                {faqChips.map((c, i) => <Chip key={c} label={c} active={i === 0} delay={1 + i * .03} />)}
                            </div>
                            <div className="flex flex-col gap-6 mt-6">
                                <FaqGroup label="Где остановиться?" questions={["Где остановиться?"]} delay={1.15} />
                                <FaqGroup label="Офлайн-формат" questions={["Когда начинается мероприятие?", "Что включено в билет?"]} delay={1.22} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
            return (
                <div className="min-h-screen flex items-center justify-center py-16 px-4" style={{ background: '#433B73' }}>
                    <div className="phones-row">
                        <PhoneHome />
                        <PhoneSpeakers />
                        <PhoneFaqs />
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
