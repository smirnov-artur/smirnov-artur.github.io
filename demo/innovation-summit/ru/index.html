        html,body{ background:#433B73; }
        .phone-frame{ position:relative; width:calc(393px*var(--ps)); height:calc(873px*var(--ps)); border-radius:44px; overflow:hidden; background:#000; flex-shrink:0; }
        .phone-frame.bordered{ border:1px solid rgba(148,145,182,.28); }
        .phone-inner{ position:absolute; top:0; left:0; width:393px; height:873px; transform:scale(var(--ps)); transform-origin:top left; }

        .phones-row{ display:flex; gap:40px; justify-content:center; align-items:flex-start; }

        @keyframes riseIn{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:translateY(0); } }
        @keyframes blurIn{ from{ opacity:0; transform:translateY(26px) scale(.94); filter:blur(14px); letter-spacing:.06em; } to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); letter-spacing:-0.02em; } }
        @keyframes clipUp{ from{ clip-path:inset(100% 0 0 0); opacity:0; } to{ clip-path:inset(0 0 0 0); opacity:1; } }
        @keyframes lineGrow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
        @keyframes sheen{ from{ transform:translateX(-130%) skewX(-12deg); } to{ transform:translateX(230%) skewX(-12deg); } }

        .anim-rise{ opacity:0; animation:riseIn .8s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-blur{ opacity:0; animation:blurIn 1.1s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-clip{ animation:clipUp .9s cubic-bezier(.16,1,.3,1) forwards; }
        .anim-line{ transform:scaleX(0); transform-origin:left; animation:lineGrow .8s cubic-bezier(.16,1,.3,1) forwards; }
        .sheen-wrap{ position:relative; overflow:hidden; }
