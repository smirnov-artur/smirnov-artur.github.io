                                        </div>
                                    </motion.div>
                                ))}
                            </AnimatePresence>
                        </div>
                        <div className="flex items-center gap-3 mt-6">
                            <button onClick={() => go(-1)} aria-label="Назад" className="w-9 h-9 rounded-full border-2 border-[#dde3dd] flex items-center justify-center hover:bg-[#eef1ed] transition-colors">
                                <i data-lucide="chevron-left" style={{ width: 16, height: 16 }}></i>
                            </button>
                            <button onClick={() => go(1)} aria-label="Вперёд" className="w-9 h-9 rounded-full border-2 border-[#dde3dd] flex items-center justify-center hover:bg-[#eef1ed] transition-colors">
                                <i data-lucide="chevron-right" style={{ width: 16, height: 16 }}></i>
                            </button>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [active, setActive] = useState('home');

            useEffect(() => {
                lucide.createIcons();
                const els = NAV.map(n => document.getElementById(n.id)).filter(Boolean);
                const obs = new IntersectionObserver(entries => {
                    entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
                }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
                els.forEach(el => obs.observe(el));
                return () => obs.disconnect();
            }, []);

            return (
                <div className="min-h-screen bg-[#fefffc]">
                    <Sidebar active={active} />
                    <Navbar />
                    <main className="lg:ml-[240px]">
                        <Hero />
                        <VideoSection />
                        <FeaturesGrid />
                        <CardsCarousel />
                        <footer className="px-6 py-10 border-t border-[#e8e8e8] text-center text-xs text-[#b4b8b4]">
                            © 2026 g.a.d.
                        </footer>
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
