<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background-color:#050505;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:60px 60px;
  background-position:top center;
  color:#fff;
  overflow-x:hidden;
}

/* ---- reveal-on-scroll (used around every band; the two exact components below keep only their own spec'd transitions) ---- */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}

/* ---- nav ---- */
.hub-nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(5,5,5,.55);border-bottom:1px solid rgba(255,255,255,.08)}
.hub-link{color:rgba(255,255,255,.65);font-size:14px;font-weight:500;transition:color .2s}
.hub-link:hover{color:#fff}
.hub-cta{background:#fff;color:#08063C;font-weight:700;font-size:13.5px;padding:10px 20px;border-radius:999px;display:inline-block;transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s}
.hub-cta:hover{transform:translateY(-2px);background:#e9d551}

/* ---- hero ---- */
.hero-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(560px circle at var(--mx,50%) var(--my,28%),rgba(80,150,255,.16),transparent 62%)}
.hero-pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.7);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 14px}
.hero-dot{width:6px;height:6px;border-radius:50%;background:#38D26B;box-shadow:0 0 8px #38D26B}
.hero-secondary{color:rgba(255,255,255,.7);font-size:14px;font-weight:600;transition:color .2s,gap .25s;display:inline-flex;align-items:center;gap:6px}
.hero-secondary:hover{color:#fff;gap:10px}
.hero-stats{color:rgba(255,255,255,.4);font-size:13px;font-weight:500}

/* ================= FEATURES (verbatim from prompts/keep-ahead-features.md) ================= */
.features-band{background-color:#050505}
.features-section{padding:0 0 48px}
.features-wrapper{max-width:1100px;margin:0 auto;padding:60px 48px 40px;position:relative;overflow:hidden}
.features-header{margin-bottom:40px;position:relative;z-index:1}
.features-header h2{font-size:34px;font-weight:700;color:#ffffff;margin-bottom:12px;line-height:1.2;letter-spacing:-0.01em}
.features-header p{font-size:15px;color:rgba(255,255,255,.55);line-height:1.6;max-width:380px;margin-bottom:16px}
.features-subline{font-size:14px;color:rgba(255,255,255,.35);font-weight:500;display:inline-block}
.features-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px;position:relative;z-index:1}
.feat-card{position:relative;min-height:320px;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.feat-card:hover{transform:translateY(-4px)}
.feat-card-main{position:relative;z-index:1;flex:1;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;min-height:290px;overflow:hidden;box-shadow:inset 0 -4px 15px -2px rgba(255,255,255,.9);border:none}
.feat-card-main::before,.feat-card-main::after{display:none}
.feat-card.orange .feat-card-main{background:radial-gradient(circle at 10% 10%,#d9511b50 0%,transparent 40%),linear-gradient(180deg,#180D0B 0%,#180D0B 40%,#CF451E 80%,#e9d551 96%,#FFFFFF 100%)}
.feat-card.blue .feat-card-main{background:radial-gradient(circle at 10% 10%,rgba(80,150,255,.30) 0%,transparent 40%),linear-gradient(180deg,#0B0F17 0%,#0B0F17 40%,#4663BF 80%,#a1ccf7 96%,#FFFFFF 100%)}
.feat-card.green .feat-card-main{background:radial-gradient(circle at 10% 10%,rgba(50,200,110,.30) 0%,transparent 40%),linear-gradient(180deg,#0B0B12 0%,#0B0B12 40%,#38D26B 80%,#aaf8cd 96%,#FFFFFF 100%)}
.feat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:6px;position:relative;z-index:2;overflow:hidden}
.feat-icon::before{content:'';position:absolute;top:-10px;left:-10px;width:32px;height:32px;border-radius:50%;pointer-events:none;z-index:0;opacity:.65}
.feat-card.orange .feat-icon{background:linear-gradient(145deg,rgba(40,28,18,.9) 0%,rgba(14,12,10,.98) 100%);border:1px solid rgba(232,120,40,.22);box-shadow:0 0 12px rgba(232,76,10,.12),inset 0 1px 0 rgba(255,200,150,.08)}
.feat-card.orange .feat-icon::before{background:radial-gradient(circle,rgba(255,100,20,.55) 0%,transparent 70%)}
.feat-card.blue .feat-icon{background:linear-gradient(145deg,rgba(20,25,45,.9) 0%,rgba(10,12,16,.98) 100%);border:1px solid rgba(80,130,255,.22);box-shadow:0 0 12px rgba(42,106,238,.12),inset 0 1px 0 rgba(180,210,255,.08)}
.feat-card.blue .feat-icon::before{background:radial-gradient(circle,rgba(60,120,255,.55) 0%,transparent 70%)}
.feat-card.green .feat-icon{background:linear-gradient(145deg,rgba(18,35,25,.9) 0%,rgba(10,14,12,.98) 100%);border:1px solid rgba(50,200,110,.22);box-shadow:0 0 12px rgba(18,192,104,.12),inset 0 1px 0 rgba(180,255,220,.08)}
.feat-card.green .feat-icon::before{background:radial-gradient(circle,rgba(40,220,120,.55) 0%,transparent 70%)}
.feat-icon svg{width:20px;height:20px;fill:none;stroke:rgba(255,255,255,.88);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.feat-body{flex:1;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.feat-title{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;color:#fff;line-height:1.3}
.feat-desc{font-size:14px;color:rgba(255,255,255,.50);line-height:1.65}
.feat-link{font-size:13.5px;font-weight:700;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-top:4px;transition:gap .25s cubic-bezier(.22,1,.36,1),opacity .2s}
.feat-link:hover{gap:10px;opacity:.85}
.features-tags{display:flex;flex-direction:row;gap:32px;align-items:center;justify-content:flex-start;padding-top:10px;position:relative;z-index:1}
.feat-tag{display:flex;gap:8px;align-items:center;font-size:13px;color:rgba(255,255,255,.45);font-weight:600}
.feat-tag svg{width:16px;height:16px;fill:rgba(255,255,255,.6);stroke:none}
@media (max-width:900px){
  .features-cards{grid-template-columns:1fr}
  .features-wrapper{padding:48px 28px 32px}

@media (max-width:560px){
  .features-header h2{font-size:28px}
  .features-tags{flex-wrap:wrap;gap:16px}

.community-band{background:#f0f2f7;color:#1e2240;padding:96px 0}
.cta-section{width:100%;padding:0 32px 48px}
.cta-wrapper{position:relative;border-radius:28px;overflow:hidden;border:1px solid rgba(13,36,72,.15);background:#d8e5f2;min-height:220px;max-width:1150px;margin:0 auto}

.cta-content p{font-size:13.5px;font-weight:400;color:#08063C;line-height:1.65;margin-bottom:28px;max-width:400px}
.cta-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:80%}
.cta-form input{flex:1;min-width:200px;padding:13px 22px;border-radius:50px;border:1px solid rgba(195,210,235,.75);background:rgba(255,255,255,.96);font-family:'DM Sans',sans-serif;font-size:13px;color:#08063C;outline:none;box-shadow:0 1px 5px rgba(100,110,180,.07);transition:box-shadow .2s,border-color .2s}

  .cta-content h2{font-size:19px}

  .cta-form{flex-direction:column;gap:8px;max-width:100%}
  .cta-form input,.cta-form button{width:100%;text-align:center}
  .cta-members{flex-wrap:wrap;gap:8px}
  .cta-avatars span{width:28px;height:28px;margin-left:-7px}

/* ---- footer ---- */
.hub-footer{background:#050505;border-top:1px solid rgba(255,255,255,.08)}
.footer-link{color:rgba(255,255,255,.55);font-size:13.5px;transition:color .2s}

.social-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);transition:color .2s,border-color .2s,transform .2s}

// ---- reveal-on-scroll wrapper ----
function Reveal({ children, className = '', delay = 0, as = 'div' }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const Tag = as;
  return <Tag ref={ref} className={`reveal ${inView ? 'in' : ''} ${className}`} style={{ transitionDelay: delay + 'ms' }}>{children}</Tag>;
}

function ArrowRight({ className }) {
  return (

}
