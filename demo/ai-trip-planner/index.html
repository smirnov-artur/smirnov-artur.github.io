<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — Where will you go next?</title>
<!-- Один файл вместо React + Vite + Tailwind + lucide-react. ?lang=ru — русская версия.
     Словесный знак из промпта (Special Elite) заменён логотипом g.a.d., поэтому Special Elite не грузим.
     Видео по ссылке из промпта — HEVC 4K на 17 МБ с индексом в конце файла, а сервер не отдаёт кусками: до начала показа
     браузер качает все 17 МБ, а Firefox HEVC не играет вовсе. Пережато в H.264 1920 px (1,4 МБ) и лежит рядом как v.mp4.
     На телефоне текст запроса в стеклянной карточке идёт потоком над кнопками: в исходнике он центрирован по линии 57 px
     и в четыре строки вылезает за верхний край карточки. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Geist',sans-serif;overflow-x:hidden;background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;margin:0}
h1,p{margin:0}

.hero-sec{position:relative;min-height:100vh;min-height:100svh;width:100%;overflow:hidden}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.fade{position:absolute;left:0;right:0;top:0;height:687px;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 100%)}
.wrap{position:relative;z-index:2;max-width:1360px;margin:0 auto}

/* навигация */
.nav{position:relative;display:flex;align-items:center;justify-content:space-between;padding:24px 80px 16px}
.logo{display:block;color:#000;line-height:0;user-select:none}
.logo svg{display:block;height:30px;width:auto;overflow:visible}
.logo svg text{font-family:'Unbounded',sans-serif}
.logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.links{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:32px}
.txt-btn{background:transparent;border:none;cursor:pointer;padding:0;font-family:'Geist',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.04em;transition:opacity .15s}
.txt-btn:hover{opacity:.55}
.links .txt-btn{font-weight:500;color:#1a1a1a}
.right{display:flex;align-items:center;gap:32px}
.login{font-weight:600;color:#292929}
.plan{background:#0a0a0a;color:#fafafa;border:none;cursor:pointer;font-family:'Geist',sans-serif;font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;padding:14px 20px;border-radius:9999px;white-space:nowrap;transition:all .15s}
.plan:hover{background:#333}
.plan:active{transform:scale(.95)}

/* первый экран */
.body{display:flex;flex-direction:column;align-items:center;padding:64px 24px 96px;text-align:center}
h1{font-family:'Geist',sans-serif;font-size:clamp(40px,6vw,68px);font-weight:500;color:#1a1a1a;line-height:1.05;letter-spacing:-.04em;max-width:820px;margin-bottom:20px}
.sub{font-size:20px;font-weight:500;color:#767676;line-height:1.625;max-width:500px;margin-bottom:40px}

/* стеклянная карточка */
.card{position:relative;width:701px;min-height:208px;background:rgba(255,255,255,.06);border:3px solid #fff;border-radius:44px;box-shadow:0 0 4px 0 rgba(0,0,0,.15);overflow:hidden;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);text-align:left}
.prompt{position:absolute;left:29px;top:57px;transform:translateY(-50%);width:609px;font-size:20px;font-weight:500;color:#905831;line-height:1.625;overflow-wrap:break-word}
.go{position:absolute;bottom:21px;right:21px;width:156px;height:56px;background:#000;border:none;border-radius:44px;box-shadow:0 0 2px 0 rgba(0,0,0,.05);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:'Geist',sans-serif;font-size:16px;font-weight:500;color:#fafafa;text-transform:uppercase;letter-spacing:.02em;transition:all .15s}
.go:hover{background:#333}
.go:active{transform:scale(.95)}
.upload{position:absolute;left:21px;top:137px;width:44px;height:44px;background:transparent;border:1px solid rgba(255,255,255,.7);border-radius:9999px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .15s}
.upload:hover{transform:scale(1.05)}
.upload:focus-visible{outline:2px solid #fff;outline-offset:2px}
.upload svg{width:18px;height:18px;flex-shrink:0;color:#1a1a1a;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none}

@media (max-width:767.98px){
  .nav{padding:20px 24px 16px}
  .logo svg{height:24px}
  .links,.login{display:none}
  .plan{font-size:14px;padding:12px 18px}
  .card{width:calc(100vw - 48px);padding:22px 26px 92px}
  .prompt{position:static;transform:none;width:auto;font-size:17px}
  .upload{top:auto;bottom:27px}
}
@media (prefers-reduced-motion:reduce){.logo .ring{animation:none;stroke-dashoffset:0}.logo .orb{animation:none;opacity:1}}
</style>
</head>
<body>
<div>
  <section class="hero-sec">
    <video class="bg-video" autoplay muted loop playsinline src="v.mp4"></video>
    <div class="fade"></div>
    <div class="wrap">
      <nav class="nav">
        <a class="logo" href="#" aria-label="g.a.d.">
          <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
            <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
            <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
            <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
          </svg>
        </a>
        <div class="links">
          <button class="txt-btn" type="button" data-t="n1">Discover</button>
          <button class="txt-btn" type="button" data-t="n2">Pricing</button>
          <button class="txt-btn" type="button" data-t="n3">FAQs</button>
        </div>
        <div class="right">
          <button class="txt-btn login" type="button" data-t="login">Login</button>
          <button class="plan" type="button" data-t="plan">Plan My Trip</button>
        </div>
      </nav>
      <div class="body">
        <h1 data-t="h1">Where will you go next?</h1>
        <p class="sub" data-t="sub">Tell our AI where you're going and what you love. We'll create a personalized itinerary for you.</p>
        <div class="card">
          <p class="prompt" data-t="prompt">I'm planning a 7-day trip to Japan in October. I love food, hidden cafes, scenic hikes, and want to avoid crowds....</p>
          <button class="go" type="button" data-t="go">Plan My Trip</button>
          <input class="hidden" id="file" type="file" accept="image/*,.pdf">
          <button class="upload" id="upload" type="button" aria-label="Upload inspiration">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
(() => {
if (new URLSearchParams(location.search).get('lang') === 'ru') {
  const TR = { n1: 'Идеи', n2: 'Цены', n3: 'Вопросы', login: 'Войти', plan: 'Спланировать поездку',
    h1: 'Куда поедем дальше?',
    sub: 'Расскажите нашему ИИ, куда собираетесь и что любите, — он соберёт маршрут под вас.',
    prompt: 'Планирую 7 дней в Японии в октябре. Люблю еду, тайные кафе и красивые тропы, а толп хочу избежать....',
    go: 'Поехали' };
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — Куда поедем дальше?';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.textContent = t; });
  document.getElementById('upload').setAttribute('aria-label', 'Загрузить вдохновение');
}
const file = document.getElementById('file');
document.getElementById('upload').addEventListener('click', () => file.click());
})();
</script>
</body>
</html>
