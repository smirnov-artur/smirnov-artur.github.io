<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Дневник путешествий</title>
    <meta name="description" content="Мокап приложения-дневника путешествий в рамке iPhone: карточки Токио, Сеула, Бали и Рима из жидкого стекла проявляются одна за другой.">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .liquid-glass {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ children, size = 20, className = '' }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const ChevronDown = (p) => <Icon {...p}><path d="m6 9 6 6 6-6" /></Icon>;
        const CalendarIcon = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="4" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></Icon>;
        const MoreHorizontal = (p) => <Icon {...p}><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></Icon>;
        const HomeIcon = (p) => <Icon {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></Icon>;
        const UserIcon = (p) => <Icon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></Icon>;
        const FileTextIcon = (p) => <Icon {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></Icon>;

        const PHONE_SHADOW = 'inset 0 0 0 2px rgba(255,255,255,0.08), 0 0 0 1px rgba(0,0,0,0.6), 0 0 0 10px #1a1a1e, 0 0 0 11px rgba(255,255,255,0.06), 0 0 60px rgba(0,0,0,0.5)';

        const CARDS = [
            { name: 'Токио', moments: '23 момента', img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_101902_e8f0f37b-18b7-4c14-bb5c-99f0724d2646.png&w=1280&q=85' },
            { name: 'Сеул', moments: '18 моментов', img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_101935_4b17f250-8ddb-4ff2-b63d-dfd3497d4428.png&w=1280&q=85' },
            { name: 'Бали', moments: '29 моментов', img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_101958_7116d6bf-fd6f-496f-b3cf-007688cd5123.png&w=1280&q=85' },
            { name: 'Рим', moments: '15 моментов', img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_143008_72ee7299-04a8-474c-ae73-220d45b24a20.png&w=1280&q=85' },
        ];

        const App = () => {
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const t = setTimeout(() => setVisible(true), 0);
                return () => clearTimeout(t);
            }, []);

            return (
                <div className="h-screen w-screen bg-white flex items-center justify-center overflow-hidden">
                    <div className="relative w-[375px] h-[780px] bg-[#0a0a0c] rounded-[52px] overflow-hidden" style={{ boxShadow: PHONE_SHADOW }}>
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[120px] h-[28px] bg-black rounded-b-2xl z-50" />

                        <header className="absolute top-0 inset-x-0 z-30 px-6 pt-14 pb-4 flex items-center justify-between" style={{ backdropFilter: 'blur(12px)', backgroundColor: 'rgba(10,10,12,0.75)' }}>
                            <button type="button" className="flex items-center gap-1 text-white">
                                <span className="text-lg font-semibold">Азия</span>
                                <ChevronDown size={18} className="text-white/70" />
                            </button>
                            <button type="button" className="text-white/70" aria-label="Календарь">
                                <CalendarIcon size={22} />
                            </button>
                        </header>

                        <div className="absolute inset-0 overflow-y-auto scrollbar-hide px-6 pt-28 pb-24 space-y-4">
                            {CARDS.map((c, i) => (
                                <div
                                    key={c.name}
                                    className={`relative w-full h-[200px] rounded-2xl overflow-hidden transition-all duration-700 ease-out ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`}
                                    style={{ transitionDelay: `${150 + i * 120}ms` }}
                                >
                                    <img src={c.img} alt={c.name} className="absolute inset-0 w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent" />
                                    <div className="absolute top-3 left-3 liquid-glass rounded-full px-3 py-1">
                                        <span className="text-white/90 text-xs font-normal">{c.moments}</span>
                                    </div>
                                    <button type="button" aria-label="Ещё" className="absolute top-3 right-3 liquid-glass w-8 h-8 rounded-full flex items-center justify-center">
                                        <MoreHorizontal size={16} className="text-white/80" />
                                    </button>
                                    <div className="absolute inset-x-0 bottom-0 h-20 overflow-hidden text-center">
                                        <span className="inline-block font-black tracking-tight leading-none text-8xl" style={{ color: 'rgba(255,255,255,0.55)', marginTop: '2px' }}>{c.name}</span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <nav className="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 liquid-glass rounded-full flex gap-6 px-6 py-2">
                            <button type="button" className="flex flex-col items-center gap-0.5 text-white/50">
                                <HomeIcon size={20} />
                                <span className="text-[10px] font-medium">Лента</span>
                            </button>
                            <button type="button" className="flex flex-col items-center gap-0.5 text-white/50">
                                <UserIcon size={20} />
                                <span className="text-[10px] font-medium">Профиль</span>
                            </button>
                            <button type="button" className="flex flex-col items-center gap-0.5 text-white">
                                <FileTextIcon size={20} />
                                <span className="text-[10px] font-medium">Поездки</span>
                            </button>
                        </nav>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
