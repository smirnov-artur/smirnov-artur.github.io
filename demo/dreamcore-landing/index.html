<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>g.a.d. — Step Into Wonder</title>
<meta name="description" content="Scroll through a crystal portal into a dreamlike world — parallax layers, an opening curtain gate and an arcing card slider.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Imprima&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config = { theme: { extend: { screens: { xl: '1100px' } } } };</script>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  html,body{background:#0a0608;margin:0}
  body{font-family:'Imprima',sans-serif}
  @keyframes bobUp{50%{transform:translateY(-6px)}}
  .gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}
  .gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
  .gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
  @keyframes gad-draw{to{stroke-dashoffset:0}}
  @keyframes gad-pop{to{opacity:1}}
  @keyframes gad-orbit{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}
</style>

<body class="antialiased overflow-x-hidden">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// original Cloudinary art (dy5er7kv5) answers 401 now (auth-gated) — replaced with close-mood free stock (Pexels), same roles.
// The cave mouth is ONE real photo (not a mirrored/tiled texture) — a rock overhang framing a bright sea+sky view, which is
// exactly "inside a cave looking out". A radial mask carves a soft see-through opening (roughly matching this photo's own
// bright opening) so the fantasy portal/world layers beneath show through, and the whole layer scales up + fades on scroll
// so it reads as flying through the opening.
const PORTAL_BG     = "https://images.pexels.com/photos/20257729/pexels-photo-20257729.jpeg?auto=compress&cs=tinysrgb&w=1600";
const CAVE_IMG      = "https://images.pexels.com/photos/20320071/pexels-photo-20320071.jpeg?auto=compress&cs=tinysrgb&w=1920";
const WORLD_BG       = "https://images.pexels.com/photos/1069480/pexels-photo-1069480.jpeg?auto=compress&cs=tinysrgb&w=1920";
const BOTTOM_CLOUDS  = "https://images.pexels.com/photos/479820/pexels-photo-479820.jpeg?auto=compress&cs=tinysrgb&w=1600";
const CAVE_MASK = 'radial-gradient(ellipse 62% 58% at 60% 66%, transparent 0%, transparent 46%, black 74%)';
const CLOUD_MASK = 'linear-gradient(to bottom, transparent 0%, black 25%)';
const CARD_IMAGES = [
  "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260525_160507_2ccbb4eb-1469-484f-af25-59168ad9a233.png&w=1280&q=85",
  "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260525_160644_072a7f68-a101-4ded-a332-7d37707dbdd1.png&w=1280&q=85",
  "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260525_160706_1c153d04-0dfb-4ac9-a4ef-e74f301c329c.png&w=1280&q=85",
];

const CARDS = [
  { title: 'Hidden Realms',  desc: 'Luminous sanctuaries unseen by wandering eyes',  color: '#f3cdd6' },
  { title: 'Wild Solitudes', desc: 'Dissolve into untamed horizons and deep calm',   color: '#dcedc2' },
  { title: 'Silent Havens',  desc: 'Remote escapes far beyond ordinary reach',       color: '#c3e3f4' },
  { title: 'Bespoke Quests', desc: 'Journeys shaped around your vision and soul',    color: '#f0e4c0' },
  { title: 'Vivid Drifts',   desc: 'Surreal passages through breathtaking terrain',  color: '#dcd2f2' },
  { title: 'Mystic Crests',  desc: 'Timeless ridgelines wrapped in cloud and myth',  color: '#f3cdd6' },
  { title: 'Deep Currents',  desc: 'Glowing depths alive with uncharted wonder',     color: '#c3e3f4' },
  { title: 'Gilded Dusk',    desc: 'Amber horizons that stretch past all reason',    color: '#f0e4c0' },
  { title: 'Glassy Tides',   desc: 'Calm waters holding skies of pure stillness',    color: '#dcedc2' },
];

const GAD_LOGO_SVG = '<svg class="gad-logo" viewBox="0 0 355 110" role="img" aria-label="g.a.d."><path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/><circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>';

const GadLogo = ({ height }) => (
  <span style={{ display: 'inline-block', color: '#fff', fontSize: height, lineHeight: 0 }}
        dangerouslySetInnerHTML={{ __html: GAD_LOGO_SVG }} />
);

const easeInOut = t => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function useIsMobile() {
  const [m, setM] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 767px)');
    const upd = () => setM(mq.matches);
    upd();
    mq.addEventListener('change', upd);
    return () => mq.removeEventListener('change', upd);
  }, []);
  return m;
}

const PlayGlyph = ({ size }) => (
  <div style={{ width: size, height: size, borderRadius: '50%', background: 'rgba(255,255,255,0.92)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
    <svg width={size * 0.34} height={size * 0.34} viewBox="0 0 24 24" fill="#2a1810"><path d="M6 4l14 8-14 8V4z" /></svg>
  </div>
);

const ScrollChevron = () => (
  <div style={{ width: 34, height: 34, borderRadius: '50%', border: '1.5px solid rgba(255,255,255,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'bobUp 1.8s ease-in-out infinite' }}>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6" /></svg>
  </div>
);

function ImgCard({ img, w, h, radius, children }) {
  return (
    <div style={{ position: 'relative', width: w, height: h, borderRadius: radius, overflow: 'hidden', boxShadow: '0 8px 32px rgba(0,0,0,0.45)', flexShrink: 0 }}>
      <img src={img} alt="" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: '60%', background: 'linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.15) 55%, transparent 100%)' }} />
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: '44%', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)', maskImage: 'linear-gradient(to top, black 0%, transparent 100%)', WebkitMaskImage: 'linear-gradient(to top, black 0%, transparent 100%)' }} />
      {children}
    </div>
  );
}

function ArcCardSlider({ cards, isMobile, cardRefs }) {
  const cardSpacingDeg = isMobile ? 12 : 9;
  const centerIndex = Math.floor(cards.length / 2);
  const cardW = isMobile ? 160 : 220;
  const cardH = isMobile ? 175 : 230;
  const radius = isMobile ? 22 : 28;
  return (
    <div style={{ position: 'relative', width: '100%', height: isMobile ? 260 : 360 }}>
      {cards.map((c, i) => (
        <div key={i} ref={el => (cardRefs.current[i] = el)}
          style={{ position: 'absolute', width: cardW, height: cardH, borderRadius: radius, background: c.color, boxShadow: '0 8px 40px rgba(80,40,60,0.18)', padding: isMobile ? 14 : 18, boxSizing: 'border-box' }}>
          <div style={{ position: 'absolute', top: isMobile ? 12 : 16, right: isMobile ? 12 : 16, width: 24, height: 24, borderRadius: '50%', border: '1.5px solid rgba(80,50,60,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, color: 'rgba(80,50,60,0.6)' }}>
            {String(i + 1).padStart(2, '0')}
          </div>
          <div style={{ position: 'absolute', left: isMobile ? 14 : 18, right: isMobile ? 14 : 18, bottom: isMobile ? 14 : 18 }}>
            <div style={{ fontFamily: "'Viaoda Libre',serif", fontSize: isMobile ? 22 : 30, color: '#3a2530', lineHeight: 1.05 }}>{c.title}</div>
            <div style={{ fontSize: isMobile ? 12 : 15, color: 'rgba(58,37,48,0.65)', marginTop: 4 }}>{c.desc}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

const NAV_LINK = { fontFamily: "'Imprima',sans-serif", fontSize: 12, letterSpacing: '0.12em', textTransform: 'uppercase', color: '#fff', opacity: 0.9, textDecoration: 'none' };

const App = () => {
  const isMobile = useIsMobile();
  const isMobileRef = useRef(isMobile);
  useEffect(() => { isMobileRef.current = isMobile; }, [isMobile]);

  const worldRef = useRef(null), cloudsRef = useRef(null), portalRef = useRef(null);
  const caveRef = useRef(null);
  const scene1Ref = useRef(null), scene2Ref = useRef(null), sliderWrapRef = useRef(null);
  const cardRefs = useRef([]);

  const [uiVisible, setUiVisible] = useState(false);

  useEffect(() => {
    const t2 = setTimeout(() => setUiVisible(true), 600);
    return () => clearTimeout(t2);
  }, []);

  const layoutCards = useCallback((rotationOffset) => {
    const mobile = isMobileRef.current;
    const total = CARDS.length;
    const spacing = mobile ? 12 : 9;
    const centerIndex = Math.floor(total / 2);
    const radius = mobile ? 700 : 1100;
    const cardW = mobile ? 160 : 220;
    const yOffset = mobile ? 140 : 200;
    for (let i = 0; i < total; i++) {
      const el = cardRefs.current[i];
      if (!el) continue;
      const baseDeg = (i - centerIndex) * spacing;
      const deg = baseDeg - rotationOffset + centerIndex * spacing;
      const rad = deg * Math.PI / 180;
      const x = Math.sin(rad) * radius;
      const y = radius - Math.cos(rad) * radius;
      el.style.bottom = (-y + yOffset) + 'px';
      el.style.left = `calc(50% + ${x - cardW / 2}px)`;
      el.style.transform = `rotate(${deg}deg)`;
      el.style.transformOrigin = `${cardW / 2}px ${radius}px`;
    }
  }, []);

  useEffect(() => {
    const mouseRaw = { x: 0, y: 0 };
    const mouseSmooth = { x: 0, y: 0 };
    const onMove = e => {
      mouseRaw.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseRaw.y = (e.clientY / window.innerHeight - 0.5) * 2;
    };
    window.addEventListener('mousemove', onMove);

    let raf;
    const tick = () => {
      mouseSmooth.x = lerp(mouseSmooth.x, mouseRaw.x, 0.07);
      mouseSmooth.y = lerp(mouseSmooth.y, mouseRaw.y, 0.07);
      const mx = mouseSmooth.x, my = mouseSmooth.y;

      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const progress = clamp(window.scrollY / maxScroll, 0, 1);
      const ep = easeInOut(progress);

      if (worldRef.current) worldRef.current.style.transform = `translate(${-mx * 6}px,${-my * 6}px) scale(${lerp(1, 1.18, ep)})`;

      if (cloudsRef.current) {
        cloudsRef.current.style.transform = `translate(${-mx * 9}px,${-my * 9 * 0.4}px) scale(${lerp(1, 1.4, ep)})`;
        cloudsRef.current.style.opacity = String(lerp(0.7, 1, clamp(progress / 0.05, 0, 1)));
      }

      if (portalRef.current) {
        portalRef.current.style.transform = `translate(${-mx * 7}px,${-my * 7}px) scale(${lerp(1, 7.5, ep)})`;
        portalRef.current.style.opacity = String(1 - clamp((progress - 0.65) / 0.2, 0, 1));
      }

      if (caveRef.current) {
        caveRef.current.style.transform = `translate(${-mx * 12}px,${-my * 12 * 0.4}px) scale(${lerp(1, 1.7, ep)})`;
        caveRef.current.style.opacity = String(1 - clamp((progress - 0.28) / 0.3, 0, 1));
      }

      if (scene1Ref.current) scene1Ref.current.style.opacity = String(clamp(1 - progress / 0.22, 0, 1));
      const scene2Opacity = clamp((progress - 0.68) / 0.16, 0, 1);
      if (scene2Ref.current) scene2Ref.current.style.opacity = String(scene2Opacity);
      if (sliderWrapRef.current) sliderWrapRef.current.style.opacity = String(scene2Opacity);

      const arcSweepDeg = (CARDS.length - 1) * 10;
      const rotationOffset = lerp(0, arcSweepDeg, clamp((progress - 0.70) / 0.30, 0, 1));
      layoutCards(rotationOffset);

      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', onMove); };
  }, [layoutCards]);

  const fadeStyle = (delay, extraTransform) => ({
    opacity: uiVisible ? 1 : 0,
    transform: uiVisible ? 'none' : (extraTransform || 'translateY(20px)'),
    transition: `opacity 0.9s ease ${delay}s, transform 0.9s ease ${delay}s`,
  });

  return (
    <div style={{ height: '480vh', position: 'relative' }}>
      <div style={{ position: 'sticky', top: 0, height: '100vh', overflow: 'hidden', background: '#0a0608' }}>

        <div ref={worldRef} style={{ position: 'absolute', inset: 0, transformOrigin: '50% 50%', willChange: 'transform' }}>
          <img src={WORLD_BG} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
        </div>

        <div ref={cloudsRef} style={{ position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 10, transformOrigin: '50% 100%', willChange: 'transform,opacity' }}>
          <img src={BOTTOM_CLOUDS} alt="" style={{ width: '100%', height: '46vh', objectFit: 'cover', display: 'block', maskImage: CLOUD_MASK, WebkitMaskImage: CLOUD_MASK }} />
        </div>

        <div ref={sliderWrapRef} style={{ position: 'absolute', left: 0, right: 0, bottom: isMobile ? 60 : 80, zIndex: 11 }}>
          <ArcCardSlider cards={CARDS} isMobile={isMobile} cardRefs={cardRefs} />
        </div>

        <div ref={portalRef} style={{ position: 'absolute', inset: 0, zIndex: 15, transformOrigin: '52% 38%', willChange: 'transform,opacity' }}>
          <img src={PORTAL_BG} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
        </div>

        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: '40%', zIndex: 16, background: 'linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 100%)', pointerEvents: 'none' }} />

        <div ref={caveRef} style={{ position: 'absolute', inset: 0, zIndex: 16, transformOrigin: '50% 50%', willChange: 'transform,opacity' }}>
          <img src={CAVE_IMG} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', maskImage: CAVE_MASK, WebkitMaskImage: CAVE_MASK }} />
        </div>

        <div style={{ position: 'absolute', left: 0, right: 0, top: 0, height: '42vh', zIndex: 45, background: 'linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 100%)', pointerEvents: 'none' }} />

        {/* Nav */}
        <div className="flex md:hidden" style={{ position: 'absolute', left: 0, right: 0, top: 0, zIndex: 50, padding: '18px 20px', alignItems: 'center', justifyContent: 'space-between' }}>
          <a href="#" style={{ ...NAV_LINK, fontSize: 11 }}>Explore</a>
          <GadLogo height={16} />
          <a href="#" style={{ ...NAV_LINK, fontSize: 11 }}>Connect</a>
        </div>
        <div className="hidden md:flex" style={{ position: 'absolute', left: 0, right: 0, top: 0, zIndex: 50, padding: '22px 48px', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', gap: 36 }}>
            {['Worlds', 'Atelier', 'Immersions'].map(l => <a key={l} href="#" style={NAV_LINK}>{l}</a>)}
          </div>
          <GadLogo height={20} />
          <div style={{ display: 'flex', gap: 36 }}>
            {['Craft', 'Codex', 'Connect'].map(l => <a key={l} href="#" style={NAV_LINK}>{l}</a>)}
          </div>
        </div>

        {/* Scene 1 UI */}
        <div ref={scene1Ref} style={{ position: 'absolute', inset: 0, zIndex: 20 }}>
          {/* Mobile */}
          <div className="flex md:hidden" style={{ flexDirection: 'column', alignItems: 'center', textAlign: 'center', padding: '80px 24px 100px', height: '100%', justifyContent: 'flex-end', boxSizing: 'border-box' }}>
            <div style={fadeStyle(0.3)}>
              <div style={{ fontFamily: "'Viaoda Libre',serif", fontSize: 'clamp(26px,7vw,42px)', letterSpacing: '0.06em', color: '#fff', textShadow: '0 2px 20px rgba(0,0,0,0.7), 0 1px 4px rgba(0,0,0,0.9)' }}>
                FALL <span style={{ color: 'rgba(255,220,180,0.7)', fontSize: '0.8em' }}>›</span> <i>INTO</i>
              </div>
              <div style={{ fontFamily: "'Viaoda Libre',serif", fontSize: 'clamp(52px,16vw,80px)', letterSpacing: '-0.02em', lineHeight: 1, color: '#fff', textShadow: '0 2px 20px rgba(0,0,0,0.7), 0 1px 4px rgba(0,0,0,0.9)' }}>REVERIE</div>
              <p style={{ fontSize: 15, lineHeight: 1.6, color: 'rgba(255,245,235,0.9)', textShadow: '0 1px 10px rgba(0,0,0,0.8)', maxWidth: 280, margin: '16px auto 0' }}>
                Crafting boundless digital worlds where the edge between AI, vision, and living myth dissolves.
              </p>
            </div>
            <div style={{ ...fadeStyle(0.55), marginTop: 24 }}>
              <ImgCard img={CARD_IMAGES[0]} w={140} h={140} radius={22}>
