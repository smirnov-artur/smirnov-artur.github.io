            { title: 'Aether Heights', price: '$345,000', location: 'USA/California/Malibu', area: '300 m²', floors: '1 floor', beds: '6 beds', baths: '2 baths',
              img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260503_145701_de344c15-5eac-4c64-8bd6-19a2811bba4a.png&w=1280&q=85' },
            { title: 'Azure Sanctuary', price: '$225,000', location: 'Caribbean/Bahamas/Bimini', area: '250 m²', floors: '1 floor', beds: '4 beds', baths: '1 bath',

            { title: 'Aggregate yield profit', value: '$820,000', data: [8, 12, 18, 28, 32, 38, 55, 70, 85] },
            { title: 'Median returns', value: '14%', data: [10, 75, 20, 35, 30, 65, 55, 25, 40] },
        ];

            const max = Math.max(...data);
            return (
                <div className="h-24 flex items-end gap-1">
                    {data.map((v, i) => (
                        <div key={i} className="relative flex-1 h-full">
                            <div className="absolute inset-0 bg-[#141414]/5" />
                            <div className="absolute left-0 right-0 h-[2px] bg-[#141414]" style={{ bottom: (v / max * 88) + '%' }} />
                        </div>
                    ))}
                </div>
            );
        };

        const Stat = ({ icon, children }) => (
            <span className="flex items-center gap-1.5 text-[#141414] text-[11px] font-medium">
                <i data-lucide={icon} className="text-[#A5A5A5]" style={{ width: 13, height: 13, strokeWidth: 2.5 }}></i>{children}

                            {(l === 'Properties' || l === 'Careers') && <i data-lucide="chevron-down" style={{ width: 14, height: 14 }}></i>}

                    ))}
                </div>

                                </button>
                            </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">

                        <div className="flex flex-col gap-4 mt-16">
                            {HIW.map((l, i) => (
                                <button key={l} id={'hiw-' + i} className={"text-left text-[13px] font-medium transition-colors " + (l === 'Exclusive collection' ? 'text-[#141414]' : 'text-[#A5A5A5] hover:text-[#141414]')}>{l}</button>
                            ))}
                        </div>
                    </div>
                    <div className="md:col-span-8 aspect-video md:aspect-square">
                        <img className="w-full h-full object-cover"
                            src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260503_150112_2b0e700f-7af4-4459-b326-7d9e2f468daa.png&w=1280&q=85" alt="Exclusive collection" />
                    </div>
                </div>
            </section>
        );

        const Investment = () => (
            <section className="px-6 md:px-12 lg:px-16 py-20 md:py-28">
                <SectionHeader title="Trusted frameworks for secure growth"
                    subtext="Our holdings go beyond floor plans; they represent a vehicle for your wealth to thrive consistently."
                    subtext2="We meticulously vet the premier market offerings for our valued partners." />
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                    {CHARTS.map((c, i) => (
                        <div key={c.title} id={"chart-" + i} className="bg-white p-6 flex flex-col justify-between aspect-video md:aspect-[1.8/1]">

                                <p className="text-[#141414]/40 text-[12px] font-medium tracking-tight uppercase">{c.title}</p>
                                <p className="text-4xl font-medium text-[#141414] mt-2">{c.value}</p>
                            </div>
                            <MiniBars data={c.data} />
                        </div>
                    ))}
                </div>
            </section>
        );

        const App = () => {
            const [open, setOpen] = useState(false);
            useEffect(() => { lucide.createIcons(); }, [open]);
            return (
                <div className="font-sans">
                    <Hero open={open} setOpen={setOpen} />
                    <Properties />
                    <HowItWorks />
                    <Investment />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
