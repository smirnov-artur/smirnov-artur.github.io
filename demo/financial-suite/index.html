// cursor-lit spotlight: masks a second image over the base image, revealed in a soft radius that eases toward the pointer
function RevealLayer({ containerRef, image, z }) {
  const canvasRef = useRef(null);
  const imgRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let raw = { x: -9999, y: -9999 }, smooth = { x: -9999, y: -9999 };
    const resize = () => {
      const r = containerRef.current.getBoundingClientRect();
      canvas.width = Math.max(1, r.width); canvas.height = Math.max(1, r.height);
    };
    resize();
    window.addEventListener('resize', resize);
    const onMove = e => {
      const r = containerRef.current.getBoundingClientRect();
      raw = { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    window.addEventListener('mousemove', onMove);
    let raf;
    const draw = () => {
      smooth.x += (raw.x - smooth.x) * 0.1;
      smooth.y += (raw.y - smooth.y) * 0.1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const g = ctx.createRadialGradient(smooth.x, smooth.y, 0, smooth.x, smooth.y, SPOTLIGHT_R);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.4, 'rgba(255,255,255,1)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.75)');
      g.addColorStop(0.75, 'rgba(255,255,255,0.4)');
      g.addColorStop(0.88, 'rgba(255,255,255,0.12)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(smooth.x, smooth.y, SPOTLIGHT_R, 0, Math.PI * 2); ctx.fill();
      if (imgRef.current) {
        const url = canvas.toDataURL();
        imgRef.current.style.maskImage = `url(${url})`;
        imgRef.current.style.webkitMaskImage = `url(${url})`;
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { window.removeEventListener('resize', resize); window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
  }, []);
  return (
    <React.Fragment>
      <canvas ref={canvasRef} style={{ display: 'none' }} />
      <div ref={imgRef} className="absolute inset-0 bg-center bg-cover bg-no-repeat pointer-events-none"
        style={{ backgroundImage: `url(${image})`, zIndex: z, WebkitMaskSize: 'cover', maskSize: 'cover', WebkitMaskRepeat: 'no-repeat', maskRepeat: 'no-repeat' }} />
    </React.Fragment>
  );
}

// grid pattern gently drifts opposite the pointer, offset eased and capped at 16px
function useGridParallax(containerRef) {
  const patternRef = useRef(null);
  useEffect(() => {
    let raw = { x: 0, y: 0 }, smooth = { x: 0, y: 0 };
    const onMove = e => {
      const r = containerRef.current.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      raw = { x: ((e.clientX - cx) / (r.width / 2)) * 16, y: ((e.clientY - cy) / (r.height / 2)) * 16 };
    };
    window.addEventListener('mousemove', onMove);
    let raf;
    const tick = () => {
      smooth.x += (raw.x - smooth.x) * 0.06;
      smooth.y += (raw.y - smooth.y) * 0.06;
      if (patternRef.current) patternRef.current.setAttribute('patternTransform', `translate(${smooth.x} ${smooth.y})`);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
  }, []);
  return patternRef;
}

function App() {
  const [menuOpen, setMenuOpen] = useState(false);
  const [videoPhase, setVideoPhase] = useState('idle');
  const phaseRef = useRef('idle');
  const videoRef = useRef(null);

  useEffect(() => {
    let raf;
    const tick = () => {
      const progress = Math.min(window.scrollY / SCROLL_DISTANCE, 1);
      const video = videoRef.current;
      if (video && !video.seeking && video.duration) video.currentTime = progress * video.duration;
      const phase = window.scrollY === 0 ? 'idle' : progress >= 0.99 ? 'done' : 'playing';
      if (phase !== phaseRef.current) { phaseRef.current = phase; setVideoPhase(phase); }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  useEffect(() => { lucide.createIcons(); }, [menuOpen]);

  const faded = videoPhase !== 'idle';
  const imagesVisible = videoPhase === 'done';

  return (
    <div className="min-h-screen bg-[#0A0B11]">
      <VideoLayer videoRef={videoRef} visible={faded} />
      <Nav menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
      <MobileOverlay open={menuOpen} onClose={() => setMenuOpen(false)} />
      <MobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} />
      <HeroSection faded={faded} />
      <div style={{ height: SCROLL_DISTANCE, position: 'relative', zIndex: 0 }} />
      <CardSection imagesVisible={imagesVisible} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
