// ---------------- Scroll-driven gallery ----------------
const ramp = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const PH = { lineEnd: 0.06, expandEnd: 0.16, img1End: 0.34, img2End: 0.50, img3End: 0.64, textEnd: 0.78, morphEnd: 0.90 };

function ScrollGallery() {
  const barRef = useRef(null);
  const imgRefs = [useRef(null), useRef(null), useRef(null)];
  const textBoxRef = useRef(null);
  const blackTextRef = useRef(null);
  const whiteTextRef = useRef(null);

  useEffect(() => {
    let raf;
    const tick = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;

      if (barRef.current) {
        let w;
        if (p <= PH.lineEnd) w = ramp(p, 0, PH.lineEnd) * 50 + 'px';
        else if (p <= PH.expandEnd) {
          const e = ramp(p, PH.lineEnd, PH.expandEnd);
          const eased = e < 0.5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2;
          w = (50 + eased * (innerWidth - 50)) + 'px';
        } else w = '100%';
        barRef.current.style.width = w;
      }

      const imgRanges = [[PH.expandEnd, PH.img1End], [PH.img1End, PH.img2End], [PH.img2End, PH.img3End]];
      imgRefs.forEach((ref, i) => {
        if (!ref.current) return;
        const r = ramp(p, imgRanges[i][0], imgRanges[i][1]);
        ref.current.style.transform = `scale(${0.2 + r * 0.8})`;
        ref.current.style.opacity = Math.min(1, r * 4);
      });

      const boxR = ramp(p, PH.img3End, PH.textEnd);
      if (textBoxRef.current) {
        textBoxRef.current.style.transform = `scale(${0.2 + boxR * 0.8})`;
        textBoxRef.current.style.opacity = Math.min(1, boxR * 4);
        const morphR = ramp(p, PH.textEnd, PH.morphEnd);
        const v = Math.round(morphR * 255);
        textBoxRef.current.style.backgroundColor = `rgb(${v},${v},${v})`;
      }
      if (blackTextRef.current) blackTextRef.current.style.opacity = boxR * (1 - ramp(p, PH.textEnd, PH.morphEnd));
      if (whiteTextRef.current) whiteTextRef.current.style.opacity = ramp(p, PH.morphEnd, 1);

      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <div className="fixed inset-0 z-10 pointer-events-none">
      <div ref={barRef} className="absolute inset-y-0 left-1/2 -translate-x-1/2 bg-black" style={{ width: 0 }} />
      {IMAGES.map((img, i) => (
        <div key={i} className="absolute inset-0 flex items-center justify-center">
          <div ref={imgRefs[i]} className="w-[85vw] h-auto max-w-[900px] aspect-[16/10] rounded-lg sm:w-full sm:h-full sm:max-w-none sm:aspect-auto sm:rounded-none overflow-hidden" style={{ transform: 'scale(0.2)', opacity: 0 }}>
            <img src={img.url} alt={img.alt} className="w-full h-full object-cover" />
          </div>
        </div>
      ))}
      <div ref={textBoxRef} className="absolute inset-0 flex items-center justify-center" style={{ transform: 'scale(0.2)', opacity: 0, backgroundColor: 'rgb(0,0,0)' }}>
        <p ref={blackTextRef} className="absolute font-geist font-light text-2xl sm:text-3xl md:text-4xl lg:text-5xl text-center leading-[1.3] max-w-3xl px-6 text-white" style={{ opacity: 0 }}>
          Открывайте исключительные объекты недвижимости <span className="text-amber-500">по всему миру.</span>
        </p>
        <p ref={whiteTextRef} className="absolute font-geist font-light text-2xl sm:text-3xl md:text-4xl lg:text-5xl text-center leading-[1.3] max-w-3xl px-6 text-neutral-800" style={{ opacity: 0 }}>
          Строим на доверии и <span className="text-amber-500">экспертизе.</span>
        </p>
      </div>
    </div>
  );
}

function App() {
  const [showSplash, setShowSplash] = useState(true);
  return (
    <div id="top" className="bg-black" style={{ height: '900vh' }}>
      {showSplash && <SplashScreen onComplete={() => setShowSplash(false)} />}
      <Hero />
      <ScrollGallery />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
