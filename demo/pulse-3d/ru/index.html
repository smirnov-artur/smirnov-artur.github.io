function parseLine(s) {
  if (!s) return [{ text: '', highlight: false }];
  const parts = [];
  const re = /\[([^\]]+)\]/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) parts.push({ text: s.slice(last, m.index), highlight: false });
    parts.push({ text: m[1], highlight: true });
    last = re.lastIndex;
  }
  if (last < s.length) parts.push({ text: s.slice(last), highlight: false });
  return parts;
}

function VideoScrub({ src, scrollProgress, drum, loaderBg, loaderBorderClass, loaderLabel }) {
  const videoRef = useRef(null);
  const wrapRef = useRef(null);
  const currentRef = useRef(0);
  const targetRef = useRef(0);
  const [isLoaded, setIsLoaded] = useState(false);
  targetRef.current = scrollProgress;

  useEffect(() => {
    let raf;
    const DRUM_START = 1.45, DRUM_END = 3.50;
    const tick = () => {
      const v = videoRef.current;
      if (v) {
        const duration = v.duration || 4.2;
        const p = targetRef.current;
        const norm = drum ? clamp01((p - DRUM_START) / (DRUM_END - DRUM_START)) : clamp01(p);
        const target = norm * duration;
        currentRef.current += (target - currentRef.current) * 0.15;
        if (!v.seeking && Math.abs(v.currentTime - currentRef.current) > 0.01) {
          v.currentTime = currentRef.current;
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [drum]);

  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const onLoaded = () => setIsLoaded(true);
    if (v.readyState >= 2) setIsLoaded(true);
    v.addEventListener('loadeddata', onLoaded);
    return () => v.removeEventListener('loadeddata', onLoaded);
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      const mx = e.clientX / window.innerWidth - 0.5;
      const my = e.clientY / window.innerHeight - 0.5;
      if (wrapRef.current) {
        gsap.to(wrapRef.current, { x: -mx * 40, y: -my * 40, duration: 1.2, ease: 'power2.out', overwrite: 'auto' });
      }
    };
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, []);

  return (
    <div className="absolute inset-0 w-full h-full bg-[#FF005E] overflow-hidden">
      <div ref={wrapRef} className="absolute inset-0 w-full h-full" style={{ scale: '1.05', willChange: 'transform' }}>
        <video ref={videoRef} src={src} playsInline muted preload="auto" className="absolute inset-0 w-full h-full object-cover pointer-events-none"/>
      </div>
      {!isLoaded && (
        <div className={"absolute inset-0 z-10 flex flex-col items-center justify-center gap-4 " + loaderBg}>
          <div className="relative w-16 h-16 flex items-center justify-center">
            <span className="absolute inset-0 rounded-full bg-pink-500/20 animate-ping"></span>
            <span className={"w-10 h-10 rounded-full border-4 animate-spin " + loaderBorderClass}></span>
          </div>
          <p className="font-manrope font-semibold text-[12px] uppercase tracking-[0.25em] text-pink-500" style={{ filter: 'drop-shadow(0 0 8px rgba(234,31,99,0.4))' }}>{loaderLabel}</p>
        </div>
      )}
    </div>
  );
}

function ScrollExitSplitText({ scrollProgress, containerClassName, style, children }) {
  const charsRef = useRef([]);
  const tlRef = useRef(null);

  useEffect(() => {
    const chars = charsRef.current.filter(Boolean);
    tlRef.current = gsap.timeline({ paused: true }).fromTo(chars,
      { opacity: 1, yPercent: 0, y: 0, scaleY: 1, scaleX: 1, transformOrigin: '50% 0%' },
      { opacity: 0, yPercent: 300, y: '25vh', scaleY: 1.2, scaleX: 0.9, stagger: 0.03, ease: 'power2.inOut' }
    );
    return () => { if (tlRef.current) tlRef.current.kill(); };
  }, []);

  useEffect(() => {
    if (tlRef.current) {
      gsap.to(tlRef.current, { progress: scrollProgress, duration: 0.6, ease: 'power1.out', overwrite: 'auto' });
    }
  }, [scrollProgress]);

  let ci = 0;
  const words = children.split(' ');
  return (
    <div className={containerClassName} style={style}>
      {words.map((word, wi) => (
        <React.Fragment key={wi}>
          {word.split('').map((ch) => {
            const idx = ci++;
            return <span key={idx} ref={(el) => (charsRef.current[idx] = el)} className="char inline-block will-change-transform">{ch}</span>;
          })}
          {wi < words.length - 1 && <span className="inline-block">&nbsp;</span>}
        </React.Fragment>
      ))}
    </div>
  );
}

function SoapTiles({ scrollProgress }) {
  const [hovered, setHovered] = useState(null);
  const tiles = [
    { text: 'Приватный Discord и нетворкинг', offset: 120, delay: 0 },
    { text: 'Рыночная альфа каждую неделю', offset: 180, delay: 100 },
    { text: 'Доступ к эксклюзивным Web3-инструментам', offset: 240, delay: 200 },
  ];
  const visible = scrollProgress > 0.75;
  const easeProgress = clamp01((scrollProgress - 0.75) / 0.22);

  return (
    <div className={"absolute left-4 right-4 md:left-[64px] top-[38%] md:top-1/2 -translate-y-1/2 flex flex-col gap-2 md:gap-[10px] z-40 pointer-events-auto transition-all duration-[800ms] ease-out" + (visible ? '' : ' opacity-0 -translate-x-6 md:-translate-x-12 pointer-events-none')}>
      {tiles.map((tile, i) => {
        const isDesktop = typeof window !== 'undefined' && window.innerWidth >= 768;
        const offset = isDesktop ? tile.offset : tile.offset * 0.25;
        const tx = (easeProgress - 1) * offset;
        const isHovered = hovered === i;
        const neighborsShift = isDesktop && hovered !== null && !isHovered;
        const ty = neighborsShift ? (i < hovered ? -13.8 : 13.8) : 0;
        const scale = isHovered && isDesktop ? 1.2 : 1;
        const blur = (1 - easeProgress) * 12;
        return (
          <div key={i}
            onMouseEnter={() => setHovered(i)}
            onMouseLeave={() => setHovered(null)}
            style={{
              transitionDelay: tile.delay + 'ms',
              transitionTimingFunction: 'cubic-bezier(0.16, 1, 0.3, 1)',
              transform: `translateX(${tx}px) translateY(${ty}px) scale(${scale})`,
              opacity: easeProgress,
              filter: blur > 0.1 ? `blur(${blur}px)` : 'none',
            }}
            className="group relative h-[52px] sm:h-[72px] md:h-[138px] text-black bg-white rounded-xl sm:rounded-2xl md:rounded-[34px] flex items-center justify-center px-4 sm:px-8 md:px-14 w-full md:w-auto md:self-start cursor-pointer origin-left transition-all duration-[400ms] whitespace-nowrap">
            <span className="font-michroma font-medium text-[11px] sm:text-[14px] md:text-[23px] leading-[16px] sm:leading-[22px] md:leading-[34px] tracking-tight" style={{ letterSpacing: '-0.03em' }}>
              {tile.text}
            </span>
          </div>
        );
      })}
    </div>
  );
}

      )}
    </React.Fragment>
  );
}

function CylindricalTextDrum({ scrollProgress }) {
  const R = 380, LH = 32;
  const DRUM_START = 1.45, DRUM_END = 3.50;
  const t = clamp01((scrollProgress - DRUM_START) / (DRUM_END - DRUM_START));
  const targetIndex = t * (LINES.length - 1);
  return (
    <div className="absolute inset-y-0 left-0 w-full sm:w-[65%] md:w-[60%] z-30 flex flex-col items-start justify-center pointer-events-none select-none text-left pl-6 sm:pl-12 md:pl-20 py-16" style={{ perspective: '1000px', perspectiveOrigin: '25% 50%' }}>
      <div className="relative w-full h-[85vh] overflow-visible" style={{ transformStyle: 'preserve-3d' }}>
        {LINES.map((line, idx) => {
          const indexDiff = idx - targetIndex;
          const translateY = indexDiff * LH;
          const angleRad = translateY / R;
          const angleDeg = angleRad * 180 / Math.PI;
          const translateZ = Math.cos(angleRad) * R - R;
          const baseScale = 0.78 + Math.cos(angleRad) * 0.22;
          const opacity = Math.max(0, (Math.cos(angleRad) - 0.2) / 0.8);
          const depthBlur = Math.min(8, Math.max(0, (Math.abs(indexDiff) - 1.5) * 0.75));
          const isEmpty = line === '';
          const finalOpacity = isEmpty ? opacity * 0.3 : opacity;
          const segs = parseLine(line);
          return (
            <p key={idx}
               className="absolute left-0 top-1/2 w-full font-manrope text-[18px] sm:text-[24px] md:text-[28px] lg:text-[32px] font-semibold leading-[0.90] tracking-tight whitespace-nowrap"
               style={{
                 letterSpacing: '-0.035em',
                 transform: `translateY(-50%) translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${-angleDeg * 0.8}deg) scale(${baseScale})`,
                 transformOrigin: 'left center',
                 opacity: finalOpacity,
                 filter: depthBlur > 0.1 ? `blur(${depthBlur}px)` : 'none',
               }}>
              {isEmpty ? ' ' : segs.map((s, i) => (
                <span key={i} className={s.highlight ? 'text-white font-bold opacity-100' : 'text-white/60'}>{s.text}</span>
              ))}
            </p>
          );
        })}
      </div>
    </div>
  );
}

function updateActiveSection(p) {
  if (p < 0.18) return 'hero';
  if (p < 0.45) return 'projects';
  if (p < 0.68) return 'expertise';
  if (p < 1.15) return 'about';
  return 'contact';
}

function App() {
  const [scrollProgress, setScrollProgress] = useState(0);
  const [lerped, setLerped] = useState(0);
  const [activeSectionId, setActiveSectionId] = useState('hero');
  const [mobileOpen, setMobileOpen] = useState(false);
  const scrollProgressRef = useRef(0);
  const lerpedRef = useRef(0);
  const navTokenRef = useRef(0);
  scrollProgressRef.current = scrollProgress;

  useEffect(() => {
    const id = updateActiveSection(lerped);
    setActiveSectionId((prev) => (prev === id ? prev : id));
  }, [lerped]);

  // Управление жестом: нативного скролла нет, одно число scrollProgress (0..3.5) двигает все анимации.
  useEffect(() => {
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    const clamp = (v) => Math.min(3.5, Math.max(0, v));
    const onWheel = (e) => {
      e.preventDefault();
      navTokenRef.current++;
      setScrollProgress((p) => clamp(p + e.deltaY * 0.0006));
    };
    let lastTouchY = 0;
    const onTouchStart = (e) => { lastTouchY = e.touches[0].clientY; };
    const onTouchMove = (e) => {
      e.preventDefault();
      navTokenRef.current++;
      const y = e.touches[0].clientY;
      const delta = lastTouchY - y;
      lastTouchY = y;
      setScrollProgress((p) => clamp(p + delta * 0.0015));
    };
    window.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    return () => {
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('touchstart', onTouchStart);
      window.removeEventListener('touchmove', onTouchMove);
    };
  }, []);

  // Сглаженная копия scrollProgress, пересчитывается на каждом кадре анимации.
  useEffect(() => {
    let raf;
    const tick = () => {
      const target = scrollProgressRef.current;
      let cur = lerpedRef.current;
      cur += (target - cur) * 0.08;
      if (Math.abs(target - cur) < 0.0001) cur = target;
      lerpedRef.current = cur;
      setLerped(cur);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const handleNavigateToSection = (item) => {
    setMobileOpen(false);
    const token = ++navTokenRef.current;
    const start = scrollProgressRef.current;
    const target = item.scrollRatio;
    const duration = 1200;
    const t0 = performance.now();
    const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    const step = (now) => {
      if (navTokenRef.current !== token) return;
      const t = Math.min(1, (now - t0) / duration);
      const v = start + (target - start) * ease(t);
      setScrollProgress(v);
      setActiveSectionId((prev) => { const id = updateActiveSection(v); return prev === id ? prev : id; });
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  const secondScreenProgress = clamp01((lerped - 1.15) / 0.50);
  const easedRisingProgress = 1 - Math.pow(1 - secondScreenProgress, 3);
  const smoothBlurAmount = Math.sin(secondScreenProgress * Math.PI / 2) * 64;

  return (
    <main className="relative w-screen h-screen overflow-hidden bg-[#FF005E] text-white">
      <div className="relative w-full h-full overflow-hidden">

        {/* ПЕРВЫЙ ЭКРАН — размывается, когда поднимается второй */}
        <div className="absolute inset-0 w-full h-full z-10 transition-transform duration-[100ms] ease-out"
             style={{ filter: secondScreenProgress > 0 ? `blur(${smoothBlurAmount}px)` : 'none' }}>
          <VideoScrub
            src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/cloudinarry%20to%20cloudflare/202606021731-e_hqa6sn.mp4"
            scrollProgress={Math.min(1, lerped)}
            drum={false}
            loaderBg="bg-[#FF005Ef4]"
            loaderBorderClass="border-[#ea1f63]/20 border-t-[#ea1f63]"
            loaderLabel="ЗАГРУЗКА ГЛАВНОГО ПОТОКА..."
          />

          <div className="absolute bottom-[40px] left-[1%] right-[1%] w-[98%] pointer-events-none select-none z-20 flex justify-center items-center">
            <ScrollExitSplitText
              scrollProgress={Math.min(1, lerped)}
              containerClassName="w-full text-[10.4vw] leading-none font-michroma font-normal uppercase text-white whitespace-nowrap text-center transition-all duration-300 will-change-transform"
              style={{ letterSpacing: '-0.07em' }}
            >
              G.A.D.
            </ScrollExitSplitText>
          </div>

          <SoapTiles scrollProgress={lerped} />
        </div>

        <Header activeSectionId={activeSectionId} onNavigate={handleNavigateToSection} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />

        {/* ВТОРОЙ ЭКРАН — поднимается снизу, скруглённый верх */}
        <div className="absolute bottom-0 left-0 w-full h-full bg-[#11010a] rounded-t-[48px] overflow-hidden z-40"
             style={{ transform: `translateY(${(1 - easedRisingProgress) * 100}%)`, visibility: secondScreenProgress > 0 ? 'visible' : 'hidden', willChange: 'transform' }}>
          <div className="absolute top-5 left-1/2 -translate-x-1/2 w-16 h-[5px] bg-white rounded-full z-50 pointer-events-none"></div>

          <VideoScrub
            src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/cloudinarry%20to%20cloudflare/2026060218225-v_kcy5rl.mp4"
            scrollProgress={lerped}
            drum={true}
            loaderBg="bg-[#11010af4]"
            loaderBorderClass="border-pink-500/20 border-t-pink-500"
            loaderLabel="ЗАГРУЗКА ПОТОКА БАРАБАНА..."
          />

          <CylindricalTextDrum scrollProgress={lerped} />

          <div className="absolute bottom-8 sm:bottom-12 md:bottom-16 left-0 w-full sm:w-[65%] md:w-[60%] pl-6 sm:pl-12 md:pl-20 pr-6 sm:pr-12 md:pr-16 z-50 pointer-events-auto">
            <div className="w-full border-t border-white/[0.08] pt-6">
              <Marquee gap="80px" speed={25} fade>
                <GoogleWordmark size={100} />
                <GithubWordmark size={100} />
                {PARTNER_LOGOS.map((p) => (
                  <span key={p.name} className="text-white text-lg font-bold opacity-80 hover:opacity-100 transition-opacity flex-shrink-0" style={{ fontFamily: 'Arial, sans-serif' }}>{p.name}</span>
                ))}
              </Marquee>
            </div>
          </div>
        </div>

      </div>
    </main>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
