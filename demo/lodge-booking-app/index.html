            const year = monthDate.getFullYear(), month = monthDate.getMonth();
            const startOffset = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const cells = [];

        };

        const Phone2 = () => {
            const [menuOpen, setMenuOpen] = useState(false);
            return (
                <div className="phone-content relative bg-[#0a140f]" style={{ backgroundImage: `url(${IMG_HERO})`, backgroundSize: 'cover', backgroundPosition: 'center' }}>
                    <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg, rgba(10,25,20,0.35) 0%, rgba(10,25,20,0.12) 30%, rgba(5,15,12,0.55) 68%, rgba(5,10,8,0.88) 100%)' }} />
                    <div className="relative h-full flex flex-col">
                        <PhoneHeader onMenu={() => setMenuOpen(true)} />
                        <div className="px-5 mt-4 animate-fade-in-up" style={{ animationDelay: '0.15s' }}>
                            <h1 className="font-display font-light text-white leading-[1.05]" style={{ fontSize: '3rem' }}>
                                Nature’s<br /><span className="text-white/50">Perfect</span><br />Hideaways
                            </h1>
                        </div>
                        <p className="px-5 mt-4 text-white/70 text-sm leading-relaxed max-w-[260px] animate-fade-in-up" style={{ animationDelay: '0.3s' }}>
                            Discover handpicked luxury cabins in breathtaking locations. Unplug, unwind, and reconnect with what matters most.
                        </p>
                        <div className="flex-1" />
                        <div className="px-5 pb-8">
                            <div className="flex flex-col items-end gap-1 mb-4 animate-fade-in-up" style={{ animationDelay: '0.5s' }}>
                                <div className="flex items-center gap-1.5">
                                    <StarIcon filled className="w-[18px] h-[18px] text-amber-400" />
                                    <span className="text-white font-bold text-xl">4.7</span>
                                </div>
                                <span className="text-white/50 text-xs">from 1,800+ stays</span>
                            </div>
                            <button type="button" className="btn-hover animate-pulse-glow animate-fade-in-up w-full bg-white/95 text-[#0a1a12] font-medium py-3.5 rounded-[16px] text-center" style={{ animationDelay: '0.7s' }}>
                                Book Now
                            </button>
                        </div>
                    </div>
                    <NavOverlay open={menuOpen} onClose={() => setMenuOpen(false)} />
                </div>
            );
        };

        const CalendarPopover = ({ month, setMonth, checkIn, checkOut, onPick }) => {
            const cells = buildGrid(month);
            return (
                <div className="liquid-glass-dropdown absolute left-0 right-0 top-full mt-2 z-30 rounded-[18px] p-3 animate-fade-in-scale">
                    <div className="flex items-center justify-between mb-2 px-1">
                        <button type="button" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))} className="text-white/60 hover:text-white p-1">
                            <ChevronLeftIcon className="w-4 h-4" />
                        </button>
                        <span className="text-white text-xs font-medium">{MONTHS[month.getMonth()]} {month.getFullYear()}</span>
                        <button type="button" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))} className="text-white/60 hover:text-white p-1">
                            <ChevronRightIcon className="w-4 h-4" />
                        </button>
                    </div>
                    <div className="grid grid-cols-7 text-center text-[10px] text-white/40 mb-1">
                        {DAY_LABELS.map((d) => <span key={d}>{d}</span>)}
                    </div>
                    <div className="grid grid-cols-7 gap-y-1 text-center text-[12px]">
                        {cells.map((d, i) => {
                            if (!d) return <span key={i} />;
                            const isEdge = sameDay(d, checkIn) || sameDay(d, checkOut);
                            const inRange = checkIn && checkOut && d > checkIn && d < checkOut;
                            return (
                                <button type="button" key={i} onClick={() => onPick(d)}
                                    className={`w-6 h-6 mx-auto rounded-full flex items-center justify-center ${isEdge ? 'bg-white text-[#0a1220] font-medium' : inRange ? 'bg-white/15 text-white' : 'text-white/40 hover:bg-white/10'}`}>
                                    {d.getDate()}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const TimeDropdown = ({ options, value, onPick, align }) => (
            <div className={`liquid-glass-time-dropdown absolute ${align === 'right' ? 'right-0' : 'left-0'} w-[calc(50%-2px)] top-full mt-2 z-30 rounded-[14px] py-1.5 max-h-36 overflow-y-auto animate-fade-in-scale`}>
                {options.map((t) => (
                    <button type="button" key={t} onClick={() => onPick(t)}
                        className={`block w-full text-left px-4 py-2 text-[13px] ${t === value ? 'text-white bg-white/10' : 'text-white/55 hover:bg-white/5'}`}>
                        {t}
                    </button>
                ))}
            </div>
        );

        const Phone3 = () => {
            const [menuOpen, setMenuOpen] = useState(false);
            const [activePicker, setActivePicker] = useState(null);
            const [checkIn, setCheckIn] = useState(new Date(2026, 1, 11));
            const [checkOut, setCheckOut] = useState(new Date(2026, 2, 25));
            const [calMonth, setCalMonth] = useState(new Date(2026, 1, 1));
            const [checkInTime, setCheckInTime] = useState('After 2:00 PM');
            const [checkOutTime, setCheckOutTime] = useState('Until 12:00 PM');

            const pickDate = (d) => {
                if (activePicker === 'checkout') {
                    if (d < checkIn) { setCheckIn(d); } else { setCheckOut(d); }
                } else {
                    if (d > checkOut) { setCheckOut(d); }
                    setCheckIn(d);
                }
                setActivePicker(null);
            };
            const togglePicker = (name) => setActivePicker((p) => (p === name ? null : name));

            return (
                <div className="phone-content relative bg-[#0a1218]">
                    <video src={VIDEO_LODGE} autoPlay muted loop playsInline className="absolute inset-0 w-full h-full object-cover" />
                    <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg, rgba(30,60,80,0.4) 0%, rgba(30,60,80,0.2) 32%, rgba(10,30,40,0.6) 68%, rgba(10,20,30,0.9) 100%)' }} />
                    <div className="relative h-full flex flex-col" onClick={() => activePicker && setActivePicker(null)}>
                        <PhoneHeader onMenu={() => setMenuOpen(true)} />
                        <div className="px-5 mt-3 animate-fade-in-up" style={{ animationDelay: '0.15s' }}>
                            <h2 className="font-display font-light text-white text-[2.2rem] leading-[1.08]">Reserve<br />Your Retreat</h2>
                        </div>
                        <div className="flex-1 overflow-y-auto px-5 mt-5 pb-6">
                            <div className="liquid-glass-dropdown card-hover rounded-[20px] p-3 animate-fade-in-scale" style={{ animationDelay: '0.3s' }} onClick={(e) => e.stopPropagation()}>
                                <img src={IMG_RESERVE} alt="Evergreen Pine Family Lodge exterior at dusk" className="h-56 w-full object-cover rounded-[16px]" />
                                <div className="flex items-start justify-between mt-3">
                                    <h3 className="text-white font-display text-xl font-light leading-tight">Evergreen<br />Pine Family Lodge</h3>
                                    <button type="button" aria-label="Edit lodge" className="btn-hover w-9 h-9 rounded-full liquid-glass-dropdown flex items-center justify-center text-white/80 shrink-0">
                                        <PencilIcon className="w-4 h-4" />
                                    </button>
                                </div>

                                <div className="relative grid grid-cols-2 gap-2 mt-4">
                                    <button type="button" onClick={() => togglePicker('checkin')} className="liquid-glass-dropdown rounded-[14px] px-3 py-2.5 flex items-center gap-2">
                                        <CalendarIcon className="w-4 h-4 text-white/50 shrink-0" />
                                        <span className="text-white text-[13px] flex-1 text-left">{fmtDate(checkIn)}</span>
                                        <ChevronDownIcon className="w-3.5 h-3.5 text-white/40 shrink-0" />
                                    </button>
                                    <button type="button" onClick={() => togglePicker('checkout')} className="liquid-glass-dropdown rounded-[14px] px-3 py-2.5 flex items-center gap-2">
                                        <CalendarIcon className="w-4 h-4 text-white/50 shrink-0" />
                                        <span className="text-white text-[13px] flex-1 text-left">{fmtDate(checkOut)}</span>
                                        <ChevronDownIcon className="w-3.5 h-3.5 text-white/40 shrink-0" />
                                    </button>
                                    {(activePicker === 'checkin' || activePicker === 'checkout') && (
                                        <CalendarPopover month={calMonth} setMonth={setCalMonth} checkIn={checkIn} checkOut={checkOut} onPick={pickDate} />
                                    )}
                                </div>

                                <div className="relative liquid-glass-dropdown rounded-[14px] flex mt-2">
                                    <button type="button" onClick={() => togglePicker('checkinTime')} className="flex-1 text-left px-3 py-2.5 border-r border-white/10">
                                        <span className="block text-white/40 text-[10px]">Check-in</span>
                                        <span className="text-white text-[13px]">{checkInTime}</span>
                                    </button>
                                    <button type="button" onClick={() => togglePicker('checkoutTime')} className="flex-1 text-left px-3 py-2.5">
                                        <span className="block text-white/40 text-[10px]">Check-out</span>
                                        <span className="text-white text-[13px]">{checkOutTime}</span>
                                    </button>
                                    {activePicker === 'checkinTime' && (
                                        <TimeDropdown options={CHECKIN_TIMES} value={checkInTime} onPick={(t) => { setCheckInTime(t); setActivePicker(null); }} />
                                    )}
                                    {activePicker === 'checkoutTime' && (
                                        <TimeDropdown options={CHECKOUT_TIMES} value={checkOutTime} onPick={(t) => { setCheckOutTime(t); setActivePicker(null); }} align="right" />
                                    )}
                                </div>

                                <div className="flex items-end justify-between mt-4">
                                    <p className="leading-none"><span className="text-white font-light text-3xl">$359</span><span className="text-white/50 text-sm">/night</span></p>
                                    <p className="text-white/50 text-sm">2-5 guests</p>
                                </div>
                                <button type="button" className="btn-hover w-full bg-white text-[#0a1220] font-medium py-3 rounded-[16px] mt-3 text-center">Reserve</button>
                            </div>
                        </div>
                    </div>
                    <NavOverlay open={menuOpen} onClose={() => setMenuOpen(false)} />
                </div>
            );
        };

        const App = () => (
            <div className="relative min-h-screen" style={{ background: '#030508' }}>
                <BackgroundLayer />
                <div className="relative z-10 min-h-screen flex flex-col md:flex-row items-center justify-center gap-6 md:gap-[50px] p-5 md:p-8">
                    <div className="phone-frame animate-fade-in-scale"><Phone1 /></div>
                    <div className="phone-frame animate-fade-in-scale" style={{ animationDelay: '0.15s' }}><Phone2 /></div>
                    <div className="phone-frame animate-fade-in-scale" style={{ animationDelay: '0.3s' }}><Phone3 /></div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
