<!DOCTYPE html>
<html lang="en">
<head>
<script src="/works/js/gad-loader.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>g.a.d. — What&rsquo;s Beyond</title>
    <meta name="description" content="g.a.d. — a cinematic hero where a tumbling asteroid video gives way to a letter-by-letter reveal.">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow-x: hidden; background: #0a0a0a; }

      @keyframes starTwinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
      @keyframes circleShrink {
        0% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
        20% { opacity: 0.3; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      }
      @keyframes circleShrinkOuter {
        0% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        25% { opacity: 0.2; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
      }
      @keyframes circlePulse {
        0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.03); }
      }
      @keyframes circlePulseOuter {
        0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 0.28; transform: translate(-50%, -50%) scale(1.02); }
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .headline { font-family: Anton, sans-serif; font-size: clamp(2.8rem, 17vw, 23rem);
        letter-spacing: -0.04em; line-height: 0.85; white-space: nowrap; color: #fff; }
      .letter { display: inline-block; transition: transform 0.8s cubic-bezier(0.16,1,0.3,1), opacity 0.5s ease-out; }

      .navbar-fade { animation: fadeIn 1s ease-out 0.5s both; }
      .nav-link { font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 0.25em;
        text-transform: uppercase; color: rgba(255,255,255,0.7); text-decoration: none; transition: color 300ms; }
      .nav-link:hover { color: #fff; }

      .circle-inner, .circle-outer { position: absolute; left: 50%; top: 50%; border-radius: 9999px;
        border: 1px solid #fff; pointer-events: none; }
      .circle-inner { width: min(95vw, 95vh); height: min(95vw, 95vh); max-width: 1200px; max-height: 1200px;
        animation: circleShrink 3s cubic-bezier(0.16,1,0.3,1) 800ms both, circlePulse 6s ease-in-out 3800ms infinite; }
      .circle-outer { width: min(160vw, 160vh); height: min(160vw, 160vh); max-width: 2200px; max-height: 2200px;
        animation: circleShrinkOuter 3.5s cubic-bezier(0.16,1,0.3,1) 1000ms both, circlePulseOuter 8s ease-in-out 4500ms infinite; }

      .menu-link { display: flex; align-items: center; justify-content: space-between; width: 100%;
        padding: 1.25rem 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-family: Anton, sans-serif;
        font-size: 2.25rem; letter-spacing: -0.02em; color: #fff; text-decoration: none; background: none; border-left: 0; border-right: 0; border-top: 0;
        transition: letter-spacing 300ms; cursor: pointer; }
      .menu-link:hover, .menu-link:focus-visible { letter-spacing: 0.04em; }
      .menu-link-icon { color: rgba(255,255,255,0.3); transition: color 300ms, transform 300ms; }
      .menu-link:hover .menu-link-icon, .menu-link:focus-visible .menu-link-icon { color: #fff; transform: translate(1px, -1px); }

      @media (prefers-reduced-motion: reduce) {
        .letter, .circle-inner, .circle-outer, .navbar-fade, .menu-link, .menu-link-icon { animation: none !important; transition: none !important; }
      }
    </style>
</head>
<body class="antialiased">
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;

const STAR_COUNT = 40;
const HEADLINE = "WHAT'S BEYOND";
const NAV_ITEMS = ['Discover', 'Story', 'Connect'];

function GadLogo({ height = 20 }) {
  return (
    <svg className="gad-logo" height={height} viewBox="0 0 355 110" role="img" aria-label="g.a.d." style={{ color: '#fff' }}><path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
  );
}

function Stars() {
  const stars = Array.from({ length: STAR_COUNT }, (_, i) => {
    const size = i % 3 === 0 ? 2 : 1;
    return (
      <div key={i} aria-hidden="true" style={{
        position: 'absolute',
        left: `${(i * 37 + 13) % 100}%`,
        top: `${(i * 53 + 7) % 100}%`,
        width: size, height: size,
        background: '#fff', borderRadius: '50%',
        animation: `starTwinkle ${2 + (i % 4)}s ease-in-out ${(i * 0.3) % 3}s infinite`,
      }} />
    );
  });
  return <div className="absolute inset-0" style={{ zIndex: 0 }}>{stars}</div>;
}

function Share({ className = '' }) {
  return (
    <div className={'nav-link flex items-center gap-2 cursor-pointer ' + className}>
      <span>Share</span>
      <i data-lucide="share-2" className="w-4 h-4"></i>
    </div>
  );
}

function App() {
  const videoRef = useRef(null);
  const [videoEnded, setVideoEnded] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuAnimating, setMenuAnimating] = useState(false);
  const firstLinkRef = useRef(null);
  const burgerRef = useRef(null);

  useEffect(() => { lucide.createIcons(); }, [videoEnded, menuOpen, menuAnimating]);

  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const onMeta = () => { v.playbackRate = 1.56; };
    const onEnd = () => setVideoEnded(true);
    v.addEventListener('loadedmetadata', onMeta);
    v.addEventListener('ended', onEnd);
    v.play().catch(() => {});
    return () => {
      v.removeEventListener('loadedmetadata', onMeta);
      v.removeEventListener('ended', onEnd);
    };
  }, []);

  const openMenu = () => {
    setMenuOpen(true);
    requestAnimationFrame(() => requestAnimationFrame(() => setMenuAnimating(true)));
  };
  const closeMenu = () => {
    setMenuAnimating(false);
    setTimeout(() => setMenuOpen(false), 600);
  };

  useEffect(() => {
    if (!menuOpen) return;
    if (menuAnimating) firstLinkRef.current && firstLinkRef.current.focus();
    const onKey = e => {
      if (e.key === 'Escape') { closeMenu(); burgerRef.current && burgerRef.current.focus(); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [menuOpen, menuAnimating]);

  return (
    <div className="relative w-full h-[100dvh] overflow-hidden bg-[#0a0a0a]">
      <Stars />

      <video
        ref={videoRef}
        className="absolute inset-0 w-full h-full object-cover"
        style={{ zIndex: 1 }}
        muted autoPlay playsInline
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260613_233050_b3f1adc5-8b5f-41bb-b52a-0a79bd796ba8.mp4"
      />

      <div className="absolute inset-x-0 bottom-[21vh] sm:bottom-[24vh] md:bottom-[10vh] flex justify-center px-2 sm:px-4 md:px-8 overflow-hidden" style={{ zIndex: 5 }}>
        <h1 className="headline" aria-label={HEADLINE}>
          <span aria-hidden="true">
            {HEADLINE.split('').map((ch, i) => (
              <span key={i} className="letter" style={{
                transitionDelay: `${i * 60}ms`,
                transform: videoEnded ? 'translateY(0)' : 'translateY(120%)',
                opacity: videoEnded ? 1 : 0,
              }}>
                {ch === ' ' ? ' ' : ch}
              </span>
            ))}
          </span>
        </h1>
      </div>

      <div className="circle-inner" style={{ zIndex: 6 }} aria-hidden="true" />
      <div className="circle-outer" style={{ zIndex: 6 }} aria-hidden="true" />

      <div className="absolute inset-0 pointer-events-none" style={{ zIndex: 8 }}>
        <img
          src="img/asteroid.webp"
          alt=""
          className="w-full h-full object-cover block"
          style={{ opacity: videoEnded ? 1 : 0, transition: 'opacity 0.6s ease-out' }}
        />
      </div>

      <nav className="navbar-fade absolute top-0 left-0 right-0 flex items-center justify-between px-5 sm:px-8 md:px-12 py-4 sm:py-6" style={{ zIndex: 10 }}>
        <a href="#" aria-label="g.a.d."><GadLogo height={20} /></a>
        <div className="hidden md:flex items-center gap-10">
          {NAV_ITEMS.map(label => <a key={label} href="#" className="nav-link">{label}</a>)}
        </div>
        <Share className="hidden md:flex" />
        <button ref={burgerRef} className="md:hidden" onClick={openMenu} aria-label="Open menu">
          <i data-lucide="menu" className="w-5 h-5 text-white"></i>
        </button>
      </nav>

      {menuOpen && (
        <div className="fixed inset-0" style={{ zIndex: 100 }} role="dialog" aria-modal="true" aria-label="Menu">
          <div className="absolute inset-0 bg-[#0a0a0a]" style={{ opacity: menuAnimating ? 1 : 0, transition: 'opacity 500ms' }} />
          <div aria-hidden="true" style={{
            position: 'absolute', top: '1rem', right: '1.25rem',
            width: menuAnimating ? '300vmax' : '0px', height: menuAnimating ? '300vmax' : '0px',
            borderRadius: '9999px', background: 'rgba(255,255,255,0.03)',
            transform: 'translate(50%, -50%)',
            transition: 'width 800ms cubic-bezier(0.16,1,0.3,1), height 800ms cubic-bezier(0.16,1,0.3,1)',
          }} />

          <div className="relative flex items-center justify-between px-5 sm:px-8 py-4 sm:py-6" style={{ opacity: menuAnimating ? 1 : 0, transition: 'opacity 300ms', transitionDelay: '200ms' }}>
            <GadLogo height={20} />
            <button onClick={closeMenu} aria-label="Close menu">
              <i data-lucide="x" className="w-6 h-6 text-white"></i>
            </button>
          </div>

          <div className="relative px-5 sm:px-8 mt-6 flex flex-col">
            {NAV_ITEMS.map((label, i) => (
              <a
                key={label} href="#" className="menu-link"
                ref={i === 0 ? firstLinkRef : null}
                onClick={closeMenu}
                style={{
                  opacity: menuAnimating ? 1 : 0,
                  transform: menuAnimating ? 'translateY(0)' : 'translateY(30px)',
                  transition: 'opacity 500ms, transform 500ms',
                  transitionDelay: `${300 + i * 100}ms`,
                }}
              >
                <span>{label}</span>
                <i data-lucide="arrow-up-right" className="w-5 h-5 menu-link-icon"></i>
              </a>
            ))}
          </div>

          <div className="absolute left-0 right-0 px-5 sm:px-8" style={{ bottom: '2rem', opacity: menuAnimating ? 1 : 0, transition: 'opacity 500ms', transitionDelay: '650ms' }}>
            <Share className="flex mb-5" />
            <div className="flex items-center gap-3">
              <span aria-hidden="true" style={{ width: 12, height: 1, background: 'rgba(255,255,255,0.2)', display: 'inline-block' }} />
              <span className="text-[10px] tracking-[0.3em] text-white/30 uppercase" style={{ fontFamily: 'Inter, sans-serif' }}>Explore the unknown</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
