<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>outbox — reliable event publishing to Kafka (Go)</title>
    <meta name="description" content="A transactional outbox in Go: the business row and the event commit together, a relay delivers it — kill the broker and the event waits, then still arrives.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
        } } } };
    </script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        html,body{overflow-x:hidden;background:#020617}
        ::selection{background:#78350f;color:#fffbeb}
        .bg-grid{background-image:linear-gradient(rgba(148,163,184,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.14) 1px,transparent 1px);background-size:36px 36px}
        @keyframes pulse-ring{0%,100%{opacity:1}50%{opacity:.4}}
        .pulse{animation:pulse-ring 1.1s ease-in-out infinite}
    </style>
</head>
<body class="antialiased bg-slate-950 text-slate-200 font-sans">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const GITHUB_URL = 'https://github.com/smirnov-artur/outbox';
        const PORTFOLIO_URL = 'https://smirnov-artur.github.io/works/en';
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        const GadLogo = ({ className, style }) => (
            <svg className={'gad-logo ' + (className || '')} style={style} viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
                <path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/>
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
            </svg>
        );

        const ICON_PATHS = {
            db: <><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5V12c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5"/><path d="M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/></>,
            relay: <><path d="M4 12a8 8 0 0 1 13.66-5.66"/><path d="M20 12a8 8 0 0 1-13.66 5.66"/><path d="M17.5 3v3.5H14"/><path d="M6.5 21v-3.5H10"/></>,
            stack: <><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></>,
        };
        const Icon = ({ name, className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">{ICON_PATHS[name]}</svg>
        );

        const Nav = () => (
            <nav className="max-w-[1360px] mx-auto flex items-center justify-between px-5 sm:px-6 py-5">
                <a href={PORTFOLIO_URL} className="flex items-center gap-2 text-slate-100 opacity-90 hover:opacity-100 transition-opacity" aria-label="g.a.d. portfolio">
                    <GadLogo style={{ height: 22 }} />
                </a>
                <a href={GITHUB_URL} target="_blank" rel="noopener" className="hidden sm:flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-100 transition-colors font-mono">
                    github.com/smirnov-artur/outbox
                </a>
            </nav>
        );

        const BigBox = React.forwardRef(({ icon, label, sub, active, dead, tone = 'amber', children }, ref) => (
            <div
                ref={ref}
                className={
                    'relative flex-1 rounded-2xl border-2 px-5 py-6 sm:px-6 sm:py-7 transition-all duration-300 ' +
                    (dead
                        ? 'border-rose-500/70 bg-rose-500/[0.06]'
                        : active
                            ? (tone === 'rose'
                                ? 'border-rose-400 bg-rose-400/10 shadow-[0_0_36px_-6px_rgba(251,113,133,0.55)]'
                                : 'border-amber-400 bg-amber-400/10 shadow-[0_0_36px_-6px_rgba(251,191,36,0.55)]')
                            : 'border-slate-800 bg-slate-900/70')
                }
            >
                <Icon name={icon} className={'w-6 h-6 sm:w-7 sm:h-7 mb-3 transition-colors ' + (dead ? 'text-rose-400' : active ? (tone === 'rose' ? 'text-rose-300' : 'text-amber-300') : 'text-slate-500')} />
                <p className="font-mono text-[10.5px] sm:text-xs uppercase tracking-wider text-slate-500 mb-1.5">{label}</p>
                <p className="text-slate-100 font-semibold text-base sm:text-lg leading-snug">{children}</p>
                <div className={'font-mono text-xs sm:text-[13px] mt-2.5 min-h-[1.2em] ' + (dead ? 'text-rose-300 pulse' : 'text-slate-400')}>{sub || ' '}</div>
            </div>
        ));

        const LogLine = ({ entry }) => {
            const tone = entry.tone === 'rose' ? 'text-rose-300' : entry.tone === 'amber' ? 'text-amber-300' : 'text-slate-300';
            return (
                <div className="font-mono text-[12px] sm:text-[13px] leading-relaxed">
                    <span className={entry.dir === 'req' ? 'text-slate-500' : tone}>{entry.dir === 'req' ? '→ ' : '← '}</span>
                    <span className={entry.dir === 'req' ? 'text-slate-300' : tone}>{entry.text}</span>
                    {entry.note && <div className="text-slate-500 pl-4">// {entry.note}</div>}
                </div>
            );
        };

        const HOP = 360, CHECK = 220, CHARGE_IN = 200, CHARGE_OUT = 260, LEAD = 120;

        const Diagram = () => {
            const wrapRef = useRef(null), txRef = useRef(null), relayRef = useRef(null), brokerRef = useRef(null);
            const busyRef = useRef(false), manualRef = useRef(false), brokerUpRef = useRef(true), pendingRef = useRef(false);

            const [lines, setLines] = useState(null);
            const [ready, setReady] = useState(false);
            const readyRef = useRef(false);
            const [busy, setBusy] = useState(false);
            const [brokerUp, setBrokerUp] = useState(true);
            const [pending, setPending] = useState(false);
            const [delivered, setDelivered] = useState(0);
            const [dots, setDots] = useState(Array.from({ length: 4 }, () => ({ x: 0, y: 0, show: false, tone: 'amber' })));
            const [txActive, setTxActive] = useState(false);
            const [relayActive, setRelayActive] = useState(false);
            const [note, setNote] = useState('idle');
            const [badge, setBadge] = useState(null);
            const [log, setLog] = useState([]);

            useEffect(() => {
                const measure = () => {
                    if (!wrapRef.current || !txRef.current || !relayRef.current || !brokerRef.current) return;
                    const c = wrapRef.current.getBoundingClientRect();
                    const rel = ref => { const b = ref.current.getBoundingClientRect(); return { x: b.left - c.left + b.width / 2, y: b.top - c.top + b.height / 2 }; };
                    setLines({ a: rel(txRef), b: rel(relayRef), c: rel(brokerRef) });
                    if (!readyRef.current) { readyRef.current = true; setReady(true); }
                };
                measure();
                const ro = new ResizeObserver(measure);
                ro.observe(wrapRef.current);
                window.addEventListener('resize', measure);
                return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
            }, []);

            const setBusyBoth = v => { busyRef.current = v; setBusy(v); };
            const appendLog = (...entries) => setLog(l => [...l, ...entries].slice(-4));
            const hideDots = () => setDots(d => d.map(x => ({ ...x, show: false })));
            const snapTo = (key, tone) => setDots(d => d.map((x, i) => (i === 0 ? { ...lines[key], show: true, tone } : { ...x, show: false })));
            const moveTo = async (key, tone) => {
                const p = lines[key];
                setDots(d => { const n = [...d]; n[0] = { ...p, show: true, tone }; return n; });
                [1, 2, 3].forEach(i => setTimeout(() => setDots(d => { const n = [...d]; n[i] = { ...p, show: true, tone }; return n; }), i * 90));
                await sleep(HOP);
            };

            const commit = async () => {
                snapTo('a', 'amber'); setBadge(null);
                await sleep(LEAD);
                setTxActive(true); setNote('one COMMIT: payout row + outbox row');
                await sleep(CHECK);
                setTxActive(false);
                await moveTo('b', 'amber');
                setRelayActive(true); setNote('SELECT ... FOR UPDATE SKIP LOCKED');
                await sleep(CHARGE_IN);
                if (brokerUpRef.current) {
                    await moveTo('c', 'amber');
                    await sleep(CHARGE_IN);
                    setDelivered(n => n + 1);
                    setRelayActive(false);
                    setBadge({ text: 'published', tone: 'amber' });
                    appendLog(
                        { dir: 'req', text: 'Append(payout-42) + Fetch + Publish' },
                        { dir: 'res', text: 'MarkPublished(payout-42)', tone: 'amber', note: 'same commit as the state change, delivered right after' }
                    );
                } else {
                    setRelayActive(false);
                    pendingRef.current = true; setPending(true);
                    setBadge({ text: 'waiting — broker down', tone: 'rose' });
                    appendLog(
                        { dir: 'req', text: 'Append(payout-42)  — row committed' },
                        { dir: 'res', text: 'Publish: broker unreachable', tone: 'rose', note: 'row stays unpublished — nothing lost, relay will retry' }
                    );
                }
                await sleep(CHARGE_OUT);
                hideDots();
            };

            const retryDelivery = async () => {
                snapTo('b', 'amber');
                setRelayActive(true); setNote('lease reclaimed — retrying publish');
                await sleep(CHECK);
                await moveTo('c', 'amber');
                await sleep(CHARGE_IN);
                setDelivered(n => n + 1);
                setRelayActive(false);
                pendingRef.current = false; setPending(false);
                setBadge({ text: 'published (after retry)', tone: 'amber' });
                appendLog(
                    { dir: 'req', text: 'Fetch()  same row, still unpublished' },
                    { dir: 'res', text: 'Publish ok -> MarkPublished', tone: 'amber', note: 'broker back — the pending row is delivered, exactly once' }
                );
                await sleep(CHARGE_OUT);
                hideDots();
            };

            const flipBroker = async (up) => {
                brokerUpRef.current = up; setBrokerUp(up);
                if (up && pendingRef.current) await retryDelivery();
            };

            const doReset = () => { setDelivered(0); setLog([]); setBadge(null); setNote('idle'); pendingRef.current = false; setPending(false); brokerUpRef.current = true; setBrokerUp(true); hideDots(); };

            const guardedRun = async fn => {
                if (busyRef.current || !lines) return;
                setBusyBoth(true);
                await fn();
                setBusyBoth(false);
            };

            const onCommit = () => { manualRef.current = true; guardedRun(commit); };
            const onToggle = () => { manualRef.current = true; guardedRun(() => flipBroker(!brokerUpRef.current)); };
            const onReset = () => { manualRef.current = true; if (!busyRef.current) doReset(); };

            useEffect(() => {
                if (!ready) return;
                let stopped = false;
                (async () => {
                    await sleep(300);
                    while (!stopped && !manualRef.current) {
                        await guardedRun(commit);
                        if (stopped || manualRef.current) break;
                        await sleep(900);
                        await guardedRun(() => flipBroker(false));
                        if (stopped || manualRef.current) break;
                        await sleep(700);
                        await guardedRun(commit);
                        if (stopped || manualRef.current) break;
                        await sleep(1500);
                        await guardedRun(() => flipBroker(true));
                        if (stopped || manualRef.current) break;
                        await sleep(1600);
                        doReset();
                        await sleep(650);
                    }
                })();
                return () => { stopped = true; };
            }, [ready]);

            const primaryBtn = 'font-mono text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors disabled:opacity-30 disabled:cursor-not-allowed ' +
                'bg-amber-400 text-slate-950 hover:bg-amber-300 disabled:hover:bg-amber-400';
            const secondaryBtn = 'font-mono text-xs sm:text-sm font-medium px-4 py-2.5 rounded-lg border-2 transition-colors disabled:opacity-30 disabled:cursor-not-allowed ' +
                'border-slate-600 text-slate-100 hover:border-amber-400 hover:text-amber-300 disabled:hover:border-slate-600 disabled:hover:text-slate-100';
            const ghostBtn = 'font-mono text-xs sm:text-sm px-4 py-2.5 rounded-lg text-slate-500 hover:text-slate-200 transition-colors disabled:opacity-30';

            return (
                <div className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 sm:p-8 relative overflow-hidden">
                    <div className="absolute inset-0 bg-grid opacity-40 pointer-events-none" />

                    <div className="relative z-10 flex flex-wrap items-end justify-between gap-4 mb-7 sm:mb-9">
                        <div>
                            <p className="font-mono text-[11px] sm:text-xs uppercase tracking-wider text-slate-500 mb-1">delivered</p>
                            <p className="font-mono text-4xl sm:text-6xl font-bold text-amber-300 tabular-nums leading-none">{delivered}</p>
                        </div>
                        <div className="min-h-[46px] sm:min-h-[56px] flex items-center">
                            {badge && (
                                <span className={'font-mono text-sm sm:text-lg font-bold px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl border-2 ' +
                                    (badge.tone === 'rose' ? 'text-rose-300 border-rose-400 bg-rose-400/10' : 'text-amber-300 border-amber-400 bg-amber-400/10')}>
                                    {badge.text}
                                </span>
                            )}
                        </div>
                    </div>

                    <div ref={wrapRef} className="relative z-10">
                        {lines && (
                            <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 0 }}>
                                <line x1={lines.a.x} y1={lines.a.y} x2={lines.b.x} y2={lines.b.y} stroke="#334155" strokeWidth="2" />
                                <line x1={lines.b.x} y1={lines.b.y} x2={lines.c.x} y2={lines.c.y} stroke="#334155" strokeWidth="2" />
                            </svg>
                        )}

                        <div className="relative flex flex-col sm:flex-row gap-5 sm:gap-8" style={{ zIndex: 1 }}>
                            <BigBox ref={txRef} icon="db" label="business tx" active={txActive} sub={txActive ? note : ' '}>payout row + outbox row</BigBox>
                            <BigBox ref={relayRef} icon="relay" label="outbox.Relay" active={relayActive} tone={dots[0].tone} sub={relayActive ? note : (pending ? 'row unpublished, waiting' : 'idle, polling')}>poll · publish · mark</BigBox>
                            <BigBox ref={brokerRef} icon="stack" label="Kafka" active={!pending && dots[0].tone !== 'rose' && brokerUp} dead={!brokerUp} sub={brokerUp ? 'online' : 'OFFLINE'}>broker</BigBox>
                        </div>

                        {[3, 2, 1, 0].map(i => {
                            const dot = dots[i];
                            const size = [11, 8, 6, 4][i];
                            const op = [1, 0.55, 0.3, 0.15][i];
                            const color = dot.tone === 'rose' ? '#fb7185' : '#fbbf24';
                            return (
                                <div key={i} className="absolute rounded-full pointer-events-none" style={{
                                    width: size, height: size, left: dot.x, top: dot.y, transform: 'translate(-50%,-50%)',
                                    zIndex: 2, opacity: dot.show ? op : 0, background: color,
                                    boxShadow: i === 0 ? `0 0 18px 5px ${dot.tone === 'rose' ? 'rgba(251,113,133,.85)' : 'rgba(251,191,36,.85)'}` : 'none',
                                    transition: 'left 360ms ease, top 360ms ease, opacity 250ms ease',
                                }} />
                            );
                        })}
                    </div>

                    <div className="relative z-10 rounded-lg border border-slate-800 bg-black/40 px-4 py-3 min-h-[92px] mt-7 sm:mt-9">
                        {log.length === 0 && <p className="font-mono text-[12px] text-slate-600">// autoplaying — or press "commit payout"</p>}
                        {log.map((entry, i) => <LogLine key={i} entry={entry} />)}
                    </div>

                    <div className="demo-actions relative z-10 flex flex-wrap items-center gap-2.5 mt-5">
                        <button onClick={onCommit} disabled={busy} className={primaryBtn}>commit payout</button>
                        <button onClick={onToggle} disabled={busy} className={secondaryBtn}>{brokerUp ? 'kill broker' : 'restore broker'}</button>
                        <button onClick={onReset} disabled={busy} className={ghostBtn}>reset</button>
                        <span className="font-mono text-[11px] text-slate-600 ml-auto">aggregate: payout-42</span>
                    </div>
                </div>
            );
        };

        const HeroDiagram = () => (
            <section className="max-w-[1360px] mx-auto px-5 sm:px-6 pt-6 sm:pt-10 pb-10 sm:pb-16">
                <div className="grid lg:grid-cols-[520px_1fr] gap-8 lg:gap-14 items-start">
                    <div className="lg:pt-6">
                        <p className="font-mono text-xs sm:text-sm text-amber-400 tracking-wide mb-3">go · transactional outbox</p>
                        <h1 className="font-mono text-5xl sm:text-6xl lg:text-7xl font-bold text-white tracking-tight mb-5 leading-[1.02]">outbox</h1>
                        <p className="text-slate-300 text-base sm:text-lg leading-relaxed mb-7">
                            The event commits in the <code className="font-mono text-amber-300">same transaction</code> as the state change. Kill the broker and the row just waits — nothing lost, nothing sent twice.
                        </p>
                        <div className="flex flex-wrap gap-3">
                            <a href={GITHUB_URL} target="_blank" rel="noopener" className="inline-flex items-center gap-2 bg-amber-400 text-slate-950 font-semibold text-sm px-6 py-3 rounded-lg hover:bg-amber-300 transition-colors">
                                Code on GitHub
                            </a>
                        </div>
                    </div>
                    <Diagram />
                </div>
            </section>
        );

        const Code = () => (
            <section className="max-w-[1360px] mx-auto px-5 sm:px-6 py-8 sm:py-10">

<span className="text-slate-500">tx</span><span className="text-slate-400">, _ := db.BeginTx(ctx, nil)</span>{"\n"}<span className="text-slate-500">{"//"} ... business writes on tx ...</span>{"\n"}<span className="text-slate-400">if err := </span><span className="text-slate-500">sqlStore</span><span className="text-slate-400">.</span><span className="text-amber-300">Append</span><span className="text-slate-400">(ctx, tx, msg); err != nil {"{"}</span>{"\n"}    <span className="text-slate-400">tx.Rollback()</span>{"\n"}    <span className="text-slate-400">return err</span>{"\n"}<span className="text-slate-400">{"}"}</span>{"\n"}<span className="text-slate-400">tx.</span><span className="text-amber-300">Commit</span><span className="text-slate-400">()</span> <span className="text-slate-500">{"//"} event and state change are now atomic</span>
                    </code>
                </pre>
            </section>

        const GUARANTEES = [
            'The outbox row is written in the same local transaction as the business state — the event and the state change are atomic by construction, no dual-write window.',
            'SELECT ... FOR UPDATE SKIP LOCKED lets several relay instances share one table without blocking each other or double-claiming a row.',
            'A row is marked published only after Publish returns nil — a crash mid-flight leaves it unpublished, and it is safely retried, not lost or duplicated at the row level.',

        ];

        const Guarantees = () => (

                <div className="flex flex-wrap gap-2 mt-6">
                    {['Go', 'Kafka', 'database/sql', 'property + fuzz tested'].map(t => (
