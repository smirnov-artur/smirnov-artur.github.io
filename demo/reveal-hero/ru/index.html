<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Чистый воздух, ясный ум. Везде.</title>
    <meta name="description" content="g.a.d. — очиститель воздуха PureFlow One. Проведите курсором по фото героя, чтобы открыть мягкое круговое окно и увидеть маску под ним.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } }</script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        body{font-family:'Inter',sans-serif;overflow-x:hidden}
        html{overflow-x:hidden}
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        const BG_IMAGE_1 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260512_012043_9764f2d0-5c6e-4faa-94a6-a8253df08c5e.png&w=1280&q=85';
        const BG_IMAGE_2 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260512_012949_6b24738e-6e5f-4b6f-93d7-5772f4d32285.png&w=1280&q=85';
        const SPOTLIGHT_R = 260;
        const NAV_ITEMS = ['Устройство', 'Отзывы', 'Наука', 'Тарифы', 'Контакты'];

        const GadLogo = ({ className, style }) => (
            <svg className={'gad-logo ' + (className || '')} style={style} viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
                <path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/>
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
            </svg>
        );

        const RevealLayer = ({ cursorPos }) => {
            const divRef = useRef(null);
            const canvasRef = useRef(null);
            if (!canvasRef.current) canvasRef.current = document.createElement('canvas');

            useEffect(() => {
                const canvas = canvasRef.current;
                const setSize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                setSize();
                window.addEventListener('resize', setSize);
                return () => window.removeEventListener('resize', setSize);
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const g = ctx.createRadialGradient(cursorPos.x, cursorPos.y, 0, cursorPos.x, cursorPos.y, SPOTLIGHT_R);
                g.addColorStop(0, 'rgba(255,255,255,1)');
                g.addColorStop(0.4, 'rgba(255,255,255,1)');
                g.addColorStop(0.6, 'rgba(255,255,255,0.75)');
                g.addColorStop(0.75, 'rgba(255,255,255,0.4)');
                g.addColorStop(0.88, 'rgba(255,255,255,0.12)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(cursorPos.x, cursorPos.y, SPOTLIGHT_R, 0, Math.PI * 2);
                ctx.fill();
                const url = 'url(' + canvas.toDataURL() + ')';
                if (divRef.current) {
                    divRef.current.style.maskImage = url;
                    divRef.current.style.webkitMaskImage = url;
                }
            }, [cursorPos]);

            return (
                <div
                    ref={divRef}
                    className="absolute inset-0 bg-center bg-cover bg-no-repeat z-30 pointer-events-none"
                    style={{
                        backgroundImage: 'url(' + BG_IMAGE_2 + ')',
                        maskSize: '100% 100%',
                        WebkitMaskSize: '100% 100%',
                        maskRepeat: 'no-repeat',
                        WebkitMaskRepeat: 'no-repeat',
                    }}
                />
            );
        };

        const App = () => {
            const [menuOpen, setMenuOpen] = useState(false);
            const [cursorPos, setCursorPos] = useState({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const heroRef = useRef(null);
            const patternRef = useRef(null);
            const mouse = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const smooth = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const gridOffset = useRef({ x: 0, y: 0 });

            useEffect(() => { window.lucide && window.lucide.createIcons(); }, [menuOpen]);

            useEffect(() => {
                const onMove = e => { mouse.current = { x: e.clientX, y: e.clientY }; };
                window.addEventListener('mousemove', onMove);
                let raf;
                const tick = () => {
                    smooth.current.x += (mouse.current.x - smooth.current.x) * 0.1;
                    smooth.current.y += (mouse.current.y - smooth.current.y) * 0.1;
                    const rect = heroRef.current
                        ? heroRef.current.getBoundingClientRect()
                        : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
                    const cx = (smooth.current.x - rect.left) / rect.width - 0.5;
                    const cy = (smooth.current.y - rect.top) / rect.height - 0.5;
                    gridOffset.current.x += (cx * 16 - gridOffset.current.x) * 0.06;
                    gridOffset.current.y += (cy * 16 - gridOffset.current.y) * 0.06;
                    if (patternRef.current) {
                        patternRef.current.setAttribute('x', gridOffset.current.x);
                        patternRef.current.setAttribute('y', gridOffset.current.y);
                    }
                    setCursorPos({ x: smooth.current.x, y: smooth.current.y });
                    raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);
                return () => { window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
            }, []);

            return (
                <div className="min-h-screen bg-white" style={{ fontFamily: 'Inter, sans-serif' }}>
                    <nav className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5 sm:px-8 py-4 sm:py-5">
                        <div className="flex items-center">
                            <GadLogo style={{ height: 26, color: '#111111' }} />
                        </div>

                        <div className="hidden md:flex absolute left-1/2 -translate-x-1/2 bg-gray-900 rounded-full px-2 py-1.5 items-center gap-1">
                            {NAV_ITEMS.map((item, i) => (
                                i === 0
                                    ? <button key={item} className="bg-white text-gray-900 text-sm font-medium px-4 py-1.5 rounded-full">{item}</button>
                                    : <button key={item} className="text-gray-300 text-sm font-medium px-4 py-1.5 rounded-full hover:text-white transition-colors">{item}</button>
                            ))}
                        </div>

                        <button className="hidden md:flex bg-gray-900 text-white text-sm font-medium px-5 py-2 rounded-full items-center gap-2 hover:bg-gray-700 transition-colors">
                            <span className="w-2 h-2 rounded-full bg-green-400 inline-block"></span>
                            Забронировать
                        </button>

                        <button className="md:hidden text-gray-900 p-1" onClick={() => setMenuOpen(!menuOpen)}>
                            <i data-lucide={menuOpen ? 'x' : 'menu'} className="w-[22px] h-[22px]"></i>
                        </button>
                    </nav>

                    {menuOpen && (
                        <div className="fixed top-0 left-0 right-0 z-40 bg-white pt-16 pb-6 px-5 shadow-lg flex flex-col gap-1 md:hidden">
                            {NAV_ITEMS.map(item => (
                                <button key={item} className="text-gray-800 text-base font-medium py-3 border-b border-gray-100 text-left hover:text-gray-500 transition-colors">{item}</button>
                            ))}
                            <button className="mt-4 bg-gray-900 text-white text-sm font-medium px-5 py-3 rounded-full flex items-center gap-2 justify-center hover:bg-gray-700 transition-colors">
                                <span className="w-2 h-2 rounded-full bg-green-400 inline-block"></span>
                                Забронировать
                            </button>
                        </div>
                    )}

                    <section ref={heroRef} className="relative w-full overflow-hidden" style={{ height: '100vh' }}>
                        <svg className="absolute inset-0 w-full h-full z-0 pointer-events-none opacity-10">
                            <defs>
                                <pattern ref={patternRef} id="grid" width="48" height="48" patternUnits="userSpaceOnUse" x="0" y="0">
                                    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" strokeWidth="0.6" />
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#grid)" />
                        </svg>

                        <div className="absolute inset-0 bg-center bg-cover bg-no-repeat z-10" style={{ backgroundImage: 'url(' + BG_IMAGE_1 + ')' }}></div>

                        <RevealLayer cursorPos={cursorPos} />

                        <div className="absolute bottom-12 sm:bottom-12 md:bottom-56 left-5 sm:left-8 md:left-12 max-w-[260px] sm:max-w-xs z-50">
                            <p className="text-[10px] sm:text-[11px] font-semibold tracking-[0.18em] text-gray-600 uppercase mb-2 sm:mb-3">PureFlow One</p>
                            <h1 className="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-900 leading-tight mb-4 sm:mb-6">Чистый воздух,<br />ясный ум. Везде.</h1>
                            <div className="flex items-center gap-3 sm:gap-4">
                                <button className="bg-gray-900 text-white text-xs sm:text-sm font-medium px-4 sm:px-6 py-2 sm:py-2.5 rounded-full hover:bg-gray-700 transition-colors">Подробнее</button>
                                <button className="flex items-center gap-2 text-gray-700 text-xs sm:text-sm font-medium hover:text-gray-900 transition-colors">
                                    <i data-lucide="play" className="w-3 h-3 fill-gray-700"></i>
                                    Характеристики
                                </button>
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
