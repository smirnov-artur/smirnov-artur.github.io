        function getCols() {

        function buildLayout(count, cols) {
            const rows = [];
            let placed = 0, r = 0;
            while (placed < count) {
                const row = new Array(cols).fill(-1);
                const a = (r * 2 + (r % 2)) % cols;
                row[a] = placed++;
                if (r % 3 === 0 && placed < count) {
                    let b = (a + 2) % cols;
                    if (b === a) b = (a + 1) % cols;
                    row[b] = placed++;
                }
                rows.push(row);
                r++;
            }
            return rows;

            cardsRef.current = [];

            useEffect(() => {
                const onResize = () => {

                };

            }, []);

            useEffect(() => {

                    const vh = window.innerHeight;
                    const contentH = wrapRef.current ? wrapRef.current.scrollHeight : 0;
                    const maxScroll = Math.max(0, contentH - vh);
                    maxScrollRef.current = maxScroll;
                    if (spacerRef.current) spacerRef.current.style.height = (vh + maxScroll + 2 * vh) + 'px';
                };
                recalc();
                window.addEventListener('resize', recalc);
                return () => window.removeEventListener('resize', recalc);
            }, [rows]);

            useEffect(() => {
                let raf;
                const tick = () => {
                    const vh = window.innerHeight;
                    const scrollY = window.scrollY;
                    const maxScroll = maxScrollRef.current;

                    const panelY = Math.min(vh, Math.max(0, vh - scrollY));
                    if (panelRef.current) panelRef.current.style.transform = `translateY(${panelY}px)`;

                    const wrapY = scrollY > vh ? -(Math.min(scrollY, vh + maxScroll) - vh) : 0;
                    if (wrapRef.current) wrapRef.current.style.transform = `translateY(${wrapY}px)`;

                    cardsRef.current.forEach((el) => {
                        if (!el) return;
                        const r = el.getBoundingClientRect();
                        if (r.bottom <= 0 || r.top >= vh) { el.style.transform = 'scale(0)'; return; }
                        const enter = Math.min(1, (vh - r.top) / (vh * 0.6));

                    if (canvasRef.current) canvasRef.current.style.visibility = scrollY > vh ? 'hidden' : 'visible';

                    const outroStart = vh + maxScroll;
                    const outroRange = Math.max(1, vh - 100);
                    const progress = Math.max(0, Math.min(1, (scrollY - outroStart) / outroRange));
                    if (overlayRef.current) overlayRef.current.style.opacity = String(progress);
                    if (footerRef.current) footerRef.current.style.opacity = String(progress);
                    if (buyRef.current) buyRef.current.style.transform = `scale(${progress})`;
                    if (infoRef.current) {
                        const offset = window.innerWidth < 640 ? 132 : 166;
                        infoRef.current.style.transform = progress > 0 ? `translateY(${-offset * progress}px)` : '';

                let last = 0;
                const onScroll = () => {
                    const now = performance.now();
                    if (now - last < 80) return;
                    last = now;
                    setSymbol(SYMS[Math.floor(Math.random() * SYMS.length)]);
                };
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            useEffect(() => {
                if (!isDesktop) return;
                const el = cursorRef.current;
                if (!el) return;
                const onMove = (e) => { el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px'; mouseXRef.current = e.clientX; };
                window.addEventListener('mousemove', onMove);
                return () => window.removeEventListener('mousemove', onMove);
            }, [isDesktop]);

            useEffect(() => {
                let leftReady = false, rightReady = false;
                const check = () => { if (leftReady && rightReady) setLoaded(true); };
                const l = leftRef.current, r = rightRef.current;
                const onL = () => { leftReady = true; check(); };
                const onR = () => { rightReady = true; check(); };
                if (l) l.addEventListener('loadeddata', onL);
                if (r) r.addEventListener('loadeddata', onR);
                return () => { if (l) l.removeEventListener('loadeddata', onL); if (r) r.removeEventListener('loadeddata', onR); };
            }, []);

            useEffect(() => {
                const left = leftRef.current, right = rightRef.current;
                if (!left || !right) return;

                if (isDesktop) {
                    let raf;
                    const tick = () => {
                        const width = window.innerWidth;
                        const x = mouseXRef.current;
                        const center = width / 2;
                        const dead = Math.max(30, width * 0.05);
                        if (Math.abs(x - center) <= dead) {
                            const cur = activeSideRef.current === 'left' ? left : right;
                            if (cur && !cur.seeking) cur.currentTime = 0;
                        } else if (x < center - dead) {
                            activeSideRef.current = 'right';
                            left.style.display = 'none'; right.style.display = 'block';
                            const range = Math.max(1, center - dead);
                            const dist = Math.max(0, (center - dead) - x);
                            const progress = Math.min(1, dist / range);
                            if (right.duration && !right.seeking) right.currentTime = progress * right.duration;
                        } else {
                            activeSideRef.current = 'left';
                            right.style.display = 'none'; left.style.display = 'block';
                            const range = Math.max(1, width - (center + dead));
                            const dist = Math.max(0, x - (center + dead));
                            const progress = Math.min(1, dist / range);
                            if (left.duration && !left.seeking) left.currentTime = progress * left.duration;
                        }
                        raf = requestAnimationFrame(tick);
                    };
                    raf = requestAnimationFrame(tick);
                    return () => cancelAnimationFrame(raf);
                }

                const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reduce) return;
                const swapTo = (toLeft) => {
                    left.style.display = toLeft ? 'block' : 'none';
                    right.style.display = toLeft ? 'none' : 'block';
                    const v = toLeft ? left : right;
                    try { v.currentTime = 0; } catch (e) {}
                    v.play().catch(() => {});
                };
                const onLeftEnded = () => swapTo(false);
                const onRightEnded = () => swapTo(true);
                left.addEventListener('ended', onLeftEnded);
                right.addEventListener('ended', onRightEnded);
                swapTo(false);
                return () => {
                    left.removeEventListener('ended', onLeftEnded);
                    right.removeEventListener('ended', onRightEnded);
                };
            }, [isDesktop]);

            return (
                <div id="scroll-spacer" ref={spacerRef}>
                    {isDesktop && (
                        <div className="cursor-dot" ref={cursorRef}><CursorGlyph /></div>
                    )}

                    <div className="hero-logo"><GadLogo /></div>

                    <p className="hero-caption">
                        При переключении между видео возле центра не сбрасывайте currentTime резко в 0. Добавьте небольшую мёртвую зону: если курсор в пределах +/-50px от центра, оставляйте оба видео на currentTime = 0 и показывайте то, что было активно последним.
                    </p>

                    <nav className="hero-nav">
                        <span className="nav-about">О нас</span>
                        <div className="nav-icons">
                            <Burger />
                            <span className="nav-cart">[ КОРЗИНА ]</span>
                        </div>
                    </nav>

                    <div className="hero-info" ref={infoRef}>
                        <div className="info-top">
                            <div className="info-circle">
                                <InfoCircle />
                                <span id="circle-symbol">{symbol}</span>
                            </div>
                        </div>
                        <p className="info-label">АРХИВНАЯ КОЛЛЕКЦИЯ<br />«g.a.d.»</p>
                        <p className="info-price">$97,33</p>
                    </div>

                    <div className="hero-buy" ref={buyRef}><span>смотреть</span></div>

                    <div className={`hero-canvas${loaded ? ' is-loaded' : ''}`} ref={canvasRef}>
                        <video ref={leftRef} src={LEFT_SRC} style={{ display: 'none' }} muted playsInline preload="auto" />
                        <video ref={rightRef} src={RIGHT_SRC} style={{ display: 'block' }} muted playsInline preload="auto" />
                    </div>

                    <div className="hero-overlay" ref={overlayRef}></div>

                    <div className="hero-footer" ref={footerRef}>
                        <span>g.a.d. (r) 2026</span>
                        <span>политика конфиденциальности</span>
                    </div>

                    <div className="bp-panel" ref={panelRef}>
                        <div className="bp-wrap" ref={wrapRef}>
                            <div className="bp-grid">
                                {rows.map((row, ri) => row.map((cell, ci) => (
                                    cell === -1
                                        ? <div className="bp-cell" key={`${ri}-${ci}`}></div>
                                        : (
                                            <div className="bp-cell" key={`${ri}-${ci}`}>
                                                <div
                                                    className="bp-card"
                                                    ref={(el) => { cardsRef.current[cell] = el; }}
                                                    style={{ transformOrigin: ci < cols / 2 ? 'right bottom' : 'left bottom' }}
                                                >
                                                    <img src={GALLERY[cell]} alt={`Архивный образ ${cell + 1}`} loading="lazy" decoding="async" />
                                                </div>
                                            </div>
                                        )
                                )))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
