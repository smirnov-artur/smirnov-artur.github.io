            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,

            mask-composite: exclude;
            pointer-events: none;
        }
        .liquid-glass:hover {
            background: rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }
        .liquid-glass:active { transform: scale(0.98); }

        const StaggeredFade = ({ text, className }) => {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true });
            return (
                <span ref={ref} className={className}>
                    {Array.from(text).map((char, i) => (
                        <motion.span
                            key={i}
                            style={{ display: 'inline-block' }}
                            initial="hidden"
                            animate={isInView ? 'show' : 'hidden'}
                            variants={{
                                hidden: { opacity: 0 },
                                show: { opacity: 1, y: 0, transition: { delay: i * 0.07 } },
                            }}
                        >
                            {char === ' ' ? ' ' : char}
                        </motion.span>
                    ))}
                </span>
            );
        };

        const NAV_LINKS = ['Wander', 'Archive', 'Story', 'Connect'];
        const VIDEO_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260619_191346_9d19d66e-86a4-47f7-8dc6-712c1788c3b2.mp4';

                            onClick={() => setMenuOpen((v) => !v)}
                            aria-label="Toggle menu"
                            className="md:hidden text-white"
                        >

                        </button>
