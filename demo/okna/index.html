<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор пластиковых окон</title>
<style>
:root{--acc:#1f6feb}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:16px/1.4 system-ui,sans-serif;padding:16px}
main{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#666;font-size:14px;margin:0 0 16px}
label{display:block;font-size:14px;margin:16px 0 6px;font-weight:600}
input,select{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:10px;background:#fff}
input:focus,select:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.row{display:flex;gap:8px}
.row>div{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin:16px 0}
.chk input{width:auto}
.result{margin-top:24px;padding:16px;background:#f2f6ff;border-radius:10px}
.total{font-size:40px;font-weight:700;color:var(--acc);margin:0}
.lines{font-size:14px;color:#333;margin-top:8px}
.lines div{display:flex;justify-content:space-between;padding:2px 0}
a.cta{display:block;text-align:center;margin-top:16px;padding:14px;background:var(--acc);color:#fff;
text-decoration:none;border-radius:10px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Калькулятор пластиковых окон</h1>
<p class="sub">Цены примерные, точную назовёт замерщик</p>

<div class="row">
<div><label for="wd">Ширина проёма, мм</label><input id="wd" type="number" inputmode="decimal" min="400" max="3000" step="10" value="1300"></div>
<div><label for="ht">Высота проёма, мм</label><input id="ht" type="number" inputmode="decimal" min="400" max="3000" step="10" value="1400"></div>
</div>

<div class="row">
<div><label for="sash">Створок</label>
<select id="sash"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div>
<div><label for="open">Открывающихся</label><input id="open" type="number" inputmode="decimal" min="0" max="3" step="1" value="1"></div>
</div>

<label for="profile">Профиль</label>
<select id="profile">
<option value="6500">3 камеры — 6 500 ₽/м²</option>
<option value="8200">5 камер — 8 200 ₽/м²</option>
<option value="9800">7 камер — 9 800 ₽/м²</option>
</select>

<label for="glass">Стеклопакет</label>
<select id="glass">
<option value="0">Однокамерный — в цене</option>
<option value="1400">Двухкамерный — +1 400 ₽/м²</option>
<option value="2200">Энергосберегающий — +2 200 ₽/м²</option>
</select>

<div class="row">
<div><label for="sill">Подоконник, см</label><input id="sill" type="number" inputmode="decimal" min="0" max="60" step="1" value="30"></div>
<div><label for="otliv">Отлив</label><select id="otliv"><option value="0">Нет</option><option value="1" selected>Да</option></select></div>
</div>

<div class="chk">
<input id="net" type="checkbox" checked>
<label for="net" style="margin:0">Москитная сетка, 1 200 ₽</label>
</div>

<div class="result">
<p class="total" id="total" aria-live="polite">0 ₽</p>
<div class="lines" id="lines"></div>
</div>

<a class="cta" id="cta" href="https://t.me/smirnovarturr?text=" target="_blank" rel="noopener">Получить точный расчёт</a>
</main>
<script>
const $=id=>document.getElementById(id);
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'}
function calc(){
 const wd=+$('wd').value||0, ht=+$('ht').value||0;
 const area=(wd/1000)*(ht/1000);
 const opens=+$('open').value||0;
 const profile=+$('profile').value;
 const glass=+$('glass').value;
 const sill=+$('sill').value||0;
 const otliv=+$('otliv').value;
 const net=$('net').checked;

 const profileCost=area*profile;
 const glassCost=area*glass;
 const opensCost=opens*2500;
 const sillCost=sill>0?(wd/1000)*900:0;
 const otlivCost=otliv?(wd/1000)*700:0;
 const netCost=net?1200:0;
 let subtotal=profileCost+glassCost+opensCost+sillCost+otlivCost+netCost;
 const montage=subtotal*0.15;
 const demontage=1500;
 const total=subtotal+montage+demontage;

 $('total').textContent=fmt(total);
 $('lines').innerHTML=`
  <div><span>Площадь</span><span>${area.toFixed(2)} м²</span></div>
  <div><span>Профиль</span><span>${fmt(profileCost)}</span></div>
  <div><span>Стеклопакет</span><span>${fmt(glassCost)}</span></div>
  <div><span>Открывающиеся створки</span><span>${fmt(opensCost)}</span></div>
  <div><span>Подоконник</span><span>${fmt(sillCost)}</span></div>
  <div><span>Отлив</span><span>${fmt(otlivCost)}</span></div>
  <div><span>Москитная сетка</span><span>${fmt(netCost)}</span></div>
  <div><span>Монтаж 15 %</span><span>${fmt(montage)}</span></div>
  <div><span>Демонтаж старого</span><span>${fmt(demontage)}</span></div>`;
 const text=`Окно ${wd}×${ht} мм, площадь ${area.toFixed(2)} м², створок ${$('sash').value}. Расчёт: ${fmt(total)}`;
 $('cta').href='https://t.me/smirnovarturr?text='+encodeURIComponent(text);
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));
calc();
</script>
<!--
Таблица цен (правьте цифры без программиста):
Открывающаяся створка: +2 500 ₽
Профиль: 3 камеры 6 500 ₽/м², 5 камер 8 200, 7 камер 9 800
Стеклопакет: однокамерный в цене, двухкамерный +1 400 ₽/м², энергосберегающий +2 200 ₽/м²
Подоконник: 900 ₽/п.м по ширине окна
Отлив: 700 ₽/п.м
Москитная сетка: 1 200 ₽/шт
Монтаж: 15% от суммы + демонтаж 1 500 ₽
-->
</body>
</html>
