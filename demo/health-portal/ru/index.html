<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Health - Качественная стоматология</title>
    <meta name="description" content="Стоматологическая клиника с современным оборудованием: эстетика улыбки, восстановление зубов имплантами и внимательный сервис.">
    <link href="https://db.onlinewebfonts.com/c/1cd1e7d71e048159076fd90b39846902?family=Open+Sauce+One" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/42acf9aa4a6dc2f2886a3f682e337ead?family=Open+Sauce+One+Bold" rel="stylesheet">
    <style>
        /* the "Bold" link above registers a separate family; re-declare its file under the
           regular family at weight 700 so Tailwind's font-semibold/bold/extrabold classes
           pick the real bold face instead of the browser's synthetic bold. */
        @font-face{
            font-family:'Open Sauce One';
            src:url('https://db.onlinewebfonts.com/t/42acf9aa4a6dc2f2886a3f682e337ead.woff2') format('woff2'),
                url('https://db.onlinewebfonts.com/t/42acf9aa4a6dc2f2886a3f682e337ead.woff') format('woff');
            font-weight:700;
            font-style:normal;
            font-display:swap;
        }
    </style>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style type="text/tailwindcss">
        @layer base {
            html, body, #root {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: 'Open Sauce One', -apple-system, BlinkMacSystemFont, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
        }
    </style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'Open Sauce One';font-style:normal;font-weight:700;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggqxSuXd.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Open Sauce One';font-style:normal;font-weight:700;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Open Sauce One';font-style:normal;font-weight:normal;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggqxSuXd.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Open Sauce One';font-style:normal;font-weight:normal;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const zeroPos = { x: 0, y: 0, sw: 0, sh: 0 };

        const HERO_IMAGE = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_113640_ccf3cf97-d447-425b-a134-d7b09fc743fc.png&w=1280&q=85';
        const SECTION2_IMAGE = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_114219_414dfe80-f15c-4e25-bf52-b13721f4bd88.png&w=1280&q=85';
        const SECTION3_IMG1 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_115253_c19ab167-8dd5-48b4-967d-b9f0d9d6e8fb.png&w=1280&q=85';
        const SECTION3_IMG2 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_115237_fc519057-6e87-4abf-999a-9610b8b085b4.png&w=1280&q=85';
        const SECTION3_BG = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260624_114355_752ba9e6-0942-4abb-9047-5d9bb16632e9.png&w=1280&q=85';

        const featureBars = ['Передовая стоматология', 'Современное оборудование', 'Дружелюбный персонал'];

        const services = [
            { name: 'Зубные\nвиниры', num: '01', active: true },
            { name: 'Зубные\nкоронки', num: '02', active: false },
            { name: 'Отбеливание\nзубов', num: '03', active: false },
            { name: 'Зубные\nимпланты', num: null, active: false },
        ];

        // ---- hooks ----

        function useIsMobile() {
            const [isMobile, setIsMobile] = useState(() => window.matchMedia('(max-width: 767px)').matches);
            useEffect(() => {
                const mq = window.matchMedia('(max-width: 767px)');
                const handler = (e) => setIsMobile(e.matches);
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, []);
            return isMobile;
        }

        function useMaskPositions(sectionRef, cardRefsRef) {
            const [positions, setPositions] = useState([]);
            useEffect(() => {
                const section = sectionRef.current;
                if (!section) return;
                const recompute = () => {
                    const sRect = section.getBoundingClientRect();
                    const next = cardRefsRef.current.map((el) => {
                        if (!el) return zeroPos;
                        const r = el.getBoundingClientRect();
                        return { x: r.left - sRect.left, y: r.top - sRect.top, sw: sRect.width, sh: sRect.height };
                    });
                    setPositions(next);
                };
                const ro = new ResizeObserver(recompute);
                ro.observe(section);
                return () => ro.disconnect();
            }, []);
            return positions;
        }

        function useImageWidth(src, sectionHeight) {
            const [natural, setNatural] = useState(null);
            useEffect(() => {
                if (!src) return;
                const img = new Image();
                img.onload = () => setNatural({ w: img.naturalWidth, h: img.naturalHeight });
                img.src = src;
            }, [src]);
            if (!natural || !sectionHeight) return 0;
            return natural.w * (sectionHeight / natural.h);
        }

        function useStaggeredReveal(count, threshold = 0.15) {
            const containerRef = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = containerRef.current;
                if (!el) return;
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            setVisible(true);
                            obs.disconnect();
                        }
                    });
                }, { threshold });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            const getAnimStyle = (index) => ({
                opacity: visible ? 1 : 0,
                transform: visible ? 'translateY(0)' : 'translateY(24px)',
                transition: `opacity 0.6s cubic-bezier(0.16,1,0.3,1) ${index * 120}ms, transform 0.6s cubic-bezier(0.16,1,0.3,1) ${index * 120}ms`,
            });
            return { containerRef, getAnimStyle };
        }

        // ---- masked card ----

        function MaskedCard({ bgImage, position, imageWidth, focalX, className, children, cardRef, style }) {
            const pos = position || zeroPos;
            const overflow = imageWidth > pos.sw ? imageWidth - pos.sw : 0;
            const focalOffset = overflow * focalX;
            return (
                <div
                    ref={cardRef}
                    className={className}
                    style={{
                        backgroundImage: `url(${bgImage})`,
                        backgroundSize: `auto ${pos.sh}px`,
                        backgroundPosition: `${-(pos.x + focalOffset)}px ${-pos.y}px`,
                        backgroundRepeat: 'no-repeat',
                        ...style,
                    }}
                >
                    {children}
                </div>
            );
        }

        // ---- splash screen ----

        function SplashScreen({ onComplete }) {
            const [count, setCount] = useState(0);
            const [exiting, setExiting] = useState(false);
            useEffect(() => {
                let step = 0;
                const iv = setInterval(() => {
                    step += 1;
                    setCount(step);
                    if (step >= 100) {
                        clearInterval(iv);
                        setTimeout(() => setExiting(true), 200);
                        setTimeout(() => onComplete(), 900);
                    }
                }, 20);
                return () => clearInterval(iv);
            }, []);
            return (
                <div className={`fixed inset-0 z-[100] bg-white flex items-end justify-start transition-opacity duration-700 ${exiting ? 'opacity-0' : 'opacity-100'}`}>
                    <span className="text-7xl md:text-9xl font-bold tabular-nums p-6 md:p-10 leading-none text-black">{count}</span>
                </div>
            );
        }

        // ---- navbar ----

        function Navbar() {
            const [open, setOpen] = useState(false);
            useEffect(() => {
                document.body.style.overflow = open ? 'hidden' : '';
                return () => { document.body.style.overflow = ''; };
            }, [open]);
            const links = ['Главная', 'Услуги', 'О нас', 'Галерея', 'Контакты'];
            return (
                <>
                    <nav className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 md:px-6 py-2 md:py-3 bg-white/80 backdrop-blur-md">
                        <div className="flex flex-col">
                            <span className="text-xl md:text-2xl font-extrabold uppercase tracking-tight leading-none">Dental</span>
                            <span className="text-xl md:text-2xl font-extrabold uppercase tracking-tight leading-none -mt-1.5 md:-mt-2">Health</span>
                            <span className="text-[8px] md:text-[9px] font-medium leading-none mt-1.5 md:mt-2">качественная стоматология</span>
                        </div>
                        <div className="hidden md:flex items-center gap-6">
                            <button type="button" className="px-6 py-3 bg-white rounded-full border border-black text-sm font-semibold hover:bg-black hover:text-white transition-colors duration-200">Меню</button>
                            <span className="text-sm font-semibold text-black">Экстренная помощь</span>
                        </div>
                        <button type="button" className="md:hidden w-10 h-10 flex items-center justify-center relative" onClick={() => setOpen(o => !o)} aria-label="Меню">
                            <span className={`absolute h-0.5 w-6 bg-black rounded-full transition-all duration-300 ease-[cubic-bezier(0.76,0,0.24,1)] ${open ? 'rotate-45 translate-y-0' : '-translate-y-2'}`}></span>
                            <span className={`absolute h-0.5 w-6 bg-black rounded-full transition-all duration-300 ease-[cubic-bezier(0.76,0,0.24,1)] ${open ? 'opacity-0 scale-x-0' : 'opacity-100 scale-x-100'}`}></span>
                            <span className={`absolute h-0.5 w-6 bg-black rounded-full transition-all duration-300 ease-[cubic-bezier(0.76,0,0.24,1)] ${open ? '-rotate-45 translate-y-0' : 'translate-y-2'}`}></span>
                        </button>
                    </nav>
                    <div className={`md:hidden fixed inset-0 z-40 ${open ? '' : 'pointer-events-none'}`}>
                        <div
                            className={`absolute inset-0 bg-black/20 backdrop-blur-sm transition-opacity duration-500 ${open ? 'opacity-100' : 'opacity-0'}`}
                            onClick={() => setOpen(false)}
                        ></div>
                        <div className={`absolute top-0 right-0 h-full w-[85%] max-w-sm bg-white shadow-2xl transition-transform duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${open ? 'translate-x-0' : 'translate-x-full'}`}>
                            <div className="flex flex-col justify-center h-full px-8 gap-1">
                                {links.map((l, i) => (
                                    <a
                                        key={l}
                                        href="#"
                                        onClick={(e) => { e.preventDefault(); setOpen(false); }}
                                        className={`text-4xl font-bold text-black hover:text-neutral-500 transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${open ? 'opacity-100 translate-x-0' : 'opacity-0 translate-x-8'}`}
                                        style={{ transitionDelay: open ? `${100 + i * 60}ms` : '0ms' }}
                                    >{l}</a>
                                ))}
                                <div
                                    className={`mt-8 pt-8 border-t border-neutral-200 transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${open ? 'opacity-100 translate-x-0' : 'opacity-0 translate-x-8'}`}
                                    style={{ transitionDelay: open ? '450ms' : '0ms' }}
                                >
                                    <p className="text-sm font-semibold text-black mb-4">Экстренная помощь</p>
                                    <button type="button" className="w-full px-6 py-4 bg-black rounded-full text-white text-sm font-semibold hover:bg-neutral-800 transition-colors duration-200">Записаться на приём</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        // ---- arrow icon ----

        function ArrowIcon({ className }) {
            return (
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" className={`rotate-[-45deg] ${className || ''}`}>
                    <path d="M1 7h12m0 0L8 2m5 5L8 12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
            );
        }

        // ---- app ----

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const isMobile = useIsMobile();

            const section1Ref = useRef(null);
            const cardRefs1 = useRef([]);
            const s1Reveal = useStaggeredReveal(4);
            const positions1 = useMaskPositions(section1Ref, cardRefs1);
            const imageWidth1 = useImageWidth(HERO_IMAGE, positions1[3]?.sh || positions1[0]?.sh || 0);

            const section2Ref = useRef(null);
            const cardRefs2 = useRef([]);
            const s2Reveal = useStaggeredReveal(4);
            const positions2 = useMaskPositions(section2Ref, cardRefs2);
            const imageWidth2 = useImageWidth(SECTION2_IMAGE, positions2[0]?.sh || 0);

            const s3Reveal = useStaggeredReveal(4);

            return (
                <div className="bg-white">
                    {showSplash && <SplashScreen onComplete={() => setShowSplash(false)} />}
                    <Navbar />

                    {/* SECTION 1 - HERO */}
                    <section
                        ref={(el) => { section1Ref.current = el; s1Reveal.containerRef.current = el; }}
                        className="h-screen w-full overflow-hidden flex flex-col pt-24 md:pt-24 px-3 md:px-5 pb-1.5 md:pb-2 gap-1.5 md:gap-2"
                    >
                        {featureBars.map((label, i) => (
                            <MaskedCard
                                key={label}
                                bgImage={HERO_IMAGE}
                                position={positions1[i]}
                                imageWidth={imageWidth1}
                                focalX={isMobile ? 0.7 : 0.8}
                                cardRef={(el) => cardRefs1.current[i] = el}
                                className="w-full h-14 md:h-20 shrink-0 rounded-xl md:rounded-2xl overflow-hidden relative"
                                style={s1Reveal.getAnimStyle(i)}
                            >
                                <span className="flex items-center justify-center h-full text-black text-lg md:text-3xl font-bold text-center relative z-10">{label}</span>
                            </MaskedCard>
                        ))}
                        <MaskedCard
                            bgImage={HERO_IMAGE}
                            position={positions1[3]}
                            imageWidth={imageWidth1}
                            focalX={isMobile ? 0.7 : 0.8}
                            cardRef={(el) => cardRefs1.current[3] = el}
                            className="w-full flex-1 min-h-0 rounded-xl md:rounded-2xl overflow-hidden relative"
                            style={s1Reveal.getAnimStyle(3)}
                        >
                            <p className="absolute top-4 left-4 md:top-7 md:left-7 text-black text-xs md:text-sm font-semibold leading-4 md:leading-5 max-w-[200px] md:max-w-[300px] z-10">
                                Профессиональная стоматология<br />на основе современных технологий
                            </p>
                            <div className="absolute bottom-5 left-3 md:bottom-8 md:left-4 z-10">
                                <span className="block text-black text-xs md:text-sm font-semibold mb-1 md:mb-2">Надёжный стоматолог в Вест-Нью-Йорке</span>
                                <h1 className="text-black text-[clamp(3rem,8.5vw,8.5rem)] font-bold leading-[0.9] tracking-tight">Здоровье<br />зубов</h1>
                            </div>
                            <p className="absolute bottom-6 right-4 md:bottom-10 md:right-8 text-white text-xs md:text-sm font-semibold z-10">Бесплатная консультация</p>
                        </MaskedCard>
                    </section>

                    {/* SECTION 2 - SMILE GALLERY */}
                    <section
                        ref={(el) => { section2Ref.current = el; s2Reveal.containerRef.current = el; }}
                        className="min-h-screen md:h-screen w-full overflow-hidden flex flex-col pt-1.5 md:pt-2 px-3 md:px-5 pb-1.5 md:pb-2 gap-1.5 md:gap-2"
                    >
                        <div className="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-2 grid-rows-[auto_auto_auto_auto] md:grid-rows-[1fr_1fr_0.8fr] gap-1.5 md:gap-2">
                            <MaskedCard
                                bgImage={SECTION2_IMAGE}
                                position={positions2[0]}
                                imageWidth={imageWidth2}
                                focalX={isMobile ? 0.65 : 0.8}
                                cardRef={(el) => cardRefs2.current[0] = el}
                                className="rounded-xl md:rounded-2xl overflow-hidden relative min-h-[160px] md:min-h-0"
                                style={s2Reveal.getAnimStyle(0)}
                            >
                                <h3 className="absolute top-4 left-5 md:top-6 md:left-7 text-white md:text-black text-2xl md:text-3xl font-bold z-10">Галерея улыбок</h3>
                                <span className="absolute bottom-4 left-5 md:bottom-6 md:left-7 text-white md:text-black text-xs md:text-sm font-semibold z-10">Наша эстетическая стоматология</span>
                            </MaskedCard>

                            <MaskedCard
                                bgImage={SECTION2_IMAGE}
                                position={positions2[1]}
                                imageWidth={imageWidth2}
                                focalX={isMobile ? 0.65 : 0.8}
                                cardRef={(el) => cardRefs2.current[1] = el}
                                className="md:row-span-2 rounded-xl md:rounded-2xl overflow-hidden relative min-h-[200px] md:min-h-0"
                                style={s2Reveal.getAnimStyle(1)}
                            >
                                <p className="absolute bottom-16 left-5 md:bottom-20 md:left-7 text-white text-xs md:text-sm font-semibold leading-4 md:leading-5 z-10">
                                    Мечтаете о красивой улыбке?<br />Звоните — поможем с преображением улыбки.
                                </p>
                                <button type="button" className="absolute bottom-4 right-4 md:bottom-6 md:right-6 px-5 py-3 md:px-8 md:py-5 bg-white rounded-full text-black text-base md:text-xl font-bold z-10 hover:scale-105 transition-transform">Позвонить</button>
                            </MaskedCard>

                            <MaskedCard
                                bgImage={SECTION2_IMAGE}
                                position={positions2[2]}
                                imageWidth={imageWidth2}
                                focalX={isMobile ? 0.65 : 0.8}
                                cardRef={(el) => cardRefs2.current[2] = el}
                                className="rounded-xl md:rounded-2xl overflow-hidden relative min-h-[160px] md:min-h-0"
                                style={s2Reveal.getAnimStyle(2)}
                            >
                                <h2 className="absolute top-4 left-5 md:top-6 md:left-7 text-white md:text-black text-[clamp(3rem,7vw,6rem)] font-bold leading-[0.9] z-10">Новая<br />улыбка</h2>
                            </MaskedCard>

                            <MaskedCard
                                bgImage={SECTION2_IMAGE}
                                position={positions2[3]}
                                imageWidth={imageWidth2}
                                focalX={isMobile ? 0.65 : 0.8}
                                cardRef={(el) => cardRefs2.current[3] = el}
                                className="col-span-1 md:col-span-2 rounded-xl md:rounded-2xl overflow-hidden relative min-h-[200px] md:min-h-0"
                                style={s2Reveal.getAnimStyle(3)}
                            >
                                <div className="absolute inset-0 z-10 flex flex-wrap md:flex-nowrap gap-1.5 md:gap-2 p-2 md:p-3">
                                    {services.map((svc) => (
                                        <div
                                            key={svc.name}
                                            className={`flex-1 min-w-[calc(50%-4px)] md:min-w-0 rounded-xl md:rounded-2xl p-3 md:p-5 flex flex-col justify-between ${svc.active ? 'bg-white/90 backdrop-blur-md' : 'bg-white/20 backdrop-blur-xl'}`}
                                        >
                                            <h3 className={`text-xl md:text-4xl font-bold leading-[1.05] whitespace-pre-line ${svc.active ? 'text-black' : 'text-white'}`}>{svc.name}</h3>
                                            {svc.num && (
                                                <span className={`self-end w-8 h-8 md:w-12 md:h-12 rounded-full border flex items-center justify-center text-xs md:text-sm font-semibold ${svc.active ? 'border-black text-black' : 'border-white text-white'}`}>{svc.num}</span>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </MaskedCard>
                        </div>
                    </section>

                    {/* SECTION 3 - IMPLANT DENTISTRY */}
                    <section
                        ref={s3Reveal.containerRef}
                        className="min-h-screen md:h-screen w-full overflow-hidden flex flex-col pt-1.5 md:pt-2 px-3 md:px-5 pb-1.5 md:pb-2 gap-1.5 md:gap-2"
                    >
                        <div className="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-2 gap-1.5 md:gap-2">
                            <div className="flex flex-col gap-1.5 md:gap-2">
                                <div className="rounded-xl md:rounded-2xl bg-stone-50 p-5 md:p-7 flex flex-col justify-between flex-[1.2] min-h-[180px] md:min-h-0" style={s3Reveal.getAnimStyle(0)}>
                                    <h2 className="text-[clamp(3rem,7vw,6.5rem)] font-bold leading-[0.95] text-black">Зубные<br />импланты</h2>
                                    <p className="text-xs md:text-sm font-semibold text-black">Восстановление утраченных зубов</p>
                                </div>
                                <div className="flex gap-1.5 md:gap-2 flex-1 min-h-[140px] md:min-h-0" style={s3Reveal.getAnimStyle(1)}>
                                    <div className="flex-1 rounded-xl md:rounded-2xl overflow-hidden">
