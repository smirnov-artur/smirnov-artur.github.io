  const squares = [];
  for (let r = 0; r < rows; r++) {
    const shiftX = r % 2 === 1 ? 2.25 : 0;
    for (let c = 0; c < cols; c++) squares.push([c * colW + shiftX, r * rowH]);

  return (
    <svg viewBox="0 0 36 18" style={{ width: 'var(--checker-w)', height: 'var(--checker-h)' }} className="inline-block align-middle translate-y-[2px]">

// ---- desktop mouse-spotlight dual-image reveal ----
const ImageRevealBackground = () => {
  const maskLayerRef = useRef(null);
  const patternRef = useRef(null);
  const mouseRef = useRef({ x: 0, y: 0 });
  const smoothRef = useRef({ x: 0, y: 0 });
  const gridRef = useRef({ x: 0, y: 0 });

  useEffect(() => {
    mouseRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    smoothRef.current = { ...mouseRef.current };

    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');

    const onMove = e => { mouseRef.current.x = e.clientX; mouseRef.current.y = e.clientY; };
    window.addEventListener('mousemove', onMove);

    const setCell = () => {
      const cell = Math.round(Math.min(64, Math.max(36, window.innerWidth * 0.028)));
      if (patternRef.current) {
        patternRef.current.setAttribute('width', cell);
        patternRef.current.setAttribute('height', cell);
        const path = patternRef.current.firstElementChild;
        if (path) path.setAttribute('d', `M ${cell} 0 L 0 0 0 ${cell}`);
      }
    };
    setCell();
    window.addEventListener('resize', setCell);

    let raf;
    const tick = () => {
      if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      }
      const s = smoothRef.current, m = mouseRef.current;
      s.x += (m.x - s.x) * 0.1;
      s.y += (m.y - s.y) * 0.1;

      const radius = Math.round(Math.min(420, Math.max(160, window.innerWidth * 0.16)));
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, radius);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.4, 'rgba(255,255,255,1)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.75)');
      g.addColorStop(0.75, 'rgba(255,255,255,0.4)');
      g.addColorStop(0.88, 'rgba(255,255,255,0.12)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const url = `url(${canvas.toDataURL()})`;
      if (maskLayerRef.current) {
        maskLayerRef.current.style.maskImage = url;
        maskLayerRef.current.style.webkitMaskImage = url;
      }

      const cx = (s.x / window.innerWidth) - 0.5;
      const cy = (s.y / window.innerHeight) - 0.5;
      const gr = gridRef.current;
      gr.x += (cx * 16 - gr.x) * 0.06;
      gr.y += (cy * 16 - gr.y) * 0.06;
      if (patternRef.current) { patternRef.current.setAttribute('x', gr.x); patternRef.current.setAttribute('y', gr.y); }

      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', onMove); window.removeEventListener('resize', setCell); };
  }, []);

  return (
    <div className="hidden lg:block fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <div className="absolute inset-0" style={{ backgroundImage: `url(${BG_IMAGE_1})`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundRepeat: 'no-repeat' }} />
      <div ref={maskLayerRef} className="absolute inset-0" style={{ backgroundImage: `url(${BG_IMAGE_2})`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundRepeat: 'no-repeat', maskSize: '100% 100%', WebkitMaskSize: '100% 100%' }} />
      <svg className="absolute inset-0 w-full h-full" style={{ opacity: 0.10 }}>
        <defs>
          <pattern ref={patternRef} id="synthGrid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" strokeWidth="0.6" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#synthGrid)" />
      </svg>
    </div>
  );
};

        <div className="relative self-end shrink-0" style={{ minWidth: 'var(--feature-min)', padding: 'var(--feature-pad)' }}>
          <Corner pos="tl" className="absolute top-0 left-0" />
          <Corner pos="tr" className="absolute top-0 right-0" />
          <Corner pos="bl" className="absolute bottom-0 left-0" />
          <Corner pos="br" className="absolute bottom-0 right-0" />
          <Globe />
          <p className="font-jakarta font-semibold uppercase mt-3" style={{ letterSpacing: '0.18em', fontSize: 'var(--body)' }}>
            BEYOND TRENDS.<br />BUILT FOR TOMORROW.
          </p>
        </div>
      </main>

      <div className="lg:hidden relative z-10" style={{ paddingInline: 'var(--pad-x)', paddingBottom: 'var(--main-py)' }}>
        <div className="aspect-[4/5] sm:aspect-[16/9] border border-gray-200 overflow-hidden">
          <img src={BG_IMAGE_1} alt="g.a.d. — future forward fashion editorial portrait" className="w-full h-full object-cover" />
        </div>
      </div>

      <Drawer id="shop" open={openDrawer === 'shop'} title="Catalog" subtitle="Featured Garments" onClose={() => setOpenDrawer(null)} footer={<CopyrightFooter />}>
        <div className="flex flex-col divide-y divide-gray-100">
          {SHOP_ITEMS.map((it, i) => (
            <div key={i} className="py-4 flex items-center justify-between gap-3">
              <div className="min-w-0">
                <p className="text-gray-400 uppercase tracking-wider" style={{ fontSize: 'var(--micro)' }}>{it.tag}</p>
                <p className="font-medium uppercase truncate" style={{ fontSize: 'var(--body)' }}>{it.title}</p>
                <p className="text-gray-600" style={{ fontSize: 'var(--body)' }}>{it.price}</p>
              </div>
              <button onClick={() => addToCart(it)} className="border border-gray-400 rounded-md uppercase shrink-0 hover:bg-black hover:text-white hover:border-black transition-colors"
                style={{ fontSize: 'var(--micro)', letterSpacing: '0.12em', padding: '0.5em 0.9em' }}>ADD</button>
            </div>
          ))}
        </div>
      </Drawer>

      <Drawer id="collections" open={openDrawer === 'collections'} title="Archive 2026" subtitle="Season Lineup" onClose={() => setOpenDrawer(null)} footer={<CopyrightFooter />}>
        <div className="flex flex-col divide-y divide-gray-100">
          {COLLECTIONS.map((c, i) => (
            <div key={i} className="py-4">
              <p className="text-gray-400 uppercase tracking-wider" style={{ fontSize: 'var(--micro)' }}>{c.n}</p>
              <p className="font-orbitron font-bold uppercase mt-1" style={{ fontSize: 'var(--body)' }}>{c.t}</p>
              <p className="text-gray-600 mt-1 leading-relaxed" style={{ fontSize: 'var(--micro)' }}>{c.d}</p>
            </div>
          ))}
        </div>
      </Drawer>

      <Drawer id="journal" open={openDrawer === 'journal'} title="Editorial" subtitle="Latest Dispatches" onClose={() => setOpenDrawer(null)} footer={<CopyrightFooter />}>
        <div className="flex flex-col divide-y divide-gray-100">
          {JOURNAL.map((j, i) => (
            <div key={i} className="py-4">
              <p className="text-gray-400 uppercase tracking-wider" style={{ fontSize: 'var(--micro)' }}>{j.d} · {j.r}</p>
              <p className="font-medium uppercase mt-1 leading-snug" style={{ fontSize: 'var(--body)' }}>{j.t}</p>
            </div>
          ))}
        </div>
      </Drawer>

      <Drawer id="cart" open={openDrawer === 'cart'} title="Shopping Bag" onClose={() => setOpenDrawer(null)}
        footer={cart.length > 0
          ? <button onClick={checkout} className="w-full bg-black text-white rounded-md uppercase flex items-center justify-center gap-2 mt-4 hover:opacity-85 transition-opacity" style={{ fontSize: 'var(--body)', letterSpacing: '0.14em', padding: '0.85em' }}>CHECKOUT NOW <ChevronRightIcon size="1.1em" /></button>
          : <CopyrightFooter />}>
        {cart.length === 0 ? (
          <div className="flex flex-col items-center justify-center text-center text-gray-400 py-16 gap-3">
            <ShoppingBagIcon size="2rem" stroke={1} />
            <p style={{ fontSize: 'var(--body)' }}>Your shopping bag is empty.</p>
          </div>
        ) : (
          <div className="flex flex-col divide-y divide-gray-100">
            {cart.map((it, i) => (
              <div key={i} className="py-4 flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <p className="font-medium uppercase truncate" style={{ fontSize: 'var(--body)' }}>{it.title}</p>
                  <p className="text-gray-600" style={{ fontSize: 'var(--body)' }}>{it.price}</p>
                </div>
                <button onClick={() => removeFromCart(i)} className="text-gray-400 hover:text-black transition-colors uppercase shrink-0" style={{ fontSize: 'var(--micro)', letterSpacing: '0.1em' }}>Remove</button>
              </div>
            ))}
          </div>
        )}
      </Drawer>

      <div className={`fixed top-5 right-5 z-50 bg-black text-white rounded-md flex items-center gap-2 shadow-lg transition-all duration-300 pointer-events-none ${toast ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2'}`}
        style={{ padding: '0.85em 1.2em', fontSize: 'var(--body)' }}>
        <CheckIcon size="1.1em" className="text-emerald-400" stroke={2} />
        <span>{toast}</span>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
