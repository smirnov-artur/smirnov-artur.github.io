      <div>

          <div key={i} className={`flex items-center gap-3 py-3 ${i < call.items.length - 1 ? 'border-b border-dotted border-neutral-200' : ''}`}>

            <div className="flex-1 min-w-0">
              <div className="text-sm text-[#202020] font-medium truncate">Consultation set: {it.name}</div>
              <div className="text-xs text-neutral-400 mt-0.5">{it.time}</div>
            </div>
            <span className="text-[11px] text-neutral-300 shrink-0">{it.duration}</span>
          </div>
        ))}
      </div>
    </motion.div>
  );
}

function Track({ y, className }) {
  const repeated = [...CLIENT_CALLS, ...CLIENT_CALLS, ...CLIENT_CALLS];
  return (
    <motion.div className={className} animate={{ y }} transition={{ repeat: Infinity, duration: 40, ease: 'linear' }}>
      {repeated.map((call, i) => <ClientCard key={i} index={i} call={call} />)}
    </motion.div>
  );
}
