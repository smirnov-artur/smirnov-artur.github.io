<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
<script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>g.a.d. — Expanding Reach With Every Lead</title>
<meta name="description" content="g.a.d. — a lead-generation hero with a soft neumorphic headline icon and a vertical marquee of client consultation cards scrolling forever.">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
<link href="https://db.onlinewebfonts.com/c/16e715573b2b3072037cf4ab26fc8bb8?family=SK+Reykjavik+Rounded+Regular" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ['"SK Reykjavik Rounded Regular"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F7F7F7; color: #202020; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { motion } = Motion;

const AVATARS = [
  'https://images.unsplash.com/photo-1607746882042-944635dfe10e?auto=format&fit=crop&q=80&w=100&h=100',
  'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=100&h=100',
  'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=100&h=100',
  'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=100&h=100',
];

const CLIENT_CALLS = [
  { day: 'MON', date: '25 JUL', items: [
    { name: 'Daniel', avatar: AVATARS[0], time: '9:30 AM - 10:30 AM', duration: '1hr' },
  ] },
  { day: 'WED', date: '20 JUL', items: [
    { name: 'Matthew', avatar: AVATARS[1], time: '2:00 PM - 3:00 PM', duration: '1hr' },
    { name: 'Lily', avatar: AVATARS[2], time: '4:15 PM - 4:45 PM', duration: '30m' },
  ] },
  { day: 'MON', date: '18 JUL', items: [
    { name: 'Jacob', avatar: AVATARS[3], time: '9:30 AM - 10:30 AM', duration: '1hr' },
  ] },
  { day: 'TUE', date: '19 JUL', items: [
    { name: 'Chloe', avatar: AVATARS[1], time: '9:30 AM - 10:30 AM', duration: '1hr' },
    { name: 'Maya', avatar: AVATARS[2], time: '12:45 PM - 1:15 PM', duration: '30m' },
  ] },
  { day: 'THU', date: '21 JUL', items: [
    { name: 'Oliver', avatar: AVATARS[3], time: '11:00 AM - 11:30 AM', duration: '30m' },
  ] },
];

function TrendingUp({ size = 24, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
      <polyline points="16 7 22 7 22 13" />
    </svg>
  );
}
function Play({ size = 16, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1" strokeLinejoin="round" className={className}>
      <polygon points="6 3 20 12 6 21 6 3" />
    </svg>
  );
}
function Star({ size = 16, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}>
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
    </svg>
  );
}

function DeepShadowIcon({ children }) {
  return (
    <span className="relative inline-flex mx-1" style={{ verticalAlign: '-0.35em' }}>
      <span className="absolute inset-0 opacity-60 bg-[#F25C40] blur-[18px] scale-90 translate-y-1.5 rounded-2xl" />
      <span className="relative bg-[#F25C40] p-2 rounded-2xl shadow-[0px_0px_5px_rgba(255,255,255,0.5)_inset,0px_8px_20px_rgba(242,92,64,0.35)] inline-flex items-center justify-center">
        {children}
      </span>
    </span>
  );
}

function DeepShadowButton({ children }) {
  return (
    <button className="group relative">
      <span className="absolute inset-0 opacity-40 bg-[#212121] blur-[25px] rounded-full transition-transform duration-300 group-hover:scale-110 group-hover:translate-y-1" />
      <span className="relative block bg-[#202020] text-white shadow-[0px_0px_4px_rgba(255,255,255,0.25)_inset,0px_6px_19px_rgba(0,0,0,0.25)] rounded-full px-6 py-3.5 text-sm font-medium whitespace-nowrap">
        {children}
      </span>
    </button>
  );
}

function DeepShadowAvatar({ src, size = 'md', hasGlow }) {
  const dims = { sm: 40, md: 52, lg: 68 }[size];
  return (
    <span className="relative inline-block rounded-full border-2 border-[#F7F7F7]" style={{ width: dims, height: dims }}>
      <span className={`absolute inset-0 rounded-full scale-90 translate-y-1 ${hasGlow ? 'bg-[#F25C40] opacity-60 blur-[18px]' : 'bg-black opacity-20 blur-[12px]'}`} />
      <img src={src} alt="" className="relative w-full h-full rounded-full object-cover" />
    </span>
  );
}

function AvatarWithShadow({ src }) {
  return (
    <span className="relative inline-block shrink-0" style={{ width: 36, height: 36 }}>
      <span className="absolute left-1/2 bottom-0 rounded-full bg-black opacity-25 blur-[10px]" style={{ width: 26, height: 8, transform: 'translateX(-50%)' }} />
      <img src={src} alt="" className="relative w-full h-full rounded-full object-cover border-2 border-white" />
    </span>
  );
}

function ClientCard({ index, call }) {
  const rot = index % 2 === 0 ? 3 : -3;
  return (
    <motion.div
      initial={{ opacity: 0, scale: 0.9, rotate: rot }}
      animate={{ opacity: 1, scale: 1, rotate: rot }}
      transition={{ duration: 0.5 }}
      className="bg-white shadow-[0_4px_20px_rgba(0,0,0,0.03)] rounded-2xl p-5 mb-5"
    >
      <div className="flex items-center justify-between mb-3">
        <span className="text-[11px] font-medium text-neutral-400 tracking-wide">{call.day}</span>
        <span className="text-[11px] font-medium text-neutral-400 tracking-wide">{call.date}</span>
      </div>
      <div>
        {call.items.map((it, i) => (
          <div key={i} className={`flex items-center gap-3 py-3 ${i < call.items.length - 1 ? 'border-b border-dotted border-neutral-200' : ''}`}>
            <AvatarWithShadow src={it.avatar} />
            <div className="flex-1 min-w-0">
              <div className="text-sm text-[#202020] font-medium truncate">Consultation set: {it.name}</div>
              <div className="text-xs text-neutral-400 mt-0.5">{it.time}</div>
            </div>
            <span className="text-[11px] text-neutral-300 shrink-0">{it.duration}</span>
          </div>
        ))}
      </div>
    </motion.div>
  );
}

function Track({ y, className }) {
  const repeated = [...CLIENT_CALLS, ...CLIENT_CALLS, ...CLIENT_CALLS];
  return (
    <motion.div className={className} animate={{ y }} transition={{ repeat: Infinity, duration: 40, ease: 'linear' }}>
      {repeated.map((call, i) => <ClientCard key={i} index={i} call={call} />)}
    </motion.div>
  );
}

function App() {
  return (
    <div className="min-h-screen bg-[#F7F7F7] font-sans">
      <div className="max-w-[1440px] mx-auto grid grid-cols-1 lg:grid-cols-[1.2fr_0.8fr] gap-12 px-6 sm:px-10 py-16 lg:py-24">
        <div>
          <div className="inline-flex items-center gap-2 border border-[#D1F2D1] rounded-full px-3 py-1.5 mb-7">
            <span className="w-2 h-2 rounded-full bg-[#52D352] shadow-[0_0_8px_rgba(82,211,82,0.6)] animate-pulse" />
            <span className="text-[11px] font-semibold uppercase tracking-wide text-[#52D352]">Booking for summer</span>
          </div>

          <h1 className="font-heading text-[#202020]" style={{ letterSpacing: '-0.02em', fontSize: 'clamp(2.2rem, 4vw, 3.4rem)', lineHeight: 1.1 }}>
            Expanding
            <DeepShadowIcon><TrendingUp size={26} className="text-white -rotate-6" /></DeepShadowIcon>
            reach
            <br />
            with every lead
          </h1>

          <p className="mt-5 text-neutral-500 text-[15px] sm:text-base leading-relaxed max-w-md">
            Automating lead systems and funnels, we design scalable growth engines for your next venture.
          </p>

          <div className="mt-8 flex items-center gap-4 sm:gap-6">
            <DeepShadowButton>Scale revenue now</DeepShadowButton>
            <button className="flex items-center gap-2 border border-neutral-300 text-neutral-600 rounded-full px-6 py-3.5 text-sm font-medium hover:border-neutral-400 hover:text-neutral-800 transition-colors whitespace-nowrap">
              <Play size={13} /> Start Here
            </button>
          </div>

          <div className="mt-11 flex items-center gap-8 sm:gap-10">
            <div>
              <div className="text-[11px] font-medium text-neutral-400 uppercase tracking-wide mb-3">Verified clients</div>
              <div className="flex items-center -space-x-3">
                {AVATARS.map((a, i) => (
                  <DeepShadowAvatar key={i} src={a} size={i % 2 === 0 ? 'md' : 'lg'} hasGlow={i === 1} />
                ))}
              </div>
            </div>
            <div className="hidden sm:block w-px self-stretch bg-neutral-200" />
            <div>
              <div className="text-[11px] font-medium text-neutral-400 uppercase tracking-wide mb-3">Top tier quality 5/5</div>
              <div className="flex items-center gap-1">
                {[0, 1, 2, 3, 4].map((i) => <Star key={i} size={16} className="text-[#FFB648]" />)}
              </div>
            </div>
          </div>
        </div>

        <div className="relative overflow-hidden h-[600px] lg:h-[720px]">
          <div className="absolute inset-x-0 top-0 h-20 sm:h-40 bg-gradient-to-b from-[#F7F7F7] to-transparent z-10 pointer-events-none" />
          <div className="absolute inset-x-0 bottom-0 h-20 sm:h-40 bg-gradient-to-t from-[#F7F7F7] to-transparent z-10 pointer-events-none" />
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-4 h-full">
            <Track y={[0, -1200]} />
            <Track y={[-600, -1800]} className="hidden md:block lg:hidden" />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
