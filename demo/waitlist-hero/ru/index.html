        const GadLogo = ({ height = 22 }) => (
            <svg className="gad-logo" height={height} viewBox="0 0 355 110" role="img" aria-label="g.a.d." style={{ color: '#fff' }}>
                <path fill="currentColor" d={GAD_D} />
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
            </svg>
        );

        const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260508_071134_9cc2f2d8-a599-4a73-8c89-6eb4af170352.mp4';
        const IMG_SRC = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260507_181851_f7a6e930-087d-4ce3-978d-f982e804b7df.png&w=1280&q=85';
        const SEEK_INTERVAL_MS = 33;
        const STEP_SECONDS = 0.05;

        const ORBS = [
            { top: '14%', left: '16%', width: 100, height: 100, color: 'rgba(255,255,255,0.70)' },
            { top: '8%', left: '50%', width: 72, height: 72, color: 'rgba(200,215,255,0.55)', center: true },
            { top: '20%', right: '10%', width: 110, height: 110, color: 'rgba(185,210,235,0.55)' },
        ];

        const Orb = ({ o }) => (
            <div className="absolute pointer-events-none z-10 rounded-full" style={{
                top: o.top, left: o.left, right: o.right, width: o.width, height: o.height,
                transform: o.center ? 'translateX(-50%)' : undefined,
                background: `radial-gradient(circle, ${o.color} 0%, transparent 70%)`,
                filter: 'blur(20px)', mixBlendMode: 'screen',
            }} />
        );

        const App = () => {
            const videoRef = useRef(null);
            const canvasRefs = useRef([null, null, null]);
            const directionRef = useRef(1);
            const seekRafRef = useRef(null);
            const drawRafRef = useRef(null);
            const lastTickRef = useRef(0);

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const seekLoop = now => {
                    if (!video.duration || isNaN(video.duration)) {
                        seekRafRef.current = requestAnimationFrame(seekLoop);
                        return;
                    }
                    if (now - lastTickRef.current >= SEEK_INTERVAL_MS && !video.seeking) {
                        lastTickRef.current = now;
                        let next = video.currentTime + STEP_SECONDS * directionRef.current;
                        if (next >= video.duration) { next = video.duration; directionRef.current = -1; }
                        else if (next <= 0) { next = 0; directionRef.current = 1; }
                        video.currentTime = next;
                    }
                    seekRafRef.current = requestAnimationFrame(seekLoop);
                };

                // one shared video, drawn live into each panel's canvas every frame — the N visible
                // panels are treated as slices of one continuous cover-fitted surface (see prompt spec)
                const drawLoop = () => {
                    const visible = canvasRefs.current.filter(c => c && c.offsetParent !== null);
                    if (video.videoWidth && visible.length) {
                        const n = visible.length;
                        const cw = visible[0].clientWidth || 1, ch = visible[0].clientHeight || 1;
                        const vw = video.videoWidth, vh = video.videoHeight;
                        const combinedW = cw * n, combinedH = ch;
                        const scale = Math.max(combinedW / vw, combinedH / vh);
                        const sw = combinedW / scale, sh = combinedH / scale;
                        const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
                        const sliceW = sw / n;
                        visible.forEach((canvas, i) => {
                            if (canvas.width !== cw) canvas.width = cw;
                            if (canvas.height !== ch) canvas.height = ch;
                            canvas.getContext('2d').drawImage(video, sx + sliceW * i, sy, sliceW, sh, 0, 0, cw, ch);
                        });
                    }
                    drawRafRef.current = requestAnimationFrame(drawLoop);
                };

                const start = () => {
                    video.pause();
                    seekRafRef.current = requestAnimationFrame(seekLoop);
                    drawRafRef.current = requestAnimationFrame(drawLoop);
                };
                if (video.readyState >= 2) start();
                else video.addEventListener('loadeddata', start, { once: true });

                return () => {
                    if (seekRafRef.current) cancelAnimationFrame(seekRafRef.current);
                    if (drawRafRef.current) cancelAnimationFrame(drawRafRef.current);
                };
            }, []);

            return (
                <div className="w-screen h-screen overflow-hidden flex flex-col" style={{ background: '#0E1114', backgroundImage: 'radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px)', backgroundSize: '24px 24px' }}>
                    <nav className="flex items-center justify-between px-7 py-7 shrink-0">

                            <a href="#" className="bg-black text-white border border-white text-sm font-semibold px-5 py-2 rounded-full hover:opacity-90 active:scale-95 transition-all duration-200 whitespace-nowrap"><span className="sm:hidden">Записаться</span><span className="hidden sm:inline">Встать в лист ожидания</span></a>
                        </div>
                    </nav>

                    <div className="flex-1 mx-2 mb-2 bg-[#030404] rounded-[32px] overflow-hidden relative min-h-0">
                        <div className="h-full flex gap-2 p-2 lg:p-5 min-h-0">
                            <video ref={videoRef} muted playsInline preload="auto" src={VIDEO_SRC} style={{ position: 'absolute', width: 1, height: 1, opacity: 0, left: -9999, top: -9999 }} />
                            {[0, 1, 2].map(i => (
                                <div key={i} className={"flex-1 relative overflow-hidden rounded-[22px] " + (i > 0 ? 'hidden sm:block' : '')}>
                                    <canvas ref={el => canvasRefs.current[i] = el} className="absolute inset-0 w-full h-full" />
                                    <Orb o={ORBS[i]} />
                                    {i === 1 && (
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <div style={{ width: 130, height: 225, borderRadius: 999, overflow: 'hidden', boxShadow: '0 0 0 1.5px rgba(255,255,255,0.10)' }}>
                                                <img src={IMG_SRC} alt="" className="w-full h-full" style={{ objectFit: 'cover', objectPosition: 'center' }} />
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        <div className="absolute bottom-0 left-0 right-0 z-10 pointer-events-none h-[470px] sm:h-[260px]" style={{ background: 'linear-gradient(to top, rgba(3,4,4,0.88) 0%, rgba(3,4,4,0.50) 45%, transparent 100%)' }} />

                        <div className="absolute bottom-0 left-0 right-0 z-20 p-6 md:p-8 pb-10 md:pb-14 flex flex-col md:flex-row md:items-end md:justify-between gap-4 md:gap-0 pointer-events-none">
                            <div className="pointer-events-auto">
                                <p className="text-white/70 text-sm leading-relaxed max-w-[280px] mb-4">Универсальный инструмент для почты, CRM, управления проектами и не только — который сам всё организует.</p>
                                <button className="self-start px-6 py-2.5 rounded-full text-sm font-semibold bg-white text-[#030404] hover:opacity-90 active:scale-95 transition-all duration-200">Встать в лист ожидания</button>
                            </div>
                            <div className="flex flex-col md:items-end pointer-events-auto">
                                <h1 className="text-white" style={{ fontSize: 'clamp(52px,10vw,110px)', fontWeight: 600, lineHeight: 1.0, letterSpacing: '-0.03em' }}>Порядок.</h1>
                                <p className="text-white/60 text-base italic tracking-wide">Чтобы вам не пришлось наводить его самим.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
