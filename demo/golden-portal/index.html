                ...style,
            }} />
        );

        const useScrollReveal = () => {
            useEffect(() => {
                const els = document.querySelectorAll('.reveal, .reveal-scale');
                const obs = new IntersectionObserver(entries => {
                    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('revealed'); obs.unobserve(e.target); } });
                }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
                els.forEach(el => obs.observe(el));
                return () => obs.disconnect();
            }, []);
        };

        const useParallax = ref => {
            const [progress, setProgress] = useState(0);
            useEffect(() => {
                const onScroll = () => {
                    const el = ref.current;
                    if (!el) return;
                    const rect = el.getBoundingClientRect();
                    const vh = window.innerHeight;
                    const p = 1 - rect.bottom / (vh + rect.height);
                    setProgress(Math.max(0, Math.min(1, p)));
                };
                onScroll();
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
            }, []);
            return progress;
        };

        const Navbar = () => (
            <nav className="fixed left-1/2 -translate-x-1/2 top-4 sm:top-6 z-50 liquid-glass rounded-full px-4 py-2.5 sm:px-10 sm:py-3">

                                    <p className="font-inter text-[11px] sm:text-sm leading-relaxed text-white/60 mt-3">{a}</p>
                                </div>
                            ))}

                </section>
            );
        };

            return (
                <React.Fragment>
                    <Navbar />
                    <Hero />
                    <div className="relative -mt-56 sm:-mt-64 md:-mt-72 lg:-mt-80">

                        <Dove className="absolute z-20 w-24 sm:w-40 md:w-64 right-6 sm:right-10 -bottom-12 sm:bottom-6" />
                    </div>
                    <QAndA />
                    <QuoteBanner />
                    <Footer />
                </React.Fragment>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
