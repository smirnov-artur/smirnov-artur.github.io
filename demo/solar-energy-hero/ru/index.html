    <style>
        .gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}

        :root{--bg-light:#ffffff;--bg-dark:#000000;--text-light:#3E3424;--text-dark:#E5DEC9;--active-toggle:#f5f8ea;--transition-speed:0.9s;--pull-easing:cubic-bezier(0.32,0,0.67,0);--return-easing:cubic-bezier(0.175,0.885,0.32,1.4)}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
        html,body{height:100%}
        body{background-color:var(--bg-dark);color:var(--text-dark);overflow:hidden;transition:background-color .5s ease}
        body.light-theme{background-color:var(--bg-light);color:var(--text-light)}
        .blur-overlay{position:absolute;left:0;width:100%;height:10vh;z-index:2;pointer-events:none;backdrop-filter:blur(25px) saturate(1.5);-webkit-backdrop-filter:blur(25px) saturate(1.5)}
        .blur-overlay-top{top:0;-webkit-mask-image:linear-gradient(to bottom,black 70%,transparent 100%);mask-image:linear-gradient(to bottom,black 70%,transparent 100%)}
        .blur-overlay-bottom{bottom:0;-webkit-mask-image:linear-gradient(to top,black 70%,transparent 100%);mask-image:linear-gradient(to top,black 70%,transparent 100%)}
        .hero{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;background-image:radial-gradient(circle at center,rgba(255,255,255,.05) 0%,transparent 100%)}
        body.light-theme .hero{background-image:radial-gradient(circle at center,rgba(0,0,0,.02) 0%,transparent 100%)}
        .hero-bg-wrapper{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;overflow:hidden}
        .hero-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center 40%;background-repeat:no-repeat;transform:scale(1.1)}
        .hero-bg::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(circle at center,transparent 0%,rgba(0,0,0,.4) 100%),linear-gradient(to bottom,rgba(0,0,0,.3) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.8) 100%)}
        body.light-theme .hero-bg::after{background:radial-gradient(circle at center,transparent 0%,rgba(255,255,255,.2) 100%),linear-gradient(to bottom,rgba(255,255,255,.3) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.8) 100%)}
        .bg-front{z-index:2;transition:transform .5s var(--return-easing),opacity .5s ease}
        .bg-back{z-index:1;filter:blur(40px);transform:scale(1.2)}
        .navbar{width:100%;max-width:100%;padding:24px 30px;display:flex;justify-content:space-between;align-items:center;z-index:110;position:relative}
        .hamburger{display:none;flex-direction:column;gap:6px;cursor:pointer;z-index:120}
        .hamburger span{display:block;width:28px;height:2px;background:currentColor;border-radius:2px;transition:.3s}
        .hamburger.active span:nth-child(1){transform:translateY(8px) rotate(45deg)}
        .hamburger.active span:nth-child(2){opacity:0}
        .hamburger.active span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
        .logo-container{display:flex;align-items:center;gap:12px}
        .logo{height:32px;color:#fff;transition:color .5s ease}
        body.light-theme .logo{color:#000}
        .nav-links{display:flex;gap:32px;align-items:center}
        .nav-links a{color:inherit;text-decoration:none;font-size:14px;font-weight:500;opacity:.7;transition:opacity .3s}
        .nav-links a:hover{opacity:1}
        .cta-button{background:#fff;color:#000;border:none;padding:12px 24px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .3s,background .3s;font-family:inherit}
        .drawer-cta{display:none}
        body.light-theme .cta-button{background:#000;color:#fff}
        .cta-button:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,.1)}
        .hero-content{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:30px 20px 0;z-index:5;width:100%}
        .hero-title{font-size:56px;font-weight:500;line-height:1;max-width:1000px;margin-bottom:40px;letter-spacing:-1px;color:var(--text-dark);opacity:.95}
        .title-accent{transition:color .5s ease}
        body:not(.light-theme) .title-accent{color:#10100F}
        body.light-theme .title-accent{color:#fff}
        body.light-theme .hero-title{color:var(--text-light);opacity:.95}
        .theme-toggle{background:rgba(210,198,171,.15);backdrop-filter:blur(20px);border:none;padding:2px 1px;border-radius:8px;display:flex;gap:4px;margin-top:auto;margin-bottom:8px;position:relative}
        body.light-theme .theme-toggle{background:rgba(210,198,171,.25);border:none}
        .toggle-btn{padding:6px 40px;border-radius:4px;border:none;background:transparent;color:#fff;cursor:pointer;z-index:1;transition:color .3s;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
        .toggle-btn .label{font-weight:500;font-size:18px}
        .toggle-btn .subtext{font-size:11px;opacity:.6}
        .toggle-indicator{position:absolute;top:2px;left:1px;width:calc(50% - 3px);height:calc(100% - 4px);background:var(--active-toggle);border-radius:4px;transition:transform .5s cubic-bezier(0.175,0.885,0.32,1.275);z-index:0;box-shadow:0 4px 12px rgba(0,0,0,.1)}
        body:not(.light-theme) .toggle-indicator{transform:translateX(calc(100% + 4px))}
        .toggle-btn.active{color:#3E3424!important}
        .toggle-btn.active .subtext{opacity:.8}
        .hero-footer{max-width:600px;margin-bottom:60px;margin-top:0;color:var(--text-dark);opacity:1;font-size:16px;font-weight:300;line-height:1.6;z-index:5}
        body.light-theme .hero-footer{color:var(--text-light)}
        .pull-down{transform:translateY(20vh) scale(1.1)!important;opacity:.8!important;transition:transform .3s var(--pull-easing),opacity .3s ease!important}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .hero-content>*{animation:fadeIn 1s ease forwards}
        .hero-title{animation-delay:.2s}
        .theme-toggle{animation-delay:.4s}
        .hero-footer{animation-delay:.6s}
        @media (max-width:768px){
            .hero-title{font-size:42px;margin-bottom:30px}
            .navbar{padding:16px 20px}
            .hero-bg{background-position:center 40%;transform:scale(1.2)}
            .pull-down{transform:translateY(20vh) scale(1.2)!important}
            .nav-links{display:none;position:fixed;top:0;right:0;width:100%;height:100vh;background:var(--bg-dark);flex-direction:column;justify-content:center;align-items:center;z-index:100;gap:40px;transition:transform .4s cubic-bezier(.77,0,.175,1);transform:translateX(100%)}
            body.light-theme .nav-links{background:var(--bg-light)}
            .nav-links.active{display:flex;transform:translateX(0)}
            .nav-links a{font-size:24px;font-weight:600}
            .cta-button.nav-cta{display:none}
            .drawer-cta{display:block;width:200px;margin-top:20px;padding:16px}
            .hamburger{display:flex!important}
            .theme-toggle{flex-direction:row;width:calc(100% - 40px);max-width:400px}
            .toggle-btn{padding:12px 20px;flex:1}
        }
    </style>

<body class="antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const LIGHT_IMG = 'https://images.pexels.com/photos/12243093/pexels-photo-12243093.jpeg?auto=compress&cs=tinysrgb&w=1920';
        const DARK_IMG = 'https://images.pexels.com/photos/4626268/pexels-photo-4626268.jpeg?auto=compress&cs=tinysrgb&w=1920';

                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
            </svg>
        );

        function App(){
            const [isDark, setIsDark] = useState(true);
            const [menuOpen, setMenuOpen] = useState(false);
            const bgFrontRef = useRef(null);
            const bgBackRef = useRef(null);
            const animatingRef = useRef(false);

            useEffect(() => {
                document.body.classList.toggle('light-theme', !isDark);
            }, [isDark]);

            useEffect(() => {
                bgFrontRef.current.style.backgroundImage = `url(${DARK_IMG})`;
                bgBackRef.current.style.backgroundImage = `url(${DARK_IMG})`;
            }, []);

            function toggleTheme(toDark){
                if (toDark === isDark || animatingRef.current) return;
                animatingRef.current = true;
                const target = toDark ? DARK_IMG : LIGHT_IMG;
                bgBackRef.current.style.backgroundImage = `url(${target})`;
                bgFrontRef.current.classList.add('pull-down');
                setTimeout(() => {
                    setIsDark(toDark);
                    bgFrontRef.current.style.backgroundImage = `url(${target})`;
                }, 300);
                setTimeout(() => {
                    bgFrontRef.current.classList.remove('pull-down');
                    animatingRef.current = false;
                }, 330);
            }

            return (
                <div className="hero">
                    <div className="blur-overlay blur-overlay-top"></div>
                    <div className="blur-overlay blur-overlay-bottom"></div>
                    <div className="hero-bg-wrapper">
                        <div ref={bgBackRef} className="hero-bg bg-back"></div>
                        <div ref={bgFrontRef} className="hero-bg bg-front"></div>
                    </div>

                    <nav className="navbar">
                        <div className="logo-container">
                            <GadLogo className="gad-logo logo" />
                        </div>
                        <div className={"nav-links" + (menuOpen ? " active" : "")}>
                            <a href="#">Как это работает</a>
                            <a href="#">Наши кейсы</a>
                            <a href="#">О нас</a>
                            <a href="#">Карьера</a>
                            <a href="#">Материалы</a>
                            <a href="#">Клиентам</a>
                            <button className="cta-button drawer-cta">Мгновенный расчёт</button>
                        </div>
                        <button className="cta-button nav-cta">Мгновенный расчёт</button>
                        <div className={"hamburger" + (menuOpen ? " active" : "")} onClick={() => setMenuOpen(o => !o)}>
                            <span></span><span></span><span></span>
                        </div>
                    </nav>

                    <div className="hero-content">
                        <h1 className="hero-title">
                            $0 за электричество<br/>
                            <span className="title-accent">все</span> 7 лет
                        </h1>
                        <div className="theme-toggle">
                            <div className="toggle-indicator" style={{ transform: isDark ? 'translateX(calc(100% + 4px))' : 'translateX(0)' }}></div>
                            <button className={"toggle-btn" + (!isDark ? " active" : "")} onClick={() => toggleTheme(false)}>
                                <span className="label">Утро</span>
                                <span className="subtext">$0 за электричество</span>
                            </button>
                            <button className={"toggle-btn" + (isDark ? " active" : "")} onClick={() => toggleTheme(true)}>
                                <span className="label">Ночь</span>
                                <span className="subtext">$0 за электричество</span>
                            </button>
                        </div>
                        <p className="hero-footer">Забудьте о рынке электроэнергии, погоде и временах года: наш умный контроллер гарантирует нулевые счета за электричество на семь лет.</p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
