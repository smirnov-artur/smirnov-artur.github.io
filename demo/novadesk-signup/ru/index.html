<!DOCTYPE html>

                            <form onSubmit={e => e.preventDefault()} className="flex flex-col gap-5 mt-8 sm:mt-auto">
                                <div>
                                    <h1 className="text-white text-2xl font-semibold tracking-tight">Присоединяйтесь</h1>
                                    <p className="text-zinc-400 text-sm mt-1.5 leading-relaxed">Настройте профиль и подключайтесь прямо сейчас.</p>
                                </div>

                                    <div className="flex-1 h-px bg-zinc-700/60" />

                                    <div className="flex-1 h-px bg-zinc-700/60" />
                                </div>

                                <div className="flex gap-3">
                                    <button type="button" className="flex-1 bg-zinc-800/60 rounded-lg py-2 text-zinc-300 text-sm hover:bg-zinc-700/60 hover:text-white transition-colors flex items-center justify-center gap-1.5"><i data-lucide="chrome" style={{ width: 15, height: 15 }}></i>Google</button>
                                    <button type="button" className="flex-1 bg-zinc-800/60 rounded-lg py-2 text-zinc-300 text-sm hover:bg-zinc-700/60 hover:text-white transition-colors flex items-center justify-center gap-1.5"><i data-lucide="apple" style={{ width: 15, height: 15 }}></i>Apple</button>

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

</html>
