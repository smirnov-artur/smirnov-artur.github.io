<body class="bg-white antialiased">

        const { useState, useEffect, useRef } = React;

        function useInView(threshold){
            const ref = useRef(null);
            const [inView, setInView] = useState(false);
            useEffect(() => {
                const el = ref.current; if (!el) return;
                const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); io.disconnect(); } }, { threshold });
                io.observe(el);
                return () => io.disconnect();
            }, []);
            return [ref, inView];
        }

        function AnimatedText({ text, as: Tag = 'span', className = '', trigger = 'mount' }){
            const [ref, inView] = useInView(0.3);
            const play = trigger === 'mount' || inView;
            const words = text.split(' ');
            return (
                <Tag ref={ref} className={className}>
                    {words.map((w, i) => (
                        <React.Fragment key={i}>
                            <span className="word" style={play ? { animation: 'fadeUp 0.6s ease-out forwards', animationDelay: (i * 0.1) + 's' } : {}}>{w}</span>
                            {i < words.length - 1 ? ' ' : ''}
                        </React.Fragment>
                    ))}
                </Tag>
            );
        }

        const NAV = ['Главная', 'Услуги', 'Команда', 'Подписка', 'Материалы'];
        const ACTIONS = [
            { icon: 'zap', label: 'Начать проверку здоровья' },

            return (

                                <div className="mt-3 flex items-center gap-2">
