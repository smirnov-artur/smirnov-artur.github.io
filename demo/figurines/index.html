<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/works/js/gad-loader.js"></script>
<script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — 3D figurines</title>
<!-- Один файл вместо React + lucide-react. ?lang=ru — русская версия (у Anton нет кириллицы, по-русски крупные надписи набраны Oswald).
     Фигурки — те же картинки, пережатые из PNG по 5–7 МБ в WebP по ~0,2 МБ. Карусель листается сама раз в 3,5 с, стрелки сбрасывают отсчёт. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#F4845F}
button{font:inherit;cursor:pointer}
a{color:inherit}
.page{position:relative;width:100%;overflow:hidden;font-family:'Inter',sans-serif;transition:background-color 650ms cubic-bezier(.4,0,.2,1)}
.stage{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}
.grain{position:absolute;inset:0;pointer-events:none;z-index:50;opacity:.4;background-repeat:repeat;background-size:200px 200px;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E")}
.ghost{position:absolute;left:0;right:0;top:18%;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none;user-select:none;
  font-family:'Anton',sans-serif;font-size:clamp(90px,28vw,380px);font-weight:900;color:#fff;line-height:1;text-transform:uppercase;letter-spacing:-.02em;white-space:nowrap}
.brand{position:absolute;top:24px;left:16px;z-index:60;display:block;width:104px;color:#fff;opacity:.9}
.brand svg{display:block;width:100%;height:auto;overflow:visible}
.ring{animation:draw 1.1s cubic-bezier(.65,0,.35,1) .3s forwards}
.orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:pop .3s ease 1.3s forwards,orbit 7s linear 1.3s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}

.carousel{position:absolute;inset:0;z-index:3}
.item{position:absolute;aspect-ratio:.6/1;will-change:transform,filter,opacity;
  transition:transform 650ms cubic-bezier(.4,0,.2,1),filter 650ms cubic-bezier(.4,0,.2,1),opacity 650ms cubic-bezier(.4,0,.2,1),left 650ms cubic-bezier(.4,0,.2,1),height 650ms cubic-bezier(.4,0,.2,1),bottom 650ms cubic-bezier(.4,0,.2,1)}
.item img{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;user-select:none;-webkit-user-drag:none}

.info{position:absolute;bottom:24px;left:16px;z-index:60;max-width:320px;color:#fff}
.t1{margin:0 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:16px;opacity:.95}
.t2{display:none;margin:0 0 16px;font-size:12px;opacity:.85;line-height:1.6}
.btns{display:flex;gap:12px}
.nav{width:48px;height:48px;border-radius:9999px;border:2px solid #fff;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;
  transition:transform 150ms,background-color 150ms}
.nav:hover{transform:scale(1.08);background:rgba(255,255,255,.12)}
.nav svg,.disc svg{display:block;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.disc{position:absolute;bottom:24px;right:16px;z-index:60;display:flex;align-items:center;text-decoration:none;color:#fff;
  font-family:'Anton',sans-serif;font-size:clamp(20px,4vw,56px);font-weight:400;letter-spacing:-.02em;line-height:1;text-transform:uppercase;opacity:.95;transition:opacity 200ms}
.disc:hover{opacity:1}
.disc svg{width:20px;height:20px}
.ru .ghost,.ru .disc{font-family:'Oswald',sans-serif;font-weight:700}
.ru .ghost{font-size:clamp(72px,20vw,290px)}

@media (min-width:640px){
  .brand{left:32px;width:136px}
  .info{bottom:80px;left:96px}
  .t1{margin-bottom:12px;font-size:22px}
  .t2{display:block;margin-bottom:20px;font-size:14px}
  .nav{width:64px;height:64px}
  .disc{bottom:80px;right:40px}
  .disc svg{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){
  .ring{animation:none;stroke-dashoffset:0}
  .orb{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="stage">
    <div class="grain"></div>
    <div class="ghost" data-t="ghost">3D Shape</div>
    <a class="brand" href="#" aria-label="g.a.d.">
      <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
        <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
        <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
      </svg>
    </a>
    <div class="carousel" id="carousel"></div>
    <div class="info">
      <p class="t1" data-t="t1">g.a.d. figurines</p>
      <p class="t2" data-t="t2">The artwork is stunning, shipped fully prepared. The finish is a vision, the 3D craft is flawless. Many thanks! Wishing you the win. Order now.</p>
      <div class="btns">
        <button class="nav" id="prev" type="button" aria-label="Previous"><svg width="26" height="26" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <button class="nav" id="next" type="button" aria-label="Next"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      </div>
    </div>
    <a class="disc" href="#"><span data-t="disc">Discover it</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
  </div>
</div>
<script>
(() => {
if (false) {
  const TR = { ghost: '3D-форма', t1: 'Фигурки g.a.d.', disc: 'Смотреть',
    t2: 'Работа потрясающая, пришла полностью готовой. Отделка — загляденье, 3D сделано безупречно. Огромное спасибо! Удачи вам. Заказывайте.' };
  document.documentElement.lang = 'ru';
  document.body.classList.add('ru');
  document.title = 'g.a.d. — 3D-фигурки';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.textContent = t; });
}
const IMAGES = [
  { src: '1.webp', bg: '#F4845F', panel: '#F79B7F' },
  { src: '2.webp', bg: '#6BBF7A', panel: '#85CC92' },
  { src: '3.webp', bg: '#E882B4', panel: '#ED9DC4' },
  { src: '4.webp', bg: '#6EB5FF', panel: '#8DC4FF' },
];
IMAGES.forEach(i => { new Image().src = i.src; });

const page = document.getElementById('page'), car = document.getElementById('carousel');
const items = IMAGES.map(i => {
  const d = document.createElement('div'); d.className = 'item';
  const img = document.createElement('img'); img.src = i.src; img.alt = ''; img.draggable = false;
  d.appendChild(img); car.appendChild(d); return d;
});
let activeIndex = 0, isAnimating = false, isMobile = innerWidth < 640;

// роль каждой фигурки: центр, слева, справа, сзади
function roleStyle(role) {
  const m = isMobile;
  if (role === 'center') return { transform: `translateX(-50%) scale(${m ? 1.25 : 1.68})`, filter: 'blur(0px)', opacity: 1, zIndex: 20, left: '50%', height: m ? '60%' : '92%', bottom: m ? '22%' : '0%' };
  if (role === 'back') return { transform: 'translateX(-50%) scale(1)', filter: 'blur(4px)', opacity: 1, zIndex: 5, left: '50%', height: m ? '13%' : '22%', bottom: m ? '32%' : '12%' };
  return { transform: 'translateX(-50%) scale(1)', filter: 'blur(2px)', opacity: .85, zIndex: 10,
    left: role === 'left' ? (m ? '20%' : '30%') : (m ? '80%' : '70%'), height: m ? '16%' : '28%', bottom: m ? '32%' : '12%' };
}
function render() {
  const roles = { [activeIndex]: 'center', [(activeIndex + 3) % 4]: 'left', [(activeIndex + 1) % 4]: 'right', [(activeIndex + 2) % 4]: 'back' };
  items.forEach((el, i) => Object.assign(el.style, roleStyle(roles[i])));
  page.style.backgroundColor = IMAGES[activeIndex].bg;
}
function navigate(dir) {
  if (isAnimating) return;
  isAnimating = true;
  activeIndex = dir === 'next' ? (activeIndex + 1) % 4 : (activeIndex + 3) % 4;
  render();
  setTimeout(() => { isAnimating = false; }, 650);
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let timer = 0;
const autoplay = () => { clearInterval(timer); if (!reduce) timer = setInterval(() => navigate('next'), 3500); };
document.getElementById('prev').addEventListener('click', () => { navigate('prev'); autoplay(); });
document.getElementById('next').addEventListener('click', () => { navigate('next'); autoplay(); });
addEventListener('resize', () => { const m = innerWidth < 640; if (m !== isMobile) { isMobile = m; render(); } });
render();
autoplay();
})();
</script>
</body>
</html>
