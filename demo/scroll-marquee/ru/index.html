<div id="root"></div>
<script type="text/babel">
const { useRef, useEffect } = React;

const ROW1 = [
    'https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif',
    'https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif',
    'https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif',
    'https://motionsites.ai/assets/hero-stellar-ai-v2-preview-DjvxjG3C.gif',
    'https://motionsites.ai/assets/hero-asme-preview-B_nGDnTP.gif',
    'https://motionsites.ai/assets/hero-transform-data-preview-Cx5OU29N.gif',
    'https://motionsites.ai/assets/hero-vitara-preview-Cjz2QYyU.gif',
    'https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif',
    'https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif',
    'https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif',
    'https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif',
];

const ROW2 = [
    'https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif',
    'https://motionsites.ai/assets/hero-xportfolio-preview-D4A8maiC.gif',
    'https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif',
    'https://motionsites.ai/assets/hero-nexora-preview-cx5HmUgo.gif',
    'https://motionsites.ai/assets/hero-evr-ventures-preview-DZxeVFEX.gif',
    'https://motionsites.ai/assets/hero-planet-orbit-preview-DWAP8Z1P.gif',
    'https://motionsites.ai/assets/hero-new-era-preview-CocuDUm9.gif',
    'https://motionsites.ai/assets/hero-wealth-preview-B70idl_u.gif',
    'https://motionsites.ai/assets/hero-luminex-preview-CxOP7ce6.gif',
    'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=420&h=270&fit=crop&q=80',
];

const TRIPLED_ROW1 = [...ROW1, ...ROW1, ...ROW1];
const TRIPLED_ROW2 = [...ROW2, ...ROW2, ...ROW2];

function MarqueeRow({ images, rowRef, initial }) {
    return (
        <div className="overflow-hidden w-full">
            <div ref={rowRef} className="flex gap-3" style={{ willChange: 'transform', transform: `translateX(${initial}px)` }}>
                {images.map((src, i) => (
                    <div key={i} className="w-[420px] h-[270px] flex-shrink-0 rounded-2xl overflow-hidden">
                        <img src={src} alt="" loading="lazy" className="w-full h-full object-cover" />
                    </div>
                ))}
            </div>
        </div>
    );
}

function ScrollMarquee() {
    const sectionRef = useRef(null);
    const row1Ref = useRef(null);
    const row2Ref = useRef(null);

    useEffect(() => {
        const section = sectionRef.current;
        const row1 = row1Ref.current;
        const row2 = row2Ref.current;
        if (!section || !row1 || !row2) return;

        const handleScroll = () => {
            const rect = section.getBoundingClientRect();
            const sectionTop = rect.top + window.scrollY;
            const scrolled = window.scrollY - sectionTop + window.innerHeight;
            const offset = scrolled * 0.3;
            row1.style.transform = `translateX(${offset - 200}px)`;
            row2.style.transform = `translateX(${-(offset - 200)}px)`;
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();

        return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    return (
        <section ref={sectionRef} id="work" className="relative w-full overflow-hidden pt-24 sm:pt-32 md:pt-40 pb-10" style={{ backgroundColor: '#0C0C0C' }}>
            <div className="flex flex-col gap-3">
                <MarqueeRow images={TRIPLED_ROW1} rowRef={row1Ref} initial={-200} />
                <MarqueeRow images={TRIPLED_ROW2} rowRef={row2Ref} initial={200} />
            </div>
        </section>
    );
}

function App() {
    return (
        <>
            <section className="relative h-screen w-full" style={{ backgroundColor: '#0C0C0C' }}>
                <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 text-white/40">
                    <span className="text-xs uppercase tracking-[0.3em]">Вниз</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 animate-bounce"><path d="M6 9l6 6 6-6" /></svg>
                </div>
            </section>

            <ScrollMarquee />

            <section className="min-h-screen w-full flex items-center justify-center" style={{ backgroundColor: '#0C0C0C' }}>
                <p className="text-white/40 text-xs tracking-wide">© 2026 g.a.d. — Все права защищены.</p>
            </section>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
