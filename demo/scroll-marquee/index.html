<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
<script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>g.a.d. — Work in Motion</title>
<meta name="description" content="g.a.d. — scroll down to watch two rows of recent launches drift across the screen in opposite directions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Kanit', 'sans-serif'] } } } };</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-[#0C0C0C] text-white antialiased overflow-x-hidden font-sans">
<div id="root"></div>
<script type="text/babel">
const { useRef, useEffect } = React;

const ROW1 = [
    'https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1505751172876-fa1923c5c528?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1631217868264-e5b90bb7e133?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1550439062-609e1531270e?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1446776653964-20c1d3a81b06?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1502134249126-9f3755a50d78?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1614642264762-d0a3b8bf3700?w=420&h=270&fit=crop&q=80',
];

const ROW2 = [
    'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1524661135-423995f22d0b?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1497366216548-37526070297c?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=420&h=270&fit=crop&q=80',
    'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=420&h=270&fit=crop&q=80',
];

const TRIPLED_ROW1 = [...ROW1, ...ROW1, ...ROW1];
const TRIPLED_ROW2 = [...ROW2, ...ROW2, ...ROW2];

function MarqueeRow({ images, rowRef, initial }) {
    return (
        <div className="overflow-hidden w-full">
            <div ref={rowRef} className="flex gap-3" style={{ willChange: 'transform', transform: `translateX(${initial}px)` }}>
                {images.map((src, i) => (
                    <div key={i} className="w-[420px] h-[270px] flex-shrink-0 rounded-2xl overflow-hidden">
                        <img src={src} alt="" loading="lazy" className="w-full h-full object-cover" />
                    </div>
                ))}
            </div>
        </div>
    );
}

function ScrollMarquee() {
    const sectionRef = useRef(null);
    const row1Ref = useRef(null);
    const row2Ref = useRef(null);

    useEffect(() => {
        const section = sectionRef.current;
        const row1 = row1Ref.current;
        const row2 = row2Ref.current;
        if (!section || !row1 || !row2) return;

        const handleScroll = () => {
            const rect = section.getBoundingClientRect();
            const sectionTop = rect.top + window.scrollY;
            const scrolled = window.scrollY - sectionTop + window.innerHeight;
            const offset = scrolled * 0.3;
            row1.style.transform = `translateX(${offset - 200}px)`;
            row2.style.transform = `translateX(${-(offset - 200)}px)`;
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();

        return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    return (
        <section ref={sectionRef} id="work" className="relative w-full overflow-hidden pt-24 sm:pt-32 md:pt-40 pb-10" style={{ backgroundColor: '#0C0C0C' }}>
            <div className="flex flex-col gap-3">
                <MarqueeRow images={TRIPLED_ROW1} rowRef={row1Ref} initial={-200} />
                <MarqueeRow images={TRIPLED_ROW2} rowRef={row2Ref} initial={200} />
            </div>
        </section>
    );
}

function App() {
    return (
        <>
            <section className="relative h-screen w-full" style={{ backgroundColor: '#0C0C0C' }}>
                <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 text-white/40">
                    <span className="text-xs uppercase tracking-[0.3em]">Scroll</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 animate-bounce"><path d="M6 9l6 6 6-6" /></svg>
                </div>
            </section>

            <ScrollMarquee />

            <section className="min-h-screen w-full flex items-center justify-center" style={{ backgroundColor: '#0C0C0C' }}>
                <p className="text-white/40 text-xs tracking-wide">© 2026 g.a.d. — All rights reserved.</p>
            </section>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
