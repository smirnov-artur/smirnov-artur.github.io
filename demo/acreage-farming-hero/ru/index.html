        function Reveal({ as: Tag = 'div', variant = 'up', className = '', children, ...rest }) {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
                }, { threshold: 0.15 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            const cls = variant === 'left' ? 'fade-left' : variant === 'right' ? 'fade-right' : variant === 'scale' ? 'scale-in' : 'fade-up';
            return <Tag ref={ref} className={`${cls} ${visible ? 'visible' : ''} ${className}`} {...rest}>{children}</Tag>;
        }

        function CountUp({ to, suffix = '', prefix = '', duration = 1600 }) {
            const ref = useRef(null);
            const [val, setVal] = useState(0);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (!entry.isIntersecting) return;
                    const start = performance.now();
                    const tick = (now) => {
                        const p = Math.min(1, (now - start) / duration);
                        setVal(Math.round(to * (1 - Math.pow(1 - p, 3))));
                        if (p < 1) requestAnimationFrame(tick);
                    };
                    requestAnimationFrame(tick);
                    obs.disconnect();
                }, { threshold: 0.4 });
                obs.observe(el);
                return () => obs.disconnect();
            }, [to, duration]);
            return <span ref={ref}>{prefix}{val.toLocaleString('ru-RU')}{suffix}</span>;
        }
