function Reveal({ children, delay = 0, className = '' }) {
  return (
    <motion.div
      initial={{ opacity: 0, y: 30 }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: '-50px' }}
      transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1], delay }}
      className={className}
    >
      {children}
    </motion.div>
  );
}

function NavItem({ children, href = '#' }) {
  const [cycle, setCycle] = useState(0);
  const bump = () => setCycle(c => c + 1);
  return (
    <a href={href} onClick={e => e.preventDefault()} onMouseEnter={bump} onMouseLeave={bump}

      ) : (

          <span className="absolute inset-0 flex items-center justify-center animate-fly-in-up">{children}</span>
        </React.Fragment>
      )}
    </a>
  );
}

function CycleArrow({ cycle, className }) {
  if (cycle === 0) return <ArrowRight className={className} />;

      <ArrowRight className={`${className} animate-fly-out`} />
      <ArrowRight className={`${className} absolute animate-fly-in`} />
    </React.Fragment>
  );
}

function ScrollReveal({ children, enableBlur = true, baseOpacity = 0.1, baseRotation = 3,
  blurStrength = 4, containerClassName = '', textClassName = '', rotationEnd = 'bottom bottom',
  wordAnimationEnd = 'bottom bottom' }) {
  const containerRef = useRef(null);
  const words = useMemo(() => children.split(/\s+/).filter(Boolean), [children]);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const wordEls = el.querySelectorAll('.word');
    const triggers = [];

    triggers.push(gsap.fromTo(el, { transformOrigin: '0% 50%', rotate: baseRotation }, {
      rotate: 0, ease: 'none',
      scrollTrigger: { trigger: el, start: 'top bottom', end: rotationEnd, scrub: true },
    }));
    triggers.push(gsap.fromTo(wordEls, { opacity: baseOpacity }, {
      opacity: 1, ease: 'none', stagger: 0.05,
      scrollTrigger: { trigger: el, start: 'top bottom-=20%', end: wordAnimationEnd, scrub: true },
    }));
    if (enableBlur) {
      triggers.push(gsap.fromTo(wordEls, { filter: `blur(${blurStrength}px)` }, {
        filter: 'blur(0px)', ease: 'none', stagger: 0.05,
        scrollTrigger: { trigger: el, start: 'top bottom-=20%', end: wordAnimationEnd, scrub: true },
      }));
    }
    return () => triggers.forEach(t => { t.scrollTrigger && t.scrollTrigger.kill(); t.kill(); });
  }, [children]);

  return (
    <h2 ref={containerRef} className={`scroll-reveal ${containerClassName}`}>
      <p className={`scroll-reveal-text ${textClassName}`}>
        {words.map((w, i) => <span key={i} className="word">{w}</span>)}
      </p>
    </h2>
  );
}

  const { scrollY } = useScroll();
  const headerY = useTransform(scrollY, [0, 500, 800], [0, 0, -150]);

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    const handleCanPlay = () => setIsLoaded(true);
    // canplaythrough alone is unreliable across browsers/network conditions and can simply never
    // fire, stranding the visitor on the loading screen forever; loadeddata (fires once the first
    // frame is decoded) is a much safer real-world signal, and the readyState check covers a video
    // that already finished loading before this listener attached.
    video.addEventListener('canplaythrough', handleCanPlay);
    video.addEventListener('loadeddata', handleCanPlay);
    if (video.readyState >= 2) handleCanPlay();
    video.load();
    return () => {
      video.removeEventListener('canplaythrough', handleCanPlay);
      video.removeEventListener('loadeddata', handleCanPlay);
    };
  }, []);

  useEffect(() => {
    if (!isLoaded) return;
    const video = videoRef.current;
    if (!video) return;
    const handleScroll = () => {
      // No video.seeking guard: for this clip a pending seek can take noticeably longer than the
      // gap between scroll events, so gating on it made the scrub stall for a stretch and then
      // jump — measured smoother by just always targeting the latest scroll-derived time.
      if (!screen3Ref.current || !video.duration) return;
      const rect = screen3Ref.current.getBoundingClientRect();
      const absoluteTop = window.scrollY + rect.top;
      const stopScroll = Math.max(1, absoluteTop - (window.innerHeight * 0.2));
      const scrollFraction = Math.max(0, Math.min(1, window.scrollY / stopScroll));
      video.currentTime = scrollFraction * video.duration;
