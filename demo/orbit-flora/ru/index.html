<html lang="ru" class="anim">
<head>
    <meta charset="utf-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#161616">

    <title>g.a.d. — Защищённая система</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        :root{--ink:#fff;--surface:#161616;--orb-reveal:cubic-bezier(.16,1,.3,1);--orb-soft:cubic-bezier(.25,.8,.28,1)}
        *{box-sizing:border-box}
        html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#161616}
        body{font-family:'Space Grotesk',Arial,Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
        .viewport{position:fixed;inset:0;background:#161616}
        .stage{position:absolute;inset:0;contain:strict;isolation:isolate}

        .brand-mark{position:absolute;top:2.141745dvh;left:3.854167vw;width:clamp(34px,min(3.4375vw,5.2dvh),66px);aspect-ratio:66/62;z-index:4;color:#fff}
        .brand-mark svg{display:block;width:100%;height:100%}

        .primary-nav{position:absolute;inset:0;z-index:4;pointer-events:none}
        .primary-nav ul{list-style:none;margin:0;padding:0}
        .primary-nav li{position:absolute;top:3.426791dvh;font-size:clamp(13px,min(1.302083vw,2.05dvh),25px)}
        .primary-nav li:nth-child(1){left:10.104167vw}
        .primary-nav li:nth-child(2){left:17.526042vw}
        .primary-nav li:nth-child(3){left:27.578125vw}
        .primary-nav li:nth-child(4){left:40vw}
        .primary-nav a{display:inline-block;color:#fff;text-decoration:none;pointer-events:auto;transform-origin:left center;white-space:nowrap}

        .pill{position:absolute;top:2.336449dvh;right:7.5vw;height:clamp(34px,4.439252dvh,57px);border-radius:999px;background:#fff;color:#161616;display:flex;align-items:center;padding:0 1.15em;letter-spacing:.026923em;font-size:clamp(12px,.6dvh + .5vw,16px);z-index:4;white-space:nowrap}

        .word{position:absolute;top:11.565421dvh;left:4.348958vw;margin:0;font-family:'Source Serif 4',"Times New Roman",Times,serif;font-weight:400;font-size:min(27.8125vw,55dvh);line-height:1;letter-spacing:.033708em;z-index:1}
        .word__mask{display:block;overflow:hidden;padding-bottom:.18em;margin-bottom:-.18em}
        .word__inner{display:block}
        .word__white{color:#fff}
        .word__pink{background:linear-gradient(180deg,#ffc5dc 0%,#fd86db 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

        .flower{position:absolute;top:14.749065dvh;left:49.121328vw;height:106.109034dvh;width:max-content;transform:translate(-50%,0);pointer-events:none;z-index:2}
        .flower__sizer{visibility:hidden;height:100%;width:auto;display:block}
        .flower__layer{position:absolute;inset:0}
        .flower__layer img{width:100%;height:100%;object-fit:cover;display:block;mask-repeat:no-repeat;-webkit-mask-repeat:no-repeat;mask-size:100% 100%;-webkit-mask-size:100% 100%}
        .flower__layer--top{mask-image:linear-gradient(#0000,#0000);-webkit-mask-image:linear-gradient(#0000,#0000)}

        .corner-copy{position:absolute;bottom:4.361371dvh;color:#f7f7f7;font-size:clamp(14px,min(1.40625vw,2.102804dvh),27px);line-height:1.32;z-index:3}
        .corner-copy--left{left:3.177083vw;transform:scaleX(1.073);transform-origin:left bottom}
        .corner-copy--right{left:78.28125vw;transform:scaleX(1.058);transform-origin:left bottom}

        .burger{display:none;position:absolute;top:2.2dvh;right:5vw;z-index:12;width:44px;height:44px;border-radius:999px;background:#fff;border:0;align-items:center;justify-content:center;flex-direction:column;gap:5px;cursor:pointer;padding:0}
        .burger span{display:block;width:18px;height:2px;background:#161616;border-radius:2px}

        .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;opacity:0;pointer-events:none;transition:opacity .25s var(--orb-soft)}
        .scrim.is-open{opacity:1;pointer-events:auto}

        .sheet{display:none;position:fixed;top:0;right:0;bottom:0;width:min(78vw,340px);background:rgba(22,22,22,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:10;transform:translateX(100%);transition:transform .32s var(--orb-reveal);padding:20dvh 2.4rem 2rem}
        .sheet.is-open{transform:translateX(0)}
        .sheet ul{list-style:none;margin:0;padding:0;flex-direction:column;gap:1.4rem}
        .sheet.is-open ul{display:flex}
        .sheet a{color:#fff;text-decoration:none;font-size:1.4rem}

        @media (max-width:900px),(max-aspect-ratio:4/5){
            .primary-nav,.pill{display:none}
            .burger,.scrim,.sheet{display:flex}
        }
        @media (max-aspect-ratio:4/5){
            .flower{height:min(55dvh,110vw)}
            .word{font-size:min(27.5vw,18dvh)}
            .corner-copy{white-space:normal;max-width:44vw}
            .corner-copy--right{left:auto;right:4vw;text-align:right;transform-origin:right bottom}
        }
        @media (max-width:1200px),(orientation:portrait){
            .word{left:0;width:100%;text-align:center}
        }

        @keyframes orb-word{from{transform:translateY(118%)}to{transform:translateY(0)}}
        @keyframes orb-subject{from{opacity:0;transform:translate(-50%,3.4dvh)}to{opacity:1;transform:translate(-50%,0)}}
        @keyframes orb-corner{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes orb-quiet{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes orb-dim{from{opacity:0}to{opacity:1}}
        @keyframes orb-fade{from{opacity:0}to{opacity:1}}

        @media (prefers-reduced-motion:no-preference){
            html.anim .brand-mark{animation:orb-quiet 620ms var(--orb-soft) 100ms both}
            html.anim .primary-nav li:nth-child(1){animation:orb-dim 550ms var(--orb-soft) 180ms both}
            html.anim .primary-nav li:nth-child(2){animation:orb-dim 550ms var(--orb-soft) 225ms both}
            html.anim .primary-nav li:nth-child(3){animation:orb-dim 550ms var(--orb-soft) 270ms both}
            html.anim .primary-nav li:nth-child(4){animation:orb-dim 550ms var(--orb-soft) 315ms both}
            html.anim .pill{animation:orb-quiet 620ms var(--orb-soft) 340ms both}
            html.anim .word__inner{animation:orb-word 1150ms var(--orb-reveal) 300ms both}
            html.anim .flower{animation:orb-subject 1150ms var(--orb-reveal) 660ms both}
            html.anim .corner-copy__inner{display:block;animation:orb-corner 720ms var(--orb-soft) 980ms both}
            html.anim .burger{animation:orb-quiet 460ms var(--orb-soft) 120ms both}
        }
        @media (prefers-reduced-motion:reduce){
            html.anim .stage{animation:orb-fade 280ms ease both}
        }
    </style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/onest/v11/gNMKW3F-SZuj7xmS-HY6EQ.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/onest/v11/gNMKW3F-SZuj7xmb-HY6EQ.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;

const NAV_ITEMS = [
  { label: 'Главная', href: '#home', scaleX: 1.165 },
  { label: 'Материалы', href: '#resources', scaleX: 1.052 },
  { label: 'Преимущества', href: '#benefits', scaleX: 1.126 },
  { label: 'Контакты', href: '#contact', scaleX: 1.168 },
];

const FRONT_SRC = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_192942_e1086505-d7da-433b-a59b-8220f4e6c808.png&w=1280&q=85';
const REVEAL_SRC = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260808_151324_bf318a5f-5525-4fc7-aab5-e9a341018828.png&w=1280&q=85';

const TRAIL_MAX_POINTS = 60;
const TRAIL_HEAD_R = 140;
const TRAIL_NOISE_AMP = 44;
const TRAIL_BLOB_PTS = 24;
const TRAIL_FADE_SPEED = 0.92;
const TRAIL_SAMPLE_DIST = 8;

function drawMorphBlob(ctx, cx, cy, r, t, seed) {
  if (r < 2) return;
  const pts = [];
  for (let i = 0; i < TRAIL_BLOB_PTS; i++) {
    const angle = (i / TRAIL_BLOB_PTS) * Math.PI * 2;
    const n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
    const n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
    const n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
    const noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / TRAIL_HEAD_R);
    const pr = r + noise;
    pts.push([cx + Math.cos(angle) * pr, cy + Math.sin(angle) * pr]);
  }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  let m0 = mid(pts[pts.length - 1], pts[0]);
  ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < pts.length; i++) {
    const next = pts[(i + 1) % pts.length];
    const m = mid(pts[i], next);
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]);
  }
  ctx.closePath();
  ctx.fill();
}

function App() {
  const stageRef = useRef(null);
  const flowerRef = useRef(null);
  const bgImgRef = useRef(null);
  const topImgRef = useRef(null);
  const [sheetOpen, setSheetOpen] = useState(false);
  const sheetRef = useRef(null);
  const firstLinkRef = useRef(null);
  const burgerRef = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => document.documentElement.classList.remove('anim'), 6000);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    const stage = stageRef.current, flower = flowerRef.current;
    const canvasA = document.createElement('canvas'); // FRONT: opaque white, holes punched (destination-out)
    const canvasB = document.createElement('canvas'); // REVEAL: clear, blobs painted white
    let w = 0, h = 0;
    const resize = () => {
      const r = flower.getBoundingClientRect();
      w = canvasA.width = canvasB.width = Math.max(1, Math.round(r.width));
      h = canvasA.height = canvasB.height = Math.max(1, Math.round(r.height));
    };
    resize();
    window.addEventListener('resize', resize);
    new ResizeObserver(resize).observe(flower);   // the sizer image sets the width only once it loads

    let hovering = false, headRadius = 0, time = 0, mx = 0, my = 0;
    let lastSampleX = -999, lastSampleY = -999;
    let points = [];
    let raf;

    const onMove = e => {
      const r = flower.getBoundingClientRect();
      mx = ((e.clientX - r.left) / r.width) * w;
      my = ((e.clientY - r.top) / r.height) * h;
      hovering = true;
    };
    const onLeave = () => { hovering = false; };
    stage.addEventListener('mousemove', onMove);
    stage.addEventListener('mouseenter', onMove);
    stage.addEventListener('mouseleave', onLeave);

    const ctxA = canvasA.getContext('2d');
    const ctxB = canvasB.getContext('2d');

    const tick = () => {
      const targetR = hovering ? TRAIL_HEAD_R : 0;
      headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);
      if (hovering && headRadius > 5) {
        const dx = mx - lastSampleX, dy = my - lastSampleY;
        if (Math.hypot(dx, dy) > TRAIL_SAMPLE_DIST) {
          points.push({ x: mx, y: my, r: headRadius, alpha: 1, seed: Math.random() * 100 });
          if (points.length > TRAIL_MAX_POINTS) points.shift();
          lastSampleX = mx; lastSampleY = my;
        }
      }
      points.forEach(p => { p.alpha *= TRAIL_FADE_SPEED; p.r *= 0.995; });
      points = points.filter(p => p.alpha >= 0.01);
      time += 0.016;

      const active = hovering || headRadius > 0.5 || points.length > 0;
      if (active && w > 0 && h > 0) {
        ctxA.clearRect(0, 0, w, h);
        ctxA.globalCompositeOperation = 'source-over';
        ctxA.globalAlpha = 1;
        ctxA.fillStyle = '#fff';
        ctxA.fillRect(0, 0, w, h);
        ctxA.globalCompositeOperation = 'destination-out';
        points.forEach(p => { ctxA.globalAlpha = p.alpha; drawMorphBlob(ctxA, p.x, p.y, p.r, time, p.seed); });
        ctxA.globalAlpha = 1; ctxA.globalCompositeOperation = 'source-over';

        ctxB.clearRect(0, 0, w, h);
        ctxB.fillStyle = '#fff';
        points.forEach(p => { ctxB.globalAlpha = p.alpha; drawMorphBlob(ctxB, p.x, p.y, p.r, time, p.seed); });
        ctxB.globalAlpha = 1;

        if (bgImgRef.current) { const u = `url(${canvasA.toDataURL()})`; bgImgRef.current.style.maskImage = u; bgImgRef.current.style.webkitMaskImage = u; }
        if (topImgRef.current) { const u = `url(${canvasB.toDataURL()})`; topImgRef.current.style.maskImage = u; topImgRef.current.style.webkitMaskImage = u; }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      stage.removeEventListener('mousemove', onMove);
      stage.removeEventListener('mouseenter', onMove);
      stage.removeEventListener('mouseleave', onLeave);
    };
  }, []);

  useEffect(() => { if (sheetRef.current) sheetRef.current.inert = !sheetOpen; }, [sheetOpen]);
  useEffect(() => {
    if (!sheetOpen) return;
    firstLinkRef.current && firstLinkRef.current.focus();
    const onKey = e => {
      if (e.key === 'Escape') { setSheetOpen(false); burgerRef.current && burgerRef.current.focus(); return; }
      if (e.key !== 'Tab' || !sheetRef.current) return;
      const focusables = sheetRef.current.querySelectorAll('a[href], button');
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [sheetOpen]);

  return (
    <main className="viewport">
      <section id="home" className="stage" ref={stageRef}>
        <h1 className="word" id="brand-title" aria-label="g.a.d.">
          <span className="word__mask"><span className="word__inner">
            <span className="word__white">g.a.</span><span className="word__pink">d.</span>
          </span></span>
        </h1>

        <div className="flower" ref={flowerRef}>
          <img className="flower__sizer" src={FRONT_SRC} alt="" aria-hidden="true" />
          <div className="flower__layer flower__layer--bg"><img ref={bgImgRef} src={FRONT_SRC} alt="Пиксель-арт розово-фиолетовой лилии" /></div>
          <div className="flower__layer flower__layer--top" aria-hidden="true"><img ref={topImgRef} src={REVEAL_SRC} alt="" /></div>
        </div>

        <div className="corner-copy corner-copy--left"><div className="corner-copy__inner">Каждый процесс<br />разумно связан с другими.</div></div>
        <div className="corner-copy corner-copy--right"><div className="corner-copy__inner">Меньше рутины.<br />Больше значимых результатов.</div></div>

        <div className="brand-mark">
          <svg className="gad-logo" viewBox="293 1 58 58" role="img" aria-label="g.a.d.">
            <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
            <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
          </svg>
        </div>

        <nav className="primary-nav" aria-label="Основная">
          <ul>
            {NAV_ITEMS.map((n, i) => (
              <li key={n.href}>
                <a href={n.href} style={{ transform: `scaleX(${n.scaleX})` }}>{n.label}</a>
              </li>
            ))}
          </ul>
        </nav>

        <div className="pill"><span>Защищённая система</span></div>

        <button ref={burgerRef} className="burger" aria-label="Меню" aria-haspopup="true" aria-expanded={sheetOpen} aria-controls="menu-sheet" onClick={() => setSheetOpen(v => !v)}>
          <span /><span /><span />
        </button>
        <div className={'scrim' + (sheetOpen ? ' is-open' : '')} onClick={() => setSheetOpen(false)} />
        <div className={'sheet' + (sheetOpen ? ' is-open' : '')} id="menu-sheet" ref={sheetRef} role="dialog" aria-modal="true" aria-label="Меню">
          <ul>
            {NAV_ITEMS.map((n, i) => (
              <li key={n.href}><a href={n.href} ref={i === 0 ? firstLinkRef : null} onClick={() => setSheetOpen(false)}>{n.label}</a></li>
            ))}
          </ul>
        </div>
      </section>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
