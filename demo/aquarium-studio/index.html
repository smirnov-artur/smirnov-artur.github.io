<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — Brand &amp; Visual Storytelling</title>
<!-- Один файл вместо React + Tailwind + lucide-react. ?lang=ru — русская версия.
     Логотип-текст из промпта заменён логотипом g.a.d. Абзац в промпте был по-китайски — в английской версии он по-английски.
     Видео — по ссылке CloudFront, как у остальных копий (просьба промпта скачать его к себе не выполнена намеренно).
     Меню телефона лежит под шапкой, чтобы крестик оставался сверху и закрывал его. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.root{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;background:#000;font-family:'Geist',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:#fff}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% center}
.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* шапка */
.nav{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:20px 24px}
.left{display:flex;align-items:center;gap:48px}
.logo{display:block;color:#fff}
.logo svg{display:block;height:22px;width:auto;overflow:visible}
.logo svg text{font-family:'Unbounded',sans-serif}
.logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.links{display:none;align-items:center;gap:32px}
.links a{font-size:14px;line-height:20px;color:rgba(255,255,255,.8);transition:color .15s}
.links a:hover{color:#fff}
.talk{display:none;border-radius:8px;background:#fff;padding:8px 20px;font-size:14px;line-height:20px;font-weight:500;color:#000;transition:transform .15s}
.talk:hover{transform:scale(1.05)}
.burger{position:relative;z-index:50;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.burger:active{transform:scale(.9)}
.burger .i{position:absolute;width:24px;height:24px;transition:all .3s}
.burger .x{transform:rotate(-90deg) scale(0);opacity:0}
.burger.open .m{transform:rotate(90deg) scale(0);opacity:0}
.burger.open .x{transform:none;opacity:1}

/* меню телефона */
.menu{position:fixed;left:0;right:0;top:0;z-index:25;overflow:hidden;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  height:0;opacity:0;pointer-events:none;transition:all .5s cubic-bezier(.16,1,.3,1)}
.menu.open{height:100vh;height:100dvh;opacity:1;pointer-events:auto}
.menu-in{display:flex;height:100%;flex-direction:column;justify-content:center;align-items:flex-start;gap:20px;padding:0 32px;opacity:0;transform:translateY(32px);transition:all .5s cubic-bezier(.16,1,.3,1)}
.menu.open .menu-in{opacity:1;transform:none;transition-delay:.1s}
.menu-in a{font-size:30px;line-height:36px;font-weight:500;color:rgba(255,255,255,.9);transition:color .15s}
.menu-in a:hover{color:#fff}
.menu-in .pill{margin-top:24px;border-radius:9999px;background:#fff;padding:14px 32px;font-size:16px;line-height:24px;font-weight:500;color:#000;transition:transform .15s}
.menu-in .pill:hover{transform:scale(1.05)}

/* первый экран */
.hero{position:relative;z-index:10;display:flex;flex-direction:column;justify-content:space-between;height:calc(100vh - 80px);height:calc(100dvh - 80px);padding:48px 24px 40px}
.top{max-width:768px}
.badge{margin-bottom:16px;font-size:12px;line-height:16px;color:rgba(255,255,255,.9);animation:fadeSlideUp .8s ease .2s both}
h1{font-size:30px;line-height:1.1;font-weight:500;letter-spacing:-.025em;color:#fff;animation:fadeSlideUp .8s ease .4s both}
.lead{max-width:384px;margin-bottom:20px;font-size:14px;line-height:1.625;color:rgba(255,255,255,.6);animation:fadeSlideUp .8s ease .7s both}
.cta{display:inline-flex;align-items:center;gap:8px;border-radius:8px;background:#fff;padding:10px 20px;font-size:14px;line-height:20px;font-weight:500;color:#000;transition:transform .15s;animation:fadeSlideUp .8s ease .9s both}
.cta:hover{transform:scale(1.05)}
.cta .i{width:16px;height:16px}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

@media (min-width:640px){
  .logo svg{height:24px}
  .hero{padding:64px 48px 48px}
  .badge{margin-bottom:24px;font-size:14px;line-height:20px}
  h1{font-size:48px}
  .lead{max-width:512px;margin-bottom:24px;font-size:16px}
  .cta{padding:12px 24px}
}
@media (min-width:768px){
  .nav{padding:20px 48px}
  .links,.talk{display:flex}
  .burger,.menu{display:none}
  .hero{padding:80px 48px 64px}
  h1{font-size:60px}
  .lead{font-size:18px}
}
@media (min-width:1024px){
  .nav{padding:20px 64px}
  .hero{padding-left:64px;padding-right:64px}
  h1{font-size:72px}
}
@media (prefers-reduced-motion:reduce){.logo .ring{animation:none;stroke-dashoffset:0}.logo .orb{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="root">
  <video class="bg" autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204221_5339e40b-e73d-4ab0-9c65-79c18c66fd50.mp4"></video>

  <nav class="nav">
    <div class="left">
      <a class="logo" href="#" aria-label="g.a.d.">
        <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
          <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
          <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
          <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
        </svg>
      </a>
      <div class="links">
        <a href="#" data-t="m1">Home</a>
        <a href="#" data-t="m2">Projects</a>
        <a href="#" data-t="m3">Studio</a>
        <a href="#" data-t="m4">Reach Us</a>
      </div>
    </div>
    <a class="talk" href="#" data-t="talk">Let's Talk</a>
    <button class="burger" id="burger" type="button" aria-label="Menu">
      <svg class="i m" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>
      <svg class="i x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </nav>

  <div class="menu" id="menu">
    <div class="menu-in">
      <a href="#" data-t="m1">Home</a>
      <a href="#" data-t="m2">Projects</a>
      <a href="#" data-t="m3">Studio</a>
      <a href="#" data-t="m4">Reach Us</a>
      <a class="pill" href="#" data-t="talk">Let's Talk</a>
    </div>
  </div>

  <main class="hero">
    <div class="top">
      <p class="badge" data-t="badge">Brand &amp; Visual Storytelling</p>
      <h1 data-h="h1">Shaping Visual<br>narratives,<br>one pixel at a time.</h1>
    </div>
    <div>
      <p class="lead" data-t="lead">Bringing visions to life through craft, motion, and an endless pursuit of beauty.</p>
      <a class="cta" href="#"><span data-t="cta">Explore Work</span><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </div>
  </main>
</div>
<script>
(() => {
if (false) {
  const TR = { m1: 'Главная', m2: 'Проекты', m3: 'Студия', m4: 'Связаться', talk: 'Обсудим',
    badge: 'Бренд и визуальные истории', cta: 'Смотреть работы',
    lead: 'Воплощаем замыслы через ремесло, движение и бесконечный поиск красоты.' };
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — Бренд и визуальные истории';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.textContent = t; });
  document.querySelector('[data-h="h1"]').innerHTML = 'Создаём визуальные<br>истории —<br>пиксель за пикселем.';
}
const burger = document.getElementById('burger'), menu = document.getElementById('menu');
const set = open => { burger.classList.toggle('open', open); menu.classList.toggle('open', open); };
burger.addEventListener('click', () => set(!menu.classList.contains('open')));
menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => set(false)));
})();
</script>
</body>
</html>
