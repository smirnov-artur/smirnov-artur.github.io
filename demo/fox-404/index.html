<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/works/js/gad-loader.js"></script>
<script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page Not Found</title>
<!-- Один файл вместо React + Tailwind + lucide-react. ?lang=ru — русская версия (у Inter есть кириллица).
     Знак из четырёх точек и слово бренда заменены логотипом g.a.d. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;cursor:pointer}
.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(to bottom,#FF8233,#FDAC55)}

/* 404 behind everything */
.back{position:absolute;inset:0;pointer-events:none;opacity:.8;
  -webkit-mask-image:linear-gradient(to bottom,black 40%,transparent 95%);mask-image:linear-gradient(to bottom,black 40%,transparent 95%)}
.back .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* автопилот: 404 сам дышит и плывёт (два периода не совпадают — движение без пауз), видео с лисой в кадре почти неподвижно */
.sway,.breathe{position:absolute;inset:0}
.sway{animation:sway 5.3s ease-in-out infinite alternate}
.breathe{animation:breathe 3.7s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-1.6%)}to{transform:translateX(1.6%)}}
@keyframes breathe{to{transform:scale(1.045)}}
.big{color:#fff;font-weight:900;line-height:1;letter-spacing:-.05em;white-space:nowrap;font-size:clamp(200px,48vw,800px)}
.oval{border-radius:9999px;background:#fff;height:22vh;width:clamp(120px,20vw,400px);transform-origin:center}

/* nav */
.nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px}
.gad{display:block;color:#fff}
.gad svg{display:block;height:24px;width:auto;overflow:visible}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.pills{display:none;gap:4px}
.pills a{padding:6px 16px;font-size:14px;line-height:20px;font-weight:500;border-radius:9999px;background:#fff;color:#F16524;transition:opacity .15s}
.pills a:hover{opacity:.9}
.menu-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;color:#fff;background:#F16524;transition:opacity .15s}
.menu-btn:hover{opacity:.9}
.menu-btn .i{width:16px;height:16px}
.menu-btn span{display:none;font-size:14px;line-height:20px;font-weight:500}

/* menu overlay */
.ov{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s linear .5s}
.ov.open{visibility:visible;transition-delay:0s}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .5s}
.ov.open .shade{opacity:1}
.panel{position:absolute;top:0;right:0;height:100%;width:100%;transform:translateX(100%);
  background:linear-gradient(135deg,#FF6B1A 0%,#FF9642 100%);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.ov.open .panel{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.close{width:40px;height:40px;border-radius:9999px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;transition:background-color .15s}
.close:hover{background:rgba(255,255,255,.3)}
.close .i{width:20px;height:20px}
.items{display:flex;flex-direction:column;gap:8px;padding:16px 24px}
.items a{padding:16px 24px;font-size:18px;line-height:28px;font-weight:600;color:#fff;border-radius:16px;background:rgba(255,255,255,.1);
  opacity:0;transform:translateY(16px);transition:all .3s;transition-delay:0ms}
.items a:hover{background:rgba(255,255,255,.2)}
.ov.open .items a{opacity:1;transform:none;transition-delay:var(--d)}
.pbot{position:absolute;bottom:0;left:0;right:0;padding:24px;opacity:0;transform:translateY(16px);transition:all .3s}
.ov.open .pbot{opacity:1;transform:none;transition-delay:.45s}
.pbot a{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 0;border-radius:9999px;background:#fff;color:#F16524;font-weight:600;font-size:16px;line-height:24px;transition:transform .2s}
.pbot a:hover{transform:scale(1.02)}
.pbot .i{width:20px;height:20px}

/* center video */
.vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;margin-top:calc(-6vh - 40px)}
.vbox{flex:none;width:120vw;height:85vh}
.vbox video{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;mix-blend-mode:darken}

/* bottom */
.bottom{position:relative;z-index:30;margin-top:auto;padding:0 16px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.bottom h1{color:#fff;font-size:18px;line-height:28px;font-weight:500;margin-bottom:12px}
.home{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:9999px;color:#fff;font-weight:600;font-size:14px;line-height:20px;background:#F16524;transition:all .15s}
.home:hover{transform:scale(1.05);box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
.home .i{width:16px;height:16px}

@media (min-width:640px){
  .nav{padding:20px 24px}
  .gad svg{height:28px}
  .menu-btn{padding:10px 20px}
  .menu-btn span{display:inline}
  .oval{height:26vh}
  .panel{width:380px}
  .vbox{width:70vw;height:70vh}
  .bottom{padding-bottom:64px}
  .bottom h1{font-size:20px;margin-bottom:16px}
  .home{padding:16px 32px;font-size:16px;line-height:24px}
  .home .i{width:20px;height:20px}
}
@media (min-width:768px){
  .nav{padding-left:48px;padding-right:48px}
  .pills{display:flex}
  .oval{height:50vh}
  .vbox{width:62vw;height:78vh}
  .bottom h1{font-size:24px;line-height:32px}
}
@media (prefers-reduced-motion:reduce){.gad .ring{animation:none;stroke-dashoffset:0}.gad .orb{animation:none;opacity:1}.sway,.breathe{animation:none}}
</style>
</head>
<body>
<div class="page">
  <div class="back" aria-hidden="true">
    <div class="sway"><div class="breathe">
      <div class="c"><div class="big" id="big">404</div></div>
      <div class="c"><div class="oval" id="oval"></div></div>
    </div></div>
  </div>

  <nav class="nav">
    <a class="gad" href="#" aria-label="g.a.d.">
      <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
        <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
        <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
      </svg>
    </a>
    <div class="pills">
      <a href="#" data-t="n1">About Us</a><a href="#" data-t="n2">Programs</a><a href="#" data-t="n3">Reviews</a><a href="#" data-t="n4">FAQ</a><a href="#" data-t="n5">Contacts</a>
    </div>
    <button class="menu-btn" id="open" type="button" aria-label="Menu">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>
      <span data-t="menu">Menu</span>
    </button>
  </nav>

  <div class="ov" id="ov">
    <div class="shade" id="shade"></div>
    <aside class="panel">
      <div class="ph">
        <span class="gad" aria-label="g.a.d.">
          <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
            <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
            <circle cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6"/>
            <circle cx="322" cy="8" r="5" fill="currentColor"/>
          </svg>
        </span>
        <button class="close" id="close" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="items">
        <a href="#" style="--d:150ms" data-t="n1">About Us</a>
        <a href="#" style="--d:210ms" data-t="n2">Programs</a>
        <a href="#" style="--d:270ms" data-t="n3">Reviews</a>
        <a href="#" style="--d:330ms" data-t="n4">FAQ</a>
        <a href="#" style="--d:390ms" data-t="n5">Contacts</a>
      </div>
      <div class="pbot"><a href="#"><svg class="i" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span data-t="home">Back to Home</span></a></div>
    </aside>
  </div>

  <div class="vid">
    <div class="vbox">
      <video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_234424_b1332b69-2e69-4302-8dbc-40f86846afbd.mp4"></video>
    </div>
  </div>

  <div class="bottom">
    <h1 data-t="oops">Oops, something went wrong!</h1>
    <a class="home" href="#"><svg class="i" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span data-t="home">Back to Home</span></a>
  </div>
</div>
<script>
(() => {
if (false) {
  const TR = { n1: 'О нас', n2: 'Программы', n3: 'Отзывы', n4: 'Вопросы', n5: 'Контакты', menu: 'Меню',
    home: 'На главную', oops: 'Ой, что-то пошло не так!' };
  document.documentElement.lang = 'ru';
  document.title = '404 — страница не найдена';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.textContent = t; });
  document.getElementById('open').setAttribute('aria-label', 'Меню');
  document.getElementById('close').setAttribute('aria-label', 'Закрыть');
}
// 404: stretch vertically to the viewport height (x 1.4), the oval follows the same scaleY
const big = document.getElementById('big'), oval = document.getElementById('oval');
const fit = () => {
  const s = window.innerHeight / big.offsetHeight;
  big.style.transform = `scale(1.15, ${s * 1.4})`;
  oval.style.transform = `scaleY(${s})`;
};
fit(); addEventListener('resize', fit);
if (document.fonts) document.fonts.ready.then(fit);

const ov = document.getElementById('ov');
const set = open => { ov.classList.toggle('open', open); document.body.style.overflow = open ? 'hidden' : ''; };
document.getElementById('open').addEventListener('click', () => set(true));
document.getElementById('close').addEventListener('click', () => set(false));
document.getElementById('shade').addEventListener('click', () => set(false));
ov.querySelectorAll('a').forEach(a => a.addEventListener('click', () => set(false)));
addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
})();
</script>
</body>
</html>
