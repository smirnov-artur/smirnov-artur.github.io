function ArrowRight({ size = 15, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <path d="M5 12h14" />

    </svg>
  );
}
function ArrowUpRight({ size = 18, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <path d="M7 7h10v10" />
      <path d="M7 17 17 7" />
    </svg>
  );
}

function SplitChars({ text, startDelay = 0, step = 0.06 }) {
  return text.split('').map((ch, i) => (
    <motion.span
      key={i}
      initial={{ opacity: 0, y: 40 }}
      animate={{ opacity: 1, y: 0 }}
      transition={{ duration: 0.8, ease: [0.22, 1, 0.36, 1], delay: startDelay + i * step }}
      style={{ display: 'inline-block' }}
    >
      {ch === ' ' ? ' ' : ch}
    </motion.span>
  ));
}

function Navbar() {
  return (
    <nav className="relative z-50 flex items-center justify-between px-4 sm:px-6 lg:px-10 py-4 lg:py-5">
