html,body{font-family:'Helvetica Now Var','Helvetica Neue',Helvetica,Arial,sans-serif;margin:0;overflow-x:hidden;background:#0a0a0a}
.site-nav{padding:20px 32px}

.hero-overlay{position:absolute;top:0;left:0;right:0;height:48%;background:#C5C5C5;display:flex;flex-direction:column;padding-top:70px}
.hero-row{display:flex;align-items:stretch;width:100%;gap:48px}
.hero-col-left{width:32%;display:flex;flex-direction:column;justify-content:space-between;gap:80px}
.hero-col-right{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:80px}
.hero-buttons{display:flex;gap:10px}
.btn-primary,.btn-secondary{border-radius:9999px;padding:12px 36px;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border:1px solid #1a1a1a;cursor:pointer;transition:background .2s,color .2s;display:inline-block}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-secondary{background:transparent;color:#1a1a1a}

.hero-bottom-text{position:absolute;top:74%;transform:translateY(-50%);left:32px;max-width:260px}
.section-pad{padding:70px 32px 32px 32px}
.section-pad-lg{padding:70px 32px 80px 32px}
.services-head-row{display:flex;gap:48px;align-items:flex-start;margin-bottom:32px}
.services-head-left{width:32%}
.services-head-right{flex:1;padding-top:8px}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;grid-auto-rows:1fr}
.card-video{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden}
.card-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes scrollBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.scroll-indicator{animation:scrollBounce 2s ease-in-out infinite}
.repost-btn{cursor:pointer;transition:opacity .2s}

@media (max-width:900px){

  .nav-links-secondary{display:none}

  .section-pad-lg{padding:90px 18px 60px 18px}

    const Tag = TAGS[as] || motion.div;

        <Tag initial={{ opacity: 0, y }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once, amount: 0.2 }}
             transition={{ duration, delay, ease: [0.22, 1, 0.36, 1] }} className={className} style={style}>
            {children}
        </Tag>
    );
};
