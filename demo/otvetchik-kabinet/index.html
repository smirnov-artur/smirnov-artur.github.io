<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Кабинет g.a.d.</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#111113;--s2:#1c1c1e;--s3:#2c2c2e;--s4:#3a3a3c;--line:rgba(255,255,255,.12);
  --t1:#fff;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.32);--lime:#d6ff3f;--lime-dim:rgba(214,255,63,.13);
  --ui:-apple-system,"SF Pro Text",Manrope,"Helvetica Neue",Arial,sans-serif;--brand:Unbounded,Manrope,sans-serif;
  --ios:cubic-bezier(.32,.72,0,1);--pruzh:cubic-bezier(.34,1.36,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{background:var(--bg);color:var(--t1)}
body{font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:var(--t1);background:var(--s2);border:0;border-radius:12px;height:44px;padding:0 14px;outline:0;width:100%}
.ik{width:22px;height:22px;fill:currentColor;flex:none;display:block}
.ekran{padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 110px);max-width:560px;margin:0 auto;animation:vkl .3s var(--ios)}
.ekran[hidden]{display:none}
@keyframes vkl{from{opacity:.4}to{opacity:1}}
@keyframes poyav{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:34px;font-weight:700;letter-spacing:-.022em;padding:0 20px 2px}
.pod{padding:0 20px 20px;color:var(--t2);font-size:15px;display:flex;align-items:center;gap:7px}
.tochka{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none;animation:pul 2.4s infinite}
.tochka.net{background:var(--t3);animation:none}
@keyframes pul{0%{box-shadow:0 0 0 0 rgba(214,255,63,.45)}70%{box-shadow:0 0 0 8px rgba(214,255,63,0)}100%{box-shadow:0 0 0 0 rgba(214,255,63,0)}}
.gruppa{margin:0 16px 24px;animation:poyav .4s var(--ios) both}
.gruppa>h4{font-size:13px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 8px;display:flex;justify-content:space-between}
.gruppa>h4 .lm{color:var(--lime)}
.gruppa>.niz{font-size:13px;color:var(--t3);padding:8px 16px 0;line-height:1.35}
.spisok{background:var(--s1);border-radius:14px;overflow:hidden}
.stroka{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;width:100%;text-align:left;background:var(--s1);transition:background .12s}
button.stroka:active{background:var(--s3)}
.stroka .telo{flex:1;min-width:0;padding:11px 0;display:flex;align-items:center;gap:10px;align-self:stretch}
.stroka+.stroka .telo{box-shadow:inset 0 .5px 0 var(--line)}
.stroka .tx{flex:1;min-width:0}
.stroka .tx b{display:block;font-size:17px;font-weight:500;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stroka .tx small{display:block;font-size:14.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.verh{display:flex;align-items:baseline;gap:8px}.verh b{flex:1;min-width:0}
.zn{color:var(--t2);font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.shev{width:14px;height:14px;color:var(--t3)}
.ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#76767c,#4a4a4f);display:grid;place-items:center;font-size:16px;font-weight:600;flex:none}
.ava.vy{background:linear-gradient(180deg,#e4ff72,#c9f124);color:#0a0a0c}
.plitka{width:30px;height:30px;border-radius:8px;background:linear-gradient(180deg,#414145,#2a2a2d);display:grid;place-items:center;flex:none}
.plitka .ik{width:19px;height:19px}
.plitka.lime{background:linear-gradient(180deg,#e4ff72,#c9f124);color:#0a0a0c}
.krasn{color:#ff453a}
.molchit{font-size:12px;font-weight:600;color:var(--t2);background:var(--s3);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.pusto{margin:10px 16px 24px;text-align:center;padding:30px 20px;background:var(--s1);border-radius:20px;animation:poyav .4s var(--ios)}
.pusto .ik{width:36px;height:36px;color:var(--lime);margin:0 auto 12px}
.pusto b{display:block;font-size:19px;letter-spacing:-.01em;margin-bottom:6px}
.pusto p{color:var(--t2);font-size:15px;margin-bottom:18px}
.knopka{height:50px;border-radius:25px;font-size:17px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--pruzh)}
.knopka:active{transform:scale(.97)}
.knopka.gl{background:var(--lime);color:#0a0a0c}
.knopka.vt{background:var(--s2)}
.knopka .ik{width:19px;height:19px}
.knopki{margin:0 16px 24px;display:grid;gap:10px}
.vse-resheno{display:flex;align-items:center;gap:10px;padding:14px 16px;color:var(--t2)}
.vse-resheno .ik{color:var(--lime);width:24px;height:24px}
.karta{margin:0 16px 20px;border-radius:22px;padding:22px 20px;background:radial-gradient(120% 110% at 100% 0%,rgba(214,255,63,.2),rgba(214,255,63,0) 60%),var(--s1);border:.5px solid rgba(214,255,63,.22);animation:poyav .4s var(--ios)}
.karta small{color:var(--t2);font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.karta b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.karta p{color:var(--t2);font-size:15px}
.polosa{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:14px}
.polosa i{display:block;height:100%;background:var(--lime);border-radius:3px;transition:width .8s var(--ios)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--lime);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:left .35s var(--pruzh)}
.sw.vykl{background:var(--s4)}.sw.vykl::after{left:2px}
/* плавающая панель вкладок, стекло */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(360px,calc(100% - 32px));height:62px;border-radius:31px;
  display:grid;grid-template-columns:repeat(3,1fr);padding:4px;z-index:50;background:rgba(44,44,48,.55);-webkit-backdrop-filter:blur(20px) saturate(190%);backdrop-filter:blur(20px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.45)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:27px;background:rgba(255,255,255,.11);transition:transform .55s var(--pruzh)}
.tabbar button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:rgba(235,235,245,.72)}
.tabbar .ik{width:25px;height:25px}.tabbar .ik.f{display:none}
.tabbar .akt{color:var(--lime)}.tabbar .akt .ik.r{display:none}.tabbar .akt .ik.f{display:block}
.tabbar .akt .ik{animation:skok .5s var(--pruzh)}
@keyframes skok{35%{transform:scale(.8)}70%{transform:scale(1.14)}}
.bej{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--lime);color:#0a0a0c;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.bej[hidden]{display:none}
/* шторка */
.zatemn{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .4s var(--ios);z-index:70}
.zatemn.vid{opacity:1;pointer-events:auto}
.shtorka{position:fixed;left:8px;right:8px;bottom:8px;max-width:560px;margin:0 auto;max-height:86vh;overflow:auto;background:rgba(30,30,33,.94);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  border-radius:34px;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(calc(100% + 24px));transition:transform .5s var(--ios);z-index:80}
.shtorka.vid{transform:none}
.ruchka{width:36px;height:5px;border-radius:3px;background:var(--s4);margin:0 auto 16px}
.shtorka h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.shtorka .m{color:var(--t2);font-size:14px;margin:2px 0 16px}
.pz{max-width:86%;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.35;margin-bottom:8px;width:fit-content}
.pz.pok{background:var(--s3);border-bottom-left-radius:6px}
.pz.nash{background:#262629;margin-left:auto;border-bottom-right-radius:6px}
.pz .kto{display:block;font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:2px}
.pochemu{background:var(--lime-dim);color:var(--t1);border-radius:14px;padding:11px 14px;font-size:14.5px;margin:6px 0 14px}
.pochemu b{color:var(--lime);display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.p-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 14px;margin:12px 0}
.p-sw b{display:block;font-size:16px;font-weight:500}.p-sw small{color:var(--t2);font-size:13px}
.podskaz{color:var(--t3);font-size:13px;text-align:center;margin-top:10px}
.shtorka .knopka{margin-top:10px}
.dva{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}
.dva label{display:flex;align-items:center;gap:10px;color:var(--t2);font-size:15px}
.dva input{background:rgba(255,255,255,.1);font-size:20px;font-weight:600;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,14px);background:rgba(44,44,48,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-radius:20px;padding:11px 18px;font-size:14px;font-weight:500;opacity:0;transition:all .4s var(--pruzh);z-index:90;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast[data-on]{opacity:1;transform:translate(-50%,0)}
#sboy{display:none;margin:0 16px 16px;background:rgba(255,105,97,.12);color:#ff9b95;border-radius:14px;padding:12px 14px;font-size:14.5px}
body[data-sost="oshibka"] #sboy{display:block}
.skelet{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.2s infinite;margin:0 16px 10px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<nav class="tabbar" id="tabbar">
  <span class="tab-ind" id="tab-ind"></span>
  <button data-tab="dialogi" class="akt"><svg class="ik r"><use href="#r-chats-circle"/></svg><svg class="ik f"><use href="#f-chats-circle"/></svg>Диалоги<span class="bej" id="bej" hidden></span></button>
  <button data-tab="prays"><svg class="ik r"><use href="#r-file-text"/></svg><svg class="ik f"><use href="#f-file-text"/></svg>Прайс</button>
  <button data-tab="tarif"><svg class="ik r"><use href="#r-credit-card"/></svg><svg class="ik f"><use href="#f-credit-card"/></svg>Тариф</button>
</nav>
<div class="zatemn" id="zatemn"></div>
<div class="shtorka" id="shtorka"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
const V_TG = !!(TG && TG.initData);   // вне мини-приложения скрипт Telegram есть, а подписи нет
const trk = (m, a) => { try { if (V_TG && TG.HapticFeedback) TG.HapticFeedback[m](a); } catch (e) {} };
if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }
if (V_TG) { try { TG.setHeaderColor('#000000'); TG.setBackgroundColor('#000000'); TG.disableVerticalSwipes && TG.disableVerticalSwipes(); } catch (e) {} }
const ik = (id, kl) => '<svg class="ik' + (kl ? ' ' + kl : '') + '"><use href="#' + id + '"/></svg>';
const SHEV = ik("b-caret-right", "shev");
const V_CHATE = ['kupit', 'zayavki', 'stop_avito', 'udalit'];
// тексты покупателей приходят с Авито: без экранирования чужое сообщение стало бы разметкой страницы с подписанным входом
const ek = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s) => document.querySelector(s);
// «3990» из таблицы → «3 990 ₽»; вилки и текст как есть
const cena = (c) => { c = String(c || '').trim(); if (!c) return ''; if (/^\d{4,}$/.test(c)) c = c.replace(/\B(?=(\d{3})+$)/g, ' '); return /₽|руб/i.test(c) ? c : c + ' ₽'; };
const plural = (n, a, b, c) => { const m = n % 10, s = n % 100; return m === 1 && s !== 11 ? a : m >= 2 && m <= 4 && (s < 12 || s > 14) ? b : c; };

function razobrat() {   // адрес живого сервера и снимок данных едут в хеше ссылки; Telegram дописывает туда свои tgWebApp* — их пропускаем
  const h = location.hash.slice(1);
  const p = new URLSearchParams(/^(api|d)=/.test(h) ? h : 'd=' + h.split('&')[0]);
  const a = p.get('api') || '';
  let dan = {};
  try { const x = p.get('d'); if (x) dan = JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) {}
  // адрес только https и только домен: initData и нажатия уходят туда, куда показывает хеш
  return { api: /^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(a) ? a : null, dan };
}
const NACHALO = razobrat(), API = NACHALO.api;
let D = NACHALO.dan || {}, tab = 'dialogi', otkryt = null;

async function sServera(put, telo) {
  const r = await fetch(API + put, { method: telo ? 'POST' : 'GET', body: telo ? JSON.stringify(telo) : undefined,
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': (TG && TG.initData) || '' } });
  if (!r.ok) throw new Error('сервер ответил ' + r.status);
  return r.json();
}
const beda = (e) => /\b403\b/.test(e.message || '') ? 'Вход из Telegram действует сутки и уже истёк. Закройте кабинет и откройте заново из чата с ботом.'
  : 'Нет связи с сервером. Проверьте интернет — данные обновятся сами.';

/* ---------- экраны ---------- */
function stroka(o) {
  return '<button class="stroka"' + (o.a || '') + '>' + (o.lev || '') + '<span class="telo"><span class="tx"><span class="verh"><b>' + o.zag + '</b>' +
    (o.zn ? '<span class="zn">' + o.zn + '</span>' : '') + '</span>' + (o.pod ? '<small>' + o.pod + '</small>' : '') + '</span>' + (o.prav || SHEV) + '</span></button>';
}
function podklyuchitKarta() {
  return D.avito_metka && API ? '<div class="pusto">' + ik('r-storefront') + '<b>Подключите Авито</b><p>Одна кнопка: откроется Авито, нажмёте «Разрешить». Ключи не нужны.</p>' +
    '<button class="knopka gl" data-avito>Подключить Авито</button></div>'
    : '<div class="pusto">' + ik('r-storefront') + '<b>Авито пока не подключён</b><p>Подключение — в чате с ботом: команда /avito.</p></div>';
}
function risDialogi() {
  const dl = D.dialogi || [], zh = dl.filter(x => x.status === 'vy'), n = D.otvetov_segodnya || 0;
  $('#d-pod').textContent = !(D.kabinety || []).length ? 'Авито не подключён' : n ? 'Сегодня ИИ ответил на ' + n + ' ' + plural(n, 'сообщение', 'сообщения', 'сообщений') : 'Сегодня пока тихо';
  $('#tochka').className = 'tochka' + ((D.kabinety || []).length ? '' : ' net');
  const bej = $('#bej'); bej.hidden = !zh.length; bej.textContent = zh.length;
  if (!(D.kabinety || []).length) { $('#d-telo').innerHTML = podklyuchitKarta(); return; }
  if (!dl.length) { $('#d-telo').innerHTML = '<div class="pusto">' + ik('f-chats-circle') + '<b>Пока тихо</b><p>Как только покупатель напишет в Авито, здесь появится его вопрос и ответ ИИ.</p></div>'; return; }
  const row = (x) => stroka({ a: ' data-dlg="' + dl.indexOf(x) + '"', lev: '<span class="ava' + (x.status === 'vy' ? ' vy' : '') + '">' + ek((x.kto || '?')[0]) + '</span>',
    zag: ek(x.kto) + (x.tiho ? '<span class="molchit">ИИ молчит</span>' : ''), zn: ek(String(x.kogda || '').split(', ').pop()), pod: ek(x.vopros) });
  const ost = dl.filter(x => x.status !== 'vy');
  $('#d-telo').innerHTML = (zh.length ? '<div class="gruppa"><h4><span>Ждут вас</span><span class="lm">' + zh.length + '</span></h4><div class="spisok">' + zh.map(row).join('') +
      '</div><div class="niz">Ответить можно прямо в Telegram — ответом на сообщение «Нужно ваше решение».</div></div>'
    : '<div class="gruppa"><div class="spisok"><div class="vse-resheno">' + ik('f-check-circle') + 'Всё решено, покупатели ждут только ИИ.</div></div></div>') +
    (ost.length ? '<div class="gruppa"><h4><span>Недавние</span></h4><div class="spisok">' + ost.map(row).join('') + '</div></div>' : '');
}
function risPrays() {
  const n = D.prays_n || 0;
  $('#p-pod').textContent = n ? n + ' ' + plural(n, 'позиция', 'позиции', 'позиций') + (D.prays_kogda ? ' · обновлён ' + D.prays_kogda : '') : '';
  $('#p-telo').innerHTML = n
    ? '<div class="gruppa"><div class="spisok">' + (D.prays_spisok || []).map(([i, c]) => stroka({ zag: ek(i), prav: '<span class="zn">' + ek(cena(c)) + '</span>' })).join('') +
      '</div><div class="niz">' + (n > 10 ? 'Здесь первые 10 строк. ' : '') + 'Цены и наличие ИИ берёт только из прайса и ваших объявлений.</div></div>' +
      '<div class="knopki"><button class="knopka vt" data-cmd="moy">' + ik('r-download-simple') + 'Загрузить новый прайс</button></div>'
    : '<div class="pusto">' + ik('r-file-text') + '<b>Прайса пока нет</b><p>ИИ отвечает по вашим объявлениям. С прайсом он точнее называет цены и наличие.</p>' +
      '<button class="knopka gl" data-cmd="moy">Загрузить прайс</button></div>';
}
function risTarif() {
  const oplachen = D.paket && D.paket !== 'Проба', r = D.rashod || {}, dn = (D.proba || []).find(p => p[0] === 'Авито');
  const karta = oplachen
    ? '<div class="karta"><small>Ваш тариф</small><b>' + ek(String(D.paket).replace(/^Тариф /, '')) + '</b><p>' + ek(r.n) + ' из ' + ek(r.iz) + ' ответов в этом месяце</p>' +
      '<div class="polosa"><i style="width:' + Math.min(100, Math.round(100 * (r.n || 0) / (r.iz || 1))) + '%"></i></div></div>'
    : '<div class="karta"><small>Сейчас</small><b>Пробная неделя</b><p>' + (dn ? 'Осталось ' + dn[1] + ' ' + plural(dn[1], 'день', 'дня', 'дней') : 'Начнётся, когда подключите Авито') + ' · без оплаты</p></div>';
  const kab = (D.kabinety || []).map(k => stroka({ lev: '<span class="plitka lime">' + ik('r-storefront') + '</span>', zag: ek(k.imya || 'Кабинет Авито'),
    prav: '<span class="zn">' + (k.auto ? 'отвечает сам' : 'черновики') + '</span>', a: ' data-nichego' })).join('');
  $('#t-telo').innerHTML = karta +
    '<div class="knopki"><button class="knopka gl" data-cmd="kupit">' + (oplachen ? 'Продлить' : 'Оплатить') + '</button></div>' +
    '<div class="gruppa"><h4><span>Как отвечает ИИ</span></h4><div class="spisok">' +
      '<div class="stroka"><span class="telo"><span class="tx"><b>Отвечает сам</b><small>Выключите — будет присылать черновики</small></span><button class="sw' + (D.sam ? '' : ' vykl') + '" data-cmd="sam_pereklyuchit" aria-label="ИИ отвечает сам"></button></span></div>' +
      '<div class="stroka"><span class="telo"><span class="tx"><b>Копия каждого ответа</b><small>Обычно в чат — только ваши решения</small></span><button class="sw' + (D.kopii ? '' : ' vykl') + '" data-kopii aria-label="Копии в чат"></button></span></div>' +
      stroka({ zag: 'Часы', a: ' data-chasy', prav: '<span class="zn">' + ek(D.chasy || 'круглые сутки') + '</span>' + SHEV }) +
    '</div></div>' +
    '<div class="gruppa"><h4><span>Авито</span></h4><div class="spisok">' + kab +
      (D.avito_metka && API ? stroka({ lev: '<span class="plitka">' + ik('b-plus') + '</span>', zag: kab ? 'Подключить ещё кабинет' : 'Подключить Авито', a: ' data-avito' }) : '') +
    '</div></div>' +
    '<div class="gruppa"><h4><span>Ещё</span></h4><div class="spisok">' +
      stroka({ lev: '<span class="plitka">' + ik('r-download-simple') + '</span>', zag: 'Заявки файлом Excel', a: ' data-cmd="zayavki"' }) +
      (kab ? stroka({ lev: '<span class="plitka">' + ik('r-bell-slash') + '</span>', zag: 'Отключить Авито', a: ' data-cmd="stop_avito"' }) : '') +
      stroka({ zag: '<span class="krasn">Удалить мои данные</span>', a: ' data-cmd="udalit"' }) +
    '</div><div class="niz">Откроется чат с ботом. Перед отключением и удалением он переспросит.</div></div>';
}
function narisovat() { risDialogi(); risPrays(); risTarif(); if (otkryt !== null) otkrytDialog(otkryt, true); }

/* ---------- шторка диалога ---------- */
function otkrytDialog(i, tiho_) {
  const x = (D.dialogi || [])[i];
  if (!x) { zakryt(); return; }
  otkryt = i;
  const kto_otv = x.status === 'sam' ? 'Ответили вы' : x.status === 'chernovik' ? 'Черновик — ждёт кнопки в чате' : 'Ответил ИИ';
  $('#shtorka').innerHTML = '<div class="ruchka"></div><h3>' + ek(x.kto) + '</h3><p class="m">' + (x.kanal === 'tg' ? 'Telegram' : x.kanal === 'max' ? 'MAX' : 'Авито') +
    (x.ob ? ' · «' + ek(x.ob) + '»' : '') + ' · ' + ek(x.kogda) + '</p>' +
    '<div class="pz pok">' + ek(x.vopros) + '</div>' + (x.otvet ? '<div class="pz nash"><span class="kto">' + ek(kto_otv) + '</span>' + ek(x.otvet) + '</div>' : '') +
    (x.status === 'vy' ? '<div class="pochemu"><b>Почему нужны вы</b>' + ek(x.pochemu || 'ИИ передал вопрос вам') + '</div>' : '') +
    '<div class="p-sw"><div><b>ИИ отвечает в этом чате</b><small>' + (x.tiho ? 'Молчит, отвечаете вы' : 'Выключите — и чат ваш') + '</small></div>' +
    '<button class="sw' + (x.tiho ? ' vykl' : '') + '" data-tiho aria-label="ИИ отвечает в этом чате"></button></div>' +
    (x.url ? '<button class="knopka gl" data-url="' + ek(x.url) + '">' + ik('r-arrow-square-out') + 'Открыть чат в Авито</button>' : '') +
    (x.status === 'vy' ? '<button class="knopka vt" data-resheno>' + ik('b-check') + 'Решено</button><p class="podskaz">Или ответьте в Telegram на «Нужно ваше решение» — отправлю покупателю.</p>' : '');
  if (!tiho_) { $('#zatemn').classList.add('vid'); $('#shtorka').classList.add('vid'); trk('impactOccurred', 'medium'); }
  if (V_TG && TG.BackButton) { try { TG.BackButton.show(); } catch (e) {} }
}
function zakryt() {
  otkryt = null; $('#zatemn').classList.remove('vid'); $('#shtorka').classList.remove('vid');
  if (V_TG && TG.BackButton) { try { TG.BackButton.hide(); } catch (e) {} }
}
function chasyShtorka() {
  const sd = D.chasy_sd || [9, 20];
  $('#shtorka').innerHTML = '<div class="ruchka"></div><h3>Часы</h3><p class="m">В эти часы покупателям отвечаете вы, ИИ молчит. В остальное время отвечает он.</p>' +
    '<div class="dva"><label>с<input id="ch-s" inputmode="numeric" value="' + ek(sd[0]) + '"></label><label>до<input id="ch-do" inputmode="numeric" value="' + ek(sd[1]) + '"></label></div>' +
    '<button class="knopka gl" data-chasy-ok>Сохранить</button><button class="knopka vt" data-cmd="chasy_vsegda">ИИ отвечает круглые сутки</button>';
  otkryt = null; $('#zatemn').classList.add('vid'); $('#shtorka').classList.add('vid');
  if (V_TG && TG.BackButton) { try { TG.BackButton.show(); } catch (e) {} }
}
if (V_TG && TG.BackButton) { try { TG.BackButton.onClick(zakryt); } catch (e) {} }

/* ---------- действия ---------- */
async function poslat(o) {
  trk('impactOccurred', 'light');
  if (API) {
    try { const s = await sServera('/api/deystvie', o); D = s; document.body.dataset.sost = 'gotovo'; narisovat(); if (s.skazat) pokazat(s.skazat); }
    catch (e) { pokazat(beda(e)); }
    return;
  }
  try { if (!V_TG) throw 0; TG.sendData(JSON.stringify(o)); } catch (e) { pokazat('Это просмотр: откройте кабинет кнопкой в чате с ботом.'); }
}
let taymer;
function pokazat(t) { const n = $('#toast'); n.textContent = t; n.dataset.on = '1'; clearTimeout(taymer); taymer = setTimeout(() => n.removeAttribute('data-on'), 3600); }
function otkrytSsylku(u) {
  try { if (V_TG && TG.openLink) { TG.openLink(u); return; } } catch (e) {}
  window.open(u, '_blank', 'noopener');
}
function pokazTab(t) {
  if (t !== tab) trk('selectionChanged');
  tab = t;
  ['dialogi', 'prays', 'tarif'].forEach((x, i) => {
    $('#e-' + x).hidden = x !== t;
    const b = document.querySelector('[data-tab="' + x + '"]'); b.classList.toggle('akt', x === t);
    if (x === t) $('#tab-ind').style.transform = 'translateX(' + i * 100 + '%)';
  });
  window.scrollTo({ top: 0 });
}
document.addEventListener('click', (ev) => {
  const c = (s) => ev.target.closest(s);
  let e;
  if ((e = c('[data-tab]'))) return pokazTab(e.dataset.tab);
  if ((e = c('[data-dlg]'))) return otkrytDialog(+e.dataset.dlg);
  if (c('#zatemn')) return zakryt();
  if ((e = c('[data-url]'))) return otkrytSsylku(e.dataset.url);
  if (c('[data-tiho]')) { const x = D.dialogi[otkryt]; return poslat({ cmd: 'tiho', id: x.id, kanal: x.kanal, vkl: !x.tiho }); }
  if (c('[data-resheno]')) { const x = D.dialogi[otkryt]; zakryt(); return poslat({ cmd: 'resheno', id: x.id, kanal: x.kanal }); }
  if (c('[data-kopii]')) return poslat({ cmd: 'kopii', vkl: !D.kopii });
  if (c('[data-chasy]')) return chasyShtorka();
  if (c('[data-chasy-ok]')) {
    const s = $('#ch-s').value.trim(), d = $('#ch-do').value.trim();
    if (!/^\d+$/.test(s) || !/^\d+$/.test(d) || +s >= +d || +d > 24) return pokazat('Часы — от 0 до 24, «с» раньше «до». Например, с 9 до 20.');
    zakryt(); return poslat({ cmd: 'chasy', s: +s, 'do': +d });
  }
  if (c('[data-avito]')) {
    const u = API && D.avito_metka ? API + '/api/avito/start?s=' + encodeURIComponent(D.avito_metka) : '';
    if (!u) return pokazat('Подключение — в чате с ботом: команда /avito.');
    return otkrytSsylku(u);
  }
  if ((e = c('[data-cmd]'))) {
    const cmd = e.dataset.cmd;
    if (cmd === 'chasy_vsegda') zakryt();
    if (V_CHATE.includes(cmd)) {   // оплата, файл заявок и опасное живут в чате: открываем бота сразу на нужном (/start kupit и т.п.)
      try { if (V_TG && TG.openTelegramLink) { TG.openTelegramLink('https://t.me/koleso62_demo_bot?start=' + cmd); return; } } catch (x) {}
      return pokazat('Это в чате с ботом: команда /' + cmd + '.');
    }
    return poslat({ cmd });
  }
});

async function obnovit() {
  if (!API) { narisovat(); document.body.dataset.sost = 'gotovo'; return; }
  try { D = await sServera('/api/kabinet'); document.body.dataset.sost = 'gotovo'; narisovat(); }
  catch (e) { $('#sboy').textContent = beda(e); document.body.dataset.sost = 'oshibka'; if (!D.imya && !D.dialogi) narisovat(); }
}
obnovit();
document.addEventListener('visibilitychange', () => { if (!document.hidden) obnovit(); });
setInterval(() => { if (!document.hidden && otkryt === null) obnovit(); }, 30000);   // новые диалоги появляются сами
</script>
</body>
</html>
