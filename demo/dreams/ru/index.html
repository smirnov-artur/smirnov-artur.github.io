<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — Where dreams rise</title>
<!-- Один файл вместо React + Vite + shadcn/ui. ?lang=ru — русская версия (у Instrument Serif нет кириллицы, по-русски заголовок набран Cormorant). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&family=Cormorant:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
:root{
  --background:201 100% 13%;--foreground:0 0% 100%;--muted-foreground:240 4% 66%;
  --primary:0 0% 100%;--primary-foreground:0 0% 4%;--secondary:0 0% 10%;--muted:0 0% 10%;--accent:0 0% 10%;
  --border:0 0% 18%;--input:0 0% 18%;
  --font-display:'Instrument Serif',serif;--font-body:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;border-color:hsl(var(--border))}
html,body{margin:0}
body{background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.ru{--font-display:'Cormorant',serif}
.page{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}

.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

.nav{position:relative;z-index:10;display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:24px 32px;max-width:80rem;margin:0 auto}
.logo{display:block;color:hsl(var(--foreground))}
.logo svg{display:block;height:30px;width:auto;overflow:visible}
.ring{animation:draw 1.1s cubic-bezier(.65,0,.35,1) .3s forwards}
.orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:pop .3s ease 1.3s forwards,orbit 7s linear 1.3s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
.links{display:none;gap:32px;list-style:none;margin:0;padding:0}
.links a{font-size:14px;line-height:20px;color:hsl(var(--muted-foreground));transition:color .15s}
.links a:hover,.links a.on{color:hsl(var(--foreground))}
.btn{display:inline-block;border-radius:9999px;color:hsl(var(--foreground));transition:transform .15s;cursor:pointer}
.btn:hover{transform:scale(1.03)}
.btn-sm{padding:10px 24px;font-size:14px;line-height:20px}

.hero{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:128px 24px 160px}
h1{margin:0;max-width:80rem;font-family:var(--font-display);font-weight:400;font-size:48px;line-height:.95;letter-spacing:-2.46px}
h1 em{font-style:normal;color:hsl(var(--muted-foreground))}
.sub{margin:32px 0 0;max-width:42rem;color:hsl(var(--muted-foreground));font-size:16px;line-height:1.625}
.btn-lg{margin-top:48px;padding:20px 56px;font-size:16px;line-height:24px}

@keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-rise{animation:fade-rise .8s ease-out both}
.animate-fade-rise-delay{animation:fade-rise .8s ease-out .2s both}
.animate-fade-rise-delay-2{animation:fade-rise .8s ease-out .4s both}

@media (min-width:640px){h1{font-size:72px}.sub{font-size:18px;line-height:1.625}}
@media (min-width:768px){.links{display:flex}h1{font-size:96px}}
@media (prefers-reduced-motion:reduce){
  .animate-fade-rise,.animate-fade-rise-delay,.animate-fade-rise-delay-2{animation:none}
  .ring{animation:none;stroke-dashoffset:0}.orb{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="page">
  <video class="bg" autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4"></video>

  <nav class="nav">
    <a class="logo" href="#" aria-label="g.a.d.">
      <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
        <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
        <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
      </svg>
    </a>
    <ul class="links">
      <li><a class="on" href="#" data-t="home">Home</a></li>
      <li><a href="#" data-t="studio">Studio</a></li>
      <li><a href="#" data-t="about">About</a></li>
      <li><a href="#" data-t="journal">Journal</a></li>
      <li><a href="#" data-t="reach">Reach Us</a></li>
    </ul>
    <a class="btn btn-sm liquid-glass" href="#" data-t="begin">Begin Journey</a>
  </nav>

  <section class="hero">
    <h1 class="animate-fade-rise" data-t="h1">Where <em>dreams</em> rise <em>through the silence.</em></h1>
    <p class="sub animate-fade-rise-delay" data-t="sub">We're designing tools for deep thinkers, bold creators, and quiet rebels. Amid the chaos, we build digital spaces for sharp focus and inspired work.</p>
    <a class="btn btn-lg liquid-glass animate-fade-rise-delay-2" href="#" data-t="begin">Begin Journey</a>
  </section>
</div>
<script>
if (true) {
  const TR = { home: 'Главная', studio: 'Студия', about: 'О нас', journal: 'Журнал', reach: 'Связаться', begin: 'Начать путь',
    h1: 'Там, где <em>мечты</em> восходят <em>сквозь тишину.</em>',
    sub: 'Мы делаем инструменты для глубоких мыслителей, смелых авторов и тихих бунтарей. Посреди хаоса мы строим цифровые пространства для ясного фокуса и работы с вдохновением.' };
  document.documentElement.lang = 'ru';
  document.body.classList.add('ru');
  document.title = 'g.a.d. — там, где мечты восходят';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.innerHTML = t; });
}
</script>
</body>
</html>
