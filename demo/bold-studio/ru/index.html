<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard | Создавай. Ломай. Побеждай.</title>
    <meta name="description" content="Vanguard — креативная студия мирового уровня. Мы создаём дерзкие бренды, которые не просто привлекают внимание — они ведут.">
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/8b75d9dcff6a48c35a46656192adf019?family=FSP+DEMO+-+PODIUM+Sharp+4.11">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        podium: ['"FSP DEMO - PODIUM Sharp 4.11"', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            @keyframes fade-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
            @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
            @keyframes scale-in { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
            .animate-fade-up { opacity: 0; animation: fade-up 0.8s ease-out forwards; }
            .animate-fade-up-delay-1 { opacity: 0; animation: fade-up 0.8s ease-out 0.2s forwards; }
            .animate-fade-up-delay-2 { opacity: 0; animation: fade-up 0.8s ease-out 0.4s forwards; }
            .animate-fade-up-delay-3 { opacity: 0; animation: fade-up 0.8s ease-out 0.6s forwards; }
            .animate-fade-up-delay-4 { opacity: 0; animation: fade-up 0.8s ease-out 0.8s forwards; }
            .animate-fade-in { opacity: 0; animation: fade-in 0.8s ease-out forwards; }
            .animate-fade-in-delay { opacity: 0; animation: fade-in 0.8s ease-out 0.3s forwards; }
        }
    </style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'FSP DEMO - PODIUM Sharp 4.11';font-style:normal;font-weight:normal;font-display:swap;src:url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZosUtiZTaR.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'FSP DEMO - PODIUM Sharp 4.11';font-style:normal;font-weight:normal;font-display:swap;src:url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZosUJiZTaR.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
</head>
<body class="bg-black antialiased overflow-x-hidden" style="font-family:'Inter',sans-serif">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const NAV_LINKS = ['Проекты', 'Студия', 'Услуги', 'Контакты'];
        const STATS = [
            { value: '250+', label: 'Брендов обновили' },
            { value: '95%', label: 'Клиентов возвращаются' },
            { value: '10+', label: 'Лет в деле' },
        ];
        const VIDEO_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260606_154941_df1a96e1-a06f-450c-bd02-d863414cc1a0.mp4';

        const App = () => {
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => { lucide.createIcons(); }, []);

            return (
                <div className="relative flex h-screen w-full flex-col overflow-hidden bg-black font-inter">
                    <video className="absolute inset-0 h-full w-full object-cover" src={VIDEO_URL} autoPlay muted loop playsInline />

                    {/* Navbar */}
                    <nav className="relative z-20 flex items-center justify-between px-6 py-5 sm:px-10 lg:px-16 lg:py-7">
                        <span className="font-podium text-2xl font-bold uppercase tracking-wider text-white sm:text-3xl">Vanguard</span>
                        <div className="hidden items-center gap-10 md:flex">
                            {NAV_LINKS.map(l => (
                                <a key={l} href="#" className="text-sm uppercase tracking-widest text-white/80 transition-colors hover:text-white">{l}</a>
                            ))}
                        </div>
                        <a href="#" className="hidden items-center gap-2 border border-white/30 px-6 py-3 text-xs uppercase tracking-widest text-white transition-colors hover:border-white/60 hover:bg-white/10 md:flex">
                            <span>Связаться</span>
                            <i data-lucide="arrow-up-right" className="h-4 w-4"></i>
                        </a>
                        <button onClick={() => setMenuOpen(true)} aria-label="Открыть меню" className="flex flex-col space-y-1.5 md:hidden">
                            <div className="h-0.5 w-6 bg-white"></div>
                            <div className="h-0.5 w-6 bg-white"></div>
                            <div className="h-0.5 w-4 bg-white"></div>
                        </button>
                    </nav>

                    {/* Mobile Menu Overlay */}
                    <div className={`fixed inset-0 z-50 flex flex-col bg-black/95 backdrop-blur-sm transition-all duration-500 md:hidden ${menuOpen ? 'visible opacity-100' : 'invisible opacity-0'}`}>
                        <div className="flex items-center justify-between px-6 py-5 sm:px-10">
                            <span className="font-podium text-2xl font-bold uppercase tracking-wider text-white sm:text-3xl">Vanguard</span>
                            <button onClick={() => setMenuOpen(false)} aria-label="Закрыть меню">
                                <i data-lucide="x" className="h-7 w-7 text-white"></i>
                            </button>
                        </div>
                        <div className="flex flex-1 flex-col items-center justify-center gap-8">
                            {NAV_LINKS.map((l, i) => (
                                <a key={l} href="#" onClick={() => setMenuOpen(false)}
                                   className="font-podium text-4xl uppercase text-white transition-all duration-500 sm:text-5xl"
                                   style={{ transitionDelay: `${i * 80 + 100}ms`, opacity: menuOpen ? 1 : 0, transform: menuOpen ? 'translateY(0)' : 'translateY(20px)' }}>
                                    {l}
                                </a>
                            ))}
                            <a href="#" onClick={() => setMenuOpen(false)}
                               className="mt-4 border border-white/30 px-6 py-3 text-xs uppercase tracking-widest text-white transition-all duration-500 hover:border-white/60 hover:bg-white/10"
                               style={{ transitionDelay: `${NAV_LINKS.length * 80 + 100}ms`, opacity: menuOpen ? 1 : 0, transform: menuOpen ? 'translateY(0)' : 'translateY(20px)' }}>
                                Связаться
                            </a>
                        </div>
                    </div>

                    {/* Hero Content */}
                    <div className="relative z-10 flex flex-1 items-center px-6 sm:px-10 lg:px-16">
                        <div className="max-w-2xl">
                            <div className="mb-6 flex animate-fade-up items-center gap-2 text-xs uppercase tracking-[0.3em] text-white/70 sm:text-sm lg:mb-8">
                                <i data-lucide="crown" className="h-4 w-4 text-white/70"></i>
                                <span>Цифровой коллектив мирового уровня</span>
                            </div>
                            <h1 className="animate-fade-up-delay-1 font-podium uppercase leading-[0.92] tracking-tight text-white">
                                <span className="block text-[clamp(2.8rem,8vw,7rem)]">Создавай.</span>
                                <span className="block text-[clamp(2.8rem,8vw,7rem)]">Ломай.</span>
                                <span className="block text-[clamp(2.8rem,8vw,7rem)]">Побеждай.</span>
                            </h1>
                            <p className="animate-fade-up-delay-2 mt-6 max-w-md text-sm leading-relaxed text-white/70 sm:text-base lg:mt-8">
                                Мы создаём дерзкие бренды,<br />
                                которые не просто цепляют взгляд — <span className="font-bold text-white">они ведут.</span>
                            </p>
                            <div className="animate-fade-up-delay-3 mt-8 flex flex-wrap items-center gap-4 sm:gap-6 lg:mt-10">
                                <a href="#" className="group flex items-center gap-2 bg-black px-5 py-3 text-[11px] uppercase tracking-widest text-white transition-colors hover:bg-neutral-900 sm:px-7 sm:py-4 sm:text-xs">
                                    <span>Смотреть работы</span>
                                    <i data-lucide="arrow-up-right" className="h-4 w-4 transition-transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5"></i>
                                </a>
                                <div className="hidden items-center gap-3 sm:flex">
                                    <i data-lucide="award" className="h-8 w-8 text-white/50"></i>
                                    <div className="text-xs uppercase tracking-wider text-white/60">
                                        <div>Лучшая</div>
                                        <div>Бренд-студия</div>
                                    </div>
                                </div>
                            </div>
                            <div className="animate-fade-up-delay-4 mt-8 flex flex-wrap gap-6 sm:mt-10 sm:gap-12 lg:mt-14 lg:gap-16">
                                {STATS.map(s => (
                                    <div key={s.label}>
                                        <div className="text-2xl font-bold tracking-tight text-white sm:text-4xl lg:text-5xl">{s.value}</div>
                                        <div className="mt-1 text-[9px] uppercase tracking-widest text-white/50 sm:text-xs">{s.label}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
