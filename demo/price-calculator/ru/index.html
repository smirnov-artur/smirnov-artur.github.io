<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости | Оценка проекта</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>tailwind.config = { theme: { extend: { colors: { background: '#0a0a0a', muted: '#1a1a1a', 'muted-fg': '#888' } } } }</script>
<style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
</head>
<body class="bg-background text-white antialiased" style="font-family:'Inter',sans-serif">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const App = () => {
            const [service, setService] = useState('both');
            const [pages, setPages] = useState(5);
            const [content, setContent] = useState(false);
            const [seo, setSeo] = useState(false);
            const [timeline, setTimeline] = useState('regular');

            const calc = () => {
                const bases = { design: { base: 399, pp: 100 }, development: { base: 199, pp: 100 }, both: { base: 499, pp: 200 } };
                const { base, pp } = bases[service];
                let t = Math.max(base, base + (pages - 1) * pp);
                if (content) t += pages * 50;
                if (seo) t += pages * 50;
                if (timeline === 'rush') t += pages * 100;
                if (timeline === 'fast') t += pages * 25;
                return t;
            };
            const agency = () => { const pp = service === 'both' ? 1000 : 400; return 8000 + (pages - 1) * pp; };
            const freelancer = () => { const pp = service === 'both' ? 500 : 200; return 3000 + (pages - 1) * pp; };
            const fmt = (n) => '$' + n.toLocaleString();

            const Radio = ({ name, value, checked, onChange, label, sub }) => (
                <label className="flex items-center gap-3 cursor-pointer py-1">
                    <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${checked ? 'border-[#FF5656]' : 'border-white/30'}`}>
                        {checked && <span className="w-2 h-2 rounded-full bg-[#FF5656]"></span>}
                    </span>
                    <span className="flex-1">{label}</span>
                    {sub && <span className="text-[#FF5656] text-sm">{sub}</span>}
                    <input type="radio" name={name} value={value} checked={checked} onChange={() => onChange(value)} className="hidden" />
                </label>
            );

            const Check = ({ checked, onChange, label, sub }) => (
                <label className="flex items-center gap-3 cursor-pointer py-1">
                    <span className={`w-5 h-5 rounded border-2 flex items-center justify-center shrink-0 ${checked ? 'border-[#FF5656] bg-[#FF5656]' : 'border-white/30'}`}>
                        {checked && <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                    </span>
                    <span className="flex-1">{label}</span>
                    <span className="text-[#FF5656] text-sm">{sub}</span>
                    <input type="checkbox" checked={checked} onChange={() => onChange(!checked)} className="hidden" />
                </label>
            );

            return (
                <section id="calculator-section" className="relative bg-background py-16 md:py-28 px-4 md:px-16 max-w-7xl mx-auto">
                    <a href="#" aria-label="g.a.d." className="absolute top-6 left-4 md:left-6 z-20 text-white/70 hover:text-white/90 transition-colors">

.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
                    </a>
                    <div className="text-center mb-12">
                        <p className="text-muted-fg uppercase tracking-widest text-sm mb-3" style={{ fontFamily: "'JetBrains Mono',monospace" }}>Рассчитайте стоимость проекта</p>
                        <h2 className="text-3xl md:text-4xl lg:text-5xl font-normal">Премиальный сайт в рамках вашего бюджета</h2>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 rounded-2xl overflow-hidden">
                        {/* Left - Form */}
                        <div className="p-8 lg:p-12 divide-y divide-[#1E1E1E]" style={{ background: '#0D0D0D' }}>
                            <div className="pb-6">
                                <h3 className="text-lg font-medium mb-4">Какая услуга вам нужна?</h3>
                                <div className="space-y-2">
                                    <Radio name="service" value="design" checked={service==='design'} onChange={setService} label="Только дизайн" />
                                    <Radio name="service" value="development" checked={service==='development'} onChange={setService} label="Только разработка" />
                                    <Radio name="service" value="both" checked={service==='both'} onChange={setService} label="Дизайн + разработка" />
                                </div>
                            </div>
                            <div className="py-6">
                                <h3 className="text-lg font-medium mb-4">Количество страниц: <span className="text-[#FF5656]">{pages}</span></h3>
                                <input type="range" min="1" max="30" step="1" value={pages} onChange={e => setPages(Number(e.target.value))} className="w-full accent-[#FF5656]" />
                                <div className="flex justify-between text-sm text-muted-fg mt-1"><span>1</span><span>30</span></div>
                            </div>
                            <div className="py-6">
                                <h3 className="text-lg font-medium mb-4">Дополнительно</h3>
                                <div className="space-y-2">
                                    <Check checked={content} onChange={setContent} label="Нужна помощь с контентом" sub="+$50/стр." />
                                    <Check checked={seo} onChange={setSeo} label="Нужна SEO-оптимизация сайта" sub="+$50/стр." />
                                </div>
                            </div>
                            <div className="pt-6">
                                <h3 className="text-lg font-medium mb-4">Как быстро нужен сайт?</h3>
                                <div className="space-y-2">
                                    <Radio name="timeline" value="rush" checked={timeline==='rush'} onChange={setTimeline} label="За 7 дней" sub="+$100/стр." />
                                    <Radio name="timeline" value="fast" checked={timeline==='fast'} onChange={setTimeline} label="За 14 дней" sub="+$25/стр." />
                                    <Radio name="timeline" value="regular" checked={timeline==='regular'} onChange={setTimeline} label="Обычный срок (по договорённости)" />
                                </div>
                            </div>
                        </div>
                        {/* Right - Estimation */}
                        <div className="p-8 lg:p-12 border border-white/10 rounded-r-2xl" style={{ minHeight: '717.98px' }}>
                            <h3 className="text-xl font-medium mb-2">Примерная стоимость</h3>
                            <p className="text-muted-fg text-sm mb-8">Сравните цены и посмотрите, сколько сэкономите</p>
                            <div className="space-y-4">
                                <div className="bg-muted/50 rounded-2xl p-6 space-y-3">
                                    <p className="text-sm text-muted-fg">Типичное агентство берёт минимум</p>
                                    <p className="text-4xl font-bold">{fmt(agency())}</p>
                                    <p className="text-xs text-muted-fg">+ Лишнее время и дополнительные расходы</p>
                                </div>
                                <div className="bg-muted/50 rounded-2xl p-6 space-y-3">
                                    <p className="text-sm text-muted-fg">Обычный фрилансер берёт минимум</p>
                                    <p className="text-4xl font-bold">{fmt(freelancer())}</p>
                                    <p className="text-xs text-muted-fg">+ Нервы и бесконечные правки</p>
                                </div>
                                <div className="rounded-2xl p-6 space-y-3 text-white" style={{ background: 'linear-gradient(135deg, #ec4899, #f97316)' }}>
                                    <p className="text-sm text-white/80">С g.a.d.</p>
                                    <p className="text-5xl font-bold">{fmt(calc())}</p>
                                    <p className="text-sm text-white/80">Экономьте деньги, время и нервы</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
