        const Navbar = () => (

                </div>

        );

        // Scroll-scrubbed video hero. The spec's original approach pre-extracts every frame into an
        // ImageBitmap[] (fetch as blob, seek a detached <video>, draw to <canvas>) purely to avoid seek
        // lag. A plain <video> scrubbed via a throttled, seeking-guarded currentTime assignment (the same
        // pattern already proven on nex-max-upgrade / waitlist-hero) gets the same smooth scrub with far
        // less surface area, and native object-cover replaces all the manual canvas cover-fit math.
        const Hero = () => {
            const sectionRef = useRef(null);
            const videoRef = useRef(null);
            const heroLayerRef = useRef(null);
            const navyLayerRef = useRef(null);
            const paraRefs = [useRef(null), useRef(null), useRef(null)];
            const smoothedRef = useRef(0);
            const lastCountRef = useRef(-1);

            useEffect(() => {
                let raf;
                const loop = () => {
                    const section = sectionRef.current, video = videoRef.current;
                    if (section && video) {
                        const rect = section.getBoundingClientRect();
                        const scrollable = section.offsetHeight - window.innerHeight;
                        const raw = scrollable > 0 ? Math.min(1, Math.max(0, -rect.top / scrollable)) : 0;
                        smoothedRef.current += (raw - smoothedRef.current) * 0.1;
                        const p = smoothedRef.current;

                        if (video.duration && !isNaN(video.duration)) {
                            const scrubP = Math.min(1, p / SCRUB_END);
                            const target = scrubP * video.duration;
                            if (!video.seeking && Math.abs(video.currentTime - target) > 0.03) video.currentTime = target;
                        }

                        const fade = p <= SCRUB_END ? 0 : p >= FADE_END ? 1 : (p - SCRUB_END) / (FADE_END - SCRUB_END);
                        if (heroLayerRef.current) heroLayerRef.current.style.opacity = String(1 - fade);
                        if (navyLayerRef.current) {
                            navyLayerRef.current.style.opacity = String(fade);
                            navyLayerRef.current.style.pointerEvents = fade > 0.5 ? 'auto' : 'none';
                        }

                        const revealP = p <= FADE_END ? 0 : (p - FADE_END) / (1 - FADE_END);
                        const count = Math.min(3, Math.ceil(revealP * 3));
                        if (count !== lastCountRef.current) {
                            lastCountRef.current = count;
                            paraRefs.forEach((r, i) => {
                                if (!r.current) return;
                                const visible = i < count;
                                r.current.style.opacity = visible ? '1' : '0';
                                r.current.style.transform = visible ? 'translateY(0)' : 'translateY(2rem)';
                            });
                        }
                    }
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(raf);
            }, []);

            return (
                <section ref={sectionRef} className="relative h-[700vh]">

                                    ))}
                                </div>
                            </div>
                        </div>

                        <div ref={navyLayerRef} className="absolute inset-0 bg-[#000308] flex items-center justify-center px-4" style={{ opacity: 0, pointerEvents: 'none' }}>
                            <div className="max-w-4xl space-y-6 sm:space-y-10 text-center">
                                <p ref={paraRefs[0]} className="text-lg sm:text-2xl md:text-3xl leading-relaxed md:leading-snug text-white transition-all duration-700 ease-out" style={{ opacity: 0, transform: 'translateY(2rem)' }}>

                                </p>
                                <p ref={paraRefs[1]} className="text-lg sm:text-2xl md:text-3xl leading-relaxed md:leading-snug text-white transition-all duration-700 ease-out" style={{ opacity: 0, transform: 'translateY(2rem)' }}>

                                </p>

                        </div>

            );
