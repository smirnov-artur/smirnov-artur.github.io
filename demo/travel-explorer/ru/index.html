<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Скрытые жемчужины планеты</title>
    <meta name="description" content="Концепт туристического приложения: экран приветствия с видео на весь экран сменяется тёмной лентой направлений с карточками поездок в Ирландию, Норвегию, Японию и Исландию.">
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5f01c59c653c8200fb4ec7f1a81d22ba?family=Nomada+Didone">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .font-heading { font-family: 'Nomada Didone', Georgia, serif; font-weight: normal; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .phone-frame {
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(0, 0, 0, 0.6),
                0 0 0 10px #1a1a1e,
                0 0 0 11px rgba(255, 255, 255, 0.06),
                0 0 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-stagger { opacity: 0; animation: fadeSlideUp 0.6s ease-out forwards; }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
        .stagger-6 { animation-delay: 0.6s; }
        .stagger-7 { animation-delay: 0.7s; }

        .card-fade { -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%); mask-image: linear-gradient(to top, black 60%, transparent 100%); }

        /* g.a.d. studio logo (tools/gad-logo.css, pasted once) */
        .gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}
    </style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */

</style>

<body class="bg-white">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const destinations = [
            { name: 'Ирландия', badge: true, price: 'От $3 200', desc: 'Изумрудные луга, суровые скалы побережья и народные мелодии из пабов', image: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_153452_6ac31a99-2fe2-46aa-8d3c-edcd3fc0ac9a.png&w=1280&q=85' },
            { name: 'Норвегия', badge: false, price: 'От $4 100', desc: 'Величественные фьорды, небо в северном сиянии и тихие рыбацкие посёлки', image: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_154229_5be57df0-6fc9-49ba-840e-62f1b686c7f5.png&w=1280&q=85' },
            { name: 'Япония', badge: true, price: 'От $3 800', desc: 'Священные храмы, цветущая сакура и неоновые улицы, пропитанные традициями', image: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_154713_941acc2f-d44d-4473-87fd-13b46129423b.png&w=1280&q=85' },
            { name: 'Исландия', badge: false, price: 'От $4 500', desc: 'Бескрайние ледники, бьющие гейзеры и неземные пейзажи под бесконечным небом', image: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_154824_77eb9d80-7654-47e2-baf1-89adb5c2f094.png&w=1280&q=85' },
        ];

        const chips = ['Топ сейчас', 'Короткие поездки', 'Южная Америка', 'Европа'];

        function GadLogo({ className }) {
            return (
                <svg className={'gad-logo ' + (className || '')} viewBox="0 0 355 110" role="img" aria-label="g.a.d." style={{ height: '64px', width: 'auto', color: '#01080A' }}>

 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z" />
                    <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
                    <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
                </svg>
            );
        }

        function Home({ onNext }) {
            return (
                <div className="relative w-full h-full flex flex-col overflow-hidden">
                    <video
                        className="absolute inset-0 w-full h-full object-cover"
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260705_060733_a39bb3eb-6b8a-4117-a7cc-0c6ceb74f1bb.mp4"
                        autoPlay muted loop playsInline
                    />
                    <div className="relative flex-1 flex flex-col px-7 pt-20 pb-8 z-10">
                        <div className="mb-5 animate-stagger stagger-1">
                            <GadLogo />
                        </div>
                        <p className="font-inter text-[#01080A]/70 text-[15px] leading-relaxed max-w-[240px] animate-stagger stagger-2">
                            Открывайте скрытые уголки мира и создавайте воспоминания на всю жизнь
                        </p>
                        <div className="flex-1" />
                        <div className="w-full px-2 pb-2 animate-stagger stagger-3">
                            <button onClick={onNext} className="w-full bg-white text-gray-900 font-medium text-base py-4 rounded-full transition-transform active:scale-[0.98] hover:shadow-lg">
                                Начать путешествие
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function DestCard({ name, price, desc, image, badge }) {
            return (
                <div className="relative w-[240px] h-[310px] rounded-3xl overflow-hidden shrink-0">
                    <img src={image} className="absolute inset-0 w-full h-full object-cover" alt={name} />
                    <div className="card-fade absolute bottom-0 left-0 right-0 h-1/2 rounded-b-3xl backdrop-blur-sm bg-gradient-to-t from-black/40 via-black/20 to-transparent"></div>
                    {badge && (
                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-md rounded-lg px-2 py-1.5 flex items-center gap-1">
                            <i data-lucide="badge-check" className="w-3 h-3 text-gray-800"></i>
                            <span className="text-gray-800 text-[10px] font-inter font-semibold">Подборка</span>
                        </div>
                    )}
                    <div className="absolute bottom-0 p-5">
                        <p className="text-white font-heading text-xl">{name}</p>
                        <p className="text-white text-[11px] font-inter font-medium">{price}</p>
                        <p className="text-white/70 text-[11px] leading-snug font-inter">{desc}</p>
                    </div>
                </div>
            );
        }

        function Explore({ onHome }) {
            return (
                <div className="relative w-full h-full flex flex-col bg-[#1C1C1C] overflow-hidden">
                    <div className="flex items-center justify-between px-6 pt-16 pb-8 animate-stagger stagger-1">
                        <div className="flex items-center gap-3">
                            <img src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&w=100" className="w-10 h-10 rounded-full object-cover" alt="Elena Castillo" />
                            <div>
                                <p className="text-white/60 text-xs font-inter">С возвращением,</p>
                                <p className="text-white text-[22px] font-heading">Elena Castillo</p>
                            </div>
                        </div>
                        <i data-lucide="bell" className="w-5 h-5 text-white"></i>
                    </div>

                    <div className="px-6 mb-3 animate-stagger stagger-2">
                        <div className="bg-[#333333] rounded-full pl-4 pr-0 py-0 flex items-center justify-between">
                            <span className="text-white/40 text-sm font-inter">Найдите направление мечты</span>
                            <span className="w-9 h-9 bg-[#979797] rounded-full flex items-center justify-center shrink-0">
                                <i data-lucide="search" className="w-4 h-4 text-[#1C1C1C]"></i>
                            </span>
                        </div>
                    </div>

                    <div className="mb-7 animate-stagger stagger-3">
                        <div className="flex gap-2 px-6 overflow-x-auto no-scrollbar">
                            {chips.map(c => (
                                <span key={c} className="px-4 py-2 bg-[#333333] text-white/80 text-xs font-inter rounded-full whitespace-nowrap">{c}</span>
                            ))}
                        </div>
                    </div>

                    <div className="px-6 mb-4 flex items-center justify-between animate-stagger stagger-4">
                        <span className="font-heading text-white text-[22px]">Направления</span>
                        <span className="text-white/50 text-xs font-inter">Смотреть все</span>
                    </div>

                    <div className="flex-1 overflow-x-auto no-scrollbar animate-stagger stagger-5">
                        <div className="flex gap-4 px-6 h-full pb-4">
                            {destinations.map(d => <DestCard key={d.name} {...d} />)}
                        </div>
                    </div>

                    <div className="flex justify-center pb-8 pt-3 animate-stagger stagger-6">
                        <div className="bg-[#333333] rounded-full p-2 flex items-center gap-6">
                            <button onClick={onHome} className="w-9 h-9 bg-white rounded-full flex items-center justify-center" aria-label="Главная">
                                <i data-lucide="home" className="w-[18px] h-[18px] text-black"></i>
                            </button>
                            <button className="w-9 h-9 flex items-center justify-center" aria-label="Обзор">
                                <i data-lucide="compass" className="w-[18px] h-[18px] text-white/40"></i>
                            </button>
                            <button className="w-9 h-9 flex items-center justify-center" aria-label="Избранное">
                                <i data-lucide="heart" className="w-[18px] h-[18px] text-white/40"></i>
                            </button>
                            <button className="w-9 h-9 flex items-center justify-center" aria-label="Профиль">
                                <i data-lucide="user" className="w-[18px] h-[18px] text-white/40"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [screen, setScreen] = useState('home');
            useEffect(() => { lucide.createIcons(); }, [screen]);

            return (
                <div className="h-screen w-screen bg-white flex items-center justify-center overflow-hidden">
                    <div className="phone-frame relative" style={{ width: 340, height: 740, borderRadius: 52, overflow: 'hidden' }}>
                        <div className="absolute top-[12px] left-1/2 -translate-x-1/2 w-[126px] h-[37px] bg-black rounded-full z-50"></div>
                        {screen === 'home'
                            ? <Home onNext={() => setScreen('explore')} />
                            : <Explore onHome={() => setScreen('home')} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
