            const cls = `${base} ${v[variant]}`;

                        Креативная студия g.a.d.
                    </p>
                    <h2 className={`text-4xl md:text-5xl font-medium tracking-tight mb-8 leading-tight opacity-0 animate-delay-200 ${isInView ? 'animate-fade-in-up' : ''}`}>
                        На <span className="mondwest">новой волне</span>,<br /> <span className="mondwest">смело и дерзко.</span>
                    </h2>
                    <div className={`space-y-6 text-sm md:text-base text-mutedDark mb-12 opacity-0 animate-delay-300 ${isInView ? 'animate-fade-in-up' : ''}`}>
                        <p>g.a.d. — студия для самых амбициозных команд: мы приносим тот же уровень мастерства в каждый продукт, который создаём.</p>

            const images = [
                "https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1584982751601-97dcc096659c?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?auto=format&fit=crop&w=1200&q=80",

        /* ── 3. TESTIMONIAL QUOTE ── */
        const TestimonialQuote = () => {
            const { ref, isInView } = useInViewAnimation();
            const containerRef = useRef(null);
            const { scrollYProgress } = useScroll({ target: containerRef, offset: ["start end", "end start"] });
            const imgY = useTransform(scrollYProgress, [0, 1], ["-10%", "10%"]);
            return (
                <section ref={ref} className="max-w-2xl mx-auto px-6 py-24 text-center">

        /* ── 4. PRICING ── */
        const Pricing = () => {

            return (

        /* ── 5. TESTIMONIAL CAROUSEL ── */
        const TestimonialCarousel = () => {
            const [active, setActive] = useState(0);
            const testimonials = [
                { name: "Alex Rivera", role: "Гендиректор, Luminary", quote: "g.a.d. полностью преобразили наш цифровой облик. Такого внимания к деталям больше нет ни у кого.", avatar: "https://i.pravatar.cc/100?img=32" },

                                <i data-lucide="chevron-right" className="w-4 h-4"></i>
                            </button>
                        </div>
