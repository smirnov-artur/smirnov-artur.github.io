<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/works/js/gad-loader.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>g.a.d. — The Next Layer of Intelligence</title>
<!-- ?lang=ru — русская версия. Знак бренда заменён логотипом g.a.d.; полоса из четырёх «logoipsum» (чужие логотипы «нам доверяют») убрана. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fafafa;--muted:#a7a6a6;--nav:#b6b5b5;--strip:#8b8a8a;--pill:#ffffff;--pill-ink:#050505;
  --u:calc(100vh / 1058);
  --uw:calc(100vw / 1487);
  --h:clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));
  --m:1px;
  --ease:cubic-bezier(.22,1,.36,1);
}
@supports (height:100dvh){:root{--u:calc(100dvh / 1058)}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#050505}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit}
.stage{position:fixed;inset:0;overflow:hidden;background:#050505}

/* видео */
.plate{position:absolute;inset:0;overflow:hidden}
.plate-video{position:absolute;left:50%;top:calc(1 * var(--u));width:calc(1492 * var(--u));height:calc(1054 * var(--u));
  transform:translateX(calc(-50% - calc(0.5 * var(--u))));object-fit:cover;pointer-events:none}
.plate::after{content:'';position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to bottom,rgba(5,5,5,0) 78.8%,rgba(5,5,5,.23) 79.6%,rgba(5,5,5,.45) 81.4%,rgba(5,5,5,.75) 83.3%,rgba(5,5,5,.84) 85.2%,rgba(5,5,5,.888) 88%,rgba(5,5,5,.905) 91%,rgba(5,5,5,.96) 95%,#050505 100%),
  linear-gradient(to right,#050505 calc(50% - 746 * var(--u)),transparent calc(50% - 676 * var(--u)),transparent calc(50% + 676 * var(--u)),#050505 calc(50% + 746 * var(--u)))}

/* шапка */
.brand{position:absolute;left:calc(75 * var(--u));top:calc(36 * var(--u));z-index:5;display:block;color:#ececec}
.brand svg{display:block;height:calc(30 * var(--u));width:auto;overflow:visible}
.brand svg text{font-family:'Unbounded',sans-serif}
.ring{animation:draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:pop .3s ease 1.35s forwards,orbit 7s linear 1.35s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
.links{position:absolute;left:50%;top:calc(51 * var(--u));transform:translate(-50%,-50%);z-index:5;display:flex;white-space:nowrap;font-size:calc(19 * var(--u));font-weight:400;color:var(--nav)}
.links a{transition:color .25s}
.links a:hover{color:#fff}
.links a:nth-child(2){margin-left:calc(24.5 * var(--u))}
.links a:nth-child(3){margin-left:calc(23.5 * var(--u))}
.links a:nth-child(4){margin-left:calc(26 * var(--u))}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--pill);color:var(--pill-ink);font-weight:500;white-space:nowrap;transition:background-color .25s}
.pill:hover{background:#e6e6e6}
.pill span{transform:translateY(calc(1 * var(--u)))}
.pill-nav{position:absolute;right:calc(75.4 * var(--u));top:calc(27 * var(--u));z-index:5;width:calc(175 * var(--u));height:calc(49 * var(--u));font-size:calc(20.6 * var(--u))}
.burger{display:none}

/* первый экран */
.headline{position:absolute;left:calc(75.5 * var(--u));top:calc(230.5 * var(--u));margin:0;z-index:2;white-space:nowrap;
  font-size:calc(71.6 * var(--h));line-height:calc(80.5 * var(--h));font-weight:400;letter-spacing:calc(.3 * var(--h));color:var(--ink)}
.headline span{display:block}
.sub{position:absolute;left:calc(75.5 * var(--u));top:calc(230.5 * var(--u) + 189 * var(--h));margin:0;z-index:2;
  font-size:calc(20.7 * var(--h));line-height:calc(23.5 * var(--h));font-weight:400;word-spacing:calc(1.8 * var(--h));color:var(--muted)}
.sub span{display:block;white-space:nowrap}
.pill-cta{position:absolute;left:calc(74.9 * var(--u));top:calc(230.5 * var(--u) + 264.5 * var(--h));z-index:2;width:calc(175.6 * var(--h));height:calc(50 * var(--h));font-size:calc(20.6 * var(--h))}
.ghost{position:absolute;left:calc(74.9 * var(--u) + 220.6 * var(--h));top:calc(230.5 * var(--u) + 279.5 * var(--h));z-index:2;white-space:nowrap;
  font-size:calc(20.6 * var(--h));font-weight:500;letter-spacing:calc(.12 * var(--h));color:#fff;transition:opacity .25s}
.ghost:hover{color:#cfcfcf}

/* меню телефона */
.menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;opacity:0;visibility:hidden;
  background:linear-gradient(180deg,rgba(5,5,5,.92) 0%,rgba(10,10,10,.86) 55%,rgba(5,5,5,.96) 100%);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  transition:opacity .42s var(--ease),visibility 0s linear .42s}
.is-open .menu{opacity:1;visibility:visible;transition:opacity .42s var(--ease),visibility 0s}
.menu-inner{display:flex;flex-direction:column;height:100%;padding:calc(120 * var(--m)) calc(24 * var(--m)) calc(36 * var(--m) + env(safe-area-inset-bottom))}
.menu-eyebrow{margin:0 0 calc(18 * var(--m));font-size:max(12px,calc(13 * var(--m)));letter-spacing:.16em;text-transform:uppercase;color:var(--strip)}
.menu-list{list-style:none;margin:0;padding:0}
.menu-list a{display:flex;align-items:center;justify-content:space-between;padding:calc(14 * var(--m)) 0;border-bottom:1px solid rgba(255,255,255,.08);
  font-size:max(25px,calc(31 * var(--m)));font-weight:500;letter-spacing:-.01em;color:var(--ink)}
.menu-list a::after{content:'';width:9px;height:9px;border-top:1.6px solid var(--muted);border-right:1.6px solid var(--muted);transform:rotate(45deg);margin-right:6px}
.menu-foot{margin-top:auto;display:flex;align-items:center;gap:calc(22 * var(--m));flex-wrap:wrap}
.menu-foot .pill{height:50px;padding:0 28px;font-size:16px}
.menu-foot .pill span{transform:none}
.menu-foot .ghost-m{font-size:16px;font-weight:500;color:#fff}
.menu-eyebrow,.menu-list li,.menu-foot{opacity:0;transform:translateY(calc(14 * var(--m)));transition:opacity .5s var(--ease),transform .5s var(--ease)}
.is-open .menu-eyebrow,.is-open .menu-list li,.is-open .menu-foot{opacity:1;transform:none}
.is-open .menu-eyebrow{transition-delay:.06s}
.is-open .menu-list li:nth-child(1){transition-delay:.10s}
.is-open .menu-list li:nth-child(2){transition-delay:.16s}
.is-open .menu-list li:nth-child(3){transition-delay:.22s}
.is-open .menu-list li:nth-child(4){transition-delay:.28s}
.is-open .menu-foot{transition-delay:.34s}

/* вход */
@media (prefers-reduced-motion:no-preference){
  .brand,.pill-nav{animation:rise .8s var(--ease) both}
  .links{animation:riseNav .8s var(--ease) both}
  .headline{animation:rise .9s var(--ease) .06s both}
  .sub{animation:rise .9s var(--ease) .14s both}
  .pill-cta,.ghost{animation:rise .9s var(--ease) .22s both}
}
@keyframes rise{from{opacity:0;transform:translateY(calc(14 * var(--u)))}}
@keyframes riseNav{from{opacity:0;transform:translate(-50%,calc(-50% + 14 * var(--u)))}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .menu,.menu-eyebrow,.menu-list li,.menu-foot,.burger i{transition-duration:.001s!important;transition-delay:0s!important}
  .ring{animation:none;stroke-dashoffset:0}.orb{animation:none;opacity:1}
}

/* стоя и узко: обычный поток */
@media (max-aspect-ratio:11/10){
  :root{--m:min(calc(100vw / 430),1.34px);--u:var(--m);--h:var(--m)}
  .stage{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .plate-video{left:0;top:0;width:100%;height:100%;transform:none;object-fit:cover;object-position:43% center}
  .plate::after{background:
    linear-gradient(to right,rgba(5,5,5,.86) 0%,rgba(5,5,5,.66) 42%,rgba(5,5,5,.20) 78%,rgba(5,5,5,.10) 100%),
    linear-gradient(to bottom,rgba(5,5,5,.72) 0%,rgba(5,5,5,.34) 24%,rgba(5,5,5,.34) 56%,rgba(5,5,5,.80) 82%,rgba(5,5,5,.97) 94%,#050505 100%)}
  .topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(22 * var(--m)) calc(24 * var(--m))}
  .brand{position:static}
  .brand svg{height:calc(26 * var(--m))}
  .links,.pill-nav{display:none}
  .burger{position:relative;display:block;width:48px;height:40px;padding:0;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .burger i{position:absolute;left:50%;top:50%;width:18px;height:1.8px;margin:-.9px 0 0 -9px;border-radius:2px;background:#fff;transition:transform .42s var(--ease)}
  .burger i:first-child{transform:translateY(calc(-4.3 * var(--m)))}
  .burger i:last-child{transform:translateY(calc(4.3 * var(--m)))}
  .is-open .burger i:first-child{transform:rotate(45deg)}
  .is-open .burger i:last-child{transform:rotate(-45deg)}
  .hero{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:calc(34 * var(--m)) calc(24 * var(--m)) calc(44 * var(--m))}
  .headline{position:static;white-space:normal;font-size:calc(44 * var(--m));line-height:1.08;letter-spacing:0}
  .headline span{display:inline}
  .sub{position:static;margin-top:auto;font-size:calc(16.5 * var(--m));line-height:1.5;word-spacing:0}
  .sub span{display:inline;white-space:normal}
  .actions{display:flex;align-items:center;flex-wrap:wrap;gap:calc(14 * var(--m)) calc(26 * var(--m));margin-top:calc(26 * var(--m))}
  .pill-cta,.ghost{position:static}
  .pill-cta{width:auto;height:calc(50 * var(--m));min-height:46px;padding:0 calc(28 * var(--m));font-size:max(15px,calc(17 * var(--m)))}
  .pill-cta span{transform:none}
  .ghost{font-size:max(15px,calc(17 * var(--m)))}
}
@media (min-width:600px) and (max-aspect-ratio:11/10){
  :root{--m:min(calc(100vw / 860),calc(100vh / 760),1.25px)}
  .plate-video{object-position:44% center}
  .plate::after{background:
    linear-gradient(to right,rgba(5,5,5,.84) 0%,rgba(5,5,5,.60) 42%,rgba(5,5,5,.16) 78%,rgba(5,5,5,.06) 100%),
    linear-gradient(to bottom,rgba(5,5,5,.66) 0%,rgba(5,5,5,.28) 24%,rgba(5,5,5,.30) 56%,rgba(5,5,5,.78) 82%,rgba(5,5,5,.96) 94%,#050505 100%)}
  .topbar{padding:calc(30 * var(--m)) calc(48 * var(--m))}
  .hero{padding:calc(60 * var(--m)) calc(48 * var(--m)) calc(64 * var(--m))}
  .headline{font-size:calc(66 * var(--m));line-height:1.1}
  .headline span{display:block}
  .sub{font-size:calc(20 * var(--m))}
  .sub span{display:block}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="plate">
    <video class="plate-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4" type="video/mp4">
    </video>
  </div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Home">
      <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
        <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
        <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
      </svg>
    </a>
    <nav class="links" aria-label="Primary">
      <a href="#" data-t="n1">About</a><a href="#" data-t="n2">Features</a><a href="#" data-t="n3">FAQ</a><a href="#" data-t="n4">Contact</a>
    </nav>
    <a class="pill pill-nav" href="#"><span data-t="go">Get Started</span></a>
    <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><i></i><i></i></button>
  </header>
  <nav class="menu" id="menu" aria-hidden="true">
    <div class="menu-inner">
      <p class="menu-eyebrow" data-t="menu">Menu</p>
      <ul class="menu-list">
        <li><a href="#" data-t="n1">About</a></li>
        <li><a href="#" data-t="n2">Features</a></li>
        <li><a href="#" data-t="n3">FAQ</a></li>
        <li><a href="#" data-t="n4">Contact</a></li>
      </ul>
      <div class="menu-foot">
        <a class="pill" href="#"><span data-t="go">Get Started</span></a>
        <a class="ghost-m" href="#" data-t="arch">View Architecture</a>
      </div>
    </div>
  </nav>
  <main class="hero">
    <h1 class="headline"><span data-t="h1a">The Next Layer</span> <span data-t="h1b">of Intelligence</span></h1>
    <p class="sub"><span data-t="s1">A unified infrastructure platform to help teams build,</span> <span data-t="s2">ship, and scale AI systems with confidence.</span></p>
    <div class="actions">
      <a class="pill pill-cta" href="#"><span data-t="go">Get Started</span></a>
      <a class="ghost" href="#" data-t="arch">View Architecture</a>
    </div>
  </main>
</div>
<script>
(function(){
  var ru = true;
  var L = ru ? { open:'Открыть меню', close:'Закрыть меню' } : { open:'Open menu', close:'Close menu' };
  if (ru) {
    var TR = { n1:'О нас', n2:'Возможности', n3:'Вопросы', n4:'Контакты', go:'Начать', menu:'Меню', arch:'Смотреть архитектуру',
      h1a:'Следующий слой', h1b:'интеллекта',
      s1:'Единая инфраструктура, на которой команды строят,', s2:'запускают и масштабируют ИИ-системы без сюрпризов.' };
    document.documentElement.lang = 'ru';
    document.title = 'g.a.d. — Следующий слой интеллекта';
    document.querySelectorAll('[data-t]').forEach(function(el){ var t = TR[el.dataset.t]; if (t) el.textContent = t; });
    document.querySelector('.brand').setAttribute('aria-label', 'На главную');
  }
  var stage = document.getElementById('stage'), burger = document.getElementById('burger'), menu = document.getElementById('menu');
  function setOpen(open){
    stage.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? L.close : L.open);
    menu.setAttribute('aria-hidden', String(!open));
  }
  burger.setAttribute('aria-label', L.open);
  burger.addEventListener('click', function(){ setOpen(!stage.classList.contains('is-open')); });
  addEventListener('keydown', function(e){ if (e.key === 'Escape') setOpen(false); });
  menu.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(){ setOpen(false); }); });
  var wide = matchMedia('(min-aspect-ratio:11/10)');
  wide.addEventListener('change', function(e){ if (e.matches) setOpen(false); });
})();
</script>
</body>
</html>
