<body class="antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useRef } = React;
        const { motion, useScroll, useTransform } = Motion;

        const EASE_OUT = [0.25, 0.1, 0.25, 1];

        // Reusable fade-in: `as` picks which motion.<tag> to render, extra props pass straight through.
        const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = '', style = {}, as = 'div', ...rest }) => {
            const Comp = motion[as] || motion.div;
            return (
                <Comp
                    className={className}
                    style={style}
                    initial="hidden"
                    whileInView="visible"
                    viewport={{ once: true, margin: '50px', amount: 0 }}
                    variants={{
                        hidden: { opacity: 0, x, y },
                        visible: { opacity: 1, x: 0, y: 0, transition: { duration, delay, ease: EASE_OUT } },
                    }}
                    {...rest}
                >
                    {children}
                </Comp>
            );
        };

        const CORNER_IMAGES = [
            { key: 'moon', src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png',
              className: 'absolute z-0 top-[4%] left-[1%] sm:left-[2%] md:left-[4%] w-[120px] sm:w-[160px] md:w-[210px] h-auto', delay: 0.1, x: -80 },
            { key: 'blob', src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png',
              className: 'absolute z-0 bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] w-[100px] sm:w-[140px] md:w-[180px] h-auto', delay: 0.25, x: -80 },
            { key: 'lego', src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png',
              className: 'absolute z-0 top-[4%] right-[1%] sm:right-[2%] md:right-[4%] w-[120px] sm:w-[160px] md:w-[210px] h-auto', delay: 0.15, x: 80 },
            { key: 'group', src: 'https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png',
              className: 'absolute z-0 bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%] w-[130px] sm:w-[170px] md:w-[220px] h-auto', delay: 0.3, x: 80 },
        ];

        const ABOUT_TEXT = "Больше пяти лет опыта в дизайне: занимаюсь брендингом, веб-дизайном и пользовательским опытом. Мне нравится работать с компаниями, которые хотят выделяться и показывать себя с лучшей стороны. Давайте создадим что-то невероятное вместе!";

        // One character's scroll-linked opacity: dim (0.2) until the scroll position reaches its slot, then bright (1).
        const RevealChar = ({ ch, index, total, scrollYProgress }) => {
            const charProgress = index / total;
            const start = Math.max(0, charProgress - 0.1);
            const end = Math.min(1, charProgress + 0.05);
            const opacity = useTransform(scrollYProgress, [start, end], [0.2, 1]);
            const glyph = ch === ' ' ? ' ' : ch;
            return (
                <span style={{ position: 'relative', display: 'inline-block' }}>
                    <span style={{ visibility: 'hidden' }}>{glyph}</span>
                    <motion.span style={{ position: 'absolute', left: 0, top: 0, opacity }}>{glyph}</motion.span>
                </span>
            );
        };

        const ScrollRevealParagraph = ({ text, className }) => {
            const ref = useRef(null);
            const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });
            const chars = text.split('');
            return (
                <p ref={ref} className={className} style={{ fontSize: 'clamp(1rem, 2vw, 1.35rem)' }}>
                    {chars.map((ch, i) => (
                        <RevealChar key={i} ch={ch} index={i} total={chars.length} scrollYProgress={scrollYProgress} />
                    ))}
                </p>
            );
        };

        const About = () => (
            <section className="relative isolate min-h-screen flex flex-col items-center justify-center px-5 sm:px-8 md:px-10 py-20 overflow-hidden">
                {CORNER_IMAGES.map(({ key, src, className, delay, x }) => (
                    <FadeIn key={key} as="img" src={src} alt="" aria-hidden="true" delay={delay} duration={0.9} x={x} y={0} className={className} />
                ))}

                <div className="relative z-10 max-w-4xl mx-auto flex flex-col items-center gap-16 sm:gap-20 md:gap-24">
                    <div className="flex flex-col items-center gap-10 sm:gap-14 md:gap-16">
                        <FadeIn as="h1" delay={0} y={40} className="hero-heading font-black uppercase leading-none tracking-tight text-center" style={{ fontSize: 'clamp(3rem, 12vw, 160px)' }}>
                            Обо мне
                        </FadeIn>
                        <ScrollRevealParagraph text={ABOUT_TEXT} className="text-[#D7E2EA] font-medium text-center leading-relaxed max-w-[560px]" />
                    </div>

                    <FadeIn
                        as="a"
                        href="#contact"
                        delay={0.3}
                        y={20}
                        className="inline-block rounded-full text-white font-medium uppercase tracking-widest text-xs sm:text-sm md:text-base px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 transition-opacity duration-200 hover:opacity-90 active:opacity-75"
                        style={{
                            background: 'linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%)',
                            boxShadow: '0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721B1 inset',
                            outline: '2px solid #E3E3E3',
                            outlineOffset: '-3px',
                        }}
                    >
                        Связаться
                    </FadeIn>
                </div>
            </section>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<About />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
