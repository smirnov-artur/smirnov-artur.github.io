function Hero() {
  const [active, setActive] = useState(0);
  const frontRef = useRef(null);
  const backRef = useRef(null);
  const [frontIsA, setFrontIsA] = useState(true);
  const switching = useRef(false);

  const switchTo = useCallback((i, evt) => {
    if (i === active || switching.current) return;
    switching.current = true;
    const incoming = frontIsA ? backRef.current : frontRef.current;
    const outgoing = frontIsA ? frontRef.current : backRef.current;
    const rect = evt?.currentTarget?.getBoundingClientRect();
    const x = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    const y = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
    incoming.src = VIDEOS[i].src;
    incoming.play().catch(() => {});
    gsap.set(incoming, { clipPath: `circle(0% at ${x}px ${y}px)`, zIndex: 5, opacity: 1 });
    gsap.timeline({ onComplete: () => { switching.current = false; setFrontIsA(v => !v); setActive(i); } })
      .to(incoming, { clipPath: `circle(140% at ${x}px ${y}px)`, duration: 1.15, ease: 'power3.inOut' }, 0)
      .to(outgoing, { opacity: 0, duration: 0.7, ease: 'power2.out' }, 0.15)
      .set(outgoing, { zIndex: 1 });
  }, [active, frontIsA]);

  return (
    <section id="top" className="relative w-full h-screen overflow-hidden isolate grain">
      <video ref={frontRef} autoPlay muted loop playsInline preload="auto" src={VIDEOS[0].src} className="absolute inset-0 w-full h-full object-cover" style={{ zIndex: 2 }} />
      <video ref={backRef} muted loop playsInline preload="auto" className="absolute inset-0 w-full h-full object-cover opacity-0" style={{ zIndex: 1 }} />
      <div className="absolute inset-0 bg-gradient-to-b from-ink/60 via-ink/30 to-ink" style={{ zIndex: 3 }} />
      <div className="absolute inset-0 bg-gradient-to-t from-ink via-transparent to-transparent" style={{ zIndex: 3 }} />

      <div className="relative h-full flex flex-col justify-end px-5 sm:px-10 md:px-14 pb-10 sm:pb-14" style={{ zIndex: 10 }}>
        <motion.p initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, delay: 0.15 }} className="text-xs sm:text-sm tracking-[0.25em] uppercase text-accentLavender mb-4 sm:mb-6">Универсальный слой дизайна</motion.p>
        <motion.h1 initial={{ opacity: 0, y: 24 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, delay: 0.3 }} className="font-display text-balance text-[clamp(2.4rem,7vw,6rem)] font-bold leading-[0.98] tracking-tight max-w-4xl mb-6 sm:mb-8">Дизайн становится экономикой.</motion.h1>
        <motion.p initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, delay: 0.45 }} className="text-white/70 text-base sm:text-lg max-w-xl mb-8 sm:mb-10">Ombric превращает всё, что вы создаёте, — систему, кадр, шейдер — в работу, которая остаётся вашей. Сделайте один раз — получайте доход при каждом использовании.</motion.p>
        <motion.div initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, delay: 0.6 }} className="flex flex-wrap items-center gap-4 sm:gap-6">
          <a href="#features" className="bg-white text-ink text-sm font-semibold px-6 sm:px-7 py-3 sm:py-3.5 rounded-full hover:bg-accentLavender transition-colors">Изучить Ombric</a>
          <div className="flex items-center gap-3">
            {VIDEOS.map((v, i) => (
              <button key={v.id} onClick={e => switchTo(i, e)} data-hero-thumb={v.id}
                className={`relative w-14 h-9 sm:w-16 sm:h-10 rounded-lg overflow-hidden border transition-all ${active === i ? 'border-white scale-105' : 'border-white/25 opacity-60 hover:opacity-90'}`}>
                <video muted loop playsInline preload="metadata" src={v.src} className="w-full h-full object-cover pointer-events-none" />
              </button>
            ))}
          </div>
        </motion.div>
      </div>
    </section>
  );
}

function About() {
  const wrapRef = useRef(null);
  const frameRef = useRef(null);
  useEffect(() => {
    const ctx = gsap.context(() => {
      gsap.fromTo(frameRef.current,
        { clipPath: 'inset(18% 22% 18% 22% round 28px)' },
        { clipPath: 'inset(0% 0% 0% 0% round 0px)', ease: 'none',
          scrollTrigger: { trigger: wrapRef.current, start: 'top top', end: '+=110%', scrub: 0.6, pin: true } });
    }, wrapRef);
    return () => ctx.revert();
  }, []);
  return (
    <section ref={wrapRef} className="relative h-[100vh] overflow-hidden">
      <div ref={frameRef} className="absolute inset-0">
        <video autoPlay muted loop playsInline preload="auto" src={ABOUT_VIDEO} className="w-full h-full object-cover" />
        <div className="absolute inset-0 bg-ink/55" />
      </div>
      <div className="relative h-full flex flex-col items-center justify-center text-center px-6" style={{ zIndex: 5 }}>
        <p className="text-xs sm:text-sm tracking-[0.25em] uppercase text-accentBlue mb-5">Представляем</p>
        <h2 className="font-display text-balance text-[clamp(2rem,6vw,4.5rem)] font-bold leading-[1.02] max-w-3xl">Слой дизайна лежит в основе всего, что вы создаёте.</h2>
        <p className="text-white/70 max-w-xl mt-6 text-base sm:text-lg">Один слой происхождения, лицензирования и выплат — работает незаметно под инструментами, которыми уже пользуется ваша команда.</p>
      </div>
    </section>
  );
}

function BentoCard({ f }) {
  const ref = useRef(null);
  const onMove = e => {
    const r = ref.current.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    ref.current.style.setProperty('--mx', `${x}px`);
    ref.current.style.setProperty('--my', `${y}px`);
    const rx = ((y / r.height) - 0.5) * -8, ry = ((x / r.width) - 0.5) * 8;
    ref.current.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(0)`;
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = 'perspective(700px) rotateX(0deg) rotateY(0deg)'; };
  return (
    <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} data-feature={f.id}
      className={`bento-card rounded-3xl border border-white/10 bg-charcoal p-7 sm:p-8 flex flex-col justify-between transition-transform duration-300 ease-out ${f.big ? 'md:col-span-2' : f.full ? 'md:col-span-3' : ''}`}>
      <div className="w-11 h-11 rounded-xl bg-white/[0.06] flex items-center justify-center mb-8 relative" style={{ zIndex: 1 }}>
        <i data-lucide={f.icon} style={{ width: 20, height: 20 }} className="text-accentBlue"></i>
      </div>
      <div className="relative" style={{ zIndex: 1 }}>
        <h3 className="font-display text-lg sm:text-xl font-semibold mb-2">{f.title}</h3>
        <p className="text-white/60 text-sm sm:text-[15px] leading-relaxed">{f.desc}</p>
      </div>
    </div>
  );
}

function Story() {
  const sectionRef = useRef(null);
  const cardRef = useRef(null);
  useEffect(() => {
    let raw = { x: 0, y: 0 }, smooth = { x: 0, y: 0 }, raf;
    const onMove = e => {
      const r = sectionRef.current.getBoundingClientRect();
      raw = { x: ((e.clientX - r.left) / r.width - 0.5) * 36, y: ((e.clientY - r.top) / r.height - 0.5) * 36 };
    };
    const tick = () => {
      smooth.x += (raw.x - smooth.x) * 0.08;
      smooth.y += (raw.y - smooth.y) * 0.08;
      if (cardRef.current) cardRef.current.style.transform = `translate(${smooth.x}px, ${smooth.y}px)`;
      raf = requestAnimationFrame(tick);
    };
    window.addEventListener('mousemove', onMove);
    raf = requestAnimationFrame(tick);
    return () => { window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
  }, []);
  return (
    <section ref={sectionRef} className="relative py-24 sm:py-32 px-5 sm:px-10 md:px-14 overflow-hidden">
      <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true, amount: 0.4 }} transition={{ duration: 0.6 }}>
          <p className="text-xs sm:text-sm tracking-[0.25em] uppercase text-accentLavender mb-4">Глубина</p>
          <h2 className="font-display text-balance text-[clamp(1.8rem,4.5vw,3.2rem)] font-bold leading-tight mb-6">Часть системы работает нарочно тихо.</h2>
          <p className="text-white/65 text-base sm:text-lg leading-relaxed max-w-md">Не все слои системы заметны. Происхождение, лицензирование и расчёты работают под поверхностью — вы скорее ощущаете их, чем видите, пока они не понадобятся.</p>
        </motion.div>
        <div className="relative h-[380px] sm:h-[460px] flex items-center justify-center">
          <div ref={cardRef} className="w-[220px] sm:w-[260px] h-[320px] sm:h-[380px] rounded-[28px] overflow-hidden border border-white/10 shadow-2xl shadow-black/60 transition-transform duration-100">

          </div>
        </div>
      </div>
    </section>
  );
}

function Counter({ to, suffix = '' }) {
  const ref = useRef(null);
  const [val, setVal] = useState(0);
  const done = useRef(false);
  return (
    <motion.span ref={ref} onViewportEnter={() => {
      if (done.current) return; done.current = true;
      const t0 = performance.now(), dur = 1400;
      const step = now => { const u = Math.min(1, (now - t0) / dur); setVal(Math.round(to * (1 - Math.pow(1 - u, 3)))); if (u < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }} viewport={{ once: true }}>{val.toLocaleString('ru-RU')}{suffix}</motion.span>
  );
}

function App() {
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => { lucide.createIcons(); }, [menuOpen]);
  useEffect(() => {
    // pin heights are measured from laid-out content; web fonts and late video metadata can still
    // reshape it after first paint, so refresh again once those settle instead of trusting one early pass
    let cancelled = false;
    const refresh = () => { if (!cancelled) ScrollTrigger.refresh(); };
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(refresh);
    window.addEventListener('load', refresh);
    const t = setTimeout(refresh, 1500);
    return () => { cancelled = true; window.removeEventListener('load', refresh); clearTimeout(t); };
  }, []);
  return (
    <div className="min-h-screen bg-ink">
      <Nav menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
      <Hero />
      <About />
      <Features />
      <Story />
      <SymbioticWorld />
      <Metrics />
      <Footer />
    </div>
  );
}
