<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Простой способ зашифровать данные</title>
    <meta name="description" content="Тёмный герой-блок g.a.d. для SaaS-шифрования: светящаяся розово-фиолетовая дуга за цепочкой из трёх иконок с бегущим лучом и пульсацией.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        :root{ --bg:#0a0a0f; --surface:#111118; --text:#f0f0f5; --text-muted:#8888a8; --accent:#c8a0e0; --accent-pink:#b04090; --border:rgba(255,255,255,.08); }
        body{ font-family:'Inter',sans-serif; background:var(--bg); }

        /* hero card background: three CSS-only stand-ins for the original WebGL shader layers */
        .shader-blobs{ position:absolute; inset:0; overflow:hidden; border-radius:20px; background:#08071a; }
        .blob{ position:absolute; border-radius:50%; filter:blur(60px); }
        .blob-blue{ width:70%; height:70%; left:30%; top:32%; background:radial-gradient(circle,#0582e8,transparent 70%); opacity:.5; animation:driftA 8s ease-in-out infinite; }
        .blob-pink{ width:46%; height:46%; left:38%; top:22%; background:radial-gradient(circle,#f00e94,transparent 70%); opacity:.4; animation:driftB 6.5s ease-in-out infinite; }
        @keyframes driftA{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-10%,6%) scale(1.18)} }
        @keyframes driftB{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(9%,-8%) scale(1.22)} }
        .arc-glow,.grid-overlay{ transform-origin:50% 0; animation:arcBreath 7s ease-in-out infinite; }
        @keyframes arcBreath{ 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.06)} }

        .arc-glow{ position:absolute; inset:0; border-radius:20px; pointer-events:none;
            background:
                radial-gradient(circle at 50% -70%, transparent 0%, transparent 60%, rgba(176,48,136,.03) 63%, rgba(176,48,136,.82) 79%, rgba(210,70,175,.92) 85%, rgba(240,110,210,.88) 87%, rgba(255,205,250,.92) 91%, rgba(255,240,255,.98) 93%, #fff 95%),
                radial-gradient(circle at 50% 35%, rgba(120,40,180,.08) 0%, transparent 50%);
        }
        .grid-overlay{ position:absolute; inset:0; border-radius:20px; pointer-events:none;
            background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
            background-size:40px 40px;
            -webkit-mask-image:radial-gradient(circle at 50% -70%, transparent 60%, black 78%);
            mask-image:radial-gradient(circle at 50% -70%, transparent 60%, black 78%);
        }
        .grain{ position:absolute; inset:0; border-radius:20px; pointer-events:none; opacity:.07; mix-blend-mode:overlay;
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        .pipeline{ position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:52px; }
        .p-line{ width:160px; height:1px; }
        .line-a{ background:linear-gradient(to right,rgba(255,255,255,.15),rgba(255,255,255,.07)); }
        .line-b{ background:linear-gradient(to right,rgba(255,255,255,.07),rgba(255,255,255,.15)); }
        @media (max-width:860px){ .p-line{ width:80px; } }
        @media (max-width:768px){ .p-line{ width:56px; } }

        .p-node{ position:relative; display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0;
            background:#1a1a24; color:#9a9ac0; border:1px dashed rgba(255,255,255,.14);
            box-shadow:inset 2px 2px 4px rgba(0,0,0,.5), inset -2px -2px 4px rgba(255,255,255,.03), 0 4px 14px rgba(0,0,0,.45); }
        .node-side{ width:46px; height:46px; }
        .node-center{ width:64px; height:64px; background:#1e1e2c; color:#fff;
            box-shadow:inset 2px 2px 5px rgba(0,0,0,.55), inset -2px -2px 5px rgba(255,255,255,.04), 0 6px 20px rgba(0,0,0,.5); }
        @media (max-width:768px){ .node-side{ width:38px; height:38px; } .node-center{ width:52px; height:52px; } }

        .node-glow{ position:absolute; inset:-1px; border-radius:50%; opacity:0; }
        .glow-a{ background:radial-gradient(circle at 72% 50%, rgba(255,255,255,.4), transparent 70%); animation:glowA 3.4s infinite; }
        .glow-b{ background:radial-gradient(circle at 28% 50%, rgba(200,100,255,.55), transparent 70%); animation:glowB 3.4s infinite; }
        @keyframes glowA{ 0%,100%{opacity:0} 4%{opacity:1} 20%{opacity:1} 26%{opacity:0} }
        @keyframes glowB{ 0%,47%{opacity:0} 51%{opacity:1} 68%{opacity:1} 74%{opacity:0} 100%{opacity:0} }

        .splash{ position:absolute; width:100px; height:100px; left:50%; top:50%; margin:-50px 0 0 -50px; border-radius:50%;
            background:radial-gradient(circle, rgba(255,77,200,.6), transparent 70%); opacity:0; transform:scale(.4); animation:splashSeq 3.4s infinite; pointer-events:none; }
        @keyframes splashSeq{ 0%,23%{opacity:0; transform:scale(.4)} 27%{opacity:1; transform:scale(.7)} 47%{opacity:0; transform:scale(1.4)} 100%{opacity:0; transform:scale(.4)} }

        .beam-track{ position:absolute; top:50%; left:23px; right:23px; height:2px; pointer-events:none; }
        @media (max-width:768px){ .beam-track{ left:19px; right:19px; } }
        .beam{ position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; background:#fff; opacity:0;
            box-shadow:0 0 12px 3px rgba(255,255,255,.9), 0 0 26px 10px rgba(240,110,210,.55); animation:beamTravel 3.4s cubic-bezier(.4,0,.2,1) infinite; }
        @keyframes beamTravel{
            0%{ left:0%; opacity:0 } 4%{ opacity:1 } 23%{ left:50%; opacity:1 } 24%{ opacity:0 }
            47%{ opacity:0 } 48%{ left:50%; opacity:1 } 70%{ left:100%; opacity:1 } 71%{ opacity:0 } 100%{ left:100%; opacity:0 }
        }

        .hero-heading strong{ display:block; font-weight:400; background:linear-gradient(to right, rgba(255,255,255,1), rgba(255,255,255,.6)); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .hero-heading br.mobile-hide{ display:inline; }
        @media (max-width:768px){ .hero-heading br.mobile-hide{ display:none; } }

        .burger span{ display:block; width:20px; height:2px; background:#fff; transition:transform .3s ease, opacity .3s ease; }
        .burger span+span{ margin-top:5px; }
        .burger.open span:first-child{ transform:translateY(3.5px) rotate(45deg); }
        .burger.open span:last-child{ transform:translateY(-3.5px) rotate(-45deg); }

        .mobile-menu{ position:fixed; top:0; right:-100%; width:100%; height:100%; background:#0a0a0f; z-index:50;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
            transition:right .4s cubic-bezier(.4,0,.2,1); }
        .mobile-menu.open{ right:0; }
    </style>
</head>
<body class="antialiased" style="padding:14px">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const GadLogo = ({ className = '', color = '#fff' }) => (
            <svg className={"gad-logo " + className} viewBox="0 0 355 110" role="img" aria-label="g.a.d." style={{ color }}>

4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z" />
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
            </svg>
        );
        const GadMark = ({ size = 30, color = '#fff' }) => (
            <svg className="gad-logo" width={size} height={size} viewBox="293 1 58 58" role="img" aria-label="g.a.d." style={{ color }}>
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
            </svg>
        );

        const NAV = ['Метод', 'Тарифы', 'Документация'];

        const BRANDS = [
            { name: 'Wexa', icon: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M12 3l8 5v8l-8 5-8-5V8z" /></svg> },
            { name: 'koda', icon: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /></svg> },
            { name: 'paylane', icon: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M3 10h18" /></svg> },
            { name: 'N•va', icon: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M4 12l5-8 5 8-5 8z" /></svg> },
            { name: 'haze', icon: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M3 9h18M3 14h18" /></svg> },
        ];

        const Navbar = ({ open, setOpen }) => (
            <nav style={{ width: '100%', maxWidth: 1600, display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', padding: '18px 24px' }}>
                <a href="#" style={{ color: '#fff' }}><GadLogo style={{ height: '1.05rem' }} /></a>
                <div className="hidden md:flex" style={{ gap: 32 }}>
                    {NAV.map((l, i) => (
                        <a key={l} href="#" id={'nav-' + i} style={{ fontSize: '.85rem', color: '#8888a8', transition: 'color .2s' }}
                            onMouseEnter={e => e.currentTarget.style.color = '#fff'} onMouseLeave={e => e.currentTarget.style.color = '#8888a8'}>{l}</a>
                    ))}
                </div>
                <div className="hidden md:flex" style={{ justifySelf: 'end', gap: 10 }}>
                    <button id="login-btn" style={{ background: 'rgba(255,255,255,.06)', border: '1px solid rgba(255,255,255,.08)', color: '#fff', fontSize: '.82rem', fontWeight: 500, borderRadius: 999, padding: '7px 18px' }}>Войти</button>
                    <button id="signup-btn" style={{ background: '#fff', border: 'none', color: '#0a0a0f', fontSize: '.82rem', fontWeight: 600, borderRadius: 999, padding: '7px 18px' }}>Регистрация</button>
                </div>
                <button className="md:hidden burger" id="hamburger" style={{ justifySelf: 'end', gridColumn: 3 }} aria-label="Меню" onClick={() => setOpen(true)}><span /><span /></button>

                <div className={'mobile-menu' + (open ? ' open' : '')}>
                    <button className="burger open" style={{ position: 'absolute', top: 24, right: 24 }} aria-label="Закрыть" onClick={() => setOpen(false)}><span /><span /></button>
                    {NAV.map(l => <a key={l} href="#" style={{ fontSize: '1.2rem', color: '#fff' }} onClick={() => setOpen(false)}>{l}</a>)}
                    <button style={{ marginTop: 16, width: 220, background: 'rgba(255,255,255,.06)', border: '1px solid rgba(255,255,255,.08)', color: '#fff', fontSize: '.9rem', fontWeight: 500, borderRadius: 999, padding: '12px 18px' }}>Войти</button>
                    <button style={{ width: 220, background: '#fff', border: 'none', color: '#0a0a0f', fontSize: '.9rem', fontWeight: 600, borderRadius: 999, padding: '12px 18px' }}>Регистрация</button>
                </div>
            </nav>
        );

        const App = () => {
            const [open, setOpen] = useState(false);
            React.useEffect(() => { lucide.createIcons(); }, []);
            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <Navbar open={open} setOpen={setOpen} />

                    <div style={{ width: '100%', maxWidth: 1600, borderRadius: 20, border: '1px solid rgba(255,255,255,.07)', overflow: 'hidden', position: 'relative',
                        background: '#0d0b12', padding: '80px 40px 70px', display: 'flex', flexDirection: 'column', alignItems: 'center', minHeight: 640, textAlign: 'center' }}>
                        <div className="shader-blobs"><div className="blob blob-blue" /><div className="blob blob-pink" /></div>
                        <div className="arc-glow" />
                        <div className="grid-overlay" />
                        <div className="grain" />

                        <div className="pipeline" style={{ zIndex: 1 }}>
                            <div className="p-node node-side"><span className="node-glow glow-a" /><i data-lucide="layers" style={{ width: 18, height: 18 }}></i></div>
                            <div className="p-line line-a" />
                            <div className="p-node node-center"><span className="splash" /><GadMark size={30} /></div>
                            <div className="p-line line-b" />
                            <div className="p-node node-side"><span className="node-glow glow-b" /><i data-lucide="shield-check" style={{ width: 18, height: 18 }}></i></div>
                            <div className="beam-track"><div className="beam" /></div>
                        </div>

                        <div style={{ zIndex: 1, maxWidth: 760 }}>
                            <h1 className="hero-heading" style={{ fontWeight: 300, color: '#fff', fontSize: 'clamp(2rem, 5.5vw, 4rem)', lineHeight: 1.1, textWrap: 'balance', letterSpacing: '-0.02em', marginBottom: 24 }}>
                                Простой способ<strong>зашифровать данные</strong>
                            </h1>
                            <p style={{ fontSize: '.9rem', lineHeight: 1.6, color: 'rgba(255,255,255,.4)', maxWidth: 460, textWrap: 'balance', margin: '0 auto 36px' }}>
                                Полностью управляемый сервис шифрования и аннотирования данных для команд из любой отрасли.
                            </p>
                            <button id="get-started" style={{ background: '#fff', color: '#0a0a0f', fontSize: '.88rem', fontWeight: 600, padding: '12px 32px', borderRadius: 999, border: 'none', transition: 'opacity .2s, transform .2s' }}
                                onMouseEnter={e => { e.currentTarget.style.opacity = '.9'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
                                onMouseLeave={e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.transform = 'translateY(0)'; }}>Начать</button>
                        </div>
                    </div>

                    <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '18px clamp(28px, 5vw, 64px)', padding: '32px 24px 10px' }}>
                        {BRANDS.map(b => (
                            <div key={b.name} style={{ display: 'flex', alignItems: 'center', gap: 10, color: 'rgba(255,255,255,.35)', fontSize: '1.1rem', fontWeight: 500 }}>
                                {b.icon}{b.name}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
