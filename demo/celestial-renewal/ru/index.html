 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/>
                    <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>
                    <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
                </svg>
            );
        }

        function Button({ children, className = '', ...props }) {
            return (
                <button {...props} className={`bg-white text-black px-8 py-3.5 rounded-full font-medium text-sm tracking-wide hover:bg-white/90 transition-all duration-300 button-glow ${className}`}>
                    {children}
                </button>
            );
        }

        function Navbar() {
            const [open, setOpen] = useState(false);
            const links = ['О нас', 'Услуги', 'Журнал', 'Контакты'];
            const ease = 'cubic-bezier(0.22,1,0.36,1)';
            return (
                <>
                    <nav className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 md:px-12 py-5">
                        <div style={{ color: '#fff' }}>
                            <GadLogo />
                        </div>
                        <div className="hidden md:flex items-center gap-12 absolute left-1/2 -translate-x-1/2">
                            {links.map(l => (
                                <a key={l} href="#" className="text-white/80 hover:text-white text-sm tracking-wide transition-colors">{l}</a>
                            ))}
                        </div>
                        <Button className="hidden md:inline-flex">Консультация</Button>
                        <button aria-label="Меню" onClick={() => setOpen(o => !o)} className="md:hidden w-8 h-6 relative">
                            <span className="absolute left-0 top-0 w-8 h-[2px] bg-white transition-all duration-300" style={{ transitionTimingFunction: ease, transform: open ? 'translateY(9px) rotate(45deg)' : 'none' }} />
                            <span className="absolute left-0 top-1/2 -translate-y-1/2 w-8 h-[2px] bg-white transition-all duration-300" style={{ transitionTimingFunction: ease, opacity: open ? 0 : 1, transform: open ? 'scale(0)' : 'scale(1)' }} />
                            <span className="absolute left-0 bottom-0 w-8 h-[2px] bg-white transition-all duration-300" style={{ transitionTimingFunction: ease, transform: open ? 'translateY(-9px) rotate(-45deg)' : 'none' }} />
                        </button>
                    </nav>

                    <div className={`fixed inset-0 bg-black/40 z-40 transition-opacity duration-300 ${open ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setOpen(false)} />

                    <div className="fixed top-0 right-0 h-full w-[85%] max-w-[340px] bg-[#0a0608]/95 backdrop-blur-xl border-l border-white/10 z-50 flex flex-col px-8 py-24 transition-transform duration-500" style={{ transform: open ? 'translateX(0)' : 'translateX(100%)', transitionTimingFunction: ease }}>
                        <div className="flex flex-col gap-6">
                            {links.map((l, i) => (
                                <a key={l} href="#" onClick={() => setOpen(false)} className="text-white/80 hover:text-white text-lg tracking-wide transition-all duration-400" style={{ transitionDelay: open ? `${150 + i * 75}ms` : '0ms', opacity: open ? 1 : 0, transform: open ? 'translateX(0)' : 'translateX(20px)' }}>{l}</a>
                            ))}
                        </div>
                        <Button className="mt-10 w-full transition-all duration-400" style={{ transitionDelay: open ? '450ms' : '0ms', opacity: open ? 1 : 0, transform: open ? 'translateX(0)' : 'translateX(20px)' }}>Консультация</Button>
                    </div>
                </>
            );
        }

        function Hero() {
            return (
                <section className="relative h-screen overflow-hidden">
                    <video autoPlay muted loop playsInline aria-hidden="true" className="absolute inset-0 w-full h-full object-cover" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260613_180732_a54afbf6-b30d-470e-861f-669871f09f67.mp4" />
                    <div className="absolute inset-0 bg-black/20" />
                    <Navbar />
                    <div className="absolute inset-0 z-10 flex flex-col items-center justify-center px-6 -mt-[120px] text-center">
                        <h1 className="font-normal text-white text-[36px] md:text-7xl lg:text-[110px] leading-[0.9] tracking-tight text-center text-glow" style={{ fontFamily: "'Instrument Serif', serif" }}>
                            Мягкий уход. Сияющий образ.
                        </h1>
                        <p className="text-white/70 text-sm md:text-base text-center mt-5 md:mt-7 max-w-xl">
                            Уход за красотой и телом от экспертов — с теплом и вниманием.
                        </p>
                        <Button className="mt-6 md:mt-9">Начать обновление</Button>
                    </div>
                    <div className="hidden md:flex items-center gap-3 absolute bottom-8 left-8 z-10">
                        <div className="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center">
                            <span className="w-4 h-[2px] bg-white/70 rounded-full" />
                        </div>
                        <div className="text-white/60 text-xs leading-tight">
                            <p>Смотрите</p>
                            <p>со звуком</p>
                        </div>
                    </div>
                </section>
            );
        }

        function QuoteSection() {
            const sectionRef = useRef(null);
            const rainbowRef = useRef(null);
            const leftCloudRef = useRef(null);
            const rightCloudRef = useRef(null);

            useEffect(() => {
                const clamp01 = v => Math.max(0, Math.min(1, v));
                const st = { rainbowY: 120, leftX: -200, leftY: 0, leftOp: 0, rightX: 200, rightY: 0, rightOp: 0 };
                let raf;
                const tick = () => {
                    const el = sectionRef.current;
                    if (el) {
                        const rect = el.getBoundingClientRect();
                        const wh = window.innerHeight;
                        const progress = clamp01((wh - rect.top) / (wh + rect.height));
                        const inView = progress > 0.12 && progress < 0.92;
                        const cloudYTarget = progress * -50;

                        st.rainbowY += ((120 + (-160 - 120) * progress) - st.rainbowY) * 0.06;
                        if (rainbowRef.current) rainbowRef.current.style.transform = `translate3d(0, ${st.rainbowY}px, 0)`;

                        st.leftX += ((inView ? 0 : -200) - st.leftX) * 0.04;
                        st.leftY += (cloudYTarget - st.leftY) * 0.04;
                        st.leftOp += (clamp01(1 - Math.abs(st.leftX) / 200) - st.leftOp) * 0.04;
                        if (leftCloudRef.current) {
                            leftCloudRef.current.style.transform = `translate3d(${st.leftX}px, ${st.leftY}px, 0)`;
                            leftCloudRef.current.style.opacity = st.leftOp;
                        }

                        st.rightX += ((inView ? 0 : 200) - st.rightX) * 0.04;
                        st.rightY += (cloudYTarget - st.rightY) * 0.04;
                        st.rightOp += (clamp01(1 - Math.abs(st.rightX) / 200) - st.rightOp) * 0.04;
                        if (rightCloudRef.current) {
                            rightCloudRef.current.style.transform = `translate3d(${st.rightX}px, ${st.rightY}px, 0) scaleX(-1)`;
                            rightCloudRef.current.style.opacity = st.rightOp;
                        }
                    }
                    raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(raf);
            }, []);

            return (
                <section ref={sectionRef} className="relative h-screen overflow-hidden" style={{ background: 'linear-gradient(180deg, #010A17 0%, #0A4267 30%, #20658E 60%, #6BADC4 100%)' }}>
                    <img ref={rainbowRef} src="https://soft-zoom-63098134.figma.site/_assets/v11/8d520a7515d06cbfc403d0125e3d05b1a7ccd29c.png" alt="" className="absolute inset-x-0 top-0 z-30 w-full will-change-transform" style={{ transform: 'translate3d(0, 120px, 0)' }} />
                    <img ref={leftCloudRef} src="https://soft-zoom-63098134.figma.site/_assets/v11/0d6dfd3f90b930f21726f2ed56a3320d79b7a797.png" alt="" className="hidden sm:block absolute left-0 bottom-[10%] z-10 w-[500px] md:w-[650px] will-change-transform" style={{ marginLeft: '-50%', opacity: 0, transform: 'translate3d(-200px, 0, 0)' }} />
                    <img ref={rightCloudRef} src="https://soft-zoom-63098134.figma.site/_assets/v11/0d6dfd3f90b930f21726f2ed56a3320d79b7a797.png" alt="" className="hidden sm:block absolute right-0 bottom-[15%] z-10 w-[500px] md:w-[650px] will-change-transform" style={{ marginRight: '-75%', opacity: 0, transform: 'translate3d(200px, 0, 0) scaleX(-1)' }} />
                    <div className="relative z-20 h-full flex flex-col items-center justify-center px-6 text-center max-w-4xl mx-auto">
                        <p className="font-normal text-white text-xl sm:text-2xl md:text-4xl lg:text-[42px] leading-[1.45] md:leading-[1.5]" style={{ fontFamily: "'Instrument Serif', serif" }}>
                            «g.a.d. родился из убеждения, что красота должна раскрывать вашу природу, а не спорить с ней. Мы выбираем взвешенные решения, продуманный подход и результат, который держится надолго. Сначала — время понять, что важно именно вам, и только потом — решение, как вам помочь. Без спешки, без лишнего — только забота, после которой вы чувствуете, как сияете».
                        </p>
                        <p className="mt-6 md:mt-8 text-white/80 text-sm md:text-base tracking-wide">Dr. Mia Callahan — основательница</p>
                    </div>
                </section>
            );
        }

        function App() {
            return (
                <div className="bg-[#0a0608]">
                    <Hero />
                    <QuoteSection />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
