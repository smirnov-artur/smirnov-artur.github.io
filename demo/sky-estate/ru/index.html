<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Galaxy Home</title>
    <meta name="description" content="Космический лендинг недвижимости: параллакс-слои неба и гор за градиентным заголовком, абзац проявляется по буквам при прокрутке, а статистика оживает на экране.">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { 'brand-blue': '#8F9EFF', 'brand-navy': '#271C40', 'brand-dark': '#020319' } } } };</script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        body{font-family:'Inter Tight',system-ui,sans-serif;overflow-x:hidden;background:#020319}
        *{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
        html{scroll-behavior:smooth}
        @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
        @keyframes marquee-reverse{from{transform:translateX(-50%)}to{transform:translateX(0)}}
        .animate-marquee{animation:marquee 30s linear infinite}
        .animate-marquee-reverse{animation:marquee-reverse 30s linear infinite}
        .cta-btn{background:linear-gradient(180deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.10) 76%), radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.7) 0%, transparent 100%), #BEC7FF}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { motion, AnimatePresence, useScroll, useTransform, useInView } = Motion;

        const SKY = '../img/sky.webp';
        const BUILDING = '../img/building.webp';
        const MOUNTAIN = '../img/mountain.webp';

        const NAV_LINKS = ['Главная', 'О нас', 'Объекты', 'Проекты', 'Контакты'];
        const MARQUEE_1 = [['sparkles', 'Prism'], ['waves', 'Cascade'], ['star', 'Pinnacle']];
        const MARQUEE_2 = [['zap', 'Impulse'], ['orbit', 'Nexus'], ['gem', 'Radiant']];
        const STATS = [['500', 'Реализованные объекты'], ['25', 'Эксклюзивные рынки'], ['12', 'Лет в отрасли'], ['99%', 'Удовлетворённость владельцев']];
        const FILL_TEXT = "Мы представляем изысканные резиденции, где сочетаются впечатляющая архитектура, лучшее окружение и безупречное мастерство. Каждый дом выбран за опыт, который он дарит, а не только за площадь, которую он занимает.";

        const GadLogo = ({ className, style }) => (
            <svg className={className} style={style} height="26" viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
                <path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/>
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
            </svg>
        );

        const CtaButton = ({ className, children }) => (
            <button className={"cta-btn rounded-full border border-white/80 font-medium text-brand-navy/80 hover:scale-105 transition-transform " + className}>{children}</button>
        );

        function Navbar(){
            const [open, setOpen] = useState(false);
            return (
                <React.Fragment>
                    <div className="fixed top-0 left-0 right-0 z-[60] flex justify-center px-4 pt-4 md:pt-6">
                        <div className="flex items-center gap-4 md:gap-8 lg:gap-20 rounded-full bg-[#312D7C]/40 backdrop-blur-[15px] px-4 py-3">
                            <GadLogo className="gad-logo h-6 w-6 md:h-7 md:w-7" style={{ color: '#fff' }} />
                            <div className="hidden md:flex items-center gap-6 text-sm">
                                {NAV_LINKS.map((l, i) => (
                                    <a key={l} href="#" className={i === 0 ? 'text-white' : 'text-[#B6B8C3] hover:text-white transition-colors'}>{l}</a>
                                ))}
                            </div>
                            <CtaButton className="hidden md:inline-flex px-6 py-2 text-[15px]">Связаться</CtaButton>
                            <button className="md:hidden flex flex-col justify-between h-4 w-6" onClick={() => setOpen(o => !o)} aria-label="Меню">
                                <motion.span className="h-0.5 w-6 bg-white rounded-full" animate={open ? { rotate: 45, y: 7 } : { rotate: 0, y: 0 }} />
                                <motion.span className="h-0.5 w-6 bg-white rounded-full" animate={{ opacity: open ? 0 : 1 }} />
                                <motion.span className="h-0.5 w-6 bg-white rounded-full" animate={open ? { rotate: -45, y: -7 } : { rotate: 0, y: 0 }} />
                            </button>
                        </div>
                    </div>
                    <AnimatePresence>
                        {open && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                className="fixed inset-0 z-50 bg-brand-dark/95 backdrop-blur-xl flex flex-col items-center justify-center gap-8">
                                {NAV_LINKS.map((l, i) => (
                                    <motion.a key={l} href="#" onClick={() => setOpen(false)}
                                        initial={{ opacity: 0, y: 20, filter: 'blur(8px)' }} animate={{ opacity: 1, y: 0, filter: 'blur(0px)' }}
                                        transition={{ delay: i * 0.08 }} className="text-3xl text-white font-medium">{l}</motion.a>
                                ))}
                            </motion.div>
                        )}
                    </AnimatePresence>
                </React.Fragment>
            );
        }

        function Hero(){
            const ref = useRef(null);
            const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
            const bgY = useTransform(scrollYProgress, [0, 1], ['0%', '8%']);
            return (
                <section ref={ref} className="relative h-screen w-full overflow-hidden z-10 isolate">
                    <motion.img src={SKY} style={{ y: bgY }} className="absolute inset-0 z-0 h-[120%] w-full object-cover" alt="" />
                    <div className="relative z-10 pt-[22vh] md:pt-32 lg:pt-36 text-center">
                        <h1 className="font-semibold leading-none whitespace-nowrap bg-clip-text text-transparent mix-blend-lighten"
                            style={{ fontSize: 'clamp(3rem,14vw,14rem)', backgroundImage: 'linear-gradient(to bottom, #A8B4FF, #FFFFFF)' }}>
                            Galaxy&nbsp;&nbsp;Home
                        </h1>
                    </div>
                    <div className="absolute z-20 left-6 top-[200px] md:left-12 md:top-[320px] lg:left-24 hidden md:block max-w-[220px] text-lg md:text-[22px] md:leading-6 font-medium text-white/70 mix-blend-overlay">Изящество над облаками</div>
                    <div className="absolute z-20 right-6 top-[200px] md:right-12 md:top-[320px] lg:right-24 hidden md:block max-w-[240px] text-right text-lg md:text-[22px] md:leading-6 font-medium text-white mix-blend-overlay">Ваша резиденция мечты начинается здесь</div>
                    <motion.img src={BUILDING} style={{ y: bgY }} className="absolute inset-0 z-30 h-[120%] w-full object-cover" alt="" />
                </section>
            );
        }

        function DescriptionBlock(){
            return (
                <div className="flex flex-col items-center px-5 sm:px-6 py-16 md:py-32">
                    <p className="max-w-[600px] text-sm sm:text-base md:text-lg font-medium text-white/90 leading-relaxed text-center" style={{ textShadow: '2px 4px 26px rgba(0,0,0,0.56)' }}>
                        Откройте для себя эксклюзивные резиденции, знаковую архитектуру и тщательно подобранные дома в самых престижных уголках мира.
                    </p>
                    <CtaButton className="mt-6 sm:mt-7 px-8 sm:px-10 py-2.5 sm:py-3 text-base sm:text-lg">Связаться</CtaButton>
                </div>
            );
        }

        function Char({ ch, progress, index, total }){
            const start = index / total;
            const range = [Math.max(0, start - 0.01), Math.min(1, start + 0.01)];
            const opacity = useTransform(progress, range, [0.25, 1]);
            return <motion.span style={{ opacity }}>{ch}</motion.span>;
        }

        function TextFillSection(){
            const ref = useRef(null);
            const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });
            const chars = FILL_TEXT.split('');
            return (
                <div ref={ref} className="max-w-[820px] mx-auto px-5 sm:px-6 pb-16 sm:pb-24 pt-8 sm:pt-12 md:px-12">
                    <p className="text-xl sm:text-2xl md:text-[40px] md:leading-[48px] text-center leading-snug tracking-tight font-medium text-white">
                        {chars.map((c, i) => <Char key={i} ch={c} progress={scrollYProgress} index={i} total={chars.length} />)}
                    </p>
                </div>
            );
        }

        function MarqueeRow({ items, cls }){
            const doubled = [...items, ...items];
            return (
                <div className={"flex gap-8 sm:gap-12 " + cls}>
                    {doubled.map(([icon, name], i) => (
                        <div key={i} className="flex items-center gap-2 shrink-0">
                            <i data-lucide={icon} className="h-4 w-4 sm:h-5 sm:w-5 text-white/80"></i>
                            <span className="text-sm sm:text-base font-medium text-white/90 whitespace-nowrap">{name}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function Marquee(){
            return (
                <div className="max-w-[820px] mx-auto py-4 sm:py-6 overflow-hidden">
                    <MarqueeRow items={MARQUEE_1} cls="animate-marquee mb-4 sm:mb-6" />
                    <MarqueeRow items={MARQUEE_2} cls="animate-marquee-reverse" />
                </div>
            );
        }

        function StatItem({ value, label, index }){
            const ref = useRef(null);
            const inView = useInView(ref, { once: true, margin: '-100px' });
            return (
                <motion.div ref={ref} className="flex flex-col items-center px-4 py-3"
                    initial={{ opacity: 0, y: 30 }} animate={inView ? { opacity: 1, y: 0 } : {}}
                    transition={{ duration: 0.6, delay: index * 0.15 }}>
                    <div className="text-4xl sm:text-5xl md:text-[64px] md:leading-[76px] font-semibold text-brand-navy">{value}</div>
                    <div className="text-sm sm:text-base md:text-xl font-medium text-brand-navy/70 text-center">{label}</div>
                </motion.div>
            );
        }

        function Stats(){
            return (
                <div className="relative px-5 sm:px-6 py-16 md:py-32">
                    <div className="absolute -top-[400px] left-0 right-0 bottom-0 -z-10" style={{ background: 'linear-gradient(to bottom, transparent, rgba(255,255,255,.6), #fff)' }}></div>
                    <h2 className="text-2xl md:text-[40px] md:leading-[44px] font-medium text-brand-navy text-center mb-10 sm:mb-16">Здесь — только проверенные результаты</h2>
                    <div className="grid grid-cols-2 md:flex max-w-5xl mx-auto items-center justify-center">
                        {STATS.map(([v, l], i) => (
                            <React.Fragment key={l}>
                                <StatItem value={v} label={l} index={i} />
                                {i < STATS.length - 1 && <div className="hidden md:block h-[80px] w-px bg-brand-navy/20 mx-8 lg:mx-12"></div>}
                            </React.Fragment>
                        ))}
                    </div>
                </div>
            );
        }

        function MountainSection(){
            const ref = useRef(null);
            const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end end'] });
            const mountainY = useTransform(scrollYProgress, [0, 1], ['0%', '-20%']);
            return (
                <div ref={ref} className="relative z-40 -mt-[25vh] isolate">
                    <motion.img src={MOUNTAIN} style={{ y: mountainY }} className="absolute -top-[10vh] left-0 right-0 bottom-0 -z-10 h-[120%] w-full object-cover object-top" alt="" />
                    <div className="pt-24 sm:pt-32 md:pt-40">
                        <DescriptionBlock />
                        <TextFillSection />
                        <Marquee />
                        <Stats />
                    </div>
                </div>
            );
        }

        function App(){
            useEffect(() => { lucide.createIcons(); });
            return (
                <div className="bg-brand-dark">
                    <Navbar />
                    <Hero />
                    <MountainSection />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
