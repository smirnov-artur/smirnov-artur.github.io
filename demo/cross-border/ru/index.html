    <section className="relative" style={{ background: 'linear-gradient(180deg, #C8C7B3 0%, #F0B172 50%, #EA7C58 100%)', padding: 'clamp(60px,12vh,120px) 20px' }}>
      <Reveal x={-60}>
        <h2 className="font-display font-extrabold uppercase text-white" style={{ fontSize: 'clamp(44px,13vw,64px)', lineHeight: 0.92 }}>ЛОГИСТИКА</h2>
        <p className="mt-2" style={{ fontSize: 'clamp(18px,5vw,26px)', color: '#1a1a1a' }}>рождена масштабом<br />выверена точностью</p>
      </Reveal>

      <WorldMap />

      <div className="mt-16">
        <Reveal x={-60}>
          <div className="font-display font-extrabold text-white" style={{ fontSize: 'clamp(50px,14vw,72px)', lineHeight: 1 }}>3M+</div>
          <p style={{ color: '#1a1a1a', fontSize: 'clamp(14px,3.8vw,18px)' }}>тонн груза<br />доставлено<br />без задержек</p>
        </Reveal>
        <Reveal x={60} className="mt-10" style={{ paddingLeft: 'clamp(40px,12vw,90px)' }}>
          <div className="font-display font-extrabold text-white" style={{ fontSize: 'clamp(50px,14vw,72px)', lineHeight: 1 }}>13+</div>
          <p style={{ color: '#1a1a1a', fontSize: 'clamp(14px,3.8vw,18px)' }}>лет надёжной<br />и стабильной<br />работы</p>
        </Reveal>
      </div>
    </section>

}

function ContactSection() {
  const scrollTop = () => {
    const el = document.getElementById('phoneScroll');
    if (el) el.scrollTo({ top: 0, behavior: 'smooth' });
  };
  return (
    <section className="relative" style={{ background: '#0a1f2b', padding: 'clamp(48px,10vh,96px) 20px clamp(32px,6vh,64px)' }}>
      <Reveal y={40} margin="0px 0px -60px 0px">
        <h2 className="font-display font-extrabold uppercase" style={{ fontSize: 'clamp(44px,13vw,64px)', lineHeight: 0.92 }}>
          <span className="text-white">СВЯЖИТЕСЬ С </span><span style={{ color: '#ffda00' }}>НАМИ</span>
        </h2>
        <p className="mt-3" style={{ color: '#b0b8bc', fontSize: 'clamp(14px,3.8vw,18px)' }}>Заполните форму — и наша команда свяжется с вами в ближайшее время.</p>
      </Reveal>

      <motion.form
        onSubmit={(e) => e.preventDefault()}
        className="mt-8 flex flex-col gap-3"
        initial="hidden" whileInView="show" viewport={{ once: true, margin: '0px 0px -40px 0px' }} variants={STAGGER}
      >
        <motion.input variants={FADE_UP} className="pill-input w-full rounded-full text-white placeholder-white/50 outline-none" style={{ background: 'rgba(255,255,255,.08)', padding: '14px 22px', fontSize: 'clamp(14px,3.5vw,16px)' }} placeholder="Имя" />
        <motion.input variants={FADE_UP} className="pill-input w-full rounded-full text-white placeholder-white/50 outline-none" style={{ background: 'rgba(255,255,255,.08)', padding: '14px 22px', fontSize: 'clamp(14px,3.5vw,16px)' }} placeholder="Фамилия" />
        <motion.input variants={FADE_UP} type="email" className="pill-input w-full rounded-full text-white placeholder-white/50 outline-none" style={{ background: 'rgba(255,255,255,.08)', padding: '14px 22px', fontSize: 'clamp(14px,3.5vw,16px)' }} placeholder="Эл. почта" />
        <motion.button
          variants={FADE_UP} whileHover={{ scale: 1.03, y: -2, backgroundColor: '#ffe84d' }} whileTap={{ scale: .97 }}
          className="w-full rounded-full" style={{ background: '#FFDA00', color: '#0a1f2b', fontWeight: 700, fontSize: 'clamp(16px,4vw,20px)', padding: '14px 0', marginTop: 8 }}
        >
          Отправить
        </motion.button>
      </motion.form>

      <div className="mt-10 flex flex-col gap-2">
        <a href="mailto:info@cargox-group.com" className="footer-link" style={{ fontSize: 15 }}>info@cargox-group.com</a>
        <a href="tel:+380442347890" className="footer-link" style={{ fontSize: 15 }}>+380 44 234-7890</a>
      </div>

      <div className="flex gap-3 mt-6">
        {SOCIALS.map((s) => (
          <motion.a
            key={s.label} href="#" aria-label={s.label}
            whileHover={{ scale: 1.15, y: -3 }} whileTap={{ scale: .95 }}
            className="w-11 h-11 rounded-full bg-white flex items-center justify-center"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#0a1f2b"><path d={s.d} /></svg>
          </motion.a>
        ))}
      </div>

      <motion.button
        onClick={scrollTop} whileHover={{ scale: 1.15, y: -3 }} whileTap={{ scale: .95 }} aria-label="Наверх"
        className="absolute right-5 w-11 h-11 rounded-full bg-white flex items-center justify-center" style={{ top: 'clamp(48px,10vh,96px)' }}
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a1f2b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" />
        </svg>
      </motion.button>

      <p className="mt-10" style={{ color: '#6b7a80', fontSize: 'clamp(12px,3.2vw,14px)' }}>&copy; 2025. Все права защищены.</p>
    </section>
  );
}

function App() {
  const [menuOpen, setMenuOpen] = useState(false);
  return (
    <div className="stage">
      <div className="iphone-frame">
        <div className="iphone-screen">
          <div className="dynamic-island" />
          <div className="scroll-content" id="phoneScroll">
            <Hero menuOpen={menuOpen} onToggleMenu={() => setMenuOpen((v) => !v)} />
            <InfoSection />
            <ContactSection />
          </div>
          <MobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} />
          <div className="home-indicator" />
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
