function useScrollProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        setP(Math.min(window.scrollY / window.innerHeight, 1));
        raf = null;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return p;
}

function smoothPath(pts) {
  let d = `M ${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const mx = (x0 + x1) / 2;
    d += ` C ${mx},${y0} ${mx},${y1} ${x1},${y1}`;
  }
  return d;
}

function AnimatedChart() {
  const W = 400, H = 180, padTop = 10, padBottom = 30, maxVal = 40000;
  const n = CHART_DATA.length;
  const pts = CHART_DATA.map(([, v], i) => [
    (i * W) / (n - 1),
    padTop + (1 - v / maxVal) * (H - padTop - padBottom),
  ]);
  const baseline = H - padBottom;
  const linePath = smoothPath(pts);
  const areaPath = `${linePath} L ${pts[n - 1][0]},${baseline} L ${pts[0][0]},${baseline} Z`;
  const satI = 5;
  const [hx, hy] = pts[satI];

  const lineRef = useRef(null);
  const areaRef = useRef(null);
  const dotRef = useRef(null);
  const tipRef = useRef(null);

  useEffect(() => {
    const line = lineRef.current;
    if (line) {
      const len = line.getTotalLength();
      line.style.strokeDasharray = String(len);
      line.style.strokeDashoffset = String(len);
      requestAnimationFrame(() => {
        line.style.transition = 'stroke-dashoffset 1.8s ease-out';
        line.style.strokeDashoffset = '0';
      });
    }
    if (areaRef.current) {
      areaRef.current.style.opacity = '0';
      setTimeout(() => {
        areaRef.current.style.transition = 'opacity 1s';
        areaRef.current.style.opacity = '1';
      }, 800);
    }
    if (dotRef.current) {
      dotRef.current.style.transform = 'scale(0)';
      setTimeout(() => {
        dotRef.current.style.transition = 'transform 0.4s';
        dotRef.current.style.transform = 'scale(1)';
      }, 1600);
    }
    if (tipRef.current) {
      tipRef.current.style.opacity = '0';
      tipRef.current.style.transform = 'translateY(4px)';
      setTimeout(() => {
        tipRef.current.style.transition = 'opacity 0.4s, transform 0.4s';
        tipRef.current.style.opacity = '1';
        tipRef.current.style.transform = 'translateY(0)';
      }, 1800);
    }
  }, []);

  const yTicks = [0, 10000, 20000, 30000, 40000];
  const yOf = (v) => padTop + (1 - v / maxVal) * (H - padTop - padBottom);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
      <defs>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#1F2937" stopOpacity="0.08" />
          <stop offset="1" stopColor="#1F2937" stopOpacity="0" />
        </linearGradient>
      </defs>
      {yTicks.slice(1).map((v) => (
        <line key={v} x1="36" y1={yOf(v)} x2={W} y2={yOf(v)} stroke="#E5E7EB" strokeWidth="0.5" strokeDasharray="4 3" />
      ))}
      {yTicks.map((v) => (
        <text key={v} x="30" y={yOf(v) + 3} textAnchor="end" fill="#9CA3AF" fontSize="9">
          {v === 0 ? '0' : `${v / 1000}k`}
        </text>
      ))}
      <path ref={areaRef} d={areaPath} fill="url(#chartGrad)" stroke="none" />
      <line x1={hx} y1={hy} x2={hx} y2={baseline} stroke="#1F2937" strokeWidth="1" strokeDasharray="3 2" />
      <path ref={lineRef} d={linePath} fill="none" stroke="#1F2937" strokeWidth="2" strokeLinecap="round" />
      {pts.map(([x, y], i) => (
        <text key={i} x={x} y={H - 8} textAnchor={i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'} fontSize="9" fill={i === satI ? '#111827' : '#9CA3AF'} fontWeight={i === satI ? '600' : '400'}>
          {CHART_DATA[i][0]}
        </text>
      ))}
      <circle ref={dotRef} cx={hx} cy={hy} r="5" fill="#fff" stroke="#1F2937" strokeWidth="2" style={{ transformBox: 'fill-box', transformOrigin: 'center' }} />
      <g ref={tipRef}>
        <rect x={hx - 48} y={hy - 32} width="96" height="22" rx="6" fill="#1F2937" />
        <text x={hx - 42} y={hy - 17} fontSize="9" fill="#fff" fontWeight="600">32,104</text>
        <text x={hx + 8} y={hy - 17} fontSize="9" fill="#34D399" fontWeight="600">+6,488</text>
      </g>
    </svg>
  );
}

function ProgressRing({ color, percent }) {
  const r = 16;
  const circ = 2 * Math.PI * r;
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.strokeDashoffset = String(circ);
    setTimeout(() => {
      el.style.transition = 'stroke-dashoffset 1.2s ease-out';
      el.style.strokeDashoffset = String(circ - (percent / 100) * circ);
    }, 2000);
  }, []);
  return (
    <svg width="40" height="40" viewBox="0 0 40 40" className="hidden sm:block flex-shrink-0">
      <circle cx="20" cy="20" r={r} fill="none" stroke="#E5E7EB" strokeWidth="3" />
      <circle ref={ref} cx="20" cy="20" r={r} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeDasharray={circ} transform="rotate(-90 20 20)" />
    </svg>
  );
}

            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-gray-300"></span>В черновиках</span>
          </div>
          <span className="text-xs font-medium text-gray-700 bg-gray-100 rounded-md px-2.5 py-1">За месяц</span>
        </div>
      </div>
      <AnimatedChart />
      <TopChannels />
    </div>
  );
}

function ShowcaseSection({ scrollProgress }) {
  const fadeStart = 0.35, fadeEnd = 0.75;
  const t = Math.min(Math.max((scrollProgress - fadeStart) / (fadeEnd - fadeStart), 0), 1);
  const opacity = t, scale = 0.88 + t * 0.12;
  return (
    <section
      className="relative min-h-screen flex items-center justify-center px-6 md:px-16 lg:px-24"
      style={{ opacity, transform: `scale(${scale})`, transformOrigin: 'center top', zIndex: 20, willChange: 'transform' }}
    >
      <div className="relative w-full max-w-7xl mx-auto rounded-2xl sm:rounded-3xl overflow-hidden min-h-[480px] sm:min-h-[560px] md:min-h-[680px]">
        <video className="absolute inset-0 w-full h-full object-cover" src={SHOWCASE_VIDEO} autoPlay loop muted playsInline />
        <div className="absolute inset-0 z-[1] bg-gradient-to-t from-black/90 via-black/50 to-transparent pointer-events-none" />
        <div className="relative z-10 flex flex-col md:flex-row items-end md:items-stretch h-full min-h-[480px] sm:min-h-[560px] md:min-h-[680px]">
          <div className="flex flex-col justify-end p-4 sm:p-5 md:p-8 md:w-1/2">
            <h2 className="text-2xl sm:text-3xl md:text-[2.75rem] font-medium text-gray-900 md:text-white md:leading-[1.15] leading-tight tracking-tighter">
              Ваш контент-движок,<br />быстрее и понятнее
            </h2>
            <p className="mt-5 text-sm md:text-base text-gray-600 md:text-white/70 leading-relaxed max-w-md">
              Актуальные данные о результатах, редакционная аналитика и ясность, которая нужна, чтобы каждый раз публиковать уверенно.
            </p>
          </div>
          <div className="flex items-end justify-end md:w-1/2 mt-auto origin-bottom-right scale-[0.75] sm:scale-[0.85] md:scale-100">
            <Dashboard />
          </div>
        </div>
      </div>
    </section>
  );
}

function App() {
  const scrollProgress = useScrollProgress();
  const videoZoom = 1 + scrollProgress * 0.3;

  useEffect(() => { window.lucide && window.lucide.createIcons(); }, []);

  return (
    <div className="min-h-[200vh]">
      <VideoBackground zoom={videoZoom} />
      <Navbar />
      <div className="relative" style={{ zIndex: 10 }}>
        <Hero scrollProgress={scrollProgress} />
        <ShowcaseSection scrollProgress={scrollProgress} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
