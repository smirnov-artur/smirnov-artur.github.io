<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1720">
<title>Оценка менеджера — планшет и админка</title>
<style>
:root{
  --ink:#0f1720; --muted:#5b6673; --line:#e3e7ec; --card:#ffffff; --bg:#f3f5f8;
  --accent:#1f6feb; --accent-ink:#ffffff; --good:#16a34a; --bad:#dc2626; --star:#f5b301;
  --r:18px; --sh:0 10px 30px rgba(15,23,32,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line)}
.top b{font-size:17px}
.top .hint{color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:#eef1f5;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stage{display:flex;justify-content:center;padding:26px 16px 40px}
/* рамка планшета на компьютере */
.tablet{width:min(1024px,100%);aspect-ratio:4/3;background:#111;border-radius:34px;padding:18px;box-shadow:var(--sh)}
.screen{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:#0f1720}
@media (max-width:820px){
  .stage{padding:0}
  .tablet{aspect-ratio:auto;height:calc(100vh - 62px);min-height:560px;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .top .hint{display:none}
}
/* киоск */
.kiosk{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;background-size:cover;background-position:center}
.kiosk:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 80% 0%,rgba(255,255,255,.18),transparent 55%),linear-gradient(180deg,rgba(8,12,18,.2),rgba(8,12,18,.55))}
.kiosk>*{position:relative}
.kbar{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;font-size:15px;opacity:.92}
.kbar .brand{font-weight:700;letter-spacing:.2px}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:5px;border-radius:5px;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.kbody{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 26px 26px}
.panel{width:min(760px,100%);background:rgba(255,255,255,.96);color:var(--ink);border-radius:26px;padding:30px 32px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.anim{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel h2{margin:0 0 6px;font-size:clamp(22px,3.2vw,30px);line-height:1.2}
.panel .sub{color:var(--muted);margin:0 0 20px}
.welcome{text-align:center;max-width:720px}
.welcome h1{font-size:clamp(30px,5vw,52px);line-height:1.08;margin:0 0 14px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.welcome p{font-size:clamp(17px,2.2vw,21px);margin:0 0 28px;opacity:.95}
.big{border:0;border-radius:999px;padding:18px 40px;font-size:20px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.big:active{transform:scale(.98)}
.tap{margin-top:16px;font-size:14px;opacity:.8}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.person{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px 10px;text-align:center}
.person.on{border-color:var(--accent);box-shadow:0 0 0 4px rgba(31,111,235,.15)}
.ava{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;font-weight:700;font-size:22px;color:#fff}
.person small{display:block;color:var(--muted)}
.stars{display:flex;justify-content:center;gap:10px;margin:8px 0 6px}
.stars button{border:0;background:none;font-size:clamp(46px,7vw,64px);line-height:1;color:#d5dbe2;padding:0 2px;transition:transform .12s}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(.92)}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;max-width:420px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 16px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:11px 18px;font-size:16px}
.chip.on{border-color:var(--accent);background:#eaf2ff}
textarea,.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;background:#fff;resize:none}
textarea:focus,.inp:focus{outline:none;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two label{font-weight:600;display:block;margin-bottom:6px}
@media (max-width:700px){.two{grid-template-columns:1fr}.panel{padding:22px 18px}}
.agree{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px;margin-top:12px}
.agree input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.btn{border:0;border-radius:14px;padding:14px 24px;font-size:17px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:#eef1f5;color:var(--ink)}
.thanks{text-align:center}
.thanks .ok{width:84px;height:84px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:44px;margin:0 auto 16px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:20px}
/* админка */
.admin{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.admin h1{font-size:24px;margin:0 0 4px}
.admin .note{color:var(--muted);margin:0 0 16px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:26px}
.kpi span{color:var(--muted);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:13px}
.scroll{overflow-x:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .inp{width:auto;flex:1;min-width:180px;padding:10px 12px;font-size:15px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.sbtn.pr{background:var(--accent);border-color:var(--accent);color:#fff}
.sbtn.dn{color:var(--bad)}
.step{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fafbfc}
.step .row{margin-bottom:8px}
.tag{display:inline-block;background:#eef1f5;border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted)}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bgs button{height:90px;border-radius:12px;border:3px solid transparent;background-size:cover;background-position:center}
.bgs button.on{border-color:var(--accent)}
.pin{max-width:360px;margin:60px auto;text-align:center}
.pin .inp{text-align:center;font-size:24px;letter-spacing:8px}
.bar{height:8px;border-radius:8px;background:#eef1f5;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--star)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top">
  <div><b>Оценка работы менеджера</b> <span class="hint">· так клиент видит планшет, админка — во второй вкладке</span></div>
  <div class="seg"><button id="vK" class="on">Планшет</button><button id="vA">Админка</button></div>
</div>

<div id="kioskView" class="stage"><div class="tablet"><div class="screen"><div id="kiosk" class="kiosk"></div></div></div></div>
<div id="adminView" class="hide"></div>

<script>
"use strict";
const KEY = "ocenka-demo-v1";
const PIN = "1234";
const PRESETS = [
  "linear-gradient(135deg,#0f2a4a 0%,#1f6feb 55%,#7cc4ff 100%)",
  "linear-gradient(135deg,#1b3a2f 0%,#2f7d5b 50%,#c8e6c9 100%)",
  "linear-gradient(135deg,#3b1d3a 0%,#a23b72 50%,#f6c1a6 100%)",
  "linear-gradient(135deg,#1f1f24 0%,#4b5563 50%,#d1d5db 100%)"
];
const COLORS = ["#2563eb","#16a34a","#db2777","#ea580c","#7c3aed","#0891b2"];
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function seed() {
  const emps = [
    {id: "e1", name: "Анна", role: "менеджер по продажам"},
    {id: "e2", name: "Дмитрий", role: "менеджер по продажам"},
    {id: "e3", name: "Екатерина", role: "старший менеджер"},
    {id: "e4", name: "Сергей", role: "менеджер по продажам"}
  ];
  const survey = {
    id: "s1", name: "Оценка после встречи", steps: [
      {id: uid(), type: "employee", title: "Кто вас обслуживал?", required: true},
      {id: uid(), type: "rating", title: "Оцените работу менеджера", required: true},
      {id: uid(), type: "reasons", title: "Почему такая оценка?", required: false,
        good: ["Вежливо и внимательно", "Быстро ответил на вопросы", "Хорошо знает продукт", "Помог выбрать", "Не навязывал"],
        bad: ["Долго ждал", "Не смог ответить на вопросы", "Был невнимателен", "Навязывал лишнее", "Ошибся в цене или сроках"]},
      {id: uid(), type: "likes", title: "Что понравилось, а что нет?", required: false},
      {id: uid(), type: "phone", title: "Оставьте телефон, если с вами нужно связаться", required: false}
    ]
  };
  const short = {id: "s2", name: "Короткий опрос (2 экрана)", steps: [
    {id: uid(), type: "rating", title: "Как вам наше обслуживание?", required: true},
    {id: uid(), type: "phone", title: "Хотите, перезвоним?", required: false}
  ]};
  const now = Date.now(), sample = [];
  const plan = [["e1",5],["e3",5],["e2",4],["e1",5],["e4",3],["e3",4],["e2",5],["e4",2],["e1",4],["e3",5]];
  plan.forEach(([e, r], i) => sample.push({id: uid(), ts: now - (i + 1) * 5.3e6, surveyId: "s1", employeeId: e, rating: r,
    reasons: r >= 4 ? ["Вежливо и внимательно"] : ["Долго ждал"], liked: "", disliked: "", phone: "", demo: true}));
  return {brand: "Отдел продаж", welcome: "Как прошла встреча с менеджером?", activeSurveyId: "s1",
          surveys: [survey, short], employees: emps, bg: {kind: "preset", value: 0}, answers: sample};
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { S = seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert("Не хватило места в браузере: возьмите картинку поменьше"); } }
const empById = id => S.employees.find(e => e.id === id);
const color = id => COLORS[Math.abs([...String(id)].reduce((a, c) => a * 31 + c.charCodeAt(0), 7)) % COLORS.length];
const initials = n => (n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const active = () => S.surveys.find(s => s.id === S.activeSurveyId) || S.surveys[0];

/* ───────────── планшет ───────────── */
const K = document.getElementById("kiosk");
let pos = -1, cur = null, idle = null, back = null, shown = null;
function bgCss() { return S.bg.kind === "image" ? `url("${S.bg.value}")` : PRESETS[S.bg.value] || PRESETS[0]; }
function resetIdle() {
  clearTimeout(idle);
  if (pos >= 0) idle = setTimeout(() => startOver(), 60000);   // клиент ушёл посреди опроса — через минуту опрос сам закрывается
}
function startOver() { clearTimeout(back); pos = -1; cur = null; drawK(); }
function begin() { cur = {surveyId: active().id, employeeId: "", rating: 0, reasons: [], comment: "", liked: "", disliked: "", phone: "", agree: false}; pos = 0; drawK(); }
function stepOk(st) {
  if (!st.required) return true;
  if (st.type === "employee") return !!cur.employeeId;
  if (st.type === "rating") return cur.rating > 0;
  return true;
}
function drawK() {
  K.style.backgroundImage = bgCss();
  const anim = shown !== pos ? " anim" : ""; shown = pos;
  const sv = active(), n = sv.steps.length;
  const bar = `<div class="kbar"><span class="brand">${esc(S.brand)}</span>${pos >= 0 && pos < n ? `<span class="dots">${sv.steps.map((_, i) => `<i class="${i <= pos ? "on" : ""}"></i>`).join("")}</span>` : "<span></span>"}</div>`;
  if (pos < 0) {
    K.innerHTML = bar + `<div class="kbody"><div class="welcome${anim}"><h1>${esc(S.welcome)}</h1><p>Оценка займёт меньше минуты и поможет нам работать лучше</p><button class="big" id="go">Оценить</button><div class="tap">Можно не оставлять имя и телефон</div></div></div>`;
    K.querySelector("#go").onclick = begin;
    return;
  }
  if (pos >= n) {
    K.innerHTML = bar + `<div class="kbody"><div class="panel thanks${anim}"><div class="ok">✓</div><h2>Спасибо!</h2><p class="sub">Ваша оценка передана руководителю отдела продаж.</p><button class="btn ghost" id="again">Вернуться в начало <span id="cd">8</span></button></div></div>`;
    let t = 8; const cd = K.querySelector("#cd");
    const tick = () => { t--; if (t <= 0) return startOver(); cd.textContent = t; back = setTimeout(tick, 1000); };
    back = setTimeout(tick, 1000);
    K.querySelector("#again").onclick = startOver;
    return;
  }
  const st = sv.steps[pos];
  let inner = "";
  if (st.type === "employee") {
    inner = `<div class="people">${S.employees.map(e => `<button class="person ${cur.employeeId === e.id ? "on" : ""}" data-e="${e.id}"><div class="ava" style="background:${color(e.id)}">${esc(initials(e.name))}</div><b>${esc(e.name)}</b><small>${esc(e.role)}</small></button>`).join("")}</div>`;
  } else if (st.type === "rating") {
    const emp = empById(cur.employeeId);
    inner = `${emp ? `<p class="sub">Менеджер: <b>${esc(emp.name)}</b></p>` : ""}<div class="stars">${[1,2,3,4,5].map(i => `<button aria-label="${i}" data-r="${i}" class="${i <= cur.rating ? "on" : ""}">★</button>`).join("")}</div><div class="scale"><span>плохо</span><span>отлично</span></div>`;
  } else if (st.type === "reasons") {
    const list = cur.rating && cur.rating <= 3 ? (st.bad || []) : (st.good || []);
    inner = `<div class="chips">${list.map(x => `<button class="chip ${cur.reasons.includes(x) ? "on" : ""}" data-c="${esc(x)}">${esc(x)}</button>`).join("")}</div><textarea id="cm" rows="3" placeholder="Можно написать своими словами">${esc(cur.comment)}</textarea>`;
  } else if (st.type === "likes") {
    inner = `<div class="two"><div><label>Понравилось</label><textarea id="lk" rows="4" placeholder="Например: всё объяснили и не торопили">${esc(cur.liked)}</textarea></div><div><label>Не понравилось</label><textarea id="dl" rows="4" placeholder="Например: долго ждал договор">${esc(cur.disliked)}</textarea></div></div>`;
  } else if (st.type === "phone") {
    inner = `<input class="inp" id="ph" inputmode="tel" placeholder="+7 (___) ___-__-__" value="${esc(cur.phone)}"><label class="agree"><input type="checkbox" id="ag" ${cur.agree ? "checked" : ""}>Согласен на обработку телефона, чтобы со мной связались по этой оценке</label><div class="err" id="er"></div>`;
  } else if (st.type === "text") {
    inner = `<textarea id="tx" rows="4" placeholder="Ваш ответ">${esc(cur.comment)}</textarea>`;
  }
  const last = pos === n - 1;
  K.innerHTML = bar + `<div class="kbody"><div class="panel${anim}"><h2>${esc(st.title)}</h2>${st.type === "reasons" ? `<p class="sub">${cur.rating && cur.rating <= 3 ? "Что пошло не так?" : "Что понравилось больше всего?"} Можно выбрать несколько</p>` : st.type === "employee" ? `<p class="sub">Нажмите на фото менеджера</p>` : ""}${inner}<div class="nav"><button class="btn ghost" id="bk">${pos === 0 ? "Отмена" : "Назад"}</button><button class="btn" id="nx" ${stepOk(st) ? "" : "disabled"}>${last ? "Отправить" : (st.required ? "Далее" : "Далее")}</button></div></div></div>`;
  K.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { cur.employeeId = b.dataset.e; drawK(); });
  K.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { cur.rating = +b.dataset.r; cur.reasons = []; drawK(); });
  K.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { const v = b.dataset.c; cur.reasons = cur.reasons.includes(v) ? cur.reasons.filter(x => x !== v) : [...cur.reasons, v]; b.classList.toggle("on"); });
  const bind = (id, f) => { const el = K.querySelector(id); if (el) el.oninput = () => { cur[f] = el.value; resetIdle(); }; };
  bind("#cm", "comment"); bind("#lk", "liked"); bind("#dl", "disliked"); bind("#tx", "comment");
  const ph = K.querySelector("#ph");
  if (ph) ph.oninput = () => { ph.value = maskPhone(ph.value); cur.phone = ph.value; resetIdle(); };
  const ag = K.querySelector("#ag"); if (ag) ag.onchange = () => { cur.agree = ag.checked; K.querySelector("#er").textContent = ""; };
  K.querySelector("#bk").onclick = () => { if (pos === 0) startOver(); else { pos--; drawK(); } };
  K.querySelector("#nx").onclick = () => {
    if (st.type === "phone" && cur.phone.replace(/\D/g, "").length > 1) {
      const er = K.querySelector("#er");
      if (cur.phone.replace(/\D/g, "").length !== 11) { er.textContent = "Проверьте номер: нужно 10 цифр после +7"; return; }
      if (!cur.agree) { er.textContent = "Отметьте согласие — без него номер не сохраним"; return; }
    }
    if (last) finish(); else { pos++; drawK(); }
  };
  resetIdle();
}
function maskPhone(v) {
  let d = v.replace(/\D/g, "");
  if (!d) return "";
  if (d[0] === "8") d = "7" + d.slice(1);
  if (d[0] !== "7") d = "7" + d;
  d = d.slice(0, 11);
  const p = [d.slice(1, 4), d.slice(4, 7), d.slice(7, 9), d.slice(9, 11)];
  let s = "+7";
  if (p[0]) s += " (" + p[0] + (p[0].length === 3 ? ")" : "");
  if (p[1]) s += " " + p[1];
  if (p[2]) s += "-" + p[2];
  if (p[3]) s += "-" + p[3];
  return s;
}
function finish() {
  const a = {id: uid(), ts: Date.now(), surveyId: cur.surveyId, employeeId: cur.employeeId, rating: cur.rating, reasons: cur.reasons,
             comment: cur.comment, liked: cur.liked, disliked: cur.disliked, phone: cur.agree ? cur.phone : ""};
  S.answers.unshift(a); save();
  pos = active().steps.length; drawK();
}

/* ───────────── админка ───────────── */
const A = document.getElementById("adminView");
let tab = "otvety", authed = false, editId = null;
function drawA() {
  if (!authed) {
    A.innerHTML = `<div class="admin"><div class="pin box"><h1>Вход в админку</h1><p class="note">В рабочей версии — логин и пароль на каждого руководителя. Код для демо: ${PIN}</p><input class="inp" id="pin" inputmode="numeric" maxlength="4" autocomplete="off"><div class="err" id="pe"></div><button class="btn" id="pg" style="width:100%;margin-top:8px">Войти</button></div></div>`;
    const go = () => { if (A.querySelector("#pin").value === PIN) { authed = true; drawA(); } else A.querySelector("#pe").textContent = "Неверный код"; };
    A.querySelector("#pg").onclick = go; A.querySelector("#pin").onkeydown = e => { if (e.key === "Enter") go(); };   // не `&& go()`: false из обработчика гасит ввод цифр
    return;
  }
  const tabs = [["otvety", "Ответы"], ["oprosy", "Опросы"], ["lyudi", "Сотрудники"], ["vid", "Фон и тексты"]];
  A.innerHTML = `<div class="admin"><h1>Админка</h1><p class="note">Изменения сразу видны на планшете. В демо всё хранится в этом браузере; в рабочей версии опросы и фон приходят на планшеты с сервера, а ответы со всех планшетов собираются в одну базу.</p><div class="tabs">${tabs.map(([k, t]) => `<button data-t="${k}" class="${tab === k ? "on" : ""}">${t}</button>`).join("")}</div><div id="tb"></div></div>`;
  A.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; editId = null; drawA(); });
  ({otvety: tOtvety, oprosy: tOprosy, lyudi: tLyudi, vid: tVid})[tab](A.querySelector("#tb"));
}
function fmt(ts) { const d = new Date(ts); return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); }
function tOtvety(el) {
  const ans = S.answers, n = ans.length;
  const avg = n ? (ans.reduce((s, a) => s + (a.rating || 0), 0) / ans.filter(a => a.rating).length).toFixed(2) : "—";
  const low = ans.filter(a => a.rating && a.rating <= 3).length;
  const withPhone = ans.filter(a => a.phone).length;
  const per = S.employees.map(e => { const xs = ans.filter(a => a.employeeId === e.id && a.rating); return {e, n: xs.length, avg: xs.length ? xs.reduce((s, a) => s + a.rating, 0) / xs.length : 0}; });
  el.innerHTML = `<div class="kpis"><div class="kpi"><b>${n}</b><span>оценок всего</span></div><div class="kpi"><b>${avg}</b><span>средняя оценка из 5</span></div><div class="kpi"><b>${low}</b><span>оценок 3 и ниже</span></div><div class="kpi"><b>${withPhone}</b><span>просят перезвонить</span></div></div>
  <div class="box"><b>По менеджерам</b><table class="tbl" style="margin-top:8px"><tr><th>Менеджер</th><th>Оценок</th><th>Средняя</th><th style="width:40%"></th></tr>${per.map(p => `<tr><td>${esc(p.e.name)}</td><td>${p.n}</td><td>${p.n ? p.avg.toFixed(2) : "—"}</td><td><div class="bar"><i style="width:${p.avg / 5 * 100}%"></i></div></td></tr>`).join("")}</table></div>
  <div class="box"><div class="row" style="justify-content:space-between"><b>Все ответы</b><span class="row"><button class="sbtn pr" id="csv">Скачать для Excel</button><button class="sbtn dn" id="clr">Очистить</button></span></div>
  <div class="scroll"><table class="tbl" style="margin-top:8px"><tr><th>Когда</th><th>Опрос</th><th>Менеджер</th><th>Оценка</th><th>Почему</th><th>Понравилось</th><th>Не понравилось</th><th>Телефон</th></tr>${ans.slice(0, 200).map(a => `<tr><td>${fmt(a.ts)}${a.demo ? ' <span class="tag">пример</span>' : ""}</td><td>${esc((S.surveys.find(s => s.id === a.surveyId) || {}).name || "—")}</td><td>${esc((empById(a.employeeId) || {}).name || "—")}</td><td>${a.rating ? "★".repeat(a.rating) : "—"}</td><td>${esc([...(a.reasons || []), a.comment].filter(Boolean).join("; "))}</td><td>${esc(a.liked)}</td><td>${esc(a.disliked)}</td><td>${esc(a.phone)}</td></tr>`).join("") || `<tr><td colspan="8">Пока пусто — пройдите опрос на планшете</td></tr>`}</table></div></div>`;
  el.querySelector("#csv").onclick = () => {
    const rows = [["Дата", "Опрос", "Менеджер", "Оценка", "Почему", "Понравилось", "Не понравилось", "Телефон"]].concat(S.answers.map(a => [fmt(a.ts), (S.surveys.find(s => s.id === a.surveyId) || {}).name || "", (empById(a.employeeId) || {}).name || "", a.rating || "", [...(a.reasons || []), a.comment].filter(Boolean).join("; "), a.liked, a.disliked, a.phone]));
    const csv = "﻿" + rows.map(r => r.map(x => '"' + String(x ?? "").replace(/"/g, '""') + '"').join(";")).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
    const l = document.createElement("a"); l.href = url; l.download = "ocenki.csv"; l.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  el.querySelector("#clr").onclick = () => { if (confirm("Удалить все ответы?")) { S.answers = []; save(); drawA(); } };
}
const TYPES = {employee: "Выбор менеджера", rating: "Оценка звёздами", reasons: "Почему такая оценка (варианты)", likes: "Понравилось / не понравилось", text: "Свободный ответ", phone: "Телефон с согласием"};
function tOprosy(el) {
  if (editId) return editSurvey(el, S.surveys.find(s => s.id === editId));
  el.innerHTML = `<div class="box"><div class="row" style="justify-content:space-between"><b>Опросы</b><button class="sbtn pr" id="ns">+ Новый опрос</button></div><table class="tbl" style="margin-top:8px"><tr><th>Название</th><th>Экранов</th><th>На планшете</th><th></th></tr>${S.surveys.map(s => `<tr><td>${esc(s.name)}</td><td>${s.steps.length}</td><td>${s.id === S.activeSurveyId ? "<b>показывается</b>" : `<button class="sbtn" data-on="${s.id}">Показывать</button>`}</td><td class="row"><button class="sbtn" data-ed="${s.id}">Изменить</button><button class="sbtn" data-cp="${s.id}">Копия</button>${S.surveys.length > 1 ? `<button class="sbtn dn" data-rm="${s.id}">Удалить</button>` : ""}</td></tr>`).join("")}</table></div>`;
  el.querySelector("#ns").onclick = () => { const s = {id: uid(), name: "Новый опрос", steps: [{id: uid(), type: "rating", title: "Оцените работу менеджера", required: true}, {id: uid(), type: "phone", title: "Оставьте телефон, если с вами нужно связаться", required: false}]}; S.surveys.push(s); save(); editId = s.id; drawA(); };
  el.querySelectorAll("[data-on]").forEach(b => b.onclick = () => { S.activeSurveyId = b.dataset.on; save(); drawA(); startOver(); });
  el.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => { editId = b.dataset.ed; drawA(); });
  el.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => { const s = JSON.parse(JSON.stringify(S.surveys.find(x => x.id === b.dataset.cp))); s.id = uid(); s.name += " (копия)"; s.steps.forEach(x => x.id = uid()); S.surveys.push(s); save(); drawA(); });
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { if (!confirm("Удалить опрос? Ответы останутся.")) return; S.surveys = S.surveys.filter(s => s.id !== b.dataset.rm); if (!S.surveys.some(s => s.id === S.activeSurveyId)) S.activeSurveyId = S.surveys[0].id; save(); drawA(); startOver(); });
}
function editSurvey(el, s) {
  el.innerHTML = `<div class="box"><div class="row"><input class="inp" id="sn" value="${esc(s.name)}"><button class="sbtn" id="bk">← К списку</button></div><p class="note" style="margin:10px 0 0">От 2 до 5 экранов. Порядок меняется стрелками, тексты — прямо в полях.</p><div id="st"></div><div class="row" style="margin-top:8px"><select class="inp" id="nt">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><button class="sbtn pr" id="ad" ${s.steps.length >= 5 ? "disabled" : ""}>+ Добавить экран</button></div></div>`;
  const box = el.querySelector("#st");
  box.innerHTML = s.steps.map((st, i) => `<div class="step"><div class="row"><span class="tag">${i + 1}. ${TYPES[st.type]}</span><span style="flex:1"></span><button class="sbtn" data-up="${i}" ${i ? "" : "disabled"}>↑</button><button class="sbtn" data-dn="${i}" ${i < s.steps.length - 1 ? "" : "disabled"}>↓</button><button class="sbtn dn" data-x="${i}" ${s.steps.length > 2 ? "" : "disabled"}>Убрать</button></div><div class="row"><input class="inp" data-ti="${i}" value="${esc(st.title)}"><label class="row" style="gap:6px;font-size:14px"><input type="checkbox" data-rq="${i}" ${st.required ? "checked" : ""}>обязательный</label></div>${st.type === "reasons" ? `<div class="row"><input class="inp" data-gd="${i}" value="${esc((st.good || []).join("; "))}" title="Варианты при оценке 4–5, через точку с запятой"><input class="inp" data-bd="${i}" value="${esc((st.bad || []).join("; "))}" title="Варианты при оценке 1–3, через точку с запятой"></div><div class="note" style="font-size:13px">Слева — варианты при оценке 4–5, справа — при 1–3, через «;»</div>` : ""}</div>`).join("");
  const sync = () => { save(); if (s.id === S.activeSurveyId) startOver(); };
  el.querySelector("#sn").oninput = e => { s.name = e.target.value; save(); };
  el.querySelector("#bk").onclick = () => { editId = null; drawA(); };
  box.querySelectorAll("[data-ti]").forEach(x => x.oninput = () => { s.steps[+x.dataset.ti].title = x.value; sync(); });
  box.querySelectorAll("[data-rq]").forEach(x => x.onchange = () => { s.steps[+x.dataset.rq].required = x.checked; sync(); });
  box.querySelectorAll("[data-gd]").forEach(x => x.onchange = () => { s.steps[+x.dataset.gd].good = x.value.split(";").map(v => v.trim()).filter(Boolean); sync(); });
  box.querySelectorAll("[data-bd]").forEach(x => x.onchange = () => { s.steps[+x.dataset.bd].bad = x.value.split(";").map(v => v.trim()).filter(Boolean); sync(); });
  const move = (i, d) => { const t = s.steps[i]; s.steps[i] = s.steps[i + d]; s.steps[i + d] = t; sync(); drawA(); };
  box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, -1));
  box.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => move(+b.dataset.dn, 1));
  box.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { s.steps.splice(+b.dataset.x, 1); sync(); drawA(); });
  el.querySelector("#ad").onclick = () => {
    if (s.steps.length >= 5) return;
    const t = el.querySelector("#nt").value;
    const st = {id: uid(), type: t, title: {employee: "Кто вас обслуживал?", rating: "Оцените работу менеджера", reasons: "Почему такая оценка?", likes: "Что понравилось, а что нет?", text: "Что нам улучшить?", phone: "Оставьте телефон, если с вами нужно связаться"}[t], required: t === "rating"};
    if (t === "reasons") { st.good = ["Вежливо и внимательно", "Быстро ответил на вопросы"]; st.bad = ["Долго ждал", "Не смог ответить на вопросы"]; }
    s.steps.push(st); sync(); drawA();
  };
}
function tLyudi(el) {
  el.innerHTML = `<div class="box"><b>Сотрудники на экране выбора</b><table class="tbl" style="margin-top:8px"><tr><th></th><th>Имя</th><th>Должность</th><th></th></tr>${S.employees.map(e => `<tr><td><div class="ava" style="width:36px;height:36px;font-size:14px;margin:0;background:${color(e.id)}">${esc(initials(e.name))}</div></td><td><input class="inp" style="padding:8px 10px;font-size:15px" data-nm="${e.id}" value="${esc(e.name)}"></td><td><input class="inp" style="padding:8px 10px;font-size:15px" data-rl="${e.id}" value="${esc(e.role)}"></td><td><button class="sbtn dn" data-x="${e.id}">Убрать</button></td></tr>`).join("")}</table><div class="row" style="margin-top:12px"><input class="inp" id="nn" placeholder="Имя нового сотрудника"><button class="sbtn pr" id="na">Добавить</button></div><p class="note" style="margin-top:10px">В рабочей версии — ещё фото сотрудника и разные списки для разных офисов.</p></div>`;
  el.querySelectorAll("[data-nm]").forEach(x => x.oninput = () => { empById(x.dataset.nm).name = x.value; save(); startOver(); });
  el.querySelectorAll("[data-rl]").forEach(x => x.oninput = () => { empById(x.dataset.rl).role = x.value; save(); startOver(); });
  el.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { S.employees = S.employees.filter(e => e.id !== b.dataset.x); save(); drawA(); startOver(); });
  el.querySelector("#na").onclick = () => { const v = el.querySelector("#nn").value.trim(); if (!v) return; S.employees.push({id: uid(), name: v, role: "менеджер по продажам"}); save(); drawA(); startOver(); };
}
function tVid(el) {
  el.innerHTML = `<div class="box"><b>Фоновая заставка</b><div class="bgs" style="margin-top:10px">${PRESETS.map((p, i) => `<button data-p="${i}" style="background-image:${p}" class="${S.bg.kind === "preset" && S.bg.value === i ? "on" : ""}" aria-label="Фон ${i + 1}"></button>`).join("")}${S.bg.kind === "image" ? `<button class="on" style="background-image:url('${S.bg.value}')" aria-label="Своя картинка"></button>` : ""}</div><div class="row" style="margin-top:12px"><label class="sbtn pr">Загрузить свою картинку<input type="file" id="up" accept="image/*" hidden></label><span class="note" style="margin:0">JPG или PNG, лучше горизонтальную</span></div></div>
  <div class="box"><b>Тексты</b><div class="row" style="margin-top:10px"><input class="inp" id="br" value="${esc(S.brand)}" title="Подпись в углу"><input class="inp" id="wl" value="${esc(S.welcome)}" title="Заголовок заставки"></div></div>
  <div class="box"><button class="sbtn dn" id="rs">Вернуть демо как было</button></div>`;
  el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { S.bg = {kind: "preset", value: +b.dataset.p}; save(); drawA(); startOver(); });
  el.querySelector("#up").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), rd = new FileReader();
    rd.onload = () => { img.onload = () => { const c = document.createElement("canvas"), k = Math.min(1, 1600 / img.width); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); S.bg = {kind: "image", value: c.toDataURL("image/jpeg", .82)}; save(); drawA(); startOver(); }; img.src = rd.result; };
    rd.readAsDataURL(f);
  };
  el.querySelector("#br").oninput = e => { S.brand = e.target.value; save(); startOver(); };
  el.querySelector("#wl").oninput = e => { S.welcome = e.target.value; save(); startOver(); };
  el.querySelector("#rs").onclick = () => { if (confirm("Сбросить все изменения демо?")) { S = seed(); save(); drawA(); startOver(); } };
}

/* переключение */
const vK = document.getElementById("vK"), vA = document.getElementById("vA");
function show(a) {
  document.getElementById("kioskView").classList.toggle("hide", a);
  A.classList.toggle("hide", !a);
  vK.classList.toggle("on", !a); vA.classList.toggle("on", a);
  if (a) drawA(); else drawK();
  try { history.replaceState(null, "", a ? "#admin" : "#"); } catch (e) {}
}
vK.onclick = () => show(false); vA.onclick = () => show(true);
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, resetIdle, {passive: true}));
show(location.hash === "#admin");
</script>
</body>
</html>
