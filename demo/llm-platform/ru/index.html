<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — One Unified System for LLMs</title>
<!-- Один файл вместо React + Vite + Tailwind + lucide-react. ?lang=ru — русская версия (у Helvetica Neue Light нет кириллицы, по-русски — Inter 300).
     Вместо «$1MM in credits» и строки «Backed by» с выдуманными инвесторами — нейтральная плашка и то, что внутри системы, теми же пятью шрифтами:
     под логотипом g.a.d. чужие деньги и инвесторы читались бы как наши. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Oswald:wght@500&family=Montserrat:wght@700&family=Roboto+Slab:wght@600&family=Raleway:wght@700&family=Inter:wght@300&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
:root{--dark:#2d3a2e;--green:#3d5a3e;--light:#f5f3ef;--cream:#faf8f5;
  --hn:'Helvetica Neue Light',Helvetica,Arial,sans-serif}
.ru{--hn:'Inter',Helvetica,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--hn);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--cream);color:var(--dark)}
.ru body{font-weight:300}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

@keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-down{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-up{animation:fade-up .8s cubic-bezier(.16,1,.3,1) both}
.animate-fade-down{animation:fade-down .7s cubic-bezier(.16,1,.3,1) both}
.stagger-1{animation-delay:0ms}.stagger-2{animation-delay:120ms}.stagger-3{animation-delay:240ms}
.stagger-4{animation-delay:360ms}.stagger-5{animation-delay:480ms}.stagger-6{animation-delay:600ms}

/* навбар */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:all .3s;background:transparent}
.nav.scrolled{background:rgba(250,248,245,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 1px 2px 0 rgba(0,0,0,.05)}
.wrap{max-width:80rem;margin:0 auto;padding:0 24px}
.bar{position:relative;display:flex;align-items:center;height:64px}
.left{display:none;align-items:center;gap:32px}
.left a,.left button{font-size:14px;line-height:20px;letter-spacing:.025em;text-transform:uppercase;color:var(--dark);transition:opacity .15s}
.left a:hover,.left button:hover{opacity:.7}
.left button{display:flex;align-items:center;gap:4px}
.left svg{width:14px;height:14px}
.logo{position:absolute;left:50%;translate:-50% 0;display:flex;align-items:center;color:var(--dark)}
.gad svg{display:block;height:24px;width:auto;overflow:visible}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .6s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.6s forwards,gad-orbit 7s linear 1.6s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.cta{display:none;align-items:center;margin-left:auto;padding:10px 20px;background:var(--dark);color:#fff;font-size:14px;line-height:20px;letter-spacing:.025em;text-transform:uppercase;border-radius:9999px;transition:background-color .15s}
.cta:hover{background:var(--green)}
.burger{position:relative;z-index:50;margin-left:auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.burger i{position:relative;display:block;width:24px;height:20px}
.burger b{position:absolute;left:0;width:24px;height:2px;border-radius:4px;background:var(--dark);transition:all .3s cubic-bezier(.68,-.6,.32,1.6)}
.burger b:nth-child(1){top:6px}
.burger b:nth-child(2){top:13px}
.burger.open b:nth-child(1){transform:translateY(5px) rotate(45deg)}
.burger.open b:nth-child(2){transform:rotate(-45deg)}

/* меню телефона */
.overlay{position:fixed;inset:0;z-index:40;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .5s cubic-bezier(.22,1,.36,1)}
.overlay.open{opacity:1;pointer-events:auto}
.overlay .col{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:32px;
  opacity:0;transform:translateY(-32px);transition:opacity .5s cubic-bezier(.22,1,.36,1) .1s,transform .5s cubic-bezier(.22,1,.36,1) .1s}
.overlay.open .col{opacity:1;transform:none}
.overlay .col a{font-size:30px;line-height:36px;letter-spacing:-.025em;color:var(--dark)}
.overlay .col .go{margin-top:16px;display:inline-flex;align-items:center;padding:14px 32px;background:var(--dark);color:#fff;font-size:18px;line-height:28px;letter-spacing:.025em;border-radius:9999px}

/* герой */
.hero{position:relative;width:100%;height:100vh;min-height:700px;overflow:hidden;background:var(--cream)}
.vid{position:absolute;inset:0}
.vid video{display:block;width:100%;height:100%;object-fit:cover;object-position:bottom}
.content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:flex-start;max-width:80rem;margin:0 auto;padding:112px 24px 0}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;border:1px solid rgba(45,58,46,.15);background:rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:background-color .15s;margin-bottom:20px}
.pill:hover{background:rgba(255,255,255,.8)}
.pill span{font-size:14px;line-height:20px;color:var(--dark)}
.pill svg{width:14px;height:14px;color:var(--dark);flex:none}
h1{text-align:left;font-family:var(--hn);font-weight:inherit;font-size:30px;line-height:1.05;letter-spacing:-.025em;color:var(--dark);max-width:56rem}
h1 br{display:none}
.backed{width:100%;margin-top:32px}
.backed p{text-align:left;font-size:12px;line-height:16px;letter-spacing:.25em;text-transform:uppercase;color:rgba(45,58,46,.5);margin-bottom:24px}
.marks{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:24px}
.marks span{font-size:18px;line-height:28px;color:rgba(45,58,46,.8);white-space:nowrap;
  text-shadow:0 0 14px rgba(250,248,245,.95),0 0 5px rgba(250,248,245,.9)}   /* строка ложится на деревья ролика — светлый ореол держит читаемость */
.f-playfair{font-family:'Playfair Display',serif;font-weight:700}
.f-oswald{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase}
.f-montserrat{font-family:'Montserrat',sans-serif;font-weight:700}
.f-slab{font-family:'Roboto Slab',serif;font-weight:600;text-transform:uppercase}
.f-raleway{font-family:'Raleway',sans-serif;font-weight:700}

@media (min-width:640px){h1{font-size:36px}h1 br{display:block}}
@media (min-width:768px){
  .bar{height:80px}
  .left{display:flex}
  .cta{display:inline-flex}
  .burger,.overlay{display:none}
  .content{padding-top:144px}
  .pill{margin-bottom:24px}
  h1{font-size:48px}
  .backed{margin-top:40px}
  .backed p{margin-bottom:32px}
  .marks{gap:48px}
  .marks span{font-size:20px}
}
@media (min-width:1024px){
  .wrap{padding:0 32px}
  .content{padding-left:32px;padding-right:32px}
  h1{font-size:60px}
  .marks{gap:64px}
  .marks span{font-size:24px;line-height:32px}
}
@media (prefers-reduced-motion:reduce){.gad .ring{animation:none;stroke-dashoffset:0}.gad .orb{animation:none;opacity:1}}
</style>
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/0e6de1ec911a2e267ff136bbdd384a44?family=Helvetica+Neue+Light">
</head>
<body>
<header class="nav" id="nav">
  <div class="wrap">
    <div class="bar">
      <div class="left animate-fade-down stagger-1">
        <button type="button"><span data-t="sol">Solutions</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <a href="#" data-t="plans">Plans</a>
        <a href="#" data-t="news">News</a>
      </div>
      <a class="logo gad animate-fade-down stagger-2" href="#" aria-label="g.a.d.">
        <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
          <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
          <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
          <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
        </svg>
      </a>
      <a class="cta animate-fade-down stagger-3" href="#" data-t="try">Try It Free</a>
      <button class="burger" id="burger" type="button" aria-label="Toggle menu" aria-expanded="false"><i><b></b><b></b></i></button>
    </div>
  </div>
</header>

<div class="overlay" id="overlay">
  <div class="col">
    <a href="#" data-t="sol">Solutions</a>
    <a href="#" data-t="plans">Plans</a>
    <a href="#" data-t="news">News</a>
    <a class="go" href="#" data-t="try">Try It Free</a>
  </div>
</div>

<section class="hero">
  <div class="vid">
    <video autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260820_010308_b1636845-4c15-4ab6-b0c9-9a29bfb0c6e3.mp4"></video>
  </div>
  <div class="content">
    <a class="pill animate-fade-up stagger-3" href="#">
      <span data-t="pill">Live for everyone today! See what's inside.</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
    <h1 class="animate-fade-up stagger-4" data-t="h1">One unified system to build,<br> test, ship, and observe LLMs</h1>
    <div class="backed animate-fade-up stagger-5">
      <p data-t="inside">What's inside</p>
      <div class="marks animate-fade-up stagger-6">
        <span class="f-playfair" data-t="m1">Prompts</span>
        <span class="f-oswald" data-t="m2">Evals</span>
        <span class="f-montserrat" data-t="m3">Agents</span>
        <span class="f-slab" data-t="m4">Traces</span>
        <span class="f-raleway" data-t="m5">Datasets</span>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
const $ = id => document.getElementById(id);
if (true) {
  const TR = { sol: 'Решения', plans: 'Тарифы', news: 'Новости', try: 'Попробовать бесплатно',
    pill: 'Уже открыто для всех. Загляните внутрь', h1: 'Одна система, чтобы собирать,<br> тестировать и выпускать LLM',
    inside: 'Что внутри', m1: 'Промпты', m2: 'Тесты', m3: 'Агенты', m4: 'Логи', m5: 'Датасеты' };
  document.documentElement.lang = 'ru';
  document.documentElement.classList.add('ru');
  document.title = 'g.a.d. — одна система для LLM';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.innerHTML = t; });
}

const nav = $('nav');
const onScroll = () => nav.classList.toggle('scrolled', scrollY > 20);
addEventListener('scroll', onScroll, { passive: true }); onScroll();

const burger = $('burger'), overlay = $('overlay');
const setMenu = open => {
  burger.classList.toggle('open', open); overlay.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', open);
  document.body.style.overflow = open ? 'hidden' : '';
};
burger.addEventListener('click', () => setMenu(!overlay.classList.contains('open')));
overlay.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setMenu(false)));
})();
</script>
