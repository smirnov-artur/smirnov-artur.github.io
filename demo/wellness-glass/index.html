<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — natural wellness</title>
<!-- Один файл вместо React + Tailwind + lucide-react. ?lang=ru — русская версия.
     Картинок для аватаров в бейдже в задании нет — в стеклянных кружках значки (лист, солнце, капля, сердце).
     Значения и подписи статистики в задании не даны: вместо цифр про клиентов — возможности («100 %», «24/7»). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid #e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:#b9b4e6;color:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:transparent;cursor:pointer;line-height:inherit}
a{color:inherit;text-decoration:inherit}
svg,video{display:block}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:none;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

/* логотип g.a.d. */
.gad{display:block;color:#fff}
.gad svg{display:block;height:30px;width:auto;overflow:visible}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}

.hero{position:relative;height:100vh;width:100%;overflow:hidden;display:flex;flex-direction:column}
.hero>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.px{padding-left:20px;padding-right:20px}
.nav{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding-top:24px}
.links{display:none;align-items:center;gap:4px;border-radius:9999px;padding:6px}
.links a{border-radius:9999px;padding:8px 18px;font-size:14px;line-height:20px;font-weight:500;color:rgba(255,255,255,.9);transition:background-color .2s,color .2s}
.links a:hover{background:rgba(255,255,255,.12);color:#fff}
.acc{display:none;width:44px;height:44px;border-radius:9999px;align-items:center;justify-content:center;color:#fff}
.acc svg{width:22px;height:22px;stroke-width:1.75}
.burger{width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center}
.burger span{position:absolute;left:14px;width:16px;height:1.5px;border-radius:2px;background:#fff;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .2s}
.burger span:nth-child(1){top:17px}.burger span:nth-child(2){top:21.25px}.burger span:nth-child(3){top:25.5px}
.open .burger span:nth-child(1){transform:translateY(4.25px) rotate(45deg)}
.open .burger span:nth-child(2){opacity:0}
.open .burger span:nth-child(3){transform:translateY(-4.25px) rotate(-45deg)}

.mm{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  opacity:0;pointer-events:none;transition:opacity .5s cubic-bezier(0,0,.2,1)}
.open .mm{opacity:1;pointer-events:auto}
.mm-in{display:flex;flex-direction:column;align-items:center;gap:28px;transform:translateY(-32px);transition:transform .5s cubic-bezier(0,0,.2,1)}
.open .mm-in{transform:translateY(0)}
.mm-in a{font-size:28px;line-height:1.2;font-weight:300;letter-spacing:-.02em;color:rgba(255,255,255,.9)}
.mm-in .acc{display:flex;margin-top:12px;width:52px;height:52px}

.main{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-top:44px;padding-bottom:32px;transition:opacity .5s cubic-bezier(0,0,.2,1)}
.open .main{opacity:0}
.top{display:flex;flex-direction:column;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:10px;border-radius:9999px;padding:4px 16px 4px 4px;font-size:13px;line-height:18px;font-weight:500;color:rgba(255,255,255,.92)}
.faces{display:flex}
.faces span{width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;background-color:rgba(255,255,255,.08)}
.faces span+span{margin-left:-8px}
.faces svg{width:14px;height:14px}
h1{margin-top:24px;font-size:46px;line-height:.95;font-weight:500;letter-spacing:-.045em;text-shadow:0 2px 28px rgba(70,50,160,.22)}
h1 em{display:block;font-style:normal;font-weight:300}
.sub{margin-top:20px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.85);text-shadow:0 1px 16px rgba(70,50,160,.25)}
.cta{margin-top:28px;display:inline-flex;align-items:center;border-radius:9999px;padding:14px 28px;font-size:15px;line-height:20px;font-weight:500;color:#fff;transition:background-color .2s}
.cta:hover{background-color:rgba(255,255,255,.12)}
.stats{display:flex;gap:40px;text-shadow:0 1px 14px rgba(60,40,150,.3)}
.links a,.badge{text-shadow:0 1px 12px rgba(60,40,150,.3)}
.st svg{width:28px;height:28px;color:rgba(255,255,255,.85)}
.st b{display:block;margin-top:14px;font-size:34px;line-height:1;font-weight:500;letter-spacing:-.03em}
.st span{display:block;margin-top:6px;font-size:13px;line-height:18px;color:rgba(255,255,255,.75);max-width:11rem}

@media (min-width:640px){
  .px{padding-left:32px;padding-right:32px}
  .nav{padding-top:32px}
  h1{font-size:60px}
  .sub{font-size:17px}
}
@media (min-width:768px){
  .px{padding-left:64px;padding-right:64px}
  .gad svg{height:34px}
  .links,.nav>.acc{display:flex}
  .burger,.mm{display:none}
  .open .main{opacity:1}
  .main{padding-top:64px;padding-bottom:48px}
  h1{font-size:76px}
  .sub{font-size:18px}
  .stats{gap:64px}
  .st b{font-size:40px}
  .st span{font-size:14px}
}
@media (min-width:1024px){
  .px{padding-left:80px;padding-right:80px}
  h1{font-size:92px}
}
@media (prefers-reduced-motion:reduce){.gad .ring{animation:none;stroke-dashoffset:0}.gad .orb{animation:none;opacity:1}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260715_082433_69699cf8-444b-4484-93cc-053e57896dfd.mp4" autoplay loop muted playsinline></video>

  <nav class="nav px">
    <a class="gad" href="#" aria-label="g.a.d.">
      <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
        <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
        <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
      </svg>
    </a>
    <div class="links liquid-glass">
      <a href="#" data-t="n1">Home</a>
      <a href="#" data-t="n2">Our Approach</a>
      <a href="#" data-t="n3">Healing Methods</a>
    </div>
    <a class="acc liquid-glass" href="#" aria-label="Account"><svg class="i" viewBox="0 0 24 24"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg></a>
    <button class="burger liquid-glass" id="burger" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <div class="mm" id="mm">
    <div class="mm-in">
      <a href="#" data-t="n1">Home</a>
      <a href="#" data-t="n2">Our Approach</a>
      <a href="#" data-t="n3">Healing Methods</a>
      <a class="acc liquid-glass" href="#" aria-label="Account"><svg class="i" viewBox="0 0 24 24"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg></a>
    </div>
  </div>

  <div class="main px">
    <div class="top">
      <div class="badge liquid-glass">
        <div class="faces">
          <span class="liquid-glass"><svg class="i" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
          <span class="liquid-glass"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
          <span class="liquid-glass"><svg class="i" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span>
          <span class="liquid-glass"><svg class="i" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span>
        </div>
        <span data-t="badge">our path to natural wellness</span>
      </div>
      <h1><span data-t="h1a">Heal Your Body</span><em data-t="h1b">Naturally</em></h1>
      <p class="sub" data-t="sub">Holistic wellness. Transformative results.</p>
      <a class="cta liquid-glass" href="#" data-t="cta">Begin Your Journey</a>
    </div>
    <div class="stats">
      <div class="st">
        <svg viewBox="0 0 28 28" fill="currentColor" aria-hidden="true"><circle cx="14" cy="4" r="2"/><circle cx="9" cy="11" r="2"/><circle cx="19" cy="11" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="14" cy="18" r="2"/><circle cx="24" cy="18" r="2"/><circle cx="9" cy="25" r="2" opacity=".5"/><circle cx="19" cy="25" r="2" opacity=".5"/></svg>
        <b>100%</b><span data-t="s1">Natural, plant-based methods</span>
      </div>
      <div class="st">
        <svg viewBox="0 0 28 28" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1"/><rect x="19" y="1" width="8" height="8" rx="1"/><rect x="10" y="10" width="8" height="8" rx="1"/><rect x="1" y="19" width="8" height="8" rx="1"/><rect x="19" y="19" width="8" height="8" rx="1"/><rect x="10" y="1" width="8" height="8" rx="1" opacity=".3"/><rect x="1" y="10" width="8" height="8" rx="1" opacity=".3"/><rect x="19" y="10" width="8" height="8" rx="1" opacity=".3"/><rect x="10" y="19" width="8" height="8" rx="1" opacity=".3"/></svg>
        <b>24/7</b><span data-t="s2">Guidance whenever you need it</span>
      </div>
    </div>
  </div>
</section>
<script>
(() => {
if (new URLSearchParams(location.search).get('lang') === 'ru') {
  const TR = { n1: 'Главная', n2: 'Наш подход', n3: 'Методы', badge: 'наш путь к естественному здоровью',
    h1a: 'Исцелите тело', h1b: 'естественно', sub: 'Целостный подход. Ощутимый результат.', cta: 'Начать путь',
    s1: 'Природные, растительные методы', s2: 'Поддержка, когда она нужна' };
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — естественное здоровье';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.textContent = t; });
}
const hero = document.getElementById('hero');
const set = open => { hero.classList.toggle('open', open); document.body.style.overflow = open ? 'hidden' : ''; };
document.getElementById('burger').addEventListener('click', () => set(!hero.classList.contains('open')));
document.querySelectorAll('.mm a').forEach(a => a.addEventListener('click', () => set(false)));
})();
</script>
</body>
</html>
