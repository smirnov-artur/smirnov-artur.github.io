        function App() {
            const v1 = useRef(null), v2 = useRef(null), stageRef = useRef(null);
            const [ready, setReady] = useState(false);

            useEffect(() => {
                let done = false;
                const finish = () => { if (!done) { done = true; setReady(true); } };
                const timer = setTimeout(finish, 5000);
                const waitVideo = (el) => new Promise((res) => {
                    if (!el) return res();
                    if (el.readyState >= 2) return res();
                    el.addEventListener('loadeddata', res, { once: true });
                });
                Promise.all([
                    waitVideo(v1.current),
                    waitVideo(v2.current),
                    (document.fonts && document.fonts.ready) || Promise.resolve(),
                ]).then(() => { clearTimeout(timer); finish(); });
                return () => clearTimeout(timer);
            }, []);

            useLayoutEffect(() => {
                const fit = () => {
                    const el = stageRef.current;
                    if (!el) return;
                    const w = el.offsetWidth, h = el.offsetHeight;
                    const pad = 40;
                    const fitRatio = Math.min((window.innerWidth - pad * 2) / w, (window.innerHeight - pad * 2) / h);
                    el.style.transform = `scale(${Math.min(1, fitRatio) * 0.95})`;
                };
                fit();
                window.addEventListener('resize', fit);
                return () => window.removeEventListener('resize', fit);
            }, []);

            return (
                <div className={ready ? 'ze-ready' : ''} style={{ width:'100vw', height:'100vh', overflow:'hidden', display:'flex', alignItems:'center', justifyContent:'center', background:'#F4F4F4' }}>
                    <div ref={stageRef} style={{ display:'flex', gap:70 }}>
                        <Screen1 videoRef={v1} />
                        <Screen2 videoRef={v2} />
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
