<body class="bg-white antialiased font-inter">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const AVATAR = "https://images.pexels.com/photos/1239291/pexels-photo-1239291.jpeg?auto=compress&cs=tinysrgb&w=100";

        const StatusBar = ({ dark }) => {
            const c = dark ? '#404040' : '#ffffff';
            return (
                <div className="absolute top-0 inset-x-0 z-50 flex items-center justify-between px-8 pt-4 text-[15px] font-semibold" style={{ color: c }}>
                    <span>9:41</span>
                    <div className="flex items-center gap-1.5">
                        <svg width="18" height="12" viewBox="0 0 18 12">
                            <rect x="0" y="7" width="3" height="5" rx="0.8" fill={c} />
                            <rect x="5" y="5" width="3" height="7" rx="0.8" fill={c} />
                            <rect x="10" y="3" width="3" height="9" rx="0.8" fill={c} />
                            <rect x="15" y="0" width="3" height="12" rx="0.8" fill={c} />
                        </svg>
                        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
                            <path d="M2 4.7a8.5 8.5 0 0112 0" stroke={c} strokeWidth="1.4" strokeLinecap="round" />
                            <path d="M4.6 7.5a4.8 4.8 0 016.8 0" stroke={c} strokeWidth="1.4" strokeLinecap="round" />
                            <circle cx="8" cy="10.3" r="1.1" fill={c} />
                        </svg>
                        <svg width="25" height="12" viewBox="0 0 25 12">
                            <rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke={c} strokeOpacity="0.4" />
                            <rect x="2" y="2" width="18" height="8" rx="2" fill={c} />
                            <rect x="22.5" y="4" width="1.5" height="4" rx="0.8" fill={c} fillOpacity="0.4" />
                        </svg>
                    </div>
                </div>
            );
        };

        const Phone = ({ video, overlay, dark, children }) => (
            <div className="relative w-[290px] h-[700px] md:w-[390px] md:h-[800px] rounded-[45px] md:rounded-[60px] bg-black shadow-2xl border-[9px] md:border-[12px] border-neutral-900 overflow-hidden flex-shrink-0">
                <video src={video} className="absolute inset-0 w-full h-full object-cover" autoPlay muted loop playsInline />
                <div className={`absolute inset-0 ${overlay}`}></div>
                <div className="absolute top-3 left-1/2 -translate-x-1/2 w-[126px] h-[34px] bg-black rounded-full z-50"></div>
                <StatusBar dark={dark} />
                <div className="relative h-full flex flex-col px-6 pt-16 pb-2">
                    {children}
                </div>
            </div>
        );

        const HomeIndicator = () => (
            <div className="pb-2 flex justify-center">
                <div className="w-32 h-1 bg-white rounded-full"></div>
            </div>
        );

        const Screen1 = () => (
            <React.Fragment>
                <div className="mb-5 flex items-center justify-between">
                    <div className="stagger-item stagger-delay-1 bg-white/20 backdrop-blur-xl rounded-full pl-0.5 py-0.5 pr-4 flex items-center gap-2">
                        <img src={AVATAR} alt="Lena Voss" className="w-9 h-9 rounded-full object-cover" />
                        <span className="text-white text-sm font-medium">Lena Voss</span>
                    </div>
                    <button className="stagger-item stagger-delay-1 w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center">
                        <i data-lucide="search" className="w-[18px] h-[18px] text-white"></i>
                    </button>
                </div>

                <div className="stagger-item stagger-delay-2 mb-1">
                    <p className="text-white/70 text-sm font-medium mb-1">Утренний ритуал</p>
                    <h1 className="text-white text-[38px] leading-[1.1] font-normal tracking-[-0.03em]">Какой твой<br />внутренний<br />мир?</h1>
                </div>

                <div className="mt-4 mb-4 flex items-center justify-between">
                    <h2 className="stagger-item stagger-delay-3 text-white text-lg font-semibold">Уровень<br />покоя</h2>
                    <div className="stagger-item stagger-delay-3 bg-white/20 backdrop-blur-md rounded-full p-1 flex items-center">
                        <button className="px-4 py-1.5 bg-white rounded-full text-sm font-medium text-neutral-800">Сегодня</button>
                        <button className="px-4 py-1.5 text-sm font-medium text-white/80">Неделя</button>
                    </div>
                </div>

                <div className="stagger-item stagger-delay-4 bg-white/20 backdrop-blur-xl rounded-3xl p-5 mb-3 border border-white/20">
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-white font-medium text-base">Поймай настроение</span>
                        <button className="w-7 h-7 rounded-full bg-white/30 flex items-center justify-center">
                            <i data-lucide="info" className="w-3.5 h-3.5 text-white"></i>
                        </button>
                    </div>
                    <div className="flex items-end justify-between">
                        <p className="text-white/60 text-sm italic leading-snug max-w-[200px]">Расскажи, что сейчас<br />у тебя на душе</p>
                        <button className="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center shrink-0">
                            <i data-lucide="plus" className="w-5 h-5 text-neutral-700"></i>
                        </button>
                    </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                    <div className="stagger-item stagger-delay-5 bg-white/20 backdrop-blur-xl rounded-3xl p-5 border border-white/20 flex flex-col justify-between aspect-square">
                        <span className="text-white font-medium text-base leading-snug">Вспомни<br />свой день</span>
                        <button className="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center self-end">
                            <i data-lucide="plus" className="w-5 h-5 text-neutral-700"></i>
                        </button>
                    </div>
                    <div className="stagger-item stagger-delay-5 bg-white/20 backdrop-blur-xl rounded-3xl p-5 border border-white/20 flex flex-col justify-between aspect-square">
                        <span className="text-white font-medium text-base leading-snug">Твои<br />паттерны</span>
                        <button className="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center self-end">
                            <i data-lucide="arrow-right" className="w-5 h-5 text-neutral-700"></i>
                        </button>
                    </div>
                </div>

                <div className="flex-1"></div>

                <div className="stagger-item stagger-delay-6 py-3 flex items-center justify-around">
                    <div className="flex flex-col items-center gap-1">
                        <i data-lucide="home" className="w-6 h-6 text-white"></i>
                        <div className="w-1 h-1 rounded-full bg-white"></div>
                    </div>
                    <i data-lucide="clock" className="w-6 h-6 text-white/50"></i>
                    <i data-lucide="layout-grid" className="w-6 h-6 text-white/50"></i>
                </div>

                <HomeIndicator />
            </React.Fragment>
        );

        const INSIGHTS = [
            { icon: 'sun', label: 'Утреннее солнце', pct: '+28%', color: '#CBD89E', desc: 'Улучшает настрой', delay: 3 },
            { icon: 'activity', label: 'Регулярное движение', pct: '+22%', color: '#CBD89E', desc: 'Улучшает настрой', delay: 4 },
            { icon: 'users', label: 'Общение с близкими', pct: '+18%', color: '#CBD89E', desc: 'Улучшает настрой', delay: 5 },
            { icon: 'moon', label: 'Мало отдыха', pct: '+18%', color: '#F5B5B6', desc: 'Ухудшает настрой', delay: 6 },
        ];

        const Screen2 = () => (
            <React.Fragment>
                <div className="mb-6 flex items-center justify-between">
                    <button className="stagger-item stagger-delay-1 w-10 h-10 rounded-full bg-[#4A3968]/25 backdrop-blur-xl flex items-center justify-center">
                        <i data-lucide="chevron-left" className="w-5 h-5 text-white"></i>
                    </button>
                    <div className="stagger-item stagger-delay-1 bg-[#4A3968]/25 backdrop-blur-xl rounded-full pl-4 py-0.5 pr-0.5 flex items-center gap-2">
                        <span className="text-white text-sm font-medium">Lena Voss</span>
                        <img src={AVATAR} alt="Lena Voss" className="w-9 h-9 rounded-full object-cover" />
                    </div>
                </div>

                <div className="stagger-item stagger-delay-2 mb-2">
                    <h1 className="text-white text-[38px] leading-[1.1] font-normal tracking-[-0.03em] mb-2">Твои паттерны</h1>
                    <p className="text-white/70 text-lg leading-snug">Что влияет<br />на твоё состояние</p>
                </div>

                <div className="flex flex-col gap-3 mt-6">
                    {INSIGHTS.map((it) => (
                        <div key={it.label} className={`stagger-item stagger-delay-${it.delay} bg-[#4A3968]/25 backdrop-blur-xl rounded-3xl px-5 py-5 border border-white/20 flex items-center justify-between`}>
                            <div className="flex items-center gap-3">
                                <i data-lucide={it.icon} className="w-5 h-5 text-white"></i>
                                <span className="text-white font-medium text-[15px]">{it.label}</span>
                            </div>
                            <div className="text-right">
                                <div className="font-semibold text-lg" style={{ color: it.color }}>{it.pct}</div>
                                <div className="text-white/60 text-xs">{it.desc}</div>
                            </div>
                        </div>
                    ))}
                </div>

                <div className="flex-1"></div>

                    <i data-lucide="arrow-right" className="w-5 h-5 text-neutral-700"></i>
                </button>

                <HomeIndicator />
            </React.Fragment>
        );

        const MOODS = [
            { key: 'low', label: 'Плохо', mouth: 'M20 44c3-5 8-8 12-8s9 3 12 8' },
            { key: 'worried', label: 'Тревожно', mouth: 'M22 42c2.5-3 6-5 10-5s7.5 2 10 5' },
            { key: 'settled', label: 'Спокойно', mouth: 'M22 40h20' },
            { key: 'well', label: 'Хорошо', mouth: 'M20 38c3 5 8 8 12 8s9-3 12-8' },
        ];

        const Screen3 = () => {
            const [selectedMood, setSelectedMood] = useState('well');
            const [notes, setNotes] = useState('');
            const [energyLevel, setEnergyLevel] = useState(4);

            return (
                <React.Fragment>
                    <div className="mb-6 flex items-center justify-between">
                        <button className="stagger-item stagger-delay-1 w-10 h-10 rounded-full bg-[#7f7160]/25 backdrop-blur-xl flex items-center justify-center">
                            <i data-lucide="chevron-left" className="w-5 h-5 text-white"></i>
                        </button>
                        <div className="stagger-item stagger-delay-1 bg-[#7f7160]/25 backdrop-blur-xl rounded-full pl-4 py-0.5 pr-0.5 flex items-center gap-2">
                            <span className="text-white text-sm font-medium">Lena Voss</span>
                            <img src={AVATAR} alt="Lena Voss" className="w-9 h-9 rounded-full object-cover" />
                        </div>
                    </div>

                    <h1 className="stagger-item stagger-delay-2 mb-5 text-white text-[28px] leading-[1.2] font-normal tracking-[-0.02em]">Как ты себя чувствуешь?</h1>

                    <div className="stagger-item stagger-delay-3 mb-6 px-1 flex items-center justify-between">
                        {MOODS.map((m) => {
                            const sel = selectedMood === m.key;
                            return (
                                <button key={m.key} onClick={() => setSelectedMood(m.key)} className="flex flex-col items-center gap-2">
                                    <svg width="64" height="64" viewBox="0 0 64 64">
                                        <circle cx="32" cy="32" r="30" fill={sel ? '#fff' : 'none'} stroke={sel ? 'none' : '#fff'} strokeWidth="2" />
                                        <circle cx="22" cy="26" r="3" fill={sel ? '#6B6B6B' : '#fff'} />
                                        <circle cx="42" cy="26" r="3" fill={sel ? '#6B6B6B' : '#fff'} />
                                        <path d={m.mouth} fill="none" stroke={sel ? '#6B6B6B' : '#fff'} strokeWidth="2.5" strokeLinecap="round" />
                                    </svg>
                                    <span className={`text-white text-xs ${sel ? 'font-semibold' : 'font-medium'}`}>{m.label}</span>
                                </button>
                            );
                        })}
                    </div>

                    <h2 className="stagger-item stagger-delay-4 text-white text-[22px] leading-[1.2] font-normal tracking-[-0.02em] mb-3">Запиши мысли</h2>

                    <div className="stagger-item stagger-delay-5 bg-[#7f7160]/20 backdrop-blur-xl rounded-2xl p-5 border border-white/30 mb-6">
                        <textarea
                            value={notes}
                            onChange={(e) => setNotes(e.target.value)}
                            rows={3}
                            placeholder={"Как прошёл день?\nЧто повлияло\nна твоё настроение?"}
                            className="w-full bg-transparent text-white text-[15px] leading-relaxed placeholder-white/50 resize-none outline-none min-h-[80px]"
                        ></textarea>
                    </div>

                    <h2 className="stagger-item stagger-delay-6 text-white text-[22px] leading-[1.2] font-normal tracking-[-0.02em] mb-4">Уровень энергии</h2>

                    <div className="stagger-item stagger-delay-7 flex items-stretch gap-2 mb-4">
                        <button onClick={() => setEnergyLevel((v) => Math.max(1, v - 1))} className="w-10 h-20 rounded-full bg-[#C5B9AA] flex items-center justify-center shrink-0">
                            <i data-lucide="minus" className="w-4 h-4 text-white"></i>
                        </button>
                        <div className="flex-1 flex items-end gap-1.5">
                            {[1, 2, 3, 4, 5].map((level) => (
                                <div key={level} className={`flex-1 h-20 rounded-xl ${level <= energyLevel ? 'bg-white shadow-sm' : 'border-2 border-white/40 bg-white/20'}`}></div>
                            ))}
                        </div>
                        <button onClick={() => setEnergyLevel((v) => Math.min(5, v + 1))} className="w-10 h-20 rounded-full bg-[#C5B9AA] flex items-center justify-center shrink-0">
                            <i data-lucide="plus" className="w-4 h-4 text-white"></i>
                        </button>
                    </div>

                    <div className="flex-1"></div>

                    <button className="stagger-item stagger-delay-8 mb-4 w-full bg-white rounded-2xl py-4 px-6 flex items-center justify-between shadow-lg">
                        <span className="text-neutral-800 font-medium text-base">Готово</span>
                        <i data-lucide="arrow-right" className="w-5 h-5 text-neutral-700"></i>
                    </button>

                    <HomeIndicator />
                </React.Fragment>
            );
        };

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="min-h-screen bg-white flex flex-col md:flex-row items-center justify-center gap-6 md:gap-8 overflow-x-auto md:overflow-x-visible p-4 py-8 md:p-4 relative">
