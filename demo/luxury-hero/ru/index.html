        const ArrowRight = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

        const NAV_LINKS = ["История", "Резиденции", "Атмосфера", "Панорамы", "Контакты"];

        const Navbar = () => {
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => {
                document.body.style.overflow = menuOpen ? 'hidden' : '';
            }, [menuOpen]);

            return (
                <>
                    <nav className="fixed top-0 left-0 right-0 z-50 px-5 md:px-12 py-4 md:py-5 flex items-center justify-between">
                        <Logo className="h-7 md:h-10 text-white relative z-50" />

                        <div className="hidden md:flex items-center gap-8 text-white/90 text-sm font-geist font-light tracking-wide">
                            {NAV_LINKS.map((link) => (
                                <a key={link} href="#" className="hover:text-white transition-colors">{link}</a>
                            ))}
                        </div>

                        <button className="hidden md:flex group items-center gap-2 bg-white/90 backdrop-blur-sm rounded-full pl-5 pr-1.5 py-1.5 hover:bg-white transition-all shadow-lg">
                            <span className="text-gray-800 text-xs md:text-sm font-geist font-medium tracking-wider uppercase">Записаться на показ</span>
                            <span className="flex items-center justify-center w-7 h-7 md:w-8 md:h-8 rounded-full bg-rose-200/60 group-hover:bg-rose-300/70 transition-colors">
                                <ArrowRight className="w-3.5 h-3.5 text-gray-700" />
                            </span>
                        </button>

                        <button
                            onClick={() => setMenuOpen((v) => !v)}
                            aria-label="Открыть меню"
                            className="relative z-50 md:hidden flex flex-col items-center justify-center w-10 h-10"
                        >
                            <span className={`block w-5 h-[1.5px] bg-white rounded-full transition-all duration-300 ease-[cubic-bezier(0.77,0,0.18,1)] ${menuOpen ? 'rotate-45 translate-y-[3px]' : '-translate-y-[3px]'}`} />
                            <span className={`block w-5 h-[1.5px] bg-white rounded-full transition-all duration-300 ease-[cubic-bezier(0.77,0,0.18,1)] ${menuOpen ? '-rotate-45 -translate-y-[0px]' : 'translate-y-[3px]'}`} />
                        </button>
                    </nav>

                    <div className={`fixed inset-0 z-40 md:hidden transition-all duration-500 ease-[cubic-bezier(0.77,0,0.18,1)] ${menuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                        <div className="absolute inset-0 bg-black/95 backdrop-blur-xl transition-opacity duration-500" />
                        <div className="relative h-full flex flex-col items-center justify-center px-8">
                            <div className="flex flex-col items-center gap-6">
                                {NAV_LINKS.map((link, i) => (
                                    <a
                                        key={link}
                                        href="#"
                                        onClick={() => setMenuOpen(false)}
                                        className={`text-white text-2xl font-heading tracking-wider uppercase hover:text-white/70 transition-all duration-500 ${menuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`}
                                        style={{ transitionDelay: `${100 + i * 60}ms` }}
                                    >
                                        {link}
                                    </a>
                                ))}
                            </div>
                            <button
                                onClick={() => setMenuOpen(false)}
                                className={`mt-10 group flex items-center gap-2 bg-white/90 backdrop-blur-sm rounded-full pl-5 pr-1.5 py-1.5 hover:bg-white transition-all shadow-lg duration-500 ${menuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`}
                                style={{ transitionDelay: '420ms' }}
                            >

                                <span className="flex items-center justify-center w-7 h-7 rounded-full bg-rose-200/60 group-hover:bg-rose-300/70 transition-colors">

                            </button>
                        </div>
                    </div>
                </>
            );
        };

        const Hero = () => {
            const [scrolled, setScrolled] = useState(false);
            const [visible, setVisible] = useState(false);
            const video2Ref = useRef(null);
            const wasScrolled = useRef(false);

            useEffect(() => {
                const t = setTimeout(() => setVisible(true), 200);
                return () => clearTimeout(t);
            }, []);

            useEffect(() => {
                const handleScroll = () => {
                    const isScrolled = window.scrollY > 0;
                    setScrolled(isScrolled);
                    const v = video2Ref.current;
                    if (!v) return;
                    if (isScrolled && !wasScrolled.current) {
                        v.currentTime = 0;
                        v.play().catch(() => {});
                    } else if (!isScrolled && wasScrolled.current) {
                        v.pause();
                    }
                    wasScrolled.current = isScrolled;
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="relative h-[200dvh]">
                    <div className="sticky top-0 w-full h-[100dvh] overflow-hidden">
                        <video ref={video2Ref} muted playsInline preload="auto" src={VIDEO_2} className="absolute inset-0 w-full h-full object-cover" />
                        <video autoPlay muted loop playsInline className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ${scrolled ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                            <source src={VIDEO_1} type="video/mp4" />
                        </video>

                        <div className="absolute inset-0 flex items-center justify-center pb-[25vh] sm:pb-[30vh]">

                                <div className={`absolute inset-0 rounded-full border border-white/35 transition-all duration-[1200ms] ease-out ${visible ? 'opacity-100 scale-100' : 'opacity-0 scale-75'}`} style={{ transitionDelay: '0ms' }} />
                                <div className={`absolute inset-[12%] rounded-full border border-white/25 transition-all duration-[1200ms] ease-out ${visible ? 'opacity-100 scale-100' : 'opacity-0 scale-75'}`} style={{ transitionDelay: '150ms' }} />
                                <div className={`transition-all duration-[1000ms] ease-out ${visible ? 'opacity-100 scale-100' : 'opacity-0 scale-90'}`} style={{ transitionDelay: '350ms' }}>
                                    <Logo className="h-12 sm:h-16 md:h-24 text-white" />
                                </div>
                            </div>
                        </div>

                            <h1
                                className={`font-heading text-white text-2xl sm:text-3xl md:text-5xl lg:text-6xl leading-[1.1] tracking-wide uppercase transition-all duration-[1000ms] ease-out ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}

                            </p>

            );
