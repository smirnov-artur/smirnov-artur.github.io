function useTypewriter(text, speed, startDelay) {
    const [n, setN] = useState(0);
    useEffect(() => {
        let cancelled = false, startId, stepId;
        startId = setTimeout(function tick(i) {
            if (cancelled) return;
            const next = (i || 0) + 1;
            setN(next);
            if (next < text.length) stepId = setTimeout(() => tick(next), speed);
        }, startDelay);
        return () => { cancelled = true; clearTimeout(startId); clearTimeout(stepId); };
    }, [text, speed, startDelay]);
    return n;
}

function useCountUp(to, duration, delay) {
    const [n, setN] = useState(0);
    useEffect(() => {
        let raf, startId;
        const ease = t => 1 - Math.pow(1 - t, 3);
        const frame = (ts, start) => {
            const s = start === undefined ? ts : start;
            const p = Math.min(1, (ts - s) / duration);
            setN(Math.round(to * ease(p)));
            if (p < 1) raf = requestAnimationFrame(t => frame(t, s));
        };
        startId = setTimeout(() => { raf = requestAnimationFrame(t => frame(t, undefined)); }, delay);
        return () => { clearTimeout(startId); if (raf) cancelAnimationFrame(raf); };
    }, [to, duration, delay]);
    return n;
}

                        <div className="orbit-ring" />
                        {AVATARS.filter(a => a.orbit === o.id).map((a, i) => (
                            <Avatar key={i} a={{ ...a, dur: o.dur, counterDir: o.dir === 'ccw' ? 'cw' : 'ccw' }} />
                        ))}
                    </div>
                </div>
            ))}
            <div className="orbit-counter-center">
                <div className="counter-num">{count}k+</div>
                <div className="counter-label">Специалистов</div>
            </div>
        </div>
    </div>
);

const App = () => {
    const typed = useTypewriter(HEADLINE, 35, 400);
    const count = useCountUp(20, 2000, 1200);
    const isTyping = typed < HEADLINE.length;
    const shown = HEADLINE.slice(0, typed);

    return (
        <div className="app" style={{ background: `url(${BG_URL}) center center / cover no-repeat` }}>
            <div className="header-wrap">
                <div className="header-inner">
                    <div className="header-left">
                        <a href="#" style={{ color: '#000' }}><GadLogo height="32px" /></a>
                        <nav className="nav-links">
                            {NAV_LINKS.map(l => (<a key={l} href="#" className="nav-link">{l}</a>))}
                        </nav>
                    </div>
                    <div className="header-right">
                        <a href="#" className="nav-link nav-link--white">Войти</a>
                        <div className="btn-border-wrap">
                            <button className="pill-btn pill-btn--left"><span>Присоединиться</span></button>
                        </div>
                    </div>
                </div>
            </div>

            <main className="hero-main">
                <section className="hero-left">
                    <h1 className="headline">
                        <span style={{ color: '#000' }}>{shown.slice(0, Math.min(typed, BLACK_LEN))}</span>
                        <span style={{ color: '#fff' }}>{shown.slice(BLACK_LEN)}</span>
                        {isTyping && <span className="type-cursor" />}
                    </h1>
                    <div className="btn-border-wrap start-project-wrap">
                        <button className="pill-btn pill-btn--right start-btn"><span>Начать проект</span><ChevronIcon /></button>
                    </div>
                    <div className="cursor-badge">
                        <CursorIcon />
                        <span className="david-pill">David</span>
                    </div>
                </section>
                <section className="hero-right">
                    <CirclesVisualization count={count} />
                </section>
            </main>

            <footer className="logo-ticker">
                <div className="ticker-track">
                    {TICKER_LOGOS.map((src, i) => (<img key={i} src={src} className="ticker-logo" alt="" />))}
                </div>
            </footer>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
