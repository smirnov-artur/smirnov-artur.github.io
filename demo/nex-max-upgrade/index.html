<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Power up with Max</title>
    <meta name="description" content="g.a.d. Max unlocks unlimited chat and every Base tool in one bundle for $25/month.">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            text-align: center;
            padding: 40px 0;
        }
        #root {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        .c4-video-wrap {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            overflow: hidden;
        }
        .c4-video-wrap video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scale(1.35);
        }
        .c4-content { z-index: 1; width: 100%; max-width: 700px; padding: 20px; }
        .c4-title {
            font-size: 2.5rem; font-weight: 300; margin-bottom: 10px;
            background: linear-gradient(to right, #737373, #ffffff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; display: inline-block;
        }
        .c4-subtitle { font-size: 1rem; color: #a3a3a3; margin-bottom: 40px; }
        .c4-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin-bottom: 40px; text-align: left;
        }
        .c4-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 30px;
            backdrop-filter: blur(10px);
        }
        .c4-card-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .c4-tier { font-size: 0.85rem; color: #a3a3a3; }
        .c4-badge {
            background: white; color: black;
            font-size: 0.7rem; font-weight: 600;
            padding: 2px 6px; border-radius: 4px;
        }
        .c4-trial {
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 0.75rem; padding: 4px 10px;
            border-radius: 20px; color: #d4d4d4;
        }
        .c4-price {
            font-size: 2.5rem; font-weight: 400; margin-bottom: 30px;
            display: flex; align-items: baseline;
        }
        .c4-price span { font-size: 0.9rem; color: #a3a3a3; margin-left: 5px; }
        .c4-list-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 15px; }
        .c4-list { list-style: none; }
        .c4-list li {
            font-size: 0.85rem; color: #d4d4d4;
            margin-bottom: 12px;
            display: flex; align-items: flex-start; gap: 8px;
        }
        .c4-list li::before { content: '\2713'; color: #fff; }
        .c4-btn {
            background: white; color: black; border: none;
            padding: 12px 24px; border-radius: 24px;
            font-weight: 500; font-size: 0.9rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
            margin-bottom: 20px;
        }
        .c4-btn:hover { background: #e5e5e5; }
        .c4-footer { font-size: 0.7rem; color: #737373; }
        .c4-footer a { color: #a3a3a3; text-decoration: underline; }
        @media (max-width: 768px) {
            .c4-title { font-size: 2rem; }
            .c4-subtitle { font-size: 0.9rem; margin-bottom: 30px; }
            .c4-grid { grid-template-columns: 1fr; gap: 15px; }
            .c4-card { padding: 25px; }
            .c4-price { font-size: 2rem; }
            .c4-content { padding: 15px; }
        }
        @media (max-width: 480px) {
            .c4-title { font-size: 1.75rem; }
            .c4-subtitle { font-size: 0.85rem; }
            .c4-card { padding: 20px; }
            .c4-price { font-size: 1.75rem; }
            .c4-list li { font-size: 0.8rem; }
            .c4-btn { padding: 10px 20px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useEffect, useRef } = React;

        const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260508_064209_0cb7d815-ff61-4caa-a6d5-bbff145ab272.mp4';
        const SEEK_INTERVAL_MS = 33;
        const STEP_SECONDS = 0.05;

        const AppleIcon = () => (
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.65.72 3.4 1.8-3.02 1.93-2.48 5.68.3 6.84-.66 1.76-1.5 3.33-2.35 4.37zm-2.9-15.18c-.46 2.06-2.45 3.48-4.41 3.2.14-2.18 1.93-3.8 3.9-3.95.12 1.54-.36 2.39.51.75z"/></svg>
        );

        const App = () => {
            const videoRef = useRef(null);
            const directionRef = useRef(1);
            const rafRef = useRef(null);
            const lastTickRef = useRef(0);

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const loop = now => {
                    if (!video.duration || isNaN(video.duration)) {
                        rafRef.current = requestAnimationFrame(loop);
                        return;
                    }
                    if (now - lastTickRef.current >= SEEK_INTERVAL_MS && !video.seeking) {
                        lastTickRef.current = now;
                        let next = video.currentTime + STEP_SECONDS * directionRef.current;
                        if (next >= video.duration) { next = video.duration; directionRef.current = -1; }
                        else if (next <= 0) { next = 0; directionRef.current = 1; }
                        video.currentTime = next;
                    }
                    rafRef.current = requestAnimationFrame(loop);
                };

                const start = () => { video.pause(); rafRef.current = requestAnimationFrame(loop); };
                if (video.readyState >= 1) start();
                else video.addEventListener('loadedmetadata', start, { once: true });

                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, []);

            return (
                <React.Fragment>
                    <div className="c4-video-wrap">
                        <video ref={videoRef} muted playsInline crossOrigin="anonymous" preload="auto" src={VIDEO_SRC} />
                    </div>
                    <div className="c4-content">
                        <h1 className="c4-title">Power up with g.a.d. Max</h1>
                        <p className="c4-subtitle">Access more tools with a single bundle.</p>
                        <div className="c4-grid">
                            <div className="c4-card">
                                <div className="c4-card-header"><span className="c4-tier">Base</span></div>
                                <div className="c4-price">$0</div>
                                <div className="c4-list-title">Contains</div>
                                <ul className="c4-list">
                                    <li>Talk with your tabs</li>
                                    <li>Custom Macros</li>
                                    <li>An elite web-based tool</li>
                                </ul>
                            </div>
                            <div className="c4-card">
                                <div className="c4-card-header">
                                    <span className="c4-badge">MAX</span>
                                    <span className="c4-trial">14-day sample run</span>
                                </div>
                                <div className="c4-price">$25<span>a month</span></div>
                                <div className="c4-list-title">Has all the tools from Base, plus</div>
                                <ul className="c4-list">
                                    <li>g.a.d. unlocked. Chat as much as you want, without meeting limits.*</li>
                                </ul>
                            </div>
                        </div>
                        <button className="c4-btn"><AppleIcon /> Download g.a.d. to start</button>
                        <p className="c4-footer">* if your usage aligns with our <a href="#">Usage Policy</a>, naturally.</p>
                    </div>
                </React.Fragment>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
