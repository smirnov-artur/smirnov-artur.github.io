        const SEEK_INTERVAL_MS = 33;
        const STEP_SECONDS = 0.05;

        const AppleIcon = () => (
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.15 2.65.72 3.4 1.8-3.02 1.93-2.48 5.68.3 6.84-.66 1.76-1.5 3.33-2.35 4.37zm-2.9-15.18c-.46 2.06-2.45 3.48-4.41 3.2.14-2.18 1.93-3.8 3.9-3.95.12 1.54-.36 2.39.51.75z"/></svg>

            const directionRef = useRef(1);
            const rafRef = useRef(null);
            const lastTickRef = useRef(0);

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const loop = now => {
                    if (!video.duration || isNaN(video.duration)) {
                        rafRef.current = requestAnimationFrame(loop);
                        return;
                    }
                    if (now - lastTickRef.current >= SEEK_INTERVAL_MS && !video.seeking) {
                        lastTickRef.current = now;
                        let next = video.currentTime + STEP_SECONDS * directionRef.current;
                        if (next >= video.duration) { next = video.duration; directionRef.current = -1; }
                        else if (next <= 0) { next = 0; directionRef.current = 1; }
                        video.currentTime = next;
                    }
                    rafRef.current = requestAnimationFrame(loop);
                };

                const start = () => { video.pause(); rafRef.current = requestAnimationFrame(loop); };
                if (video.readyState >= 1) start();
                else video.addEventListener('loadedmetadata', start, { once: true });

                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, []);

            return (

                                </ul>

                                </div>

                                </ul>

                        <p className="c4-footer">* естественно, если ваше использование укладывается в нашу <a href="#">Политику использования</a>.</p>

.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
