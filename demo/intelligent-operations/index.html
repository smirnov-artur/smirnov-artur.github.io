}
function ChevronRightIcon({ size = 14, className = '' }) {

function Reveal({ children, delay = 0, className = '', as = 'div' }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} className={`transition-all duration-700 ease-out will-change-transform ${shown ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </Tag>
  );
}

const VIDEO_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260729_102822_0e6c87e8-c141-4744-bf32-ad30db296371.mp4';
const PORTRAIT_URL = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260728_050334_5b076e26-0ce7-4898-b432-d764190e448f.png&w=1280&q=85';

// ScrollVideo: extracts up to 90 frames (blob-fetched to avoid a tainted canvas on the cross-origin
// CDN), then scrubs them by scroll position; the visible <video> is itself scroll-seeked until the
// cache is ready, so nothing ever autoplays/loops -- motion is scroll-driven only, per spec.
function ScrollVideo() {
  const [framesReady, setFramesReady] = useState(false);
  const framesRef = useRef([]);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    let objectUrl;
    (async () => {
      try {
        const v0 = videoRef.current;
        if (v0) {
          if (v0.readyState < 2) await new Promise(r => v0.addEventListener('loadeddata', r, { once: true }));
          await new Promise(r => setTimeout(r, 300));
        }
        if (cancelled) return;
        const res = await fetch(VIDEO_URL);
        const blob = await res.blob();
        if (cancelled) return;
        objectUrl = URL.createObjectURL(blob);
        const v = document.createElement('video');
        v.muted = true; v.playsInline = true; v.src = objectUrl;
        await new Promise((resolve, reject) => { v.onloadedmetadata = resolve; v.onerror = reject; });
        if (cancelled) return;
        const dur = v.duration;
        const count = Math.min(90, Math.max(24, Math.round(dur * 12)));
        const maxW = 960;
        const scale = Math.min(1, maxW / v.videoWidth);
        const cw = Math.max(1, Math.round(v.videoWidth * scale)), ch = Math.max(1, Math.round(v.videoHeight * scale));
        const bitmaps = [];
        for (let i = 0; i < count; i++) {
          if (cancelled) break;
          const t = count > 1 ? (i / (count - 1)) * dur : 0;
          await new Promise(resolve => { v.onseeked = resolve; v.currentTime = t; });
          if (cancelled) break;
          bitmaps.push(await createImageBitmap(v, { resizeWidth: cw, resizeHeight: ch }));
        }
        if (!cancelled) { framesRef.current = bitmaps; setFramesReady(true); }
        else bitmaps.forEach(b => b.close());
      } catch {
        // frame cache failed -- the <video> fallback keeps scrubbing via seek forever
      }
    })();
    return () => {
      cancelled = true;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      framesRef.current.forEach(b => b.close());
    };
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, video = videoRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf, smoothed = 0, seeking = false, forcedFirstSeek = false;
    const resize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(canvas.clientWidth * dpr);
      canvas.height = Math.round(canvas.clientHeight * dpr);
    };
    resize();
    window.addEventListener('resize', resize);
    if (video) video.onseeked = () => { seeking = false; };
    const tick = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const target = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      smoothed += (target - smoothed) * 0.12;
      const frames = framesRef.current;
      if (frames.length > 1) {
        const idx = Math.min(frames.length - 1, Math.round(smoothed * (frames.length - 1)));
        const bmp = frames[idx];
        const cw = canvas.width, ch = canvas.height, s = Math.max(cw / bmp.width, ch / bmp.height);
        const dw = bmp.width * s, dh = bmp.height * s;
        ctx.drawImage(bmp, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      } else if (video && video.duration && !seeking) {
        const t = smoothed * (video.duration - 0.05);
        // a video that has never actually seeked can sit fully loaded but visually unpainted (blank/black)
        // until a real 'seeked' event fires -- force one on the very first tick even if t is already 0
        if (!forcedFirstSeek || Math.abs(video.currentTime - t) > 0.04) {
          forcedFirstSeek = true; seeking = true; video.currentTime = t;
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [framesReady]);

  return (
    <div className="fixed inset-0 z-0 bg-[#0a0a0a] overflow-hidden pointer-events-none">
      <video ref={videoRef} src={VIDEO_URL} muted playsInline preload="auto" className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${framesReady ? 'opacity-0' : 'opacity-100'}`} />
      <canvas ref={canvasRef} className={`absolute inset-0 w-full h-full transition-opacity duration-500 ${framesReady ? 'opacity-100' : 'opacity-0'}`} />
    </div>
  );
}

}

      <div className="flex flex-col-reverse gap-8 md:flex-row items-start md:items-end justify-between">
        <div>
          <Badge delay={150}>We Automate 100+ Businesses</Badge>
          <Reveal delay={280} as="h1" className="text-5xl sm:text-6xl lg:text-7xl font-normal leading-[1.05] tracking-tight text-white drop-shadow-lg max-md:[text-shadow:0_2px_16px_rgba(20,30,50,.3)]">
            Clear. Precise.<br />Automated.

        </div>

        <Reveal delay={420} className="flex items-center gap-4 rounded-xl bg-white/15 p-3 backdrop-blur-md">
          <img src={PORTRAIT_URL} alt="Mitha, co-founder of g.a.d." className="h-24 w-20 rounded-lg object-cover" />
          <div className="flex flex-col gap-1.5 pr-2">

            <span className="font-mono text-[10px] uppercase tracking-[0.15em] text-white/60">Co-founder of g.a.d.</span>
            <button type="button" className="mt-1.5 inline-flex items-center gap-1 rounded-full bg-white px-4 py-2 text-xs font-medium text-black hover:bg-white/85 transition-colors duration-300 w-fit">
              Book a 15-min call <ChevronRightIcon size={14} />

          </div>
        </Reveal>
      </div>
    </section>
  );
}

        <Badge delay={120}>Insight On Demand</Badge>
        <Reveal delay={220} className="max-w-sm sm:text-right text-lg sm:text-xl leading-relaxed text-white drop-shadow-md">
          Our AI doesn't just respond — it interprets, sharpens, and delivers the signal you need.
        </Reveal>
      </div>

      <div className="flex-1 flex flex-col gap-12 justify-end md:flex-row items-end justify-between md:gap-16">
        <div className="max-w-xl">
          <Reveal delay={180} as="h2" className="text-5xl sm:text-6xl lg:text-7xl font-normal leading-[1.05] tracking-tight text-white drop-shadow-lg max-md:[text-shadow:0_2px_16px_rgba(20,30,50,.3)]">
            Learn to see<br />brilliantly.
          </Reveal>
          <Reveal delay={320} as="p" className="mt-6 max-w-md text-sm sm:text-base text-white/80 drop-shadow-md max-md:rounded-xl max-md:bg-white/15 max-md:backdrop-blur-md max-md:p-4 max-md:text-white/90">
            From the first sketch to the final render, g.a.d. turns raw intent into decisions your team can act on — quietly, precisely, at speed.
          </Reveal>
          <Reveal delay={420} className="mt-8 flex flex-wrap gap-3">
            <button type="button" className="inline-flex items-center gap-1 rounded-full bg-white px-5 py-2.5 text-xs sm:text-sm font-medium text-black hover:bg-white/85 transition-colors duration-300">
              Run the demo <ChevronRightIcon size={14} />
            </button>
            <button type="button" className="rounded-full border border-white/25 bg-white/10 backdrop-blur-md px-5 py-2.5 text-xs sm:text-sm hover:bg-white/20 transition-colors duration-300">Free consultation</button>
          </Reveal>
        </div>

        <div className="w-full max-w-md rounded-2xl border border-white/15 bg-white/10 backdrop-blur-md px-5 sm:px-6">
          {CAPABILITIES.map((c, i) => (
            <Reveal key={c.title} delay={300 + i * 110} className={`group flex gap-5 py-5 ${i < CAPABILITIES.length - 1 ? 'border-b border-white/15' : ''}`}>
              <span className="font-mono text-[11px] tracking-[0.15em] text-white/55">{String(i + 1).padStart(2, '0')}</span>
              <div>
                <div className="flex items-center gap-1.5 text-base sm:text-lg font-medium text-white">
                  {c.title}
                  <ChevronRightIcon size={16} className="text-white/40 group-hover:text-white group-hover:translate-x-0.5 transition-all duration-300" />

                <p className="mt-1.5 text-sm leading-relaxed text-white/70">{c.body}</p>

}

function App() {
