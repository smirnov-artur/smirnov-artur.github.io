function Reveal({ children, delay = 0, className = '', as = 'div' }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} className={`transition-all duration-700 ease-out will-change-transform ${shown ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </Tag>
  );
}

// ScrollVideo: extracts up to 90 frames (blob-fetched to avoid a tainted canvas on the cross-origin
// CDN), then scrubs them by scroll position; the visible <video> is itself scroll-seeked until the
// cache is ready, so nothing ever autoplays/loops -- motion is scroll-driven only, per spec.
function ScrollVideo() {
  const [framesReady, setFramesReady] = useState(false);
  const framesRef = useRef([]);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    let objectUrl;
    (async () => {
      try {
        const v0 = videoRef.current;
        if (v0) {
          if (v0.readyState < 2) await new Promise(r => v0.addEventListener('loadeddata', r, { once: true }));
          await new Promise(r => setTimeout(r, 300));
        }
        if (cancelled) return;
        const res = await fetch(VIDEO_URL);
        const blob = await res.blob();
        if (cancelled) return;
        objectUrl = URL.createObjectURL(blob);
        const v = document.createElement('video');
        v.muted = true; v.playsInline = true; v.src = objectUrl;
        await new Promise((resolve, reject) => { v.onloadedmetadata = resolve; v.onerror = reject; });
        if (cancelled) return;
        const dur = v.duration;
        const count = Math.min(90, Math.max(24, Math.round(dur * 12)));
        const maxW = 960;
        const scale = Math.min(1, maxW / v.videoWidth);
        const cw = Math.max(1, Math.round(v.videoWidth * scale)), ch = Math.max(1, Math.round(v.videoHeight * scale));
        const bitmaps = [];
        for (let i = 0; i < count; i++) {
          if (cancelled) break;
          const t = count > 1 ? (i / (count - 1)) * dur : 0;
          await new Promise(resolve => { v.onseeked = resolve; v.currentTime = t; });
          if (cancelled) break;
          bitmaps.push(await createImageBitmap(v, { resizeWidth: cw, resizeHeight: ch }));
        }
        if (!cancelled) { framesRef.current = bitmaps; setFramesReady(true); }
        else bitmaps.forEach(b => b.close());
      } catch {
        // frame cache failed -- the <video> fallback keeps scrubbing via seek forever
      }
    })();
    return () => {
      cancelled = true;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      framesRef.current.forEach(b => b.close());
    };
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current, video = videoRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf, smoothed = 0, seeking = false, forcedFirstSeek = false;
    const resize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(canvas.clientWidth * dpr);
      canvas.height = Math.round(canvas.clientHeight * dpr);
    };
    resize();
    window.addEventListener('resize', resize);
    if (video) video.onseeked = () => { seeking = false; };
    const tick = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const target = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      smoothed += (target - smoothed) * 0.12;
      const frames = framesRef.current;
      if (frames.length > 1) {
        const idx = Math.min(frames.length - 1, Math.round(smoothed * (frames.length - 1)));
        const bmp = frames[idx];
        const cw = canvas.width, ch = canvas.height, s = Math.max(cw / bmp.width, ch / bmp.height);
        const dw = bmp.width * s, dh = bmp.height * s;
        ctx.drawImage(bmp, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      } else if (video && video.duration && !seeking) {
        const t = smoothed * (video.duration - 0.05);
        // a video that has never actually seeked can sit fully loaded but visually unpainted (blank/black)
        // until a real 'seeked' event fires -- force one on the very first tick even if t is already 0
        if (!forcedFirstSeek || Math.abs(video.currentTime - t) > 0.04) {
          forcedFirstSeek = true; seeking = true; video.currentTime = t;
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [framesReady]);

  return (
    <div className="fixed inset-0 z-0 bg-[#0a0a0a] overflow-hidden pointer-events-none">
      <video ref={videoRef} src={VIDEO_URL} muted playsInline preload="auto" className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${framesReady ? 'opacity-0' : 'opacity-100'}`} />
      <canvas ref={canvasRef} className={`absolute inset-0 w-full h-full transition-opacity duration-500 ${framesReady ? 'opacity-100' : 'opacity-0'}`} />
    </div>
  );
}
