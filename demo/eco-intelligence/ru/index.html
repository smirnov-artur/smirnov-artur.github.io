  );
}

function ChamferButton({ label }) {
  const btnRef = React.useRef(null);
  const [size, setSize] = useState({ w: 220, h: 44 });
  useEffect(() => {
    const measure = () => {
      const el = btnRef.current;
      if (el) setSize({ w: el.offsetWidth, h: el.offsetHeight });
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);
  const { w, h } = size;
  const c = 14;
  const points = `${c},0 ${w},0 ${w},${h - c} ${w - c},${h} 0,${h} 0,${c}`;
  const clip = `polygon(${c}px 0, 100% 0, 100% calc(100% - ${c}px), calc(100% - ${c}px) 100%, 0 100%, 0 ${c}px)`;
  return (
    <button
      ref={btnRef}
      className="relative w-[220px] sm:w-[260px] h-[44px] sm:h-[48px] text-black hover:opacity-70 transition-opacity duration-300"
    >
      <span
        className="absolute inset-0 bg-white/60 backdrop-blur-md border border-black/20 sm:bg-transparent sm:backdrop-blur-none sm:border-transparent"
        style={{ clipPath: clip }}
      />
      <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
        <polygon points={points} fill="transparent" stroke="currentColor" strokeWidth="1.5" />
      </svg>
      <span className="relative flex items-center justify-between w-full h-full px-5 sm:px-6 text-xs sm:text-sm tracking-wide">
        {label}
        <i data-lucide="arrow-right" className="w-4 h-4"></i>
      </span>
    </button>
  );
}

function VerticalRule({ side }) {
  return (
    <div className={'hidden md:flex absolute top-0 bottom-0 ' + (side === 'left' ? 'left-0' : 'right-0') + ' flex-col items-center'}>
      <div className="w-px bg-black/20" style={{ height: '15%' }} />
      <span className="text-black/40 text-xs">+</span>
      <div className="w-px bg-black/20 flex-1" />
      <span className="text-black/40 text-xs">+</span>
      <div className="w-px bg-black/20" style={{ height: '15%' }} />
    </div>
  );
}

function GlassRects() {
  const cells = ['s1', null, 's2', null, null, 's3'];
  return (
    <div
      className="hidden md:grid absolute top-1/2 left-1/2 pointer-events-none"
      style={{ transform: 'translate(-50%, -50%)', width: 220, height: 330, gridTemplateColumns: 'repeat(2, 1fr)', gridTemplateRows: 'repeat(3, 1fr)' }}
    >
      {cells.map((c, i) => c ? (
        <div
          key={i}
          style={{
            width: 110, height: 110,
            background: 'rgba(255,255,255,.1)', border: '1px solid rgba(255,255,255,.4)',
            boxShadow: 'inset 0 2px 20px rgba(255,255,255,0.5), inset 0 -2px 14px rgba(0,0,0,0.2), 0 0 20px rgba(255,255,255,0.15), 0 0 40px rgba(255,255,255,0.05)',
          }}
        />
      ) : <div key={i} />)}
    </div>
  );
}

const NAV_LINKS = ['О нас', 'Исследования', 'Проекты', 'Журнал', 'Контакты'];

function App() {
  const [menuOpen, setMenuOpen] = useState(false);
  const [menuVisible, setMenuVisible] = useState(false);

  const openMenu = () => {
    setMenuOpen(true);
    requestAnimationFrame(() => requestAnimationFrame(() => setMenuVisible(true)));
  };
  const closeMenu = () => {
    setMenuVisible(false);
    setTimeout(() => setMenuOpen(false), 520);
  };

  useEffect(() => { lucide.createIcons(); }, [menuOpen, menuVisible]);
  useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
  }, [menuOpen]);
  useEffect(() => {
    if (!menuOpen) return;
    const onKey = e => { if (e.key === 'Escape') closeMenu(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [menuOpen]);

  return (
    <div className="relative h-screen w-full overflow-hidden">
      <video
        className="absolute inset-0 w-full h-full object-cover"
        style={{ backgroundColor: '#f5f4f0' }}
        autoPlay muted loop playsInline
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204426_c2ec12c0-3159-4601-8f8f-484c9a687833.mp4"
      />

      <div className="relative z-10 h-full flex flex-col">
        <nav className="flex items-center justify-between px-5 sm:px-6 md:px-12 py-5 md:py-6">
          <button
            type="button"
            className="flex items-center gap-2 text-black hover:opacity-60 transition-opacity duration-300"
            onClick={openMenu}
            aria-label="Открыть меню"
          >
            <i data-lucide="menu" className="w-5 h-5" style={{ strokeWidth: 1.5 }}></i>
            <span className="hidden sm:inline text-sm tracking-wide">Меню</span>
          </button>
          <div className="flex items-center gap-2 text-black hover:opacity-60 transition-opacity duration-300 cursor-pointer">
            <span className="w-2 h-2 rounded-full bg-black" />
            <span className="text-sm tracking-wide">Заказать звонок</span>
          </div>
        </nav>

        <div className="relative flex-1 mx-5 sm:mx-6 md:mx-12">
          <VerticalRule side="left" />
          <VerticalRule side="right" />
          <GlassRects />

          <div
            className="absolute top-[2%] left-0 right-0 text-center pointer-events-none select-none overflow-hidden font-display whitespace-nowrap ghost-text"
            style={{ fontSize: 'min(30vw, 30vh)', lineHeight: 0.85, letterSpacing: '-0.02em' }}
          >
            g.a.d.
          </div>

          <div className="h-full flex flex-col">
            <div className="flex-1" />
            <div className="mt-auto pb-6 sm:pb-8 md:pb-12 flex flex-col md:flex-row items-start md:items-end justify-between gap-6 md:gap-12 px-2 sm:px-4 md:px-8">
              <div className="max-w-sm text-white sm:text-black">
                <h1 className="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-light leading-tight tracking-tight [text-wrap:balance] [text-shadow:0_1px_10px_rgba(0,0,0,.35)] sm:[text-shadow:none]">
                  Сигналы из зелёных глубин
                </h1>
                <p className="mt-3 md:mt-4 text-xs sm:text-sm text-white/85 sm:text-black/60 max-w-[280px] [text-shadow:0_1px_10px_rgba(0,0,0,.35)] sm:[text-shadow:none]">
                  Открытое исследовательское объединение — мы картографируем, расшифровываем и архивируем тихие вибрации, связывающие экологические сети планеты.
                </p>
                <div className="mt-5 md:mt-6">
                  <ChamferButton label="Начать слушать" />
                </div>
              </div>

              <div className="max-w-xs md:max-w-[320px] w-full bg-white/60 backdrop-blur-md border border-white/80 p-5 sm:p-6 md:p-8 rounded-sm">
                <div className="flex items-center justify-between border-b border-black/10 pb-3 md:pb-4">
                  <span className="text-base sm:text-lg md:text-xl font-medium tracking-tight">Последние находки</span>
                  <span className="text-xs text-black/40">//02</span>
                </div>
                <div className="space-y-4 md:space-y-5 mt-4 md:mt-5">
                  <div>
                    <div className="text-sm md:text-base font-semibold tracking-tight">Анализ пульса кроны 09.17</div>
                    <p className="text-xs md:text-sm text-black/50 mt-1 md:mt-1.5 leading-relaxed">Выявлены гармонические колебательные связи между сетями корневой микоризы и окружающей атмосферной влагой.</p>
                  </div>
                  <div>
                    <div className="text-sm md:text-base font-semibold tracking-tight">Гармонический индекс водосбора 11.06</div>
                    <p className="text-xs md:text-sm text-black/50 mt-1 md:mt-1.5 leading-relaxed">Модель прогнозирования восстановления экосистем на шести континентах с использованием более 2400 сенсорных массивов.</p>
                  </div>
                </div>
                <div className="hidden sm:flex mt-5 md:mt-6 justify-center">
                  <svg viewBox="0 0 220 50" className="w-full">
                    <path d="M0 30 C10 30 12 45 18 45 C24 45 26 10 34 10 C42 10 44 40 52 40 C60 40 62 5 70 5 C78 5 80 42 88 42 C96 42 98 15 106 15 C114 15 116 38 124 38 C132 38 134 20 142 20 C150 20 152 35 160 35 C168 35 170 22 178 22 C186 22 188 32 196 32 C204 32 210 28 220 28"
                      stroke="black" strokeWidth="1.8" fill="none" strokeLinecap="round" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {menuOpen && (
        <div className="fixed inset-0 z-50">
          <div
            className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity duration-500"
            style={{ opacity: menuVisible ? 1 : 0 }}
            onClick={closeMenu}
          />
          <div
            className={'absolute top-0 left-0 h-full w-full sm:w-[380px] px-8 sm:px-10 py-6 flex flex-col transition-transform duration-500' + (menuVisible ? ' menu-open' : '')}
            style={{ background: '#f5f4f0', transitionTimingFunction: 'cubic-bezier(0.16,1,0.3,1)', transform: menuVisible ? 'translateX(0)' : 'translateX(-100%)' }}
            role="dialog" aria-modal="true" aria-label="Меню"
          >
            <button
              type="button"
              className="flex items-center gap-2 text-black mb-12 hover:opacity-60 transition-opacity duration-300"
              onClick={closeMenu}
              aria-label="Закрыть меню"
            >
              <i data-lucide="x" className="w-5 h-5" style={{ strokeWidth: 1.5 }}></i>
              <span className="text-sm tracking-wide">Закрыть</span>
            </button>

            {NAV_LINKS.map((l, i) => (
              <a
                key={l} href="#"
                className="menu-link block py-4 border-b border-black/10 text-2xl sm:text-3xl font-light tracking-tight text-black"
                style={{ transitionDelay: (150 + i * 75) + 'ms' }}
                onClick={closeMenu}
              >
                <span className="label">{l}</span>
                <i data-lucide="arrow-right" className="arrow w-4 h-4 inline-block ml-2"></i>
              </a>
            ))}

            <div className="menu-contact mt-auto pb-8 border-t border-black/10 pt-6">
              <div className="text-xs text-black/40 uppercase tracking-wide mb-3">Связаться</div>
              <a href="mailto:hello@example.com" className="text-sm text-black/70 hover:text-black">hello@example.com</a>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
