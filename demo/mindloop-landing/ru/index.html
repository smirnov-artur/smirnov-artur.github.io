.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
                        <div className="hidden md:flex items-center space-x-6 text-sm">
                            {['Главная', 'Как это работает', 'Философия', 'Сценарии'].map((link, i) => (
                                <React.Fragment key={link}>
                                    <a href="#" className="text-muted-foreground hover:text-foreground transition-colors">{link}</a>
                                    {i < 3 && <span className="text-muted-foreground/30">•</span>}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>
                    <div className="flex items-center gap-4">
                        {['instagram', 'linkedin', 'twitter'].map(icon => (
                            <button key={icon} className="liquid-glass w-10 h-10 rounded-full flex items-center justify-center">
                                <i data-lucide={icon} className="w-4 h-4"></i>
                            </button>
                        ))}
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative w-full h-screen overflow-hidden flex flex-col items-center justify-center text-center px-6">
                <video 
                    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260325_120549_0cd82c36-56b3-4dd9-b190-069cfc3a623f.mp4"
                    className="absolute inset-0 w-full h-full object-cover -z-10"
                    autoPlay loop muted playsInline
                />
                <div className="absolute inset-x-0 bottom-0 h-64 bg-gradient-to-t from-background to-transparent -z-10"></div>
                
                <div className="z-10 pt-28 md:pt-32">
                    <div className="flex items-center justify-center space-x-4 mb-8">
                        <div className="flex -space-x-2">
                            {[1,2,3].map(i => (
                                <img key={i} src={`https://i.pravatar.cc/100?img=${i+20}`} className="w-8 h-8 rounded-full border-2 border-background" />
                            ))}
                        </div>
                        <span className="text-muted-foreground text-sm">7 000+ человек уже подписались</span>
                    </div>
                    
                    <h1 className="text-5xl md:text-7xl lg:text-8xl font-medium tracking-[-2px] mb-6 max-w-5xl leading-tight">
                        <span className="font-serif italic font-normal">Вдохновляйтесь</span> с нами
                    </h1>
                    
                    <p className="text-lg text-hero-subtitle max-w-2xl mx-auto mb-12">
                        Подпишитесь на нашу ленту: содержательные обновления, новости технологий и общий путь к глубине и ясной цели.
                    </p>
                    
                    <div className="liquid-glass rounded-full p-2 max-w-lg mx-auto flex items-center shadow-2xl">
                        <input type="email" placeholder="Введите ваш email" className="bg-transparent flex-1 px-6 text-sm outline-none" />
                        <motion.button 
                            whileHover={{ scale: 1.03 }}
                            whileTap={{ scale: 0.98 }}
                            className="bg-foreground text-background rounded-full px-8 py-3 text-sm font-bold uppercase tracking-widest"
                        >
                            ПОДПИСАТЬСЯ
                        </motion.button>
                    </div>
                </div>
            </section>
        );

        const PlatformCards = () => (
            <section className="pt-52 md:pt-64 pb-20 px-8 lg:px-28">
                <div className="text-center mb-32">
                    <h2 className="text-5xl md:text-7xl lg:text-8xl font-medium mb-12 leading-none">
                        Поиск <span className="font-serif italic">изменился.</span> А вы?
                    </h2>
                    <p className="text-muted-foreground text-lg max-w-2xl mx-auto">
                        В эпоху мгновенных ответов мы ценим сам путь к открытию.
                    </p>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-16 md:gap-8 mb-20 max-w-7xl mx-auto">
                    {[
                        { name: 'ChatGPT', icon: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80', desc: 'Мгновенные ответы на насущные вопросы.' },
                        { name: 'Perplexity', icon: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80', desc: 'Открытия в реальном времени — под рукой.' },
                        { name: 'Google AI', icon: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80', desc: 'Будущее поиска в новом прочтении.' }
                    ].map((card, i) => (
                        <div key={i} className="flex flex-col items-center text-center">
                            <div className="w-[200px] h-[200px] liquid-glass rounded-2xl flex items-center justify-center mb-8 overflow-hidden">
                                <img src={card.icon} className="w-full h-full object-cover grayscale opacity-60" />
                            </div>
                            <h4 className="font-semibold text-lg mb-2">{card.name}</h4>
                            <p className="text-muted-foreground text-sm max-w-[200px]">{card.desc}</p>
                        </div>
                    ))}
                </div>
                <p className="text-muted-foreground text-sm text-center">Если на вопросы не ответите вы, ответит кто-то другой.</p>
            </section>
        );

        const MissionReveal = () => {
            const containerRef = useRef(null);
            const { scrollYProgress } = useScroll({
                target: containerRef,
                offset: ["start 0.8", "end 0.2"]
            });

            const text1 = "Мы создаём пространство, где любопытство встречает ясность, где читатели находят глубину, авторы — аудиторию, а каждая рассылка становится разговором, который стоит продолжить.";
            const words1 = text1.split(" ");
            const highlights = ["любопытство", "встречает", "ясность"];

            return (
                <section ref={containerRef} className="pb-32 md:pb-44 flex flex-col items-center">
                    <video 
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260325_132944_a0d124bb-eaa1-4082-aa30-2310efb42b4b.mp4"
                        className="w-[800px] h-[800px] object-cover -z-10 mb-20 grayscale opacity-40"
                        autoPlay loop muted playsInline
                    />
                    
                    <div className="max-w-5xl px-8 text-center">
                        <div className="text-2xl md:text-4xl lg:text-5xl font-medium tracking-[-1px] leading-relaxed">
                            {words1.map((word, i) => {
                                const start = i / words1.length;
                                const end = start + (1 / words1.length);
                                const opacity = useTransform(scrollYProgress, [start, end], [0.15, 1]);
                                const cleanWord = word.replace(/[^\wа-яё]/gi, '').toLowerCase();
                                const isHighlighted = highlights.includes(cleanWord);
                                return (
                                    <motion.span key={i} style={{ opacity }} className={`inline-block mr-3 ${isHighlighted ? 'text-foreground' : 'text-hero-subtitle'}`}>
                                        {word}
                                    </motion.span>
                                );
                            })}
                        </div>
                    </div>
                </section>
            );
        };

        const CTA = () => {
            const videoRef = useRef(null);
            useEffect(() => {
                const video = videoRef.current;
                const streamUrl = 'https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8';
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                }
            }, []);

            return (
                <section className="relative py-32 md:py-44 overflow-hidden flex items-center justify-center border-t border-border/30">
                    <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover -z-10 grayscale" autoPlay loop muted playsInline />
                    <div className="absolute inset-0 bg-background/45 -z-[5]"></div>
                    
                    <div className="relative z-10 text-center">
                        <div className="flex justify-center mb-8">
                            <LogoIcon size="w-10 h-10" innerSize="w-5 h-5" />
                        </div>
                        <h2 className="text-5xl font-serif italic mb-6">Начните свой путь</h2>
                        <p className="text-muted-foreground mb-12">Откройте будущее осмысленного контента.</p>
                        <div className="flex flex-col sm:flex-row gap-6 justify-center items-center">
                            <button className="bg-foreground text-background rounded-lg px-10 py-4 font-bold text-sm uppercase tracking-widest">Подписаться</button>
                            <button className="liquid-glass rounded-lg px-10 py-4 font-bold text-sm uppercase tracking-widest">Начать писать</button>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-12 px-8 md:px-28 border-t border-border/30 flex flex-col md:flex-row justify-between items-center text-muted-foreground text-sm">
                <p>© 2026 g.a.d. Все права защищены.</p>
                <div className="flex space-x-12 mt-6 md:mt-0">
                    <a href="#" className="hover:text-foreground">Конфиденциальность</a>
                    <a href="#" className="hover:text-foreground">Условия</a>
                    <a href="#" className="hover:text-foreground">Контакты</a>
                </div>
            </footer>
        );

        const App = () => (
            <div>
                <Navbar />
                <Hero />
                <PlatformCards />
                <MissionReveal />
                <CTA />
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
