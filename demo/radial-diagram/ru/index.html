<body class="antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useRef, useState } = React;
        const { motion, useInView } = Motion;

        const EASE = [0.22, 1, 0.36, 1];

        // (x%, y%, width px, height px) of each glitch chip around the portrait
        const GLITCH_BLOCKS = [
            [2, -3, 22, 22], [12, -5, 14, 10], [28, -2, 10, 10],
            [82, 22, 8, 8], [-4, 75, 16, 12], [8, 82, 10, 10],
            [-2, 88, 18, 16], [56, 82, 12, 14], [70, 90, 10, 10],
            [42, 94, 8, 6],
        ];

        const SPOKES = [
            { key: 'websites', label: 'сайты', angle: 215 },
            { key: 'brands', label: 'бренды', angle: 335 },
            { key: 'uiux', label: 'ui/ux-дизайн', angle: 110 },
        ];

        const point = (angle, r) => {
            const rad = (angle * Math.PI) / 180;
            return { x: 50 + r * Math.cos(rad), y: 50 + r * Math.sin(rad) };
        };

        const PlusIcon = () => (
            <svg viewBox="0 0 12 12" width="12" height="12" fill="none">
                <path d="M6 2V10M2 6H10" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" />
            </svg>
        );

        const Header = ({ isInView }) => (
            <div className="flex items-start gap-4 mb-20">
                <div>
                    <motion.p
                        className="text-[#6e6e6e] font-light leading-[1.18] tracking-[-0.01em] text-[clamp(2rem,3.4vw,2.6rem)]"
                        initial={{ opacity: 0, y: 20 }}
                        animate={isInView ? { opacity: 1, y: 0 } : {}}
                        transition={{ duration: 0.7, ease: EASE }}
                    >
                        Единый подход
                    </motion.p>
                    <motion.p
                        className="text-white font-light leading-[1.18] tracking-[-0.01em] text-[clamp(2rem,3.4vw,2.6rem)]"
                        initial={{ opacity: 0, y: 20 }}
                        animate={isInView ? { opacity: 1, y: 0 } : {}}
                        transition={{ duration: 0.7, delay: 0.1, ease: EASE }}
                    >
                        к брендингу
                    </motion.p>
                </div>
                <motion.button
                    type="button"
                    aria-label="Развернуть"
                    className="flex h-7 w-7 items-center justify-center rounded border border-white/20 text-white/70 transition-colors hover:bg-white/10 hover:text-white"
                    initial={{ opacity: 0, scale: 0.8 }}
                    animate={isInView ? { opacity: 1, scale: 1 } : {}}
                    transition={{ duration: 0.7, delay: 0.25, ease: EASE }}
                >
                    <PlusIcon />
                </motion.button>
            </div>
        );

        const GlitchPortrait = ({ isInView }) => (
            <motion.div
                className="relative shrink-0"
                style={{ width: 250, height: 310 }}
                initial={{ opacity: 0, y: 24 }}
                animate={isInView ? { opacity: 1, y: 0 } : {}}
                transition={{ duration: 0.8, delay: 0.2, ease: EASE }}
            >
                <img
                    src="https://images.pexels.com/photos/3778212/pexels-photo-3778212.jpeg?auto=compress&cs=tinysrgb&w=600"
                    alt="Alex West, основатель и креативный директор"
                    className="h-full w-full object-cover"
                />
                {GLITCH_BLOCKS.map(([x, y, w, h], i) => (
                    <motion.span
                        key={i}
                        className="absolute bg-white"
                        style={{ left: `${x}%`, top: `${y}%`, width: w, height: h }}
                        initial={{ scale: 0, opacity: 0 }}
                        animate={isInView ? { scale: 1, opacity: [0, 1, 0.9] } : {}}
                        transition={{ duration: 0.35, delay: 0.5 + i * 0.05, ease: EASE }}
                    />
                ))}
            </motion.div>
        );

                    transition={{ duration: 0.7, delay: 0.3, ease: EASE }}

                    &#8220;
                </motion.span>
                <motion.p
                    className="text-white/90 font-normal leading-[1.58] text-[clamp(1.05rem,1.5vw,1.28rem)]"
                    initial={{ opacity: 0, y: 20 }}
                    animate={isInView ? { opacity: 1, y: 0 } : {}}
                    transition={{ duration: 0.7, delay: 0.4, ease: EASE }}
                >
                    Мы снова и снова видели одну и ту же картину: бренды с огромным потенциалом тонут в хаосе процессов, разрозненной визуальности и безликих сайтов. Студия существует, чтобы собрать всё это в одну ясную, цельную историю.

                                const { x, y } = point(s.angle, 36);

                                return (
                                    <line

                                        stroke="white"
                                        style={{
                                            strokeWidth: active ? 0.6 : 0.18,
                                            opacity: active ? 1 : 0.45,
                                            transition: 'stroke-width 0.3s, opacity 0.3s',
                                        }}
                                    />
                                );
                            })}
                        </svg>

                            const { x, y } = point(s.angle, 46);
                            const active = hovered === s.key;
                            return (
                                <motion.div
                                    key={s.key}
                                    className="absolute whitespace-nowrap text-white text-[clamp(1.25rem,2.8vw,2.4rem)] tracking-[-0.01em]"
                                    style={{
                                        left: `${x}%`, top: `${y}%`,
                                        transform: 'translate(-50%, -50%)',
                                        fontWeight: active ? 700 : 300,
                                        transition: 'font-weight 0.25s',
                                    }}

                                    animate={isInView ? { opacity: 1, y: 0 } : {}}
                                    transition={{ duration: 0.7, delay: 0.6 + i * 0.15, ease: EASE }}
                                    onMouseEnter={() => setHovered(s.key)}
                                    onMouseLeave={() => setHovered(null)}
                                >
                                    {s.label}
                                </motion.div>
                            );
                        })}
                    </motion.div>
                </div>
            );

.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
                    </a>
                    <div className="mx-auto max-w-7xl px-6 py-24 sm:px-10 lg:px-16 lg:py-32">
                        <Header isInView={isInView} />
                        <div className="flex flex-col gap-12 lg:flex-row lg:items-start lg:gap-10">
                            <div className="flex min-w-0 flex-1 flex-col gap-8 sm:flex-row sm:items-start sm:gap-10">
                                <GlitchPortrait isInView={isInView} />
                                <Testimonial isInView={isInView} />
                            </div>
                            <CircleDiagram isInView={isInView} />
                        </div>
                    </div>
                </section>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<BrandingApproach />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
