<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a;min-height:100%}
body{font-family:Helvetica,Arial,sans-serif}
#root{min-height:100vh}
img{-webkit-user-drag:none;user-select:none}
.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}

.showcase-wrapper{display:flex;align-items:center;justify-content:center;width:100%;min-height:100%;padding:40px 24px;gap:50px}

.iphone-frame{
  aspect-ratio:393/852;height:95vh;max-height:900px;
  border-radius:54px;border:8px solid #2a2a2a;background:#1a1a1a;
  box-shadow:0 0 0 2px #0a0a0a,0 40px 80px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.4),inset 0 0 0 2px #3a3a3a;
  position:relative;display:flex;flex-direction:column;flex-shrink:0;
}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:36px;background:#000;border-radius:20px;z-index:200}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(255,255,255,.3);border-radius:3px;z-index:200}
.screen{flex:1;overflow:hidden;border-radius:46px;position:relative;transform:translateZ(0)}
.screen-inner{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen-inner::-webkit-scrollbar{display:none}

@media (min-width:901px) and (max-width:1200px){ .iphone-frame{height:90vh;max-height:800px} }
@media (max-width:900px){
  .showcase-wrapper{flex-direction:column;gap:50px;padding:20px}
  .iphone-frame{width:393px;height:auto}
}

/* ---- Hero screen ---- */
.hero-screen{height:100%;background:#06181B;position:relative;display:flex;flex-direction:column}
.hero-nav{position:absolute;top:0;left:0;right:0;z-index:100;padding:24px;display:flex;align-items:flex-start;justify-content:space-between}
.logo{display:flex;flex-direction:column;font:800 32px/.9 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.logo span:first-child{color:#fff}
.logo span:last-child{color:#ffda00}
.menu-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#fff;padding:0}
.mobile-menu{position:fixed;inset:0;background:#6682c2;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.mobile-menu-item{color:#fff;font:24px Helvetica,Arial,sans-serif;text-decoration:none}

.hero-body{height:100%;display:flex;flex-direction:column}
.hero-video-wrap{height:63%;flex-shrink:0;position:relative;overflow:hidden}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-video-fade{position:absolute;left:0;right:0;bottom:-2px;height:55%;background:linear-gradient(to bottom, transparent 0%, #06181B 92%, #06181B 100%);pointer-events:none}
.hero-copy{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 24px}
.hero-headline{font:800 60px/.94 'Barlow Condensed',sans-serif;letter-spacing:-.02em;text-transform:uppercase;overflow:clip;margin:0 0 16px}
.hl-line{display:block}
.hl-line.white{color:#fff}
.hl-line.yellow{color:#ffda00}
.hl-line.right{text-align:right}

.cta-btn{position:relative;width:100%;height:56px;border-radius:28px;background:#ffda00;border:none;cursor:pointer;padding:0}
.cta-label{position:absolute;top:0;left:0;bottom:0;width:85.57%;display:flex;align-items:center;justify-content:center;color:#002a35;font:20px Helvetica,Arial,sans-serif}
.cta-circle{position:absolute;right:0;top:0;width:56px;height:56px;border-radius:50%;background:#06181B;display:flex;align-items:center;justify-content:center}
.cta-circle svg{transform:rotate(-135deg);transition:transform .35s}
.cta-btn:hover .cta-circle svg{transform:rotate(-90deg)}

/* ---- Info screen ---- */
.info-screen{min-height:100%;flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 20px 40px;background:linear-gradient(180deg,#C8C7B3 0%,#F0B172 50%,#EA7C58 100%)}
.info-tagline{margin-bottom:32px}
.info-h1{font:800 64px/.9 'Barlow Condensed',sans-serif;letter-spacing:-.02em;text-transform:uppercase;color:#fff;margin:0}
.info-sub{font:26px/1.2 Helvetica,Arial,sans-serif;letter-spacing:-.02em;color:#1a1a1a;margin:8px 0 0}

.map-box{position:relative;width:calc(100% + 40px);margin:0 -20px 40px;aspect-ratio:435/340}
.map-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.route-svg{position:absolute;left:10%;top:18%;width:80%;aspect-ratio:299/143;overflow:visible}
.map-icon{position:absolute;width:16%;aspect-ratio:1/1}
.map-icon-inner{width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.map-icon-inner img{width:80%;height:80%;object-fit:cover;border-radius:50%}

.info-stats{display:flex;flex-direction:column;gap:48px}
.stat{display:flex;align-items:center;gap:16px}
.stat-num{font:800 72px/1 'Barlow Condensed',sans-serif;color:#fff}
.stat-text{font:18px/1.3 Helvetica,Arial,sans-serif;color:#1a1a1a;margin:0}

/* ---- Contact screen ---- */
.contact-screen{height:100%;background:#0a1f2b;padding:48px 20px 36px;display:flex;flex-direction:column}
.contact-h1{font:800 64px/.9 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 20px;font-size:54px}
.contact-h1 .white{color:#fff}
.contact-h1 .yellow{color:#FFDA00}
.contact-sub{font:18px/1.4 Helvetica,Arial,sans-serif;color:#b0b8bc;max-width:400px;margin:0 0 72px}
.contact-form{display:flex;flex-direction:column;gap:16px;margin-bottom:44px}
.contact-input{padding:18px 24px;border-radius:40px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-family:Helvetica,Arial,sans-serif;outline:none;width:100%}
.contact-input::placeholder{color:rgba(255,255,255,.5)}
.contact-submit{width:100%;padding:18px;border-radius:40px;border:none;background:#FFDA00;color:#0a1f2b;font-size:20px;font-weight:700;margin-top:4px;cursor:pointer;font-family:Helvetica,Arial,sans-serif}
.contact-links{display:flex;flex-direction:column;gap:8px;margin-bottom:32px}
.contact-link{font-size:18px;color:#b0b8bc;text-decoration:none;font-family:Helvetica,Arial,sans-serif;display:inline-block}
.contact-footer-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.social-row{display:flex;gap:12px}
.social-icon,.scroll-top-btn{width:44px;height:44px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.contact-copy{font-size:14px;color:#6b7a80;text-align:left;margin:0}

function PhoneChrome({ children }){
  return (
    <React.Fragment>
      <div className="notch"/>
      <div className="screen"><div className="screen-inner">{children}</div></div>
      <div className="home-indicator"/>
    </React.Fragment>
  );

function usePhoneZoom(){
  useEffect(() => {
    const apply = () => {
      const z = window.innerWidth <= 900 ? Math.min(1, (window.innerWidth - 40) / 393) : 1;
      document.querySelectorAll(".phone-mockup").forEach((el) => { el.style.zoom = z; });
    };
    apply();
    window.addEventListener("resize", apply);
    return () => window.removeEventListener("resize", apply);
  }, []);
}

function App(){
  usePhoneZoom();
  return (
    <div className="showcase-wrapper">
      <div className="phone-mockup">
        <motion.div className="iphone-frame" initial={{ opacity: 0, y: 60 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .9, delay: .3, ease: EXPO_OUT }}>
          <PhoneChrome><InfoSection/></PhoneChrome>
        </motion.div>
      </div>
      <div className="phone-mockup">
        <motion.div className="iphone-frame" initial={{ opacity: 0, y: 60 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .9, delay: 0, ease: EXPO_OUT }}>
          <PhoneChrome><HeroSection/></PhoneChrome>
        </motion.div>
      </div>
      <div className="phone-mockup">
        <motion.div className="iphone-frame" initial={{ opacity: 0, y: 60 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .9, delay: .3, ease: EXPO_OUT }}>
          <PhoneChrome><ContactSection/></PhoneChrome>
        </motion.div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
