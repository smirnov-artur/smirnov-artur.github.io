<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARGOX Group — Без границ и пределов</title>
<meta name="description" content="Три экрана в телефонах для логистического бренда: видео-заставка с наезжающим заголовком, анимированная карта маршрутов и форма обратной связи.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a;min-height:100%}
body{font-family:Helvetica,Arial,sans-serif}
#root{min-height:100vh}
img{-webkit-user-drag:none;user-select:none}

.showcase-wrapper{display:flex;align-items:center;justify-content:center;width:100%;min-height:100%;padding:40px 24px;gap:50px}

.iphone-frame{
  aspect-ratio:393/852;height:95vh;max-height:900px;
  border-radius:54px;border:8px solid #2a2a2a;background:#1a1a1a;
  box-shadow:0 0 0 2px #0a0a0a,0 40px 80px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.4),inset 0 0 0 2px #3a3a3a;
  position:relative;display:flex;flex-direction:column;flex-shrink:0;
}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:36px;background:#000;border-radius:20px;z-index:200}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(255,255,255,.3);border-radius:3px;z-index:200}
.screen{flex:1;overflow:hidden;border-radius:46px;position:relative;transform:translateZ(0)}
.screen-inner{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen-inner::-webkit-scrollbar{display:none}

@media (min-width:901px) and (max-width:1200px){ .iphone-frame{height:90vh;max-height:800px} }
@media (max-width:900px){
  .showcase-wrapper{flex-direction:column;gap:50px;padding:20px}
  .iphone-frame{width:393px;height:auto}
}

/* ---- Hero screen ---- */
.hero-screen{height:100%;background:#06181B;position:relative;display:flex;flex-direction:column}
.hero-nav{position:absolute;top:0;left:0;right:0;z-index:100;padding:24px;display:flex;align-items:flex-start;justify-content:space-between}
.logo{display:flex;flex-direction:column;font:800 32px/.9 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.logo span:first-child{color:#fff}
.logo span:last-child{color:#ffda00}
.menu-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#fff;padding:0}
.mobile-menu{position:fixed;inset:0;background:#6682c2;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.mobile-menu-item{color:#fff;font:24px Helvetica,Arial,sans-serif;text-decoration:none}

.hero-body{height:100%;display:flex;flex-direction:column}
.hero-video-wrap{height:63%;flex-shrink:0;position:relative;overflow:hidden}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-video-fade{position:absolute;left:0;right:0;bottom:-2px;height:55%;background:linear-gradient(to bottom, transparent 0%, #06181B 92%, #06181B 100%);pointer-events:none}
.hero-copy{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 24px}
.hero-headline{font:800 60px/.94 'Barlow Condensed',sans-serif;letter-spacing:-.02em;text-transform:uppercase;overflow:clip;margin:0 0 16px}
.hl-line{display:block}
.hl-line.white{color:#fff}
.hl-line.yellow{color:#ffda00}
.hl-line.right{text-align:right}

.cta-btn{position:relative;width:100%;height:56px;border-radius:28px;background:#ffda00;border:none;cursor:pointer;padding:0}
.cta-label{position:absolute;top:0;left:0;bottom:0;width:85.57%;display:flex;align-items:center;justify-content:center;color:#002a35;font:20px Helvetica,Arial,sans-serif}
.cta-circle{position:absolute;right:0;top:0;width:56px;height:56px;border-radius:50%;background:#06181B;display:flex;align-items:center;justify-content:center}
.cta-circle svg{transform:rotate(-135deg);transition:transform .35s}
.cta-btn:hover .cta-circle svg{transform:rotate(-90deg)}

/* ---- Info screen ---- */
.info-screen{min-height:100%;flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 20px 40px;background:linear-gradient(180deg,#C8C7B3 0%,#F0B172 50%,#EA7C58 100%)}
.info-tagline{margin-bottom:32px}
.info-h1{font:800 64px/.9 'Barlow Condensed',sans-serif;letter-spacing:-.02em;text-transform:uppercase;color:#fff;margin:0}
.info-sub{font:26px/1.2 Helvetica,Arial,sans-serif;letter-spacing:-.02em;color:#1a1a1a;margin:8px 0 0}

.map-box{position:relative;width:calc(100% + 40px);margin:0 -20px 40px;aspect-ratio:435/340}
.map-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.route-svg{position:absolute;left:10%;top:18%;width:80%;aspect-ratio:299/143;overflow:visible}
.map-icon{position:absolute;width:16%;aspect-ratio:1/1}
.map-icon-inner{width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.map-icon-inner img{width:80%;height:80%;object-fit:cover;border-radius:50%}

.info-stats{display:flex;flex-direction:column;gap:48px}
.stat{display:flex;align-items:center;gap:16px}
.stat-num{font:800 72px/1 'Barlow Condensed',sans-serif;color:#fff}
.stat-text{font:18px/1.3 Helvetica,Arial,sans-serif;color:#1a1a1a;margin:0}

/* ---- Contact screen ---- */
.contact-screen{height:100%;background:#0a1f2b;padding:48px 20px 36px;display:flex;flex-direction:column}
.contact-h1{font:800 64px/.9 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 20px;font-size:54px}
.contact-h1 .white{color:#fff}
.contact-h1 .yellow{color:#FFDA00}
.contact-sub{font:18px/1.4 Helvetica,Arial,sans-serif;color:#b0b8bc;max-width:400px;margin:0 0 72px}
.contact-form{display:flex;flex-direction:column;gap:16px;margin-bottom:44px}
.contact-input{padding:18px 24px;border-radius:40px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-family:Helvetica,Arial,sans-serif;outline:none;width:100%}
.contact-input::placeholder{color:rgba(255,255,255,.5)}
.contact-submit{width:100%;padding:18px;border-radius:40px;border:none;background:#FFDA00;color:#0a1f2b;font-size:20px;font-weight:700;margin-top:4px;cursor:pointer;font-family:Helvetica,Arial,sans-serif}
.contact-links{display:flex;flex-direction:column;gap:8px;margin-bottom:32px}
.contact-link{font-size:18px;color:#b0b8bc;text-decoration:none;font-family:Helvetica,Arial,sans-serif;display:inline-block}
.contact-footer-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.social-row{display:flex;gap:12px}
.social-icon,.scroll-top-btn{width:44px;height:44px;border-radius:50%;background:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.contact-copy{font-size:14px;color:#6b7a80;text-align:left;margin:0}
</style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZosUtiZTaR.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZosUJiZTaR.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const { motion, AnimatePresence } = Motion;

const EXPO_OUT = [0.16, 1, 0.3, 1];
const EASE_OUT = [0.25, 0.46, 0.45, 0.94];

const SHIP_IMG = "https://image-bottom-92901062.figma.site/_components/v2/142c6a6f3074dd8aee013fa440ff4ff369649d48/08d6a37375d428e07c59e24a8529de89bfee157e.08d6a373.png";
const CAR_IMG = "https://image-bottom-92901062.figma.site/_components/v2/142c6a6f3074dd8aee013fa440ff4ff369649d48/7d6f50a87e1427d9b4d1a9c9f1c064ff04b2b3f9.7d6f50a8.png";
const PLANE_IMG = "https://image-bottom-92901062.figma.site/_components/v2/142c6a6f3074dd8aee013fa440ff4ff369649d48/0e0282ab1c70db03d437b0d01875ce45557d49f6.0e0282ab.png";
const MAP_BG = "https://polo-pecan-73837341.figma.site/_assets/v11/b6d561167283e799453232309bd13dd78b2d1afa.png";
const HERO_VIDEO = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260620_185230_f7f71ef4-6655-469f-b9c6-efbdc1f7684a.mp4";

function MenuIcon(){
  return <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
}
function XIcon(){
  return <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>;
}
function ArrowIcon(){
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>;
}

function HeroNavbar({ open, setOpen }){
  return (
    <nav className="hero-nav">
      <motion.div className="logo" initial={{ x: -24, opacity: 0 }} animate={{ x: 0, opacity: 1 }} transition={{ duration: .7, ease: EXPO_OUT }}>
        <span>CARGOX</span><span>GROUP</span>
      </motion.div>
      <motion.button type="button" className="menu-btn" aria-label={open ? "Закрыть меню" : "Открыть меню"}
        initial={{ x: 24, opacity: 0 }} animate={{ x: 0, opacity: 1 }} transition={{ duration: .7, ease: EXPO_OUT }}
        onClick={() => setOpen(o => !o)}>
        {open ? <XIcon/> : <MenuIcon/>}
      </motion.button>
    </nav>
  );
}

function MobileMenu(){
  return (
    <motion.div className="mobile-menu" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .3 }}>
      {["Услуги","Отрасли","Компания"].map((label, i) => (
        <motion.a key={label} href="#" className="mobile-menu-item"
          initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 20 }}
          transition={{ delay: i * 0.05, duration: .4 }}>{label}</motion.a>
      ))}
    </motion.div>
  );
}

function HeroHeadline(){
  return (
    <h1 className="hero-headline">
      <motion.span className="hl-line white" initial={{ x: -400 }} animate={{ x: 0 }} transition={{ duration: .85, delay: 0, ease: EXPO_OUT }}>ВНЕ</motion.span>
      <motion.span className="hl-line yellow right" initial={{ x: 400 }} animate={{ x: 0 }} transition={{ duration: .85, delay: .13, ease: EXPO_OUT }}>ГРАНИЦ</motion.span>
      <motion.span className="hl-line white" initial={{ x: -400 }} animate={{ x: 0 }} transition={{ duration: .85, delay: .26, ease: EXPO_OUT }}>И ПРЕДЕЛОВ</motion.span>
    </h1>
  );
}

function HeroCTA(){
  return (
    <motion.button type="button" className="cta-btn"
      initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .7, delay: .5, ease: EXPO_OUT }}
      whileHover={{ scale: 1.08, y: -2 }} whileTap={{ scale: .97 }}>
      <span className="cta-label">Связаться с нами</span>
      <span className="cta-circle"><ArrowIcon/></span>
    </motion.button>
  );
}

function HeroSection(){
  const [open, setOpen] = useState(false);
  const [ready, setReady] = useState(false);
  return (
    <div className="hero-screen">
      <HeroNavbar open={open} setOpen={setOpen}/>
      <AnimatePresence>{open && <MobileMenu/>}</AnimatePresence>
      <div className="hero-body">
        <div className="hero-video-wrap">
          <video className="hero-video" src={HERO_VIDEO} autoPlay muted loop playsInline onCanPlay={() => setReady(true)}/>
          <div className="hero-video-fade"/>
        </div>
        <div className="hero-copy">
          {ready && (
            <React.Fragment>
              <HeroHeadline/>
              <HeroCTA/>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

const ROUTE_PATHS = [
  "M128.161 74.6764C79.9989 130.001 71.9994 46.0005 20.9815 111.737",
  "M216.999 9.99985C260.499 12.4998 222.499 71.9998 291.999 58.9998",
  "M130.102 70.9998C144.499 -32.0002 183.852 70.2739 219.999 3.99985",
  "M14.4999 16.9998C111 20.9998 -53.0003 73.4998 21.4999 107",
];
const STOP_DOTS = [[9.519,15.519],[289.519,59.518],[220.519,9.519],[125.518,78.519],[19.519,104.519]];
const MAP_ICONS = [
  { left: "26%", top: "28.9%", rotate: 0, flip: false, src: SHIP_IMG, delay: .3, dur: 2.5 },
  { left: "70.8%", top: "15.6%", rotate: 9.73, flip: false, src: CAR_IMG, delay: .5, dur: 3.3 },
  { left: "55.2%", top: "52.1%", rotate: 180, flip: true, src: PLANE_IMG, delay: .7, dur: 2.8 },
];

function MapBox(){
  return (
    <div className="map-box">
      <img className="map-bg" src={MAP_BG} alt=""/>
      <svg className="route-svg" viewBox="0 0 299.037 142.509">
        {ROUTE_PATHS.map((d, i) => (
          <g key={i}>
            <motion.path id={"route" + i} d={d} fill="none" stroke="#FFDA00" strokeWidth="2.5"
              initial={{ pathLength: 0 }} animate={{ pathLength: 1 }} transition={{ duration: 1, delay: i * 0.15, ease: EASE_OUT }}/>
            <polygon points="0,-4 8,0 0,4" fill="#FFDA00">
              <animateMotion dur="3s" begin={(i * 0.15) + "s"} repeatCount="indefinite" rotate="auto">
                <mpath href={"#route" + i}/>
              </animateMotion>
            </polygon>
          </g>
        ))}
        {STOP_DOTS.map(([cx, cy], i) => (
          <motion.g key={i} initial={{ scale: 0 }} animate={{ scale: 1 }} transition={{ delay: .5 + i * 0.1, duration: .4, ease: EXPO_OUT }}>
            <circle cx={cx} cy={cy} r="9.519" fill="#FFDA00"/>
            <circle cx={cx} cy={cy} r="3.389" fill="#002A35"/>
          </motion.g>
        ))}
      </svg>
      {MAP_ICONS.map((ic, i) => (
        <motion.div key={i} className="map-icon" style={{ left: ic.left, top: ic.top }}
          initial={{ scale: 0, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} transition={{ delay: ic.delay, duration: .5, ease: EXPO_OUT }}>
          <motion.div className="map-icon-inner" animate={{ y: [0, -7, 0] }} transition={{ duration: ic.dur, repeat: Infinity, ease: "easeInOut" }}>
            <img src={ic.src} alt="" style={{ transform: "rotate(" + ic.rotate + "deg)" + (ic.flip ? " scaleY(-1)" : "") }}/>
          </motion.div>
        </motion.div>
      ))}
    </div>
  );
}

function InfoSection(){
  return (
    <div className="info-screen">
      <div className="info-tagline">
        <motion.h2 className="info-h1" initial={{ opacity: 0, x: -50 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: .8, ease: EXPO_OUT }}>ЛОГИСТИКА</motion.h2>
        <motion.p className="info-sub" initial={{ opacity: 0, x: -30 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: .8, delay: .12, ease: EXPO_OUT }}>рождена масштабом<br/>движима точностью</motion.p>
      </div>
      <MapBox/>
      <div className="info-stats">
        <motion.div className="stat" initial={{ opacity: 0, x: -60 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: .8, ease: EXPO_OUT }}>
          <span className="stat-num">3M+</span>
          <p className="stat-text">тонн груза<br/>доставлено<br/>без задержек</p>
        </motion.div>
        <motion.div className="stat" style={{ marginLeft: 90 }} initial={{ opacity: 0, x: 60 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: .8, ease: EXPO_OUT }}>
          <span className="stat-num">13+</span>
          <p className="stat-text">лет надёжной<br/>и стабильной<br/>работы</p>
        </motion.div>
      </div>
    </div>
  );
}

function SocialIcon({ kind }){
  const paths = {
    instagram: <React.Fragment><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#0a1f2b" stroke="none"/></React.Fragment>,
    linkedin: <React.Fragment><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="8" y1="10" x2="8" y2="16"/><circle cx="8" cy="6.5" r="1" fill="#0a1f2b" stroke="none"/><path d="M12 16v-4a2 2 0 0 1 4 0v4"/><line x1="12" y1="10" x2="12" y2="16"/></React.Fragment>,
    facebook: <React.Fragment><rect x="3" y="3" width="18" height="18" rx="9"/><path d="M13.5 8.2h-1.1c-.9 0-1.4.5-1.4 1.4V11H9.3v2h1.7v5h2v-5h1.6l.3-2h-1.9V9.8c0-.4.2-.6.6-.6h1.3z" fill="#0a1f2b" stroke="none"/></React.Fragment>,
  };
  return (
    <motion.button type="button" className="social-icon" aria-label={kind} whileHover={{ scale: 1.15, y: -3 }}>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a1f2b" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{paths[kind]}</svg>
    </motion.button>
  );
}

function ContactSection(){
  return (
    <div className="contact-screen">
      <motion.h2 className="contact-h1" initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .8, ease: EXPO_OUT }}>
        <span className="white">ПИШИТЕ</span><span className="yellow"> НАМ</span>
      </motion.h2>
      <motion.p className="contact-sub" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .7, delay: .1, ease: EXPO_OUT }}>
        Заполните форму, и наша команда свяжется с вами в ближайшее время.
      </motion.p>
      <form className="contact-form" onSubmit={(e) => e.preventDefault()}>
        {["Имя","Фамилия","Email"].map((ph, i) => (
          <motion.input key={ph} type={ph === "Email" ? "email" : "text"} placeholder={ph} className="contact-input"
            initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .6, delay: .15 + i * 0.1, ease: EASE_OUT }}
            whileFocus={{ scale: 1.01, backgroundColor: "rgba(255,255,255,0.14)" }}/>
        ))}
        <motion.button type="submit" className="contact-submit" whileHover={{ scale: 1.03, y: -2, backgroundColor: "#ffe84d" }} whileTap={{ scale: .97 }}>Отправить</motion.button>
      </form>
      <div className="contact-links">
        <motion.a href="mailto:info@cargox-group.com" className="contact-link" whileHover={{ color: "#fff", x: 4 }}>info@cargox-group.com</motion.a>
        <motion.a href="tel:+380442347890" className="contact-link" whileHover={{ color: "#fff", x: 4 }}>+380 44 234-7890</motion.a>
      </div>
      <div className="contact-footer-row">
        <div className="social-row">
          <SocialIcon kind="instagram"/>
          <SocialIcon kind="linkedin"/>
          <SocialIcon kind="facebook"/>
        </div>
        <motion.button type="button" className="scroll-top-btn" aria-label="Наверх" whileHover={{ scale: 1.15, y: -3 }}
          onClick={(e) => { const s = e.currentTarget.closest(".screen-inner"); if (s) s.scrollTo({ top: 0, behavior: "smooth" }); }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a1f2b" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </motion.button>
      </div>
      <p className="contact-copy">(c) 2025. Все права защищены.</p>
    </div>
  );
}

function PhoneChrome({ children }){
  return (
    <React.Fragment>
      <div className="notch"/>
      <div className="screen"><div className="screen-inner">{children}</div></div>
      <div className="home-indicator"/>
    </React.Fragment>
  );
}

function usePhoneZoom(){
  useEffect(() => {
    const apply = () => {
      const z = window.innerWidth <= 900 ? Math.min(1, (window.innerWidth - 40) / 393) : 1;
      document.querySelectorAll(".phone-mockup").forEach((el) => { el.style.zoom = z; });
    };
    apply();
    window.addEventListener("resize", apply);
    return () => window.removeEventListener("resize", apply);
  }, []);
}
