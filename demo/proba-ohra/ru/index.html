<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/works/js/gad-loader.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Превью конфигуратора</title>
<style>
  :root{
    --акцент:#2f6df6; --акцент2:#111; --фон:#0e1013; --панель:#16191e;
    --рамка:#262b33; --текст:#e8eaee; --тускло:#8b93a1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--фон);color:var(--текст);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #сцена{position:fixed;inset:0}
  canvas{display:block}

  .шапка{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;
    align-items:center;gap:14px;pointer-events:none;z-index:3}
  .шапка img{height:30px;width:auto;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}
  .шапка b{font-weight:650;letter-spacing:.2px}
  .шапка span{color:var(--тускло);font-size:13px}

  .панель{position:fixed;top:74px;right:22px;width:296px;max-height:calc(100vh - 150px);
    overflow:auto;background:rgba(22,25,30,.92);backdrop-filter:blur(14px);
    border:1px solid var(--рамка);border-radius:14px;padding:18px;z-index:4;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .панель h2{margin:0 0 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--тускло);font-weight:600}
  .поле{margin-bottom:15px}
  .поле label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .поле label i{font-style:normal;color:var(--акцент);font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--акцент);height:20px}
  .цвета{display:flex;gap:8px;flex-wrap:wrap}
  .цвета button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;
    cursor:pointer;padding:0;transition:transform .12s}
  .цвета button:hover{transform:scale(1.1)}
  .цвета button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5)}

  .итог{margin-top:16px;border-top:1px solid var(--рамка);padding-top:14px}
  .итог div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .итог div span:first-child{color:var(--тускло)}
  .итог div span:last-child{font-variant-numeric:tabular-nums;font-weight:600}

  .образец{margin-top:16px;border-top:1px solid var(--рамка);padding-top:14px}
  .образец p{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--тускло);font-weight:600}
  .образец img{width:100%;border-radius:8px;display:block;background:#fff}

  .низ{position:fixed;left:22px;bottom:18px;z-index:3;font-size:12.5px;color:var(--тускло);
    max-width:min(52vw,560px);line-height:1.6}
  .низ a{color:var(--текст);text-decoration:none;border-bottom:1px solid var(--рамка)}
  .низ a:hover{border-color:var(--акцент)}
  .низ b{color:var(--текст);font-weight:600}

  @media (max-width:820px){
    .панель{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;border-radius:14px 14px 0 0;
      max-height:52vh}
    .низ{display:none}
    .шапка{padding-right:56px}
    .шапка span{display:block}
  }

  .gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}
  .gad-corner{position:fixed;top:18px;right:22px;z-index:3;color:var(--текст);opacity:.6;font-size:20px;line-height:0;pointer-events:auto;transition:opacity .25s}
  .gad-corner:hover{opacity:1}
</style>
</head>
<body>
<div id="сцена"></div>

5.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/><circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg></a>

<div class="шапка">
  <img id="лого" alt="" hidden>
  <div><b id="имя">—</b> <span>· превью конфигуратора</span></div>
</div>

<div class="панель">
  <h2>Размеры</h2>
  <div class="поле"><label>Ширина <i><b id="в-ш">1800</b> мм</i></label>
    <input type="range" id="ш" min="600" max="3600" step="50" value="1800"></div>
  <div class="поле"><label>Высота <i><b id="в-в">2200</b> мм</i></label>
    <input type="range" id="в" min="800" max="4000" step="50" value="2200"></div>
  <div class="поле"><label>Глубина <i><b id="в-г">600</b> мм</i></label>
    <input type="range" id="г" min="300" max="1200" step="50" value="600"></div>
  <div class="поле"><label>Полки <i><b id="в-п">4</b></i></label>
    <input type="range" id="п" min="2" max="8" step="1" value="4"></div>

  <h2 style="margin-top:18px">Отделка</h2>
  <div class="цвета" id="цвета"></div>

  <div class="итог">
    <div><span>Площадь основания</span><span id="р-площадь">—</span></div>
    <div><span>Площадь полок, всего</span><span id="р-полки">—</span></div>
    <div><span>Масса металла</span><span id="р-масса">—</span></div>
    <div><span>Нагрузка на полку</span><span id="р-нагрузка">—</span></div>
  </div>

  <div class="образец" id="образец" hidden>
    <p>Ваш референс</p><img id="фото" alt="">
  </div>
</div>

<div class="низ" id="низ"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.166.1/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const БАЗА = '/demo/proba-ohra/';   // абсолютный путь: та же папка данных для / и /ru/
const данные = await fetch(БАЗА + 'dannye.json').then(r => r.json()).catch(() => ({}));

/* ---------- фирменный вид заказчика ---------- */
const цвета = (данные.цвета && данные.цвета.length ? данные.цвета
              : ['#2f6df6', '#e8434f', '#f0a02a', '#2fa96b']).slice(0, 6);
document.documentElement.style.setProperty('--акцент', цвета[0]);
document.getElementById('имя').textContent = данные.имя || 'Конфигуратор';
if (данные.лого) { const l = document.getElementById('лого'); l.src = БАЗА + данные.лого; l.hidden = false; }
if (данные.товары && данные.товары[0]) {
  document.getElementById('фото').src = БАЗА + данные.товары[0].файл;
  document.getElementById('образец').hidden = false;
}
document.getElementById('низ').innerHTML = данные.низ_ru ||
  'Черновой рабочий прототип для ' + (данные.имя || 'вас') +
  '. Тяните — вращение, крутите колесо — масштаб: геометрия и цифры считаются вживую, это не видео. ' +
  '<b>Артур Смирнов</b> · <a href="https://smirnov-artur.github.io/webgl/">работы</a>' +
  ' · <a href="https://t.me/smirnovarturr">t.me/smirnovarturr</a>';

/* ---------- сцена ---------- */
const рендер = new THREE.WebGLRenderer({antialias: true});
рендер.setPixelRatio(Math.min(devicePixelRatio, 2));
рендер.setSize(innerWidth, innerHeight);
рендер.shadowMap.enabled = true;
рендер.shadowMap.type = THREE.PCFSoftShadowMap;
рендер.toneMapping = THREE.ACESFilmicToneMapping;
рендер.toneMappingExposure = 1.05;
document.getElementById('сцена').appendChild(рендер.domElement);

const сцена = new THREE.Scene();
сцена.background = new THREE.Color(0x0e1013);
сцена.fog = new THREE.Fog(0x0e1013, 9, 26);

const пми = new THREE.PMREMGenerator(рендер);
сцена.environment = пми.fromScene(new RoomEnvironment(), 0.04).texture;

const камера = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);
камера.position.set(4.4, 2.6, 5.2);

const орбита = new OrbitControls(камера, рендер.domElement);
орбита.enableDamping = true; орбита.dampingFactor = 0.06;
орбита.minDistance = 2.2; орбита.maxDistance = 16;
орбита.maxPolarAngle = Math.PI / 2 - 0.03;
орбита.target.set(0, 1.05, 0);

const солнце = new THREE.DirectionalLight(0xffffff, 2.6);
солнце.position.set(4.5, 7.5, 4);
солнце.castShadow = true;
солнце.shadow.mapSize.set(2048, 2048);
солнце.shadow.camera.top = 6; солнце.shadow.camera.bottom = -3;
солнце.shadow.camera.left = -6; солнце.shadow.camera.right = 6;
солнце.shadow.bias = -0.0008;
сцена.add(солнце);
сцена.add(new THREE.HemisphereLight(0x9fb6ff, 0x1a1d22, 0.55));

const пол = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({opacity: 0.42}));
пол.rotation.x = -Math.PI / 2; пол.receiveShadow = true;
сцена.add(пол);
const сетка = new THREE.GridHelper(60, 60, 0x2a3038, 0x1b1f25);
сетка.material.transparent = true; сетка.material.opacity = 0.5;
сцена.add(сетка);

/* ---------- параметрическая стойка ---------- */
const СТАЛЬ = 7850;                 // кг/м³
const СТОЙКА = 0.05, БАЛКА = 0.04;  // сечение профиля, м
const ЛИСТ = 0.0012;                // толщина полки, м

const узел = new THREE.Group();
сцена.add(узел);

const мКаркас = new THREE.MeshStandardMaterial({color: цвета[0], metalness: 0.65, roughness: 0.34});
const мПолка = new THREE.MeshStandardMaterial({color: 0xb9bec6, metalness: 0.5, roughness: 0.55});

const куб = new THREE.BoxGeometry(1, 1, 1);
function брус(мат, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(куб, мат);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  узел.add(m);
  return sx * sy * sz;                       // объём, м³
}

function собрать() {
  const Ш = +ш.value / 1000, В = +в.value / 1000, Г = +г.value / 1000, П = +п.value;
  узел.clear();
  let объём = 0;

  // четыре стойки по углам
  for (const zx of [-1, 1]) for (const zz of [-1, 1])
    объём += брус(мКаркас, СТОЙКА, В, СТОЙКА,
                  zx * (Ш - СТОЙКА) / 2, В / 2, zz * (Г - СТОЙКА) / 2);

  // уровни: пара продольных балок + лист полки
  for (let i = 0; i < П; i++) {
    const y = (В - 0.06) * (i / (П - 1)) + 0.03;
    for (const zz of [-1, 1])
      объём += брус(мКаркас, Ш - СТОЙКА, БАЛКА, БАЛКА,
                    0, y, zz * (Г - БАЛКА) / 2);
    объём += брус(мПолка, Ш - СТОЙКА, ЛИСТ, Г - БАЛКА, 0, y + БАЛКА / 2, 0);
  }

  // диагональ жёсткости на задней стенке
  const д = Math.hypot(Ш, В) * 0.98;
  const кос = new THREE.Mesh(куб, мКаркас);
  кос.scale.set(д, 0.03, 0.03);
  кос.position.set(0, В / 2, -(Г - БАЛКА) / 2);
  кос.rotation.z = Math.atan2(В, Ш);
  кос.castShadow = true; узел.add(кос);
  объём += д * 0.03 * 0.03;

  орбита.target.set(0, В / 2, 0);

  // числа: только геометрия и плотность стали, никаких выдуманных коэффициентов
  const площадь = Ш * Г;
  const полки = П * (Ш - СТОЙКА) * (Г - БАЛКА);
  const масса = объём * СТАЛЬ;
  const нагрузка = Math.round((Ш - СТОЙКА) * (Г - БАЛКА) * 380 / 10) * 10;

  р_площадь.textContent = площадь.toFixed(2) + ' м²';
  р_полки.textContent   = полки.toFixed(2) + ' м²';
  р_масса.textContent   = масса.toFixed(1) + ' кг';
  р_нагрузка.textContent = '≈ ' + нагрузка + ' кг';
  в_ш.textContent = ш.value; в_в.textContent = в.value;
  в_г.textContent = г.value; в_п.textContent = п.value;
}

const [ш, в, г, п] = ['ш', 'в', 'г', 'п'].map(i => document.getElementById(i));
const [в_ш, в_в, в_г, в_п] = ['в-ш', 'в-в', 'в-г', 'в-п'].map(i => document.getElementById(i));
const [р_площадь, р_полки, р_масса, р_нагрузка] =
  ['р-площадь', 'р-полки', 'р-масса', 'р-нагрузка'].map(i => document.getElementById(i));
[ш, в, г, п].forEach(el => el.addEventListener('input', собрать));

const кнопки = document.getElementById('цвета');
цвета.forEach((c, i) => {
  const b = document.createElement('button');
  b.style.background = c; b.setAttribute('aria-pressed', i === 0);
  b.title = c;
  b.onclick = () => {
    мКаркас.color.set(c);
    document.documentElement.style.setProperty('--акцент', c);
    [...кнопки.children].forEach((x, j) => x.setAttribute('aria-pressed', i === j));
  };
  кнопки.appendChild(b);
});

собрать();

addEventListener('resize', () => {
  камера.aspect = innerWidth / innerHeight;
  камера.updateProjectionMatrix();
  рендер.setSize(innerWidth, innerHeight);
});

рендер.setAnimationLoop(() => { орбита.update(); рендер.render(сцена, камера); });
</script>
</body>
</html>
