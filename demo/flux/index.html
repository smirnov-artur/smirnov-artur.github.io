    <title>g.a.d. — Closed beta</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8C%B8%3C%2Ftext%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000; min-height: 100vh; overflow: hidden; position: relative;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. Top gradient overlay */
        #top-gradient { position: fixed; top: -30vh; left: 0; width: 100vw; height: auto; display: block; z-index: 0; pointer-events: none; }

        /* 2. Hero content */
        .hero-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 6vh; width: 95%; max-width: 1100px; margin: 0 auto; }
        .hero-title { font-family: 'Playfair Display', Georgia, serif; font-size: 2.8rem; font-weight: 400; color: #ffffff; line-height: 1.15; margin-bottom: 2.2rem; letter-spacing: -0.015em; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .hero-btn { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 500; letter-spacing: 0.02em; color: #ffffff; background-color: #000000; border: 1px solid rgba(255,255,255,0.18); padding: 1.3rem 2.5rem; border-radius: 9999px; display: inline-flex; align-items: center; gap: 0.9rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 4px 25px rgba(0,0,0,0.4); outline: none; }
        .hero-btn:hover { background-color: #ffffff; color: #000000; border-color: #ffffff; transform: translateY(-2px); box-shadow: 0 6px 30px rgba(0,0,0,0.3); }
        .hero-btn:active { transform: translateY(0); }
        .blinking-dot { width: 10px; height: 10px; background-color: #16E0FF; border-radius: 50%; position: relative; display: inline-block; animation: pulse-glow 2s infinite ease-in-out; }
        .blinking-dot::after { content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; background-color: rgba(22,224,255,0.45); border-radius: 50%; animation: wave-expand 2s infinite ease-in-out; }
        @keyframes pulse-glow { 0%,100% { opacity: 0.5; transform: scale(0.85); box-shadow: 0 0 4px rgba(22,224,255,0.3); } 50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 12px rgba(22,224,255,0.9); } }
        @keyframes wave-expand { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(2.3); opacity: 0; } }

        /* 3. Footer block */
        .footer-container { position: fixed; top: 50vh; left: 20px; right: 20px; width: calc(100vw - 40px); transform: translateY(-50%); z-index: 3; display: flex; flex-direction: column; }
        .footer-top { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 0 5px; }
        .footer-title { font-family: 'General Sans', -apple-system, sans-serif; font-size: 1.4rem; font-weight: 400; color: #ffffff; letter-spacing: -0.015em; margin: 0; }
        .footer-title.quote { text-transform: none; }
        .footer-divider { border: none; height: 1px; background-color: rgba(255,255,255,0.2); margin: 1.6rem 0; width: 100%; }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; }
        .footer-socials { display: flex; gap: 1.25rem; align-items: center; flex: 1; }
        .social-icon { color: rgba(255,255,255,0.55); transition: all 0.3s cubic-bezier(0.16,1,0.3,1); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
        .social-icon:hover { color: #ffffff; transform: translateY(-2px); }
        .footer-links { display: flex; gap: 2.8rem; justify-content: center; align-items: center; flex: 2; }
        .footer-link { font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 400; color: #ffffff; text-decoration: none; letter-spacing: 0.03em; transition: opacity 0.3s ease, transform 0.3s ease; }
        .footer-link:hover { opacity: 0.75; transform: translateY(-1px); }
        .footer-copyright { font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 400; color: rgba(255,255,255,0.45); text-align: right; flex: 1; letter-spacing: 0.02em; }

        /* 4. Giant wordmark */
        .footer-logo-wrap { position: fixed; bottom: 20px; left: 0; right: 0; width: 100%; padding: 0 20px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; z-index: 3; margin: 0; }
        .footer-logo-text { font-family: 'General Sans', -apple-system, sans-serif; font-size: 21.9vw; font-weight: 400; color: #ffffff; letter-spacing: -0.03em; margin-right: -0.03em; transform: translateX(-20px); line-height: 0.8; margin-top: 0; margin-bottom: 0; margin-left: 0; text-align: center; width: 100%; pointer-events: none; opacity: 0.95; text-shadow: none; white-space: nowrap; }

        .footer-logo { margin: 0; line-height: 0; color: #ffffff; opacity: 0.95; pointer-events: none; }
        .footer-logo .gad-logo { height: 22vw; opacity: 0; transform: translateX(-6%); filter: blur(20px); animation: gad-big-in 1.4s cubic-bezier(0.05,0.9,0.1,1) 0.15s forwards; }
        @keyframes gad-big-in { 30% { opacity: 1; } 100% { opacity: 1; transform: none; filter: blur(0); } }
        @media (max-width: 640px) { .footer-logo .gad-logo { height: 19vw; } }
        @media (prefers-reduced-motion: reduce) { .footer-logo .gad-logo { animation: none; opacity: 1; transform: none; filter: none; } }
        /* 5. Background video — постер лежит фоном под кадром: он приезжает
              первым и держит кадр, пока видео ещё качается */
        .video-container { position: fixed; bottom: 0; left: 0; width: 100vw; height: 90vh; overflow: hidden; z-index: -1; background-color: #000; }
        .video-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: -10%; background: url('./assets/flower-poster.jpg') center/cover no-repeat; }
        #bg-video { position: relative; width: 100%; height: 110%; object-fit: cover; display: block; transform: translateY(0%); }
        @media (max-width: 640px) { .video-container::before { background-image: url('./assets/flower-poster-ld.jpg'); } }

        /* 6. Custom cursor */
        .glass-cursor-card { position: fixed; top: 0; left: 0; z-index: 99999; pointer-events: none; padding: 0.75rem 1.5rem; background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.18); border-radius: 9999px; box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.15); transform: translate(-50%,-50%) scale(0); opacity: 0; will-change: transform, opacity; transition: opacity 0.4s cubic-bezier(0.16,1,0.3,1), background 0.35s cubic-bezier(0.16,1,0.3,1), border-color 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s cubic-bezier(0.16,1,0.3,1); }
        .glass-cursor-card.active { opacity: 1; }
        .glass-cursor-card.dark-mode { background: rgba(0,0,0,0.82); border-color: rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05); }
        .cursor-card-text { font-family: 'General Sans', -apple-system, sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.06em; color: #16E0FF; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 8px rgba(22,224,255,0.45); }
        .cursor-card-text .text-white { color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.25); }
        .cursor-ring-outline { position: fixed; top: 0; left: 0; width: 48px; height: 48px; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 50%; z-index: 99998; pointer-events: none; transform: translate(-50%,-50%) scale(0); opacity: 0; will-change: transform, opacity; transition: opacity 0.4s cubic-bezier(0.16,1,0.3,1), border-color 0.4s ease; }
        .cursor-ring-outline.active { opacity: 1; }
        .cursor-ring-outline.expanded { border-color: rgba(255,255,255,0.15); }

        /* 7. Author CTA — sits under the custom cursor layer on purpose */
        .author-cta { position: fixed; bottom: 60px; right: 24px; z-index: 99990; display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.15rem; border-radius: 9999px; text-decoration: none; background: rgba(0,0,0,0.72); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border: 1px solid rgba(22,224,255,0.28); box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 8px 28px rgba(0,0,0,0.55), inset 0 1px 0 0 rgba(255,255,255,0.07); opacity: 0; transform: translateY(14px); filter: blur(10px); animation: cta-reveal 1.1s cubic-bezier(0.16,1,0.3,1) 1.5s forwards; transition: border-color 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s cubic-bezier(0.16,1,0.3,1), background 0.35s cubic-bezier(0.16,1,0.3,1); }
        .author-cta__label { font-family: 'General Sans', -apple-system, sans-serif; font-size: 0.8rem; font-weight: 400; letter-spacing: 0.01em; color: rgba(255,255,255,0.62); white-space: nowrap; transition: color 0.35s ease; }
        .author-cta__handle { font-family: 'General Sans', -apple-system, sans-serif; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.02em; color: #16E0FF; white-space: nowrap; text-shadow: 0 0 10px rgba(22,224,255,0.5); transition: text-shadow 0.35s ease; }
        .author-cta__icon { flex: none; color: #16E0FF; opacity: 0.85; transform: translateX(0); transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.35s ease; filter: drop-shadow(0 0 5px rgba(22,224,255,0.55)); }
        .author-cta:hover { border-color: rgba(22,224,255,0.65); background: rgba(0,0,0,0.82); box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 8px 34px rgba(0,0,0,0.6), 0 0 24px rgba(22,224,255,0.22), inset 0 1px 0 0 rgba(255,255,255,0.1); }
        .author-cta:hover .author-cta__label { color: rgba(255,255,255,0.9); }
        .author-cta:hover .author-cta__handle { text-shadow: 0 0 16px rgba(22,224,255,0.85); }
        .author-cta:hover .author-cta__icon { transform: translateX(3px); opacity: 1; }
        .author-cta:focus-visible { outline: 2px solid #16E0FF; outline-offset: 3px; }
        @keyframes cta-reveal { 0% { opacity: 0; transform: translateY(14px); filter: blur(10px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @media (max-width: 640px) { .author-cta { bottom: max(16px, env(safe-area-inset-bottom) + 10px); right: 14px; padding: 0.6rem 0.95rem; gap: 0.45rem; } .author-cta__label, .author-cta__handle { font-size: 0.72rem; } }
        @media (prefers-reduced-motion: reduce) { .author-cta { animation-duration: 0.01ms; animation-delay: 0ms; } }

        /* Entrance reveals */
        .hero-title .word-wrapper { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 0.15em; margin-bottom: -0.15em; }
        .hero-title .word-inner { display: inline-block; opacity: 0; transform: translateY(105%); filter: blur(20px); animation: word-reveal-mask 1.3s cubic-bezier(0.05,0.9,0.1,1) forwards; }
        @keyframes word-reveal-mask { 0% { opacity: 0; transform: translateY(105%); filter: blur(20px); } 30% { opacity: 1; } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }

        .footer-logo-text .letter-wrapper { display: inline-block; overflow: hidden; vertical-align: bottom; line-height: 0.8; }
        .footer-logo-text .letter-inner { display: inline-block; opacity: 0; transform: translateX(-105%); filter: blur(20px); animation: letter-reveal-mask 1.2s cubic-bezier(0.05,0.9,0.1,1) forwards; }
        @keyframes letter-reveal-mask { 0% { opacity: 0; transform: translateX(-105%); filter: blur(20px); } 25% { opacity: 1; } 100% { opacity: 0.95; transform: translateX(0); filter: blur(0); } }

        /* Телефон: тот же кадр, но заголовок и подвал перестают вылезать за экран */
        @media (max-width: 640px) {
            .hero-content { padding-top: max(4.5vh, env(safe-area-inset-top) + 1.4rem); width: 92%; }
            /* подвал ложится на светлые лепестки — под ним нужна подложка, иначе ссылки не читаются */
            .footer-container::before {
                content: ""; position: absolute; inset: -1.1rem -0.9rem -1.2rem;
                background: linear-gradient(180deg, rgba(6,4,16,0) 0%, rgba(6,4,16,0.62) 18%, rgba(6,4,16,0.62) 82%, rgba(6,4,16,0) 100%);
                z-index: -1; pointer-events: none;
            }
            .hero-title { font-size: clamp(1.55rem, 7vw, 2.1rem); margin-bottom: 1.7rem; }
            .hero-btn { font-size: 0.95rem; padding: 1rem 1.9rem; gap: 0.7rem; }
            .footer-container { top: 47vh; left: 14px; right: 14px; width: calc(100vw - 28px); }
            .footer-top { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
            .footer-title { font-size: 1.05rem; }
            .footer-divider { margin: 1.05rem 0; }
            .footer-bottom { flex-wrap: wrap; row-gap: 0.9rem; }
            .footer-socials { flex: 0 0 auto; order: 1; gap: 1.1rem; }
            .footer-copyright { flex: 0 0 auto; order: 2; margin-left: auto; font-size: 0.8rem; }
            .footer-links { order: 3; flex: 1 0 100%; justify-content: flex-start; gap: 1.5rem; }
            .footer-link { font-size: 0.85rem; }
            .footer-logo-wrap { bottom: max(72px, env(safe-area-inset-bottom) + 66px); padding: 0 12px; }
            .footer-logo-text { font-size: 20.5vw; transform: none; letter-spacing: -0.035em; }
        }

        /* Сокращённое движение: текст на месте, курсорного слоя нет */
        @media (prefers-reduced-motion: reduce) {
            .hero-title .word-inner { animation: none; opacity: 1; transform: none; filter: none; }
            .footer-logo-text .letter-inner { animation: none; opacity: 0.95; transform: none; filter: none; }
            .blinking-dot, .blinking-dot::after { animation: none; }
            .glass-cursor-card, .cursor-ring-outline { display: none; }
        }
    </style>
<style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoText = document.querySelector('.footer-logo-text');
            if (logoText) {
                const text = logoText.textContent.trim();
                logoText.innerHTML = '';
                [...text].forEach((char, index) => {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'letter-wrapper';
                    const inner = document.createElement('span');
                    inner.textContent = char === ' ' ? ' ' : char;
                    inner.className = 'letter-inner';
                    inner.style.animationDelay = `${index * 0.09}s`;
                    wrapper.appendChild(inner);
                    logoText.appendChild(wrapper);
                });
            }
            const heroTitle = document.querySelector('.hero-title');
            if (heroTitle) {
                const text = heroTitle.innerHTML;
                const parts = text.split(/(\s+|<br\s*\/?>)/i);
                heroTitle.innerHTML = '';
                let wordIndex = 0;
                parts.forEach(part => {
                    if (part.trim() === '') { heroTitle.appendChild(document.createTextNode(' ')); }
                    else if (part.toLowerCase().startsWith('<br')) { heroTitle.appendChild(document.createElement('br')); }
                    else {
                        const wrapper = document.createElement('span'); wrapper.className = 'word-wrapper';
                        const inner = document.createElement('span'); inner.className = 'word-inner'; inner.textContent = part;
                        inner.style.animationDelay = `${wordIndex * 0.1}s`; wordIndex++;
                        wrapper.appendChild(inner); heroTitle.appendChild(wrapper);
                    }
                });
            }
            const glassCard = document.getElementById('glass-card');
            const cursorRing = document.getElementById('cursor-ring');
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (glassCard && cursorRing && !reduced) {
                let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
                let cardX = mouseX, cardY = mouseY, ringX = mouseX, ringY = mouseY;
                let isFirstMove = true, scale = 0, targetScale = 0, isHoveringBtn = false;
                document.addEventListener('mousemove', (e) => {
                    mouseX = e.clientX; mouseY = e.clientY;
                    if (isFirstMove) { cardX = mouseX; cardY = mouseY; ringX = mouseX; ringY = mouseY; isFirstMove = false; glassCard.classList.add('active'); cursorRing.classList.add('active'); }
                    if (!isHoveringBtn) { targetScale = 1; }
                });
                document.addEventListener('mouseleave', () => { targetScale = 0; });
                document.addEventListener('mouseenter', () => { if (!isHoveringBtn) { targetScale = 1; } });
                document.querySelectorAll('.hero-btn, .author-cta').forEach(target => {
                    target.addEventListener('mouseenter', () => { isHoveringBtn = true; targetScale = 0; cursorRing.classList.add('expanded'); });
                    target.addEventListener('mouseleave', () => { isHoveringBtn = false; targetScale = 1; cursorRing.classList.remove('expanded'); });
                });
                const updatePhysics = () => {
                    cardX += (mouseX - cardX) * 0.08; cardY += (mouseY - cardY) * 0.08;
                    ringX = mouseX; ringY = mouseY;
                    scale += (targetScale - scale) * 0.15;
                    const currentRingScale = cursorRing.classList.contains('expanded') ? 1.6 * scale : scale;
                    glassCard.style.transform = `translate3d(${cardX}px, ${cardY}px, 0) translate(-50%, -50%) scale(${scale})`;
                    cursorRing.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%) scale(${currentRingScale})`;
                    requestAnimationFrame(updatePhysics);
                };
                updatePhysics();
            }
        });
    </script>
