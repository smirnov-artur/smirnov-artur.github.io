function Navbar({ menuOpen, setMenuOpen }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <nav className={`fixed top-0 left-0 right-0 z-50 h-16 md:h-20 px-6 sm:px-10 md:px-16 lg:px-20 flex items-center justify-between transition-all duration-300 ${scrolled ? 'bg-black/60 backdrop-blur-md' : 'bg-transparent'}`}>

      <div className="hidden lg:flex items-center gap-8">
        {NAV_LINKS.map(l => <a key={l} href="#top" className="text-white/70 text-xs uppercase tracking-[0.2em] font-light hover:text-white transition-colors duration-200">{l}</a>)}
      </div>
      <div className="hidden lg:flex items-center gap-3">
        <a href="#top" className="px-5 py-2.5 border border-white/30 text-white text-xs uppercase tracking-[0.15em] font-light hover:border-white/60 transition-all duration-200">Связаться</a>
        <a href="#top" className="px-5 py-2.5 bg-white text-black text-xs uppercase tracking-[0.15em] font-medium hover:bg-white/90 transition-all duration-200">Записаться</a>
      </div>

        <span className="w-6 h-[1.5px] bg-white transition-all duration-300 ease-out" style={{ transform: menuOpen ? 'translateY(6px) rotate(45deg)' : 'none' }} />
        <span className="w-6 h-[1.5px] bg-white transition-all duration-300 ease-out" style={{ opacity: menuOpen ? 0 : 1, transform: menuOpen ? 'scale(0)' : 'scale(1)' }} />
        <span className="w-6 h-[1.5px] bg-white transition-all duration-300 ease-out" style={{ transform: menuOpen ? 'translateY(-6px) rotate(-45deg)' : 'none' }} />
      </button>
    </nav>
  );
}

function MobileMenu({ open, onClose }) {
  return (

        ))}

function App() {

  useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';

}
