<style>

.viewport { position: fixed; inset: 0; isolation: isolate; background: #000; }
.screen {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);

  --gutter-start: clamp(36px, 4.177vw, 96px);

  --copy-cta-gap: clamp(24px, 3.11vh, 36px);
  --cta-width: clamp(142px, 15.09vh, 168px);
  --cta-height: clamp(38px, 3.96vh, 44px);
  --compact-control-font-size: clamp(17px, 1.75vh, 19px);
  --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
  --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
  --control-inline-nudge: -1px;
  --control-baseline-shift: clamp(1px, .19vh, 2px);
  --copy-optical-shift: clamp(0px, .1vh, 1px);
  --watch-baseline-shift: clamp(2px, .38vh, 4px);
  --card-width: clamp(150px, 18.96vh, 215px);
}
.background {
  position: absolute; inset: 0; z-index: -3; width: 100%; height: 100%;
  object-fit: cover; object-position: center; pointer-events: none; user-select: none;
}
.screen::before {
  content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;

    linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
    radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
}

/* шапка */
.header {
  position: absolute; inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
  height: 48px; display: flex; align-items: flex-start; white-space: nowrap; z-index: 5;
}
.brand { position: relative; top: 10px; display: block; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
.brand svg { display: block; height: 25px; width: auto; overflow: visible; }
.brand svg text { font-family: 'Unbounded', sans-serif; }
.brand .ring { animation: gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards; }
.brand .orb { opacity: 0; transform-box: view-box; transform-origin: 322px 30px; animation: gad-pop .3s ease 1.35s forwards, gad-orbit 7s linear 1.35s infinite; }
@keyframes gad-draw { to { stroke-dashoffset: 0; } }
@keyframes gad-pop { to { opacity: 1; } }
@keyframes gad-orbit { to { transform: rotate(360deg); } }

.header-actions { display: flex; align-items: flex-start; flex: 1; }
.nav { position: relative; top: 9px; display: flex; gap: clamp(32px, 2.9vw, 43px); margin-left: clamp(36px, 3.03vw, 48px); }
.nav a {
  position: relative; font-size: 16px; font-weight: 430; letter-spacing: -.36px;
  color: rgba(229,229,230,.77); text-shadow: 0 1px 3px rgba(0,0,0,.55);
}
.nav a:first-child { top: -3px; }
.nav a:nth-child(4) { margin-left: 1px; }
.nav a.active { color: #fff; }
.nav a.active::after { content: ""; position: absolute; left: 0; top: calc(100% + 7px); width: 44px; height: 2px; background: rgba(255,255,255,.82); }
.time-panel {
  margin-left: auto; width: 211px; height: 48px; padding-left: 8px;
  border-left: 2px solid rgba(230,230,230,.52);
  display: flex; flex-direction: column; justify-content: center; gap: 1px; font-size: 15px; line-height: 1.25;
}
.time-panel .label { font-weight: 420; color: rgba(240,240,240,.77); }
.time-panel .value { font-weight: 440; color: rgba(255,255,255,.93); white-space: pre; }
.sign-up {
  flex: none; margin-left: clamp(20px, 1.95vw, 29px); min-width: 109px; height: 42px; padding: 0 16px; border: 0; border-radius: 7px;
  background: #fff; color: #101010; font-size: var(--compact-control-font-size); font-weight: 460; letter-spacing: -.34px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34); cursor: pointer;
}
.sign-up span { position: relative; top: var(--control-baseline-shift); left: var(--control-inline-nudge); }
.menu-toggle {
  display: none; margin-left: auto; width: 46px; height: 46px; padding: 0; border-radius: 11px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.16);
  background: linear-gradient(145deg, rgba(26,34,36,.72), rgba(10,18,20,.8));
  box-shadow: 0 0 0 1px rgba(255,255,255,.03) inset, 0 2px 10px rgba(0,0,0,.4);
  -webkit-backdrop-filter: blur(14px) saturate(108%); backdrop-filter: blur(14px) saturate(108%);
}
.menu-toggle svg { display: block; margin: auto; width: 20px; height: 20px; }
.menu-toggle line { transition: transform .3s cubic-bezier(.16,1,.3,1); transform-box: fill-box; transform-origin: center; }
.header.menu-open .menu-toggle .l1 { transform: translateY(3.5px) rotate(45deg); }
.header.menu-open .menu-toggle .l2 { transform: translateY(-3.5px) rotate(-45deg); }

/* главный блок */
.hero-content { position: absolute; left: var(--gutter-start); bottom: var(--hero-bottom); display: flex; flex-direction: column; align-items: flex-start; z-index: 2; }
.hero-title {
  margin: 0; font-family: "Onest", "Reference Sans", Arial, sans-serif; font-weight: 500; font-optical-sizing: auto;
  font-size: var(--display-size); line-height: var(--display-leading); letter-spacing: -2.1px;
  -webkit-text-stroke: .12px currentColor; white-space: nowrap; text-shadow: 0 2px 2px rgba(0,0,0,.44);
}
.line { display: block; transform-origin: left center; }
.line-reveal { display: block; }
.line-one { color: #fff; transform: scaleX(.775); }
.line-two { color: rgba(211, 207, 207, .78); transform: scaleX(.793); }
.hero-copy {
  position: relative; left: 1px; top: var(--copy-optical-shift); margin: var(--title-copy-gap) 0 0;
  width: clamp(390px, 31.67vw, 500px); font-size: var(--copy-size); line-height: var(--copy-leading);
  font-weight: 350; letter-spacing: .13px; color: rgba(226, 229, 228, .84); text-shadow: 0 1px 3px rgba(0,0,0,.7);
}
.primary-cta {

  border: 0; border-radius: 7px; background: #fff; color: #111; box-shadow: 0 1px 5px rgba(0,0,0,.38);

}
.primary-cta .label { position: absolute; left: 8.125%; top: 50%; transform: translateY(calc(-50% + var(--control-baseline-shift) / 2)); font-weight: 450; letter-spacing: -.3px; white-space: nowrap; }

.primary-cta .arrow-box svg { width: 14px; height: 14px; display: block; }

/* карточка демо */
.demo-card {
  position: absolute; right: var(--gutter-end); bottom: var(--hero-bottom); width: var(--card-width);
  aspect-ratio: 201 / 265; container-type: inline-size; z-index: 2; transform-origin: 82% 50%;
  border: 1px solid rgba(255,255,255,.13); border-radius: clamp(12px, 1.52vh, 18px);
  background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));

}

.play {

.motion-pending .line { overflow: hidden; }
.motion-pending .line-one .line-reveal { animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms both; }
.motion-pending .line-two .line-reveal { animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms both; }

@media (min-width: 620px) and (max-width: 790px), (min-width: 620px) and (max-width: 1100px) and (orientation: portrait), (max-width: 619px) {

@media (max-width: 619px) and (max-height: 640px) {

@media (prefers-reduced-motion: reduce) {

    document.querySelectorAll('[data-t]').forEach(function (el) { var t = TR[el.dataset.t]; if (t) el.textContent = t; });
    document.querySelector('[data-h="copy"]').innerHTML =
      'Метрики разбросаны по десятку дашбордов.<br> g.a.d. сводит их в один ясный сигнал, и каждое<br> решение опирается на данные, которым вы верите.';
    document.querySelector('.play').setAttribute('aria-label', 'Смотреть демо');
    document.querySelector('.demo-visual img').alt = 'Красный и синий дым';
  }

  // кнопки «Начать» и «Регистрация» ведут в Telegram
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { window.open('https://t.me/smirnovarturr', '_blank', 'noopener'); });
  });

  // конец появления
  var root = document.documentElement, card = document.getElementById('demo-card');
  card.addEventListener('animationend', function (e) {
    if (e.target !== card) return;
    root.classList.remove('motion-pending');
    clearTimeout(window.__motionFallback);
  });

  // меню планшета и телефона
  var header = document.getElementById('header'), panel = document.getElementById('tablet-navigation');
  var toggle = header.querySelector('.menu-toggle');
  var ru = root.lang === 'ru';
  function toggleVisible() { return getComputedStyle(toggle).display !== 'none'; }
  function setOpen(open) {
    header.classList.toggle('menu-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? (ru ? 'Закрыть меню' : 'Close menu') : (ru ? 'Открыть меню' : 'Open menu'));
    panel.inert = !open && toggleVisible();
    if (open) { var a = panel.querySelector('a'); if (a) a.focus({ preventScroll: true }); }
  }
  toggle.addEventListener('click', function () { setOpen(!header.classList.contains('menu-open')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && header.classList.contains('menu-open')) { setOpen(false); toggle.focus(); } });
  document.addEventListener('pointerdown', function (e) { if (header.classList.contains('menu-open') && !header.contains(e.target)) setOpen(false); });
  panel.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { if (toggleVisible()) setOpen(false); }); });
  function sync() { if (!toggleVisible()) { header.classList.remove('menu-open'); panel.inert = false; } else if (!header.classList.contains('menu-open')) panel.inert = true; }
  addEventListener('resize', sync);
  sync();
})();
</script>
</body>
</html>
