<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — studio</title>
<!-- Один файл вместо Vite + React + Tailwind. ?lang=ru — русская версия.
     Под логотипом g.a.d. выдуманная команда с именами читалась бы как наша: вместо имён — направления работы,
     в описаниях нет имён, вместо «в деле с 2020» — «запись на проекты открыта», вместо WhatsApp — наш Telegram.
     Первый экран листается сам и медленно приближает портрет; первый клик по аватару выключает автопилот. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid #e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%}
body{background:#d9d9d7}
button{font:inherit;color:inherit;background:transparent;cursor:pointer;line-height:inherit}
a{color:inherit;text-decoration:inherit}
img{display:block;max-width:100%}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .5s ease}

.k{position:relative;height:100vh;width:100%;overflow:hidden;font-family:'Geist',system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1);
  transition:opacity .7s cubic-bezier(0,0,.2,1),transform 0s linear .7s}
.bg.on{opacity:1;transform:scale(1.06);transition:opacity .7s cubic-bezier(0,0,.2,1),transform 6s linear}
.ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.05),rgba(0,0,0,.25))}
.c{position:relative;z-index:10;display:flex;height:100%;flex-direction:column;justify-content:space-between;padding:40px 24px 24px}

.top{display:flex;flex-direction:column;gap:32px}
h1{max-width:36rem;font-size:30px;font-weight:400;line-height:1.1;letter-spacing:-.025em}
h1 .gad{white-space:nowrap}
h1 .gad svg{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:-.27em}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.desc{max-width:20rem;font-size:14px;font-weight:500;line-height:1.625;color:rgba(255,255,255,.8)}

.bot{display:flex;flex-direction:column;gap:32px}
.avs{display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.avs::-webkit-scrollbar{display:none}
.av{display:flex;flex-shrink:0;flex-direction:column;align-items:center;gap:8px}
.dot{height:4px;width:4px;border-radius:9999px;background:#fff;opacity:0;transition:opacity .3s cubic-bezier(.4,0,.2,1)}
.av.on .dot{opacity:1}
.th{display:block;height:40px;width:40px;overflow:hidden;border-radius:9999px}
.th img{height:100%;width:100%;object-fit:cover}

.meta{border-top:1px solid rgba(255,255,255,.2);padding-top:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;font-size:14px;line-height:20px;font-weight:500}
.role,.ten{display:none;color:rgba(255,255,255,.7)}
.lnk{text-decoration:underline;text-underline-offset:4px;transition:color .15s cubic-bezier(.4,0,.2,1)}
.lnk:hover{color:rgba(255,255,255,.7)}

@media (min-width:640px){
  .c{padding:56px 40px 32px}
  h1{font-size:48px;line-height:1}
  .desc{font-size:16px;line-height:24px}
  .avs{gap:12px;overflow:visible;padding-bottom:0}
  .th{height:56px;width:56px}
  .role{display:block}
}
@media (min-width:768px){
  .top{flex-direction:row;align-items:flex-start;justify-content:space-between;gap:64px}
  .desc{padding-top:8px}
  .ten{display:block}
}
@media (min-width:1024px){
  .c{padding-left:64px;padding-right:64px}
  h1{font-size:72px}
}
@media (prefers-reduced-motion:reduce){.bg.on{transform:none}.gad .ring{animation:none;stroke-dashoffset:0}.gad .orb{animation:none;opacity:1}}
</style>
</head>
<body>
<section class="k">
  <div id="bgs"></div>
  <div class="ov"></div>
  <div class="c">
    <div class="top">
      <h1><span class="gad"><svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
          <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
          <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
          <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
        </svg></span> <span data-t="h1">is the talent you build with each&nbsp;day</span></h1>
      <p class="desc fade" id="desc"></p>
    </div>
    <div class="bot">
      <div class="avs" id="avs"></div>
      <div class="meta">
        <span class="fade" id="name"></span>
        <span class="role" id="role"></span>
        <span class="ten" data-t="ten">Now booking new projects</span>
        <a class="lnk" href="https://t.me/smirnovarturr" target="_blank" rel="noopener">Telegram</a>
      </div>
    </div>
  </div>
</section>
<script>
(() => {
const RU = true;
const img = id => 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260727_' + id + '.png&w=1280&q=85';
// [картинка, направление EN, RU, описание EN, RU]
const S = [
  ['225202_f9e684f3-dc19-469a-8142-eb391bfc601b', 'Design direction', 'Арт-дирекшн',
   'The visual direction of every project. Rough ideas turn into clear, confident design languages that feel effortless yet leave a lasting impression.',
   'Визуальный язык каждого проекта. Сырые идеи становятся ясным и уверенным дизайном: он выглядит легко, а запоминается надолго.'],
  ['225149_7937e8ea-3b0a-46ab-919f-775627695a23', 'Interfaces', 'Интерфейсы',
   'Interfaces people understand at first glance. Every screen balances clarity and character, making complex products feel simple and warm.',
   'Интерфейсы, понятные с первого взгляда. В каждом экране ясность уравновешена характером, и сложный продукт ощущается простым и тёплым.'],
  ['225153_f2b1fc04-776a-4f2e-879b-b764ea762e77', 'Concept', 'Концепция',
   'The ideas behind the work. Every brief is explored until the core story emerges, then built into concepts that give each project its reason to exist.',
   'Идея, на которой держится работа. Бриф разбираем, пока не проступит главная история, а из неё растёт концепция — причина проекту существовать.'],
  ['225847_f456fd9c-8938-4103-836d-51b0e88a9510', 'Brand voice', 'Голос бренда',
   'Helping brands find their voice. From positioning to tone, identities that stay consistent everywhere and grow stronger with every appearance.',
   'Бренд находит свой голос. От позиционирования до интонации — айдентика, которая везде звучит одинаково и крепнет с каждым появлением.'],
  ['225854_3958a522-6203-4f84-a7fa-3b3f1dcd7256', 'Motion', 'Моушн-дизайн',
   'Bringing stillness to life. Motion adds rhythm and personality to every product, guiding attention with transitions that feel natural and precise.',
   'Статика оживает. Движение даёт продукту ритм и характер и ведёт взгляд переходами — естественными и точными.'],
  ['231111_fcefaa07-6851-4fdc-ac7b-98754ac9d5c4', 'UX research', 'UX-исследования',
   'How people actually use a product. Research keeps every decision grounded in real behavior, so the work serves users and not assumptions.',
   'Как люди на самом деле пользуются продуктом. Исследования опирают каждое решение на реальное поведение, а не на догадки.'],
  ['231124_9a1505aa-8c44-4046-aff8-1aa0bc7b3ef3', 'Graphic design', 'Графический дизайн',
   'The finishing touch. From typography to illustration, the visual details that separate good work from unforgettable work.',
   'Последний штрих. От типографики до иллюстрации — детали, которые отличают хорошую работу от незабываемой.'],
  ['230413_62e8b331-89be-4d35-84fe-330ba9b1b64f', 'Production', 'Продакшн',
   'Keeping every project moving as one. People, plans and priorities stay connected, so each release ships on time without losing its craft.',
   'Проект движется как одно целое. Люди, планы и приоритеты связаны, и релиз выходит в срок, не теряя в качестве.'],
];
const L = RU ? 1 : 0;
if (RU) {
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — студия';
  const TR = { h1: '— мастерство на каждый день', ten: 'Запись на новые проекты открыта' };
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = TR[el.dataset.t]; });
}
const bgs = document.getElementById('bgs'), avs = document.getElementById('avs');
const desc = document.getElementById('desc'), name = document.getElementById('name'), role = document.getElementById('role');
const layers = [], btns = [];
S.forEach((s, i) => {
  const d = document.createElement('div'); d.className = 'bg'; d.style.backgroundImage = 'url("' + img(s[0]) + '")';
  bgs.appendChild(d); layers.push(d);
  const b = document.createElement('button'); b.type = 'button'; b.className = 'av';
  b.setAttribute('aria-label', (RU ? 'Показать: ' : 'Show ') + s[1 + L]);
  b.innerHTML = '<span class="dot"></span><span class="th"><img alt=""></span>';
  const im = b.querySelector('img'); im.src = img(s[0]); im.alt = s[1 + L];
  b.addEventListener('click', () => { auto = false; clearInterval(timer); show(i); });
  avs.appendChild(b); btns.push(b);
});
const replay = el => { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); };
let active = -1;
function show(i) {
  if (i === active) return;
  active = i;
  layers.forEach((l, j) => l.classList.toggle('on', j === i));
  btns.forEach((b, j) => b.classList.toggle('on', j === i));
  desc.textContent = S[i][3 + L]; replay(desc);
  name.textContent = S[i][1 + L]; replay(name);
  role.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(S.length).padStart(2, '0');
}
// автопилот: листает сам, пока человек не выбрал портрет
let auto = !matchMedia('(prefers-reduced-motion: reduce)').matches, timer;
requestAnimationFrame(() => requestAnimationFrame(() => show(0)));
timer = setInterval(() => {
  if (!auto) return;
  show((active + 1) % S.length);
  const b = btns[active];
  if (avs.scrollWidth > avs.clientWidth) {
    const dx = b.getBoundingClientRect().left - avs.getBoundingClientRect().left - (avs.clientWidth - b.offsetWidth) / 2;
    avs.scrollBy({ left: dx, behavior: 'smooth' });
  }
}, 4500);
})();
</script>
</body>
</html>
