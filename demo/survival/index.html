<style>
  #gad{position:fixed;left:16px;top:14px;z-index:20;height:20px;color:#dff;opacity:.7;pointer-events:auto}
  #gad:hover{opacity:1}
  .gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Consolas','Courier New',monospace;}
  #c{width:100%;height:100%;display:block;}
  #hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;color:#dff;text-shadow:0 0 4px #000;}
  .panel{background:rgba(10,20,25,0.55);border:1px solid rgba(120,255,230,0.4);border-radius:4px;backdrop-filter:blur(1px);}
  #zone{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:bold;letter-spacing:2px;padding:4px 18px;}
  #zone.hub{color:#7fffd4;border-color:#7fffd4;}
  #zone.hostile{color:#ff5555;border-color:#ff5555;}
  #hpwrap{position:absolute;bottom:20px;left:20px;width:220px;height:20px;padding:3px;}
  #hpbarbg{width:100%;height:100%;background:#0006;}
  #hpbar{height:100%;background:linear-gradient(90deg,#5cf,#2fa);width:100%;}
  #res{position:absolute;bottom:50px;right:20px;font-size:16px;padding:5px 14px;letter-spacing:1px;}
  #rare{position:absolute;bottom:20px;right:20px;font-size:16px;padding:5px 14px;letter-spacing:1px;color:#ffcc66;}
  #vignette{position:absolute;top:0;left:0;width:100%;height:100%;box-shadow:inset 0 0 60px 10px red;opacity:0;transition:opacity .3s;}
  #hint{position:absolute;bottom:78px;left:20px;font-size:11px;opacity:.75;padding:3px 10px;}
  #minimap{position:absolute;top:14px;right:14px;border-radius:4px;}
  #crosshair{position:fixed;top:50%;left:50%;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none;z-index:15;}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:#dff;box-shadow:0 0 2px #000;}
  #crosshair::before{left:7px;top:0;width:2px;height:16px;}
  #crosshair::after{top:7px;left:0;width:16px;height:2px;}
  #crosshair.hit::before,#crosshair.hit::after{background:#ff3333;}
</style>

<script type="importmap">

<script>
/* The game logic in src/*.js writes every HUD label, item name, caption and tooltip in
   Russian directly into the DOM. Rather than fork ~20 shared modules, translate the
   rendered text live: a dictionary of every user-facing string (debug/console lines and
   TODO comments excluded — those never reach the screen), applied longest-phrase-first so
   e.g. "Снайперская винтовка" is consumed whole before the shorter "Снайпер" pattern can
   clip it, then re-applied on every DOM mutation (inventory/tavern panels, demo captions,
   loot toasts all render after load). */
(function () {
  const DICT = [
    ['ХАБ — безопасная зона', 'HUB — safe zone'],
    ['ВРАЖДЕБНАЯ ТЕРРИТОРИЯ', 'HOSTILE TERRITORY'],
    ['РЕСУРСЫ: 0', 'RESOURCES: 0'],
    ['РЕДКИЙ ЛУТ: 0/1', 'RARE LOOT: 0/1'],
    ['WASD — движение, Shift — бег, клик — камера, E — собрать', 'WASD — move, Shift — run, click — camera, E — collect'],
    ['ЛУТ КОНТЕЙНЕРА', 'CONTAINER LOOT'],
    ['Забрать всё', 'Take all'],
    ['РЮКЗАК', 'BACKPACK'],
    ['Кликните, чтобы играть: мышь — обзор, WASD — движение, ЛКМ — огонь, 1–4 — предметы, E — подобрать, Tab/I — инвентарь, R — перезарядка, Пробел — прыжок',
      'Click to play: mouse — look, WASD — move, LMB — fire, 1–4 — items, E — pick up, Tab/I — inventory, R — reload, Space — jump'],
    ['Клик — вернуть мышь', 'Click — recapture the mouse'],
    ['Пистолет-пулемёт', 'Submachine gun'],
    ['Снайперская винтовка', 'Sniper rifle'],
    ['Дробовик', 'Shotgun'],
    ['Ракетница', 'Rocket launcher'],
    ['Бластер, средний запас прочности.', 'Blaster, medium durability.'],
    ['Бластер', 'Blaster'],
    ['Выход из хаба', 'Leaving the hub'],
    ['Сундуки и лут', 'Chests and loot'],
    ['Бой из-за плеча', 'Over-the-shoulder combat'],
    ['Гранаты и аптечки', 'Grenades and medkits'],
    ['Таверна и наёмники', 'Tavern and mercenaries'],
    ['Биомы: руины', 'Biomes: ruins'],
    ['Биомы: топи', 'Biomes: swamps'],
    ['Биомы: кратер', 'Biomes: crater'],
    ['Смерть как в DayZ', 'Death, DayZ-style'],
    ['Одиночный прототип. Сервер на Go и мультиплеер — первый этап', 'Single-player prototype — a Go server and multiplayer are next'],
    ['Прототип survival: постапокалипсис, открытый мир, 4 биома', 'Survival prototype: post-apocalypse, open world, 4 biomes'],
    ['Здоровье полное', 'Health full'],
    ['обычный', 'common'],
    ['редкий', 'rare'],
    ['эпический', 'epic'],
    ['Металлолом', 'Scrap'],
    ['Кристаллы', 'Crystals'],
    ['Чипы', 'Chips'],
    ['Ядра', 'Cores'],
    ['Оружие', 'Weapons'],
    ['Нет свободного слота для разделения', 'No free slot to split into'],
    ['ИНВЕНТАРЬ', 'INVENTORY'],
    ['Tab / I — закрыть', 'Tab / I — close'],
    ['ПЕРСОНАЖ', 'CHARACTER'],
    ['клик выбирает слот, перетащите предмет, чтобы применить', 'click selects the slot, drag an item to equip it'],
    ['Этот предмет здесь не применить', "This item can't be equipped here"],
    ['Этот предмет нельзя использовать', "This item can't be used"],
    ['Здоровье', 'Health'],
    ['Патроны:', 'Ammo:'],
    ['Выберите предмет', 'Select an item'],
    ['Использовать', 'Use'],
    ['Выбросить', 'Drop'],
    ['Сортировать', 'Sort'],
    ['Разделить', 'Split'],
    ['Отделить:', 'Split off:'],
    ['Инвентарь полон', 'Inventory full'],
    ['E — подобрать', 'E — pick up'],
    ['Удержите E — забрать рюкзак', 'Hold E — take the backpack'],
    ['Удержите E — обыскать', 'Hold E — search'],
    ['патронов', 'rounds'],
    ['ТАВЕРНА НАЁМНИКОВ', 'MERCENARY TAVERN'],
    ['Esc — закрыть', 'Esc — close'],
    ['ТАВЕРНА', 'TAVERN'],
    ['НАЁМНИКОВ', 'MERCENARIES'],
    ['Нанять', 'Hire'],
    ['Отряд полон', 'Squad full'],
    ['Отряд:', 'Squad:'],
    ['клавиши 1/2/3', 'keys 1/2/3'],
    ['E — нанять', 'E — hire'],
    ['Штурмовик', 'Assault'],
    ['Громила', 'Brute'],
    ['Снайпер', 'Sniper'],
    ['Ближний бой, много прочности.', 'Melee, high durability.'],
    ['Издалека, мало прочности, большой урон.', 'Long range, low durability, high damage.'],
    ['(погиб)', '(dead)'],
    ['Обломки конструкций.', 'Structure debris.'],
    ['Кристалл энергии', 'Energy crystal'],
    ['Источник энергии.', 'Energy source.'],
    ['Батарея бластера', 'Blaster battery'],
    ['Мгновенно снимает перегрев.', 'Instantly clears overheat.'],
    ['+40 HP за 2 с.', '+40 HP over 2 s.'],
    ['Чип дрона', 'Drone chip'],
    ['Электроника дрона.', 'Drone electronics.'],
    ['Ядро дрона', 'Drone core'],
    ['Редкое ядро питания.', 'Rare power core.'],
    ['Магазин патронов', 'Ammo magazine'],
    ['+20 патронов в запас.', '+20 rounds to reserve.'],
    ['Граната', 'Grenade'],
    ['Бросок гранаты, урон по радиусу.', 'Grenade throw, area damage.'],
    ['8 дробин веером, до 25 м.', '8 pellets in a spread, up to 25 m.'],
    ['Быстрый огонь, малый урон.', 'Fast fire, low damage.'],
    ['Большой урон, сильное приближение на ПКМ.', 'High damage, strong zoom on RMB.'],
    ['Взрыв радиусом 5 м, урон 60, на плече.', '5 m blast radius, 60 damage, shoulder-fired.'],
    ['Аптечка', 'Medkit'],
    ['Пустошь', 'Wasteland'],
    ['Токсичные топи', 'Toxic swamps'],
    ['Руины города', 'City ruins'],
    ['Кристальный кратер', 'Crystal crater'],
  ].sort((a, b) => b[0].length - a[0].length);

  function translate(s) {
    for (const [ru, en] of DICT) if (s.indexOf(ru) !== -1) s = s.split(ru).join(en);
    return s;
  }
  function walk(node) {
    if (node.nodeType === 3) {
      const t = translate(node.nodeValue);
      if (t !== node.nodeValue) node.nodeValue = t;
    } else if (node.nodeType === 1) {
      if (node.id === 'gad' || node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
      for (const c of node.childNodes) walk(c);
    }
  }
  const mo = new MutationObserver(muts => {
    for (const m of muts) {
      if (m.type === 'characterData') walk(m.target);
      else for (const n of m.addedNodes) walk(n);
    }
  });
  mo.observe(document.body, { subtree: true, childList: true, characterData: true });
  walk(document.body);
})();
</script>
