  @media (min-width:768px) { .phone-frame { width: min(25vw, 42vh); } }

  @keyframes fadeSlideDown { from { opacity:0; transform:translateY(-20px);} to { opacity:1; transform:translateY(0);} }
  @keyframes fadeSlideLeft { from { opacity:0; transform:translateX(40px);} to { opacity:1; transform:translateX(0);} }

  @keyframes speedReveal {

function useCountUp(target, delayMs) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    let raf, start;
    const to = setTimeout(() => {
      const tick = now => {
        if (!start) start = now;
        const t = Math.min(1, (now - start) / 2200);
        const eased = 1 - Math.pow(1 - t, 3);
        setValue(Math.round(target * eased));
        if (t < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }, delayMs);
    return () => { clearTimeout(to); cancelAnimationFrame(raf); };
  }, [target, delayMs]);
  return value;
}

      <img src={CAR_IMAGE} alt="Team race car" className="absolute top-[390px] left-3 right-3 z-10 w-[calc(100%-24px)] h-auto object-contain rounded-lg animate-fade-slide-left delay-700" />
      <div className="absolute bottom-0 left-0 right-0 flex z-10 animate-fade-slide-up delay-900">
        {DRIVER_CARDS.map((d, i) => (
          <div key={i} className="w-1/2 p-3 rounded-t-2xl" style={{ height: 200, background: 'rgba(20,20,30,0.8)', border: '1px solid rgba(255,255,255,0.1)', borderBottom: 'none', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)' }}>
            <div className="flex items-center gap-1.5 text-white/60 text-[13px]">
              <img src={PROFILE_ICON} className="w-4 h-4 opacity-60" alt="" />
              <span>{d.name}</span>
            </div>
            <StatsSpark className="h-5 w-auto mt-1" />
            <div className="text-white font-semibold leading-[0.79] text-[110px]" style={{ letterSpacing: '-0.08em' }}>{d.number}</div>
          </div>
        ))}
      </div>
      <MenuOverlay open={menuOpen} onClose={() => setMenuOpen(false)} />
    </div>
  );
}

function PhoneMockup({ children, delayClass, extraClass = '' }) {
  const screenRef = useRef(null);
  const contentRef = useRef(null);
  const [scale, setScale] = useState(1);
  const [contentH, setContentH] = useState(844);

  useEffect(() => {
    const measure = () => { if (screenRef.current) setScale(screenRef.current.clientWidth / 390); };
    measure();
    const ro = new ResizeObserver(measure);
    if (screenRef.current) ro.observe(screenRef.current);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, []);

  useEffect(() => {
    if (!contentRef.current) return;
    const ro = new ResizeObserver(entries => setContentH(entries[0].contentRect.height));
    ro.observe(contentRef.current);
    return () => ro.disconnect();
  }, []);

  return (
    <div className={`flex flex-col items-center ${extraClass}`}>
      <div className={`phone-frame relative rounded-[clamp(30px,4vw,54px)] bg-black shadow-2xl shadow-black/60 animate-fade-slide-up ${delayClass}`} style={{ padding: 'clamp(6px,1vw,12px)' }}>
        <div className="absolute inset-0 rounded-[clamp(30px,4vw,54px)] ring-1 ring-white/15 pointer-events-none z-40" />
        <div className="absolute bg-neutral-700 rounded-l" style={{ left: -2, top: '19%', height: '4.5%', width: 3 }} />
        <div className="absolute bg-neutral-700 rounded-l" style={{ left: -2, top: '26%', height: '7.3%', width: 3 }} />
        <div className="absolute bg-neutral-700 rounded-l" style={{ left: -2, top: '35.5%', height: '7.3%', width: 3 }} />
        <div className="absolute bg-neutral-700 rounded-r" style={{ right: -2, top: '30.8%', height: '11.4%', width: 3 }} />
        <div ref={screenRef} className="relative w-full h-full rounded-[clamp(24px,3.2vw,44px)] overflow-hidden bg-[#0a0e1c]">
          <div className="absolute top-[3%] left-1/2 -translate-x-1/2 bg-black rounded-full z-50" style={{ width: '30%', height: '4%' }} />
          <div style={{ width: 390, height: contentH, transform: `scale(${scale})`, transformOrigin: 'top left' }}>
            <div ref={contentRef}>{children}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

const App = () => (
  <div className="relative w-full overflow-hidden font-sans" style={{ minHeight: '100vh' }}>
    <img src={BG_IMAGE} alt="" className="absolute inset-0 w-full h-full object-cover z-0" />
    <div className="absolute inset-0 bg-black/70 z-[1]" />

    <div className="hidden md:flex relative z-[2] w-full h-screen items-center justify-center py-6">
      <div className="flex items-end justify-center" style={{ gap: '2vw' }}>
        <PhoneMockup delayClass="delay-300" extraClass="phone-1"><Screen1 /></PhoneMockup>
        <PhoneMockup delayClass="delay-500" extraClass="-mb-6 phone-2"><Screen2 /></PhoneMockup>
        <PhoneMockup delayClass="delay-700" extraClass="phone-3"><Screen3 /></PhoneMockup>
      </div>
    </div>

    <div className="md:hidden relative z-[2] flex flex-col items-center py-[20px] px-[20px]" style={{ gap: 50 }}>
      <PhoneMockup delayClass="delay-300" extraClass="phone-1"><Screen1 /></PhoneMockup>
      <PhoneMockup delayClass="delay-500" extraClass="phone-2"><Screen2 /></PhoneMockup>
      <PhoneMockup delayClass="delay-700" extraClass="phone-3"><Screen3 /></PhoneMockup>
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
