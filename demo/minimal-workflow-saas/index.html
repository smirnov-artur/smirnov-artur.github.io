<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Guide everyone through your team's tech manuals</title>
    <meta name="description" content="g.a.d. turns your team's workflow steps into guided tech manuals, so nothing gets lost and everyone stays aligned.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
</head>
<body class="bg-[#f8fafc] text-[#1e293b] antialiased overflow-x-hidden selection:bg-slate-200" style="font-family:'Inter',sans-serif">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion } = Motion;

        const ChevronRight = () => (
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        );

        const Brand3Bar = ({ className }) => (
            <div className={"flex flex-col gap-[2.5px] rotate-[-15deg] " + className}>
                <div className="w-3.5 h-[1.5px] bg-current rounded-full" />
                <div className="w-2.5 h-[1.5px] bg-current rounded-full translate-x-[2px]" />
                <div className="w-3 h-[1.5px] bg-current/70 rounded-full translate-x-[4px]" />
            </div>
        );

        const tasks = [
            'How to code an app in Python',
            'How to build charts with data in Excel',
            'How to edit profile of users on GitHub',
            'How to set up a custom task rule in Asana',
            'How to design a form in Sheets',
            'How to build a custom webhook in Slack',
            'How to sync a dashboard in Excel',
            'How to create a team member in Canva',
            'How to link a custom project page in Jira',
        ];
        const N = tasks.length;
        const duplicatedTasks = [...tasks, ...tasks, ...tasks];
        const OPA = { 1: 0.55, 2: 0.36, 3: 0.22, 4: 0.11, 5: 0.04 };
        const BLUR = { 1: 0.2, 2: 0.4, 3: 0.6, 4: 0.8, 5: 1.1 };
        const styleFor = distance => {
            if (distance === 0) return { y: 0, height: 54, opacity: 1, blur: 0 };
            if (distance < 0) return { y: -35, height: 30, opacity: 0, blur: 0 };
            return { y: 68 + (distance - 1) * 22, height: 22, opacity: OPA[distance] || 0, blur: BLUR[distance] || 0 };
        };

        const AnimatedTaskList = () => {
            const [index, setIndex] = useState(N);
            const [animate, setAnimate] = useState(true);

            useEffect(() => {
                const t = setInterval(() => setIndex(i => (i < N * 2 ? i + 1 : i)), 4500);
                return () => clearInterval(t);
            }, []);
            useEffect(() => {
                if (index !== N * 2) return;
                const t = setTimeout(() => { setAnimate(false); setIndex(N); }, 1000);
                return () => clearTimeout(t);
            }, [index]);
            useEffect(() => {
                if (!(index === N && !animate)) return;
                const t = setTimeout(() => setAnimate(true), 50);
                return () => clearTimeout(t);
            }, [index, animate]);

            return (
                <div className="relative w-full max-w-[340px] md:max-w-[420px] h-[220px] select-none mx-auto text-left overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-[54px] rounded-xl bg-white/[0.08] backdrop-blur-md border border-white/20 shadow-[inset_0_1px_1px_rgba(255,255,255,0.15)] flex items-center px-4 pointer-events-none">
                        <div className="w-[30px] h-[30px] bg-white rounded-lg flex items-center justify-center shrink-0 shadow-sm border border-white/40">
                            <svg className="gad-logo" height="15" viewBox="293 1 58 58" role="img" aria-label="g.a.d." style={{ color: '#0c101d' }}><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
                        </div>
                    </div>
                    <div className="absolute inset-0 w-full h-full z-10 pointer-events-none">
                        {duplicatedTasks.map((task, i) => {
                            const distance = i - index;
                            const s = styleFor(distance);
                            return (
                                <motion.div
                                    key={i}
                                    className="absolute left-0 w-full flex items-center select-none justify-start"
                                    animate={{ y: s.y, opacity: s.opacity }}
                                    style={{ height: s.height, filter: `blur(${s.blur}px)` }}
                                    transition={animate ? { duration: 1.0, ease: [0.16, 1, 0.3, 1] } : { duration: 0 }}
                                >
                                    {distance === 0 ? (
                                        <div className="pl-[58px] flex flex-col justify-center text-left">
                                            <span className="text-[7.5px] text-white/50 font-bold uppercase tracking-wider leading-none mb-1">Learn the step</span>
                                            <span className="text-[12.5px] md:text-[13px] font-medium tracking-tight text-white leading-none">{task}</span>
                                        </div>
                                    ) : (
                                        <div className="pl-[58px] flex items-center text-left">
                                            <span className="text-[11.5px] md:text-[12px] font-normal tracking-tight text-white/70 leading-none">{task}</span>
                                        </div>
                                    )}
                                </motion.div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const Navbar = () => (
            <nav className="relative z-50 flex items-center justify-between px-6 py-5 max-w-7xl mx-auto w-full select-none">
                <svg className="gad-logo" height="22" viewBox="0 0 355 110" role="img" aria-label="g.a.d." style={{ color: '#0f172a' }}><path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/><circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/><circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/></svg>
                <div className="hidden md:flex absolute left-1/2 -translate-x-1/2 items-center gap-8 text-[13px] font-medium text-slate-600">
                    {['Resources', 'Service', 'Support', 'Developers', 'Updates'].map(l => (
                        <a key={l} href="#" className="hover:text-slate-900 transition-colors">{l}</a>
                    ))}
                </div>
                <a href="#" className="px-4.5 py-1.5 text-xs font-medium border border-slate-200 rounded-full hover:bg-white/85 bg-white/30 backdrop-blur-sm transition-all shadow-[0_1px_2px_rgba(0,0,0,0.02)] text-slate-800">Join us</a>
            </nav>
        );

        const Hero = () => (
            <section className="relative pt-10 pb-6 flex flex-col justify-center items-center w-full select-none">
                <div className="relative z-10 max-w-7xl mx-auto px-6 text-center flex flex-col items-center">
                    <motion.h1
                        className="text-4xl md:text-[45px] font-semibold tracking-tight text-slate-900 mb-5 max-w-4xl mx-auto leading-[1.12]"
                        initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, ease: 'easeOut' }}
                    >
                        Guide everyone on teams<br />tech manuals<br /><span className="text-slate-500">— with a total ease of mind</span>
                    </motion.h1>
                    <motion.p
                        className="text-xs md:text-[13px] text-slate-500 max-w-xl mx-auto mb-6 leading-relaxed font-normal"
                        initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, ease: 'easeOut', delay: 0.2 }}
                    >
                        g.a.d. offers the best path to register your workflow steps<br />and optimize training on your setup systems
                    </motion.p>
                    <motion.div
                        className="mb-14"
                        initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8, ease: 'easeOut', delay: 0.4 }}
                    >
                        <button className="bg-gradient-to-b from-[#252a38] to-[#1a1e29] hover:from-[#1d212c] hover:to-[#12151e] text-white px-5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 mx-auto transition-all shadow-[inset_0_1px_0_rgba(255,255,255,0.12),0_1px_2px_rgba(0,0,0,0.15)] border border-slate-900/80 active:scale-95 duration-150">
                            Register Now!<ChevronRight />
                        </button>
                    </motion.div>
                    <div className="relative w-full flex flex-col items-center max-w-sm">
                        <motion.div
                            className="relative z-20 w-full"
                            initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 1, delay: 0.6 }}
                        >
                            <AnimatedTaskList />
                        </motion.div>
                        <motion.span
                            className="mt-14 text-[10px] font-medium tracking-wide text-white/50"
                            initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 1, duration: 1 }}
                        >
                            All people aligned.
                        </motion.span>
                    </div>
                </div>
            </section>
        );

        const App = () => (
            <div className="relative min-h-screen bg-[#f8fafc] selection:bg-slate-200 overflow-x-hidden flex flex-col justify-between">
                <div className="absolute inset-x-0 top-0 bottom-0 z-0 overflow-hidden pointer-events-none">
                    <video autoPlay muted loop playsInline className="w-full h-full object-cover object-bottom opacity-[0.98]" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260525_064035_ff2947db-c2f5-47e4-818d-0e985c6ea0fc.mp4" />
                    <div className="absolute inset-0 bg-white/[0.05] backdrop-blur-[2px]" />
                </div>
                <div className="relative z-10 flex-grow flex flex-col">
                    <Navbar />
                    <main>
                        <Hero />
                    </main>
                </div>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
