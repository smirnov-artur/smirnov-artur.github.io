        .marquee-track{animation:scroll 15s linear infinite}

                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
            </svg>
        );

        // по буквам, но группируем буквы каждого слова в один inline-block —
        // иначе строка рвётся посреди слова (letter-span'ы сами не знают границ слов)
        const StaggeredFade = ({ text, className, style }) => {
            const ref = useRef(null);
            const inView = useInView(ref, { once: true });
            let i = 0;
            return (
                <h1 ref={ref} className={className} style={style}>
                    {text.split(' ').map((word, wi) => (
                        <React.Fragment key={wi}>
                            <span style={{ display: 'inline-block', whiteSpace: 'nowrap' }}>
                                {word.split('').map((ch, ci) => {
                                    const delay = i++ * 0.03;
                                    return (
                                        <motion.span key={ci} initial={{ opacity: 0 }} animate={inView ? { opacity: 1 } : {}} transition={{ duration: 0.3, delay }} style={{ display: 'inline-block' }}>
                                            {ch}
                                        </motion.span>
                                    );
                                })}
                            </span>
                            {wi < text.split(' ').length - 1 ? ' ' : ''}
                        </React.Fragment>
                    ))}
                </h1>
            );
        };

        const FadeDown = ({ delay, className, children }) => {
            const ref = useRef(null);
            const inView = useInView(ref, { once: true });
            return (
                <motion.div ref={ref} initial={{ opacity: 0, y: -20 }} animate={inView ? { opacity: 1, y: 0 } : {}} transition={{ duration: 0.6, delay }} className={className}>
                    {children}
                </motion.div>
            );
        };

        const App = () => {
            useEffect(() => { window.lucide && window.lucide.createIcons(); }, []);

            return (
                <div className="h-screen w-full overflow-hidden relative" style={{ background: '#F5F3EE' }}>

                    <div className="relative z-10 h-full flex flex-col">
                        <nav className="flex items-center justify-between px-4 md:px-8 py-4 md:py-6">
                            <div className="flex items-center gap-4">
                                <GadLogo className="text-lg md:text-xl" />
                            </div>
                            <div className="hidden lg:flex items-center gap-8">
                                {NAV_LINKS.map(l => <a key={l} href="#" className="text-sm text-gray-700 hover:text-gray-900">{l}</a>)}
                            </div>
                            <div className="flex items-center gap-3">
                                <a href="#" className="hidden sm:inline-block rounded-full border border-black/20 px-4 md:px-6 py-2 md:py-2.5 text-sm text-gray-800">Войти</a>
                                <button className="rounded-full bg-black text-white px-4 md:px-6 py-2 md:py-2.5 text-sm hover:opacity-90 transition-opacity">Чистая энергия</button>
                            </div>
                        </nav>

                        <div className="flex-1 flex flex-col items-center px-4 md:px-8 pt-4 md:pt-8 overflow-hidden">
                            <div className="rounded-full border border-black/20 px-4 py-1.5 flex items-center gap-2 text-xs md:text-sm bg-white/40">
                                <span>☀️</span><span>→</span><span>🌍</span>
                                <span className="hidden sm:inline">Внедряем энергию будущего</span>
                                <span className="inline sm:hidden">Энергия будущего</span>
                                <span>→</span><span>🌱</span>
                            </div>

                            <StaggeredFade text="Возобновляемая энергия для будущего — бесконечные чистые решения"
                                className="text-3xl sm:text-4xl md:text-5xl lg:text-6xl leading-tight font-normal text-center max-w-5xl mb-3 md:mb-4 mt-4"
                                style={{ color: '#31463B' }} />

                            <FadeDown delay={0.5} className="text-center text-gray-600 max-w-3xl mb-4 md:mb-5 text-sm md:text-base lg:text-lg">
                                Платформа устойчивой энергетики. Проектируем, устанавливаем и обслуживаем солнечные станции для домов, бизнеса и крупных объектов по всему миру.
                            </FadeDown>

                            <FadeDown delay={0.7} className="flex flex-col sm:flex-row items-center gap-3">
                                <button className="cta-primary rounded-full text-white pl-5 pr-1.5 py-1.5 flex items-center gap-2 text-sm hover:scale-[1.03] transition-transform" style={{ backgroundImage: 'linear-gradient(90deg,#3C684D,#4A7144)' }}>
                                    <i data-lucide="leaf" className="w-4 h-4"></i>
                                    <span>Изучить варианты</span>
                                    <span className="w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center" style={{ backgroundImage: 'linear-gradient(59deg,#567A5E 0%,#78A873 100%)' }}>

                                    </span>
                                </button>
                                <button className="cta-secondary rounded-full bg-white text-gray-700 pl-5 pr-1.5 py-1.5 flex items-center gap-2 text-sm hover:scale-[1.03] transition-transform">
                                    <span>Подключиться</span>
                                    <span className="w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center" style={{ backgroundImage: 'linear-gradient(59deg,#EEEEEE 0%,#CBCBCB 100%)' }}>
                                        <i data-lucide="arrow-right" className="w-4 h-4 text-black"></i>
                                    </span>
                                </button>
                            </FadeDown>
                        </div>

                        <div className="pb-6 md:pb-8 overflow-hidden relative">
                            <div className="absolute inset-y-0 left-0 w-16 md:w-32 z-10" style={{ backgroundImage: 'linear-gradient(to right,#F5F3EE,transparent)' }} />
                            <div className="absolute inset-y-0 right-0 w-16 md:w-32 z-10" style={{ backgroundImage: 'linear-gradient(to left,#F5F3EE,transparent)' }} />

                    </div>

                        <div className="w-10 h-10 rounded-lg bg-white flex items-center justify-center" style={{ color: '#4A7C5A' }}>

                        </div>
                        <div className="text-sm">

                            <div className="text-gray-600">Rd7, USA</div>
                        </div>
                    </div>

                    <div className="flex items-center gap-3 absolute bottom-20 md:bottom-24 left-1/2 -translate-x-1/2 z-10">
                        <button className="play-btn liquid-glass rounded-full w-9 h-9 md:w-10 md:h-10 flex items-center justify-center text-white hover:scale-110 transition-transform">

                        </button>
                        <span className="text-xs md:text-sm font-medium text-white">Система чистой энергии</span>

                    <div className="hidden lg:flex flex-col items-center gap-2 absolute bottom-48 right-8 z-10">

                            <img src={AVATARS[1]} alt="" className="w-16 h-16 rounded-full object-cover absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-10 border-4 border-white" />
                            <img src={AVATARS[2]} alt="" className="w-10 h-10 rounded-full object-cover absolute right-0 top-1/2 -translate-y-1/2 z-0" />
                        </div>
                        <span className="text-sm font-medium text-gray-900">+ 37 тыс. объектов</span>
                        <div className="flex items-center gap-3 text-black">
                            {['refresh-cw', 'square', 'plus-circle', 'grid-2x2', 'sparkles'].map(ic => (
                                <i key={ic} data-lucide={ic} className="w-5 h-5"></i>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
