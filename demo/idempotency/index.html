<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idempotency — retry-safe payment requests (Go)</title>
    <meta name="description" content="Go net/http middleware that replays the stored response for a repeated Idempotency-Key request instead of running the handler — and the card — twice.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        html,body{overflow-x:hidden;background:#020617}
        ::selection{background:#0e7490;color:#ecfeff}
        .bg-grid{background-image:linear-gradient(rgba(148,163,184,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.14) 1px,transparent 1px);background-size:36px 36px}
    </style>
</head>
<body class="antialiased bg-slate-950 text-slate-200 font-sans">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const GITHUB_URL = 'https://github.com/smirnov-artur/idempotency';
        const PORTFOLIO_URL = 'https://smirnov-artur.github.io/works/en';
        const KEY = 'a5e9c2d4-51ab-4e2f-9c3a-77d0e6f1b2aa';
        const BODY_A = '{"amount":4200,"currency":"USD"}';
        const BODY_B = '{"amount":5100,"currency":"USD"}';
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const shortKey = KEY.slice(0, 13) + '…';

        const GadLogo = ({ className, style }) => (
            <svg className={'gad-logo ' + (className || '')} style={style} viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
                <path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/>
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor"/>
            </svg>
        );

        const ICON_PATHS = {
            client: <><rect x="3" y="4" width="18" height="14" rx="2"/><line x1="3" y1="8.5" x2="21" y2="8.5"/></>,
            shield: <path d="M12 3l7 3.5v5c0 5-3.3 7.7-7 9-3.7-1.3-7-4-7-9v-5L12 3z"/>,
            card: <><rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/></>,
        };
        const Icon = ({ name, className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">{ICON_PATHS[name]}</svg>
        );

        const Nav = () => (
            <nav className="max-w-[1360px] mx-auto flex items-center justify-between px-5 sm:px-6 py-5">
                <a href={PORTFOLIO_URL} className="flex items-center gap-2 text-slate-100 opacity-90 hover:opacity-100 transition-opacity" aria-label="g.a.d. portfolio">
                    <GadLogo style={{ height: 22 }} />
                </a>
                <a href={GITHUB_URL} target="_blank" rel="noopener" className="hidden sm:flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-100 transition-colors font-mono">
                    github.com/smirnov-artur/idempotency
                </a>
            </nav>
        );

        const BigBox = React.forwardRef(({ icon, label, sub, active, tone = 'cyan', children }, ref) => (
            <div
                ref={ref}
                className={
                    'relative flex-1 rounded-2xl border-2 px-5 py-6 sm:px-6 sm:py-7 transition-all duration-300 ' +
                    (active
                        ? (tone === 'rose'
                            ? 'border-rose-400 bg-rose-400/10 shadow-[0_0_36px_-6px_rgba(251,113,133,0.55)]'
                            : 'border-cyan-400 bg-cyan-400/10 shadow-[0_0_36px_-6px_rgba(34,211,238,0.55)]')
                        : 'border-slate-800 bg-slate-900/70')
                }
            >
                <Icon name={icon} className={'w-6 h-6 sm:w-7 sm:h-7 mb-3 transition-colors ' + (active ? (tone === 'rose' ? 'text-rose-300' : 'text-cyan-300') : 'text-slate-500')} />
                <p className="font-mono text-[10.5px] sm:text-xs uppercase tracking-wider text-slate-500 mb-1.5">{label}</p>
                <p className="text-slate-100 font-semibold text-base sm:text-lg leading-snug">{children}</p>
                <p className="font-mono text-xs sm:text-[13px] text-slate-400 mt-2.5 min-h-[1.2em]">{sub || ' '}</p>
            </div>
        ));

        const LogLine = ({ entry }) => {
            const tone = entry.tone === 'rose' ? 'text-rose-300' : entry.tone === 'cyan' ? 'text-cyan-300' : 'text-slate-300';
            return (
                <div className="font-mono text-[12px] sm:text-[13px] leading-relaxed">
                    <span className={entry.dir === 'req' ? 'text-slate-500' : tone}>{entry.dir === 'req' ? '→ ' : '← '}</span>
                    <span className={entry.dir === 'req' ? 'text-slate-300' : tone}>{entry.text}</span>
                    {entry.body && <span className="text-slate-600">  {entry.body}</span>}
                    {entry.note && <div className="text-slate-500 pl-4">// {entry.note}</div>}
                </div>
            );
        };

        // Таймингы намеренно быстрые: и для живого автоплея, и чтобы в первые
        // секунды записанного превью уже случился повтор (замена ответа), а не
        // только первая отправка.
        const HOP = 360, CHECK = 220, CHARGE_IN = 200, CHARGE_OUT = 260, TTL_PAUSE = 160, LEAD = 120;

        const Diagram = () => {
            const wrapRef = useRef(null), clientRef = useRef(null), mwRef = useRef(null), handlerRef = useRef(null);
            const busyRef = useRef(false), manualRef = useRef(false);

            const [lines, setLines] = useState(null);
            const [ready, setReady] = useState(false);
            const readyRef = useRef(false);
            const [busy, setBusy] = useState(false);
            const [record, setRecord] = useState(false);
            const [charges, setCharges] = useState(0);
            const [dots, setDots] = useState(Array.from({ length: 4 }, () => ({ x: 0, y: 0, show: false, tone: 'cyan' })));
            const [mwActive, setMwActive] = useState(false);
            const [handlerActive, setHandlerActive] = useState(false);
            const [storeNote, setStoreNote] = useState('empty');
            const [badge, setBadge] = useState(null);
            const [log, setLog] = useState([]);

            useEffect(() => {
                const measure = () => {
                    if (!wrapRef.current || !clientRef.current || !mwRef.current || !handlerRef.current) return;
                    const c = wrapRef.current.getBoundingClientRect();
                    const rel = ref => { const b = ref.current.getBoundingClientRect(); return { x: b.left - c.left + b.width / 2, y: b.top - c.top + b.height / 2 }; };
                    setLines({ a: rel(clientRef), b: rel(mwRef), c: rel(handlerRef) });
                    if (!readyRef.current) { readyRef.current = true; setReady(true); }
                };
                measure();
                const ro = new ResizeObserver(measure);
                ro.observe(wrapRef.current);
                window.addEventListener('resize', measure);
                return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
            }, []);

            const setBusyBoth = v => { busyRef.current = v; setBusy(v); };
            const appendLog = (...entries) => setLog(l => [...l, ...entries].slice(-4));
            const hideDots = () => setDots(d => d.map(x => ({ ...x, show: false })));
            const snapTo = (key, tone) => setDots(d => d.map((x, i) => (i === 0 ? { ...lines[key], show: true, tone } : { ...x, show: false })));
            const moveTo = async (key, tone) => {
                const p = lines[key];
                setDots(d => { const n = [...d]; n[0] = { ...p, show: true, tone }; return n; });
                [1, 2, 3].forEach(i => setTimeout(() => setDots(d => { const n = [...d]; n[i] = { ...p, show: true, tone }; return n; }), i * 90));
                await sleep(HOP);
            };

            const sendFresh = async () => {
                snapTo('a', 'cyan'); setBadge(null);
                await sleep(LEAD);
                await moveTo('b', 'cyan');
                setMwActive(true); setStoreNote('Begin(key, fp) — no record');
                await sleep(CHECK);
                setMwActive(false);
                await moveTo('c', 'cyan');
                setHandlerActive(true); setStoreNote('reserved · pending');
                await sleep(CHARGE_IN);
                setCharges(n => n + 1);
                await sleep(CHARGE_OUT);
                setHandlerActive(false);
                await moveTo('b', 'cyan');
                setStoreNote('completed · TTL 24h');
                await sleep(TTL_PAUSE);
                await moveTo('a', 'cyan');
                setRecord(true);
                setBadge({ text: '201 Created', tone: 'cyan' });
                appendLog(
                    { dir: 'req', text: `POST /payments  Idempotency-Key: ${shortKey}`, body: BODY_A },
                    { dir: 'res', text: '201 Created', tone: 'cyan', note: 'handler ran — card charged' }
                );
                hideDots();
            };

            const retrySame = async () => {
                snapTo('a', 'cyan'); setBadge(null);
                await sleep(LEAD);
                await moveTo('b', 'cyan');
                setMwActive(true); setStoreNote('Begin(key, fp) — same fingerprint');
                await sleep(CHARGE_OUT + CHECK);
                setMwActive(false); setStoreNote('completed · TTL 24h');
                await moveTo('a', 'cyan');
                setBadge({ text: '200 · Replayed', tone: 'cyan' });
                appendLog(
                    { dir: 'req', text: `POST /payments  Idempotency-Key: ${shortKey}`, body: BODY_A },
                    { dir: 'res', text: '201 Created  Idempotency-Replayed: true', tone: 'cyan', note: 'replayed — handler did not run' }
                );
                hideDots();
            };

            const retryDifferent = async () => {
                snapTo('a', 'rose'); setBadge(null);
                await sleep(LEAD);
                await moveTo('b', 'rose');
                setMwActive(true); setStoreNote('Begin(key, fp) — fingerprint mismatch');
                await sleep(CHARGE_OUT + CHECK);
                setMwActive(false); setStoreNote('completed · TTL 24h');
                await moveTo('a', 'rose');
                setBadge({ text: '422 Unprocessable', tone: 'rose' });
                appendLog(
                    { dir: 'req', text: `POST /payments  Idempotency-Key: ${shortKey}`, body: BODY_B },
                    { dir: 'res', text: '422 Unprocessable Entity', tone: 'rose', note: 'same key, different request — rejected' }
                );
                hideDots();
            };

            const doReset = () => { setRecord(false); setCharges(0); setLog([]); setBadge(null); setStoreNote('empty'); hideDots(); };

            const guardedRun = async fn => {
                if (busyRef.current || !lines) return;
                setBusyBoth(true);
                await fn();
                setBusyBoth(false);
            };

            const onSend = () => { manualRef.current = true; guardedRun(sendFresh); };
            const onRetrySame = () => { manualRef.current = true; guardedRun(retrySame); };
            const onRetryDifferent = () => { manualRef.current = true; guardedRun(retryDifferent); };
            const onReset = () => { manualRef.current = true; if (!busyRef.current) doReset(); };

            // автоплей: демонстрирует механику сама, пока посетитель не нажмёт кнопку
            useEffect(() => {
                if (!ready) return;
                let stopped = false;
                (async () => {
                    await sleep(300);
                    while (!stopped && !manualRef.current) {
                        await guardedRun(sendFresh);
                        if (stopped || manualRef.current) break;
                        await sleep(1000);
                        await guardedRun(retrySame);
                        if (stopped || manualRef.current) break;
                        await sleep(1000);
                        await guardedRun(retryDifferent);
                        if (stopped || manualRef.current) break;
                        await sleep(1600);
                        doReset();
                        await sleep(650);
                    }
                })();
                return () => { stopped = true; };
            }, [ready]);

            const primaryBtn = 'font-mono text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors disabled:opacity-30 disabled:cursor-not-allowed ' +
                'bg-cyan-400 text-slate-950 hover:bg-cyan-300 disabled:hover:bg-cyan-400';
            const secondaryBtn = 'font-mono text-xs sm:text-sm font-medium px-4 py-2.5 rounded-lg border-2 transition-colors disabled:opacity-30 disabled:cursor-not-allowed ' +
                'border-slate-600 text-slate-100 hover:border-cyan-400 hover:text-cyan-300 disabled:hover:border-slate-600 disabled:hover:text-slate-100';
            const ghostBtn = 'font-mono text-xs sm:text-sm px-4 py-2.5 rounded-lg text-slate-500 hover:text-slate-200 transition-colors disabled:opacity-30';

            return (
                <div className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 sm:p-8 relative overflow-hidden">
                    <div className="absolute inset-0 bg-grid opacity-40 pointer-events-none" />

                    <div className="relative z-10 flex flex-wrap items-end justify-between gap-4 mb-7 sm:mb-9">
                        <div>
                            <p className="font-mono text-[11px] sm:text-xs uppercase tracking-wider text-slate-500 mb-1">card charged</p>
                            <p className="font-mono text-4xl sm:text-6xl font-bold text-cyan-300 tabular-nums leading-none">{charges}×</p>
                        </div>
                        <div className="min-h-[46px] sm:min-h-[56px] flex items-center">
                            {badge && (
                                <span className={'font-mono text-sm sm:text-lg font-bold px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl border-2 ' +
                                    (badge.tone === 'rose' ? 'text-rose-300 border-rose-400 bg-rose-400/10' : 'text-cyan-300 border-cyan-400 bg-cyan-400/10')}>
                                    {badge.text}
                                </span>
                            )}
                        </div>
                    </div>

                    <div ref={wrapRef} className="relative z-10">
                        {lines && (
                            <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 0 }}>
                                <line x1={lines.a.x} y1={lines.a.y} x2={lines.b.x} y2={lines.b.y} stroke="#334155" strokeWidth="2" />
                                <line x1={lines.b.x} y1={lines.b.y} x2={lines.c.x} y2={lines.c.y} stroke="#334155" strokeWidth="2" />
                            </svg>
                        )}

                        <div className="relative flex flex-col sm:flex-row gap-5 sm:gap-8" style={{ zIndex: 1 }}>
                            <BigBox ref={clientRef} icon="client" label="client" active={false}>browser / API caller</BigBox>
                            <BigBox ref={mwRef} icon="shield" label="idempotency.Middleware" active={mwActive} tone={dots[0].tone} sub={storeNote}>Begin / Complete</BigBox>
                            <BigBox ref={handlerRef} icon="card" label="createPayment handler" active={handlerActive}>charge card (PSP)</BigBox>
                        </div>

                        {[3, 2, 1, 0].map(i => {
                            const dot = dots[i];
                            const size = [11, 8, 6, 4][i];
                            const op = [1, 0.55, 0.3, 0.15][i];
                            const color = dot.tone === 'rose' ? '#fb7185' : '#22d3ee';
                            return (
                                <div key={i} className="absolute rounded-full pointer-events-none" style={{
                                    width: size, height: size, left: dot.x, top: dot.y, transform: 'translate(-50%,-50%)',
                                    zIndex: 2, opacity: dot.show ? op : 0, background: color,
                                    boxShadow: i === 0 ? `0 0 18px 5px ${dot.tone === 'rose' ? 'rgba(251,113,133,.85)' : 'rgba(34,211,238,.85)'}` : 'none',
                                    transition: 'left 360ms ease, top 360ms ease, opacity 250ms ease',
                                }} />
                            );
                        })}
                    </div>

                    <div className="relative z-10 rounded-lg border border-slate-800 bg-black/40 px-4 py-3 min-h-[92px] mt-7 sm:mt-9">
                        {log.length === 0 && <p className="font-mono text-[12px] text-slate-600">// autoplaying — or press "send payment"</p>}
                        {log.map((entry, i) => <LogLine key={i} entry={entry} />)}
                    </div>

                    <div className="demo-actions relative z-10 flex flex-wrap items-center gap-2.5 mt-5">
                        <button onClick={onSend} disabled={busy || record} className={primaryBtn}>send payment</button>
                        <button onClick={onRetrySame} disabled={busy || !record} className={secondaryBtn}>retry — same request</button>
                        <button onClick={onRetryDifferent} disabled={busy || !record} className={secondaryBtn}>retry — different amount</button>
                        <button onClick={onReset} disabled={busy} className={ghostBtn}>reset</button>
                        <span className="font-mono text-[11px] text-slate-600 ml-auto">key: {shortKey}</span>
                    </div>
                </div>
            );
        };

        const HeroDiagram = () => (
            <section className="max-w-[1360px] mx-auto px-5 sm:px-6 pt-6 sm:pt-10 pb-10 sm:pb-16">
                <div className="grid lg:grid-cols-[520px_1fr] gap-8 lg:gap-14 items-start">
                    <div className="lg:pt-6">
                        <p className="font-mono text-xs sm:text-sm text-cyan-400 tracking-wide mb-3">go · net/http middleware</p>
                        <h1 className="font-mono text-5xl sm:text-6xl lg:text-7xl font-bold text-white tracking-tight mb-5 leading-[1.02]">idempotency</h1>
                        <p className="text-slate-300 text-base sm:text-lg leading-relaxed mb-7">
                            A retried <code className="font-mono text-cyan-300">POST /payments</code> gets back the exact response the first attempt produced — the handler, and the card, run once per <code className="font-mono text-cyan-300">Idempotency-Key</code>.
                        </p>
                        <div className="flex flex-wrap gap-3">
                            <a href={GITHUB_URL} target="_blank" rel="noopener" className="inline-flex items-center gap-2 bg-cyan-400 text-slate-950 font-semibold text-sm px-6 py-3 rounded-lg hover:bg-cyan-300 transition-colors">
                                Code on GitHub

<span className="text-slate-500">store</span> <span className="text-slate-400">:=</span> <span className="text-cyan-300">idempotency</span><span className="text-slate-400">.</span><span className="text-amber-300">NewMemoryStore</span><span className="text-slate-400">()</span> <span className="text-slate-500">{"//"} or NewPostgresStore(db)</span>{"\n"}<span className="text-slate-500">mw</span> <span className="text-slate-400">:=</span> <span className="text-cyan-300">idempotency</span><span className="text-slate-400">.</span><span className="text-amber-300">New</span><span className="text-slate-400">(store)</span>{"\n\n"}<span className="text-slate-500">mux</span> <span className="text-slate-400">:=</span> <span className="text-cyan-300">http</span><span className="text-slate-400">.</span><span className="text-amber-300">NewServeMux</span><span className="text-slate-400">()</span>{"\n"}<span className="text-slate-500">mux</span><span className="text-slate-400">.</span><span className="text-amber-300">Handle</span><span className="text-slate-400">(</span><span className="text-emerald-300">"/payments"</span><span className="text-slate-400">, mw.</span><span className="text-amber-300">Handler</span><span className="text-slate-400">(http.HandlerFunc(createPayment)))</span>
                    </code>

        const GUARANTEES = [

            'Reusing a key for a genuinely different request (different method, path or body) is rejected with 422, never silently replayed.',
            'A reservation abandoned by a crashed or hung handler is reclaimed after processingTimeout (30s default) — a stuck key cannot lock out retries forever.',
            'One interface, two backends: an in-process MemoryStore for a single instance, or PostgresStore — lock-free (INSERT … ON CONFLICT DO NOTHING + a conditional UPDATE) once more than one replica can see the same key.',

        const Guarantees = () => (
