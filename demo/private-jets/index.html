<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(new URLSearchParams(location.search).get('lang')==='ru')location.replace('ru/'+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — Private jets</title>
<!-- Один файл вместо React + Tailwind + lucide-react. ?lang=ru — русская версия (у Inter есть кириллица). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#f9fafb;color:#111827}
a{color:inherit;text-decoration:none}
button{font:inherit}
.hero{position:relative;height:100vh;height:100dvh;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wrap{position:relative;height:100%;display:flex;flex-direction:column}

/* nav */
.nav{position:relative;z-index:20;width:100%;max-width:80rem;margin:0 auto;padding:24px 32px;display:flex;align-items:center;justify-content:space-between}
.gad{display:block;color:#111827}
.gad svg{display:block;height:28px;width:auto;overflow:visible}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.links{display:none;align-items:center;gap:32px}
.links a{color:#111827;transition:color .15s}
.links a:hover{color:#374151}
.burger{position:relative;width:24px;height:24px;padding:0;border:0;background:none;color:#111827;cursor:pointer}
.i{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.burger .x{display:none}
.burger.open .m{display:none}
.burger.open .x{display:block}
.drop{position:absolute;top:100%;left:32px;right:32px;display:flex;flex-direction:column;gap:4px;padding:12px;
  border-radius:16px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility .2s}
.drop.open{opacity:1;visibility:visible;transform:none}
.drop a{padding:10px 12px;border-radius:10px;color:#111827;transition:color .15s,background-color .15s}
.drop a:hover{color:#374151;background:rgba(17,24,39,.05)}

/* hero content */
.main{flex:1;display:flex;align-items:center;justify-content:center}
.content{margin-top:-20rem;padding:0 16px;text-align:center}
.kicker{margin:0 0 16px;font-size:14px;line-height:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#4b5563}
h1{margin:0;font-weight:400;font-size:3.75rem;line-height:1;letter-spacing:-.05em}
h1 span{display:block}
.l1{color:#6b7280}
.l2{color:#202A36;margin-top:-12px}
.subtitle{max-width:42rem;margin:16px auto 24px;font-size:18px;line-height:28px;color:#4b5563}
.ctas{display:flex;align-items:center;justify-content:center;gap:16px}
.ctas a{padding:8px 16px;border-radius:9999px;font-weight:500;transition:color .15s,background-color .15s}
.b1{background:#d1d5db;color:#1f2937}
.b1:hover{background:#9ca3af}
.b2{background:#202A36;color:#fff}
.b2:hover{background:#1a2229}

@media (min-width:768px){
  .links{display:flex}
  .burger,.drop{display:none}
  h1{font-size:4.5rem}
  .subtitle{font-size:20px}
}
@media (min-width:1024px){h1{font-size:6rem}}
@media (prefers-reduced-motion:reduce){.gad .ring{animation:none;stroke-dashoffset:0}.gad .orb{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <video class="bg" autoplay muted loop playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_091828_e240eb17-6edc-4129-ad9d-98678e3fd238.mp4"></video>
    <div class="wrap">
      <nav class="nav">
        <a class="gad" href="#" aria-label="g.a.d.">
          <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
            <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
            <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
            <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
          </svg>
        </a>
        <div class="links">
          <a href="#" data-t="n1">Start</a><a href="#" data-t="n2">Story</a><a href="#" data-t="n3">Rates</a><a href="#" data-t="n4">Benefits</a><a href="#" data-t="n5">FAQ</a>
        </div>
        <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">
          <svg class="i m" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>
          <svg class="i x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div class="drop" id="drop">
          <a href="#" data-t="n1">Start</a><a href="#" data-t="n2">Story</a><a href="#" data-t="n3">Rates</a><a href="#" data-t="n4">Benefits</a><a href="#" data-t="n5">FAQ</a>
        </div>
      </nav>
      <main class="main">
        <div class="content">
          <p class="kicker" data-t="kick">Private jets</p>
          <h1><span class="l1" data-t="l1">Premium.</span><span class="l2" data-t="l2">Accessible.</span></h1>
          <p class="subtitle" data-t="sub">Your dedication deserves recognition.</p>
          <div class="ctas"><a class="b1" href="#" data-t="b1">Discover</a><a class="b2" href="#" data-t="b2">Book Now</a></div>
        </div>
      </main>
    </div>
  </section>
</div>
<script>
(() => {
if (false) {
  const TR = { n1: 'Главная', n2: 'История', n3: 'Тарифы', n4: 'Преимущества', n5: 'Вопросы',
    kick: 'Частные самолёты', l1: 'Премиум.', l2: 'Доступно.', sub: 'Ваш труд заслуживает признания.',
    b1: 'Подробнее', b2: 'Забронировать' };
  document.documentElement.lang = 'ru';
  document.title = 'g.a.d. — Частные самолёты';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.textContent = t; });
  document.getElementById('burger').setAttribute('aria-label', 'Меню');
}
const burger = document.getElementById('burger'), drop = document.getElementById('drop');
const set = open => { burger.classList.toggle('open', open); drop.classList.toggle('open', open); burger.setAttribute('aria-expanded', open); };
burger.addEventListener('click', () => set(!drop.classList.contains('open')));
drop.querySelectorAll('a').forEach(a => a.addEventListener('click', () => set(false)));
})();
</script>
</body>
</html>
