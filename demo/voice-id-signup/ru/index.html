<!-- Один файл вместо React. ?lang=ru — русская версия (у Sora нет кириллицы: по-русски почта и нижняя строка набраны Manrope, «g.a.d.» остаётся в Sora). -->
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400&family=JetBrains+Mono:wght@300;400;500&family=Manrope:wght@200;300&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--text:#fff;--text-dim:rgba(255,255,255,.62);--text-dimmer:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.14);--line-strong:rgba(255,255,255,.26);--fill-ghost:rgba(255,255,255,.05);--fill-solid:rgba(255,255,255,.10);
  --gutter:clamp(20px,5vw,100px);--ease-premium:cubic-bezier(.16,1,.3,1);
  --font-display:"Sora","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-text:var(--font-display);
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
.ru{--font-text:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font-display);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body.menu-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:3px}

.hero{position:relative;width:100%;height:100vh;height:100svh;min-height:640px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;isolation:isolate}
@media (max-height:640px){.hero{min-height:100svh}}
.hero__media{position:absolute;inset:0;z-index:-1;background:#000 center/cover no-repeat}
.hero__media video{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.hero__media::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to right,transparent 0%,transparent 45%,rgba(0,0,0,.45) 72%,rgba(0,0,0,.72) 100%),
             linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 22%,transparent 78%,rgba(0,0,0,.65) 100%)}

/* навбар */
.nav{position:relative;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:32px;
  padding:max(clamp(20px,2.4vw,34px),env(safe-area-inset-top)) max(var(--gutter),env(safe-area-inset-right)) clamp(20px,2.4vw,34px) max(var(--gutter),env(safe-area-inset-left))}
.gad{display:block;color:#fff;line-height:1}
.gad svg{display:block;height:clamp(22px,1.9vw,33px);width:auto;overflow:visible}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.nav__right{display:flex;align-items:center;gap:clamp(24px,3.2vw,62px)}
.nav__links{display:flex;gap:clamp(20px,2.8vw,56px)}
.mono{font-family:var(--font-mono);font-weight:400;text-transform:uppercase}
.nav__links a,.nav__cta{font-size:clamp(11px,.78vw,14px);letter-spacing:.18em;line-height:1}
.nav__links a{transition:color .25s ease}
.nav__links a:hover{color:var(--text-dim)}
.nav__cta{padding:clamp(12px,1vw,17px) clamp(20px,1.8vw,32px);border:1px solid var(--line-strong);transition:background .25s ease,border-color .25s ease}
.nav__cta:hover{background:var(--fill-ghost);border-color:rgba(255,255,255,.5)}
.nav__toggle{display:none;position:relative;width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;margin-right:-11px}
.nav__toggle span{position:absolute;left:50%;width:22px;height:1px;background:#fff;transform:translateX(-50%);
  transition:transform .45s var(--ease-premium),top .45s var(--ease-premium),opacity .25s ease}
.nav__toggle span:nth-child(1){top:16px}
.nav__toggle span:nth-child(2){top:22px}
.nav__toggle span:nth-child(3){top:28px}
.nav__toggle.active span:nth-child(1){top:22px;transform:translateX(-50%) rotate(45deg)}
.nav__toggle.active span:nth-child(2){opacity:0;transform:translateX(-50%) scaleX(0)}
.nav__toggle.active span:nth-child(3){top:22px;transform:translateX(-50%) rotate(-45deg)}

/* меню телефона */
.menu{position:fixed;inset:0;z-index:50;background:rgba(4,4,6,.94);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4.5vh,34px);
  clip-path:circle(3% at calc(100% - 42px) 42px);opacity:0;pointer-events:none;
  transition:clip-path .7s var(--ease-premium),opacity .45s ease}
.menu.open{clip-path:circle(150% at calc(100% - 42px) 42px);opacity:1;pointer-events:auto}
.menu a{font-size:clamp(20px,5.5vw,28px);letter-spacing:.14em;line-height:1.2;opacity:0;transform:translateY(16px);
  transition:opacity .4s ease,transform .5s var(--ease-premium);transition-delay:calc(180ms + var(--i) * 70ms)}
.menu.open a{opacity:1;transform:none}
.menu .menu__cta{margin-top:12px;letter-spacing:.22em;padding:16px 40px;border:1px solid var(--line-strong);font-size:clamp(14px,3.8vw,18px)}

/* правая панель */
.hero__body{display:flex;align-items:center;justify-content:flex-end;padding:0 max(var(--gutter),env(safe-area-inset-right)) 0 max(var(--gutter),env(safe-area-inset-left));min-height:0;overflow-y:auto}
.panel{width:min(34vw,620px);min-width:380px;display:flex;flex-direction:column;align-items:flex-start;padding:12px 0}
.chip{font-size:clamp(11px,.72vw,14px);letter-spacing:.2em;background:rgba(255,255,255,.09);padding:clamp(9px,.8vw,14px) clamp(14px,1.1vw,20px);line-height:1}
h1{margin:clamp(28px,3vw,52px) 0 0;font-family:var(--font-display);font-weight:200;font-size:clamp(54px,6.2vw,118px);letter-spacing:.03em;line-height:.95}
.tagline{margin:clamp(14px,1.4vw,24px) 0 0;font-family:var(--font-mono);font-weight:300;text-transform:uppercase;font-size:clamp(11px,.94vw,17px);letter-spacing:.14em;color:var(--text-dim);line-height:1.4}
.form{margin-top:clamp(38px,4.6vw,82px);display:flex;flex-direction:column;gap:clamp(14px,1.3vw,22px);width:100%}
.form input{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-strong);border-radius:0;outline:none;
  padding:0 2px clamp(12px,1.1vw,18px);font-family:var(--font-text);font-weight:300;font-size:clamp(16px,.95vw,18px);color:#fff;transition:border-color .25s ease}
.form input::placeholder{color:var(--text-dim);transition:color .25s ease}
.form input:focus{border-bottom-color:rgba(255,255,255,.85)}
.form input:focus::placeholder{color:var(--text-dimmer)}
.form input:focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:3px}
.btn{display:block;width:100%;border:0;border-radius:0;cursor:pointer;padding:clamp(17px,1.6vw,27px) 20px;font-size:clamp(11px,.78vw,14px);letter-spacing:.22em;line-height:1.2;
  transition:background-color .25s ease,color .25s ease}
.btn--ghost{background:var(--fill-ghost);color:var(--text-dimmer)}
.btn--ghost:hover{background:rgba(255,255,255,.09);color:#fff}
.btn--solid{background:var(--fill-solid);color:#fff}
.btn--solid:hover{background:rgba(255,255,255,.17)}
.invite{align-self:center;margin-top:clamp(26px,2.6vw,46px);font-size:clamp(11px,.74vw,14px);letter-spacing:.18em;transition:color .25s ease}
.invite:hover{color:var(--text-dim);text-decoration:underline;text-underline-offset:4px}

/* нижняя строка */
.legal{margin:0;border-top:1px solid var(--line);text-align:center;font-family:var(--font-text);font-weight:300;font-size:clamp(12px,.82vw,16px);color:var(--text-dim);line-height:1.5;
  padding:clamp(18px,1.7vw,30px) max(var(--gutter),env(safe-area-inset-right)) max(clamp(18px,1.7vw,30px),env(safe-area-inset-bottom)) max(var(--gutter),env(safe-area-inset-left))}
.legal a{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;transition:color .25s ease}
.legal a:hover{color:var(--text-dim)}

@media (max-width:1100px){.panel{width:min(70vw,520px);min-width:0}}
@media (max-width:900px){.nav__links,.nav__cta{display:none}.nav__toggle{display:block}}
@media (max-width:720px){
  .hero__media::after{background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.25) 30%,rgba(0,0,0,.75) 100%)}
  .hero__body{justify-content:center}
  .panel{width:100%;align-items:stretch}
  .chip{align-self:flex-start}
}
@media (max-width:380px){h1{font-size:clamp(44px,15vw,64px)}}
@media (max-height:640px){
  .nav{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:14px}
  h1{font-size:clamp(36px,7vw,64px);margin-top:18px}
  .tagline{margin-top:10px}
  .form{margin-top:22px;gap:10px}
  .btn{padding-top:12px;padding-bottom:12px}
  .invite{margin-top:16px}
  .legal{font-size:11px;padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .menu{gap:16px}
}
@media (prefers-reduced-motion:reduce){
  .hero__media video{display:none}
  .hero__media{background-image:url(https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png)}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .gad .ring{animation:none;stroke-dashoffset:0}.gad .orb{animation:none;opacity:1}
}
</style>
<style id="cyr">/* русские буквы: исходный шрифт без кириллицы, глифы — у близкого с кириллицей */
@font-face{font-family:'Sora';font-style:normal;font-weight:200;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggqxSuXd.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Sora';font-style:normal;font-weight:200;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}

@font-face{font-family:'Sora';font-style:normal;font-weight:300;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Sora';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggqxSuXd.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
@font-face{font-family:'Sora';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}

<body>
<section class="hero">
  <div class="hero__media" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto"
      poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_133255_956f653f-5d80-4b06-abd5-0f46c98b60fa.mp4"></video>
  </div>

  <header class="nav">
    <a class="gad" href="#" aria-label="g.a.d.">
      <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
        <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
        <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
      </svg>
    </a>
    <div class="nav__right">
      <nav class="nav__links mono" aria-label="Main">
        <a href="#story" data-t="story">Story</a>
        <a href="#platforms" data-t="platforms">Platforms</a>
        <a href="#identity" data-t="identity">Identity</a>
        <a href="https://t.me/smirnovarturr" target="_blank" rel="noopener" data-t="contact">Contact</a>
      </nav>
      <a class="nav__cta mono" href="#join" data-t="join">Join up</a>
      <button class="nav__toggle" id="toggle" type="button" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Site menu" aria-hidden="true" inert>
    <a class="mono" href="#story" style="--i:0" data-t="story">Story</a>
    <a class="mono" href="#platforms" style="--i:1" data-t="platforms">Platforms</a>
    <a class="mono" href="#identity" style="--i:2" data-t="identity">Identity</a>
    <a class="mono" href="https://t.me/smirnovarturr" target="_blank" rel="noopener" style="--i:3" data-t="contact">Contact</a>
    <a class="mono menu__cta" href="#join" style="--i:4" data-t="join">Join up</a>
  </div>

  <div class="hero__body">
    <div class="panel">
      <span class="chip mono" data-t="chip">[ Voice entry ]</span>
      <h1>g.a.d.</h1>
      <p class="tagline" data-t="tag">Your voice ID to the g.a.d. network.</p>
      <form class="form" action="#" method="post" novalidate>
        <label class="sr-only" for="email" data-t="email">Email</label>
        <input id="email" type="email" name="email" placeholder="Email" autocomplete="email">
        <button class="btn btn--ghost mono" type="submit" data-t="proceed">Proceed using email</button>
        <button class="btn btn--solid mono" type="button" data-t="access">Access</button>
      </form>
      <a class="invite mono" href="#invite" data-t="invite">I've got an invite key</a>
    </div>
  </div>

  <p class="legal" data-t="legal">Opening a g.a.d. account signals that you accept our <a href="#privacy-notice">Privacy Notice</a> and <a href="#service-contract">Service Contract</a>.</p>
</section>

<script>
(() => {
const $ = id => document.getElementById(id);
if (true) {
  const TR = { story: 'История', platforms: 'Платформы', identity: 'Голос', contact: 'Контакты', join: 'Вступить',
    chip: '[ Вход по голосу ]', tag: 'Ваш голос — ключ к сети g.a.d.', email: 'Почта',
    proceed: 'Продолжить по почте', access: 'Войти', invite: 'У меня есть приглашение',
    legal: 'Открывая аккаунт g.a.d., вы принимаете <a href="#privacy-notice">Политику конфиденциальности</a> и <a href="#service-contract">Условия сервиса</a>.' };
  document.documentElement.lang = 'ru';
  document.documentElement.classList.add('ru');
  document.title = 'g.a.d. — ваш голос как ключ';
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.innerHTML = t; });
  $('email').placeholder = 'Почта';
  $('toggle').dataset.ru = '1';
}

document.querySelector('.form').addEventListener('submit', e => e.preventDefault());

// меню телефона: круг раскрывается из угла кнопки
const toggle = $('toggle'), menu = $('mobileMenu');
const RU = toggle.dataset.ru === '1';
const setMenu = open => {
  menu.classList.toggle('open', open);
  toggle.classList.toggle('active', open);
  document.body.classList.toggle('menu-open', open);
  toggle.setAttribute('aria-expanded', open);
  toggle.setAttribute('aria-label', open ? (RU ? 'Закрыть меню' : 'Close menu') : (RU ? 'Открыть меню' : 'Open menu'));
  menu.setAttribute('aria-hidden', !open);
  menu.inert = !open;
  if (!open && menu.contains(document.activeElement)) toggle.focus();
};
toggle.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
menu.addEventListener('click', e => { if (e.target === menu || e.target.closest('a')) setMenu(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('open')) { setMenu(false); toggle.focus(); } });
matchMedia('(min-width: 901px)').addEventListener('change', e => { if (e.matches) setMenu(false); });
})();
</script>
