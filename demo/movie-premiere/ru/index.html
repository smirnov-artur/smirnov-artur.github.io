<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script src="/works/js/gad-loader.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g.a.d. — Премьеры кино</title>
    <meta name="description" content="Приложение о премьерах кино от g.a.d.: стопка карточек-афиш в макете iPhone — смахните вниз, и карточка уйдёт, — сверху папочная навигация, снизу панель из матового стекла.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        };
    </script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <style>.gad-logo{display:inline-block;height:1em;width:auto;overflow:visible;vertical-align:middle}.gad-logo .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .35s forwards}.gad-logo .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.35s forwards,gad-orbit 7s linear 1.35s infinite}@keyframes gad-draw{to{stroke-dashoffset:0}}@keyframes gad-pop{to{opacity:1}}@keyframes gad-orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.gad-logo .ring{animation:none;stroke-dashoffset:0}.gad-logo .orb{animation:none;opacity:1}}</style>
    <style>
        html, body { margin: 0; height: 100%; }
        * { font-family: 'Inter', sans-serif; }
        .phone-frame {
            border-radius: 52px;
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(0, 0, 0, 0.6),
                0 0 0 10px #1a1a1e,
                0 0 0 11px rgba(255, 255, 255, 0.06),
                0 0 60px rgba(0, 0, 0, 0.5);
        }
        .liquid-glass { background: rgba(255, 255, 255, 0.01); background-blend-mode: luminosity; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: none; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1); position: relative; overflow: hidden; }
        .liquid-glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px; background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, transparent 40%, transparent 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
        .stack-card { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1); touch-action: none; user-select: none; will-change: transform, opacity; }
        @keyframes staggerFadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes staggerFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes navSlideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes cardDropOut {
            0% { transform: translateY(var(--drop-start-y, 0px)) scale(1) rotate(var(--drop-start-rot, 0deg)); opacity: var(--drop-start-opacity, 1); }
            60% { opacity: 0.3; }
            100% { transform: translateY(130%) scale(0.8) rotate(8deg); opacity: 0; }
        }
        .animate-stagger-1 { animation: staggerFadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
        .animate-stagger-2 { animation: staggerFadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
        .animate-stagger-3 { animation: staggerFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
        .animate-stagger-4 { animation: navSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
    </style>
</head>
<body class="bg-white antialiased overflow-hidden">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect, Fragment } = React;

        // Постеры — готовая графика (заголовок и слоган уже впечатаны в картинку) --
        // интерфейс добавляет сверху только бейдж длительности/жанра, как в примере из спеки.
        // Без роутинга и базы данных: бейдж — статичное значение шаблона, а не данные конкретного постера.
        // title здесь только для атрибута alt (сверено с каждой картинкой, не выдумано).
        const MOVIES = [
            { title: "The Last Letter", img: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260705_105630_4428f039-9cd3-44a3-bb7f-15c28b0703f2.png&w=1280&q=85" },
            { title: "The Shadow Lens", img: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260705_105503_6f51b402-7feb-4a64-a154-bce55a4bff52.png&w=1280&q=85" },
            { title: "Eclipse Protocol", img: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260705_105544_9e41e1d6-2da4-458f-99a5-8568241ab76b.png&w=1280&q=85" },
            { title: "Kingdom of Ashes", img: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260705_105558_d8ebccec-11f9-4445-8bae-f44e1117ca00.png&w=1280&q=85" },
            { title: "Last Witness", img: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260705_105613_e3910ee6-0196-48a4-b1e3-2a2c16c721d0.png&w=1280&q=85" },
            { title: "Titan Rising", img: "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260705_105621_a97dd98e-cf52-4084-9977-2556ac4fc1fa.png&w=1280&q=85" },
        ];

        const NAV_ITEMS = [
            { label: "Обзор", icon: "layout-grid" },
            { label: "Кино", icon: "film" },
            { label: "Список", icon: "bookmark" },
            { label: "Профиль", icon: "user" },
        ];

        const SWIPE_THRESHOLD = 80;

        const GadMark = ({ height, color }) => (
            <svg className="gad-logo" height={height} viewBox="0 0 355 110" role="img" aria-label="g.a.d." style={{ color }}>
                <path fill="currentColor" d="M53.7 66.8V57.9L54.3 55.8V43.7L53.7 41.7V27.6H70.8V66Q70.8 75.8 66.4 82.6Q61.9 89.5 54 93.1Q46.1 96.7 35.6 96.7Q28.3 96.7 22.2 94.8Q16.1 92.9 10.1 89.1V76Q15.7 80.3 21.9 82.2Q28.1 84 34.5 84Q43.8 84 48.7 79.9Q53.7 75.7 53.7 66.8ZM30.5 74.8Q23.2 74.8 17.4 71.8Q11.6 68.8 8.3 63.3Q4.9 57.8 4.9 50.5Q4.9 43.1 8.3 37.6Q11.6 32.2 17.4 29.1Q23.2 26.1 30.5 26.1Q36 26.1 40.6 27.8Q45.2 29.5 48.8 32.3Q52.4 35 54.9 38.3Q57.4 41.5 58.7 44.8Q60 48.1 60 50.7Q60 54.1 57.9 58.2Q55.9 62.4 52.1 66.2Q48.3 70 42.8 72.4Q37.4 74.8 30.5 74.8ZM36.2 63Q41.9 63 46.4 59.9Q50.9 56.9 54.3 50.5Q50.9 43.9 46.4 40.9Q41.8 37.9 36.2 37.9Q31.9 37.9 28.7 39.4Q25.6 41 23.9 43.8Q22.1 46.6 22.1 50.5Q22.1 54.2 23.8 57Q25.5 59.9 28.6 61.4Q31.8 63 36.2 63Z M84.7 80.9Q81.9 80.9 79.6 79.6Q77.4 78.3 76.1 76Q74.8 73.8 74.8 71.1Q74.8 68.3 76.1 66.1Q77.4 63.9 79.6 62.6Q81.9 61.2 84.7 61.2Q87.4 61.2 89.6 62.6Q91.8 63.9 93.2 66.1Q94.5 68.3 94.5 71.1Q94.5 73.8 93.2 76Q91.8 78.3 89.6 79.6Q87.4 80.9 84.7 80.9Z M146.4 80 144.1 61 146.6 53.8 144.1 46.7 146.4 27.6H164.2L161 53.8L164.2 80ZM150.7 53.8Q149.3 62.2 145.4 68.4Q141.6 74.6 135.7 78Q129.8 81.5 122.4 81.5Q114.7 81.5 108.9 78Q103 74.5 99.7 68.3Q96.4 62.1 96.4 53.8Q96.4 45.5 99.7 39.3Q103 33.1 108.9 29.6Q114.7 26.1 122.4 26.1Q129.8 26.1 135.7 29.5Q141.6 33 145.5 39.2Q149.4 45.3 150.7 53.8ZM113.7 53.8Q113.7 58 115.4 61.3Q117.2 64.5 120.3 66.4Q123.3 68.3 127.4 68.3Q131.4 68.3 135.1 66.4Q138.7 64.5 141.5 61.3Q144.2 58 145.6 53.8Q144.2 49.5 141.5 46.3Q138.7 43 135.1 41.1Q131.4 39.2 127.4 39.2Q123.3 39.2 120.3 41.1Q117.2 43 115.4 46.3Q113.7 49.5 113.7 53.8Z M176.9 80.9Q174.2 80.9 171.9 79.6Q169.7 78.3 168.4 76Q167.1 73.8 167.1 71.1Q167.1 68.3 168.4 66.1Q169.7 63.9 171.9 62.6Q174.2 61.2 176.9 61.2Q179.7 61.2 181.9 62.6Q184.1 63.9 185.4 66.1Q186.8 68.3 186.8 71.1Q186.8 73.8 185.4 76Q184.1 78.3 181.9 79.6Q179.7 80.9 176.9 80.9Z M239 80 236.7 60.2 239.8 54 236.8 46.1 241 9.2H258.8L253.5 52.5L256.7 80ZM242.9 53.8Q241.6 62.2 237.7 68.4Q233.8 74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z" />
                <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100" />
                <circle className="orb" cx="322" cy="8" r="5" fill="currentColor" />
            </svg>
        );

        const App = () => {
            const [order, setOrder] = useState([0, 1, 2, 3, 4, 5]);
            const [activeTab, setActiveTab] = useState("theaters");
            const [activeNav, setActiveNav] = useState(1);
            const [dragging, setDragging] = useState(false);
            const [dragY, setDragY] = useState(0);
            const [dropping, setDropping] = useState(false);
            const [dropVars, setDropVars] = useState(null);
            const startY = useRef(0);

            useEffect(() => { lucide.createIcons(); }, [order, activeTab, activeNav]);

            const front = MOVIES[order[0]];

            const onPointerDown = (e) => {
                if (dropping) return;
                startY.current = e.clientY;
                setDragging(true);
                if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
            };
            const onPointerMove = (e) => {
                if (!dragging) return;
                setDragY(Math.max(0, e.clientY - startY.current));
            };
            const onPointerUp = () => {
                if (!dragging) return;
                setDragging(false);
                if (dragY > SWIPE_THRESHOLD) {
                    setDropVars({ y: dragY, rot: dragY * 0.015, opacity: Math.max(0, 1 - dragY / 260) });
                    setDropping(true);
                    setTimeout(() => {
                        setOrder((o) => [...o.slice(1), o[0]]);
                        setDropping(false);
                        setDragY(0);
                        setDropVars(null);
                    }, 480);
                } else {
                    setDragY(0);
                }
            };

            return (
                <div className="h-screen w-screen flex items-center justify-center relative" style={{ background: 'radial-gradient(30% 38% at 50% 58%, rgba(214,155,84,0.5) 0%, rgba(214,155,84,0) 72%), radial-gradient(24% 28% at 24% 24%, rgba(255,224,190,0.35) 0%, rgba(255,224,190,0) 70%), radial-gradient(95% 125% at 50% 42%, #3a2a28 0%, #5c3f3a 38%, #83594f 72%, #a8735f 100%)' }}>
                    <div className="absolute top-6 left-6 hidden md:block" style={{ color: "#0f172a" }}>
                        <GadMark height={18} color="#0f172a" />
                    </div>

                    <div className="phone-frame relative overflow-hidden" style={{ width: 375, height: 780 }}>
                        <div className="absolute top-[10px] left-1/2 -translate-x-1/2 w-[126px] h-[34px] bg-black rounded-full z-[100]" />

                        <img src={front.img} alt="" className="absolute inset-0 w-full h-full object-cover scale-110 brightness-50" style={{ filter: "blur(40px)" }} />
                        <div className="absolute inset-0 bg-black/30" />

                        <div className="relative z-10 flex flex-col h-full">
                            <div className="flex items-end px-1 pt-12 animate-stagger-1">
                                <span className="text-[11px] font-medium px-5 py-2.5 text-white/40">Премьеры</span>
                                <div className="relative flex-1 bg-black rounded-tl-[28px] rounded-tr-[28px] py-4 px-1 flex items-center">
                                    <div className="absolute -left-7 bottom-0 w-7 h-7" style={{ background: "radial-gradient(circle at 0% 0%, transparent 28px, #000 28px)" }} />
                                    <button onClick={() => setActiveTab("theaters")} className={"text-[12px] font-medium px-4 transition-colors " + (activeTab === "theaters" ? "text-white" : "text-white/40")}>В прокате</button>
                                    <button onClick={() => setActiveTab("upcoming")} className={"ml-auto flex items-center gap-1 text-[12px] font-medium px-4 transition-colors " + (activeTab === "upcoming" ? "text-white" : "text-white/40")}>
                                        Скоро <i data-lucide="chevron-right" style={{ width: 12, height: 12 }}></i>
                                    </button>
                                </div>
                            </div>

                            <div className="flex-1 bg-black rounded-tl-[28px] relative flex flex-col items-center overflow-hidden">
                                <div className="text-[58px] leading-none tracking-tight text-center mt-5 mb-4 animate-stagger-2">
                                    <span className="font-extrabold text-white">05</span>
                                    <span className="font-bold text-white/80"> ИЮЛ</span>
                                </div>

                                <div className="relative flex-1 w-full px-6 pb-6 animate-stagger-3" style={{ perspective: 1200 }}>
                                    {MOVIES.map((m, idx) => {
                                        const position = order.indexOf(idx);
                                        const p = Math.min(position, 5);
                                        const isFront = position === 0;
                                        const opacityMap = [1, 0.85, 0.6, 0.4, 0, 0];
                                        const baseTransform = `translateY(${-24 * p}px) scale(${1 - 0.05 * p})`;
                                        let style;
                                        if (isFront && dropping && dropVars) {
                                            style = {
                                                zIndex: 6,
                                                "--drop-start-y": dropVars.y + "px",
                                                "--drop-start-rot": dropVars.rot + "deg",
                                                "--drop-start-opacity": dropVars.opacity,
                                                animation: "cardDropOut 0.48s cubic-bezier(0.4,0,0.2,1) forwards",
                                            };
                                        } else if (isFront && dragging) {
                                            style = {
                                                zIndex: 6,
                                                transform: `translateY(${dragY}px) rotate(${dragY * 0.015}deg)`,
                                                opacity: Math.max(0, 1 - dragY / 260),
                                                transition: "none",
                                            };
                                        } else {
                                            style = { zIndex: 6 - position, transform: baseTransform, opacity: opacityMap[p] };
                                        }
                                        return (
                                            <div
                                                key={idx}
                                                className={"stack-card absolute inset-0 rounded-[20px] overflow-hidden" + (isFront && !dropping ? " cursor-grab active:cursor-grabbing" : "")}
                                                style={style}
                                                onPointerDown={isFront ? onPointerDown : undefined}
                                                onPointerMove={isFront ? onPointerMove : undefined}
                                                onPointerUp={isFront ? onPointerUp : undefined}
                                            >
                                                <img src={m.img} alt={"Постер фильма «" + m.title + "»"} className="absolute inset-0 w-full h-full object-cover" draggable="false" />
                                                {isFront && (
                                                    <Fragment>
                                                        <div className="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent" />
                                                        <div className="absolute top-3 left-3 flex flex-col gap-2">
                                                            <span className="flex items-center gap-1.5 bg-black rounded-full px-3 py-1.5 text-white/90 text-xs">
                                                                <i data-lucide="clock" style={{ width: 12, height: 12 }}></i>2 ч 15 мин
                                                            </span>
                                                            <span className="flex items-center gap-1.5 bg-black rounded-full px-3 py-1.5 text-white/90 text-xs">
                                                                <i data-lucide="popcorn" style={{ width: 12, height: 12 }}></i>Фантастика
                                                            </span>
                                                        </div>
                                                    </Fragment>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="absolute bottom-6 left-1/2 z-20 liquid-glass rounded-full flex items-center gap-1 px-2 py-2 animate-stagger-4">
                            {NAV_ITEMS.map((item, i) => {
                                const active = i === activeNav;
                                return (
                                    <button key={item.label} onClick={() => setActiveNav(i)} aria-label={item.label}
                                        className={"flex items-center gap-1.5 rounded-full transition-all duration-300 " + (active ? "bg-white/10 text-white px-4 py-2.5" : "text-white/40 px-3 py-2.5")}>
                                        <i data-lucide={item.icon} style={{ width: 20, height: 20 }}></i>
                                        {active && <span className="text-xs font-medium whitespace-nowrap">{item.label}</span>}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
