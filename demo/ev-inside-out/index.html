function preload(mode) {

  pending.forEach(option => {

      if (!cancelled) { const f = new Set(S.failed); f.delete(option.image); set({ loaded: new Set(S.loaded).add(option.image), failed: f }); }
    }).catch(() => { if (!cancelled) set({ failed: new Set(S.failed).add(option.image) }); }); };
    image.onerror = () => { if (!cancelled) set({ failed: new Set(S.failed).add(option.image) }); };
    image.src = option.image;
  });
  return () => { cancelled = true; pending.forEach(option => optionLoads.delete(option.image)); };
}

    exp.style.setProperty('--scene-width', S.plane.width + 'px'); exp.style.setProperty('--scene-height', S.plane.height + 'px');
    Object.assign(planeEl.style, { width: S.plane.width + 'px', height: S.plane.height + 'px', left: S.plane.left + 'px', top: S.plane.top + 'px' });
  }
  planeEl.style.setProperty('--focus-x', cur.anchor.x + '%'); planeEl.style.setProperty('--focus-y', cur.anchor.y + '%');
  apVisual.classList.toggle('shown', !!(S.appearance && S.neutral && !S.appearanceClosing));
  if (apImg.getAttribute('src') !== S.appearanceImage) apImg.src = S.appearanceImage;
  detailVisual.classList.toggle('shown', S.detailVisible);
  if (detailImg.getAttribute('src') !== cur.image) detailImg.src = cur.image;
  detailImg.alt = T.cutaway(cur.label);

  // точки обзора
  const showHs = S.phase === 'overview' && S.ready, hv = S.hovered || S.auto;
  for (const it of HS) {
    if (showHs && !it.el.isConnected) planeEl.append(it.el);
    if (!showHs && it.el.isConnected) it.el.remove();
    const enabled = canUseHotspot(S.appearance, it.id, S.appearanceClosing);
    it.btn.disabled = !enabled;
    if (it.appearance) {
      const open = S.appearance === it.id && !S.appearanceClosing;
      it.el.classList.toggle('expanded', S.appearance === it.id);
      it.btn.classList.toggle('active', S.appearance === it.id);
      it.btn.setAttribute('aria-expanded', open);
      const icon = S.appearance === it.id && S.appearancePinned ? 'x' : 'plus';
      if (it.icon !== icon) { it.icon = icon; it.ring.innerHTML = ic(icon, 14, 1.5); }
      if (open && !it.menu) { it.bridge = h('span', 'menu-bridge'); it.bridge.setAttribute('aria-hidden', 'true'); it.menu = buildMenu(it.id); it.el.append(it.bridge, it.menu); }
      if (!open && it.menu) { it.bridge.remove(); it.menu.remove(); it.menu = it.bridge = null; }
      if (it.menu) updateMenu(it.menu, it.id);
    } else it.btn.classList.toggle('active', hv === it.id);
  }

  // разрез: точки и текст
  if (S.phase === 'detail' && annFor !== S.selected) {
    annEls.forEach(b => b.remove()); annFor = S.selected;
    annEls = cur.points.map((point, i) => {
      const b = h('button', 'annotation', `<span>${pad(i + 1)}</span><span class="annotation-label">${esc(point.label)}</span>`);
      b.style.left = point.x + '%'; b.style.top = point.y + '%'; b.setAttribute('aria-label', point.label);
      b.addEventListener('click', () => set({ annotation: S.annotation === i ? null : i }));
      planeEl.append(b); return b;
    });
  }
  if (S.phase !== 'detail' && annEls.length) { annEls.forEach(b => b.remove()); annEls = []; annFor = null; }
  annEls.forEach((b, i) => { b.classList.toggle('open', S.annotation === i); b.setAttribute('aria-expanded', S.annotation === i); });

  intro.classList.toggle('hide', S.phase !== 'overview'); intro.setAttribute('aria-hidden', S.phase !== 'overview');
  if (S.phase !== 'overview') {
    if (!back.isConnected) stage.insertBefore(back, detailCopy);
    back.disabled = busy; backLabel.textContent = S.phase === 'returning' ? T.returning : T.back;
  } else if (back.isConnected) back.remove();

  if (builtFor !== S.selected) { builtFor = S.selected; buildDetail(cur); }
  detailCopy.classList.toggle('shown', S.phase === 'detail'); detailCopy.setAttribute('aria-hidden', S.phase !== 'detail');
  parts.forEach((p, i) => {
    const on = S.annotation === i;
    p.b.tabIndex = S.phase === 'detail' ? 0 : -1; p.b.classList.toggle('selected', on); p.b.setAttribute('aria-expanded', on);
    if (on && !p.desc) { p.desc = h('span', 'part-description'); p.desc.textContent = p.text; p.b.append(p.desc); }
    if (!on && p.desc) { p.desc.remove(); p.desc = null; }
  });

  if (busy || !S.ready) {
    if (!status.isConnected) stage.append(status);
    statusText.textContent = !S.ready ? T.preparing : S.phase === 'returning' ? T.toExterior : T.inside(cur.label);
  } else if (status.isConnected) status.remove();

  baseNote.textContent = S.phase === 'overview' ? T.baseOverview : T.baseDetail;
  srStatus.textContent = busy ? (S.phase === 'entering' ? T.opening(cur.label) : T.closing(cur.label)) : S.phase === 'detail' ? T.view(cur.label) : T.overview;
  if (S.error) { errorBox.firstChild.textContent = S.error; if (!errorBox.isConnected) exp.append(errorBox); } else if (errorBox.isConnected) errorBox.remove();

  // эффекты после отрисовки
  if (S.appearance !== lastAppearance) { lastAppearance = S.appearance; cancelPreload?.(); cancelPreload = S.appearance ? preload(S.appearance) : null; }
  const deps = desiredHover() + '|' + S.phase + '|' + S.reduced;
  if (deps !== lastDeps) { lastDeps = deps; hover.update(); }
}

// ---- размер плоскости снимка ----
function updatePlane() {
  const { width } = stage.getBoundingClientRect();
  const mobile = width <= 900;
  // Кадр, медиа и точки живут на одной неизменной плоскости координат.
  const mediaHeight = Math.max(700, innerHeight) - (innerHeight <= 780 ? 64 : 76) - 164 - 88;
  const w = mobile ? width - 40 : Math.min(width - 2 * Math.min(72, Math.max(24, width * .04)), mediaHeight * 1672 / 941);
  const hh = w * 941 / 1672;
  set({ plane: { width: w, height: hh, left: (width - w) / 2, top: mobile ? 132 : 88 } });
}
new ResizeObserver(updatePlane).observe(stage);
addEventListener('resize', updatePlane);
const media = matchMedia('(prefers-reduced-motion: reduce)');
const upd = () => set({ reduced: media.matches }); upd(); media.addEventListener('change', upd);
Promise.all([ROOT_IMAGE, systems.battery.image, systems.drive.image].map(source => new Promise((resolve, reject) => {
  const image = new Image();
  image.onload = () => { image.decode().then(resolve, resolve); };
  image.onerror = reject;
  image.src = source;
}))).then(() => set({ ready: true })).catch(() => set({ error: T.loadError }));
render();

// ---- автопилот (правило портфолио: первый экран движется сам) ----
// Пока человек не трогает страницу, по очереди открывается капот и показывается батарея — те же ролики, что при наведении.
let lastUser = -1e9, step = 0;
const user = () => { lastUser = performance.now(); if (S.auto) set({ auto: null }); };
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(t => addEventListener(t, user, { passive: true, capture: true }));
addEventListener('pointermove', e => { if (e.movementX || e.movementY) user(); }, { passive: true, capture: true });
const STEPS = [['drive', 2600], [null, 1300], ['battery', 2600], [null, 1300]];
(function pilot() {
  const free = S.ready && S.phase === 'overview' && !S.appearance && !S.hovered && !S.reduced && !document.hidden && performance.now() - lastUser > 5000;
  if (!free) { if (S.auto) set({ auto: null }); setTimeout(pilot, 700); return; }
  const [target, ms] = STEPS[step++ % STEPS.length];
  set({ auto: target });
  setTimeout(pilot, ms);
})();
})();
</script>
