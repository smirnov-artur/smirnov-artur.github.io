        <button class="planet planet-r" type="button" data-slot="r">
          <img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png">
          <img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png">

<script>
(function(){
  var ORDER = ['earth','venus','mars'];
  var DATA = {
    earth: {
      name: 'EARTH',
      lede: 'Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!'
    },
    venus: {
      name: 'VENUS',
      lede: 'The hottest world in our solar system, wrapped in clouds of sulfuric acid. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!'
    },
    mars: {
      name: 'MARS',
      lede: 'The rust-red desert world, home to the tallest volcano we know of. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!'
    }
  };
  var STILL = {
    earth: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png',
    venus: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png',
    mars: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png'
  };

  var sky = document.querySelector('.sky');
  var clips = {};
  ORDER.forEach(function(p){ clips[p] = document.querySelector('.sky video[data-planet="' + p + '"]'); });
  var titleLine = document.querySelector('h1.title .ent-line');
  var lede = document.querySelector('p.lede');
  var btnL = document.querySelector('.planet-l'), btnR = document.querySelector('.planet-r');
  var labelL = document.querySelector('.label-l'), labelR = document.querySelector('.label-r');
  var featured = null;

  function fillSlot(btn, label, planet){
    btn.querySelectorAll('img').forEach(function(img){
      img.classList.toggle('is-shown', img.dataset.planet === planet);
    });
    btn.dataset.planet = planet;
    btn.setAttribute('aria-label', 'Show ' + DATA[planet].name);
    label.textContent = DATA[planet].name;
  }

  function show(next){
    if (!DATA[next] || next === featured) return;
    featured = next;
    ORDER.forEach(function(p){
      var v = clips[p];
      if (p === next && !v.getAttribute('src') && v.dataset.src) v.setAttribute('src', v.dataset.src);
      if (p === next) {
        v.classList.add('is-active');
        var pr = v.play();
        if (pr && pr.catch) pr.catch(function(){});
      } else {
        v.classList.remove('is-active');
        v.pause();
      }
    });
    sky.style.backgroundImage = 'url(' + STILL[next] + ')';
    titleLine.textContent = DATA[next].name;
    lede.innerHTML = DATA[next].lede;
    var rest = ORDER.filter(function(p){ return p !== next; });
    fillSlot(btnL, labelL, rest[0]);
    fillSlot(btnR, labelR, rest[1]);
  }

  function warm(planet){
    var v = clips[planet];
    if (v && !v.getAttribute('src') && v.dataset.src) {
      v.setAttribute('preload', 'auto');
      v.setAttribute('src', v.dataset.src);
      v.load();
    }
  }

  [btnL, btnR].forEach(function(btn){
    btn.addEventListener('pointerenter', function(){ warm(btn.dataset.planet); });
    btn.addEventListener('focus', function(){ warm(btn.dataset.planet); });
    btn.addEventListener('click', function(){ show(btn.dataset.planet); });
  });

  show('earth');

  function warmAll(){ ORDER.forEach(warm); }
  if ('requestIdleCallback' in window) requestIdleCallback(warmAll, { timeout: 4000 });
  else setTimeout(warmAll, 2500);

  // burger menu
  var navrow = document.querySelector('.navrow');
  var burger = document.querySelector('.burger');
  var links = document.querySelector('.links');
  function setOpen(open){
    navrow.dataset.open = open ? 'true' : 'false';
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  }
  setOpen(false);
  burger.addEventListener('click', function(e){ e.stopPropagation(); setOpen(navrow.dataset.open !== 'true'); });
  document.addEventListener('click', function(e){
    if (navrow.dataset.open === 'true' && !links.contains(e.target) && !burger.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && navrow.dataset.open === 'true') { setOpen(false); burger.focus(); }
  });
  links.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(){ setOpen(false); }); });

  // entrance animation
  if (document.documentElement.classList.contains('anim')) {
    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    var guard = new Promise(function(res){ setTimeout(res, 500); });
    Promise.race([fontsReady, guard]).then(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          document.documentElement.classList.add('play');
          setTimeout(function(){
            document.documentElement.classList.remove('anim');
            document.documentElement.classList.remove('play');
          }, 2150);
        });
      });
    });
  }
})();
</script>
