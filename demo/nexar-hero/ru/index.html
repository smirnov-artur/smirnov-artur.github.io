                {WAVE.map((h, i) => <div key={i} className="w-0.5 bg-blue-400 rounded-full" style={{ height: h * 0.8 }}></div>)}
              </div>
              <button className="absolute -bottom-4 left-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-white shadow flex items-center justify-center" aria-label="микрофон">
                <i data-lucide="mic" className="w-4 h-4 text-gray-900"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</body>
</html>
