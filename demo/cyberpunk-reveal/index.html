<style>
* { font-family: 'JetBrains Mono', monospace; }
body { margin: 0; overflow-x: hidden; }

@keyframes kenBurns { from { transform: scale(1.12); } to { transform: scale(1); } }
.ken-burns { animation: kenBurns 2.4s cubic-bezier(0.22,1,0.36,1) forwards; }

@keyframes heroRise {
  from { opacity: 0; transform: translateY(26px); filter: blur(8px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.hero-rise { opacity: 0; animation: heroRise 0.95s cubic-bezier(0.22,1,0.36,1) forwards; }

@keyframes navDrop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
.nav-drop { opacity: 0; animation: navDrop 0.8s cubic-bezier(0.22,1,0.36,1) 0.1s forwards; }

@keyframes arcDraw { to { stroke-dashoffset: 0; } }
.arc-line { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: arcDraw 1.6s cubic-bezier(0.65,0,0.35,1) forwards; }

@keyframes popIn { 0% { opacity: 0; transform: scale(0.4); } 15% { opacity: 1; } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.arc-dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: popIn 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards; }

@keyframes pulseRing { 0% { transform: scale(1); opacity: 0.35; } 100% { transform: scale(1.45); opacity: 0; } }
.arc-ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: arcRingIn 0.01s linear forwards, pulseRing 2.8s ease-in-out infinite; }
@keyframes arcRingIn { to { opacity: 0.35; } }

@keyframes arcFadeIn { to { opacity: 1; } }
.arc-text { opacity: 0; animation: arcFadeIn 0.7s ease forwards; }

@media (prefers-reduced-motion: reduce) {
  .ken-burns, .hero-rise, .nav-drop, .arc-dot, .arc-text { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }

74.6 228 78Q222.1 81.5 214.7 81.5Q207 81.5 201.1 78Q195.3 74.5 192 68.3Q188.7 62.1 188.7 53.8Q188.7 45.5 192 39.3Q195.3 33.1 201.1 29.6Q207 26.1 214.7 26.1Q222.1 26.1 228 29.5Q233.8 33 237.8 39.2Q241.7 45.3 242.9 53.8ZM206 53.8Q206 58 207.7 61.3Q209.5 64.5 212.5 66.4Q215.6 68.3 219.7 68.3Q223.7 68.3 227.4 66.4Q231 64.5 233.7 61.3Q236.5 58 237.9 53.8Q236.5 49.5 233.7 46.3Q231 43 227.4 41.1Q223.7 39.2 219.7 39.2Q215.6 39.2 212.5 41.1Q209.5 43 207.7 46.3Q206 49.5 206 53.8Z M269.4 80.9Q266.6 80.9 264.4 79.6Q262.1 78.3 260.8 76Q259.6 73.8 259.6 71.1Q259.6 68.3 260.8 66.1Q262.1 63.9 264.4 62.6Q266.6 61.2 269.4 61.2Q272.2 61.2 274.4 62.6Q276.6 63.9 277.9 66.1Q279.2 68.3 279.2 71.1Q279.2 73.8 277.9 76Q276.6 78.3 274.4 79.6Q272.2 80.9 269.4 80.9Z"/>
        <circle className="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" strokeWidth="6" strokeLinecap="round" transform="rotate(-90 322 30)" pathLength="100" strokeDasharray="100" strokeDashoffset="100"/>

function Nav() {
    const [open, setOpen] = useState(false);
    useEffect(() => { lucide.createIcons(); });
    return (
        <nav className="nav-drop fixed top-0 left-0 right-0 z-50 flex items-center justify-between md:justify-center p-4 sm:p-5">
            <div className="hidden md:flex items-center gap-1 rounded-full bg-black/60 backdrop-blur-md pl-3 pr-2 py-2">
                <GadLogo style={{ height: '22px', color: '#fff' }} />
                {NAV_LINKS.map((l, i) => (
                    <a key={l} href="#" className={`rounded-full px-3 py-1.5 text-sm font-medium hover:bg-white/10 hover:text-white ${i === 0 ? 'text-white' : 'text-gray-300'}`}>{l}</a>
                ))}
                <button className="ml-1 rounded-full bg-white px-5 py-1.5 text-sm font-semibold text-gray-900 hover:bg-gray-100">Connect</button>
            </div>

            <div className="flex items-center rounded-full bg-black/60 backdrop-blur-md p-2 md:hidden">

            </div>

const ARC_CENTER = { x: -110, y: 300 };
function polar(r, deg) {
    const rad = deg * Math.PI / 180;
    return { x: ARC_CENTER.x + r * Math.cos(rad), y: ARC_CENTER.y + r * Math.sin(rad) };
}
const ARCS = [
    { r: 330, start: -92, end: 16, dot: -46, value: '10+', label: 'YEARS REAL' },
    { r: 395, start: -56, end: 60, dot: 2, value: '40+', label: 'USE FORMS' },
    { r: 460, start: -14, end: 72, dot: 44, value: '95%', label: 'REPEAT MEMBERS' },
];

function StatsArc() {
    return (
        <div className="pointer-events-none absolute inset-y-0 right-0 z-[50] hidden sm:block">
            <svg viewBox="0 0 380 700" preserveAspectRatio="xMaxYMid meet" className="h-full w-auto">
                <defs>
                    {ARCS.map((a, i) => {
                        const p1 = polar(a.r, a.start), p2 = polar(a.r, a.end);
                        return (
                            <linearGradient key={i} id={`arcGrad${i}`} gradientUnits="userSpaceOnUse" x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}>
                                <stop offset="0%" stopColor="#fff" stopOpacity="0" />
                                <stop offset="22%" stopColor="#fff" stopOpacity="0.5" />
                                <stop offset="55%" stopColor="#fff" stopOpacity="0.5" />
                                <stop offset="85%" stopColor="#fff" stopOpacity="0.1" />
                                <stop offset="100%" stopColor="#fff" stopOpacity="0" />
                            </linearGradient>
                        );
                    })}
                </defs>
                {ARCS.map((a, i) => {
                    const p1 = polar(a.r, a.start), p2 = polar(a.r, a.end);
                    const dotP = polar(a.r, a.dot);
                    const len = a.r * Math.abs(a.end - a.start) * Math.PI / 180;
                    const lineDelay = 0.4 + i * 0.22;
                    const dotDelay = lineDelay + 0.9;
                    const m = a.value.match(/^(\d+)(.*)$/);
                    return (
                        <g key={i}>
                            <path className="arc-line" d={`M ${p1.x} ${p1.y} A ${a.r} ${a.r} 0 0 1 ${p2.x} ${p2.y}`} fill="none" stroke={`url(#arcGrad${i})`} strokeWidth="1.1" style={{ '--len': len, animationDelay: `${lineDelay}s` }} />
                            <circle className="arc-dot" cx={dotP.x} cy={dotP.y} r="3.4" fill="#fff" style={{ animationDelay: `${dotDelay}s` }} />
                            <circle className="arc-ring" cx={dotP.x} cy={dotP.y} r="7" fill="none" stroke="#fff" strokeOpacity="0.35" style={{ animationDelay: `${dotDelay + 0.3}s` }} />
                            <text className="arc-text" x={dotP.x + 16} y={dotP.y + 4} fill="#fff" fontSize="32" style={{ letterSpacing: '-1px', animationDelay: `${dotDelay + 0.15}s` }}>
                                {m[1]}<tspan fontSize="19" dy="-10">{m[2]}</tspan>
                            </text>
                            <text className="arc-text" x={dotP.x + 18} y={dotP.y + 22} fill="#fff" fillOpacity="0.8" fontSize="8.5" fontWeight="600" style={{ letterSpacing: '2px', animationDelay: `${dotDelay + 0.3}s` }}>
                                {a.label}
                            </text>
                        </g>
                    );
                })}
            </svg>
        </div>
    );
}

function Hero() {
    const gridRef = useRef(null);
    const maskRef = useRef(null);

    useEffect(() => {
        let raf;
        const cursor = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        const gridSmooth = { x: 0, y: 0 };
        const maskSmooth = { x: -999, y: -999 };

        function onMove(e) { cursor.x = e.clientX; cursor.y = e.clientY; }
        window.addEventListener('mousemove', onMove);

        function tick() {
            const nx = cursor.x / window.innerWidth - 0.5;
            const ny = cursor.y / window.innerHeight - 0.5;
            gridSmooth.x += (nx * 16 - gridSmooth.x) * 0.06;
            gridSmooth.y += (ny * 16 - gridSmooth.y) * 0.06;
            if (gridRef.current) {
                gridRef.current.setAttribute('x', gridSmooth.x.toFixed(2));
                gridRef.current.setAttribute('y', gridSmooth.y.toFixed(2));
            }
            maskSmooth.x += (cursor.x - maskSmooth.x) * 0.1;
            maskSmooth.y += (cursor.y - maskSmooth.y) * 0.1;
            if (maskRef.current) {
                const g = `radial-gradient(circle 260px at ${maskSmooth.x}px ${maskSmooth.y}px, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 40%, rgba(255,255,255,0.75) 60%, rgba(255,255,255,0.4) 75%, rgba(255,255,255,0.12) 88%, rgba(255,255,255,0) 100%)`;
                maskRef.current.style.maskImage = g;
                maskRef.current.style.webkitMaskImage = g;
            }
            raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);

        return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', onMove); };
    }, []);

    return (
        <section className="relative overflow-hidden" style={{ height: '100dvh' }}>
            <svg className="absolute inset-0 h-full w-full" style={{ zIndex: 0, opacity: 0.1 }}>
                <defs>
                    <pattern ref={gridRef} id="grid" width="48" height="48" patternUnits="userSpaceOnUse" x="0" y="0">
                        <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" strokeWidth="0.6" />
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)" />
            </svg>

            <div className="ken-burns absolute inset-0" style={{ zIndex: 10, backgroundImage: `url(${BG_IMAGE_1})`, backgroundSize: 'cover', backgroundPosition: 'center' }} />

            <div ref={maskRef} className="absolute inset-0" style={{ zIndex: 30, backgroundImage: `url(${BG_IMAGE_2})`, backgroundSize: 'cover', backgroundPosition: 'center', maskSize: '100% 100%', WebkitMaskSize: '100% 100%' }} />

            <StatsArc />

            <div className="absolute z-[50] bottom-12 left-5 max-w-[300px] sm:bottom-16 sm:left-8 sm:max-w-md md:bottom-24 md:left-12">
                <p className="hero-rise text-[11px] font-semibold tracking-[0.12em] text-white/90 sm:text-xs" style={{ animationDelay: '0.15s' }}>
                    Gateway to your <span className="italic">augmented self</span>
                </p>
                <h1 className="hero-rise mt-3 text-4xl leading-[1.05] tracking-[-0.08em] text-white sm:text-5xl md:text-6xl" style={{ animationDelay: '0.3s' }}>
                    A window<br />of coming<br />enhancements
                </h1>
                <p className="hero-rise mt-4 text-sm leading-relaxed text-white/90 sm:text-base" style={{ animationDelay: '0.5s' }}>
                    A future where carbon fiber, titanium, and human instinct align. Not machine. Not human. Something wonderfully poised between.
                </p>
                <button className="hero-rise reserve-btn group relative mt-6 overflow-hidden rounded-full bg-white px-7 py-3 font-semibold text-gray-900 shadow-lg shadow-black/20 transition-transform hover:scale-[1.04] active:scale-95 sm:px-8 sm:py-3.5" style={{ animationDelay: '0.7s' }}>
                    <span className="relative z-10">Reserve Now</span>
                    <span className="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/60 to-transparent transition-transform duration-700 group-hover:translate-x-full"></span>
                </button>
            </div>
        </section>
    );
}

function App() {
    return (
        <div className="min-h-screen bg-white tracking-[-0.02em]" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
            <Nav />
            <Hero />
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
