<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g.a.d. — creative studio</title>
<!-- Один файл вместо React + Tailwind + framer-motion + lucide-react. ?lang=ru — русская версия
     (у Almarai и Instrument Serif нет кириллицы: по-русски Manrope и курсив Cormorant).
     Огромное слово бренда в первом экране — наш логотип. В «О себе» вместо выдуманного Marcus Chen — g.a.d.,
     вместо «семь лет с Parallax и Noir Studio, награды фестивалей» — нейтральный текст без чужих компаний и наград. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&text=g.ad&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{font-family:'Almarai',-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu','Cantarell',sans-serif}
.ru *{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.serif,.ru .serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.ru .serif{font-family:'Cormorant',serif;font-weight:500}
html,body{background:#000}
body{color:#E1E0CC;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.noise-overlay{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(../%23n)'/%3E%3C/svg%3E")}
.bg-noise{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(../%23n)'/%3E%3C/svg%3E")}

/* появление */
.up{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.in .up,.up.in{opacity:1;transform:none}
.pw{display:inline-block;opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
.in .pw{opacity:1;transform:none}

/* 1. первый экран */
.hero{height:100vh;height:100dvh;padding:16px}
.frame{position:relative;height:100%;border-radius:16px;overflow:hidden;background:#000}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .noise-overlay{position:absolute;inset:0;opacity:.7;mix-blend-mode:overlay;pointer-events:none}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent,rgba(0,0,0,.6));pointer-events:none}
.nav{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;background:#000;border-radius:0 0 16px 16px;padding:8px 16px;display:flex;gap:12px;white-space:nowrap}
.nav a{font-size:10px;line-height:16px;color:rgba(225,224,204,.8);transition:color .2s}
.nav a:hover{color:#E1E0CC}
.hc{position:absolute;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end;gap:16px;padding:0 16px 20px}
.hh{grid-column:span 12;line-height:.85;min-width:0}
.hh .pw{display:block;max-width:100%}
.gad{display:block;color:#E1E0CC;width:71vw;max-width:100%}
.gad svg{display:block;width:100%;height:auto;overflow:visible}
.gad svg text{font-family:'Unbounded',sans-serif}
.gad .ring{animation:gad-draw 1.1s cubic-bezier(.65,0,.35,1) .6s forwards}
.gad .orb{opacity:0;transform-box:view-box;transform-origin:322px 30px;animation:gad-pop .3s ease 1.6s forwards,gad-orbit 7s linear 1.6s infinite}
@keyframes gad-draw{to{stroke-dashoffset:0}}
@keyframes gad-pop{to{opacity:1}}
@keyframes gad-orbit{to{transform:rotate(360deg)}}
.hr{grid-column:span 12;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.hr p{color:rgba(222,219,200,.7);font-size:12px;line-height:1.2;max-width:28rem}
.join{display:inline-flex;align-items:center;gap:8px;background:#DEDBC8;color:#000;border-radius:9999px;padding:4px 4px 4px 20px;font-size:14px;font-weight:700;transition:gap .3s}
.join:hover{gap:12px}
.join .c{width:36px;height:36px;border-radius:9999px;background:#000;color:#DEDBC8;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.join:hover .c{transform:scale(1.1)}
.join .c .i{width:16px;height:16px}

/* 2. о себе */
.about{background:#000;padding:16px}
.acard{background:#101010;border-radius:16px;max-width:72rem;margin:0 auto;text-align:center;padding:72px 20px}
.label{color:#DEDBC8;font-size:10px;line-height:14px;letter-spacing:.08em;text-transform:uppercase}
.ah{margin:24px auto 0;max-width:48rem;font-size:30px;line-height:.95;font-weight:400;color:#E1E0CC;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.25em;row-gap:.05em}
.letters{margin:40px auto 0;max-width:40rem;color:#DEDBC8;font-size:12px;line-height:1.6}
.letters .w{display:inline-block;white-space:nowrap}
.letters .ch{opacity:.2}

/* 3. возможности */
.features{position:relative;min-height:100vh;background:#000;padding:80px 16px;overflow:hidden}
.features .bg-noise{position:absolute;inset:0;opacity:.15;pointer-events:none}
.fh{position:relative;max-width:56rem;margin:0 auto 48px;text-align:center;font-size:20px;line-height:1.25;font-weight:400;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em}
.fh .g{color:#6b7280}
.fh .br{flex-basis:100%;height:0}
.grid{position:relative;display:grid;grid-template-columns:1fr;gap:12px;max-width:90rem;margin:0 auto}
.fc{position:relative;border-radius:16px;overflow:hidden;min-height:340px;opacity:0;transform:scale(.95);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.grid.in .fc{opacity:1;transform:none}
.fc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc .cap{position:absolute;left:20px;right:20px;bottom:20px;color:#E1E0CC;font-size:20px;line-height:1.2}
.ft{background:#212121;padding:24px;display:flex;flex-direction:column}
.ft img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.ft h3{margin-top:24px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:20px;line-height:1.2;font-weight:400;color:#E1E0CC}
.ft h3 span{font-size:12px;color:#6b7280}
.ft ul{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:12px}
.ft li{display:flex;gap:10px;align-items:flex-start;color:#9ca3af;font-size:14px;line-height:1.35}
.ft li .i{width:16px;height:16px;flex:none;color:#DEDBC8;margin-top:1px}
.more{margin-top:auto;padding-top:28px;display:inline-flex;align-items:center;gap:6px;color:#DEDBC8;font-size:14px;align-self:flex-start}
.more .i{width:16px;height:16px;transform:rotate(-45deg);transition:transform .3s}
.more:hover .i{transform:rotate(0)}

@media (min-width:640px){
  .nav{gap:24px}
  .nav a{font-size:12px}
  .gad{width:65.5vw}
  .hr p{font-size:14px}
  .join{font-size:16px}
  .join .c{width:40px;height:40px}
  .label{font-size:12px}
  .ah{font-size:36px;line-height:.9}
  .letters{font-size:14px}
  .fh{font-size:24px}
  .grid{gap:8px}
  .ft img{width:48px;height:48px}
}
@media (min-width:768px){
  .hero{padding:24px}
  .frame{border-radius:2rem}
  .nav{border-radius:0 0 24px 24px;padding:8px 32px;gap:48px}
  .nav a{font-size:14px;line-height:20px}
  .hc{padding:0 32px 32px;gap:24px}
  .hh{grid-column:span 8}
  .hr{grid-column:span 4;padding-bottom:12px}
  .gad{width:60vw}
  .hr p{font-size:16px}
  .about{padding:24px}
  .acard{border-radius:2rem;padding:112px 32px}
  .ah{font-size:48px}
  .letters{font-size:16px}
  .features{padding:112px 24px}
  .fh{font-size:30px;margin-bottom:64px}
  .grid{grid-template-columns:repeat(2,1fr);gap:4px}
  .fc{min-height:420px}
}
@media (min-width:1024px){
  .nav{gap:56px}
  .gad{width:54.6vw}
  .ah{font-size:60px}
  .fh{font-size:36px}
  .grid{grid-template-columns:repeat(4,1fr);height:480px}
  .fc{min-height:0}
}
@media (min-width:1280px){.gad{width:52vw}.ah{font-size:72px}}
@media (min-width:1536px){.gad{width:54.6vw}}
@media (prefers-reduced-motion:reduce){
  .up,.pw,.fc{transition:none;opacity:1;transform:none}
  .gad .ring{animation:none;stroke-dashoffset:0}.gad .orb{animation:none;opacity:1}
}
</style>
</head>
<body>
<section class="hero">
  <div class="frame">
    <video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_170732_8a9ccda6-5cff-4628-b164-059c500a2b41.mp4"></video>
    <div class="noise-overlay"></div>
    <div class="shade"></div>
    <nav class="nav">
      <a href="#about" data-t="n1">Our story</a>
      <a href="#about" data-t="n2">Collective</a>
      <a href="#features" data-t="n3">Workshops</a>
      <a href="#features" data-t="n4">Programs</a>
      <a href="https://t.me/smirnovarturr" target="_blank" rel="noopener" data-t="n5">Inquiries</a>
    </nav>
    <div class="hc">
      <h1 class="hh pull"><span class="pw"><a class="gad" href="#" aria-label="g.a.d.">
        <svg viewBox="0 0 355 110" role="img" aria-label="g.a.d.">
          <text x="2" y="80" font-family="Unbounded, sans-serif" font-weight="600" font-size="92" textLength="276" lengthAdjust="spacing" fill="currentColor">g.a.d.</text>
          <circle class="ring" cx="322" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 322 30)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
          <circle class="orb" cx="322" cy="8" r="5" fill="currentColor"/>
        </svg></a></span></h1>
      <div class="hr">
        <p class="up" style="transition-delay:.5s" data-t="desc">g.a.d. is a worldwide network of visual artists, filmmakers and storytellers bound not by place, status or labels but by passion and hunger to unlock potential through our unique perspectives.</p>
        <a class="join up" style="transition-delay:.7s" href="https://t.me/smirnovarturr" target="_blank" rel="noopener"><span data-t="join">Join the lab</span><span class="c"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span></a>
      </div>
    </div>
  </div>
</section>

<section class="about" id="about">
  <div class="acard">
    <div class="label" data-t="label">Visual arts</div>
    <h2 class="ah pull" id="ah"></h2>
    <p class="letters" id="letters"></p>
  </div>
</section>

<section class="features" id="features">
  <div class="bg-noise"></div>
  <h2 class="fh pull" id="fh"></h2>
  <div class="grid" id="grid">
    <div class="fc">
      <video autoplay loop muted playsinline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260406_133058_0504132a-0cf3-4450-a370-8ea3b05c95d4.mp4"></video>
      <div class="cap" data-t="canvas">Your creative canvas.</div>
    </div>
  </div>
</section>

<script>
(() => {
const RU = true;
const ICON = id => 'https://images.higgs.ai/?default=1&output=webp&url=' +
  encodeURIComponent('https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_' + id + '.png') + '&w=1280&q=85';
const T = RU ? {
  about: [['Я — g.a.d.,', ''], ['режиссёр-самоучка.', 'serif'], ['Работаю с цветокоррекцией, визуальными эффектами и драматургией.', '']],
  letters: 'Работаю с продакшенами, которые снимают кино и сериалы, и с небольшими студиями, которым нужен ясный визуальный голос. Вместе мы делаем фильмы, промо и титры, которые остаются в памяти.',
  fh: [['Студийные процессы для смелых авторов.', ''], ['Всё ради замысла. Всё на силе искусства.', 'g']],
  cards: [
    ['171918_4a5edc79-d78f-4637-ac8b-53c43c220606', 'Раскадровка проекта.', ['Списки кадров и раскадровки в одном месте', 'Референсы настроения у каждой сцены', 'Заметки по таймлайну видны всей команде', 'Выгрузка в PDF для питча']],
    ['171741_ed9845ab-f5b2-4018-8ce7-07cc01823522', 'Умные разборы.', ['ИИ разбирает темп, цвет и композицию кадра', 'Творческие заметки: принять или пропустить', 'Работает с вашими программами монтажа']],
    ['171809_f56666dc-c099-4778-ad82-9ad4f209567b', 'Капсула погружения.', ['Глушит уведомления, пока вы работаете', 'Фоновые звуки для глубокой работы', 'Сверяется с вашим расписанием']]
  ],
  more: 'Подробнее'
} : {
  about: [['I am g.a.d.,', ''], ['a self-taught director.', 'serif'], ['I have skills in color grading, visual effects, and narrative design.', '']],
  letters: 'I work with production houses that craft cinema and series, and with small studios that need a clear visual voice. Together we make films, promos and title sequences that stay with people.',
  fh: [['Studio-grade workflows for visionary creators.', ''], ['Built for pure vision. Powered by art.', 'g']],
  cards: [
    ['171918_4a5edc79-d78f-4637-ac8b-53c43c220606', 'Project Storyboard.', ['Shot lists and boards in one place', 'Mood references pinned to every scene', 'Timeline notes shared with the whole crew', 'Export to PDF for your pitch deck']],
    ['171741_ed9845ab-f5b2-4018-8ce7-07cc01823522', 'Smart Critiques.', ['AI analysis of pacing, color and framing', 'Creative notes you can accept or skip', 'Integrates with the editing tools you use']],
    ['171809_f56666dc-c099-4778-ad82-9ad4f209567b', 'Immersion Capsule.', ['Silences notifications while you create', 'Ambient soundscapes for deep focus', 'Syncs with your schedule']]
  ],
  more: 'Learn more'
};
if (RU) {
  const TR = { n1: 'Наша история', n2: 'Коллектив', n3: 'Мастерские', n4: 'Программы', n5: 'Заявки', join: 'Присоединиться', label: 'Визуальное искусство',
    desc: 'g.a.d. — сеть художников, режиссёров и рассказчиков по всему миру. Нас связывают не место, статус или ярлыки, а страсть и желание раскрыть потенциал через собственный взгляд.',
    canvas: 'Ваш творческий холст.' };
  document.documentElement.lang = 'ru';
  document.documentElement.classList.add('ru');
  document.title = 'g.a.d. — творческая студия';
  document.head.insertAdjacentHTML('beforeend', '<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700;800&family=Cormorant:ital,wght@1,500&display=swap" rel="stylesheet">');
  document.querySelectorAll('[data-t]').forEach(el => { const t = TR[el.dataset.t]; if (t) el.textContent = t; });
}
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

// WordsPullUpMultiStyle: каждое слово своим span, задержка 0.08 c на слово
const pull = (el, segs, br) => {
  let n = 0;
  el.innerHTML = segs.map(([text, cls]) => text.split(' ').map(w => `<span class="pw ${cls}" style="transition-delay:${(n++ * 0.08).toFixed(2)}s">${esc(w)}</span>`).join(' ')).join(br ? '<span class="br"></span>' : ' ');
};
pull($('ah'), T.about);
pull($('fh'), T.fh, true);

// карточки возможностей
const CHECK = '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const ARROW = '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
$('grid').insertAdjacentHTML('beforeend', T.cards.map((c, i) => `<div class="fc ft"><img alt="" src="${ICON(c[0])}"><h3>${c[1]}<span>0${i + 1}</span></h3>` +
  `<ul>${c[2].map(x => `<li>${CHECK}<span>${x}</span></li>`).join('')}</ul><a class="more" href="#">${T.more}${ARROW}</a></div>`).join(''));
$('grid').querySelectorAll('.fc').forEach((c, i) => { c.style.transitionDelay = (i * 0.15) + 's'; });

// появление один раз
const once = (sel, opts) => {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), opts);
  document.querySelectorAll(sel).forEach(el => io.observe(el));
};
once('.pull, .up');
once('#grid', { rootMargin: '0px 0px -100px 0px' });

// текст по буквам от прокрутки: offset ['start 0.8', 'end 0.2'], окно [i/n - 0.1, i/n + 0.05]
const lt = $('letters');
lt.innerHTML = T.letters.split(' ').map(w => '<span class="w">' + [...w].map(c => '<span class="ch">' + esc(c) + '</span>').join('') + '</span>').join(' ');
const chars = [...lt.querySelectorAll('.ch')];
let lastY = null;
function frame() {
  if (scrollY !== lastY) {
    lastY = scrollY;
    const vh = innerHeight, r = lt.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (vh * 0.8 - r.top) / (r.height + vh * 0.6)));
    const n = chars.length;
    chars.forEach((c, i) => {
      const a = i / n - 0.1, b = i / n + 0.05;
      const o = 0.2 + 0.8 * Math.min(1, Math.max(0, (p - a) / (b - a)));
      if (c._o !== o) { c._o = o; c.style.opacity = o; }
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
