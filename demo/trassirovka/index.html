<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>проба · трассировка пути</title>
<style>
	html,body{margin:0;height:100%;background:#0a0b0d;overflow:hidden}
	canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
	#raster{z-index:1;clip-path:inset(0 50% 0 0)}
	#pt{z-index:2;clip-path:inset(0 0 0 50%)}
	#split{position:fixed;left:50%;top:0;bottom:0;width:1px;background:#fff6;z-index:5}
	.t{position:fixed;top:12px;z-index:6;font:11px/1 ui-monospace,monospace;color:#fff9;letter-spacing:.12em}
	#l{left:14px}#r{left:calc(50% + 14px)}#n{right:14px;color:#8ef}
	#err{position:fixed;left:14px;bottom:12px;z-index:9;font:12px/1.4 ui-monospace,monospace;color:#f66;max-width:60ch}
</style>
<canvas id="raster"></canvas>
<canvas id="pt"></canvas>
<div id="split"></div>
<div class="t" id="l">RASTER</div>
<div class="t" id="r">PATH TRACED</div>
<div class="t" id="n">—</div>
<div id="err"></div>
<script type="module" src="./app.js"></script>
